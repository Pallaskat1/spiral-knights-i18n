m.haven_desc = Kota yang damai dan menjadi tempat tinggal para Strangers. Para penyelamat barang \
  ini menawarkan tempat perlindungan bagi Spiral Knights sebagai imbalan atas harta yang mereka \
  peroleh saat menyelidiki Clockworks. Haven juga dihuni oleh banyak snipe, burung kecil bertubuh \
  bulat yang memiliki cara bergerak yang unik.

m.rescue_camp_desc = Kamp Penyelamatan berfungsi sebagai tempat berlindung bagi Spiral Knights yang \
  baru tiba. Tempat ini menyediakan beberapa kenyamanan sederhana serta fasilitas pelatihan untuk \
  mempersiapkan para rekrutan dalam perjalanan mereka menuju Haven.
