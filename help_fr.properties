# Clockworks tab
#...................................................................................................

t.clockworks = Rouages

t.clockworks_1 = Rouages
m.clockworks_1 = Les Rouages sont votre porte d'entr\u00e9e au Core, le noyau du plan\u00e8te! Ils sont remplis \
  d'une vaste diversit\u00e9 de mondes et peupl\u00e9s de monstres et tr\u00e9sors d\u00e9passant votre imagination. M\u00e9\
  fiez-vous, cependant : plus vous vous aventurerez bas, plus formidables et \
  intelligents seront vos ennemis !

m.clockworks_2 = Les profondeurs sous Haven peuvent \u00eatres class\u00e9s en trois niveaux, \
  chacun plus difficile que le pr\u00e9c\u00e9dent. Assurez-vous de vous \u00e9quiper d'une \
  convenablement avant de partir, et souvenez-vous : les plus grands tr\u00e9sors des \
  Rouages se trouvent loin de la surface, proche du Core, donc il faut descendre profond\u00e9ment !

t.tier_1 = Niveau 1

m.tier_1_equip = \u00c9quipement recommand\u00e9: 0-1 \u00e9toile
m.tier_1_monster = Les monstres font des d\u00e9g\u00e2ts de type NORMAL.

t.tier_2 = Niveau 2

m.tier_2_equip = \u00c9quipement recommand\u00e9: 2-3 \u00e9toiles.
m.tier_2_monster = Les monstres poss\u00e8dent des d\u00e9g\u00e2ts de type NORMAL et un autre type de \
  d\u00e9g\u00e2ts sp\u00e9cialis\u00e9s (PER\u00c7ANT, \u00c9L\u00c9MENTAIRE, ou OMBRE).\n\
  Les monstres poss\u00e8dent souvent des statuts. \u00c9quippez des armures avec de la r\u00e9sistance au FEU, GEL, \u00c9LECTROCUTION, ou POISON pour y r\u00e9sister !

t.tier_3 = Niveau 3

m.tier_3_equip = \u00c9quipement recommand\u00e9: 4-5 \u00e9toiles
m.tier_3_monster = Les monstres peuvent utiliser des attaques infligeant uniquement des d\u00e9g\u00e2ts sp\u00e9cialis\u00e9s (PER\u00c7ANT, \u00c9L\u00c9MENTAIRE, ou OMBRE). \u00c9\
  quipez-vous comme il faut !

