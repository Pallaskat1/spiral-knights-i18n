m.battle_arena_desc = Dizem que as Arenas de Batalha s\u00e3o observadas por incont\u00e1veis almas errantes em busca de divers\u00e3o. Elas oferecem desafios cada vez maiores aos guerreiros corajosos que desejam conquistar o tesouro do Rei da Arena.

m.scarlet_fortress_desc = Batizada por causa de suas tape\u00e7arias escarlates vibrantes, a Fortaleza Escarlate \u00e9 uma massa desconstru\u00edda de um castelo esquecido, vagando sem fim pelo vazio dos Clockworks. Estranhos fantasmas bestiais assombram seus longos corredores, perseguindo sem descanso aqueles que entram em seu dom\u00ednio.

m.aurora_isles_desc = No alto de ilhas flutuantes misteriosas, ru\u00ednas castigadas pelo sol se desfazem sob um c\u00e9u falso. Embora a grama verde e o ar fresco pare\u00e7am reais, o ranger constante da m\u00e1quina logo abaixo da superf\u00edcie \u00e9 um lembrete cont\u00ednuo do esqueleto mec\u00e2nico deste mundo.

m.dark_city_desc = Esta cidade, antes movimentada e vinda de um mundo avan\u00e7ado, agora abriga incont\u00e1veis criaturas do Submundo. Sob a luz da lua, elas queimam seus sigilos sombrios no ch\u00e3o, convocando mais de seus aliados por raz\u00f5es ainda desconhecidas.

m.concrete_jungle_desc = Esta cidade h\u00e1 muito esquecida foi retomada pela natureza e depois pelas legi\u00f5es dos mortos-vivos. Agora \u00e9 um covil vil de doen\u00e7a e corrup\u00e7\u00e3o, lar de todo tipo de monstro t\u00f3xico, vivo ou n\u00e3o.

m.treasure_vault_desc = Salas de Tesouro cont\u00eam vastas quantidades de blocos de tesouro, prontos para serem saqueados por quem tiver os meios certos para passar pelas in\u00fameras portas trancadas. Algumas s\u00e3o fortemente guardadas, ent\u00e3o fique sempre atento a armadilhas ocultas e monstros.

m.graveyard_desc = Um cemit\u00e9rio \u00e9 um lugar terr\u00edvel que existe ao mesmo tempo no mundo dos vivos e no dos mortos. Embora esconda tesouros secretos em seus cantos escuros, ele tamb\u00e9m abriga horrores antigos que desejam devorar todos que entram. Depois de entrar, \u00e9 recomend\u00e1vel encontrar uma sa\u00edda o mais r\u00e1pido poss\u00edvel.

m.jigsaw_valley_desc = Parecendo um conjunto de ilhas celestes arrancadas e remontadas como se fossem um quebra-cabe\u00e7a, este mundo \u00e0s vezes \u00e9 confuso de percorrer. Infelizmente, ele tamb\u00e9m parece abrigar uma horda de slimes e construtos sem mente, que n\u00e3o se incomodam nem um pouco com sua disposi\u00e7\u00e3o ca\u00f3tica.

m.starlight_cradle_desc = Sob um c\u00e9u iluminado pela lua, ilhas azuladas flutuam em um mar de estrelas. Essas ilhas abrigam criaturas mais do que dispostas a se esgueirar sobre aqueles que sucumbem \u00e0 can\u00e7\u00e3o de ninar sem fim deste mundo.

m.firestorm_citadel_desc = Tudo o que resta do outrora grandioso reino de Almire, a Cidadela Firestorm abriga legi\u00f5es de almas perdidas ardendo nas chamas de uma guerra esquecida, reacendidas sem cessar pelo esp\u00edrito distorcido de seu antigo senhor.

m.vanaduke_desc = Dentro da sala do trono da cidadela, Lorde Vanaduke aguarda para montar uma defesa final contra qualquer um que consiga atravessar as defesas de sua fortaleza.

m.training_grounds_desc = Esta parte abandonada dos Clockworks foi modificada para treinar novos recrutas na nobre arte de n\u00e3o morrer enquanto ainda t\u00eam o resto do mundo para explorar.

m.rc_bomb_training_desc = Logo al\u00e9m do per\u00edmetro do Acampamento de Resgate h\u00e1 um campo de equipamentos arruinados e defesas destru\u00eddas. Os cavaleiros sobreviventes abandonaram esta \u00e1rea ap\u00f3s uma s\u00e9rie de ataques mortais durante a noite.

m.ancient_generator_desc = Sob o Acampamento de Resgate existe uma fonte de energia colossal, capaz de alimentar o elevador para Haven se ao menos pudesse ser aproveitada.

m.final_test_2_desc = O caminho para Haven fica suspenso bem acima de um abismo mec\u00e2nico perigoso. Prepare-se: \u00e9 certo que o perigo espreita em cada canto!

m.lobby_desc = Um lobby antes da entrada de um portal, onde os cavaleiros podem tra\u00e7ar estrat\u00e9gias e se equipar para a aventura que os aguarda.

m.terminal_desc = Um n\u00edvel em que os viajantes podem retornar \u00e0 cidade em seguran\u00e7a ou seguir ainda mais fundo pelas profundezas dos Clockworks.

m.terminal_core_desc = Um pequeno terminal nas profundezas mais escuras dos Clockworks, com vista para o colossal cora\u00e7\u00e3o pulsante do mundo.

m.terminal_return_desc = Um n\u00edvel onde viajantes podem retornar com seguran\u00e7a \u00e0 cidade acima.

m.moorcroft_desc = Uma antiga mans\u00e3o misteriosa, lar de v\u00e1rios esp\u00edritos inquietos. A Mans\u00e3o Moorcroft parece funcionar como uma parada para esp\u00edritos em viagem; ainda assim, nenhum deles parece realmente estar indo a lugar algum.

m.emberlight_desc = Uma vila de exilados, Emberlight serve de ref\u00fagio para gremlins banidos da Grande Col\u00f4nia. Agora eles vivem vidas humildes, vendendo mercadorias e fazendo reparos para viajantes de passagem, sempre temendo que um dia o rei gremlin Tinkinzar decida extermin\u00e1-los de uma vez por todas.

m.royal_jelly_desc = O Pal\u00e1cio da Geleia Real \u00e9 um castelo antigo dominado por uma legi\u00e3o de monstros slime. N\u00e3o est\u00e1 claro qual \u00e9 o prop\u00f3sito do castelo, embora haja rumores de que ele abriga uma Geleia Real, dita pertencer \u00e0 nobreza dos reinos slime. Se isso for verdade, ent\u00e3o o castelo provavelmente existe apenas para servir \u00e0 Geleia Real.

m.gloaming_wildwoods_desc = Recomenda-se que recrutas dos Spiral Knights evitem esta floresta escura e enevoada at\u00e9 estarem mais experientes com os perigos dos Clockworks. Gloaming Wildwoods abriga matilhas de feras ferozes, e a pior de todas \u00e9 o m\u00edtico Snarbolax. Chamado de 'uma sombra viva', o Snarbolax prefere o sabor de presas que passaram pelo terror antes da morte e frequentemente atormenta suas v\u00edtimas sem piedade antes de desferir o golpe final.

m.ironclaw_munitions_factory_desc = A F\u00e1brica de Muni\u00e7\u00f5es Ironclaw \u00e9 uma f\u00e1brica de armas operada por gremlins, especializada na produ\u00e7\u00e3o de explosivos de alto calibre. Informa\u00e7\u00f5es revelaram que ela est\u00e1 desenvolvendo uma arma secreta conhecida como 'Projeto Roarmulus', criada com o \u00fanico prop\u00f3sito de destruir Haven!

m.candlestick_keep.desc = Tudo o que resta da Academia Owlite, o Candlestick Keep agora \u00e9 uma sombra sombria da outrora grandiosa escola de artes m\u00e1gicas. Os cavaleiros que conseguiram sair desta fortaleza amaldi\u00e7oada s\u00f3 t\u00eam um conselho a dar: 'permane\u00e7a na luz'.

m.cogmaster_castle_desc = Chamando todos os cavaleiros! O QG Spiral lan\u00e7ou um ataque em larga escala contra o castelo fortemente fortificado do Warmaster Seerus, um gremlin trai\u00e7oeiro da Ordem Carmesim. Todos os ataques contra suas muralhas resistentes e sua artilharia devastadora falharam \u2014 o QG Spiral precisa de VOC\u00ca para virar a mar\u00e9 da batalha e levar a luta at\u00e9 o pr\u00f3prio Warmaster!

m.super_brawl_desc = Uma arena de Super Brawl.

