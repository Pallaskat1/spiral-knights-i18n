t.vip_tos = Acordo de Associa\u00e7\u00e3o
m.vip_tos = <html><font color='white'><font size=3>Este <b>Acordo de Associa\u00e7\u00e3o ao Clube C.U.B.E.</b> constitui um documento legal vinculante entre o abaixo-assinado (o "cavaleiro"), a Golden Casino Holdings LLC (o "Cassino") e toda a comunidade slime (os "slimes").<br><br> </font> <font size=5><b>I. Termos e Condi\u00e7\u00f5es Gerais</b></font><br> <font size=4> &nbsp;&nbsp;1. A associa\u00e7\u00e3o ao Clube C.U.B.E. destina-se apenas ao uso pessoal e n\u00e3o pode ser transferida para outros cavaleiros, Devilites ou outras criaturas dos Clockworks.<br> &nbsp;&nbsp;2. \u00c9 proibido vender acesso \u00e0 sua capacidade de girar a roda.<br> &nbsp;&nbsp;3. Mantenha bra\u00e7os e pernas dentro do Cassino em todos os momentos.<br> &nbsp;&nbsp;4. Por favor, n\u00e3o jogue itens no core.<br> </font> <font size=5><b>II. Descri\u00e7\u00e3o dos Benef\u00edcios</b></font><br> <font size=4> &nbsp;&nbsp;1. Os benef\u00edcios s\u00e3o variados e podem ser alterados a qualquer momento.<br> &nbsp;&nbsp;2. O acesso ao lounge n\u00e3o \u00e9 garantido e est\u00e1 sujeito \u00e0 disponibilidade.<br> &nbsp;&nbsp;3. Buffalo Wings n\u00e3o est\u00e3o inclu\u00eddas.<br> &nbsp;&nbsp;4. Todas as disputas ser\u00e3o arbitradas pelo gerente do sal\u00e3o do Cassino, e todas as decis\u00f5es s\u00e3o finais.<br> </font> <font size=4><b>III. Ganhos, Pagamentos e Taxas</b></font><br> <font size=3> &nbsp;&nbsp;1. Os ganhos podem ser pagos em Moedas de Slime Dourado, a crit\u00e9rio do gerente do sal\u00e3o do Cassino.<br> &nbsp;&nbsp;2. Nenhuma taxa adicional \u00e9 cobrada neste momento.<br> </font> <font size=4><b>IV. Recompensas Promocionais</b></font><br> <font size=3> &nbsp;&nbsp;1. Promo\u00e7\u00f5es de venda: pre\u00e7os reduzidos para membros, se houver, ser\u00e3o exibidos claramente na interface da loja.<br> &nbsp;&nbsp;2. A Loja de Presentes se reserva o direito de modificar, alterar, descontinuar ou encerrar essas promo\u00e7\u00f5es a qualquer momento, por qualquer motivo, sem aviso pr\u00e9vio aos usu\u00e1rios finais. Sem choradeira.<br> </font> <font size=3><b>V. Restri\u00e7\u00f5es e Condi\u00e7\u00f5es de Uso</b></font><br> <font size=2> &nbsp;&nbsp;1. Como condi\u00e7\u00e3o para usar os servi\u00e7os do clube, voc\u00ea concorda em n\u00e3o utilizar as instala\u00e7\u00f5es ou interfaces do clube para qualquer finalidade il\u00edcita ou proibida pelos termos, condi\u00e7\u00f5es e avisos inclu\u00eddos neste Acordo de Associa\u00e7\u00e3o, em qualquer Contrato de Licen\u00e7a relevante, ou em qualquer coisa geralmente considerada de mau gosto pelos slimes.<br> &nbsp;&nbsp;2. Os Termos de Servi\u00e7o de Spiral Knights prevalecem sobre estes termos quando aplic\u00e1vel.<br> &nbsp;&nbsp;3. O cavaleiro concorda com todos os termos e condi\u00e7\u00f5es enumerados aqui, e tamb\u00e9m com aqueles que n\u00e3o est\u00e3o enumerados aqui. Os slimes podem adicionar novas condi\u00e7\u00f5es a qualquer momento, exigindo conformidade retroativa total.<br> </font> <font size=3><b>VI. Encerramento da Conta</b></font><br> <font size=2> &nbsp;&nbsp;1. O Cassino tem o direito de encerrar sua associa\u00e7\u00e3o por violar quaisquer termos ou condi\u00e7\u00f5es, precisos ou vagos, enumerados aqui ou criados no momento da infra\u00e7\u00e3o. Voc\u00ea foi avisado.<br> </font> <font size=3><b>VII. Isen\u00e7\u00e3o de Garantia; Limita\u00e7\u00e3o de Responsabilidade</b></font><br> <font size=2> &nbsp;&nbsp;1. O uso do Cassino \u00e9 por sua conta e risco. Clicou, comprou.<br> &nbsp;&nbsp;2. Nem o Cassino nem a comunidade slime em geral ser\u00e3o respons\u00e1veis, em contrato, ato il\u00edcito, neglig\u00eancia ou de outra forma, por qualquer perda ou dano decorrente de ou de qualquer modo relacionado ao seu uso do Cassino.<br> </font> <font size=3><b>VIII. Geral</b></font><br> <font size=2> &nbsp;&nbsp;1. Este Acordo de Associa\u00e7\u00e3o \u00e9 regido pelas leis de Haven e pelas leis de Cradle. Voc\u00ea, por meio deste, consente irrevogavelmente em se submeter \u00e0 jurisdi\u00e7\u00e3o dos Tribunais de Cradle e Haven.<br> &nbsp;&nbsp;2. Este acordo foi escrito por alguns slimes com pouco dom\u00ednio da linguagem jur\u00eddica al\u00e9m do que viram assistindo A Few Good Men. Assim, quaisquer partes que n\u00e3o fa\u00e7am sentido normalmente s\u00e3o culpa do outro cara. Quaisquer partes boas que tenham sobrado continuam boas. Elas n\u00e3o estragam s\u00f3 porque n\u00f3s erramos feio nas outras partes, ainda mais ruins. Existe uma palavra para esse conceito, e o fato de n\u00e3o sabermos qual \u00e9 faz parte das partes ruins.<br> </font> </font> </html>

