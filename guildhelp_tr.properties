t.hall = Lonca Evi
t.guild_hall_header = Lonca Evi
m.guild_hall_info = Lonca Evi, herhangi bir Spiral Knights loncas\u0131n\u0131n merkez \u00FCss\u00FCd\u00FCr. Lonca \u00FCyeleri burada dinlenebilir, gelecekteki g\u00F6revleri planlayabilir ve kullan\u0131mlar\u0131na sunulan \u00E7e\u015Fitli olanaklardan yararlanabilirler. Son derece \u00F6zelle\u015Ftirilebilir bir yap\u0131ya sahip olan Lonca Evi, her \u00F6l\u00E7ekten loncaya uyacak \u015Fekilde geni\u015Fletilebilir. Ayr\u0131ca, \u00E7e\u015Fitli \u00F6zg\u00FCn mobilyalar ve oda tipleriyle donat\u0131labilir; bu sayede arkada\u015Flar\u0131n\u0131zla birlikte \u00E7al\u0131\u015Farak Lonca Evinizi, loncan\u0131z\u0131n ger\u00E7ek bir yans\u0131mas\u0131 haline getirebilirsiniz! \n \
Bir Lonca Evi ilk a\u00E7\u0131ld\u0131\u011F\u0131nda iki odadan olu\u015Fur: bir lobi ve Komuta Konsolu odas\u0131. Daha fazla alana ihtiya\u00E7 duyan loncalar, evlerinin temel boyutunu b\u00FCy\u00FCtmek i\u00E7in geni\u015Fletmeler sat\u0131n alabilirler. Bu geni\u015Fletmelere, Tasar\u0131m Modu'ndayken Komuta Konsolu \u00FCzerinden ula\u015F\u0131labilir.\n \
Evlerindeki kullan\u0131labilir alan\u0131 geni\u015Fleten loncalar, bu alan\u0131 Birdsong Emporium'dan sat\u0131n al\u0131nabilen \u00E7e\u015Fitli odalarla doldurabilirler. Bu odalar, mobilya yerle\u015Ftirmek i\u00E7in bo\u015F bir alan olabilece\u011Fi gibi; simya terminalleri, d\u00FCkk\u00E2nlar ve daha pek \u00E7ok farkl\u0131 lonca olana\u011F\u0131n\u0131 da bar\u0131nd\u0131rabilir!\n \
Lonca Evlerinin bak\u0131m\u0131 b\u00FCy\u00FCk miktarlarda kaynak gerektirir. Bu gereksinim, Crown cinsinden haftal\u0131k bir bak\u0131m maliyetiyle ifade edilir. Bir Lonca Evi geni\u015Fletildik\u00E7e bu maliyet de artar; dolay\u0131s\u0131yla, t\u00FCm masraflar\u0131 kar\u015F\u0131layabilmek i\u00E7in Lonca Hazinenizde yeterli miktarda Crown bulundu\u011Fundan emin olun!

t.treasury = Hazine
t.treasury_header = Lonca Hazinesi
m.treasury_info = Lonca Hazinesi, loncaya ait olan t\u00FCm e\u015Fyalar\u0131 ve Crown'lar\u0131 bar\u0131nd\u0131r\u0131r. Bir mobilyan\u0131n Lonca Evi'ne yerle\u015Ftirilebilmesi i\u00E7in \u00F6ncelikle Hazine'ye eklenmesi gerekir. Yeni odalar\u0131n maliyetleri, Birdsong Emporium'dan al\u0131nan e\u015Fyalar ve haftal\u0131k bak\u0131m masraflar\u0131 Hazine'den kar\u015F\u0131lan\u0131r; bu nedenle lonca \u00FCyeleri, Lonca Hazinesi'ni s\u00FCrekli olarak Crown ile dolu tutmaya dikkat etmelidir!\n \
UYARI: Lonca Hazinesi'ne eklenen herhangi bir \u015Fey, lonca lideri de dahil olmak \u00FCzere hi\u00E7bir lonca \u00FCyesi taraf\u0131ndan geri al\u0131namaz. E\u015Fyalar veya Crown'lar Lonca Hazinesi'ne eklendi\u011Fi andan itibaren kal\u0131c\u0131 olarak loncan\u0131n mal\u0131 haline gelir. Bunun hi\u00E7bir istisnas\u0131 yoktur.
l.treasury_console = Lonca Hazinesi'ne Komuta Konsolu'ndan eri\u015Filebilir. | action | console


m.emporium_info = Birdsong Emporium, \u00FCst d\u00FCzey lonca \u00FCyelerinin, Lonca Hazinesi'ndeki fonlar\u0131 kullanarak lonca i\u00E7in e\u015Fyalar sat\u0131n almas\u0131na olanak tan\u0131r. Bu e\u015Fyalar aras\u0131nda \u00E7e\u015Fitli Lonca Evi mobilyalar\u0131 ve geli\u015Ftirmeleri bulunur. Sat\u0131n al\u0131nan e\u015Fyalar do\u011Frudan Lonca Hazinesi'ne aktar\u0131l\u0131r ve bu nedenle loncadan hi\u00E7bir \u015Fekilde \u00E7\u0131kar\u0131lamaz.\n \
Mobilyalar farkl\u0131 t\u00FCr ve boyutlarda bulunur; Lonca Evi'nizdeki oda ve koridorlar\u0131 dekore ederek oraya daha \u00E7ok bir "ev" havas\u0131 katman\u0131z\u0131 sa\u011Flar. Hatta baz\u0131 mobilyalar, etkinle\u015Ftirildiklerinde \u00F6zel efektler sergiler! Lonca Hazinenizde bulunan t\u00FCm mobilyalar, Tasar\u0131m Modu kullan\u0131larak Lonca Evi'ne yerle\u015Ftirilebilir.\n \
Birdsong Emporium, ayr\u0131ca loncan\u0131z\u0131n maksimum \u00FCye say\u0131s\u0131n\u0131 art\u0131rmak gibi \u00F6zellikler i\u00E7eren "Lonca Y\u00FCkseltmeleri"ni sat\u0131n alabilece\u011Finiz yerdir.\n \
Bir Lonca Evi, eklemelerle geni\u015Fledik\u00E7e Birdsong Emporium katalo\u011Funda bulunan \u00FCr\u00FCn yelpazesi de geni\u015Fler. Neler eklendi\u011Fini g\u00F6rmek i\u00E7in s\u0131k s\u0131k kontrol etmeyi unutmay\u0131n!
l.emporium_console = Birdsong Emporium ve Tasar\u0131m Modu'na Komuta Konsolu'ndan eri\u015Filebilir. | action | console

t.storage = Depo
t.storage_header = Lonca Deposu
m.storage_info = Lonca Deposu, topluluk odakl\u0131 bir e\u015Fya bankas\u0131 i\u015Flevi g\u00F6r\u00FCr. Uygun r\u00FCtbeye sahip lonca \u00FCyeleri, Depoya diledikleri gibi ekipman veya e\u015Fya ekleyebilir ya da buradan e\u015Fya alabilirler. Bu, lonca \u00FCyeleri aras\u0131nda kaynak payla\u015Fmak veya yeni kat\u0131lan \u00FCyelere destek olmak i\u00E7in harika bir yoldur!\n \
UYARI: Lonca Deposu'na yerle\u015Ftirilen e\u015Fyalar, depoya eri\u015Fimi olan herhangi bir lonca \u00FCyesi taraf\u0131ndan al\u0131nabilir. Kendinizde kalmas\u0131n\u0131 istedi\u011Finiz e\u015Fyalar\u0131 Lonca Deposu'na koymay\u0131n!
l.storage_console = Lonca Deposu'na Komuta Konsolu'ndan eri\u015Filebilir. | action | console

t.design = Tasar\u0131m Modu
t.design_header = Tasar\u0131m Modu
m.design_info = Tasar\u0131m Modu, yeterli r\u00FCtbeye sahip bir lonca \u00FCyesinin, Lonca Evi'ndeki mobilyalar\u0131 ve di\u011Fer altyap\u0131 \u00F6\u011Felerini yeniden d\u00FCzenlemesine olanak tan\u0131r. Tasar\u0131m Modu'na ge\u00E7ildi\u011Finde, mobilya \u00F6\u011Feleri t\u0131pk\u0131 bir Alt\u0131n Anahtar veya A\u011F\u0131r Heykel gibi yerden al\u0131n\u0131p ba\u015Fka bir yere yerle\u015Ftirilebilir; ayr\u0131ca bu \u00F6\u011Feler ta\u015F\u0131n\u0131rken varsay\u0131lan olarak fare tekerle\u011Fi kullan\u0131larak d\u00F6nd\u00FCr\u00FClebilir. D\u00FCzenlemelerinizden memnun kald\u0131\u011F\u0131n\u0131zda, Komuta Konsolu \u00FCzerinden de\u011Fi\u015Fikliklerinizi "Yay\u0131mlayabilir" ve bunlar\u0131 loncan\u0131zdaki di\u011Fer \u00FCyelerin g\u00F6rmesini sa\u011Flayabilirsiniz.
u.design_wiki = Mevcut mobilyalar\u0131n tam listesine resm\u00EE wiki'mizden ula\u015Fabilirsiniz. | URL | http://wiki.spiralknights.com/Furniture
l.design_console = Tasar\u0131m Modu'na Komuta Konsolu'ndan eri\u015Filebilir. | action | console

t.record = Lonca Ar\u015Fivi
t.record_header = Lonca Ar\u015Fivi
m.record_info = Lonca Ar\u015Fivi; lonca hazinesine yap\u0131lan ba\u011F\u0131\u015Flar, \u00E7e\u015Fitli lonca depolar\u0131na yap\u0131lan giri\u015F-\u00E7\u0131k\u0131\u015F i\u015Flemleri ile lonca \u00FCyelerinin terfi ettirilmesi, loncaya yeni \u00FCyelerin kat\u0131lmas\u0131 veya mevcut \u00FCyelerin ayr\u0131lmas\u0131 gibi, lonca b\u00FCnyesinde yak\u0131n zamanda ger\u00E7ekle\u015Fen \u00F6nemli faaliyetleri kaydeder. Bu kay\u0131tlar, daha \u00FCst kademedeki lonca \u00FCyelerinin, kimlerin loncaya yo\u011Fun ba\u011F\u0131\u015Fta bulundu\u011Funu ya da loncadan \u00E7ok miktarda e\u015Fya ald\u0131\u011F\u0131n\u0131 takip etmelerine ve buna g\u00F6re gerekli ad\u0131mlar\u0131 atmalar\u0131na olanak tan\u0131r.
l.record_console = Lonca Ar\u015Fivi'ne Komuta Konsolu'ndan eri\u015Filebilir. | action | console
