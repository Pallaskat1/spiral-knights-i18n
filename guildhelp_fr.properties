t.hall = Si\u00e8ge de Guilde
t.guild_hall_header = Si\u00e8ge de Guilde
m.guild_hall_info = Le Si\u00e8ge de Guilde est le syst\u00e8me nerveux pour toutes les guildes des Spiral \
  Knights. Ici, les membres de la guilde peuvent se reposer, planifier les missions, \
  et prendre avantage des fonctions disponibles du Si\u00e8ge de Guilde. On peut \
  modifier et agrandir le Si\u00e8ge de Guilde - selon vos ordres ! Le si\u00e8ge peut \
  contenir une grande vari\u00e9t\u00e9 de meubles et de salles uniques, alors coordonnez-vous avec \
  vos amis et faites de votre Si\u00e8ge de Guilde un miroir de votre \u00Ee2me ! \n\
  \u00c0 la premi\u00e8re ouverture d'un Si\u00e8ge de Guilde, il y a deux salles : un lobby et \
  la salle avec la Console de Commande. Les guildes d\u00e9sirant plus d'espace \u00e0 customiser \
  peuvent acheter des agrandissements pour agrandir les dimensions de leur si\u00e8ge de \
  guilde. Ces customisations sont disponibles dans la Console de Commande dans le Mode Conception.\n\
  Les guildes qui ont agrandi leurs Si\u00e8ges peuvent remplir cet espace avec une vari\u00e9t\u00e9 des salles diff\u00e9\
  rentes, disponibles \u00e0 l'Emporium Birdsong. Ces salles peuvent \u00eatre simples et \
  vides, parfaites \u00e0 d\u00e9corer avec des meubles, ou peuvent contenir des services sp\u00e9\
  cialis\u00e9s, comme un terminal d'alchimie, des boutiques, et plus encore ! \n\
  Les Si\u00e8ges de Guilde n\u00e9cessitent une grande quantit\u00e9 de ressources \u00e0 maintenir, notamment un co\u00fbt \
  pour l'entretien en Crowns. Au fur et \u00e0 mesure qu'un Si\u00e8ge de Guilde acquiert des \
  agrandissements et des salles, le co\u00fbt augmentera, alors assurez-vous qu'il y ait \
  assez de Crowns dans votre Tr\u00e9sorerie de la guilde pour couvrir les frais !

t.treasury = Tr\u00e9sorerie
t.treasury_header = Tr\u00e9sorerie de la guilde
m.treasury_info = La tr\u00e9sorerie de la guilde contient tous les objets et crowns poss\u00e9d\u00e9\
  s collectivement par la guilde. Afin d'\u00eatre plac\u00e9 dans un Si\u00e8ge de Guilde, les \
  meubles doivent d'abord \u00eatre ajout\u00e9s \u00e0 la tr\u00e9sorerie. Les co\u00fbts des \
  nouvelles salles, des objets de l'Emporium Birdsong, et les frais d'entretien hebdomadaire \
  sont aussi pay\u00e9s par la tr\u00e9sorerie, les membres de la guildent devront faire preuve de \
  g\u00e9n\u00e9rosit\u00e9 pour la garder remplie de crowns !\n\
  AVERTISSMENT : Ce qui est ajout\u00e9 \u00e0 la tr\u00e9sorerie ne peut jamais \u00eatre enlev\u00e9, pas m\u00eame par le ma\u00ee\
  tre de la guilde. En ajoutant des objets ou des crowns \u00e0 la tr\u00e9sorerie, ils deviennent \
  la propri\u00e9t\u00e9 exclusive de la guilde, sans exceptions.
l.treasury_console = Il est possible d'acc\u00e9d\u00e9er \u00e0 la tr\u00e9sorerie de la guilde en utilisant la Console \
  de Commande. |action | console

t.emporium_header = Emporium Birdsong
m.emporium_info = L'Emporium Birdsong permet des membres du rang sup\u00e9rieur d'acheter \
  des objets pour la guilde en utilisant les fonds de la Tr\u00e9sorerie de la guilde. Ces objets \
  incluent une vari\u00e9t\u00e9 de meubles et am\u00e9liorations du Si\u00e8ge de Guilde. Les \
  objets achet\u00e9s sont directement plac\u00e9s dans la Tr\u00e9sorerie de la guilde, ils ne \
  peuvent pas \u00eatre retir\u00e9s de la guilde. Les meubles poss\u00e8dent une vari\u00e9t\u00e9 de \
  types et tailles et sont utilis\u00e9s pour d\u00e9corer vos salles et couloirs de \
  votre Si\u00e8ge de Guilde. Quelques meubles ont aussi des effets sp\u00e9ciaux lorsqu'ils \
  sont activ\u00e9s ! On peut placer tous les meubles dans la Tr\u00e9sorerie de la guilde dans le Si\u00e8\
  ge de la guilde en utilisant le Mode Conception. L'Emporium Birdsong est aussi l'endroit pour \
  acheter des salles pour les nouveaux agrandissements ou pour remplacer les salles existantes \
  avec les nouveaux types et diff\u00e9rences. Lorsque le Si\u00e8ge de Guilde \
  est agrandi en ajoutant des agrandissements, la s\u00e9lection d'objets disponibles dans le \
  catalogue d'Emporium Birdsong s'agrandit aussi. N'oubliez pas de feuilleter le catalogue pour \
  voir les nouveaut\u00e9s!
l.emporium_console = L'Emporium Birdsong et le Mode Conception sont accessibles en utilisant \
  la Console de Commande. | action | console

t.storage = Entreposage
t.storage_header = Entreposage de la guilde
m.storage_info = L'Entreposage de la guilde fonctionne comme un Arsenal partag\u00e9. Les membres \
  de la guilde au rang appropri\u00e9 peuvent ajouter ou enlever des \u00e9quipements ou des objets \
  de l'Entreposage comme ils veulent. C'est une bonne fa\u00e7on de partager des ressources entre \
  les membres de la guilde, ou d'aider des nouveaux membres ! AVERTISSEMENT : Les objets mis dans \
  l'Entreposage de la guilde peuvent \u00eatre enlev\u00e9s par n'importe \
  quel membre de la guilde ayant l'acc\u00e8s aux diff\u00e9rents Entreposages de la guilde. Ne mettez pas d'objets \
  dans l'Entreposage de la guilde si vous voulez les garder pour vous-m\u00eame!
l.storage_console = L'Entreposage de la guilde est accessible en utilisant la Console de \
  commande. |action | console

t.design = Mode Conception
t.design_header = Mode Conception
m.design_info = Le Mode Conception permet un \u00e0 membre de la guilde au rang V\u00e9t\u00e9ran et plus \u00e0 \
  arranger des meubles et d'autres infrastructures dans un Si\u00e8ge de Guilde. Lorsqu'on \
  est dans le Mode Conception, on peut ramasser ou placer des ameublements (de la m\u00eame fa\u00e7con que les Cl\u00e9s d'or ou les \
  Statues lourdes), et changer leurs directions en utilisant la \
  Molette de la souris. Quand vous \u00eates satisfaits de votre disposition, vous pourrez Publier vos \
  changements et les montrer au reste de la guilde avec la Console de Commande.
u.design_wiki = La liste compl\u00e8te de meubles est trouv\u00e9e sur notre wiki officiel. | \
  URL | http://wiki.spiralknights.com/Furniture
l.design_console = Le Mode Conception est accessible en utilisant la Console de Commande. | \
  action | console

t.record = Historique de la guilde
t.record_header = Historique de la guilde
m.record_info = L'historique de la guilde enregistre les activit\u00e9s r\u00e9centes et \
  importantes de la guilde, comme les dons \u00e0 la Tr\u00e9sorerie de la guilde, les d\u00e9p\u00f4\
  ts et retraits des Entreposages de la guilde, et des promotions, des additions, ou les d\u00e9\
  parts des membres de la guilde. Cet historique permet aux membres de rangs sup\u00e9rieurs de \
  suivre ceux et celles qui donnent ou prennent trop de la guilde et d'agir en cons\u00e9quence.
l.record_console = Les Rapports de la guilde sont accessibles en utilisant la Console de \
  commande. | action | console
