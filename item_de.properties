# Token names
#...................................................................................................

f.token_core = Ein Fragment eines seltsamen Materials aus dem Kern des Uhrwerks. Jedes Fragment \
  scheint eine einzigartige Form zu haben, wie Schneeflocken. Diese Fragmente erzielen im \
  Spiral HQ einen hohen Preis, da man hofft, dass sie etwas \u00fcber die Natur des Kerns \
  verraten.

f.token_vanaduke = Eine Siegel des vergessenen K\u00f6nigreichs von Almire. Ein Beweis daf\u00fcr, dass der H\u00fc\
  ter dem ewig lodernden Abgrund, bekannt als die Feuersturm-Zitadelle, gegen\u00fcbertrat.

f.token_jelly = Diese Juwelen werden eigentlich nur von k\u00f6niglichen Glibbern getragen und \
  sind die offizielle W\u00e4hrung des Glibber-K\u00f6nigreiches. Obwohl sie f\u00fcr die Glibber von gro\u00df\
  em Wert sind, verspeisen die meisten anderen Kreaturen sie einfach, denn sie sind ziemlich \
  lecker.

f.token_snarbolax = Ein langer, messerscharfer Zahn, der aus dem Maul des Snarbolax gerissen \
  wurde; ein Andenken, das an den Triumph eines Knights \u00fcber das Monster, das das D\u00fc\
  stere Dickicht heimsucht, erinnert.

f.token_roarmulus = Ein spezieller Schaltkreis, der von Gremlin-Ingenieuren daf\u00fcr \
  entwickelt wurde, sowohl das Bellen, als auch den Biss der Roarmulus Twins zu verbessern.

f.token_primal = Ein kleines St\u00fcckchen des essentiellen Geistes der Natur. Es ist von gro\u00dfem Wert f\u00fc\
  r den Spiral Order. Bringe es zum Marken-H\u00e4ndler im Haven Basar!

f.token_forge = Ein kleines St\u00fcckchen des essentiellen Geistes von Technologie und \
  Fortschritt. Es ist von gro\u00dfem Wert f\u00fcr den Spiral Order. Bringe es zum Marken-H\u00e4ndler im Haven Basar!

f.token_grim = Ein kleines St\u00fcckchen des essentiellen Geistes von Dunkelheit und Verfall. \
  Es ist von gro\u00dfem Wert f\u00fcr den Spiral Order. Bringe es zum Marken-H\u00e4ndler im Haven Basar!

f.token_krogmo = Eine M\u00fcnze, die vom gro\u00dfen King Krogmo an Teilnehmer seines \
  Coliseums vergeben wird. Sie kann beim Belohnungs-Verwalter des Coliseums gegen Preise \
  eingetauscht werden.

f.token_candy = Eine S\u00fc\u00dfigkeit, speziell zur Feier des Dunklen Erntefests. Sie kann \
  auf dem Stadtplatz von Haven gegen verschiedene Kost\u00fcm-Masken getauscht werden.

f.token_cake = Ein St\u00fcck Kuchen, das als Troph\u00e4e f\u00fcr den Sieg \u00fcber eine \
  Horde von Creep Cakes dient. Chefk\u00f6chin Biscotti beteuert, dass diese Troph\u00e4en, \
  genau wie der Vorfall, aufgrund dessen es sie gibt, offiziell niemals existiert haben.

f.token_winter = Ein kleiner Wunschzettel von einem der Kinder aus Emberlight. Sie bescheinigt, \
  dass du ihren Wunsch zum Fest erf\u00fcllt und das Winterfest gerettet hast. Erf\u00fcllt \
  dich das nicht einfach mit Freude?

f.token_winter_wishlist = Diese Winterfest-Wunschliste wurde vor langer Zeit verloren. Darauf \
  stehen warme Laken, die vor der K\u00e4lte sch\u00fctzen. Randolph wird die betreffenden \
  Knights mit einem Stapel davon belohnen. Also bringe sie ihm und verdiene dir daf\u00fcr ein Geschenk.

f.token_page = Eine zerfallende Seite aus einem lange vergessenen Buch aus den Archiven von \
  Moorcroft Manor. Die nicht zu entziffernde Sprache darauf gl\u00fcht schwach im Dunklen, als \
  w\u00fcrde in ihren Worten Macht liegen.

f.token_spirit = Ein unirdisches Brandzeichen auf einer Seele, die von der mysteri\u00f6sen \
  Apocrea in Besitz genommen wurde. Es zu entfernen, erlaubt der Seele der Gefangenschaft im \
  schrecklichen Reich der Apocrea zu entfliehen.

