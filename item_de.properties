f.polar_night_wolf_coat = Ein warmer Mantel, der von in den Polarregionen stationierten Knights \
  bevorzugt wird. Das dicke Fell wird w\u00e4hrend der endlosen Nachtpatrouillen ben\u00f6tigt.

f.polar_day_warden_coat = Eine isolierte Jacke, die einen Knight warm h\u00e4lt, wenn er sich \
  bitterkalten, polaren Winden stellen muss. Die pelzgef\u00fctterten R\u00fcstungsteile machen \
  sie zur idealen Wahl f\u00fcr den Wachdienst am Tag.

f.polar_night_warden_coat = Eine isolierte Jacke, die einen Knight warm h\u00e4lt, wenn er sich \
  bitterkalten, polaren Winden stellen muss. Die pelzgef\u00fctterten R\u00fcstungsteile machen \
  sie zur idealen Wahl f\u00fcr den Wachdienst in der Nacht.

f.polar_twilight_warden_coat = Eine isolierte Jacke, die einen Knight warm h\u00e4lt, wenn er \
  sich bitterkalten, polaren Winden stellen muss. Die pelzgef\u00fctterten R\u00fcstungsteile \
  machen sie zur idealen Wahl f\u00fcr das stundenlange Absuchen des Horizonts im polaren \
  Zwielicht.

f.trojan_armor = Man sagt von der R\u00fcstung der unersch\u00fctterlichen Spiral Wardens, dass \
  sie sehr ermutigend auf andere Knights wirken. Nichts sagt deutlicher "Hier kommt die \
  Kavallerie!" als der Anblick dieser eisernen Riesen, wie sie das Schlachtfeld erst\u00fcrmen.


f.serene_armor = Eine antike, von den Elementen beanspruchte R\u00fcstung. Wenn du in dieser R\u00fc\
  stung still dastehst, kannst du die weit entfernten Ersch\u00fctterungen sp\u00fcren, die von \
  der Wanderung zahlloser Tortodrones verursacht werden, w\u00e4hrend sie in unbekannte \
  Gegenden reisen.

f.celestial_nav_suit = Ein spezieller Anzug zur Erinnerung an isoranische Raumfahrer aus alter \
  Zeit. Wenn du ihn tr\u00e4gst, f\u00fchlst du dich, als k\u00f6nntest du dich im Weltraum nie \
  verirren... wenn die Skylark nur fliegen k\u00f6nnte.

f.galactic_guardian_vest = Wenn du diese erstaunlich stellare Weste tr\u00e4gst, erlaubt sie \
  dir, anderen den Weg zur Sicherheit zu zeigen, selbst in den dunkelsten Ecken des Weltraumes.

f.stellar_sentinel_suit = Diese R\u00fcstung wurde einst von isoranischen Sternenseglern aus \
  lang vergangenen Zeiten getragen, die Operationen ausserhalb des Sonnensystems \u00fcberwacht \
  haben. Damit ausger\u00fcstet f\u00fchlst du dich, als k\u00f6nntest du ins Innere eines \
  Sterns tauchen.

f.swimsuit_trunks = Ein Paar Spiral-Badehosen, gedacht f\u00fcr Expeditionen an die K\u00fcste und Spa\u00df in der Sonne.

f.swimsuit_wrap = Ein Spiral-Sarong, \u00fcber einen einteiligen Badeanzug drapiert, gedacht f\u00fcr Expeditionen an die K\u00fcste und Spa\u00df in der Sonne.


f.nodeslime_armor = Ein verschiedenfarbiger Schleier, der von nachdr\u00fccklich bewunderten \
  Siegern getragen wird.

f.gremlin_suit = Ein besonderer Anzug, geschneidert von den H\u00e4nden eines Gremlins, um sich \
  der Figur eines Knights anzupassen. Er sch\u00fctzt seinen Tr\u00e4ger, w\u00e4hrend er ihm \
  genug Bewegungsfreiheit zum Schlagen, Klopfen und Flicken l\u00e4sst.

f.mechaknight_suit = Eine schlanke R\u00fcstung, dazu gemacht, einen Knight bei seinem Vorto\u00df \
  in die Tiefen Cradles zu verkleiden.

f.kat_suit = Ein mit Krallen versehenes Kost\u00fcm, das von den Schneidern in Moorcroft \
  gemacht wurde. Es ist perfekt f\u00fcr neugierige Knights, die einen Hang zu Nickerchen nach \
  einer Nacht voller Abenteuer haben.

f.venom_fiend_mail = Ein Plattenpanzer, von dem man sagt, dass er als Abbild eines gifitgen D\u00e4\
  mons hergestellt wurde. Dazu geh\u00f6rt ein finsterer Ganzk\u00f6rperanzug, der mit der \
  Kraft einer b\u00f6sen Essenz pulsiert.

f.arctic_rogue_mail = Eine Plattenr\u00fcstung von der gesagt wird, ein arktischer Schurke h\u00e4\
  tte sie geschaffen. Sie ist mit Eisplatten verst\u00e4rkt, die deinen Aufenthaltsort w\u00e4\
  hrend arktischer Expeditionen verbergen werden.


f.voltaic_radical_suit = Eine R\u00fcstung von dem man sagt, sie sei eine Replik eines \
  empfindungsf\u00e4higen Mechaknight. Dazu geh\u00f6rt ein hautenger, synthetischer Anzug, der \
  vor elektrischer Energie pulsiert.

f.nefarious_raiment = Eine R\u00fcstung von der man sagt, ein boshafter Imp h\u00e4tte sie \
  hergestellt. Diese \u00e4therischen Platten werden dich gegen ruchlose Schikanen sch\u00fctzen, w\u00e4\
  hrend sie dich in Dunkelheit h\u00fcllen.

f.magmatic_fanatic_mail = Eine Plattenr\u00fcstung von der man sagt, einer der Fanatiker, die \
  einen MAgma-Gott angebetet haben, habe sie getragen. Ihr Feuer wird diejenigen sch\u00fctzen, die es wert sind.

f.wooly_onesie = Eine etwas kratziger, aber warmer Pyjama, den Knights nachts tragen. {0}
f.onesie = In Einheitsgr\u00f6\u00dfe. Maschinenwaschbar, schleuderbar. An der Luft trocknen.

f.wooly_pullover = Ein schicker Sweater f\u00fcr die Saison vor dem ersten Schnee. {0}
f.pullover = Der perfekte Pullover f\u00fcr Parties und gef\u00e4hrliche Abenteuer gleicherma\u00dfen.

f.stranger_robe = Eine Robe, die einmal von einem der r\u00e4tselhaften Stranger getragen \
  wurde. Die lokalen Snipes scheinen vom Tr\u00e4ger angezogen zu werden.

f.spiraltail_mail = Eine einfache Affenmaske, die normal bei Paraden getragen wird, um \
  Wohlstand und Gl\u00fcck zu verleihen.

f.firetail_mail = Eine glimmende Affenr\u00fcstung, die typischerweise von Kommandanten im \
  Kampf getragen wird. Sie wird ihren Tr\u00e4ger vor vielen Wunden sch\u00fctzen.

f.winter_pullover = Ein nicht ganz so modischer Pullover f\u00fcr die verschneite Saison. Der \
  perfekte Pulli, um sowohl Familie als auch Gildenkollegen zu blamieren.

f.winter_onesie = Der perfekte Schlafanzug, um Geschenke zu verteilen oder auf die Ankunft von \
  Impostoclaus zu warten.














# Gear Shield names
#...................................................................................................

f.aegis = Ein erhabener Schild, den nur die verdientesten Mitglieder des Spiral Order tragen d\u00fc\
  rfen. Es ist nicht eindeutig gekl\u00e4rt, ob sein Wappen ein Relikt des alten Ordens ist \
  oder aus der Zeit der Knights auf Cradle stammt.

f.ancient_plate_shield = Ein antiker Schild, dessen Ursprung im Laufe der Zeit vergessen wurde.

f.barrier_shell = Ein Schild, der per Alchemie aus dem Panzer einer Tortodrone hergestellt \
  wurde. Die elementare Widerstandskraft einer Tortodrone auf ihrer langen Wanderung sollte dir \
  auch auf deinen Reisen durch unwirtliche Gegenden helfen.

f.barbarous_thorn_shield = Ein mythischer Schild, durchdrungen von der Wut des Snarbolax \
  selbst. Es wird erz\u00e4hlt, dass die Bestie die gl\u00fchenden Kugeln auf dem Schild nutzen \
  kann, um \u00e4ngstliche Tr\u00e4ger sehen und verfolgen zu k\u00f6nnen.

f.blackened_crest = Ein Schild, einst von einem Krieger Almires getragen. Jetzt ist er ein \
  verfluchtes Relikt, das in der Feuersturm-Zitadelle beinahe bis zur Unkenntlichkeit verbrannt \
  wurde. Um seine einstige Pracht wiederherzustellen, w\u00e4re m\u00e4chtige Alchemie vonn\u00f6ten.

f.blazebreak_shield = Ein verl\u00e4sslicher Schild, der dich sch\u00fctzt, wenn ein heisser \
  Kampf entbrennt.

f.blizzbreaker_shield = Ein verl\u00e4sslicher Schild, der dich davor sch\u00fctzt, dass deine \
  Feinde dich kalt erwischen.

f.boosted_plate_shield = Ein wundersch\u00f6n gearbeiteter Schild, dem eine interne \
  Energiequelle eingebaut wurde, um auch die heftigsten Schl\u00e4ge abhalten zu k\u00f6nnen.

f.bristling_buckler = Ein kleiner Schild, mit Stacheln versehen, um deinem Schwert im Kampf \
  beizustehen.

f.brute_jelly_shield = Ein dicker Schild, hergestellt aus den \u00dcberresten besonders \
  ungezogener Glibber. Er ist robust, leicht und hat einen angenehmen Beerenduft.

f.celestial_shield = Die Tagundnachtgleiche auf Cradle hat die zweiseitige Natur dieses \
  Schildes inspiriert, der gegen das blendende Licht des Tages und die K\u00e4lte der Nacht gleicherma\u00dfen sch\u00fctzt.

f.circuit_breaker_shield = Ein Proto Shield, der einigen Schutz gegen Schock bietet.

f.crest_almire = Ein schimmerndes Wappen, das einst mit Stolz von den Kriegern von Almire \
  getragen wurde. Es soll jenen Segen bringen, die f\u00fcr ihr Heimatland k\u00e4mpfen und \
  ihnen innere St\u00e4rke verleihen.

f.dark_thorn_shield = Ein d\u00fcsterer Besch\u00fctzer, der den Hieben eines Schwerts \u00fcbernat\u00fc\
  rliche Wildheit verleiht.

f.defender = Ein robuster, hochwertiger Schild des Spiral Order, der f\u00fcr jedes Abenteuer \
  geeignet ist.

f.dragon_scale_shield = Ein mythischer Schild, gefertigt aus den Schuppen einer legend\u00e4ren Kreatur.

f.drake_scale_shield = Ein solider Schild, geformt aus stabilen Schuppen.

f.dread_skelly_shield = Ein gro\u00dfes, knochiges Schutzschild, das in d\u00fcsteren dunklen Nebel geh\u00fc\
  llt ist. Es gibt gelegentlich ein stilles, verlorenes Fl\u00fcstern von sich, normalerweise, \
  um ans Benutzen der Abwehr zu erinnern.

f.emberbreak_shield = Ein Proto Shield, der einigen Schutz gegen Feuer bietet.

f.feral_shell = Ein Schild, der per Alchemie aus dem geh\u00e4rteten Panzer einer Tortodrone \
  hergestellt wurde. Selbst die sch\u00e4rfsten Wolver-Klauen werden von dieser kompakten \
  Panzerung bestenfalls abrutschen.

f.firebreak_shield = Ein Emberbreak Shield, der noch besseren Schutz gegen Feuer bietet.

f.force_buckler = Ein Proto Shield speziell gegen bet\u00e4ubende St\u00f6\u00dfe.

f.frostbreaker_shield = Ein Proto Shield, der einigen Schutz gegen Einfrieren bietet.

f.gorgomega = Ein be\u00e4ngstigender Schild, der die zweifach verheerende Macht von Gorgo und \
  der mythischen Tortomega kombiniert. Feinde zu zerschmettern had nie mehr d\u00e4monischen Spa\u00df gemacht.

f.grand_tortoise = Ein Schild, durchdrungen von der grenzenlosen Wut einer Tortodrone. Jede \
  einzelne Platte dieses gewaltigen Panzers vibriert vor instabiler Energie, die darauf wartet, \
  entfesselt zu werden.

f.great_defender = Ein robuster Defender, mit einer integrierten Energiequelle versehen, um \
  noch mehr Schutz zu bieten.

f.green_ward = Ein robuster, smaragdgr\u00fcn schimmernder Schild, der Rekruten der Spiral \
  Knights vor scharfen Stacheln und t\u00f6dlichen Giften sch\u00fctzt.

f.grey_owlite_shield = Eine pr\u00e4chtige Replik des Schildes, von dem man denkt er wurde an \
  die bedeutendsten Owlite-Magiern vergeben. Ihn zu f\u00fchren erf\u00fcllt dich mit \
  rechtschaffenen Rachegef\u00fchlen.

f.grim_shell = Ein Schild, der per Alchemie aus dem Panzer einer verderbten Tortodrone \
  hergestellt wurde. Die Schatten scheinen l\u00e4nger zu werden und an ihm zu haften, wann \
  immer er getragen wird.

f.heater_shield = Ein Schild mit eingebautem Ofen, der seinen Tr\u00e4ger warm h\u00e4lt und \
  ihn vor den meisten Einfrieren-Angriffen sch\u00fctzt. Viele Knights benutzen ihn auch als \
  behelfsm\u00e4\u00dfigen Herd, wenn sie im Einsatz sind.

f.heavy_plate_shield = Ein gewaltiger, verst\u00e4rkter Schild, perfekt geeignet um Schl\u00e4\
  ge abzuhalten und Gegner abzuwehren.

f.horned_owlite_shield = Ein robuster Schild von einer Machart \u00e4hlich der, von der man \
  sagt, dass sie von jungen Owlites getragen wurden.

f.icebreaker_shield = Ein Frostbreaker Shield, der noch besseren Schutz gegen Einfrieren \
  bietet.

f.iron_buckler = Ein eingedellter kleiner Rundschild aus Eisen, der etwas mehr Schaden abhalten \
  kann als sein Proto Shield.

f.ironmight_plate_shield = Ein \u00fcberragender Schild, hergestellt aus Sun Silver. Das Wissen \
  um die Bedeutung des Emblems auf seiner Vorderseite ging mit den Jahren verloren.

f.jelly_shield = Ein seltsam aussehender Schild aus Glibber. Er teilt die Eigenschaft vieler \
  Glibbermonster und gew\u00e4hrt seinem Tr\u00e4ger bestm\u00f6glichen Schutz gegen \
  durchdringende Angriffe.

f.mighty_defender = Ein verst\u00e4rkter Spiral-Knight-Schild, der f\u00fcr schwere K\u00e4mpfe verst\u00e4\
  rkt wurde und auf dem viele Geschichten eingraviert sind.

f.mighty_shell = Ein Schild, der per Alchemie aus dem Panzer einer Tortodrone hergestellt \
  wurde. Wenn du ihn tr\u00e4gst, kannst du die w\u00fctenden Energien darin sp\u00fcren, die \
  nur darauf warten, losgelassen zu werden.

f.nether_shell = Ein Schild, der per Alchemie aus dem Panzer einer verderbten Tortodrone \
  hergestellt wurde. Ein zorniges Heulen voller Qual ist im Wind zu h\u00f6ren, wenn dieser \
  Schild durch die Reihen der Feinde schmettert.

f.omega_shell = Ein Schild aus dem Panzer einer Tortomega. Das immense Gewicht dieses m\u00e4\
  chtigen Schildes macht es nur f\u00fcr die st\u00e4rksten Krieger interessant.

f.omegaward = Die pulsierenden, elementaren Platten des Schildes reagieren sofort auf widrige \
  Umweltbedingungen und sch\u00fctzen dich vor der extremsten K\u00e4lte oder Hitze.

f.owlite_shield = Ein h\u00f6lzerner Schutz mit der groben Schnitzerei eines lang vergessenen \
  Owlite versehen.

f.plate_shield = Ein schwerer Eisenschild, bew\u00e4hrt darin, Schl\u00e4ge abzuwehren, die \
  dich ansonsten bet\u00e4ubt h\u00e4tten.

f.primal_shell = Ein Schild, der per Alchemie aus dem Panzer einer Tortodrone hergestellt \
  wurde. Die Platten, die zu seiner konstruktion verwendet wurden, bieten einigen Schutz gegen \
  Feuer und Frost.

f.proto_shield = Ein kleiner Schild f\u00fcr alle Rekruten der Spiral Knights.

f.rock_jelly_shield = Hergestellt aus den h\u00e4rtesten Exemplaren unter den Glibbern, \
  fungiert er in Notf\u00e4llen auch als Kalorienquelle f\u00fcr gestrandete Knights.

f.royal_jelly_shield = Erstklassiger Schutz f\u00fcr Anw\u00e4rter auf den Glibber-Thron.

f.savage_tortoise = Ein Schild, der per Alchemie aus dem geh\u00e4rteten Panzer einer \
  Tortodrone hergestellt wurde. Selbst ein w\u00fctendes Wolver-Rudel h\u00e4tte seine liebe \
  Not, diese verst\u00e4rkten Platten zu durchdringen.

f.scale_shield = Ein h\u00fcbsch anzusehender Schild aus Echsenschuppen. Gegen \
  Perforations-Schaden ist das dichte Schuppengeflecht besonders wirkungsvoll, w\u00e4hrend es \
  ansonsten die eine oder andere Schw\u00e4che aufweist.

f.scarlet_shield = Ein Schild aus der Scarlet Fortress. Es gew\u00e4hrt seinem Tr\u00e4ger zus\u00e4\
  tzliche Lebensenergie. Seine Tr\u00e4ger sagen, dass sie manchmal einen leisen Herzschlag von \
  ihm h\u00f6ren.

f.scary_skelly_shield = Ein kleiner, grusliger Schild, der dich vor Schatten sch\u00fctzt.

f.shining_ward = Ein heiliger Schild, der seinen Tr\u00e4ger vor B\u00f6sem bewahrt.

f.sinister_skelly_shield = Ein Schild, dem ein wohlwollender Geist innewohnt. Er sollte dir \
  dabei helfen, eine begeisternde Verteidigung gegen Schatten aufzubauen.

f.skelly_shield = Ein verteufelter Schild, den man am besten dazu verwendet b\u00f6se Energien abzublocken.

f.stoic_shell = Ein Schild, der per Alchemie aus dem Panzer einer Tortodrone hergestellt wurde. \
  W\u00e4hrend du es tr\u00e4gst, sp\u00fcrst du das leise Vorbeiziehen des Windes und kannst \
  den Donner des Sturms rufen, der ihm folgt.

f.stone_tortoise = Ein gro\u00dfer, m\u00e4chtiger Schild, der an den Panzer einer gro\u00dfen \
  Kreatur erinnert. Sein enormes Gewicht kann Angriffe erschweren.

f.stop_sign = Ein ungew\u00f6hnlicher Schild, der allerdings viele Statusangriffe abwehrt. Er \
  hat jedoch die seltsame Eigenschaft, seinen Tr\u00e4ger zum Stehenbleiben zu zwingen, wenn er \
  hinter ihm steht.

f.surge_breaker_shield = Ein verl\u00e4sslicher Schild, der dir hilft w\u00e4hrend des Kampfes \
  auf dem Boden zu bleiben.


f.teddy_bear_buckler = Ein technisch raffinierter Energieschild, der als harmloser Teddyb\u00e4\
  r getarnt ist. Der perfekte Begleiter, um sich gegen die Monster der Nacht zu verteidigen.

f.thwacker_shield = Ein Schild, von Gremlins umfunktioniert und von Darkfang Thwackers \
  getragen. \u00c4hnlich wie Gremlins ist er resistent gegen Feuer und Schock. Knights, die \
  damit gek\u00e4mpft haben, berichten, dass es unm\u00f6glich sei, all das Fell daran zu \
  entfernen.

f.twisted_targe = Eine d\u00fcstere Tartasche, die deinen Schwertst\u00f6\u00dfen Biss verleihen wird.

f.volcanic_plate_shield = Ein \u00fcberragender Schild, durchdrungen von der elementaren Essenz \
  der Flamme. Es ist so resistent gegen hohe Temperaturen, dass unklar ist, wie es \u00fc\
  berhaupt geschmiedet werden konnte.

f.volt_breaker_shield = Ein Circuit Breaker Shield, der noch besseren Schutz gegen Schock \
  bietet.

f.wild_shell = Ein Schild, der per Alchemie aus dem geh\u00e4rteten Panzer einer Tortodrone \
  hergestellt wurde. Er ist hart genug, um den Stachel eines Glibbers beim Aufprall stumpf \
  werden zu lassen.

f.wise_owlite_shield = Es braucht keinen ber\u00fchmten Owlite-Gelehrten, um herauszufinden, \
  dass es eine exzellente Idee ist, sich mit einem Schild zu verteidigen.

f.wyvern_scale_shield = Ein stachliger Besch\u00fctzer, geschmiedet aus Bestien-Chitin, der \
  hinreichend Schutz gegen Hitze und Gift bietet.

f.honor_shield_1 = Ein zeremonieller Schild, der an Rekruten der Spiral Knights vergeben wird. \
  Obwohl er f\u00fcr formelle Gelegenheiten vorgesehen ist, macht ihn seine solide Bauart \
  dennoch f\u00fcr den Kampf brauchbar.

f.honor_shield_2 = Ein zeremonieller Schild, der an erfahrene Mitglieder der Spiral Knights \
  vergeben wird. Obwohl er f\u00fcr formelle Gelegenheiten vorgesehen ist, macht ihn seine \
  solide Bauart dennoch f\u00fcr den Kampf brauchbar.

f.honor_shield_3 = Ein zeremonieller Schild, der an Champions der Spiral Knights vergeben wird. \
  Obwohl er f\u00fcr formelle Gelegenheiten vorgesehen ist, macht ihn seine solide Bauart \
  dennoch f\u00fcr den Kampf brauchbar.

f.honor_shield_4 = Ein zeremonieller Schild, der an die Avantgarde der Spiral Knights vergeben \
  wird. Obwohl er f\u00fcr formelle Gelegenheiten vorgesehen ist, macht ihn seine solide Bauart \
  dennoch f\u00fcr den Kampf brauchbar.

f.the_bitter_end = Ein Schild, der von allen Mitgliedern der Aufkl\u00e4rungs-Ranger getragen \
  wird. Sein Name ist f\u00fcr alle Ranger eine Erinnerung daran, wann genau es ihnen erlaubt \
  ist, ihn im Kampf abzulegen.

f.the_final_gasp = Ein Schlid, der von allen Mitgliedern der scharlachroten Sp\u00e4her \
  getragen wird. Sein Name erinnert alle Sp\u00e4her daran, wann im Kampf es ihnen erlaubt ist, \
  ihn fallen zu lassen.

f.nodeslime_shield = Dieser abgetragenem wackelnde Wall kann ein wenig Dresche gut vertragen, \
  wenn er von standhaften und willensstarken K\u00e4mpfern getragen wird.

f.power_mitt = Etwas, das in keiner K\u00fcche fehlen darf. Der bequeme Sitz und das \
  Obermaterial aus schwerem, silbernem Gewebe sind perfekt daf\u00fcr, mit hei\u00dfen Gegenst\u00e4\
  nden zu hantieren. Jetzt kochst du mit Dampf dahinter!






# Gear Trinket names
