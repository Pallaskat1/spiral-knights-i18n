m.capsule_health = Lebensenergie-Kapsel
f.capsule_health = Eine kleine Kapsel, die eine geringe Menge Lebensenergie regeniert. Das \
  Beste, was einem Abenteurer passieren kann!
s.capsule_health = LK

m.capsule_remedy = Gegenmittel-Kapsel
f.capsule_remedy = Eine kleine Kapsel, die ihren Benutzer erfrischt. Sie entfernt s\u00e4mtliche Statuseffekte.\n\
  \n\
  Keine Panik! Gegenmittel-Kapseln k\u00f6nnen dir das Leben retten, also vergiss niemals sie \
  zu benutzen.
s.capsule_remedy = GK

m.capsule_health_super = Super-Lebensenergie-Kapsel
f.capsule_health_super = Eine kleine Kapsel, die eine gro\u00dfe Menge Lebensenergie regeniert. \
  Das Beste, was einem Abenteurer passieren kann!
s.capsule_health_super = SLK

m.capsule_health_ultra = Ultra-Lebensenergie-Kapsel
f.capsule_health_ultra = Eine Kapsel, die eine extreme Menge Lebensenergie wieder herstellt. \
  Ziehe niemals ohne eine los!
s.capsule_health_ultra = ULK

f.mecha_knight_kit = Erschafft einen Mecha Knight zu deinem Schutz



f.ranger_signal_flare = Ein Signalfeuer, das einem Ranger in der N\u00e4he anzeigt, Unterst\u00fctzungsfeuer zu leisten.

m.artillery_beacon = Artillerieschlag
f.artillery_beacon = Ein tragbares Leuchtfeuer, das, wenn es aufgestellt wird, ein Bombardement \
  m\u00e4chtiger Raketen heraufbeschw\u00f6rt.

m.auto_turret_kit = Auto-Gesch\u00fctzturm-Kit
f.auto_turret_kit = Platziert einen automatischen Gesch\u00fctzturm, der auf nahegelegene \
  Bedrohungen feuert.
s.auto_turret_kit = AGK

m.fire_barrier = Feuer-Barriere
f.fire_barrier = Umgibt dich mit feurigen Kugeln, die Feinde entz\u00fcnden k\u00f6nnen.
m.super_fire_barrier = Super-Feuer-Barriere
f.super_fire_barrier = Umgibt dich mit machtvollen feurigen Kugeln, die Feinde entz\u00fcnden k\u00f6nnen.
m.ultra_fire_barrier = Ultra-Feuer-Barriere
f.ultra_fire_barrier = Umgibt dich mit t\u00f6dlichen feurigen Kugeln, die Feinde entz\u00fcnden k\u00f6nnen.

m.freeze_barrier = Frost-Barriere
f.freeze_barrier = Umgibt dich mit eisigen Kugeln, die Feinde einfrieren lassen k\u00f6nnen.
m.super_freeze_barrier = Super-Frost-Barriere
f.super_freeze_barrier = Umgibt dich mit machtvollen eisigen Kugeln, die Feinde einfrieren \
  lassen k\u00f6nnen.
m.ultra_freeze_barrier = Ultra-Frost-Barriere
f.ultra_freeze_barrier = Umgibt dich mit t\u00f6dlichen eisigen Kugeln, die Feinde einfrieren \
  lassen k\u00f6nnen.

m.poison_barrier = Gift-Barriere
f.poison_barrier = Umgibt dich mit giftigen Kugeln, die Feinde verkr\u00fcppeln k\u00f6nnen.
s.poison_barrier = GB
m.super_poison_barrier = Super-Gift-Barriere
f.super_poison_barrier = Umgibt dich mit machtvollen giftigen Kugeln, die Feinde verkr\u00fcppeln k\u00f6nnen.
s.super_poison_barrier = SGB
m.ultra_poison_barrier = Ultra-Gift-Barriere
f.ultra_poison_barrier = Umgibt dich mit t\u00f6dlichen giftigen Kugeln, die Feinde verkr\u00fcppeln k\u00f6nnen.
s.ultra_poison_barrier = UGB

m.shock_barrier = Schock-Barriere
f.shock_barrier = Umgibt dich mit Kugeln aus Blitzen, die Feinden einen Schlag versetzen k\u00f6nnen.
m.super_shock_barrier = Super-Schock-Barriere
f.super_shock_barrier = Umgibt dich mit machtvollen Kugeln aus Blitzen, die Feinden einen \
  Schlag versetzen k\u00f6nnen.
m.ultra_shock_barrier = Ultra-Schock-Barriere
f.ultra_shock_barrier = Umgibt dich mit t\u00f6dlichen Kugeln aus Blitzen, die Feinden einen \
  Schlag versetzen k\u00f6nnen.

# Pickups - Vial Names and Flavor Text
#...................................................................................................

m.vial_curse = Fluch-Phiole
f.vial_curse = Eine Glasphiole mit konzentrierter b\u00f6ser Essenz. Damit kannst du Gegner mit \
  einem Fluch belegen.\n\
  \n\
  Wirf sie wie eine Granate und w\u00fcnsche deinen Gegnern 10 Jahre Pech.
s.vial_curse = FP

m.vial_fire = Feuer-Phiole
f.vial_fire = Eine Glasphiole mit einer geschmolzenen Mixtur. Damit kannst du Gegner in Feuer h\u00fcllen.\n\
  \n\
  Wirf sie wie eine Granate und verbrenne sie!
s.vial_fire = FP

m.vial_freeze = Frost-Phiole
