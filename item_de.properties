m.elite_quick_draw_module = Elite Quick Draw Modul
m.elite_quick_strike_module = Elite Quick Strike Modul
m.elite_trueshot_module = Elite Trueshot Modul
m.trueshot_module = Trueshot Modul

f.true_love_locket = Ein kleines, herzf\u00f6rmiges Medaillon mit einer Inschrift: "In meinen \
  Prozessen denk ich immer an dich! In Liebe Puppy".

f.gift_of_autumn = Ein seltener Talisman, der von Reisenden gesch\u00e4tzt wird und den Tr\u00e4ger w\u00e4hrend der Winterzeit sch\u00fctzt.

f.silver_solstice_ring = Ein verzauberter Ring, der den Geist der Sonnwende verk\u00f6rpert. \
  Sein glitzernder, silberner Schimmer leuchtet in den Wintermonaten am hellsten.

f.golden_solstice_ring = Ein verzauberter Ring der den Geist der Sonnwende verk\u00f6rpert. \
  Sein glitzernder, goldener Schimmer leuchtet in den Sommermonaten am hellsten.

f.grand_solstice_ring = Ein beeindruckender, verzauberter Ring der den Geist der Sonnwende verk\u00f6rpert. Seine Oberfl\u00e4\
  che scheint mit der Zeit die Farbe zu wechseln, manchmal fasst er sich warm an, manchmal \
  kalt.





# Alchemy orbs
#...................................................................................................

f.flawed_orb = Ein seltenes, eingekapseltes Element, das f\u00fcr Umwandlungen in der Alchemie \
  verwendet wird. Obwohl die Kugel Makel hat, ist sie noch immer daf\u00fcr brauchbar, weniger m\u00e4chtige Gegenst\u00e4nde zu erstellen.

f.simple_orb = Ein seltenes, eingekapseltes Element, das f\u00fcr Umwandlungen in der Alchemie \
  verwendet wird. Obwohl die Kugel nicht perfekt gearbeitet ist, kann sie daf\u00fcr verwendet werden, m\u00e4chtigere Gegenst\u00e4nde zu erstellen.

f.advanced_orb = Ein seltenes, eingekapseltes Element, das f\u00fcr Umwandlungen in der \
  Alchemie verwendet wird. Diese Kugel ist aussergew\u00f6hnlich und kann dazu verwendet \
  werden, sehr m\u00e4chtige Gegenst\u00e4nde zu erstellen.

f.elite_orb = Ein seltenes, eingekapseltes Element, das f\u00fcr Umwandlungen in der Alchemie \
  verwendet wird. Kugeln wie diese werden von Elite-Knights dazu verwendet, Gegenst\u00e4nde \
  von herausragender Macht zu erstellen.

f.eternal_orb = Ein seltenes, eingekapseltes Element, das f\u00fcr Umwandlungen in der Alchemie \
  verwendet wird. Diese Kugel wird von den m\u00e4chtigsten Knights gesch\u00e4tzt und wird \
  dazu verwendet, Gegenst\u00e4nde aussergew\u00f6hnlich gro\u00dfer Macht zu erstellen.


# Fire crystals
#...................................................................................................

f.cracked_crystal = Eine seltene, kristalline W\u00e4rme-Formation, die zum Schmieden von Ausr\u00fcstung und Waffen h\u00f6\
  herer Level benutzt wird. Obwohl sie Spr\u00fcnge hat, gl\u00fcht sie immer noch leicht.

f.dim_crystal = Eine seltene, kristalline W\u00e4rme-Formation, die zum Schmieden von Ausr\u00fcstung und Waffen h\u00f6\
  herer Level benutzt wird. Die W\u00e4rme darin flackert wie eine kleine Kerze.

f.warm_crystal = Eine seltene, kristalline W\u00e4rme-Formation, die zum Schmieden von Ausr\u00fcstung und Waffen h\u00f6\
  herer Level benutzt wird. Die W\u00e4rme darin brennt stark genug, dass sie sich warm anf\u00fchlt.

f.glowing_crystal = Eine seltene, kristalline W\u00e4rme-Formation, die zum Schmieden von Ausr\u00fcstung und Waffen h\u00f6\
  herer Level benutzt wird. Die W\u00e4rme darin brennt hell genug, um einen dunklen Raum zu \
  erleuchten.

f.shining_crystal = Eine seltene, kristalline W\u00e4rme-Formation, die zum Schmieden von Ausr\u00fcstung und Waffen h\u00f6\
  herer Level benutzt wird. Die W\u00e4rme darin brennt hell wie ein Stern am Nachthimmel.

f.radiant_crystal = Eine seltene, kristalline W\u00e4rme-Formation, die zum Schmieden von Ausr\u00fcstung und Waffen h\u00f6\
  herer Level benutzt wird. Die W\u00e4rme darin ist wild und mysteri\u00f6s und brennt heller \
  als jedes nat\u00fcrliche Feuer es k\u00f6nnte.


# Material names
#...................................................................................................

f.ancient_shell = Ein Fragment widerstandsf\u00e4higen Tortodrone-Panzers. Es geht das Gr\u00fc\
  cht, dass man durch das Schlafen auf einem Tortodrone-Panzer die subtilen Vibrationen sp\u00fcren kann, die diese m\u00e4\
  chtigen Wesen zum mysteri\u00f6sen Zielort ihrer langen Wanderung rufen.

f.beast_scale = Eine relativ intakte Schuppe von einer Kreatur aus dem Uhrwerk.

f.binding_essence = Ein seltsames, b\u00f6ses Reagenz von dem geglaubt wird, die Apocrea h\u00e4\
  tten es abgebaut, um ihre Konstruktionen zu bauen. Wenn du es einmal auf die Haut bekommen \
  hast, scheint es sich nicht mehr abwaschen zu lassen. Nein, es muss, du musst nur fester \
  schrubben. Fester, ja...

f.blast_powder = Eine gef\u00e4hrliches Nebenprodukt, produziert von organischen \
  Feuerkreaturen. Gremlins benutzen es gerne, um Sachen in die Luft zu jagen.

f.blaze_pepper = Ein k\u00f6stliches Gew\u00fcrz, \u00e4usserst gesch\u00e4tzt von allen \
  Bewohnern des Uhrwerks. In Pulverform hat es die l\u00e4stige Angewohnheit, an wirklich allem \
  h\u00e4ngen zu bleiben.

f.blighted_bone = Eine zermarterte Kniescheibe, die schon bessere Zeiten gesehen hat, vor den \
  Begegnungen mit diverse Knights.

f.blue_shard = Ein Splitter Moonstone, zu klein um Tore anzutreiben, aber sehr n\u00fctzlich in der Alchemie.

f.brimstone = Ein stinkender, stygischer Schwefelstein, der f\u00fcr gew\u00f6hnlich in der \
  Unterwelt gefunden wird.

f.book_of_dark_rituals = Ein antiker W\u00e4lzer voller unaussprechlicher finsterer Rituale. \
  Wie bei jedem verfluchten Buch gibt es bestimmt ein perverses Individuum, das es f\u00fcr seine d\u00fc\
  steren Zwecke haben will. Handle mit Vorsicht.

f.bottomless_stocking = Ein interdimensionaler Riss in dieser weichen Stoffsocke verschluckt \
  jeden darin platzierten Gegenstand. Selbst die N\u00e4hte sind verschwunden.

f.bronze_bolt = Eine einfache Bronzeschraube, wie sie \u00fcberall im Uhrwerk zu finden ist.

f.brute_core = Ein blauer Glibberklumpen, der von einem besonders m\u00e4chtigen, schleimigen \
  Gegner stammt.

f.bushy_tail = Ein sonderbar unversehrter Schwanz eines Monsters aus dem Uhrwerk.

f.celestial_ore = Ein extrem seltenes Metall, von dem man sagt, dass es aus dem Himmel stammt. \
  Es wird oft komplett f\u00fcr Kronen und Schmuck f\u00fcr k\u00f6nigliche Glibber \
  verschwendet.

f.chroma_tear = Die kristallisierte Tr\u00e4ne eines Chromalisk, brauchbar als Linse f\u00fcr \
  Zielvorrichtungen oder um Kurzsichtigkeit zu korrigieren.

f.cooling_cell = Ein kleines Ger\u00e4t, das in komplexen Maschinen dazu verwendet wird, deren \u00dc\
  berhitzung zu vermeiden. Auch praktisch als Abk\u00fchlung, wenn man es an hei\u00dfen \
  Sommertagen in der Tasche dabei hat.

f.corrosive_acid = Eine \u00e4tzende Substanz, charakteristisch f\u00fcr korrodierende \
  Kreaturen.

f.crest_of_ur = Ein Wappen der verschollenen Lgion von Ur, eine Elite-Truppe der geisterhaften \
  Krieger, von denen man sagt, sie haben einmal die Unterwelt erobert. Wer immer es h\u00e4lt, \
  kann in der Ferne den Klang von Trommeln und das Donnern von Hufen vernehmen.

f.crimsonite_shard = Ein Crimsonite-Splitter, der zu klein ist, um Tore zu betreiben, aber f\u00fc\
  r alchemische Zwecke von Nutzen sein kann.

f.critter_carapace = Ein St\u00fcck aus einem Chitinpanzer einer Kreatur aus dem Uhrwerk. Es \
  ist in \u00fcberraschend gutem Zustand.

f.cursed_idol = Eine kleine Steinstatue in der Form eines der tausend Erzd\u00e4monen der \
  Unterwelt. Die dunkel gef\u00e4rbte Oberfl\u00e4che scheint sich zu bewegen und zu ver\u00e4ndern wie Rauchschwaden.

f.dark_ember = Ein Partikel brennender Energie, aus Lord Vanadukes Thronsaal geborgen. Es \
  schmort mit einer dunklen Intensit\u00e4t vor sich hin und verursacht eine fast hypnotische \
  Trance, wenn man ihn l\u00e4nger anstarrt.

f.dark_matter_shard = Ein Splitter Dark Matter, der zu klein ist, um Tore zu betreiben, aber f\u00fc\
  r alchemische Zwecke von Nutzen sein kann.

f.dark_shard = Ein Splitter Dark Matter, zu klein um Tore anzutreiben, aber sehr n\u00fctzlich in der Alchemie.

f.dead_gold = Eine M\u00fcnze die man Toten vor der Beerdigung in die Hand gibt, damit sie den \
  Obulus f\u00fcr die lange Reise zahlen k\u00f6nen, die vor ihnen liegt.

f.dragon_scale = Eine gepanzerte Schuppe von einer Kreatur, von der man glaubte sie sei \
  ausgestorben. Im Licht schimmert sie mit einem Glanz, der nicht von dieser Welt scheint.

f.drake_scale = Eine solide Schuppe, einem brutalen Biest abgerungen.

f.driftwood = Ein sonderbares St\u00fcck Holz, das sich einfach nicht stillhalten will.

f.ecto_drop = Etwas Ektoplasma, das m\u00fchsam von einem unwillig freiwilligen Untoten \
  gespendet wurde. Es hat eine unangenehm gr\u00fcne Farbe.

f.enamorock = Ein seltsamer Stein, der dich mit einem wohlig warmen Gef\u00fchl erf\u00fcllt, \
  allein dadurch, dass du ihn h\u00e4ltst.

f.everfrost = Eine kleine Formation von Eiskristallen, die niemals zu schmelzen scheinen, \
  selbst nicht, wenn sie direkter Hitze ausgesetzt werden.

f.fiendglyph = Ein Fragment einer Fiendish ID Card. Das Kombinieren von f\u00fcnf \
  unterschiedlichen Glyphen zu einer ID-Karte wird dir erm\u00f6glichen, das d\u00fcstere \
  Portal im Alten Hain zu \u00f6ffnen.

f.fiend_portal_key = Die Benutzung wird dir erm\u00f6glichen, das d\u00fcstere Portal im Alten \
  Hain zu \u00f6ffnen und zu durchschreiten.

f.fine_fabric = Ein gut gearbeiteter Stoff von einem Bewohner des Uhrwerks.

f.flame_soul = Eine m\u00e4chtige Essenz, die zur\u00fcckbleibt, wenn eine zur Weissglut \
  getriebene Kreatur in blinder, rasender Wut zugrunde geht.

f.forbidden_fruit = Eine verbotene Leckerei hungriger D\u00e4monen.

f.force_dynamo = Ein raffiniertes Ger\u00e4t, das scheinbar Energie aus dem Nichts generieren \
  kann.

f.frayed_fabric = Die ausgetragenen \u00dcberreste der Klamotten eines Bewohners aus dem \
  Uhrwerk. Vielleicht kann man sie noch verwerten.

f.frost_gel = Ein Tropfen kalter Schmiere, gewonnen von einem unterk\u00fchlten Uhrwerksbewohner.

f.fuel_canister = Ein kleiner Beh\u00e4lter, der Treibstoff f\u00fcr eine komplizierte Maschine \
  enth\u00e4lt.

f.ghost_bell = Eine kleine Silberglocke, die von r\u00fccksichtsvollen Geistern getragen wird \
  und die Lebenden alarmiert, wenn sie in der N\u00e4he sind.

f.gel_core = Ein faustgro\u00dfer Gallertklumpen von einem Glibber.

f.gel_drop = Ein Tropfen Schleim von einem Glibber. Er zittert noch.

f.grave_soil = Unheimlicher Dreck aus einer gruseligen Gruft. Er f\u00fchlt sich immer kalt an.

f.green_shard = Ein Splitter Valestone, zu klein um Tore anzutreiben, aber sehr n\u00fctzlich in der Alchemie.

f.gremlin_gizmo = Ein eigenartiges Ger\u00e4t, das in den Maschinen von Gremlins Verwendung \
  findet. Es enth\u00e4lt eine Warnung in Form einer Inschrift, laut der es weder Sonnenlicht \
  noch Wasser ausgesetzt werden sollte.

f.gremlonium = Eine \u00e4usserst fortschrittliche Komponente, gebaut von Gremlin-Ingenieuren, \
  um ihre t\u00f6dlichsten Maschinen anzutreiben. Sie gibt st\u00e4ndig ein beunruhigendes, \
  zischendes Ger\u00e4usch von sich.

f.hailstone = Ein kleiner Stein, der sich immer etwas kalt anf\u00fchlt. Eignet sich grossartig \
  zum K\u00fchlen von Getr\u00e4nken, ohne deren Geschmack zu ver\u00e4ndern.

f.heavy_gear = Ein schweres Getriebe, das fr\u00fcher beim Betrieb einer riesigen Maschine \
  eingesetzt wurde.

f.indestructible_giftwrap = In diesen Grinchlin-Scherz verpackte Geschenke k\u00f6nnen nie mehr ge\u00f6ffnet werden. \u00dc\
  berlasse es den Grinchlins, den kostenlosen Geschenkverpackungsservice f\u00fcr alle zu ruinieren.

f.iron_gear = Ein Zahnrad aus Metall, das einmal Teil einer gr\u00f6\u00dferen Maschine war.

f.ironwood = Ein unber\u00fchrter Klotz aus einem der h\u00e4rtesten Materialien, die den \
  Spiral Knights bekannt sind.

f.jelly_glue = Eine dickfl\u00fcssige Mischung, die von Biotechs zur Studie von Glibbern \
  entwickelt wurde. Wenn sie mit Schleim- und Glibber-Materie vermischt wird, kann man sie \
  modellieren, ohne dass sie danach ihre Form verliert. Obwohl sie f\u00fcr wissenschaftliche \
  Zwecke reserviert ist, wird der Prozess generell als 'absolut lustig' bezeichnet.

f.kat_tribe_fetish = Ein zerfledderter Fetisch des inzwischen ausgel\u00f6schten Kat-Stamms, \
  die wilden katzenhaften Krieger, die f\u00fcr die Zerst\u00f6rung der Owlites und ihrer ber\u00fc\
  hmten hohen Akademie der Magie verantwortlich sind. Die Fetische wurden von Kat-Kriegern in \
  die Schlacht getragen und sollen trotz des Schicksals des Kat-Stammes Gl\u00fcck bringen.

f.light_shard = Ein Splitter Luminite, zu klein um Tore anzutreiben, aber sehr n\u00fctzlich in der Alchemie.

f.luminite_shard = Ein Luminite-Splitter, der zu klein ist, um Tore zu betreiben, aber f\u00fcr \
  alchemische Zwecke von Nutzen sein kann.

f.lump_coal = Ein Grinchlin-Geschenk f\u00fcr die, die artig oder brav waren. Grinchlins sind \
  fair beim Spielverderben.

f.maidens_tear = Ein heiliges Juwel, hoch gesch\u00e4tzt von den Almirian Knights. Es wurde \
  ihnen von ihren Liebsten gegeben und man sagt es besch\u00fctzte sie im Kampf.

f.meteor_mote = Ein kleines St\u00fcck von einem seltenen Material, von dem behauptet wird, es \
  sei vom Himmel gefallen. Gremlins benutzen es beim Bau von Kraftquellen.

f.miracloth = Ein wundervolles St\u00fcck unglaublich geschmeidigen Stoffs.

f.mod_calibrator = Dieses komplizierte Ger\u00e4t wurde speziell daf\u00fcr entwickelt, Mods zu \
  kalibrieren und sollte nicht mit einem Calibrator Mod verwechselt werden, der dazu verwendet \
  wird, Kalibrierungen zu modifizieren. Ein h\u00e4ufig gemachter Fehler.

f.monster_bone = Ein intakter Knochen eines toten Monsters.

f.moonstone_shard = Ein Moonstone-Splitter, der zu klein ist, um Tore zu betreiben, aber f\u00fc\
  r alchemische Zwecke von Nutzen sein kann.

f.mug_misery = Ein verfluchtes Trinkgef\u00e4\u00df, das nur von einer wahrhaft b\u00f6sen \
  Seele verwendet werden kann. Jene, die es besitzen, sollen allen anderen in ihrer N\u00e4he gro\u00dfes Ungl\u00fcck bringen.

f.nightmare_mane = Ein St\u00fcck grober Pelz von einem Snarbolax. Jede Faser scheint sich zu \
  winden und zu ringeln, als sie noch immer von Leben durchdrungen w\u00e4re.

f.nightshade = Ein gef\u00e4hrliches Kraut, das ungesund ist f\u00fcr die meisten Bestien, aber \
  sehr schmackhaft f\u00fcr eine ganze Reihe giftiger Kreaturen.

f.obsidian_shard = Ein pechschwarzer Splitter aus pechschwarzem Stein. Wenn du ihn h\u00e4ltst, f\u00fc\
  llt er deinen Kopf mit Bildern einer fernen K\u00fcste, wo Wellen gegen Felsen schlagen, die \
  sich in der K\u00e4lte des Wassers zu winden scheinen.

f.owlite_feather = Eine kleine Feder von einer Owlite. Die Owlite sind angeblich eine mystische \
  Rasse  magischer V\u00f6gel.

f.perfect_snowball = Ein eiskalter Schneeball von nahezu mythischer Perfektion. Wenngleich er \
  darum bettelt, jemandem mitten ins Gesicht geworfen zu werden, ist er wohl noch besser \
  alchemisch zu gebrauchen.

f.perplexing_element = Ein seltenes Metall, das von einem zerschmetterten Berg geborgen wurde, \
  tief im Reich Apocrea. Unter dem Mikroskop zeigt sich, dass es eine Art unm\u00f6glicher \
  Geometrie zu besitzen scheint. Vielleicht w\u00fcrden intensivere Studien, fernab von den \
  Ablenkungen der Welt, seine Geheimnisse l\u00fcften.

f.phial_phear = Eine Glasphiole mit einer kleinen Dosis Phearium, eine seltsame chemische \
  Verbindung, die sofort Panik hervorrufen soll, sobald man auch nur einen Hauch davon \
  wahrnimmt.

f.philoso_feather = Eine gro\u00dfe graue Feder des gr\u00f6\u00dften Magiers der Owlite.

f.plague_essence = Eine m\u00e4chtige Essenz, die zur\u00fcckbleibt, wenn eine Kreatur an einer \
  besonders \u00fcblen Krankheit zugrunde geht.

f.plasma_cell = Eine hochmoderne Plasmaquelle, die jeden blendet, der hineinsieht.

f.power_cell = Ein kleines Ger\u00e4t zur Energieversorgung komplizierter Maschinen.

f.primal_ore = Ein aussergew\u00f6hnliches Metall, durchdrungen vom ungez\u00e4hmten Geist der Wildnis.

f.punkin_sprout = Ein kleiner Trieb, der zu einem gro\u00dfen K\u00fcrbis heranwachsen kann.

f.razor_ribbon = Denk daran: Wenn du mit Grinchlin-Geschenken hantierst, trage immer die \
  Plattenpanzer-Handschuhe.

f.reaper_rib = Ein Knochen, geschw\u00e4rzt von der Bosheit seines vorherigen Besitzers.

f.red_shard = Ein Splitter Crimsonite, zu klein um Tore anzutreiben, aber sehr n\u00fctzlich in der Alchemie.

f.redwood = Ein robustes St\u00fcck feines, unbearbeitetes Holz. Es wird \u00fcblicherweise f\u00fc\
  r die Herstellung von Schr\u00e4nken verwendet.

f.rock_salt = Ein kleines Bisschen Uhrwerks-Mineral, das von \u00fcberhaupt nichts durchsetzt \
  ist. Hungrig labt es sich an Essenzen und Aromen in seiner N\u00e4he, was es zu einer \
  unverzichtbaren Zutat beim Kochen und zum Schrecken aller Glibber macht.

f.rocket_sprocket = Ein stabiles Zahnrad, das bei Maschinen Verwendung findet, die Projektile \
  abfeuern.

f.rocky_core = Eine k\u00f6stliche Gummi-Leckerei mit einer undruchdringlichen, steinernen H\u00fc\
  lle. Mehr als nur ein paar Z\u00e4hne wurden von Knights bei dem Versuch verloren, an das \
  klebrige Innere zu kommen.

f.royal_core = Ein s\u00fcss riechender Klumpen Schleim, der von einem ungew\u00f6hnlich noblen \
  Mitglied der Gattung Glibber gewonnen wurde.

f.royal_skewer = Ein gezackter, messerscharfer Dorn von einem der m\u00e4chtigsten Glibber auf \
  Cradle. Sobald er vom Glibber entfernt wird, wird er br\u00fcchig und zerf\u00e4llt am Ende zu Staub.

f.schemer_scrap = Das Fragment einer Blaupause, die von Gremlin-Pl\u00e4neschmiedern verwendet \
  wird, um ihre mechanischen Monstrosit\u00e4ten zu bauen. Mit genug davon und ein wenig \
  Klebeband k\u00f6nntest du selbst eine metallene Todesmaschine bauen!

f.scrap_metal = Ein weggeworfenes St\u00fcck Metall, dass problemlos wiederverwertet werden \
  kann.

f.seerus_fragment_1 = Ein zerbrochenes Fragment der Maske, die einst von Warmaster Seerus \
  getragen wurde, geborgen von der Belagerung seines Gro\u00dfen Arsenals.

f.seerus_fragment_2 = Ein besch\u00e4digtes Fragment der Maske, die einst von Warmaster Seerus \
  getragen wurde, geborgen von der Belagerung seines Gro\u00dfen Arsenals.

f.seerus_fragment_3 = Ein perfektes Fragment der Maske, die einst von Warmaster Seerus getragen \
  wurde, geborgen von der Belagerung seines Gro\u00dfen Arsenals.

f.shadow_steel = Ein aussergew\u00f6hnliches Metall, durchdrungen von der schleichenden \
  Dunkelheit der Unterwelt.

f.sharp_fang = Ein extrem spitzer Backenzahn. Vielleicht von einem Hund?

f.silver_coil = Ein elektromagnetischer Mechanismus aus einem stark leitenden Metall.

f.silverweave = Ein St\u00fcck Stoff, in das wertvolles Metall eingewoben ist. Es ist sehr \
  prunkvoll und bietet zugleich guten Schutz.

f.sinful_brew = Ein giftiger Trank der von allen D\u00e4monen gesch\u00e4tzt wird. Trotz seiner \
  weiten Verbreitung ist er in der Unterwelt offiziell verboten - aus marketingtechnischen Gr\u00fcnden.

f.snarbostuffing = Dicker, flauschiger F\u00fcllstoff aus eines speziellen Polymer, das nicht \
  auseinanderf\u00e4llt, wenn es dem verfluchten Fell des Snarbolax ausgesetzt wird. Es ist \
  perfekt daf\u00fcr, Troph\u00e4en zu bauen oder auch hinreissende, verfluchte Stofftiere.

f.soul_dust = Der Staub der Verstorbenen. Ob er noch eine Spur ihrer Seelen enth\u00e4lt, wird man sehen.

f.spark_plug = Ein kleines, technisches Bauteil das den Motor eines Konstrukts so richtig auf \
  Touren bringt.

f.spoiled_treat = Furchtbare Magenschmerzen erwarten die, die sich an diese miefigen \u00dc\
  berbleibsel vergangener Winterfeste wagen.

f.storm_chaser = Ein seltenes Elementar, das man in Sturmwolken schwebend finden kann. Ihr \
  elektrisches Summen l\u00e4sst einen beinahe melodi\u00f6sen Chor entstehen, der zwischen den \
  Donnerschl\u00e4gen leise h\u00f6rbar ist.

f.sulfur = Ein stinkender, stygischer Schwefelstein aus der Unterwelt.

f.static_clinger = Ein gebundener Energiestrang, der durch das Uhrwerk schwebt und st\u00e4ndig \
  an Haaren und Kleidung h\u00e4ngen bleibt. Er ist zu gro\u00df, als dass man daraus wirklich \
  Energie destillieren k\u00f6nnte, aber sehr n\u00fctzlich in der Alchemie.

m.supply_pack_compact = Kompaktes Versorgungspaket
f.supply_pack_compact = Ein Paket voll n\u00fctzlicher Versorgungsg\u00fcter, die von \
  Forschungs-Teams der Spiral Knights, die tief unten im Uhrwerk arbeiten, sehr gesch\u00e4tzt \
  werden. Dieses kompakte Paket enth\u00e4lt genug, um einen einzelnen Knight eine Woche lang \
  zu versorgen.

m.supply_deluxe_compact = Deluxe-Versorgungspaket
f.supply_deluxe_compact = Ein Paket voll n\u00fctzlicher Versorgungsg\u00fcter, die von \
  Forschungs-Teams der Spiral Knights, die tief unten im Uhrwerk arbeiten, sehr gesch\u00e4tzt \
  werden. Dieses Deluxe-Paket enth\u00e4lt genug, um eine ganze Truppe Knights eine Woche lang \
  zu versorgen.

m.supply_standard_compact = Standard-Versorgungspaket
f.supply_standard_compact = Ein Paket voll n\u00fctzlicher Versorgungsg\u00fcter, die von \
  Forschungs-Teams der Spiral Knights, die tief unten im Uhrwerk arbeiten, sehr gesch\u00e4tzt \
  werden. Dieses Standard-Paket enth\u00e4lt genug, um einige Knights eine Woche lang zu \
  versorgen.

f.sun_silver = Ein aussergew\u00f6hnliches Metall, durchdrungen vom strahlenden Licht des \
  Himmels.

f.swordstone = Ein sch\u00f6ner Brocken nat\u00fcrlichen Steins, mit dem sich perfekt eine \
  Klinge sch\u00e4rfen l\u00e4sst.

f.thunderball = Eine Sph\u00e4re reiner Elektrizit\u00e4t, wie sie auf dem Grund des Meeres zu \
  finden ist.

f.torchstone = Ein kleiner, st\u00e4ndig schwelender Stein. Gremlins, die in den Cooling \
  Chambers auf Patrouille sind, benutzen sie manchmal als Handw\u00e4rmer.

f.toxic_core = Ein solider, pulsierender Klumpen, aus dem Vitriol trieft.

f.trojan_horseshoe = Ein pechschwarzes Hufeisen. Es erscheint recht harmlos.

f.unstable_core = Ein beunruhigender Brocken, der einem geladenen Gegner entrissen wurde. Er \
  summt bedrohlich.

f.valestone_shard = Ein Valestone-Splitter, der zu klein ist, um Tore zu betreiben, aber f\u00fc\
  r alchemische Zwecke von Nutzen sein kann.

f.vile_seal = Ein kleiner Fetzen Pergament der von dunkler Magie durchzogen ist. Es wird \
  angenommen, dass er denjenigen mit einer b\u00f6sen Seele Macht verleiht.

f.volcanic_iron = Ein aussergew\u00f6hnliches Metall, durchdrungen von der feurigen Energie des \
  Magma.

f.volt_oil = Eine glitschige Substanz, die immer leicht elektrisch geladen ist.

f.warp_dust = Ein feiner Staub, der zur\u00fcckbleibt, wenn eine Kreatur sich mit unglaublicher \
  Geschwindigkeit bewegt. Schmeckt auch toll in Dips.

f.waste_module = Ein kleiner Beh\u00e4lter, der einmal den Unrat einer Maschine aufgefangen \
  hat, die daf\u00fcr konstruiert war Verw\u00fcstungen anzurichten. Jetzt stinkt er einfach \
  nur.

f.wicked_idol = Eine von vielen kleinen Statuen, die D\u00e4monen mit sich herumtragen, um die \
  gunst ihrer dunklen G\u00f6tter zu sichern. Die wertvollsten sind 'MIBB' (Minzpastillen in b\u00f6ser Box).

f.wicked_whisker = Ein Schnurrhaar des gro\u00dfen Helden Margrel des Kat-Stammes. Sie wurden \
  urspr\u00fcnglich zur Abwehr von Owlite-Magie getragen, stehen nun aber f\u00fcr den Triumph \
  guter magischer Kr\u00e4fte \u00fcber b\u00f6se.

f.zee_core = Eine Masse mit stechendem Geruch, die von einem glibberigen Gegner stammt. Das \
  Aroma ist ein exzellentes Heilmittel f\u00fcr Schlaflosigkeit, sowie n\u00e4chtliches \
  Schniefen und Niesen.

