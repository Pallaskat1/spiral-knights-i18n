# Gear Armor names
#...................................................................................................

f.ancient_plate_mail = Eine antike R\u00fcstung, die einst von Titanen getragen worden sein \
  soll. Obgleich sie vortrefflichen Schutz bietet, macht das unglaubliche Gewicht sie schwer zu \
  tragen.

f.angelic_raiment = Eine wundersch\u00f6ne R\u00fcstung, die st\u00e4ndig schimmert, als w\u00fc\
  rde sie von der Sonne beschienen.

f.almirian_crusader_armor = Eine R\u00fcstung, die einst von der Elite der k\u00f6niglichen Wache des K\u00f6\
  nigreichs Almire getragen wurde. Ihre Elfenbeinfarbe war ein Symbol der Reinheit Almires, \
  sowohl seiner L\u00e4nder als auch der Herzen seines Volkes.

f.arcane_salamander_suit = Eine Salamander Suit, durchdrungen von magischen Kr\u00e4ften. Man \
  nimmt an sie ist aus den Vertrauten m\u00e4chtiger Hexen gefertigt.

f.armor_fallen = Die verfluchte R\u00fcstung eines Himmelswesens, das aus dem Paradies geworfen \
  wurde.

f.ash_tail_coat = Dieser fachm\u00e4nnisch geschneiderte Mantel ist selbstw\u00e4rmend und sch\u00fctzt seinen Tr\u00e4\
  ger vor dem Einfrieren. Das Geheimnis? Eine kleine Prise Blaze Pepper.

f.azure_guardian_armor = Eine pr\u00e4chtige R\u00fcstung, die von den Anf\u00fchrern der \
  Spiral Order getragen wird. Sie ist \u00e4usserst dick und bietet guten Schutz, aber tr\u00e4\
  gt sich so angenehm wie weich fliessender Miracloth.

f.blazebreak_armor = Eine zuverl\u00e4ssige R\u00fcstung, die selbst gegen das feurigste \
  Temperament sch\u00fctzt - und gegen Feuer ebenfalls.

f.black_kat_cloak = Ein grob gearbeiteter Umhang der dem Aussehen eines Sappeurs des vom Ungl\u00fc\
  ck verfolgten Kat-Stammes nachempfunden ist.

f.black_kat_mail = Eine beeindruckende R\u00fcstung die von der Macht der Kat Napper, der \
  Undercover-Schl\u00e4ferzelle des Kat-Stammes, durchdrungen ist.

f.black_kat_raiment = Ein wiedergewonnenes Gewand, randvoll mit dunkler Energie. Man sagt, sein \
  Aussehen ist dem gro\u00dfen Helden des Kat-Stammes, Margrel, nachempfunden, demjenigen, der \
  das Buch der Grauen Federn \u00f6ffnete und den Kataklysmus heraufbeschwor. Es bringt jedem, \
  der wagt es zu tragen, gro\u00dfes Ungl\u00fcck.

f.blizzbreaker_armor = Eine zuverl\u00e4ssige R\u00fcstung, die selbst gegen die k\u00e4lteste \
  Schulter - und gegen Einfrieren sch\u00fctzt.

f.bombastic_demo_suit = Eine wundervolle R\u00fcstung speziell f\u00fcr jene wenigen, die \
  Explosives gekonnt und mit Flair behandeln ... w\u00e4hrend sie versuchen, nicht selbst in \
  die Luft zu fliegen.

f.boosted_plate_mail = Eine R\u00fcstung aus Spiral-Platten mit einer integrierten \
  Energiequelle. Leider ist die R\u00fcstung dadurch nicht gerade leichter geworden.

f.brute_jelly_mail = Ein strammer Panzer aus einer schleimigen Substanz, die den \u00dcberresten besonders b\u00f6ser Glibber entstammt.

f.chaos_cloak = Ein verbotener Mantel, der seinen Tr\u00e4ger angeblich in dem namenlosen Land \
  sch\u00fctzen soll, wo alle Elemente eins werden und sich wieder verteilen.

f.charged_quicksilver_mail = Eine verbesserte Quicksilver Mail, genau richtig f\u00fcr spannungsgeladene K\u00e4mpfe.

f.chroma_suit = Ein Anzug aus der Haut eines Chromalisk. \u00dcberraschenderweise scheinen \
  Chromalisks die Existenz solcher R\u00fcstungen schmeichelhaft zu finden.

f.circuit_breaker_armor = Eine R\u00fcstung mit einem gehackten Elementarkern, um Schocks \
  widerstehen zu k\u00f6nnen. Diese ungew\u00f6hnliche Modifizierung sorgt allerdings f\u00fcr andere elementare Schw\u00e4chen.

f.cobalt_armor = Eine herausragende R\u00fcstung des Spiral Order, die f\u00fcr jedes Abenteuer \
  geeignet ist.

f.deadly_virulisk_suit = Ein feiner Anzug aus der Haut der t\u00f6dlichsten Virulisks. Leider \
  besitzt er nicht mehr die F\u00e4higkeit der Virulisks, sich zu tarnen.

f.deadshot_mantle = Ein Poncho f\u00fcr einen fahlen Reiter, dessen einziges Ziel es ist, die b\u00f6sen, h\u00e4\
  sslichen, untoten Wesen der Dunkelheit zu jagen.

f.deep_sea_cuirass = Eine R\u00fcstung aus schillernden Schuppen, die sich scheinbar wie \
  schimmernde Wellen bewegen. Die R\u00fcstung ist ziemlich unbequem, da sie st\u00e4ndig kalt und nass ist.

f.divine_mantle = Ein g\u00f6ttlicher Mantel, der einst von Weisen des Himmels getragen worden \
  sein soll.

f.dragon_scale_mail = Eine mystische R\u00fcstung aus den Schuppen einer legend\u00e4ren Kreatur.

f.drake_scale_mail = Eine R\u00fcstung aus den Schuppen von Kreaturen, die von den Drachen \
  abstammen sollen.

f.dread_skelly_suit = Der angsteinfl\u00f6\u00dfendste Skelly Suit der Welt. Diese grausigen \
  Klamotten sind nichts zum Lachen!

f.dusker_coat = Ein warmer Abenteurermantel, der dich mit der Kraft eines Alpha Dusker \
  zuschlagen l\u00e4sst.

f.elemental_cloak = Eine feine Robe mit zahllosen eingewebten Symbolen, die elementaren Schutz \
  bieten.

f.emberbreak_armor = Eine R\u00fcstung mit einem gehackten Elementarkern, um Feuer widerstehen \
  zu k\u00f6nnen. Diese ungew\u00f6hnliche Modifizierung sorgt allerdings f\u00fcr andere elementare Schw\u00e4chen.

f.fencing_jacket = Ein locker sitzender Uniformrock, besonders beliebt bei jungen Fechtern.

f.firebreak_armor = Verbesserte Emberbreak Armor, die noch besser gegen Feuer sch\u00fctzt.

f.frostbreaker_armor = Eine R\u00fcstung mit einem gehackten Elementarkern, um Einfrieren \
  widerstehen zu k\u00f6nnen. Diese ungew\u00f6hnliche Modifizierung sorgt allerdings f\u00fcr andere elementare Schw\u00e4chen.

f.fused_demo_suit = Eine verbesserte Demo Suit, die den instabilen Kern eines m\u00e4chtigen Explosionsw\u00fcrfels enth\u00e4\
  lt. Dennoch kann sich der Tr\u00e4ger mit diesem Anzug sehr sicher f\u00fchlen.

f.grey_feather_mantle = Ein Mantel f\u00fcr geachtete Owlite-Scholaren. Dieser Federmantel \
  steckt voller Weisheit vergangener Zeitalter... und ist extraweich!

f.groundbreaker_armor = Eine R\u00fcstung, getragen von Knights, die unter den ersten waren, \
  die mutig die Tiefen des Uhrwerks erforscht haben.

f.gunslinger_sash = Diese Sch\u00e4rpen wurden in l\u00e4ngst vergangenen Zeiten von Sch\u00fc\
  tzen getragen. Sie riechen nach Rohleder, Pulverdampf und Action.

f.heavenly_iron_armor = Eine m\u00e4chtige R\u00fcstung, von der behauptet wird, sie wurde aus \
  den Schilden von Engeln gefertigt. Sie vereint viele der g\u00f6ttlichen Eigenschaften \
  himmlischer Wesenheiten, aber ihr fehlt deren Schw\u00e4che gegen\u00fcber Feuer.

f.heavy_demo_suit = Verst\u00e4rkte R\u00fcstung f\u00fcr Sprengstoffexperten.

f.heavy_plate_mail = Dicke R\u00fcstung mit mehr Metallplatten als ein Verkaufsautomat im \
  Uhrwerk. Ein bisschen unbequem.

f.icebreaker_armor = Verbesserte Frostbreaker Armor, die noch besser gegen Einfrieren sch\u00fctzt.

f.ice_queen_mail = Eine k\u00f6nigliche R\u00fcstung, nachempfunden der ewig-k\u00fchlen Eisk\u00f6nigin. Zus\u00e4\
  tzlich dazu, dass sie gro\u00dfartigen Schutz bietet, wird auch behauptet, dass sie das Ego \
  des Tr\u00e4gers gewaltig aufplustert und k\u00fchle Distanziertheit zwischen ihm und denen \
  um ihn herum schafft.

f.ignition_armor = Eine leichte R\u00fcstung, die verbessert wurde, um Knights, die sich in \
  hitzige Gefechte begeben zu sch\u00fctzen.

f.ironmight_plate_mail = Ein exzellenter Plattenpanzer aus einer Legierung, die aus zahlreichen \
  seltenen Metallen besteht. Er ist steif aber unglaublich stark.

f.jelly_mail = Eine platschende R\u00fcstung aus glibberigem Schleim, der vor Stil nur so \
  trieft.

f.justifier_jacket = Ein fein gearbeiteter Anzug f\u00fcr gefahrsuchende Revolverhelden, die \
  lieber schnell als tot sind.

f.kat_claw_cloak = Ein grob gearbeiteter Umhang der dem Aussehen eines halsabschneiderischen \
  Kriegers des vom Ungl\u00fcck verfolgten Kat-Stammes nachempfunden ist.

f.kat_claw_mail = Eine beeindruckende R\u00fcstung die von der Macht der Kat Clawer, den \
  furchterregenden Frontlinienk\u00e4mpfern des Kat-Stammes, durchdrungen ist.

f.kat_claw_raiment = Ein wiedergewonnenes Gewand von dem man sagt, es sei dem Aussehen des \
  Helden Scaith des Kat-Stammes nachempfunden, dem ersten, der die Mauern der \
  Owlite-Magierakademie \u00fcberwunden hat.

f.kat_eye_cloak = Ein grob gearbeiteter Umhang, der dem Aussehen eines Meistersch\u00fctzen des vom Ungl\u00fc\
  ck verfolgten Kat-Stammes nachempfunden ist.

f.kat_eye_mail = Eine beeindruckende R\u00fcstung, die von der Macht der Kat Seeker, den \
  begabten Grenadieren des Kat-Stammes, durchdrungen ist.

f.kat_eye_raiment = Ein wiedergewonnenes Gewand von dem man sagt, es sei dem Aussehen des \
  Helden Preowa des Kat-Stammes nachempfunden, dessen Artillerie die gro\u00dfen Weisen der \
  Grey-Feather-T\u00fcrme verstummen lie\u00df.

f.kat_hiss_cloak = Ein grob gearbeiteter Umhang, der dem Aussehen eines Meistersch\u00fctzen des vom Ungl\u00fc\
  ck verfolgten Kat-Stammes nachempfunden ist.

f.kat_hiss_mail = Eine beeindruckende R\u00fcstung, die von der Macht der Kat Hisser, den \
  instabilen Bombern des Kat-Stammes, durchdrungen ist.

f.kat_hiss_raiment = Ein wiedergewonnenes Gewand von dem man sagt, es sei dem Aussehen des \
  Helden Torair des Kat-Stammes nachempfunden, der sich an die Tore der Owlite-Akademie \
  klammerte, als sowohl er als auch sein Sprengstoff brannten.

f.mad_bomber_suit = Manche Leute sind wie die Axt im Walde. Andere wissen, wie man Spitzen \
  abschiesst. Diese R\u00fcstung hier ist f\u00fcr all jene, mit besonders explosivem \
  Temperament.

f.magic_cloak = Eine magische Robe, getragen von Lehrlingen der Zauberkunst.

f.mercurial_demo_suit = Eine mit Gremlin-Technologie erstellte Demo Suit. Gemacht f\u00fcr den \
  Bomben-Nutzer, der mehr Schnelligkeit, mehr Kraft und eine deutlich verringerte Chance \
  darauf, an einem Elektroschock zu sterben, m\u00f6chte.. was vermutlich jeder Bomben-Nutzer \
  da drau\u00dfen ist.

f.mercurial_mail = Eine \u00fcberragende, silberne R\u00fcstung, die deinen Schritten Schwung \
  verleihen wird und Schocks von dir fernh\u00e4lt.

f.mighty_cobalt_armor = Eine fortgeschrittene Spiral-Knight-R\u00fcstung, in die mit viel \
  Geschick die neueste Uhrwerk-Technologie eingearbeitet ist.

f.miracle_cloak = Ein wundersamer Mantel, von dem man sagt, er gew\u00e4hre seinem Tr\u00e4ger \
  genau dann ein einziges Wunder, wenn er es am meisten braucht.

f.nameless_poncho = Ein namenloser Poncho, der von einem namenlosen, legend\u00e4ren Helden \
  getragen wurde.

f.padded_armor = Eine locker sitzende, leichte R\u00fcstung, die normalerweise von \
  Revolverhelden getragen wird.



f.pathfinder_armor = Eine n\u00fctzliche R\u00fcstung f\u00fcr die Verfolgung von Spuren und \
  als Schutz vor den Bissen hungriger Monster draussen in der Wildnis.

f.plated_pathfinder_armor = Eine geh\u00e4rtete R\u00fcstung, gemacht um selbst vor den gefr\u00e4\u00dfigsten Monster zu sch\u00fctzen, w\u00e4\
  hrend man das Unbekannte erforscht.

f.plated_sentinel_armor = Eine R\u00fcstung die mit Gremlin-Platten verst\u00e4rkt wurde, um \
  Schutz vor einer Reihe gef\u00e4hrlicher Elemente zu bieten.

f.plated_shade_armor = Ein Anzug aus d\u00e4monischem Stoff, verwoben mit dunkler Materie, um \
  den Tr\u00e4ger zu verbergen, w\u00e4hrend er in verborgenen Winkeln herumschleicht.

f.quicksilver_mail = Ein ausgezeichneter Panzer, der aus etwas gemacht wurde, das fr\u00fcher \
  mal ein Quicksilver war.



f.radiant_silvermail = Eine verbesserte Silvermail, die selbst in den dunkelsten Stunden in \
  hellem Glanz erstrahlt.

f.rock_jelly_mail = Diese glitschige R\u00fcstung vereint die Festigkeit von Stein mit dem \
  einmaligen Schutz vor Perforation, wie ihn nur klebriger Schleim bieten kann. Es ist ein \
  Wunder, dass du den Glibber besiegen konntest, aus dem die R\u00fcstung gemacht wurde.

f.royal_jelly_mail = Eine b\u00f6sartig boshafte R\u00fcstung, die akribisch aus den nobelsten \
  Glibbern dieser Welt gefertig wurde.

f.sacred_ghost_armor = Eine spektrale R\u00fcstung, gemacht f\u00fcr diejenigen, die gern \
  Gewehre auf Geister richten.

f.sacred_guerrilla_armor = Eine robuste R\u00fcstung f\u00fcr diejenigen, die ein paar Bestien \
  erlegen wollen.

f.sacred_hazard_armor = Eine stabile R\u00fcstung f\u00fcr diejenigen, die Glibber abschie\u00dfen wollen.

f.sacred_hex_armor = Eine geisterhafte R\u00fcstung f\u00fcr diejenigen, die auf das \
  Infernalische zielen.

f.sacred_keeper_armor = Eine himmelblaue R\u00fcstung f\u00fcr diejenigen, die ein paar Roboter \
  zerlegen wollen.

f.sacred_pathfinder_armor = Eine verst\u00e4rkte, doppelt wattierte R\u00fcstung, die auch die sch\u00e4\
  rfsten Gegner aufhalten sollte.

f.sacred_sentinel_armor = Eine gl\u00e4nzende, doppelt gewebte R\u00fcstung zur Verteidigung \
  gegen die Launen der Elemente.

f.sacred_shade_armor = Eine schattenhafte R\u00fcstung, die dazu gebaut wurde, alles zu \u00fc\
  berdauern was aus den Schatten gekrochen kommt.

f.sacred_wraith_armor = Eine unersch\u00fctterliche R\u00fcstung f\u00fcr diejenigen, die gern \
  auf Gremlins schie\u00dfen.

f.salamander_suit = Ein Anzug aus Salamanderhaut. Er gew\u00e4hrt seinem Tr\u00e4ger den nat\u00fc\
  rlichen Schutz vor Feuer, der dem Salamander eigen ist.

f.scary_skelly_suit = Ein verbesserter Skelly Suit, in dem die elementare Essenz der Angst \
  steckt. Zu ihm geh\u00f6ren passende Hosen, die nicht gleich voll sind.

f.sentinel_armor = Eine R\u00fcstung die von einer Macht durchdrungen ist, die zahlreichen \u00dc\
  bel abzuwehren, denen ein Knight im Dienst begegnen mag.

f.seraphic_mail = Ein wundersch\u00f6ner Panzer, der seinen Tr\u00e4ger mit rechtschaffenem \
  Zorn gegen das B\u00f6se erf\u00fcllt.

f.shade_armor = Eine R\u00fcstung, die mit dunkler Materie durchzogen ist und ihrem Tr\u00e4ger \
  erlaubt, zielgenau zu schie\u00dfen und Feinde aus dem Schatten heraus zu \u00fcberraschen.

f.shadowsun_slicker = Ein b\u00f6sartiger Mantel, dem eine gro\u00dfe Macht innewohnen soll, \
  die sich an den unvergebenen S\u00fcnden des Tr\u00e4gers g\u00fctlich tut.

f.silvermail = Eine starke und dennoch leichte R\u00fcstung f\u00fcr Knights, die einen Eid \
  geschworen haben, die Untoten zu jagen und zu vernichten, wo auch immer sie lauern m\u00f6gen.

f.sinister_skelly_suit = Eine knochiger Panzer, der vor Fiesheit nur so trieft. Jeder, der an \
  der Macht dieses Anzugs zweifelt, verdient eins in die Rippen.

f.skelly_suit = Ein gruseliges Outfit, das naturgem\u00e4\u00df gegen alle finsteren Angriffe \
  sch\u00fctzt.

f.skolver_coat = Das Beste, was es an Wolfshaut gibt! Dieser Mantel wurde speziell daf\u00fcr \
  gefertigt, deinen Nahkampfangriffen extra Kraft zu geben.

f.snarbolax_coat = Ein schattenhafter Anzug, gefertigt aus der Haut eines d\u00fcsteren \
  Snarbolax. Selbst sie zu genau anzusehen, ist gef\u00e4hrlich.

f.solid_cobalt_armor = Eine feste Cobalt Armor, die bequemer zu tragen ist und noch mehr Schutz \
  bietet.

f.spiral_brigandine = Eine leichte R\u00fcstung f\u00fcr alle Rekruten der Spiral Knights.

f.spiral_cuirass = Eine leichte R\u00fcstung f\u00fcr alle Rekruten der Spiral Knights.

f.spiral_culet = Eine leichte R\u00fcstung f\u00fcr alle Rekruten der Spiral Knights.

f.spiral_flak_jacket = Leichte R\u00fcstung, die an alle Rekruten der Spiral Knights vergeben \
  wird.

f.spiral_draped_armor = Leichte R\u00fcstung, die an alle Rekruten der Spiral Knights vergeben \
  wird.

f.spiral_cloak = Leichte R\u00fcstung, die an alle Rekruten der Spiral Knights vergeben wird.

f.spiral_demo_suit = Eine robuste R\u00fcstung f\u00fcr Knights mit einem Hang zur Explosivit\u00e4t.

f.spiral_plate_mail = Schwere R\u00fcstung aus Eisenplatten, die zahlreichen gew\u00f6hnlichen \
  Angriffen widerstehen kann.

f.spiral_scale_mail = Ein widerstandsf\u00e4higer leichter Schuppenpanzer, der Schutz vor \
  perforierenden Angriffen bietet



f.sunset_duster = Ein fester Ledermantel f\u00fcr einen Wanderer mit wahrem Schneid.

f.surge_breaker_armor = Eine zuverl\u00e4ssige R\u00fcstung, die selbst gegen die \
  schockierendsten Erlebnisse sch\u00fctzt - und gegen elektrische Angriffe ebenfalls.

f.tri_guard_armor = Eine besondere R\u00fcstung, speziell entworfen f\u00fcr Knights, die auf \
  fremden Planeten die ersten Erkundungen durchf\u00fchren. Dieser robuste Anzug sch\u00fctzt \
  vor einer Vielzahl rauher Wetterbedingungen.

f.valkyrie_mail = Eine R\u00fcstung von unsch\u00e4tzbarem Wert, deren Namen die Kreaturen der \
  Unterwelt nicht auszusprechen wagen.

f.virulisk_suit = Eine dicke R\u00fcstung aus dem Kadaver eines Virulisk. Ihr Tr\u00e4ger wird \
  etwas von der Giftresistenz des Virulisks \u00fcbernehmen - und seine Vorliebe f\u00fcr Pudding.

f.vitasuit = Ein spezieller Anzug, der seinem Tr\u00e4ger einen herzlichen Lebensenergiebonus \
  gew\u00e4hrt.

f.vitasuit_deluxe = Vier von f\u00fcnf Spiral-Heilern empfehlen den t\u00e4glichen Gebrauch \
  dieser R\u00fcstung. Der f\u00fcnfte wurde vom Tortodrone zerquetscht.

f.vitasuit_plus = Ein Hightech-Panzer, der seinen Tr\u00e4ger mit unz\u00e4hligen \
  gesundheitlichen Vorteilen unterst\u00fctzt, wie zus\u00e4tzlicher Lebensenergie, gl\u00e4\
  nzenderem Haar und frischerem Atem.

f.vog_cub_coat = Dieser Ledermantel ist so feuerfest, dass sein Geruch nach verbranntem Holz \
  kaum ins Gewicht f\u00e4llt.

f.volcanic_demo_suit = Schutzanzug f\u00fcr den modernen Sprengmeister. Das interne K\u00fchlsystem f\u00fc\
  hlt sich ein wenig an als w\u00e4rst du im Cryoschlaf gewesen.

f.volcanic_plate_mail = Ein \u00fcberragender Plattenpanzer, durchdrungen von der elementaren \
  Essenz der Flamme, dazu entworfen gewaltigen Einschl\u00e4gen zu widerstehen.

f.volcanic_salamander_suit = Ein mit harten Platten aus Volcanic Iron verst\u00e4rkter \
  Salamander Suit. Er bietet extrem guten Schutz und l\u00e4sst sich bei langen Eins\u00e4tzen auch als behelfsm\u00e4\u00dfiger Herd verwenden.

f.volt_breaker_armor = Verbesserte Circuit Breaker Armor, die noch besser gegen Schock sch\u00fctzt.

f.wolver_coat = Ein dicker Mantel zum Schutz deiner Haut von einem Wolver, der seine nicht \
  retten konnte.

f.woven_pathfinder_armor = Eine flexible R\u00fcstung, die auf Beweglichkeit ausgelegt ist und \
  durchzogen ist von Glibber-Fasern, um Schutz vor stacheligen und dornigen Gegnern zu bieten.

f.woven_sentinel_armor = Eine R\u00fcstung, die mit gewobenem Wolver-Haar verst\u00e4rkt wurde, \
  um auch den widrigsten Elementen zu trotzen.

f.woven_shade_armor = Eine locker sitzende R\u00fcstung, die es dem Tr\u00e4ger erm\u00f6\
  glicht, durch die Schatten zu huschen und unaufmerksame Feinde zu \u00fcberrumpeln.

f.wyvern_scale_mail = Extreme Temperaturen sind notwendig, um diese feine R\u00fcstung zu \
  schmieden. Sie besteht aus den Schuppen seltener Kreaturen aus dem Uhrwerk.

# Gear Helm names
#...................................................................................................


f.almirian_crusader_helm = Ein Helm, der einst von der Elite der k\u00f6niglichen Wache des K\u00f6\
  nigreichs Almire getragen wurde. Seine Elfenbeinfarbe war ein Symbol der Reinheit Almires, \
  sowohl seiner L\u00e4nder als auch der Herzen seines Volkes.

f.arcane_salamander_mask = Eine Salamander Mask, durchdrungen von magischen Kr\u00e4ften. Man \
  nimmt an sie ist aus den Vertrauten m\u00e4chtiger Hexen gefertigt.

f.ancient_plate_helm = Ein einfacher Helm, dessen Gewicht ihn nur f\u00fcr die St\u00e4rksten geeignet macht.

f.angelic_helm = Ein wundersch\u00f6ner Helm, der an einen Himmelsw\u00e4chter erinnert.

f.ash_tail_cap = Eine warme Kappe aus Tierhaut und mit Blaze Pepper gegerbt. Sie riecht ein \
  wenig nach Curry.

f.azure_guardian_helm = Ein edler Helm f\u00fcr die erfahrensten Mitglieder des Spiral Order. \
  Die Technik, mit der Drachenschuppen nahtlos mit dem Metall verbunden werden, ist ein wohlbeh\u00fctetes Geheimnis.

f.black_kat_hood = Eine grob gearbeitete Kapuze die dem Aussehen eines schattenhaften Sappeurs \
  des vom Ungl\u00fcck verfolgten Kat-Stammes nachempfunden ist.

f.black_kat_mask = Eine beeindruckende Maske, die von der Macht der Kat Napper, der \
  Undercover-Schl\u00e4ferzelle des Kat-Stammes.

f.black_kat_cowl = Eine verfluchte Kapuze, die vor dunkler Energie flirrt. Man sagt, sie stelle \
  den gro\u00dfen Helden des Kat-Stamms, Margel, dar, der das Buch der grauen Federn ge\u00f6\
  ffnet und den Kataclysmus verursacht hat. Sie bringt jedem gro\u00dfes Ungl\u00fcck, der sie \
  zu tragen wagt.

f.blazebreak_helm = Ein zuverl\u00e4ssiger Helm, der besonders n\u00fctzlich ist, wenn es heiss \
  hergeht.

f.blizzbreaker_helm = Ein zuverl\u00e4ssiger Helm, der dich in kritischen Situationen vor dem \
  Einfrieren bewahrt.

f.bombastic_demo_helm = Ein gut gearbeiteter Helm f\u00fcr anspruchsvolle Sprengstoffexperten. \
  Er wird dir nicht verraten, welcher Wein am besten zu Nitronome passt, aber l\u00e4sst Deinen \
  Kopf gut aussehen. Und sorgt daf\u00fcr, dass er in einem St\u00fcck bleibt.

f.boosted_plate_helm = Ein Spiral Plate Helm mit einer integrierten Energiequelle. Leider schr\u00e4\
  nkt er dein Sichtfeld betr\u00e4chtlich ein.

f.brute_jelly_helm = Ein robuster Helm aus ungemein b\u00f6sartigem Schleim.

f.chaos_cowl = Eine Kapuze von zweifelhafter Herkunft, die ihren Tr\u00e4ger gleichzeitig in \
  Geheimnisse h\u00fcllt und ihm Elementarschutz gew\u00e4hrt.

f.charged_quicksilver_helm = Ein verbesserter Quicksilver Helm, genau richtig f\u00fcr den \
  Kampf gegen elektrische Feinde.

f.chroma_mask = Eine Maske aus der Haut eines Chromalisk, die ihrem Tr\u00e4ger dessen \
  einzigartiges Aussehen verleiht.

f.circuit_breaker_helm = Ein Spiral Helm, der zus\u00e4tzlichen Schutz gegen Schock bietet - \
  auf Kosten der Schutzwirkung gegen Feuer und Einfrieren.

f.cobalt_helm = Ein herausragender Helm des Spiral Order, der f\u00fcr jedes Abenteuer geeignet \
  ist.

f.crown_fallen = Die verfluchte Krone eines Himmelswesens, das aus dem Paradies geworfen wurde.

f.cyclops_cap = Ein seltsamer Helm mit einem einzelnen Auge, der besonders unter jungen \
  Kanonieren beliebt ist.

f.deadly_virulisk_mask = Eine Virulisk Mask, die mit einem verbesserten Giftfilter ausgestattet \
  ist. Sie riecht innen immer irgendwie nach k\u00fcnstlichen Kiefernnadeln.

f.deadshot_chapeau = Ein mythischer Hut f\u00fcr all jene, die niemals ihr Ziel verfehlen. Er \
  soll aus zuvor vergrabenem Material bestehen.

f.divine_veil = Eine g\u00f6ttliche Kapuze, der einst von Weisen des Himmels getragen worden \
  sein soll.

f.dragon_scale_helm = Ein mystischer Helm aus den Schuppen einer legend\u00e4ren Kreatur.

f.drake_scale_helm = Ein Helm aus den Schuppen von Kreaturen, die von den Drachen abstammen \
  sollen.

f.dread_skelly_mask = Eine schaurige Kopfbedeckung, die deinen Sch\u00e4del selbst vor den m\u00e4\
  chtigsten Schattenangriffen sch\u00fctzt.

f.dusker_cap = Ein Lederhelm f\u00fcr Knights, die ihren Gegnern am liebsten Auge in Auge gegen\u00fcberstehen.

f.elemental_hood = Eine mystische Maske f\u00fcr magische K\u00e4mpfer, die betr\u00e4chtlichen \
  Schutz vor den Elementen bietet.

f.emberbreak_helm = Ein Spiral Helm, der zus\u00e4tzlichen Schutz gegen Feuer bietet - auf \
  Kosten der Schutzwirkung gegen Schock und Einfrieren.

f.feral_kat_hood = Eine einfach aussehende Kapuze, die an ein wildes Tier erinnern soll.

f.firebreak_helm = Ein Emberbreak Helm, der noch besseren Schutz gegen Feuer bietet.

f.firefighter_helmet = Dieser Helm wird normalerweise von Feuerwehrm\u00e4nnern getragen. Er \
  bietet nicht viel Schutz, aber er gew\u00e4hrt seinem Tr\u00e4ger hohen Widerstand gegen \
  Feuer.

f.frostbreaker_helm = Ein Spiral Helm, der zus\u00e4tzlichen Schutz gegen Einfrieren bietet - \
  auf Kosten der Schutzwirkung gegen Feuer und Schock.

f.fused_demo_helm = Ein verbesserter Demo Helm, der mit dem gef\u00e4hrlichen, instabilen Kern \
  eines m\u00e4chtigen Blast Cube verbunden wurde. Er l\u00e4sst ein unangenehmes Summen in \
  deinen Ohren ert\u00f6nen.

f.grey_feather_cowl = Eine samtweiche Kapuze f\u00fcr Gelehrte, die sich ins Abenteuer st\u00fc\
  rzen wollen. Sie ist weicher als das teuerste Kissen und bietet dennoch betr\u00e4chtlichen Schutz.

f.groundbreaker_helm = Ein robuster Helm, getragen von Knights, die unter den ersten waren, die \
  mutig die Tiefen des Uhrwerks erforscht haben.

f.gunslinger_hat = Eine fein gearbeitete Kopfbedeckung, die von pistolenschwingenden K\u00e4\
  mpfern aus einer vergessenen Zeit getragen wurde. Sie eignet sich bestens f\u00fcr Duelle und die Reise \u00fcber weite Ebenen.

f.heavenly_iron_helm = Ein m\u00e4chtiger Helm, von dem behauptet wird, er wurde aus den \
  Schilden von Engeln gefertigt. Er vereint viele der g\u00f6ttlichen Eigenschaften himmlischer \
  Wesenheiten, aber ihm fehlt deren Schw\u00e4che gegen\u00fcber Feuer.

f.heavy_demo_helm = Ein verst\u00e4rkter Helm, der \u00e4usserst hilfreich sein k\u00f6nnte \
  wenn du, Meister der Explosionen, ihn bei dir hast.

f.heavy_plate_helm = Ein robuster Helm, der betr\u00e4chtlichen Schutz gegen konventionelle \
  Waffen bietet. Er riecht ein wenig nach Schwei\u00df.

f.icebreaker_helm = Ein Frostbreaker Helm, der noch besseren Schutz gegen Einfrieren bietet.

f.ice_queen_crown = Eine k\u00f6nigliche Krone, nachempfunden der der ewig-k\u00fchlen Eisk\u00f6nigin. Zus\u00e4\
  tzlich dazu, dass sie gro\u00dfartigen Schutz bietet, wird auch behauptet, dass sie das Ego \
  des Tr\u00e4gers gewaltig aufplustert und k\u00fchle Distanziertheit zwischen ihm und denen \
  um ihn herum schafft.

f.ignition_helm = Ein leichter Helm, der verbessert wurde, damit er es Knights auch unter Druck \
  erm\u00f6glicht, einen k\u00fchlen Kopf zu bewahren.

f.industrial_hard_hat = Dieser Helm wird normalerweise von Bauarbeitern getragen. Er bietet \
  nicht viel Schutz, aber er gew\u00e4hrt seinem Tr\u00e4ger hohen Widerstand gegen Bet\u00e4ubung.

f.ironmight_plate_helm = Ein exzellenter Plattenhelm aus einer Legierung, die aus zahlreichen \
  seltenen Metallen besteht. Er schr\u00e4nkt zwar die Sicht des Tr\u00e4gers ein wenig ein, \
  aber er ist nahezu undurchdringlich.

f.jaws_megalodon = Ein furchterregender Helm, der an ein Tiefseemonster erinnert.

f.jelly_helm = Gallertartige Kopfbedeckung aus glibberigen W\u00e4chtern.

f.justifier_hat = Ein fein gearbeiteter Hut f\u00fcr Schusswaffenexperten, die nichts davon \
  halten, etwas mehr Geld f\u00fcr bessere Ausr\u00fcstung auszugeben.

f.kat_claw_hood = Eine plump gemachte Kappe, die einen halzabschneiderischen Krieger des \
  Kat-Stamms darstellen soll.

f.kat_claw_mask = Eine eindrucksvolle Maske, der die Macht der Kat Clawers, den furchtbaren \
  Frontk\u00e4mpfern des Kat-Stamms, innewohnt.

f.kat_claw_cowl = Eine herrlich gemachte Kapuze, die den Helden des Kat-Stamms, Scraith, \
  darstellt, der als erster die W\u00e4nde der hohen Owlite-Akademie der Magie \u00fcberwunden hat.

f.kat_eye_hood = Eine plump gemachte Kappe, die einen Sch\u00fctzen des Kat-Stamms darstellen \
  soll.

f.kat_eye_mask = Eine eindrucksvolle Maske, der die Macht der Kat Seekers, den geschickten \
  Grenadieren des Kat-Stamms, innewohnt.

f.kat_eye_cowl = Eine herrlich gemachte Kapuze, die den Helden des Kat-Stamms, Preowa, \
  darstellt, dessen Artillerie die Graufeder-Turm-Weisen verstummen lies.

f.kat_hiss_hood = Eine plump gemachte Kappe, die einen temperamentvollen Krieger des Kat-Stamms \
  darstellen soll.

f.kat_hiss_mask = Eine eindrucksvolle Maske, der die Macht der Kat Hissers, den instabilen \
  Bombern des Kat-Stamms, innewohnt.

f.kat_hiss_cowl = Eine herrlich gemachte Kapuze, die den Helden des Kat-Stamms, Torair, \
  darstellt, der sich an die Tore der hohen Owlite-Akademie der Magie klammerte, w\u00e4hrend \
  sowohl sie als auch seine Bomben brannten.

f.mad_bomber_mask = Ein fester Helm, der vor Explosionen, Radiowellen und \
  Hightech-Gedankenkontrolle sch\u00fctzt. Wenigstens *wollen* sie, dass du das glaubst.

f.magic_hood = Eine verzauberte Kapuze f\u00fcr Knights mit der Gabe der Weissagung und einem \
  Hang zur Zauberei.

f.mercurial_demo_helm = Ein mit Gremlin-Technologie erstellter Demo Helm. Gemacht f\u00fcr den \
  Bomben-Nutzer, der mehr Schnelligkeit, mehr Kraft und eine deutlich verringerte Chance \
  darauf, an einem Elektroschock zu sterben, m\u00f6chte.. was vermutlich jeder Bomben-Nutzer \
  da drau\u00dfen ist.

f.mercurial_helm = Ein \u00fcberragender, silberner Helm, der dich so schnell dahingleiten l\u00e4\
  sst wie Wasser - wenn auch nicht genauso schnell *durch* Wasser.

f.mighty_cobalt_helm = Ein verbesserter Spiral Helm aus einer seltenen Legierung aus Moonstone \
  und Luminite.

f.mining_hat = Ein robuster, alter Helm, der einst zum Abbau wertvoller Mineralien verwendet \
  wurde. Er bietet etwas mehr Schutz als ein Spiral Helm.

f.miracle_hood = Eine wundersame Maske, von der man sagt, sie gew\u00e4hre ihrem Tr\u00e4ger \
  genau dann ein einziges Wunder, wenn er es am meisten braucht. In Wahrheit wird sie deine \
  Haut wohl mehr als einmal retten.

f.nameless_hat = Ein namenloser Hut, der von einem namenlosen, legend\u00e4ren Helden getragen \
  wurde.

f.padded_cap = Ein leichter Helm in einer Einheitsgr\u00f6\u00dfe, gemacht f\u00fcr Revolverhelden.



f.pathfinder_helm = Ein Helm, der guten Schutz auf Pfaden in gl\u00fchender Sonne und vor den \
  Bissen hungriger Monster in der Wildnis sch\u00fctzt.

f.plated_pathfinder_helm = Ein geh\u00e4rteter Helm, gemacht, um den furchtlosen Forscher zu \
  sch\u00fctzen, w\u00e4hrend er das Unbekannte erforscht.

f.plated_sentinel_helm = Ein mit Gremlin-Platten verst\u00e4rkter Helm, der vor eine Reihe gef\u00e4hrlicher Elemente sch\u00fctzt.

f.plated_shade_helm = Ein Helm aus d\u00e4monischem Material, verwoben mit dunkler Materie, \
  dazu gemacht, seinen Tr\u00e4ger zu verbergen, w\u00e4hrend er durch versteckte Winkel \
  huscht.

f.purring_cap = Eine eigenartige Kappe, die an eine Miezekatze erinnert. Sie soll ihrem Tr\u00e4\
  ger angeblich neun Leben gew\u00e4hren.

f.quicksilver_helm = Ein ausgezeichneter Helm, der aus etwas gemacht wurde, das fr\u00fcher mal \
  ein Quicksilver war.



f.rock_jelly_helm = Ein harter Helm, hergestellt aus schartigem Schleim.

f.royal_jelly_crown = Eine knochenharte Krone, k\u00fcrzlich aus Kadavern klebriger K\u00f6nigsglibber konstruiert.

f.sacred_ghost_helm = Ein gruseliger Helm f\u00fcr all jene, die gern auf Geister schie\u00dfen.

f.sacred_guerrilla_helm = Ein Helm f\u00fcr diejenigen, die Bestien erlegen wollen.

f.sacred_hazard_helm = Ein robuster Helm, der denjenigen hilft, die Glibber jagen.

f.sacred_hex_helm = Ein geisterhafter Helm f\u00fcr diejenigen, die es auf alle D\u00e4\
  monischen abgesehen haben.

f.sacred_keeper_helm = Ein himmelblau gef\u00e4rbter Helm f\u00fcr diejenigen, die Roboter \
  zerlegen wollen.

f.sacred_pathfinder_helm = Ein verst\u00e4rkter Helm, der auch die sch\u00e4rfsten Feinde \
  aufhalten sollte.

f.sacred_sentinel_helm = Eine gl\u00e4nzender, doppelt gewebter Helm zur Verteidigung gegen die \
  Launen der Elemente.

f.sacred_shade_helm = Ein Helm, der dazu gebaut wurde, alles zu \u00fcberdauern was aus den \
  Schatten gekrochen kommt.

f.sacred_wraith_helm = Ein unersch\u00fctterlicher Helm f\u00fcr diejenigen, die gern auf \
  Gremlins schie\u00dfen.

f.salamander_mask = Eine Maske aus der Haut eines Salamanders.

f.scary_skelly_mask = Eine verbesserte Skelly Mask in der die elementare Essenz der Angst \
  steckt. Wenn du sie tr\u00e4gst, stellen sich deine Nackenhaare auf.

f.sentinel_helm = Ein Helm der von einer Macht durchdrungen ist, die zahlreichen \u00dcbel \
  abzuwehren, denen ein Knight im Dienst begegnen mag.

f.seraphic_helm = Eine wundersch\u00f6ne Kettenhaube, die ihren Tr\u00e4ger mit rechtschaffenem \
  Zorn gegen das B\u00f6se erf\u00fcllt.

f.shade_helm = Ein Helm, der mit dunkler Materie durchzogen ist und seinem Tr\u00e4ger erlaubt, \
  zielgenau zu schie\u00dfen und Feinde aus dem Schatten heraus zu \u00fcberraschen.

f.shadowsun_stetson = Ein schicker Hut f\u00fcr Duellanten, die ihre Arbeit lieber um \
  Mitternacht, statt zur Mittagszeit erledigen.

f.sinister_skelly_mask = Eine verbesserte Skelly Mask, die allen r\u00fcckgratlosen Monstern im \
  Uhrwerk einen geh\u00f6rigen Schrecken einjagen sollte.

f.skelly_mask = Eine gruselige Maske, die sowohl Kinder erschreckt als auch vor \
  Schattenangriffen sch\u00fctzt.

f.skolver_cap = Eine fein gearbeitete Lederkappe, die perfekt f\u00fcr alle K\u00f6nige der \
  Wildnis geeignet ist.

f.snarbolax_cap = Ein schattenhafte Kappe, gefertigt aus der Haut eines d\u00fcsteren \
  Snarbolax. Selbst sie zu genau anzusehen, ist gef\u00e4hrlich.

f.solid_cobalt_helm = Ein robuster Cobalt Helm mit verbesserten internen Systemem und externer \
  Verst\u00e4rkung.

f.spiral_demo_helm = Ein robuster Helm f\u00fcr Knights mit einem Hang zur Explosivit\u00e4t.

f.spiral_pith_helm = Ein leichter Helm f\u00fcr alle Rekruten der Spiral Knights.

f.spiral_plate_helm = Ein schwerer Helm aus Eisen, der vor bet\u00e4ubenden St\u00f6\u00dfen sch\u00fctzt.

f.spiral_sallet = Ein leichter Helm f\u00fcr alle Rekruten der Spiral Knights.

f.spiral_scale_helm = Ein leichter Schuppenhelm, der seinem Tr\u00e4ger leichten Schutz gegen \
  perforierende Angriffe gew\u00e4hrt.

f.spiral_tailed_helm = Ein leichter Helm f\u00fcr alle Rekruten der Spiral Knights.

f.spiral_crescent_helm = Ein leichter Helm, der an alle Rekruten der Spiral Knights vergeben \
  wird.

f.spiral_round_helm = Ein leichter Helm, der an alle Rekruten der Spiral Knights vergeben wird.

f.spiral_hood = Ein leichter Helm, der an alle Rekruten der Spiral Knights vergeben wird.



f.sunset_stetson = Ein robuster Hut f\u00fcr Revolverhelden, der kaum mehr als eine Handvoll \
  Crowns kostet.

f.surge_breaker_helm = Ein verl\u00e4sslicher Helm, der deinen Sch\u00e4del vor jeglichen \
  unangenehmen Schl\u00e4gen sch\u00fctzt.

f.tri_guard_helm = Eine besonderer Helm, speziell entworfen f\u00fcr Knights, die auf fremden \
  Planeten die ersten Erkundungen durchf\u00fchren. Dieser Helm Anzug sch\u00fctzt vor einer \
  Vielzahl rauher Wetterbedingungen.

f.valkyrie_helm = Ein Helm von unsch\u00e4tzbarem Wert, dessen Namen die Kreaturen der \
  Unterwelt nicht auszusprechen wagen.

f.virulisk_mask = Eine Maske aus der Haut eines Virulisks.

f.vog_cub_cap = Ein dicker Hut, der stark nach Barbecue riecht. Was f\u00fcr ein Barbecue? \
  Nicht fragen.

f.volcanic_demo_helm = Ein Helm der neuesten Art, der mit Volcanic Iron vest\u00e4rkt ist und f\u00fc\
  r den Einsatz mit Hochtemperatur-Sprengstoffen vorgesehen ist.

f.volcanic_plate_helm = Ein \u00fcberragender Plattenhelm, durchdrungen von der elementaren \
  Essenz der Flamme. Es ist etwas schwierig darin zu atmen, aber er kann hohen Temperaturen und \
  beliebig viele wilde Angriffe \u00fcberstehen.

f.volcanic_salamander_mask = Eine Salamander Mask, die mit Volcanic Iron verst\u00e4rkt ist. Im \
  Einsatz kann sie als behelfsm\u00e4\u00dfiger Kaffeepott dienen, solange einem Kaffee mit \
  Eidechsengeschmack nichts ausmacht.

f.volt_breaker_helm = Ein Circuit Breaker Helm, der noch besseren Schutz gegen Schock bietet.

f.wolver_cap = Ein munterer Hut, gefertigt aus deutlich weniger munterer Wolver-Haut.

f.woven_pathfinder_helm = Ein flexibler Helm, der auf Beweglichkeit ausgelegt ist und \
  durchzogen ist von Glibber-Fasern, um Schutz vor stacheligen und dornigen Gegnern zu bieten.

f.woven_sentinel_helm = Ein Helm, der mit gewobenem Wolver-Haar verst\u00e4rkt wurde, um auch \
  den widrigsten Elementen zu trotzen.

f.woven_shade_helm = Ein locker sitzender Helm, der es dem Tr\u00e4ger erm\u00f6glicht, durch \
  die Schatten zu huschen und unaufmerksame Feinde zu \u00fcberrumpeln.

f.wyvern_scale_helm = Ein aus den Schuppen seltener Monster aus dem Uhrwerk hergestellter \
  robuster Helm, der selbst den h\u00f6chsten Temperaturen widersteht.

# Gear Helm names (special)
#...................................................................................................

f.warmaster_helm_1 = Eine Nachbildung der Maske, die einst von Warmaster Seerus der Crimson \
  Order getragen wurde. Da sie aus zerbrochenen Fragmenten hergestellt wurde, sieht sie nur ein \
  wenig wie das Original aus.

f.warmaster_helm_2 = Eine Nachbildung der Maske, die einst von Warmaster Seerus der Crimson \
  Order getragen wurde. Obwohl sie dem Original recht \u00e4hnlich sieht, fehlen noch immer \
  einige St\u00fccke.

f.warmaster_helm_3 = Eine Nachbildung der Maske, die einst von Warmaster Seerus der Crimson \
  Order getragen wurde. Diese perfekte Kopie hat eine schreckliche \u00c4hnlichkeit mit Seerus h\u00f6chstpers\u00f6\
  nlich und dient als finsteres Andenken an Operation Crimson Hammer.



# Costume Helm names
#...................................................................................................

f.super_brawl_crown = Diese Krone wird dem Sieger des Super Brawl verliehen!

f.holiday_hat = Eine festliche Kopfbedeckung, die den warmen Geist der Feiertage in sich tr\u00e4\
  gt.Sie riecht ein wenig nach Lebkuchen.
f.holiday_hat_snow = Eine Feiertags-Kopfbedeckung, die so festlich ist, dass \u00fcber ihr Schnee f\u00e4llt! Zum Gl\u00fcck f\u00fcr den Tr\u00e4ger ist die M\u00fctze besonders warm.

f.gm_helmet = Ein beeindruckender, indigofarbener Helm, der das unverwechselbare Zeichen der \
  unglaublichen Game Master des Spiral Order ist.

f.chapeau_rose = Ein alter Federhut, der einmal einem Knight of the Rose geh\u00f6rte, ein \
  heiliger Orden mutiger und besonders schneidiger Helden, deren zahlreiche Abenteuer zum \
  Inhalt vieler Geschichten geworden sind. Es hei\u00dft, die Knights of the Rose waren \
  unvergleichliche Fechter, die glaubten dass ihre Klingen genau wie die Blume aus ihrem Namen \
  sind: eine zarte Sch\u00f6nheit, die es verbirgt, wie schmerzhaft sie zustechen kann.

f.steamvalve_mask = Obwohl sie jetzt im Vergleich zu fortschrittlicheren Ger\u00e4ten veraltet \
  sind, wurden diese speziellen Druck-Masken einst von Soldaten in Umgebungen mit extremen \
  atmosph\u00e4rischen Bedingungen verwendet. Das Druckventil auf der R\u00fcckseite musste \
  genau so eingestellt sein, denn sonst w\u00e4re der Kopf des Soldaten, nunja, implodiert.

f.bombhead_mask = Eine Maske, die King Krogmo zur Feier der Er\u00f6ffnung des Blast Network \
  erstellen lassen hat und die erstaunlich nach einer echten Bombe aussieht. Verf\u00fcgbar in \
  einer ganzen Reihe von verschiedenen Stilen, so dass es wohl f\u00fcr jede erdenkliche R\u00fc\
  stung eine dazu passende Ausf\u00fchrung gibt.

f.pumpkin_bombhead_mask = Eine Bombhead Mask, die eine schreckenerregende Grimasse tr\u00e4gt, die an den gro\u00dfen, k\u00fc\
  rbisartigen Punkin King erinnert.













f.trojan_disguise = Eine sehr \u00fcberzeugende Verkleidung, die deren Tr\u00e4ger wie einen \
  Trojan aussehen l\u00e4sst. So \u00fcberzeugend, dass deine Freunde dir vielleicht in den R\u00fccken fallen werden!

f.mechaknight_disguise = Ein sehr \u00fcberzeugend wirkendes Kost\u00fcm, das den Tr\u00e4ger \
  wie einen Mechaknight aussehen l\u00e4sst. So \u00fcberzeugend dass deine Freunde vielleicht \
  versuchen werden, dich auseinanderzunehmen!

f.gun_puppy_disguise = Ein sehr \u00fcberzeugend wirkendes Kost\u00fcm, das den Tr\u00e4ger wie \
  ein Gun Puppy aussehen l\u00e4sst. So \u00fcberzeugend dass deine Freunde vielleicht \
  versuchen werden, dich an der Nase herumzuf\u00fchren.

f.love_puppy_disguise = Eine sehr \u00fcberzeugende Verkleidung, die deren Tr\u00e4ger wie ein \
  Love Puppy aussehen l\u00e4sst. So \u00fcberzeugend, dass deine Freunde vielleicht einen Kuss \
  wollen!

f.love_puppy_mask_forever = Eine besondere Maske, die beweist, dass die Liebe eines Love Puppy \
  f\u00fcr immer und ewig h\u00e4lt. Manch einer w\u00fcrde anbringen, dass sie nur so \
  programmiert sind, andere w\u00fcrden sagen, 'zum Teufel mit dir, Wissenschaft.'

f.gremlin_disguise = Eine sehr \u00fcberzeugende Verkleidung, die deren Tr\u00e4ger wie einen \
  Gremlin aussehen l\u00e4sst. So \u00fcberzeugend, dass du vielleicht in die Kolonie \
  eingeladen wirst!

f.metal_sonic_mask = Eine finster aussehende Maske, hergestellt von einem mechanischen Genie, \
  von dessen F\u00e4higkeiten man sagt, sie w\u00fcrden sogar denen der gr\u00f6\u00dften \
  Gremlin-Ingenieure Konkurrenz machen.

f.trojan_helm = Man sagt vom Helm der unersch\u00fctterlichen Spiral Wardens, dass er sehr \
  ermutigend auf andere Knights wirkt. Nichts sagt deutlicher "Hier kommt die Kavallerie!" als \
  der Anblick dieser eisernen Riesen, wie sie das Schlachtfeld erst\u00fcrmen.

f.gremlin_helm = Ein besonderer Helm, handgearbeitet von Gremlin-Schmieden, um auch in den \
  rauhesten Umgebungen Schutz zu bieten. Dieser wurde angepasst, so dass er einem Knight passt.

f.gunpuppy_helm = Ein handgefertigter Helm, gemacht aus geborgenen Gun-Puppy-Teilen.

f.mechaknight_helm = Ein robuster Helm, handgearbeitet von Gremlin-Schmieden, um die \
  Kontrolleinheit eines Mecha-Knight zu sch\u00fctzen. Wenn man die Kontrolleinheit entfernt, \
  passt er einem Knight erstaunlich gut.

f.stranger_hat = Ein Hut, der fr\u00fcher von einem der r\u00e4tselhaften Stranger getragen \
  wurde. Kleine, farbenfrohe Federn scheinen in jeder Naht zu stecken.

f.frosted_helm = Ein k\u00f6stlicher Helm, gemacht aus Kuchen, der w\u00e4hrend der \
  Geburtstagsfeierlichkeiten von Spiral Knights hergestellt wurde. Da er aus Kuchen ist, wird \
  er letztendlich zerfallen.

f.foiled_frosted_helm = Ein k\u00f6stlicher Helm, gemacht aus Kuchen, der w\u00e4hrend der \
  Geburtstagsfeierlichkeiten von Spiral Knights hergestellt wurde. Obwohl er verpackt ist, ist \
  er immer noch aus Kuchen und wird letztendlich zerfallen.

f.prismatic_frosted_helm = Ein k\u00f6stlicher Helm, gemacht aus Kuchen, der w\u00e4hrend der \
  Geburtstagsfeierlichkeiten von Spiral Knights hergestellt wurde. Es wurde ein seltsamer, \
  prismatischer Zuckergu\u00df verwendet, der in Biscottis K\u00fccher erfunden wurde und ihn \
  davor bewahrt, jemals zu verderben. Nicht zum Verzehr geeignet.

f.heavenly_guardian_helm = Der strahlend weisse Helm eines himmlischen Kriegers.

f.infernal_guardian_helm = Der verkohlte, aus den Tiefen stammende Helm eines Kriegers der \
  Unterwelt.

f.crescent_helm = Ein stabiler Helm, der einem Sichelmond gleicht, wenn das Visier ge\u00f6ffnet ist.

f.fur_cap = Eine w\u00e4rmende Fellm\u00fctze, die das Gesicht einer wilden Bestie darstellt.

f.hood = Eine mystische Kapuze, deren gr\u00f6\u00dfte Macht es ist, die Identit\u00e4t des Tr\u00e4gers zu verbergen.

f.pith_helm = Ein einfacher, aber effektiver Helm, der von Rekruten der Spiral Knights \
  bevorzugt wird.

f.plate_helm = Ein schwerer Diensthelm, gemacht f\u00fcr heftige Gefechte.

f.round_helm = Ein anmutiger Helm, der nur darauf wartet, mit Zubeh\u00f6r best\u00fcckt zu werden.

f.sallet = Ein stromlinienf\u00f6rmiger Helm, favorisiert von K\u00e4mpfern an der Frontlinie.

f.scale_helm = Ein Helm gefertigt aus den Schuppen einer sich schl\u00e4ngelnden Bestie.

f.tailed_helm = Ein ausdrucksvoller Helm der beweist, dass zwei Helmbuschen immer besser sind \
  als einer.

f.winged_helm = Ein Helm, dessen Design eine fast himmlische Sch\u00f6nheit ausstrahlt.

f.imperial_tricorne = Ein beeindruckender Helm, getragen von jenen, die ein Reich erschaffen \
  wollen, \u00fcber dem die Sonne niemals untergeht.

f.shogun_helmet = Ein gro\u00dfartiger Helm, getragen von Kriegern die vor langer Zeit ein \
  Reich unter dem Zeichen der aufgehenden Sonne vereint haben.

f.medieval_war_helm = Ein Helm, in robuster Weise daf\u00fcr gebaut, ein Jahrhundert lang zu \
  bestehen.

f.impostoclaus_hat = Ein fabul\u00f6ser, festlicher Winterfest-Hut, der den Tr\u00e4ger aussehen l\u00e4sst wie den gro\u00df\
  en Geist des Winterfests, Impostoclaus. Glorp! Glorp! Glorp!

f.humbug_hat = Ein furchtbarer Hut, der von denen getragen wird, die die Magie von Winterfest \
  wahrlich verabscheuen. Die einzig m\u00f6gliche Erkl\u00e4rung f\u00fcr derartige Gef\u00fchle ist ein um zwei Gr\u00f6\u00dfen zu kleines Herz.

f.storm_avenger_helm = Ein Helm, getragen von himmlischen W\u00e4chtern die \u00fcber ein K\u00f6\
  nigreich wachen, das auf dem Gipfel eines schneebedeckten Berges versteckt ist.

f.storm_champion_helm = Der Helm derjenigen, die die G\u00f6tter herausgefordert haben und die \
  Tore eines himmlischen K\u00f6nigreichs gest\u00fcrmt haben. Manche behaupen, die Donnerschl\u00e4ge seien das ewig w\u00e4\
  hrende Echo ihrer Belagerung.

f.storm_crusader_helm = Ein Helm, getragen von mythischen S\u00f6ldnern, von denen man sagt, \
  sie ritten auf Blitzen in den Kampf.

f.storm_dragon_helm = Ein verzauberter Helm, der zum Abbild einer Bestie geformt wurde von der \
  manche glauben, sie h\u00e4tte die Welt bei ihrem Dahinscheiden erschaffen: ihr Feuer die \
  Sonne, ihre Knochen die Berge.

f.storm_warrior_helm = Ein Helm, der von einem sagenumwobenen Schwertmeister getragen wurde, \
  der so gut war, dass er durch Blitze schneiden konnte, wenn sie den Boden trafen.

f.raging_avenger_helm = Ein Helm, getragen von himmlischen W\u00e4chtern die \u00fcber ein K\u00f6\
  nigreich wachen, das auf dem Gipfel eines lavabedeckten Berges versteckt ist.

f.raging_champion_helm = Der Helm derjenigen, die die G\u00f6tter herausgefordert haben und die \
  Tore eines himmlischen K\u00f6nigreichs gest\u00fcrmt haben.

f.raging_crusader_helm = Ein Helm, getragen von mythischen S\u00f6ldnern, von denen man sagt, \
  sie ritten auf ihrer Wut in den Kampf.

f.raging_dragon_helm = Ein verzauberter Helm, der zum Abbild einer Bestie geformt wurde von der \
  manche glauben, sie h\u00e4tte die Welt bei ihrem Dahinscheiden vernichtet: ihr Zorn wurde zu \
  Magma-Regen, ihr Atem ein Taifun.

f.raging_warrior_helm = Ein Helm, der von einem sagenumwobenen Schwertmeister getragen wurde, \
  der so zornig war, dass er allein durch seine Wut, ganze Armeen ausl\u00f6schen konnte.

f.frenzy_avenger_helm = Ein Helm, getragen von himmlischen W\u00e4chtern, die \u00fcber ein K\u00f6\
  nigreich auf einem sturmgepeitschten Berg wachen.

f.frenzy_champion_helm = Der Helm eines derer, die die G\u00f6tter verraten haben und die Tore \
  eines himmlischen K\u00f6nigreichs gest\u00fcrmt haben. Manche sagen, dass die pfeifenden \
  Winde die ewigen Kampfschreie dieser Belagerung sind.

f.frenzy_crusader_helm = Ein Helm, getragen von den mythischen Soldaten, die mit solch tobender \
  Wut k\u00e4mpfen, dass sie Wirbelst\u00fcrme auf ihrem Pfad hinterlassen.

f.frenzy_dragon_helm = Ein verzauberter Helm, geformt zur Fratze einer Bestie, vond er manche \
  glauben, dass sie in ihrem Sterben die Welt geformt hat: ihre Wut gebar die m\u00e4chtigen \
  Winde, ihre Schuppen wurden zu Schatten.

f.frenzy_warrior_helm = Ein Helm, getragen von einem Schwertmeister der Sagen, der so schnell \
  war, dass sein Toben allein Armeen niederstrecken konnte, bevor sie sich gegen ihn erhoben.

f.battle_chef_hat = Ein Hut, der von Knights getragen wird, die in der Komb\u00fcse der Skylark \
  arbeiten. Mit denen ist nicht zu spa\u00dfen, denn diese K\u00f6che sind Meister der Klinge, \
  auf dem Schlachtfeld und auch ausserhalb.

f.dangerous_diablo_helm = Ein Helm, der von den Mitgliedern der Aufkl\u00e4rungs-Ranger \
  getragen wird. Der Helm ist designt, um Feinde zu erschrecken; er stellt das Gesicht eines D\u00e4mons dar von dem erz\u00e4\
  hlt wird, er habe sich sein eigenes Horn ausgerissen, um es als Waffe zu verwenden, als er \
  seinem Ende entgegensah.

f.hazardous_diablo_helm = Ein Helm, der von den Mitgliedern der scharlachroten Sp\u00e4hern \
  verwendet wird. Dieser Helm ist dazu gemacht, Feinde zu erschrecken und stellt die Fratze \
  eines D\u00e4mons dar, von dem man sagt, dass er sein eigenes Horn abgebrochen hat, um es als \
  Waffe zu verwenden, als er sein Ende nahen sah.

f.dangerous_grim_mask = Ein Helm, der von den Mitgliedern der Aufkl\u00e4rungs-Ranger getragen \
  wird. Der Helm ist designt, um Feinde zu erschrecken; er stellt das Antlitz des Todes selbst \
  dar. Diejenigen die ihn tragen, haben ein Sprichwort: 'Der Tod sieht immer zu, also solltest \
  du besser eine gute Show liefern.'

f.hazardous_grim_mask = Ein Helm, der von den Mitgliedern der scharlachroten Sp\u00e4hern \
  verwendet wird. Dieser Helm ist dazu gemacht, Feinde zu erschrecken und stellt das Anlitz des \
  Todes selbst dar. Diejenigen, die ihn tragen, verwenden gern den Ausspruch "Der Tod ist dir \
  auf den Fersen, also schau weiterhin nach vorne."

f.dangerous_oni_helm = Ein Helm, der von den Mitgliedern der Aufkl\u00e4rungs-Ranger getragen \
  wird. Der Helm ist designt, um Feinde zu erschrecken; er stellt das Gesicht eines D\u00e4mons \
  dar der in den Bergen eines entfernten Landes lebt. Man sagt er bewache die Tore zum Himmel \
  selbst und erlaube nur denjenigen, die w\u00fcrdig sind, zu passieren.

f.hazardous_oni_helm = Ein Helm, der von den Mitgliedern der scharlachroten Sp\u00e4hern \
  verwendet wird. Dieser Helm ist dazu gedacht, Feinde zu erschrecken und tellt das Gesicht \
  eines D\u00e4mons dar, der in den Bergen eines fernen Landes lebt. Man sagt, er bewache das \
  Tor zum Himmel und l\u00e4sst nur jene passieren, die sich dessen w\u00fcrdig erwiesen haben.

f.obsidian_hood_of_rituals = "Mit gro\u00dfer Geduld und zarter Pflege, mit einem ewigen Herzen \
  und reinem Geist: sch\u00e4rfe den Stein, h\u00e4rte die Kette, begr\u00fc\u00dfe die Nacht, \
  trinke vom Kelch der K\u00f6nige."

f.obsidian_hood_of_sight = "Durch meine Augen wirst du den Pfad zu den Zeitaltern sehen. Rein \
  ist mein Blick, frei von den L\u00fcgen der Realit\u00e4t."

f.obsidian_hood_of_influence = "Sprich mit der einen, wahren Stimme und sie werden zuh\u00f6ren. Leise wie das Fl\u00fcstern eines Kindes, br\u00fc\
  llend wie der Tod dieser Welt."

f.obsidian_hood_of_devotion = "H\u00fclle dich in meine Umarmung und gib dich meiner \
  unendlichen Liebe hin. Lass deinen Atem wie den Rauch einer Kerze davon driften, tr\u00e4ume \
  tiefer und immer tiefer."

f.iron_wolf_hood = Ein Helm, der einst von einem Mitglied der 'Iron Wolves' getragen wurde, \
  einem Team aus furchtlosen K\u00e4mpfern, das sich auf die Elimination von wichtigen \
  Morai-Zielen spezialisiert hat. Nach der Aufl\u00f6sung wurden die \u00fcberlebenden \
  Mitglieder von Desna zusammengef\u00fchrt, um die Aufkl\u00e4rungs-Ranger zu bilden.

f.iron_dragon_helm = Ein Helm, der einst von einem Mitglied der 'Iron Dragons' getragen wurde, \
  einem Team aus furchtlosen K\u00e4mpfern, das sich auf die Elimination von wichtigen \
  Morai-Zielen spezialisiert hat. Nach der Aufl\u00f6sung wurden die \u00fcberlebenden \
  Mitglieder von Desna zusammengef\u00fchrt, um die Aufkl\u00e4rungs-Ranger zu bilden.

f.gold_wolf_hood = Ein Helm, der einst von einem Mitglied der 'Gold Wolves' getragen wurde, \
  einer Truppe furchtloser Knights, die auf das Eliminieren wichtiger Morai-Ziele spezialisiert \
  waren. Nach der Aufl\u00f6sung wurden die \u00fcberlebenden Mitglieder von Desna mit anderen \
  Truppen vereint, um die Aufkl\u00e4rungs-Knights zu bilden.

f.gold_dragon_helm = Ein Helm, der einst von einem Mitglied der 'Gold Dragons' getragen wurde, \
  einer Truppe furchtloser Knights, die auf das Eliminieren wichtiger Morai-Ziele spezialisiert \
  waren. Nach der Aufl\u00f6sung wurden die \u00fcberlebenden Mitglieder von Desna mit anderen \
  Truppen vereint, um die Aufkl\u00e4rungs-Knights zu bilden.

f.polar_twilight_wolf_hood = Eine warme Kaputze, die von in den Polarregionen stationierten \
  Knights bevorzugt wird. Man sagt, das polare Zwielicht sein ein wunderbarer Anblick.

f.polar_day_wolf_hood = Eine warme Kaputze, die von in den Polarregionen stationierten Knights \
  bevorzugt wird. Das dicke Fell wird w\u00e4hrend der endlosen Tagespatrouillen ben\u00f6tigt.

f.polar_night_wolf_hood = Eine warme Kaputze, die von in den Polarregionen stationierten \
  Knights bevorzugt wird. Das dicke Fell wird w\u00e4hrend der endlosen Nachtpatrouillen ben\u00f6tigt.

f.polar_day_warden_hood = Eine isolierte Kapuze, die einen Knight warm h\u00e4lt, wenn er sich \
  bitterkalten, polaren Winden stellen muss. Die Maske, die das ganze Gesicht bedeckt, macht \
  sie zur idealen Wahl f\u00fcr den Wachdienst am Tag.

f.polar_night_warden_hood = Eine isolierte Kapuze, die einen Knight warm h\u00e4lt, wenn er \
  sich bitterkalten, polaren Winden stellen muss. Die Maske, die das ganze Gesicht bedeckt, \
  macht sie zur idealen Wahl f\u00fcr den Wachdienst in der Nacht.

f.polar_twilight_warden_hood = Eine isolierte Kapuze, die einen Knight warm h\u00e4lt, wenn er \
  sich bitterkalten, polaren Winden stellen muss. Die Maske, die das ganze Gesicht bedeckt, \
  macht sie zur idealen Wahl f\u00fcr das stundenlange Absuchen des Horizonts im polaren \
  Zwielicht.


f.serene_helm = Ein antiker, widerstandsf\u00e4higer Helm, der von einer weichen Schicht Moos \
  bedeckt ist. Im k\u00fchlen, steinigen Inneren des Helms kannst du eine entfernte, \
  beruhigende Weise vernehmen, getragen vom Rauschen der Winde, die aus fernen L\u00e4ndern \
  herangeweht kommen.

f.celestial_nav_helm = Ein spezieller Helm zur Erinnerung an isoranische Raumfahrer aus alter \
  Zeit. Wenn du ihn tr\u00e4gst, kannst du einen klaren Pfad durch den Nachthimmel erkennen, \
  der zu den zahllosen Welten f\u00fchrt, die dahinter liegen.

f.galactic_guardian_helm = Ein Gedenk-Helm, der den zahllosen mutigen isoranischen W\u00e4\
  chtern Tribut zollt, die die Raumfahrer-Mannschaften bei ihren Abenteuern zu den Sternen \
  verteidigt haben.

f.stellar_sentinel_helm = Dieser Helm wurde einst von isoranischen Sternenseglern aus lang \
  vergangenen Zeiten getragen, die Operationen ausserhalb des Sonnensystems \u00fcberwacht \
  haben. Damit ausger\u00fcstet f\u00fchlst du dich, als w\u00fcrdest du die Maschinerie des \
  Universums verstehen.

f.shako = Eine zeremonielle Kappe, die von Knights zu besonders feierlichen Anl\u00e4ssen getragen wird.

f.nodeslime_helm = Eine schreckenerregende Maske der Bosheit von omin\u00f6sen, nun ausgel\u00f6schten Glibbern.

f.venom_fiend_mask = Eine Maske, von der man sagt, dass sie nach dem Antlitz eines giftigen D\u00e4\
  monen erstellt wurde. Sie ist durchdrungen von einer b\u00f6sen Essenz, die deinen Feinden \
  sicher Furcht einfl\u00f6\u00dfen wird.

f.arctic_rogue_mask = Eine Maske von der gesagt wird, ein arktischer Schurke h\u00e4tte sie \
  geschaffen. Das zerbrochene Eis wird deine Identit\u00e4t w\u00e4hrend geheimer, arktischer \
  Missionen verbergen.


f.voltaic_radical_mask = Eine Maske von der man sagt, sie sei eine Replik eines empfindungsf\u00e4\
  higen Mechaknight. Die eingebauten Zahnr\u00e4der und die Schock-Helmzier werden sicher deine \
  Identit\u00e4t verbergen.

f.nefarious_hood = Eine Kapuze von der man sagt, ein boshafter Imp h\u00e4tte sie hergestellt. \
  Die schwebende Rune wird dich w\u00e4hrend gef\u00e4hrlicher Unternehmungen sicher verbergen.

f.magmatic_fanatic_mask = Eine Maske von der man sagt, einer der Fanatiker, die einen \
  Magma-Gott angebetet haben, habe sie getragen. Ihr Feuer wird den Pfad zum Sieg erleuchten.

f.night_cap_pith = Eine bequeme Kopfbedeckung f\u00fcr Knights, die man nachts tr\u00e4gt. Sie \
  sorgt mit Sicherheit f\u00fcr eine Nacht voll erholsamem Schlaf.

f.night_cap_sallet = Eine bequeme Kopfbedeckung f\u00fcr Knights, die man nachts tr\u00e4gt. Sie sorgt f\u00fcr eine Nacht luziden Tr\u00e4\
  umens, in der man sich seinen Alptr\u00e4umen stellen kann.

f.night_cap_tailed = Eine bequeme Kopfbedeckung f\u00fcr Knights, die man nachts tr\u00e4gt. Sie sorgt f\u00fcr eine Nacht voll s\u00fcsser, friedlicher Tr\u00e4ume.

f.night_cap_round = Eine bequeme M\u00fctze, die Knights nachts tragen k\u00f6nnen. Sie wird dem Tr\u00e4\
  ger sicher ein paar Extrastunden Rast verschaffen.

f.stranger_cap = Eine Kopfbedeckung, die einmal von einem der r\u00e4tselhaften Stranger \
  getragen wurde. Die lokalen Snipes scheinen vom Tr\u00e4ger angezogen zu werden.

f.spiraltail_mask = Eine einfache Affenmaske, hergestellt zur Feier des neuen Jahres. Deine \
  durchtriebenen Sp\u00e4\u00dfe werden sicher einiges Aufsehen erregen.

f.firetail_mask = Eine gl\u00fchende Affenmaske, hergestellt zur Feier des neuen Jahres. Die \
  sengende Silhouette wird dein dominantes Auftreten sicher unterstreichen.


















# Costume Armor names
#...................................................................................................

f.gm_armor = Eine beeindruckende, indigofarbene R\u00fcstung, die das unverwechselbare Zeichen \
  der unglaublichen Game Master des Spiral Order ist.

f.tabard_rose = Ein alter, bestickter Wappenrock, der einmal einem Knight of the Rose geh\u00f6\
  rte, ein heiliger Orden mutiger und besonders schneidiger Helden, deren zahlreiche Abenteuer \
  zum Inhalt vieler Geschichten geworden sind. Es hei\u00dft, die Knights of the Rose waren \
  unvergleichliche Fechter, die glaubten dass ihre Klingen genau wie die Blume aus ihrem Namen \
  sind: eine zarte Sch\u00f6nheit, die es verbirgt, wie schmerzhaft sie zustechen kann.

f.plasmatech_demo_suit = Eine Demo Suit, die King Krogmo zur Feier der Er\u00f6ffnung des Blast \
  Network erstellen lassen hat. Sie ist perfekte Aufmachung f\u00fcr formelle Detonationen oder \
  auch weniger f\u00f6rmliche Explosionen.

f.tusk_helm = Geformt nach den noblen Bestien die f\u00fcr ihre St\u00e4rke und Furchtlosigkeit \
  bekannt sind. Dieser Helm fl\u00f6\u00dft den Feinden seines Tr\u00e4gers solche Furcht und \
  Respekt ein, dass \u00fcber seine Taten noch f\u00fcr viele Zeitalter gesprochen werden wird.

f.metal_sonic_suit = Eine akribisch gearbeitete R\u00fcstung von der man sagt, sie sei mit \
  einer ultrastarken V. Max Overdrive Unit ausgestattet.

f.heavenly_guardian_armor = Strahlend weisse R\u00fcstung, getragen von denjenigen, die die \
  himmlischen Reiche verteidigen.

f.infernal_guardian_armor = Verkohlte, aus der Unterwelt stammende R\u00fcstung, getragen von \
  denen, die die infernalischen Tiefen verteidigen.

f.brigandine = Eine sehr praktische R\u00fcstung, kombiniert mit einer Strickjacke.

f.cloak = Ein aussergew\u00f6hnlicher Umhang, der von Studenten der arkanen K\u00fcnste favorisiert wird.

f.cuirass = Ein eng geschnittener Anzug, bei dem es ausschlie\u00dflich ums Gesch\u00e4ft geht, \
  nicht um Taschen.

f.culet = Eine elegant designte R\u00fcstung, die jeder Figur schmeichelt.

f.draped_armor = Eine stilvolle R\u00fcstung, die dem Kampf einen Hauch von Klasse verleiht.

f.flak_jacket = Eine leichte R\u00fcstungs-Jacke, die daf\u00fcr sorgt, dass du cool aussiehst \
  und dich auch so f\u00fchlst.

f.fur_coat = Ein extra-warmer Mantel, gemacht aus dem Fell einer pelzigen Bestie.

f.plate_mail = Eine scheppernde und klappernde R\u00fcstung, daf\u00fcr gemacht eine \
  ordentliche Tracht Pr\u00fcgel auszuhalten.

f.scale_mail = Eine schimmernde Anordnung von Schlangenschuppen, verwebt zu einer R\u00fcstung.

f.raiment = Eine langes, flie\u00dfendes Kampfgewand, am besten zu kombinieren mit einem Set \
  Engelsfl\u00fcgel.

f.winterfest_coat = Ein unglaublich weicher und saisonal stilvoller Anzug, der wundervolle \
  Winterfest-Freude abstrahlt. Er verdeutlicht jedem, dass du es ernst meinst, wenn es um \
  Feiertage geht.

f.thunderous_plate_mail = Ein legend\u00e4res R\u00fcstungsset von dem behauptet wird, es w\u00fcrde dem Tr\u00e4\
  ger die Macht des himmlischen Donners verleihen.

f.rageous_plate_mail = Ein legend\u00e4res R\u00fcstungsset von dem behauptet wird, sein Tr\u00e4ger w\u00fc\
  rde von der Wut der Titanen durchdrungen.

f.frenzy_plate_mail = Eine legend\u00e4re R\u00fcstung von der gesagt wird, dass sie den Tr\u00e4\
  ger mit der Wut tausender Halbg\u00f6tter durchdringt.

f.storm_rider_mantle = Ein legend\u00e4res R\u00fcstungsset von dem man glaubt, ein Gott habe \
  sie getragen, der mit Blitzen ganze Welten aus Felsen formte.

f.raging_rider_mantle = Ein legend\u00e4res R\u00fcstungsset von dem man glaubt, ein Gott habe \
  sie getragen, der durch seinen Zorn ganze Welten aus Felsen schnitt.

f.frenzy_rider_mantle = Eine legend\u00e4re R\u00fcstung von der man denkt, sie wurde von einem \
  Gott getragen, der seine Wut nutzte, um ganze Welten aus Stein zu formen.

f.battle_chef_coat = Eine Jacke, die von Knights getragen wird, die in der Komb\u00fcse der \
  Skylark arbeiten. Mit denen ist nicht zu spa\u00dfen, denn diese K\u00f6che sind Meister der \
  Klinge, auf dem Schlachtfeld und auch ausserhalb.

f.dangerous_brigandine = Eine gepolsterte R\u00fcstung, die die hohe Sterblichkeitsrate der \
  Elite-Aufkl\u00e4rungs-Ranger zu betonen scheint. Aufkl\u00e4rungs-Ranger m\u00fcssen sich \
  schnell und leicht bewegen, oftmals kopf\u00fcber in Situationen hinein, die andere Knights \
  in Angst und Schrecken versetzen w\u00fcrden.

f.hazardous_brigandine = Wattierte R\u00fcstung, die die hohe Sterblichkeitsrate bei den \
  scharlachroten Sp\u00e4hern hervorzuheben scheint. Scharlachrote Sp\u00e4her m\u00fcssen sich \
  leicht und schnell fortbewegen, um vor den weniger bewanderten Truppen zu bleiben.

f.dangerous_draped_armor = Eine weit geschnittene R\u00fcstung, die von erfahrenen Aufkl\u00e4\
  rungs-Rangern getragen wird. Es gibt Ger\u00fcchte, laut denen Ausr\u00fcstung wie diese aus den \u00dcberresten der R\u00fc\
  stung von Rangern hergestellt wird, die im Kampf gefallen sind und so als Erinnerung daran \
  dient, dass man sich immer in der Umarmung des Todes befindet.

f.hazardous_draped_armor = Locker sitzende R\u00fcstung, die von den erfahreneren \
  scharlachroten Sp\u00e4hern getragen wird. Ger\u00fcchte besagen, dass sie aus den \u00dcberresten der R\u00fc\
  stungen von im Kampf gefallenen Sp\u00e4hern gefertigt ist. Eine Erinnerung daran, dass die \
  Sp\u00e4her niemals einen Kameraden im Feld zur\u00fccklassen, ausser es ist unvermeidlich.

f.dangerous_hound_coat = Eine vom Kampf verw\u00fcstete R\u00fcstung, die von den Gruppenf\u00fchrern der Aufkl\u00e4\
  rungs-Ranger getragen wird, die den Spitznamen "Hounds" tragen. Der Name wurde vermutlich von \
  ihren unglaublichen F\u00e4higkeiten bei der Spurensuche gepr\u00e4gt und davon, dass sie in \
  der Schlacht wie wilde Hunde k\u00e4mpfen.

f.hazardous_hedge_coat = Eine von K\u00e4mpfen gezeichnete R\u00fcstung, die von den Truppenf\u00fc\
  hrern der scharlachroten Sp\u00e4hern getragen wird, inoffiziell auch gern "Hecken" genannt. \
  Der Name kommt wahrscheinlich von ihrem unglaublichen Talent f\u00fcr Flankenangriffe oder \
  stammt vielleicht von den Dornen, die ihre R\u00fcstung zieren.

