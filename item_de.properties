f.valestone_deposit_1 = Ein kleiner Mineralspeicher, der eine einzelne Moonstone-Einheit \
  generiert.

f.valestone_deposit_2 = Ein mittelgro\u00dfer Mineralspeicher, der mehrere Moonstone-Einheiten \
  generiert.

f.valestone_deposit_3 = Ein gro\u00dfer Mineralien-Klumpen, der zahlreiche Moonstone-Einheiten \
  generiert.

f.valestone_deposit_4 = Eine gewaltige Menge metallischer Mineralien, die Unmengen von \
  Moonstone generiert.


# Inventory Mineral names
#...................................................................................................

f.crimsonite = Ein sagenumwobenes Mineral von feurig roter Farbe, das die Leidenschaft, Wut und \
  St\u00e4rke des umgebenden Lebens in sich tr\u00e4gt.

f.dark_matter = Ein sagenumwobenes Mineral von dunkler, beunruhigender Farbe, das die Essenzen \
  von Chaos und dem Nichts in sich tr\u00e4gt.

f.luminite = Ein sagenumwobenes Mineral von strahlend goldener Farbe, das den Glauben, die \
  Weisheit und den Eifer des Lebens in sich tr\u00e4gt.

f.moonstone = Ein sagenumwobenes Mineral von strahlend blauer Farbe, das angeblich das Wissen \
  und den Ursprung aller Welten in sich tr\u00e4gt.

f.valestone = Ein sagenumwobenes Mineral von lebhaft gr\u00fcner Farbe, das angeblich die \
  Essenz des nat\u00fcrlichen Lebens in sich tr\u00e4gt.

