# Usable Consumables
#...................................................................................................

f.confetti = Benutze diesen Gegenstand, um ihn in die Luft zu werfen und zu feiern! Komm schon!

f.confetti_summer = Wenn diese Konfetti geworfen werden, wird dir warm ums Herz.

f.confetti_winter = Wenn diese Konfetti geworfen werden, versp\u00fcrst du einen k\u00fchlen Schauer.

f.confetti_leaf = Ein toller Partyspa\u00df, der bei w\u00e4ldlichen Festivit\u00e4ten genutzt wird.

f.confetti_dark_harvest_treat = Feiere das dunkle Erntefest, indem du einen K\u00fcrbis beachtlicher Gr\u00f6\u00dfe in die Luft schie\u00df\
  t. Was danach kommt, liegt in den H\u00e4nden des Punkin King...

f.confetti_equinox = Wenn man sie wirft, explodieren diese Fr\u00fchlings-Konfetti in einen \
  schauer aus frisch sprie\u00dfendem Gras und duftender Blumen. Kein Regen notwendig!

f.confetti_fall_equinox = Wenn man es wirft explodieren diese Konfetti in herbstlicher Glut.



f.flawed_snowball = Ein fest geformter Schneeball, der leider zu fehlerbehaftet ist, um ihn f\u00fc\
  r die Alchemie benutzen zu k\u00f6nnen. Am Besten sollte man ihn wegwerfen... an jemandes \
  Kopf.

f.grinchlin_snowball = Diese absto\u00dfenden, von den grummeligen Grinchlins von Mount Krampus \
  handgefertigten Projektile d\u00e4mpfen garantiert jede winterfestliche Stimmung.

f.storm_caller = Ein Party-Spielzeug der G\u00f6tter, das benutzt wird, um einen Blitz vom \
  Himmel zu beschw\u00f6ren.

f.rage_caller = Ein Party-Spielzeug der G\u00f6tter, das benutzt wird, den Zorn des Himmels \
  heraufzubeschw\u00f6ren und einschlagen zu lassen.

f.frenzy_caller = Ein Party-Spielzeug der G\u00f6tter, genutzt um einen Sto\u00df blitzender \
  Wut vom Himmel herabzubeschw\u00f6ren.

f.flare_popper = Obwohl sie nie daf\u00fcr vorgesehen waren, bei einer Party verwendet zu \
  werden, schie\u00dfen Aufkl\u00e4rungs-Ranger gerne Signalfeuer in die Luft, um Missionen zu \
  feiern, bei denen alle lebendig zur\u00fcckgekommen sind. Traurigerweise wird dir jeder \
  Ranger best\u00e4tigen, dass viel zu wenige davon je brennend den Himmel erleuchten.

f.confetti_bubbles = Benutze diesen Gegenstand, um eine Wolke von Seifenblasen in die Luft zu \
  pusten. Schau, wie lang sie durchhalten, bevor sie zerplatzen!

f.bucket_of_flawed_snowballs = Dieser Eimer scheint einen endlosen Vorrat an Flawed Snowballs \
  zu bieten. Ungl\u00fccklicherweise schmelzen sie, wenn sie herausgenommen werden, also besser \
  schnell benutzen!

f.punkin_pie_pan = Ein heisser, dampfender Kuchen aus echten Gourdlings! Nicht zum Verzehr \
  durch Knights geeignet, bitte beim n\u00e4chsten Freund loswerden.

f.punkin_pie_slice = Ein heisses, dampfendes St\u00fcck Kuchen.

f.bucket_of_bloons = Dieser Eimer scheint einen unersch\u00f6pflichen Vorrat an Wasserballons \
  zu haben. Sie sehen wurfbereit aus, also wirf sie auf deine Freunde!

f.fireworks = Zu Feierlichkeiten stellt Spiral Order einige seiner Munitions-Experten dazu ab, \
  spektakul\u00e4res Feuerwerk zu kreieren.

f.pile_o_pillows = Ein frisch gewaschener Haufen Kissen, bereit, auf deine Freunde geworfen zu \
  werden.


