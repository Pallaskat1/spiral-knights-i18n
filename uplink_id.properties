# TF2/MannCo Promotional Hat Messages

s.tf2_start = Tugas Kecil
m.tf2_start = Selamat pagi, pelanggan setia! \n\n\
\
Kamu mungkin baru-baru ini mendengar bahwa aku telah menjadi orang terkaya keempat di Amerika, setelah melampaui \
orang terkaya kelima, dan membunuh orang yang sebelumnya berada di posisi keempat dalam duel harpun. Meskipun \
hal ini, tentu saja, sepenuhnya benar (terutama bagian duel harpun, yang berlangsung lama dan berdarah-darah), \
itu masih jauh dari cukup. Posisi keempat mungkin cukup bagi para HIPPIE yang tidak akan mengenali kemenangan \
meskipun kemenangan itu menghampiri mereka dan menawarkan untuk mengepang rambut kuncir kuda mereka, tetapi itu \
sama sekali tidak cukup baik bagi Saxton Hale! \n\n\
\
Tuan Reddy, akuntanku, menjelaskan bahwa cara terbaik untuk meningkatkan pendapatan Mann Co. adalah dengan \
"membuka pasar baru". Aku akan menjelaskan secara terperinci bagaimana rencana kami untuk melakukannya, \
tetapi saat dia berbicara, aku langsung melakukan latihan military press agar tidak mati kebosanan, sehingga \
melewatkan detail-detail rumitnya. \n\n\
\
Yang perlu kamu ketahui, pelanggan tersayang, adalah bahwa aku membutuhkan seorang pria tangguh untuk menemukan \
jalan ke sebuah kota bernama "Haven", melangkah dengan gagah berani melewati salah satu dari sekian banyak gerbang \
di sana, lalu bertarung menembus jalan hingga mencapai "Terminal Clockworks" pertama. Karena kami tidak berhasil \
menemukan pria tangguh yang cocok, kamu harus melakukannya sendiri. Tentu saja, kamu akan mendapat imbalan yang \
sangat besar: TIDAK ADA yang tidak akan kulakukan demi seorang karyawan yang mempertaruhkan nyawa dan anggota \
tubuhnya untuk tugas sepele yang diperlukan oleh keinginan egoisku. \n\n\
\
Jangan repot-repot menghubungiku secara langsung setelah kamu selesai, karena aku akan terlalu sibuk melakukan \
kickboxing melawan jerapah untuk peduli. Salah satu karyawanku yang lain akan menangani semuanya setelah itu. \
Semoga berhasil: kamu akan membutuhkannya! \n\n\
\
Hormatku, \n\n\
\
SAXTON HALE \n\
Orang Australia \n\
CEO, Mann Co.


s.tf2_end = Konfirmasi Tugas
m.tf2_end = Kepada Pihak yang Berkepentingan: \n\n\
\
Saya telah mengonfirmasi kedatanganmu di Terminal Clockworks, dan telah memperoleh data yang relevan \
mengenai katalog pesaing kami. Mann Co. menghargai kerja samamu dalam tugas ini. \n\n\
\
Sebagai imbalan atas bantuanmu, kami telah mengirimkan satu (1) replika penutup kepala bermerek \
Mann Co. "Spiral Sallet". Pengembalian dana atau penukaran tidak akan ditawarkan untuk hadiah ini, dan \
Mann Co. tidak bertanggung jawab atas cedera yang dialami saat mencoba menggunakan hadiah tersebut. \n\n\
\
Salam, \n\n\
\
Tuan Reddy \n\
Mann Co. \n\
"Kami menjual produk dan berkelahi." \n\n\
\
Informasi dalam surat ini bersifat rahasia dan ditujukan hanya kepada penerima yang tercantum. Akses ke \
surat ini oleh siapa pun selain penerima yang dituju tidak diizinkan. Jika kamu bukan penerima yang dituju, \
kamu tidak boleh membaca, menggunakan, memikirkan, memakan, atau merayu informasi yang terkandung dalam \
surat ini. Kegagalan mematuhi permintaan ini akan mengakibatkan penerima dicabik-cabik oleh beruang hingga \
batas maksimal yang diizinkan oleh hukum.


# Sonic CD Promo

s.metal_sonic = Pengiriman Kostum Metal Sonic
m.metal_sonic = Terima kasih telah membeli Sonic CD di Steam! Terlampir Kostum Metal Sonic \
	dan Topengnya. Item-item ini adalah kostum yang dapat dikenakan di atas zirah apa pun, sehingga kamu \
	bisa tampil seperti Metal Sonic kapan pun kamu mau! \n\n\
	\
	Harap diperhatikan bahwa perlengkapan hanya dapat dikenakan di kota atau di Stasiun Arsenal. Jika kamu \
	adalah rekrutan baru yang baru saja keluar dari pod penyelamatmu, pergilah ke Kamp Penyelamatan. Setelah \
	mencapai Kamp Penyelamatan, kamu dapat mengenakan Kostum Metal Sonic dan Topengnya.


# Gloaming Wildwoods

s.wildwoods_start = Misi: Hutan Liar Senja
m.wildwoods_start = Agen Intel Kora di sini, kami mendeteksi modul pengintai yang ditinggalkan oleh Pasukan Alpha \
di suatu tempat di dalam hutan ini. Misi kamu adalah menemukan dan mengambil modul tersebut. \n\n\
\
Hutan ini merupakan rumah bagi kawanan binatang buas yang terbukti mematikan bagi regu-regu sebelumnya. \
Karena itu, Knight Teknisi telah menempatkan Lonceng Binatang di seluruh area. Memukulnya akan \
membuat binatang buas yang terkena gelombang suara yang dihasilkannya menjadi stun. \n\n\
\
Harap waspada, para Knight Pengintai melaporkan keberadaan binatang buas mengerikan yang belum pernah \
kami lihat sebelumnya dan sedang berkeliaran di hutan ini. Dikenal sebagai 'Snarbolax', makhluk ini \
tampak seperti gumpalan bayangan yang dipenuhi taring dan cakar, serta tampaknya kebal sepenuhnya terhadap \
persenjataan kami. Jika kamu bertemu dengannya, segera cari cara untuk melarikan diri secepat mungkin. \n\n\
\
Semoga berhasil!


# Royal Jelly Palace

s.royal_start = Misi: Istana Royal Jelly
m.royal_start = Agen Intel Kora di sini, kami mendeteksi Modul Pengintai lain milik Pasukan Alpha di dalam \
istana ini. Misi kamu adalah menemukan dan mengambil modul tersebut. \n\n\
\
Istana Royal Jelly adalah tempat yang aneh. Tempat ini tampaknya semacam kastel yang telah \
dialihfungsikan oleh para slime menjadi tempat tinggal bagi anggota kaum bangsawan mereka yang berlendir. Dikenal \
sebagai 'Royal Jelly', para slime bangsawan ini konon memerintah bawahan mereka yang tak terhitung jumlahnya \
dengan tangan besi- secara harfiah, berupa anggota tubuh berbentuk kepalan tangan. \n\n\
\
Informasi intelijen kami menunjukkan bahwa modul tersebut terletak di dekat konsentrasi slime yang sangat besar, jadi \
masuk akal untuk menduga bahwa tempat itu mungkin merupakan 'ruang singgasana' milik seorang Royal Jelly. Jika \
benar, bersiaplah menghadapi pertarungan sengit- Royal Jelly mudah marah dan gemar memamerkan kekuatan mereka yang \
luar biasa. Pilihan terbaikmu adalah menemukan cara untuk menekan kemampuan regenerasi alami mereka. \n\n\
\
Semoga berhasil!


# Ironclaw Munitions Factory

s.ironclaw_start = Misi: Pabrik Amunisi Ironclaw
m.ironclaw_start = Agen Intel Kora di sini, kami telah menyadap transmisi gremlin dari fasilitas \
ini yang menunjukkan bahwa mereka sedang membuat semacam senjata untuk menghancurkan Haven! Misi \
kamu adalah menyusup ke fasilitas ini, menghancurkan senjata tersebut, dan menyelamatkan Haven dari kehancuran! \n\n\
\
Dikenal dengan nama 'Proyek Roarmulus', senjata ini konon tidak dapat ditembus oleh serangan biasa. Kamu \
harus menemukan cara untuk menghancurkan zirah apa pun yang digunakannya. Informasi intelijen menunjukkan bahwa senjata ini \
berada jauh di dalam fasilitas tersebut. \n\n\
\
Namun, mencapainya tidak akan mudah. Kamu akan mendapati bahwa para gremlin tidak terlalu peduli terhadap \
keselamatan di tempat kerja, karena roket aktif tampaknya ditembakkan ke segala arah setiap saat. Namun, \
kamu seharusnya dapat memanfaatkan 'dinding polaritas' yang akan kamu temukan di area pengujian \
untuk menghalau roket yang datang. Carilah sakelar berwarna ungu dan emas untuk mengaktifkan atau menonaktifkannya. \n\n\
\
Kami juga mendeteksi Modul Pengintai lain milik Pasukan Alpha di suatu tempat di dalam \
pabrik ini. Ambil modul tersebut jika kamu bisa! \n\n\
\
Semoga berhasil!


# Firestorm Citadel

s.firestorm_start = Misi: Benteng Badai Api
m.firestorm_start = Agen Intel Kora di sini, menjalin komunikasi dari kedalaman tempatmu berada saat ini \
sangatlah sulit- semoga kamu menerima pesan ini. Saat ini kamu berada di Benteng Badai Api, semacam \
benteng kuno yang tampaknya gemar dikumpulkan oleh planet ini. Ini adalah wilayah Clockworks yang sangat berbahaya, \
kamu tidak akan bertahan lama tanpa perlengkapan yang tepat dan regu yang andal. \n\n\
\
Kami mendeteksi sinyal lemah yang menunjukkan bahwa semacam artefak dari ekspedisi Pasukan Alpha \
berada di dalam ruang singgasana benteng ini. Kami membutuhkanmu untuk mengambil artefak tersebut- benda itu bisa \
menjadi petunjuk berharga untuk mengetahui keberadaan mereka saat ini. \n\n\
\
Aku tidak akan berbohong kepadamu, belum ada regu yang menerima misi ini berhasil kembali dari benteng tersebut. Seperti \
yang mungkin sudah kamu lihat, tempat ini dilalap api yang tidak wajar dan legiun makhluk mengerikan yang sama tidak wajarnya \
berkeliaran di setiap lorong. Sekarang mungkin saat yang tepat untuk berbalik dan membuat perlengkapan tahan api. \
Ujian dengan api hanya akan membuatmu terbakar. \n\n\
\
Semoga berhasil!
