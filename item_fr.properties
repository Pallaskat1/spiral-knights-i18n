  cr\u00e9er les Gardes \u00c9claireurs.

f.iron_dragon_armor = Un armure port\u00e9e une fois par un membre du \u00abIron Dragons\u00bb, \
  un escadron de chevaliers intr\u00e9pides qui sp\u00e9cialisaient d'\u00e9limination de \
  cibles Morai qui \u00e9taient tr\u00e8s en vue. Apr\u00e8s l'escadron s'est dispers\u00e9, \
  les membres survivants avaient \u00e9t\u00e9 r\u00e9unis par Desna avec des autres escadrons \
  pour cr\u00e9er les Gardes \u00c9claireurs.

f.gold_wolf_coat = Un armure port\u00e9 une fois par un membre du \u00abLoups d'or\u00bb, un \
  escadron de chevaliers intr\u00e9pides qui se sp\u00e9cialisent dans l'\u00e9limination de \
  cibles Morai tr\u00e8s en vue. Apr\u00e8s avoir dispers\u00e9, ses membres encore en vie \u00e9taient r\u00e9\
  unis par Desna avec des autres escadrons pour former les Gardes \u00c9claireurs.

f.gold_dragon_armor = Un armure port\u00e9 une fois par un membre du \u00abDragons d'or\u00bb, \
  un escadron de chevaliers intr\u00e9pides qui se sp\u00e9cialisent dans l'\u00e9limination de \
  cibles Morai tr\u00e8s en vue. Apr\u00e8s avoir dispers\u00e9, ses membres encore en vie \u00e9taient r\u00e9\
  unis par Desna avec des autres escadrons pour former les Gardes \u00c9claireurs.

f.polar_twilight_wolf_coat = Un manteau chaud pr\u00e9f\u00e9r\u00e9 par les chevaliers post\u00e9s dans les r\u00e9\
  gions polaires. On dit que les p\u00e9nombres polaires sont des si belles spectacles \u00e0 voir.

f.polar_day_wolf_coat = Un manteau chaud pr\u00e9f\u00e9r\u00e9 par les chevaliers post\u00e9s dans les r\u00e9\
  gions polaires. Le fourrure touffu est n\u00e9cessaire pour les patrouilles qui n'en finit \
  jamais pendant le jour.

f.polar_night_wolf_coat = Un manteau chaud pr\u00e9f\u00e9r\u00e9 par les chevaliers post\u00e9s dans les r\u00e9\
  gions polaires. Le fourrure touffu est n\u00e9cessaire pour les patrouilles qui n'en finit \
  jamais pendant la nuit.

f.polar_day_warden_coat = Un manteau r\u00e9chauffant qui garde le chevalier au chaud quand il \
  confronte des vents polaires et glacials. Les couches bord\u00e9es de fourrure sur l'armure \
  sont id\u00e9ales pour la poste de surveillance pendant le jour.

f.polar_night_warden_coat = Un manteau r\u00e9chauffant qui garde le chevalier au chaud quand \
  il confronte des ventes polaires et glacials. Les couches bord\u00e9es de fourrure sur \
  l'armure sont id\u00e9ales pour la poste de surveillance pendant la nuit.

f.polar_twilight_warden_coat = Un manteau r\u00e9chauffant qui garde le chevalier au chaud \
  quand il confronte des vents polaires et glaciales. Les couches bord\u00e9es de fourrure sur \
  l'armure sont id\u00e9ales pour parcourir l'horizon dans la p\u00e9nombre.

f.trojan_armor = On dit que l'armure des vaillants Gardiens Spiral reconforte les autres \
  chevaliers. Rien ne dit \u00abVoici la cavalerie\u00bb comme la vue de ces g\u00e9ants en fer partant \u00e0 la guerre.


f.serene_armor = Une armure ancienne et \u00e9rod\u00e9e par le temps. Quand on se tient d\u00e9\
  bout en portant cette armure, on peut sentir les tremblements lointains caus\u00e9s par la \
  migration d'innombrables tortodrones voyageant aux pays inconnus.

f.celestial_nav_suit = Un casque fabriqu\u00e9 pour comm\u00e9morer les vieux explorateurs \
  Isoran de l'espace. En l'\u00e9quiper, on a envie qu'il serait impossible de se perdre dans \
  l'espace... si le Skylark pourrait voler.

f.galactic_guardian_vest = Porter ce gilet \u00e9tonnement stellaire vous permet d'amener les \
  autres \u00e0 l'abri m\u00eame dans les coins plus obscures de l'espace.

f.stellar_sentinel_suit = Il y avait longtemps depuis cette armure \u00e9tait port\u00e9e par \
  les marins Isorans qui surveillaient les op\u00e9rations extrasolaires. En \u00e9quipant ce \
  casque, vous pensez que vous pouvez plonger dans le c\u0153ur d'un \u00e9toile.

f.swimsuit_trunks = Un maillot de bain spiral pour des exp\u00e9ditions au bord et s'amuser \
  sous le soleil.

f.swimsuit_wrap = Un par\u00e9o spiral drap\u00e9 sur un maillot de bain pour des exp\u00e9\
  ditions au bord et s'amuser sous le soleil.


f.nodeslime_armor = Un voile versicolore port\u00e9 par des vainqueurs v\u00e9n\u00e9r\u00e9s avec v\u00e9h\u00e9mence.

f.gremlin_suit = Une cuirasse ajust\u00e9e avec la touche d\u00e9licate du gremlin pour aller \
  au corps d'un chevalier. Elle prot\u00e8ge le porteur alors qu'elle permet la mouvement sans \
  bornes pour cogner, repousser, ou soigner.

f.mechaknight_suit = Une armure allong\u00e9e, con\u00e7ue pour d\u00e9guiser un chevalier \
  pendant qu'il fouille dans les profondeurs de Cradle.

f.kat_suit = Un costume griff\u00e9 fabriqu\u00e9 par les couturiers de Moorcroft. C'est \
  parfait pour les chevaliers curieux qui ont tendance \u00e0 prendre un petit pause-sommeil \
  apr\u00e8s une nuit blanche plein d'aventures.

f.venom_fiend_mail = Une armure clout\u00e9e, laquelle on dit est fabriqu\u00e9e en visage d'un d\u00e9\
  mon venimeux. Elle est incorpor\u00e9e avec un habit patibulaire qui bat avec une essence \
  vile.

f.arctic_rogue_mail = On dit que cette armure est fabriqu\u00e9e par un arctique explorateur \
  solitaire. C'est affin\u00e9e avec la glace qui sert comme une autre barri\u00e8re de \
  protection, et qui sert \u00e0 dissimuler votre emplacement pendant les exp\u00e9ditions arctiques.


f.voltaic_radical_suit = On dit que cette armure est reproduite par un mechaknight dou\u00e9 de \
  sense. Il inclut une combinason mono pi\u00e8ce qui bat avec une \u00e9nergie \u00e9lectrique.

f.nefarious_raiment = Une tenue dont on dit est fabriqu\u00e9e par un lutin mal\u00e9fique. Les plaques \u00e9th\u00e9r\u00e9es vous prot\u00e8gent contre l'harc\u00e8\
  lement atroce pendant qu'elles vous enveloppent dans un nuage de t\u00e9n\u00e8bres.

f.magmatic_fanatic_mail = On dirait que cette armure \u00e9tait port\u00e9e par les fanatiques \
  adorant un dieu de magma. Ses feux prot\u00e9geront ceux dignes de la porter.

f.wooly_onesie = Des pyjamas chauds mais qui grattent pour les chevaliers \u00e0 porter dans la \
  nuit. {0}
f.onesie = \u00c0 taille unique. Lavable en machine, cycle de lourds. Air sec seulement.

f.wooly_pullover = Un chandail chic pour se pr\u00e9parer pour l'hiver. {0}
f.pullover = Le pull-over parfait pour des f\u00eates et des aventures audacieuses.

f.stranger_robe = Une robe port\u00e9e par l'un des \u00c9trangers \u00e9nigmatiques. Les b\u00e9\
  cassines locales semblent \u00eatre attir\u00e9es par le porteur.

f.spiraltail_mail = Une armure simian simple, port\u00e9e et parad\u00e9 pour porter la bonheur \
  et la prosp\u00e9rit\u00e9.

f.firetail_mail = Une armure simian et ardente, port\u00e9e souvent par les commandants au \
  combat. Elle prot\u00e8gera le porteur contre les plaies p\u00e9nibles.

f.winter_pullover = Un chandail pas chic pour la saison des neiges. Mais c'est le pull-over \
  parfait pour se rendre ridicule devant la famille et les membres de guilde.

f.winter_onesie = Les pyjamas parfaits pour faire passer les cadeaux ou attendre l'arriv\u00e9e d'Impostoclaus.














# Gear Shield names
#...................................................................................................

f.aegis = Seuls les chevaliers les plus dignes du Spiral Order re\u00e7oivent ce sublime \
  bouclier. On ignore si ses armoiries proviennent du pass\u00e9 lointain de l'ordre ou si les \
  chevaliers les ont cr\u00e9\u00e9es lors de leur passage sur Cradle.

f.ancient_plate_shield = Un bouclier antique dont les origines sont longtemps perdus...

f.barrier_shell = Un bouclier alchimis\u00e9 avec la carapace d'un tortodrone. La solidit\u00e9 \u00e9l\u00e9\
  mentaire d'un tortodrone sur la Longue Migration doit vous aider pendant vos voyages aux \
  environments rigoureux.

f.barbarous_thorn_shield = Un bouclier l\u00e9gendaire imbu de la fureur du Snarbolax lui-m\u00eame. On dit que la b\u00ea\
  te peut utiliser les orbes lumineux sur la surface du bouclier pour retrouver les porteurs.

f.blackened_crest = Ce bouclier, autrefois port\u00e9 par un chevalier d'Almire, a en partie br\u00fbl\u00e9 \
  dans la Citadelle Feurieuse. Presque m\u00e9connaissable, il est devenu une relique maudite. \
  Seule une formule alchimique puissante pourrait lui rendre sa gloire d'antan.

f.blazebreak_shield = Un bouclier fiable qui vous \u00e9vitera de vous faire br\u00fbler en bataille.

f.blizzbreaker_shield = Un bouclier fiable qui emp\u00eachera vos ennemis de vous geler.

f.boosted_plate_shield = Un Plate Shield joliment red\u00e9cor\u00e9 qui poss\u00e8de une source d'\u00e9\
  nergie interne pour vous sauvegarder contre les coups les plus forts.

f.bristling_buckler = Un petit bouclier plein d'\u00e9pis pour perfectionner votre \u00e9p\u00e9e en pleine escarmouche.

f.brute_jelly_shield = Un gros bouclier fabriqu\u00e9 des restants de slimes particuli\u00e8\
  rement grossiers. Il est l\u00e9ger, durable, et go\u00fbte d\u00e9lectablement des petit \
  fruits.

f.celestial_shield = L'\u00e9quinoxe de Cradle a inspir\u00e9 la nature duo de ce bouclier sp\u00e9cialis\u00e9, lequel prot\u00e8\
  ge le porteur contre les rayons \u00e9blouissant de jour et la froideur de nuit \u00e9galement.

f.circuit_breaker_shield = Ce bouclier primitif a \u00e9t\u00e9 modifi\u00e9 pour prot\u00e9\
  ger, dans une certaine mesure, des \u00e9lectrocutions.

f.crest_almire = Le bouclier scintillant qu'arboraient autrefois avec fiert\u00e9 les nobles \
  chevaliers d'Almire. On raconte qu'il b\u00e9nit celui qui se bat pour sa patrie et lui donne \
  une grande force int\u00e9rieure.

f.dark_thorn_shield = Une garde lugubre qui donne aux coups d'\u00e9p\u00e9e une sauvagerie \
  surnaturelle.

f.defender = R\u00e9sistant et de qualit\u00e9, ce bouclier du Spiral Order est adapt\u00e9 \u00e0 toutes les aventures.

f.dragon_scale_shield = Un bouclier mythique, fabriqu\u00e9 des \u00e9cailles d'une cr\u00e9ature l\u00e9gendaire.

f.drake_scale_shield = Un bouclier dur, cr\u00e9\u00e9 avec des \u00e9cailles solides.

f.dread_skelly_shield = Un large rempart osseux baign\u00e9 dans un brouillard noir\u00e2tre. \
  Parfois il chuchote m\u00e9lancoliquement, d'habitude sur le sujet de bloquer.

f.emberbreak_shield = Ce bouclier est un Proto Shield qui a \u00e9t\u00e9 modifi\u00e9 pour prot\u00e9\
  ger, dans une certaine mesure, du feu.

f.feral_shell = Un bouclier alchimis\u00e9 avec une carapace durcie. M\u00eame les plus ac\u00e9r\u00e9\
  s griffes d'un wolver ricochetent sur cette carapace compacte.

f.firebreak_shield = Ce bouclier est un Emberbreak Shield qui a \u00e9t\u00e9 modifi\u00e9 pour prot\u00e9\
  ger plus efficacement du feu.

f.force_buckler = Ce bouclier est un Proto Shield qui a \u00e9t\u00e9 modifi\u00e9 pour prot\u00e9ger des attaques \u00e9tourdissantes.

f.frostbreaker_shield = Ce bouclier est un Proto Shield qui a \u00e9t\u00e9 modifi\u00e9 pour prot\u00e9\
  ger, dans une certaine mesure, du gel.

f.gorgomega = Un bouclier terrifiant qui combine la force \u00e9crasante d'un gorgo et le \
  mythique tortomega. \u00c9craser les ennemis n'\u00e9tait jamais si amusant.

f.grand_tortoise = Un bouclier arm\u00e9 avec la fureur in\u00e9puisable d'un tortodrone. Les \
  plaques de cette carapace colossale \u00e9branlent comme l'\u00e9nergie instable dans le \
  bouclier attend avec impatience d'\u00eatre d\u00e9cha\u00een\u00e9e.

f.great_defender = Ce Defender am\u00e9lior\u00e9 dispose de son propre g\u00e9n\u00e9rateur d'\u00e9\
  nergie interne pour une protection plus efficace.

f.green_ward = Un bouclier solide avec un \u00e9clat \u00e9meraude qui prot\u00e8ge les recrues \
  Spiral Knights contre les pointes pointues et toxins toxiques.

f.grey_owlite_shield = Une r\u00e9plique splendide d'un bouclier qu'on croyait d'\u00eatre \
  fourni aux magiciens Owlite plus \u00e9minents. Quand on le manie, on sent de la vengeance \
  justifi\u00e9e.

f.grim_shell = Un bouclier alchimis\u00e9 avec la carapace d'un tortodrone corrompu. Il para\u00ee\
  t que les ombres s'allongent et s'accrochent au bouclier quand on le porte.

f.heater_shield = Ce bouclier dispose d'un fourneau int\u00e9gr\u00e9 qui garde son porteur \
  bien au chaud et le prot\u00e8ge de la plupart des attaques \u00e0 effet de gel. De nombreux \
  chevaliers s'en servent \u00e9galement de plaque de cuisson sur le terrain.

f.heavy_plate_shield = Un \u00e9norme bouclier renforc\u00e9 et parfait pour d\u00e9fendre \
  contre les coups et repousser les adversaires.

f.horned_owlite_shield = Un bouclier stable qui est similaire d'un sort qui a \u00e9t\u00e9 port\u00e9 \
  par des jeunes Owlites, on dit.

f.icebreaker_shield = Ce bouclier est un Frostbreaker Shield qui a \u00e9t\u00e9 modifi\u00e9 pour prot\u00e9\
  ger plus efficacement du gel.

f.iron_buckler = Ce petit bouclier de fer battu s'av\u00e8re l\u00e9g\u00e8rement plus r\u00e9\
  sistant que le Proto Shield.

f.ironmight_plate_shield = Un bouclier sup\u00e9rieur forg\u00e9 du sun silver, l'argent du \
  soleil. Le sens de son blason est perdu aux nuits des temps.

f.jelly_shield = Un \u00e9trange bouclier en mati\u00e8re visqueuse. \u00c0 l'instar des \
  monstres gluants, il prot\u00e8ge tr\u00e8s efficacement des attaques perforantes.

f.mighty_defender = Ce bouclier de Spiral Knight am\u00e9lior\u00e9 a \u00e9t\u00e9 renforc\u00e9 \
  pour le combat et travaill\u00e9 avec go\u00fbt pour faire bonne impression dans les \
  histoires qui seront racont\u00e9es plus tard sur son porteur.

f.mighty_shell = Un bouclier alchimis\u00e9 avec la carapace d'un tortodrone. En l'\u00e9levant, vous sentez les \u00e9\
  nergies furieuses en attente d'\u00eatre d\u00e9cha\u00een\u00e9es.

f.nether_shell = Un bouclier alchimis\u00e9 avec la carapace d'un tortodrone corrompu. On peut \
  entendre un hurlement tourment\u00e9 de rage sur le vent quand le bouclier pulv\u00e9rise vos ennemis.

f.omega_shell = Ce bouclier puissant mais extr\u00eamement lourd a \u00e9t\u00e9 taill\u00e9 \
  dans la carapace d'une Tortomega. Seuls les guerriers les plus forts l'utilisent.

f.omegaward = Le rhythme r\u00e9gulier de ces plaques \u00e9l\u00e9mentaires du bouclier \
  s'agissent instantan\u00e9ment aux mauvais temps, en vous prot\u00e9geant contre le froid ou \
  l'ardeur extr\u00eame.

f.owlite_shield = Un joyau en bois, grav\u00e9 avec l'image grossi\u00e8re d'un Owlite perdu \
  depuis longtemps.

f.plate_shield = Un bouclier de fer lourd expert dans l'avertissement des coups qui vous \u00e9tonneraient.

f.primal_shell = Un bouclier alchimis\u00e9 avec la carapace d'un tortodrone. Les plaques \
  utilis\u00e9es dans la fabrication du bouclier fournissent un peu de protection contre les \u00e9l\u00e9ments de feu et de gel.

f.proto_shield = Un petit bouclier, fourni \u00e0 toutes les recrues au sein des Spiral \
  Knights.

f.rock_jelly_shield = Fabriqu\u00e9 a partir des plus adamantin des sp\u00e9cimen slimes, il \
  fonctionne aussi comme ration d'urgence pour des chevaliers naufrag\u00e9s.

f.royal_jelly_shield = Sauvegarde super pour soliciteurs du Tr\u00f4ne-Gel\u00e9e.

f.savage_tortoise = Un bouclier alchimis\u00e9 avec une carapace durcie. M\u00eame un wolver d\u00e9cha\u00eenant aura des difficult\u00e9\
  s perforant les plaques renforc\u00e9es.

f.scale_shield = Un bouclier tr\u00e8s \u00e9l\u00e9gant en \u00e9cailles de l\u00e9zard. Bien \
  qu'assez fragile, il r\u00e9siste particuli\u00e8rement bien aux attaques perforantes gr\u00e2ce \u00e0 ses \u00e9cailles tr\u00e8s serr\u00e9es.

f.scarlet_shield = D\u00e9couvert dans la Scarlet Fortress, ce bouclier octroie une certaine \
  quantit\u00e9 de sant\u00e9 suppl\u00e9mentaire \u00e0 son porteur. Ceux qui l'ont d\u00e9j\u00e0 brandi racontent qu'il \u00e9\
  met parfois un imperceptible battement de c\u0153ur.

f.scary_skelly_shield = Un petit bouclier effrayant pour vous sauvegarder des ombres.

f.shining_ward = Ce bouclier sacr\u00e9 prot\u00e8ge son porteur de tous les mal\u00e9fices.

f.sinister_skelly_shield = Un bouclier en cerf-volant hant\u00e9 par un fant\u00f4me amiable. \
  Il devrait vous donner un moyen de d\u00e9fense vif contre les ombres.

f.skelly_shield = Un bouclier endiabl\u00e9 mieux utilis\u00e9 pour combattre l'\u00e9nergie diabolique.

f.stoic_shell = Un bouclier alchimis\u00e9 avec la carapace d'un tortodrone. En l'\u00e9levant, \
  vous sentez le murmure silencieux du vent et invoquez les grondements de la temp\u00eate qui suivent.

f.stone_tortoise = Ce bouclier puissant et imposant ressemble \u00e0 une carapace. Son poids \u00e9lev\u00e9 \
  ne facilite pas les attaques.

f.stop_sign = Un \u00e9trange bouclier capable de prot\u00e9ger de nombreuses alt\u00e9rations d'\u00e9tat. Son seul inconv\u00e9\
  nient, c'est qu'il force le porteur \u00e0 s'arr\u00eater lorsqu'il s'abrite derri\u00e8re lui.

f.surge_breaker_shield = Un bouclier fiable qui vous garderai mise \u00e0 terre.


f.teddy_bear_buckler = Un bouclier \u00e9nergetique d'haute technologie d\u00e9guis\u00e9 comme \
  un nounours innocent. Le meilleur compagnon pour se d\u00e9fendre contre les minions de la \
  nuit.

f.thwacker_shield = Ce bouclier a \u00e9t\u00e9 recycl\u00e9 par les Gremlins et port\u00e9 par \
  des Darkfang Thwackers. \u00c0 l'instar des Gremlins eux-m\u00eames, il r\u00e9siste au feu et aux \u00e9\
  lectrocutions. Les chevaliers qui l'utilisent racontent qu'il est impossible de lui arracher \
  tous ses poils.

f.twisted_targe = Une targe tullegeaise qui donnera des dents \u00e0 vos coups d'\u00e9p\u00e9e.

f.volcanic_plate_shield = Un bouclier sup\u00e9rieur imbu de l'essence \u00e9l\u00e9mentaire \
  des flammes. Il est tellement r\u00e9sistant aux hautes temp\u00e9ratures qu'on ne sais pas \
  comment il a \u00e9t\u00e9 forg\u00e9 au d\u00e9but.

f.volt_breaker_shield = Ce bouclier est un Circuit Breaker Shield qui a \u00e9t\u00e9 modifi\u00e9 pour prot\u00e9\
  ger plus efficacement des \u00e9lectrocutions.

f.wild_shell = Un bouclier alchimis\u00e9 avec une carapace durcie. C'est assez in\u00e9\
  branlable pour qu'une pique d'un gel\u00e9e soit \u00e9mouss\u00e9e sur l'impact.

f.wise_owlite_shield = On n'a pas besoin d'un \u00e9rudit Owlite renomm\u00e9 pour saisir que d\u00e9fendre soi-m\u00ea\
  me avec un bouclier est une bonne id\u00e9e.

f.wyvern_scale_shield = Un bouclier \u00e9pineux forg\u00e9 des chitines qui donne une r\u00e9\
  sistance ample au chaleur et la poison.

f.honor_shield_1 = Un bouclier de c\u00e9r\u00e9monie fourni aux recrues de Spiral Knight. M\u00ea\
  me si c'est pour des occasions officiels, ce bouclier aussi acceptable de l'utiliser en \
  combat gr\u00e2ce \u00e0 sa construction solide.

f.honor_shield_2 = Un bouclier de c\u00e9r\u00e9monie fourni aux Spiral Knights aguerris. M\u00ea\
  me si c'est pour des occasions officiels, ce bouclier aussi acceptable de l'utiliser en \
  combat gr\u00e2ce \u00e0 sa construction solide.

f.honor_shield_3 = Un bouclier de c\u00e9r\u00e9monie fourni aux Champions d'Ordre Spiral. M\u00ea\
  me si c'est pour des occasions officiels, ce bouclier aussi acceptable de l'utiliser en \
  combat gr\u00e2ce \u00e0 sa construction solide.

f.honor_shield_4 = Un bouclier de c\u00e9r\u00e9monie fourni aux Avant-gardes d'Ordre Spiral. M\u00ea\
  me si c'est pour des occasions officiels, ce bouclier aussi acceptable de l'utiliser en \
  combat gr\u00e2ce \u00e0 sa construction solide.

f.the_bitter_end = Un bouclier port\u00e9 par tous les membres des Gardes \u00c9claireurs. Son \
  nom est un rappel aux toutes les Gardes quand ils sont permis de faire tomber son bouclier en \
  bataille.

f.the_final_gasp = Un bouclier port\u00e9 par tous les membres des \u00c9claireurs \u00e9\
  carlates. Son nom est un rappel \u00e0 tous les \u00c9claireurs pour les aviser quand ils \
  sont permis de laisser tomber son bouclier en bataille.

f.nodeslime_shield = Ce fronton frissonnant et \u00e9rod\u00e9 peut se tenir contre la force \
  quand les fantassins hardis le manie avec ardeur.

f.power_mitt = Une n\u00e9cessit\u00e9 dans tous les cuisines. Avec une bonne taille et la \
  surface faite avec le Silverweave dur, c'est parfait pour cuisiner \u00e0 feu \u00e9lev\u00e9\
  e. Maintenant on cuisine avec le feu!






# Gear Trinket names
#...................................................................................................

# unused/disbled trinkets (START)
# (END) unused/disabled trinkets

m.trueshot_module = Recette Trueshot Module

f.true_love_locket = Un petit m\u00e9daillon en forme de c\u0153ur dans lequel il est inscrit: \u00abTu resteras \u00e0 jamais dans mes pens\u00e9es. Je t'aime. Puppy.\u00bb

f.gift_of_autumn = Ch\u00e9rie par des voyageurs, la breloque remarquable r\u00e9conforte le \
  porteur pendant l'hiver.

f.silver_solstice_ring = Un anneau enchant\u00e9 qui incarne l'esprit du solstice. Son lustre \
  scintillant argent\u00e9 brille le plus pendant les mois en hiver.

f.golden_solstice_ring = Un anneau enchant\u00e9 qui incarne l'esprit du solstice. Son lustre \
  scintillant dor\u00e9 brille le plus pendant les mois en \u00e9t\u00e9.

f.grand_solstice_ring = Un anneau enchant\u00e9 et magnifique qui incarne l'esprit du solstice. \
  Sa surface a l'air de changer sa couleur avec le temps; quelquefois chaud et quelquefois \
  froid au toucher.





# Alchemy orbs
#...................................................................................................

f.flawed_orb = Un \u00e9l\u00e9ment rare et mis en capsule, utilis\u00e9 pour la transmutation \
  d'alchimie. Malgr\u00e9 ses d\u00e9fauts, ce globe est encore utile pour la fabrication \
  d'items de baisse puissance.

f.simple_orb = Un \u00e9l\u00e9ment rare et mis en capsule, utilis\u00e9 pour la transmutation \
  d'alchimie. Bien que l'\u00e9l\u00e9ment soit peu raffin\u00e9, ce globe est encore utile \
  pour fabriquer les items plus forts.

f.advanced_orb = Un \u00e9l\u00e9ment rare et mis en capsule, utilis\u00e9 pour la \
  transmutation d'alchimie. Ce globe est exceptionel et peut \u00eatre utilis\u00e9 pour \
  fabriquer des items vraiment puissants.

f.elite_orb = Un \u00e9l\u00e9ment rare et mis en capsule, utilis\u00e9 pour la transmutation \
  d'alchimie. Les globes comme ceux-ci sont utilis\u00e9s par les chevaliers d'\u00e9lite pour \
  fabriquer les items de qualit\u00e9 et puissance exceptionnelle.

f.eternal_orb = Un \u00e9l\u00e9ment rare et mis en capsule, utilis\u00e9 pour la transmutation \
  d'alchimie. Ce globe est pris\u00e9 par les chevaliers puissants et utilis\u00e9 pour \
  fabriquer les fortes items extraordinaires.


# Fire crystals
#...................................................................................................

f.cracked_crystal = Une rare formation cristallis\u00e9e de chaleur, utilis\u00e9e pour forger \
  les armes et \u00e9quipements de haut niveaux. Bien qu'elle soit fendue, elle rougeoie \
  tellement faiblement.

f.dim_crystal = Une rare formation cristallis\u00e9e de chaleur, utilis\u00e9e pour forger les \
  armes et \u00e9quipements de haut niveaux. La chaleur dedans vacille comme une petite bougie.

f.warm_crystal = Une rare formation cristallis\u00e9e de chaleur, utilis\u00e9e pour forger les \
  armes et \u00e9quipements de haut niveaux. La chaleur dedans est assez chaud pour se r\u00e9chauffer ses mains.

f.glowing_crystal = Une rare formation cristallis\u00e9e de chaleur, utilis\u00e9e pour forger \
  les armes et \u00e9quipements de haut niveaux. La chaleur dedans br\u00fble assez \
  lumineusement pour illluminer une chambre sombre.

f.shining_crystal = Une rare formation cristallis\u00e9e de chaleur, utilis\u00e9e pour forger \
  les armes et \u00e9quipements de haut niveaux. La chaleur dedans br\u00fble comme une \u00e9\
  toile brillant dans la nuit.

f.radiant_crystal = Une rare formation cristallis\u00e9e de chaleur, utilis\u00e9e pour forger \
  les armes et \u00e9quipements de haut niveaux. La chaleur dedans est sauvage et myst\u00e9\
  rieuse, plus brillant que tous les feux du monde.


# Material names
#...................................................................................................

f.ancient_shell = Un fragment d'une robuste carapace de Tortodrone. On dit qu'en dormant sur \
  une carapace de Tortodrone, on peut sentir les vibrations subtiles qui \u00e9voquent ces \u00ea\
  tres tonitruants vers la destination finale de la Longue Migration.

f.beast_scale = Cette \u00e9caille relativement intacte a \u00e9t\u00e9 pr\u00e9lev\u00e9e sur une cr\u00e9ature des Rouages.

f.binding_essence = Un r\u00e9actif \u00e9trange et inf\u00e2me, pens\u00e9 d'avoir \u00e9t\u00e9 employ\u00e9 par les Apocrea pour b\u00e2tir leurs \u00e9\
  difices. Votre peau, un fois tach\u00e9, ne sera jamais propre. Non... \u00e7a doit \u00eatre \
  possible, il suffit de frotter plus fort. Plus fort, oui...

f.blast_powder = Tous ceux qui appr\u00e9cient les explosions se procurent cette dangereuse \
  substance explosive produite par les Gremlins.

f.blaze_pepper = Une \u00e9pice succulente que certaines b\u00eates sauvages des Rouages \
  amassent en pr\u00e9vision d'un hiver qui ne vient jamais.

f.blighted_bone = Une rotule ridicule ayant vu des meilleurs jours... son absence doit 'nuit're \
  au chevalier.

f.blue_shard = Un tesson de Moonstone trop petit pour fournir de l'\u00e9nergie aux portes, \
  mais tr\u00e8s utile pour l'alchimie.

f.brimstone = On trouve ces \u00e9clats de pierre sulfurique naus\u00e9abonds dans les enfers.

f.book_of_dark_rituals = Un grimoire ancien, rempli avec des rites bizarres et indescriptibles. \
  Comme les autres tomes maudits, il y a probablement un personne tordu qui veut ce livre pour \
  les motifs abominables. \u00c9changer avec caution.

f.bottomless_stocking = Un accroc interdimensionnel dans cette chaussure engloutit tous les \
  items plac\u00e9s dans le v\u00eatement. Il a m\u00eame aval\u00e9 les points.

f.bronze_bolt = On trouve ces boulons de bronze ordinaires un peu partout dans les Rouages.

f.brute_core = Cette masse bleue et suintante provient d'un ennemi g\u00e9latineux particuli\u00e8rement puissant.

f.bushy_tail = Un sp\u00e9cimen curieusement intact de queue de b\u00eate sauvage vivant dans \
  les Rouages.

f.celestial_ore = Un m\u00e9tal extr\u00eament rare et puissant, dit de venir des cieux. \
  D'habitude, on le gaspille sur des couronnes et des bijoux pour les rois des gel\u00e9es.

f.chroma_tear = Une larme en cristale de Chromalisk fonctionnant comme lentille de focalisation \
  pour les armes, ou bien pour aider les chevaliers myopes.

f.cooling_cell = Ce petit appareil emp\u00eache les machines complexes de surchauffer. Vous \
  pouvez \u00e9galement en garder un dans votre poche les jours de canicule.

f.corrosive_acid = Une substance corrosive, caract\u00e9ristique de cr\u00e9atures caustiques.

f.crest_of_ur = Un timbre venant de la L\u00e9gion d'Ur, une fanfare de guerriers d\u00e9mona\u00ef\
  ques qu'on dit d'avoir conquis les Enfers. Quiconque le tient \u00e0 la main peut \u00e9\
  tendre faiblement le son de tambours et le galop de sabots.

f.crimsonite_shard = Cet \u00e9clat de Crimsonite est trop petit pour alimenter les portes, \
  mais il est tr\u00e8s utile pour la pratique de l'alchimie.

f.critter_carapace = Un fragment de chitine d\u00e9coll\u00e9 avec pr\u00e9caution de la \
  carapace d'une cr\u00e9ature des Rouages. C'est \u00e9tonnant, mais il semble intact.

f.cursed_idol = Cette petite statue de pierre repr\u00e9sente l'un des d\u00e9mons sup\u00e9\
  rieurs qui pullulent dans les enfers. Ses couleurs sombres forment des motifs sans cesse diff\u00e9\
  rents qui rappellent des volutes de fum\u00e9e.

f.dark_ember = Une particule d'\u00e9nergie ardente, sauv\u00e9e du tr\u00f4ne du Lord \
  Vanaduke. Elle couve calmement avec une intensit\u00e9 sinistre, en cr\u00e9ant une transe \
  hypnotique quand on la regarde fixement pour une dur\u00e9e de temps.

f.dark_matter_shard = Cet \u00e9clat de Dark Matter est trop petit pour alimenter les portes, \
  mais il est tr\u00e8s utile pour la pratique de l'alchimie.

f.dark_shard = Un tesson de Dark Matter trop petit pour fournir de l'\u00e9nergie aux portes, \
  mais tr\u00e8s utile pour l'alchimie.

f.dead_gold = Une pi\u00e8ce de monnaie mise dans les mains du d\u00e9c\u00e8s avant \
  l'enterrement, en lui accordant l'argent pour le long voyage.

f.dragon_scale = Une \u00e9caille armuri\u00e9e parvenant d'une cr\u00e9ature qu'on pensait \u00ea\
  tre disparue. Ses facettes refl\u00e8tent la lumi\u00e8re d'une mani\u00e8re \u00e9th\u00e9r\u00e9e.

f.drake_scale = Une \u00e9caille d\u00e9chir\u00e9 d'une b\u00eate brutale.

f.driftwood = Ce dr\u00f4le de morceau de bois ne tient pas en place.

f.ecto_drop = Une goutte d'ectoplasme pr\u00e9lev\u00e9e m\u00e9ticuleusement sur le corps d'un \
  mort-vivant volontaire mais r\u00e9calcitrant. Elle est d'un vert maladif.

f.enamorock = Un caillou \u00e9trange qui sent chaleureux quand vous le tenez.

f.everfrost = Une petite plaque de verglas que ne fond jamais, m\u00eame quand elle est mise au \
  feu.

f.fiendglyph = Un fragment d'un Fiendish ID Card. Combiner les cinq glyphs en une carte ID vous \
  permet d'ouvrir le Portail sinistre dans le Bosquet ancien.

f.fiend_portal_key = Utiliser celle-ci vous permet d'ouvrir et traverser le Portail sinistre \
  dans le Bosquet ancien.

f.fine_fabric = Une longueur de tissu solide et de bonne facture d\u00e9rob\u00e9e \u00e0 un \
  habitant des Rouages.

f.flame_soul = Quand une cr\u00e9ature meurt en furie flambante, on trouve parfois cette \
  essence puissante.

f.forbidden_fruit = Le casse-cro\u00fbte pr\u00e9f\u00e9r\u00e9 des d\u00e9mons affam\u00e9s.

f.force_dynamo = Un gadget captivant qui semble g\u00e9n\u00e9rer de l'\u00e9nergie \u00e0 partir de rien.

f.frayed_fabric = Les v\u00eatements us\u00e9s d'un autochtone des Rouages. Vous devriez \
  pouvoir les recycler.

f.frost_gel = Une goutte gluante r\u00e9colt\u00e9 d'un gamin glac\u00e9 des Rouages.

f.fuel_canister = Un petit r\u00e9cipient qui contenait le carburant d'une machine complexe.

f.ghost_bell = Les fant\u00f4mes les plus pr\u00e9venants portent cette petite cloche argent\u00e9\
  e afin d'informer les vivants de leur pr\u00e9sence.

f.gel_core = Un bloc de mati\u00e8re visqueuse de la taille d'un poing, r\u00e9cup\u00e9r\u00e9 sur la d\u00e9pouille d'un blobeux.

f.gel_drop = Une goutte de mati\u00e8re visqueuse pr\u00e9lev\u00e9e sur un blobeux. Elle fr\u00e9mit encore.

f.grave_soil = Cette terre maudite a \u00e9t\u00e9 trouv\u00e9e en creusant dans une crypte \
  sinistre. Elle reste froide au toucher.

f.green_shard = Un tesson de Valestone trop petit pour fournir de l'\u00e9nergie aux portes, \
  mais tr\u00e8s utile pour l'alchimie.

f.gremlin_gizmo = Un dispositif \u00e9trange que les Gremlins utilisent dans leurs machines. On \
  peut y lire un avertissement: \u00abne pas exposer \u00e0 la lumi\u00e8re directe du soleil \
  ni plonger dans l'eau\u00bb.

f.gremlonium = Un compos\u00e9 tr\u00e8s avanc\u00e9 cr\u00e9\u00e9 par des ing\u00e9nieurs \
  gremlin pour alimenter leurs machines les plus sournoises. Il \u00e9mette un sifflement \
  troublant.

f.hailstone = Un caillou qui est toujours un peu froid au toucher. C'est fantastique pour \
  refroidir son breuvage sans le diluer!

f.heavy_gear = Un engrenage que assistait jadis dans l'op\u00e9ration d'une machine \u00e9norme.

f.indestructible_giftwrap = Il sera impossible d'ouvrir les cadeaux emball\u00e9s avec ce gag \
  Grinchlin. Confier le service d'emballage complimentaire aux Grinchlins pour g\u00e2cher les f\u00eates pour tous et toutes.

f.iron_gear = Cet engrenage de m\u00e9tal faisait autrefois partie d'une machine complexe.

f.ironwood = Une b\u00fbche parfaite de l'une des substances les plus dures que connaissent les \
  Spiral Knights.

f.jelly_glue = Un compos\u00e9 visqueux d\u00e9velopp\u00e9 par des Biotechs pour permettre \
  l'examen de cr\u00e9atures gel\u00e9es. Quand il est m\u00e9lang\u00e9 avec une substance \
  visqueuse et une mati\u00e8re gel\u00e9e, il permet le moulage sans perdant sa forme. M\u00eame s'il est r\u00e9serv\u00e9 \
  pour les buts scientifiques, ce proc\u00e8s est consid\u00e9r\u00e9 \u00absuper amusant\u00bb.

f.kat_tribe_fetish = Un charme en lambeaux du Kat Tribe, maintenant disparu et non-existant. \
  Ils sont les excellent guerriers, responsables pour la destruction des Owlites et son Acad\u00e9\
  mie de la Magie. Les charmes \u00e9taient port\u00e9s par les guerriers Kat m\u00eame en \
  bataille. On dit que ces charmes apportent de la chance, malgr\u00e9 le terrible destin du \
  Kat Tribe.

f.light_shard = Un tesson de Luminite trop petit pour fournir de l'\u00e9nergie aux portes, \
  mais tr\u00e8s utile pour l'alchimie.

f.luminite_shard = Cet \u00e9clat de Luminite est trop petit pour alimenter les portes, mais il \
  est tr\u00e8s utile pour la pratique de l'alchimie.

f.lump_coal = Un cadeau Grinchlin pour ceux qui \u00e9taient bon ou m\u00e9chant. Les \
  Grinchlins ne manque aucune occasion d'\u00eatre un rabat-joie.

f.maidens_tear = Un bijou sacr\u00e9 ch\u00e9ri par les chevaliers almiriens. Un cadeau de \
  leurs amoureux, il est dit de leur sauvegarder en bataille.

f.meteor_mote = Un morceau minuscule de mat\u00e9riel rare, dit d'avoir tomb\u00e9 du ciel. Les \
  Gremlins l'utilise typiquement dans le construction de sources d'alimentation.

f.miracloth = Un rouleau de tissu merveilleux, aussi beau que souple.

f.mod_calibrator = Cet appareil compliqu\u00e9 fut construit sp\u00e9cialement pour calibrer \
  les mods, et ne doit pas \u00eatre m\u00e9lang\u00e9 avec un Calibrator Mod, qui modifie les \
  calibrateurs. C'est fa\u00e7ile de se tromper.

f.monster_bone = Un os encore intact pr\u00e9lev\u00e9 sur la d\u00e9pouille d'une b\u00eate f\u00e9roce.

f.moonstone_shard = Cet \u00e9clat de Moonstone est trop petit pour alimenter les portes, mais \
  il est tr\u00e8s utile pour la pratique de l'alchimie.

f.mug_misery = Seules les \u00e2mes les plus noires utilisent ce r\u00e9cipient maudit qui, \
  d'apr\u00e8s la rumeur, ferait pleuvoir les pires tourments sur tous ceux que sa victime \
  approche.

f.nightmare_mane = Un manteau de fourrure \u00e0 gros grain pris d'un Snarbolax. Chaque fibre \
  semble friser et s'\u00e9ffilocher comme s'il \u00e9tait encore vivant.

f.nightshade = Une herbe hasardeuse qui endommage la sant\u00e9 de plusieurs b\u00eates, mais qui est d\u00e9licieux aux cr\u00e9atures toxiques.

f.obsidian_shard = Un tesson noir de jais de pierre non naturel. Quand on le tient, on semble \
  voir un rivage lointain o\u00f9 des vagues brisent contre des rochers qui semblent se tordre \
  dans le froid.

f.owlite_feather = Une petite plume arrach\u00e9e \u00e0 un Owlite, race d'oiseaux mythiques \
  dot\u00e9s de grands pouvoirs magiques.

f.perfect_snowball = Une boule de neige \u00e0 la perfection presque surnaturelle. Bien qu'elle \
  donne envie de viser quelqu'un en pleine t\u00eate, il serait pr\u00e9f\u00e9rable de \
  l'utiliser en alchimie.

f.perplexing_element = Un m\u00e9tal rare r\u00e9cup\u00e9r\u00e9 d'une montagne ruin\u00e9e \
  dans le coeur du pays de l'Apocrea. Sous le microscope, il poss\u00e8de une g\u00e9om\u00e9trie impossible. Peut-\u00eatre que des \u00e9tudes d\u00e9di\u00e9\
  s, loin du monde distrayant, d\u00e9voileraient ses secrets.

f.phial_phear = Ce tube de verre contient une petite dose de froussium, un \u00e9l\u00e9ment \
  chimique peu commun qui d\u00e9clenche une peur panique chez celui qui en respire une bouff\u00e9e.

f.philoso_feather = Une grande plume grise arrach\u00e9e \u00e0 l'un des plus grands magiciens \
  Owlites.

f.plague_essence = Quand une cr\u00e9ature p\u00e9rit d'une peste paticuli\u00e8rement putride, \
  on trouve parfois cette essence puissante.

f.plasma_cell = Une source de plasma high-tech qui pourrait bien \u00e9blouir son d\u00e9tenteur de sa science.

f.power_cell = Un petit dispositif servant \u00e0 alimenter en \u00e9nergie des machines \
  complexes.

f.primal_ore = Un m\u00e9tal extraordinaire imbu d'un esprit sauvage.

f.punkin_sprout = Un petit brin capable d'agrandir \u00e0 une grande gourde.

f.razor_ribbon = N'oubliez pas de porter les gantelets bien armur\u00e9s quand on manipule les \
  cadeaux Grinchlin.

f.reaper_rib = Un os teint\u00e9 noir par la malveillance de son ancien propri\u00e9taire.

f.red_shard = Un tesson de Crimsonite trop petit pour fournir de l'\u00e9nergie aux portes, \
  mais tr\u00e8s utile pour l'alchimie.

f.redwood = Un solide morceau de bois inachev\u00e9. On l'utilise en g\u00e9n\u00e9ral pour \
  fabriquer des placards.

f.rock_salt = Un \u00e9br\u00e9chure des Rouages infus\u00e9 avec... la vide. Son faim \
  engloutit les saveurs et essences des alentours. Les cuisiniers le r\u00e9clament, mais les \
  jellies, eux, le craignent.

f.rocket_sprocket = Une roue dent\u00e9e robust utilis\u00e9e par des machines qui lancent des \
  projectiles.

f.rocky_core = Un r\u00e9gal delicieux et gommeux avec une coquille min\u00e9rale imp\u00e9n\u00e9\
  trable. Plusieurs chevaliers ont perdu leurs dents en essayant de franchir ses d\u00e9fenses.

f.royal_core = Une masse odorante de boue r\u00e9colt\u00e9e d'un slime sp\u00e9cialement noble.

f.royal_skewer = Une pointe d\u00e9chiquet\u00e9e et aff\u00fbt\u00e9e venant de l'un des \
  blobeux plus fort sur Cradle. Lorsqu'elle est enl\u00e9v\u00e9e, la pointe deviendra fragile, \
  diminuera jusqu'aux poussi\u00e8res.

f.schemer_scrap = Un fragment d'un plan utilis\u00e9 par les intrigants gremlin pour construire \
  ces monstruosit\u00e9s m\u00e9caniques. Si vous avez assez de ces fragments et un peu de \
  ruban, vous pourriez construire une machine m\u00e9tal de mort aussi!

f.scrap_metal = Un morceau de m\u00e9tal mis au rebut, mais qui pourrait facilement \u00eatre recycl\u00e9.

f.seerus_fragment_1 = Un fragment fractur\u00e9 de la masque une fois port\u00e9e par Warmaster \
  Seerus, r\u00e9cup\u00e9r\u00e9 du si\u00e8ge de son Grand Arsenal.

f.seerus_fragment_2 = Un fragment imparfait de la masque une fois port\u00e9e par Warmaster \
  Seerus, r\u00e9cup\u00e9r\u00e9 du si\u00e8ge de son Grand Arsenal.

f.seerus_fragment_3 = Un fragment parfait de la masque une fois port\u00e9e par Warmaster \
  Seerus, r\u00e9cup\u00e9r\u00e9 du si\u00e8ge de son Grand Arsenal.

f.shadow_steel = Un m\u00e9tal extraordinaire imbu des t\u00e9nebres de l'enfer.

f.sharp_fang = Une pr\u00e9molaire particuli\u00e8rement pointue. \u00c0 moins que ce ne soit \
  une canine?

f.silver_coil = Un m\u00e9canisme \u00e9lectromagn\u00e9tique de m\u00e9tal extr\u00eamement conducteur.

f.silverweave = Une longueur de tissu et de m\u00e9tal pr\u00e9cieux entrelac\u00e9s. Ostentatoire sans \u00eatre tape-\u00e0-l'\u0153il, il prot\u00e8ge tr\u00e8\
  s bien celui qui le porte.

f.sinful_brew = Une boisson nocive, pr\u00e9f\u00e9r\u00e9e par tous les d\u00e9mons. Malgr\u00e9 sa pr\u00e9\
  dominance, c'est officiellement ill\u00e9gale dans les Enfers comme un stratag\u00e8me de marketing.

f.snarbostuffing = Une bourre en peluche fabriqu\u00e9e avec un polym\u00e8re qui ne d\u00e9\
  compose pas quand elle est m\u00e9lang\u00e9e avec la fourrure maudit du Snarbolax. C'est \
  parfait pour cr\u00e9er des troph\u00e9es ou des peluches adorables et maudits.

f.soul_dust = La poussi\u00e8re d'un d\u00e9funt. On ignore si elle conserve certaines \
  parcelles de son \u00e2me.

f.spark_plug = Une petite pi\u00e8ce m\u00e9canique de laquelle fonctionne bien avec le moteur \
  d'un monstre m\u00e9canique.

f.spoiled_treat = Ceux qui sont malchanceux de voyager dans le pass\u00e9 de Festiver auront \
  mal au ventre.

f.storm_chaser = Un \u00e9lementaire qu'on trouve stagnant dans les nuages orageux. Son \
  boudonnement \u00e9l\u00e9ctrique cr\u00e9e un choeur m\u00e9lodique qui est faiblement \u00e9\
  ntendu entre les coups de tonnerre.

f.sulfur = On trouve ces \u00e9clats de pierre sulfurique naus\u00e9abonds dans les enfers.

f.static_clinger = Un fil d'\u00e9nergie latente qui vogue parmi les Rouages, se collant \
  souvent au cheveux et aux v\u00eatements. C'est trop grand pour distiller et former de l'\u00c9\
  nergie, mais c'est tres utile pour l'alchimie.

m.supply_pack_compact = Paquet de Provisions Compact
f.supply_pack_compact = Un paquet de provisions utiles appr\u00e9ci\u00e9 par les \u00e9quipes \
  de recherche Spiral Knights qui travaillent au fond des Rouages. Ce paquet tient pour une \
  semaine pour un chevalier.

m.supply_deluxe_compact = Paquet de Provisions Deluxe
f.supply_deluxe_compact = Un paquet de provisions utiles appr\u00e9ci\u00e9 par les \u00e9\
  quipes de recherche Spiral Knights qui travaillent au fond des Rouages. Ce paquet tient pour \
  une semaine pour un peloton entier.

m.supply_standard_compact = Paquet de Provisions Standard
f.supply_standard_compact = Un paquet de provisions utiles appr\u00e9ci\u00e9 par les \u00e9\
  quipes de recherche Spiral Knights qui travaillent au fond des Rouages. Ce paquet tient pour \
  une semaine pour quelques chevaliers.

f.sun_silver = Un m\u00e9tal extraordinaire imbu du lumi\u00e8re \u00e9clatante des cieux.

f.swordstone = Une belle pierre naturelle, id\u00e9ale pour aff\u00fbter le tranchant d'une \u00e9p\u00e9e mortelle.

f.thunderball = Une boule d'\u00e9lectricit\u00e9 pure que l'on trouve g\u00e9n\u00e9ralement \
  au fond de la mer, aussi incroyable que cela puisse para\u00eetre.

f.torchstone = Un petit braise qui reste chaud. Les Gremlins qui font la patrouille dans les \
  Cooling Chambers les utilisent pour se garder d\u00e9congel\u00e9s..

f.toxic_core = Une masse solide et palpitant qui suinte le vitriol.

f.trojan_horseshoe = Un fer \u00e0 cheval noir de jais. Il semble \u00eatre plut\u00f4t innocent.

f.unstable_core = Un tas dangereux tir\u00e9 d'un d\u00e9tracteur fulminant. Il bourdonne...

f.valestone_shard = Cet \u00e9clat de Valestone est trop petit pour alimenter les portes, mais \
  il est tr\u00e8s utile pour la pratique de l'alchimie.

f.vile_seal = Un petit bout de parchemin ancien avec la magie sombre. On dit qu'elle donne la \
  force \u00e0 ceux qui ont des \u00e2mes malveillants.

f.volcanic_iron = Un m\u00e9tal extraordinaire imbu de l'\u00e9nergie br\u00fblante de magma.

f.volt_oil = Une substance glissante qui est toujours un peu charg\u00e9e d'\u00e9lectricit\u00e9.

f.warp_dust = Une l\u00e9g\u00e8re poussi\u00e8re laiss\u00e9 par une cr\u00e9ature qui voyage \
  avec une vitesse incroyable. C'est d\u00e9licieux dans un rago\u00fbt.

f.waste_module = Un petit r\u00e9ceptacle qui r\u00e9coltait jadis des ordures d'un engin \
  construit pour d\u00e9truire. Maintenant, ce n'est que d\u00e9geu.

f.wicked_idol = L'un des plusieurs statuettes, apport\u00e9e par des d\u00e9mons comme moyen \
  d'obtenir de la faveur avec les dieux ombreux. Les statues plus pr\u00e9cieuses sont les MEBS \
  (menthe en bo\u00eete sinistre).

f.wicked_whisker = Une moustache gagn\u00e9 d'h\u00e9ro Margrel de la grande Tribu Kat. \
  Traditionnellement, elle \u00e9tait port\u00e9 comme protection contre les magiques d'Owlite, \
  mais maintenant elle repr\u00e9sente les arts magiques de bien et sa triomphe de mal.

f.zee_core = Une masse mordante retir\u00e9e d'une agresseur visqueuse. Son \u00e2rome gu\u00e9\
  rit l'insomie, ainsi que le reniflage et l'\u00e9ternuement.

