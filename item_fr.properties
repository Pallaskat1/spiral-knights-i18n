f.token_core = Fragment de min\u00e9ral inconnu trouv\u00e9 dans le noyau des Rouages. Chaque \
  fragment semble avoir une composition unique, \u00e0 l'instar des flocons de neige. LeSpiral \
  HQ les recherche activement, car on estime pouvoir d\u00e9couvrir la nature m\u00eame du noyau en les \u00e9tudiant.

f.token_vanaduke = Un sceau du royaume perdu d'Almire prouvant que son porteur a brav\u00e9 l'\u00e9\
  difice de feu connu sous le nom de Citadelle Feurieuse.

f.token_jelly = Seuls les nobles Jellies poss\u00e8dent des Jelly Gems, pierres pr\u00e9cieuses molles qui repr\u00e9\
  sentent la monnaie officielle des royaumes blobeux. Bien qu'elles aient beaucoup de valeur \
  aux yeux de ces \u00eatres visqueux, la plupart des cr\u00e9atures les mangent car elles ont \
  un go\u00fbt exquis.

f.token_snarbolax = Une dent longue et mordante arrach\u00e9e de la m\u00e2choire d'un \
  Snarbolax: un souvenir r\u00e9pr\u00e9sentant le triomphe d'un chevalier contre le r\u00f4deur monstrueux des For\u00eats farouches.

f.token_roarmulus = Une plaque de circuit con\u00e7ue par les gremlins ing\u00e9nieurs pour r\u00e9\
  duire aux abois les adversaires des Jumeaux Roarmulus.

f.token_primal = Un brin minuscule de l'esprit essentiel de la nature. Le Spiral Order le \
  convoite. Apportez-le au Marchand de Jetons dans le Bazar de Haven!

f.token_forge = Un brin minuscule de l'esprit essentiel de la technologie et du progr\u00e8s. \
  Le Spiral Order le convoite. Apportez-le au Marchand de Jetons dans le Bazar de Haven!

f.token_grim = Un brin minuscule de l'esprit essentiel du noirceur et de la d\u00e9sint\u00e9\
  gration. Le Spiral Order le convoite. Apportez-le au Marchand de Jetons dans le Bazar de \
  Haven!

f.token_krogmo = Une pi\u00e8ce de monnaie que King Krogmo donne aux participants \u00e0 sa Colis\u00e9e. Elle peut \u00eatre \u00e9chang\u00e9\
  e contre des prix avec le Superviseur de Recompenses de la Colis\u00e9e.

f.token_candy = Un bonbon pr\u00e9par\u00e9 pour le Dark Harvest Festival. On peut l'\u00e9\
  changer contre les masques de costume dans la Place de la ville de Haven.

f.token_cake = Un morceau de g\u00e2teau qui sert de troph\u00e9e d'une victorie face \u00e0 \
  une meute de Creep Cakes. Chef Biscotti affirme que ni les troph\u00e9es ni l'incident qui \
  les a cr\u00e9\u00e9s n'ont jamais vraiment exist\u00e9s.

f.token_winter = Une petite liste de souhaits, \u00e9crite par l'un des enfants d'Emberlight. \
  Elle indique que vous avez r\u00e9alis\u00e9 ses souaites de f\u00eates et que vous avez sauv\u00e9 \
  Festiver. Cela ne vous remplit avec la joie joyeuse?

f.token_winter_wishlist = Il y a longtemps cette liste de souhaits \u00e9tait perdue. L\u00e0 \
  se trouve une liste de lins qui prot\u00e9gent contre la neige. Randolph donnera les prix aux \
  chevaliers gentils. Alors rapportez-les et gagnez un cadeau.

f.token_page = Une page tombant en morceau, cette page est un extrait d'un grimoire oubli\u00e9 \
  des archives de Moorcroft Manor. \u00c9crite sur la page, la langue ind\u00e9chiffrable \
  brille faiblement dans la noirceur comme elle contient le pouvoir dans les mots.

f.token_spirit = Une fl\u00e9trissure \u00e9ther\u00e9e mise sur une \u00e2me r\u00e9clam\u00e9e par l'Apocrea myst\u00e9rieux. Enlever la fl\u00e9trissure permet l'\u00e2me captive \u00e0 \u00e9\
  chapper d'emprisonnement dans le domaine d'Apocrea.

