# Gear Armor names
#...................................................................................................

f.ancient_plate_mail = On raconte que des titans portaient autrefois cette armure. Elle s'av\u00e8re extraordinairement r\u00e9\
  sistante, mais son poids ph\u00e9nom\u00e9nal entrave les mouvements.

f.angelic_raiment = Cette superbe armure brille en permanence comme un soleil.

f.almirian_crusader_armor = Un armure port\u00e9 par les gardes royales d'\u00e9lite de royaume \
  d'Almire. Son couleur d'ivoire \u00e9tait un symbole de puret\u00e9 d'Almire dans le pays\n\
  et dans les c\u0153urs de peuples.

f.arcane_salamander_suit = Un Salamander Suit instill\u00e9 avec du puissance magique. On pense \
  qu'il est cr\u00e9e par des laquais de sorci\u00e8res puissantes.

f.armor_fallen = Cette armure est maudite: elle fut jadis port\u00e9e par un \u00eatre c\u00e9leste banni du paradis.

f.ash_tail_coat = Ce manteau de cuir de bonne facture est dot\u00e9 d'un syst\u00e8me de chauffage qui prot\u00e8\
  ge son porteur des attaques \u00e0 effet de gel. Son secret? Une pinc\u00e9e de piments forts.

f.azure_guardian_armor = Ce sont les chefs du Spiral Order qui portent cette grandiose armure. \
  Aussi ajust\u00e9e que la peau d'une b\u00eate, elle s'av\u00e8re pourtant aussi confortable \
  qu'une Miracloth.

f.blazebreak_armor = Cette solide armure est capable de d\u00e9vier les arguments les plus \
  enflamm\u00e9s. Elle r\u00e9siste aussi plut\u00f4t bien aux attaques bas\u00e9es sur le feu.

f.black_kat_cloak = Une cape fabriqu\u00e9e d'une fa\u00e7on rudimentaire, resemblant \u00e0 un sombre soldat du g\u00e9nie de la Tribu Kat.

f.black_kat_mail = Une armure impressionnante et ensorcel\u00e9e avec la puissance de \
  Ravissommeils, les espions de la Tribu Kat.

f.black_kat_raiment = Un gilet maudit, envahissant avec l'\u00e9nergie de noir. On dit que ce \
  gilet ressemble \u00e0 Margrel, l'h\u00e9ro grand de la Tribu Kat. C'est lui qui a ouvert la \
  Livre de plumes grises et provoqu\u00e9 le Kataclysm. Ce capuchon-ci apporte la malchance \u00e0 \
  tous qui essayent de le porter.

f.blizzbreaker_armor = Cette solide armure est capable de d\u00e9vier les remarques les plus \
  glaciales. Elle r\u00e9siste aussi plut\u00f4t bien aux attaques \u00e0 effet de gel.

f.bombastic_demo_suit = Cette superbe armure a \u00e9t\u00e9 forg\u00e9e pour les rares \
  personnes capables de manipuler les explosifs avec panache et \u00e9l\u00e9gance... tout en \u00e9vitant de finir r\u00e9duites en miettes.

f.boosted_plate_mail = Cette armure de plates est une Spiral Plate Mail dot\u00e9e d'un g\u00e9n\u00e9rateur d'\u00e9\
  nergie surpuissant. Son am\u00e9lioration l'a encore alourdie.

f.brute_jelly_mail = Cette robuste armure de mailles mucilagineuses a \u00e9t\u00e9 fabriqu\u00e9\
  e avec les restes de blobeux particuli\u00e8rement f\u00e9roces.

f.chaos_cloak = On raconte que ce manteau prot\u00e8ge des dangers qui r\u00f4dent dans le \
  royaume sans nom o\u00f9 les \u00e9l\u00e9ments convergent et divergent en un mouvement perp\u00e9tuel.

f.charged_quicksilver_mail = Un ensemble augment\u00e9 de Quicksilver Mail qui vous dynamisera.

f.chroma_suit = Cette armure a \u00e9t\u00e9 taill\u00e9e dans le cuir d'un Chromalisk. \u00c9\
  tonnamment, les Chromalisks sont flatt\u00e9s qu'on fabrique de telles armures.

f.circuit_breaker_armor = Cette armure dot\u00e9e d'un noyau \u00e9l\u00e9mentaire pirat\u00e9 a \u00e9t\u00e9 con\u00e7ue pour r\u00e9sister aux d\u00e9charges \u00e9\
  lectriques. Cette modification non standard entra\u00eene cependant certaines faiblesses \u00e9l\u00e9mentaires.

f.cobalt_armor = Cette armure ultraperformante du Spiral Order est adapt\u00e9e \u00e0 toutes les aventures.

f.deadly_virulisk_suit = Cette belle armure a \u00e9t\u00e9 taill\u00e9e dans le cuir des \
  Virulisks les plus enrag\u00e9s. Malheureusement, elle n'a rien conserv\u00e9 de leur capacit\u00e9 \u00e0 se camoufler.

f.deadshot_mantle = Un poncho pour le cavalier solitaire qui lutte contre les brutes, les \
  truands et les morts-vivants des ombres.

f.deep_sea_cuirass = Cette armure est compos\u00e9e d'\u00e9cailles chatoyantes qui semblent \
  onduler comme des vagues scintillantes. Toujours froide et humide par nature, elle n'est pas \
  particuli\u00e8rement confortable.

f.divine_mantle = Cette cape divine aurait \u00e9t\u00e9 port\u00e9e par les sages du paradis.

f.dragon_scale_mail = Cette armure mythique est constitu\u00e9e des \u00e9cailles d'une cr\u00e9ature l\u00e9gendaire.

f.drake_scale_mail = Cette armure a \u00e9t\u00e9 forg\u00e9e \u00e0 partir des \u00e9cailles de cr\u00e9\
  atures que l'on dit descendre des dragons.

f.dread_skelly_suit = C'est la plus puissante des Skelly Suits. Elle n'a vraiment rien de \
  rigol-os.

f.dusker_coat = Enfilez ce chaud manteau d'aventurier et frappez avec la f\u00e9rocit\u00e9 d'un Alpha Dusker.

f.elemental_cloak = Cette belle robe est dot\u00e9e de nombreuses protections \u00e9l\u00e9mentaires int\u00e9gr\u00e9es au tissu.

f.emberbreak_armor = Cette armure dot\u00e9e d'un noyau \u00e9l\u00e9mentaire pirat\u00e9 a \u00e9t\u00e9 con\u00e7ue pour r\u00e9\
  sister au feu. Cette modification non standard entra\u00eene cependant certaines faiblesses \u00e9l\u00e9mentaires.

f.fencing_jacket = Les \u00e9p\u00e9istes d\u00e9butants appr\u00e9cient cette ample redingote.

f.firebreak_armor = Cette version am\u00e9lior\u00e9e de l'Emberbreak Armor a \u00e9t\u00e9 pirat\u00e9e pour r\u00e9sister au feu.

f.frostbreaker_armor = Cette armure dot\u00e9e d'un noyau \u00e9l\u00e9mentaire pirat\u00e9 a \u00e9t\u00e9 con\u00e7ue pour r\u00e9\
  sister au gel. Cette modification non standard entra\u00eene cependant certaines faiblesses \u00e9l\u00e9mentaires.

f.fused_demo_suit = Cette version am\u00e9lior\u00e9e de la Demo Suit a \u00e9t\u00e9 fusionn\u00e9\
  e avec le noyau instable d'un puissant Blast Cube. Elle est dangereuse, mais elle vous prot\u00e9gera efficacement.

f.grey_feather_mantle = Cette robe destin\u00e9e aux \u00e9rudits Owlites s'est impr\u00e9gn\u00e9e de si\u00e8\
  cles de sagesse... Et elle est super douce!

f.groundbreaker_armor = Une armure port\u00e9e par les premiers chevaliers \u00e0 d\u00e9fier \
  les profondeurs des Rouages.

f.gunslinger_sash = Cet \u00e9quipement \u00e9tait port\u00e9 par des guerriers arm\u00e9s de \
  pistolets appartenant \u00e0 une \u00e9poque oubli\u00e9e. Il sent le cuir brut, la poudre et \
  l'action.

f.heavenly_iron_armor = Un armure puissant fabriqu\u00e9 de boucliers ang\u00e9liques. Il garde \
  beaucoup de caract\u00e9ristiques divines que des \u00eatres c\u00e9lestes poss\u00e8dent \
  mais il manque leur faiblesse de feu.

f.heavy_demo_suit = Cette armure renforc\u00e9e a \u00e9t\u00e9 con\u00e7ue pour les experts en \
  explosifs.

f.heavy_plate_mail = Cette armure \u00e9paisse a \u00e9t\u00e9 renforc\u00e9e de plus plaques de m\u00e9\
  tal qu'on en trouve dans un distributeur automatique des Rouages. Elle s'av\u00e8re l\u00e9g\u00e8rement inconfortable.

f.icebreaker_armor = Cette version am\u00e9lior\u00e9e de la Frostbreaker Armor a \u00e9t\u00e9 pirat\u00e9e pour r\u00e9sister au gel.

f.ice_queen_mail = Un armure majestueux qui ressemble la reine vraiment glaciale. Avec son d\u00e9\
  fense formidable, on dit que l'armure augmente grandement votre ego et cr\u00e9e un d\u00e9tachement froid.

f.ignition_armor = Une armure am\u00e9lior\u00e9e pour prot\u00e9ger les chevaliers risquant \
  dans les situations chaudes.

f.ironmight_plate_mail = Cette armure de plates de qualit\u00e9 sup\u00e9rieure a \u00e9t\u00e9 forg\u00e9\
  e dans un alliage de plusieurs m\u00e9taux rares. Elle entrave les mouvements, mais s'av\u00e8re incroyablement r\u00e9sistante.

f.jelly_mail = Con\u00e7ue \u00e0 partir de cr\u00e9atures visqueuses, cette armure molle \
  respire l'\u00e9l\u00e9gance.

f.justifier_jacket = Une veste de qualit\u00e9 port\u00e9e par les bandits arm\u00e9s en mal d'adr\u00e9\
  naline qui tirent vite ou meurent jeunes.

f.kat_claw_cloak = Une cape mal cousue, fabriqu\u00e9e pour ressembler \u00e0 un guerrier archarn\u00e9 \
  du Kat Tribe, la tribu avec un terrible destin.

f.kat_claw_mail = Une armure impressionnante, instillant avec le pouvoir du Kat Clawers, les \
  combatteurs effroyables de front de la Tribu Kat.

f.kat_claw_raiment = On dit que ce gilet r\u00e9cup\u00e9r\u00e9 ressemble \u00e0 Scraith, l'h\u00e9ro de la Tribu Kat. Il \u00e9tait le premier \u00e0 \
  escalader les murs de l'Academie Owlite de la Magie.

f.kat_eye_cloak = Une cape mal cousue, fabriqu\u00e9e pour ressembler \u00e0 un tueur d'\u00e9\
  lite de la Tribu Kat, la tribu avec un terrible destin.

f.kat_eye_mail = Une armure impressionnante, instillant avec le pouvoir du Kat Seekers, les \
  grenadiers habiles de la Tribu Kat.

f.kat_eye_raiment = On dit que ce gilet r\u00e9cup\u00e9r\u00e9 ressemble \u00e0 Preowa, l'h\u00e9\
  ro de la Tribu Kat. Son habilit\u00e9 en artillerie avait fait souffl\u00e9 les Sages du Tour \
  de Plume Grise.

f.kat_hiss_cloak = Un capuchon mal cousu, fabriqu\u00e9 pour ressembler \u00e0 un guerrier \
  capricieux du Kat Tribe, la tribu avec un terrible destin.

f.kat_hiss_mail = Une armure impressionnante, instillant avec le pouvoir du Kat Hissers, les \
  plastiqueurs instables du Kat Tribe.

f.kat_hiss_raiment = On dit que ce gilet r\u00e9cup\u00e9r\u00e9, lequel est magnifiquement \
  fabriqu\u00e9, ressemble \u00e0 Torair, l'h\u00e9ro de la Tribu Kat. Il s'\u00e9tait accroch\u00e9 \
  aux portes de l'Academie Owlite de la Magie pendant qu'il br\u00fblait avec ses explosives.

f.mad_bomber_suit = Certains jouent de la hache, d'autres de l'arc. Cette armure est destin\u00e9e \u00e0 ceux qui ont un temp\u00e9rament explosif.

f.magic_cloak = Cette cape merveilleuse est l'attribut des apprentis qui \u00e9tudient la magie \
  et les sortil\u00e8ges.

f.mercurial_demo_suit = Un armure fabriqu\u00e9 avec le technologie de Gremlins. C'est pour le \
  bombardier qui veut une augmentation de vitesse, plus de puissance, et un r\u00e9duction de probabilit\u00e9 de mort par \u00e9\
  lectrocution... qui est probablement tous les bombardiers dans le monde.

f.mercurial_mail = Une armure supr\u00eame qui vous donnera un ressort dans votre d\u00e9\
  marche, tout en vous ressortant du danger!

f.mighty_cobalt_armor = Cette armure de Spiral Knight am\u00e9lior\u00e9e int\u00e8gre les derni\u00e8\
  res technologies des Rouages dont les sp\u00e9cialistes ont perc\u00e9 les myst\u00e8res.

f.miracle_cloak = On raconte que ce manteau b\u00e9ni des dieux peut accomplir un miracle \
  lorsque son porteur est dans le besoin.

f.nameless_poncho = Ce poncho sans nom fut port\u00e9 par un h\u00e9ros aussi l\u00e9gendaire qu'anonyme.

f.padded_armor = Une armure ample, habituellement port\u00e9e par les canonniers.



f.pathfinder_armor = Une armure avantageuse pour montrer la voie et se prot\u00e9ger contre les \
  morsures de monstres affam\u00e9es.

f.plated_pathfinder_armor = Une armure tremp\u00e9e, fabriqu\u00e9e pour se prot\u00e9ger \
  contre des monstres les plus voraces pendant qu'on explore l'inconnu.

f.plated_sentinel_armor = Une armure renforc\u00e9e et plaqu\u00e9e avec les mat\u00e9riaux gremlin pour se d\u00e9\
  fendre contre un nombre d'\u00e9lements dangereux.

f.plated_shade_armor = Un costume de tissu terrible entrelac\u00e9 de dark matter pour masquer \
  le porteur pendant qu'il se coule dans les coins camoufl\u00e9s.

f.quicksilver_mail = Une jolie armure fabriqu\u00e9e des restes d'un Quicksilver.



f.radiant_silvermail = On raconte que cette version am\u00e9lior\u00e9e de la Silvermail brille \
  de mille feux, m\u00eame quand l'obscurit\u00e9 envahit les c\u0153urs.

f.rock_jelly_mail = Cette armure g\u00e9latineuse combine la robustesse de la pierre \u00e0 l'\u00e9lasticit\u00e9 de la mati\u00e8\
  re la plus poisseuse qui soit. C'est \u00e0 se demander par quel prodige vous avez r\u00e9ussi \u00e0 \
  vaincre le blobeux dont elle est constitu\u00e9e.

f.royal_jelly_mail = Incroyablement visqueuse, cette armure a \u00e9t\u00e9 con\u00e7ue avec \
  une grande minutie \u00e0 partir des plus nobles blobeux.

f.sacred_ghost_armor = Une armure spectrale pour ceux qui flinguent les fant\u00f4mes.

f.sacred_guerrilla_armor = Une armure robuste pour ceux qui veulent abattre des b\u00eates.

f.sacred_hazard_armor = Une armure robuste pour ceux qui veulent braquer des blobeux.

f.sacred_hex_armor = Une armure phantasmique pour ceux qui virent l'inferno.

f.sacred_keeper_armor = Une armure azur\u00e9e pour ceux qui veulent casser des robos.

f.sacred_pathfinder_armor = Une armure renforc\u00e9e et rembour\u00e9e de laquelle on est \
  certain qu'elle va arr\u00eater les adversaires les plus aigu\u00ebs.

f.sacred_sentinel_armor = Un radiant tissage serr\u00e9 et d\u00e9fensif pour isoler des \u00e9l\u00e9ments inconstantes.

f.sacred_shade_armor = Une armure ombreuse, fabriqu\u00e9e pour survivre ceux qui r\u00f4dent dans l'obscurit\u00e9.

f.sacred_wraith_armor = Une armure solide pour ceux qui abattent les gremlins.

f.salamander_suit = Cette armure en peau de salamandre octroie \u00e0 son porteur la r\u00e9\
  sistance naturelle au feu de cet animal.

f.scary_skelly_suit = Cette version am\u00e9lior\u00e9e de la Skelly Suit a \u00e9t\u00e9 impr\u00e9gn\u00e9e d'essence \u00e9l\u00e9\
  mentaire de peur. Elle est livr\u00e9e avec un pantalon assorti qui vous donnera du courage \u00e0 revendre.

f.sentinel_armor = Une armure enchant\u00e9e avec la pouvoir de repousser un assortiment \
  d'afflictions desquelles les chevaliers peuvent rattraper pendant qu'ils sont de service.

f.seraphic_mail = Quiconque porte cette superbe cotte de mailles frappera les cr\u00e9atures mal\u00e9fiques avec la col\u00e8re des justes.

f.shade_armor = Une armure ensorcel\u00e9e avec la mati\u00e8re ombreuse qui permet le porteur \
  de tirer et surprendre les adversaires de la noirceur.

f.shadowsun_slicker = On raconte que cet imperm\u00e9able mal\u00e9fique est dot\u00e9 d'une \
  grande puissance et se nourrit des p\u00e9ch\u00e9s non absous de celui qui le porte.

f.silvermail = Cette armure r\u00e9sistante mais l\u00e9g\u00e8re est destin\u00e9e aux \
  chevaliers qui ont jur\u00e9 sur l'honneur de traquer sans rel\u00e2che les morts-vivants \
  pour les \u00e9radiquer.

f.sinister_skelly_suit = Cette armure osseuse vibre de malveillance. Quiconque ose douter de \
  ses pouvoirs ne fera pas de vieux os.

f.skelly_suit = Cette armure terrifiante repousse \u00e0 merveille les attaques de l'ombre.

f.skolver_coat = Le meilleur des v\u00eatements en peau de Wolver. Ce manteau a \u00e9t\u00e9 con\u00e7\
  u par des mains expertes pour vous procurer une puissance stup\u00e9fiante lors des attaques \
  au corps \u00e0 corps.

f.snarbolax_coat = Un armure ombreux cr\u00e9e de peau d'un Snarbolax sinistre. C'est dangereux \
  m\u00eame si vous le regarde trop proche.

f.solid_cobalt_armor = La Cobalt Armor traditionnelle a \u00e9t\u00e9 reforg\u00e9e pour un \
  meilleur confort et une protection optimale.

f.spiral_brigandine = Une armure l\u00e9g\u00e8re, fournie \u00e0 toutes les recrues au sein \
  des Spiral Knights.

f.spiral_cuirass = Une armure l\u00e9g\u00e8re, fournie \u00e0 toutes les recrues au sein des \
  Spiral Knights.

f.spiral_culet = Une armure l\u00e9g\u00e8re, fournie \u00e0 toutes les recrues au sein des \
  Spiral Knights.

f.spiral_flak_jacket = Une armure l\u00e9g\u00e8re, fournie \u00e0 toutes les recrues au sein \
  des Spiral Knights.

f.spiral_draped_armor = Une armure l\u00e9g\u00e8re, fournie \u00e0 toutes les recrues au sein \
  des Spiral Knights.

f.spiral_cloak = Une armure l\u00e9g\u00e8re, fournie \u00e0 toutes les recrues au sein des \
  Spiral Knights.

f.spiral_demo_suit = Cette solide armure a \u00e9t\u00e9 con\u00e7ue pour les chevaliers qui \
  manipulent des explosifs.

f.spiral_plate_mail = Cette lourde armure de plates de fer prot\u00e8ge de la plupart des \
  attaques normales.

f.spiral_scale_mail = Cette armure l\u00e9g\u00e8re mais solide prot\u00e8ge des attaques \
  perforantes.



f.sunset_duster = Cette solide protection de cuir est destin\u00e9e aux p\u00e8lerins qui n'ont \
  pas froid aux yeux.

f.surge_breaker_armor = Cette armure prot\u00e8ge des r\u00e9v\u00e9lations les plus \
  choquantes. Elle r\u00e9siste aussi plut\u00f4t bien aux attaques \u00e9lectriques.

f.tri_guard_armor = Une armure sp\u00e9ciale con\u00e7ue explicitement pour les premiers \
  chevaliers \u00e9claireurs sur les plan\u00e8tes extraterrestres. Cette armure robuste prot\u00e8\
  ge le porteur contre une gamme d'environments rigoureux.

f.valkyrie_mail = Cette armure n'a pas de prix. Les cr\u00e9atures des enfers la redoutent au \
  point de ne jamais prononcer son nom.

f.virulisk_suit = Cette combinaison \u00e9paisse a \u00e9t\u00e9 taill\u00e9e dans la carcasse \
  d'un Virulisk. Son porteur h\u00e9rite, dans une certaine mesure, de la r\u00e9sistance au \
  poison de ce monstre, ainsi que de son go\u00fbt prononc\u00e9 pour le flan.

f.vitasuit = Cette combinaison sp\u00e9ciale apporte un bonus de sant\u00e9 appr\u00e9ciable \u00e0 son porteur.

f.vitasuit_deluxe = Quatre m\u00e9decins sur cinq pr\u00e9conisent de porter cette armure au \
  quotidien. Le cinqui\u00e8me a p\u00e9ri \u00e9cras\u00e9 sous un Tortodrone.

f.vitasuit_plus = Cette armure high-tech offre \u00e0 son porteur toutes sortes d'avantages m\u00e9dicaux: bonus de sant\u00e9\
  , cheveux plus luisants et haleine plus fra\u00eeche.

f.vog_cub_coat = Cette peau de b\u00eate empeste la fum\u00e9e de bois, mais elle est si \u00e9\
  paisse et si chaude que vous n'y pr\u00eaterez m\u00eame pas attention.

f.volcanic_demo_suit = Cette armure tr\u00e8s protectrice est destin\u00e9e aux experts en d\u00e9molition. Son syst\u00e8\
  me de refroidissement int\u00e9gr\u00e9 vous donnera l'impression d'avoir \u00e9t\u00e9 cryog\u00e9nis\u00e9.

f.volcanic_plate_mail = Armure de plates sup\u00e9rieure imbue de l'essence \u00e9l\u00e9\
  mentaire des flammes et con\u00e7ue pour encaisser les chocs les plus violents.

f.volcanic_salamander_suit = Cette Salamander Suit renforc\u00e9e de solides plaques de fer \
  volcanique est tr\u00e8s r\u00e9sistante. De plus, elle peut servir de four de fortune lors \
  des missions de longue dur\u00e9e.

f.volt_breaker_armor = Cette version am\u00e9lior\u00e9e de la Circuit Breaker Armor a \u00e9t\u00e9 pirat\u00e9e pour r\u00e9sister aux \u00e9lectrocutions.

f.wolver_coat = Ce manteau \u00e9pais a \u00e9t\u00e9 con\u00e7u pour vous sauver la peau \u00e0 \
  partir d'un Wolver qui n'a pas r\u00e9ussi \u00e0 sauver la sienne.

f.woven_pathfinder_armor = Une armure flexible, fabriqu\u00e9e pour la mobilit\u00e9 et entrelac\u00e9\
  e de fibres blobeaux pour se prot\u00e9ger contre les ennemis piquants et \u00e9pineuxeuses.

f.woven_sentinel_armor = Une armure insuffl\u00e9e avec des poils de wolver entrelac\u00e9s pour se prot\u00e9ger contre les \u00e9l\u00e9ments les plus r\u00eaches.

f.woven_shade_armor = Une armure ample qui permet le porteur de s'en aller furtivement dans les \
  ombres et d'attaquer les adversaires inconscients de danger.

f.wyvern_scale_mail = Cette superbe armure a \u00e9t\u00e9 forg\u00e9e \u00e0 des temp\u00e9ratures extr\u00eames \u00e0 partir des \u00e9cailles de cr\u00e9atures tr\u00e8s rares des Rouages.

# Gear Helm names
#...................................................................................................


f.almirian_crusader_helm = Une casque port\u00e9 par les gardes royales d'\u00e9lite de royaume \
  d'Almire. Son couleur d'ivoire \u00e9tait un symbole de puret\u00e9 d'Almire dans le pays et \
  dans les c\u0153urs de peuples.

f.arcane_salamander_mask = Un Salamander Mask instill\u00e9 avec du puissance magique. On pense \
  qu'il est cr\u00e9e par des laquais de sorci\u00e8res puissantes.

f.ancient_plate_helm = Ce casque des temps anciens est si lourd que seuls les h\u00e9ros dot\u00e9s d'une force hercul\u00e9\
  enne peuvent le porter au combat.

f.angelic_helm = Un joli casque imitant la forme d'un gardien c\u00e9leste.

f.ash_tail_cap = Cette casquette \u00e9paisse est faite de cuir tann\u00e9 au piment fort. Elle d\u00e9gage une l\u00e9g\u00e8re odeur de curry.

f.azure_guardian_helm = Seuls les chevaliers les plus exp\u00e9riment\u00e9s du Spiral Order \
  portent ce casque majestueux. La technique permettant de fusionner les \u00e9cailles de dragon au m\u00e9\
  tal est un secret bien gard\u00e9.

f.black_kat_hood = Un capuchon mal cousu, resemblant \u00e0 un sombre soldat du g\u00e9nie de la Tribu Kat.

f.black_kat_mask = Une masque impressionnante et ensorcel\u00e9e avec la puissance de \
  Ravissommeils, les espions de la Tribu Kat.

f.black_kat_cowl = Un capuchon maudit, envahissant avec l'\u00e9nergie de noir. On dit que ce \
  capuchon ressemble \u00e0 Margrel, l'h\u00e9ro grand de la Tribu Kat. C'est lui qui a ouvert \
  la Livre de plumes grises et provoqu\u00e9 le Kataclysm. Ce capuchon-ci apporte la malchance \u00e0 \
  tous qui essayent de le porter.

f.blazebreak_helm = Ce casque solide prot\u00e8ge efficacement de la chaleur.

f.blizzbreaker_helm = Ce casque solide vous prot\u00e8gera du gel dans les situations les plus \
  tendues.

f.bombastic_demo_helm = Ce casque de qualit\u00e9 est r\u00e9serv\u00e9 aux experts en \
  explosifs les plus aguerris. Il ne vous dira pas quel vin s'accorde le mieux au Nitronome, \
  mais il vous donnera une certaine prestance. Et il vous prot\u00e9gera. C'est d\u00e9j\u00e0 bien.

f.boosted_plate_helm = Ce casque est un Spiral Plate Helm dot\u00e9 d'un g\u00e9n\u00e9rateur d'\u00e9\
  nergie surpuissant. Il est malheureusement assez opaque.

f.brute_jelly_helm = Ce casque robuste a \u00e9t\u00e9 con\u00e7u \u00e0 partir d'une substance \
  visqueuse extr\u00eamement gluante.

f.chaos_cowl = Cette cagoule d'origine douteuse prot\u00e8ge son porteur des attaques \u00e9l\u00e9\
  mentaires et lui donne un air myst\u00e9rieux.

f.charged_quicksilver_helm = Un Quicksilver Helm augment\u00e9 qui conduit \u00e0 la \
  destruction d'ennemis \u00e9lectriques.

f.chroma_mask = Ce masque en peau de Chromalisk donne \u00e0 son porteur un air distingu\u00e9.

f.circuit_breaker_helm = Ce casque est un Spiral Helm modifi\u00e9 pour prot\u00e9ger des \u00e9lectrocutions, au d\u00e9triment de sa r\u00e9\
  sistance au feu et au gel.

f.cobalt_helm = Ce casque ultraperformant du Spiral Order est adapt\u00e9 \u00e0 toutes les aventures.

f.crown_fallen = Cette couronne est maudite: elle fut jadis port\u00e9e par un \u00eatre c\u00e9leste banni du paradis.

f.cyclops_cap = Ce casque atypique arborant un \u0153il unique est l'\u00e9quipement de pr\u00e9dilection des tireurs d\u00e9butants.

f.deadly_virulisk_mask = Ce Virulisk Mask am\u00e9lior\u00e9 dispose d'un filtre \u00e0 \
  toxines. Son porteur baigne en permanence dans un parfum d'aiguilles de pin.

f.deadshot_chapeau = Un chapeau mythique pour les chevaliers qui ne ratent jamais leur cible. \
  D'apr\u00e8s la rumeur, l'\u00e9toffe dont il est constitu\u00e9 a \u00e9t\u00e9 prise sur un \
  cadavre mis en terre.

f.divine_veil = Un voile divin semblable \u00e0 ceux que portaient les sages du paradis.

f.dragon_scale_helm = Ce casque mythique est constitu\u00e9 des \u00e9cailles d'une cr\u00e9ature l\u00e9gendaire.

f.drake_scale_helm = Ce casque a \u00e9t\u00e9 forg\u00e9 \u00e0 partir des \u00e9cailles de cr\u00e9\
  atures que l'on dit descendre des dragons.

f.dread_skelly_mask = C'est le nec plus ultra en mati\u00e8re de masque hant\u00e9. Il vous prot\u00e9gera le cr\u00e2\
  ne des attaques d'ombre les plus d\u00e9moniaques.

f.dusker_cap = Ce chapeau de peau est destin\u00e9 aux chevaliers qui pr\u00e9f\u00e8rent \
  affronter leurs adversaires de face.

f.elemental_hood = Un masque mystique destin\u00e9 aux adeptes des duels de sorcellerie. Il \
  prot\u00e8ge efficacement contre les \u00e9l\u00e9ments.

f.emberbreak_helm = Ce casque est un Spiral Helm qui a \u00e9t\u00e9 modifi\u00e9 pour prot\u00e9ger du feu, au d\u00e9triment de sa r\u00e9sistance au gel et aux \u00e9lectrocutions.

f.feral_kat_hood = Ce capuchon d'aspect primitif a \u00e9t\u00e9 con\u00e7u pour donner \
  l'apparence d'une b\u00eate sauvage.

f.firebreak_helm = Ce casque est un Emberbreak Helm qui a \u00e9t\u00e9 modifi\u00e9 pour prot\u00e9\
  ger plus efficacement du feu.

f.firefighter_helmet = Ce casque de pompier n'est pas une protection tr\u00e8s efficace contre \
  les attaques, mais il permet de r\u00e9sister au feu.

f.frostbreaker_helm = Ce casque est un Spiral Helm qui a \u00e9t\u00e9 modifi\u00e9 pour prot\u00e9ger du gel, au d\u00e9triment de sa r\u00e9sistance au feu et aux \u00e9lectrocutions.

f.fused_demo_helm = Cette version am\u00e9lior\u00e9e du Demo Helm a \u00e9t\u00e9 fusionn\u00e9\
  e avec le noyau instable d'un puissant Blast Cube. Le bourdonnement qu'elle \u00e9met est insupportable.

f.grey_feather_cowl = Ce capuchon duveteux est destin\u00e9 aux \u00e9rudits qui aiment \u00e9\
  tudier sur le terrain. Il est plus doux que les oreillers les plus luxueux, mais \
  incroyablement r\u00e9sistant.

f.groundbreaker_helm = un casque durable port\u00e9 par les premiers chevaliers \u00e0 d\u00e9\
  fier les profondeurs des Rouages.

f.gunslinger_hat = Ce chapeau d'excellente facture \u00e9tait port\u00e9 par des guerriers arm\u00e9\
  s de pistolets appartenant \u00e0 une \u00e9poque oubli\u00e9e. Id\u00e9al pour les duels, \
  les fouilles ou les vir\u00e9es sur les hauts plateaux.

f.heavenly_iron_helm = Une casque puissante fabriqu\u00e9 de boucliers ang\u00e9liques. Il \
  garde beaucoup de caract\u00e9ristiques divines que des \u00eatres c\u00e9lestes poss\u00e8\
  dent mais il manque leur faiblesse face au feu.

f.heavy_demo_helm = Ce casque renforc\u00e9 pourrait s'av\u00e9rer utile pour un expert en \
  explosifs de votre trempe.

f.heavy_plate_helm = Ce casque massif a \u00e9t\u00e9 con\u00e7u pour prot\u00e9ger des armes \
  conventionnelles. Une l\u00e9g\u00e8re odeur de sueur flotte \u00e0 l'int\u00e9rieur.

f.icebreaker_helm = Ce casque est un Frostbreaker Helm qui a \u00e9t\u00e9 modifi\u00e9 pour prot\u00e9\
  ger plus efficacement du gel.

f.ice_queen_crown = Une couronne majestueuse qui ressemble la reine vraiment glaciale. Avec son \
  d\u00e9fense formidable, on dit que l'armure augmente grandement votre ego et cr\u00e9e un d\u00e9tachement froid.

f.ignition_helm = Un casque l\u00e9ger, am\u00e9lior\u00e9 pour garder la t\u00eate du \
  chevalier frais sous pression.

f.industrial_hard_hat = Ce casque d'ouvrier du b\u00e2timent ne procure pas une protection tr\u00e8s efficace, mais il am\u00e9liore consid\u00e9rablement la r\u00e9sistance \u00e0 l'\u00e9tourdissement.

f.ironmight_plate_helm = Ce casque de qualit\u00e9 sup\u00e9rieure a \u00e9t\u00e9 forg\u00e9 \
  dans un alliage de plusieurs m\u00e9taux rares. Il r\u00e9duit l\u00e9g\u00e8rement la vision p\u00e9riph\u00e9rique, mais il r\u00e9siste \u00e0 toutes les attaques.

f.jaws_megalodon = Ce casque effrayant ressemble \u00e0 un monstre des profondeurs marines.

f.jelly_helm = Ce casque g\u00e9latineux a \u00e9t\u00e9 fabriqu\u00e9 \u00e0 partir des restes \
  de gardiens visqueux.

f.justifier_hat = Un chapeau de qualit\u00e9 r\u00e9serv\u00e9 aux as de la g\u00e2chette qui n'h\u00e9sitent pas \u00e0 d\u00e9penser quelques pi\u00e8\
  ces de plus pour s'offrir un \u00e9quipement de luxe.

f.kat_claw_hood = Un capuchon mal cousu, fabriqu\u00e9 pour ressembler \u00e0 un guerrier archarn\u00e9 \
  de la Tribu Kat, la tribu avec un terrible destin.

f.kat_claw_mask = Une masque impressionnante, instillant avec le pouvoir du Kat Clawers, les \
  combatteurs effroyables de front de la Tribu Kat.

f.kat_claw_cowl = Un capuchon magnifique et bien fabriqu\u00e9. On dit que ce capuchon \
  ressemble \u00e0 Scraith, l'h\u00e9ro de la Tribu Kat. Il \u00e9tait le premier \u00e0 \
  escalader les murs de l'Academie Owlite de la Magie.

f.kat_eye_hood = Un capuchon mal cousu, fabriqu\u00e9 pour ressembler \u00e0 un tueur d'\u00e9\
  lite de la Tribu Kat, la tribu avec un terrible destin.

f.kat_eye_mask = Une masque impressionnante, instillant avec le pouvoir du Kat Seekers, les \
  grenadiers habiles de la Tribu Kat.

f.kat_eye_cowl = Un capuchon magnifique et bien fabriqu\u00e9. On dit que ce capuchon ressemble \u00e0 Preowa, l'h\u00e9\
  ro du Kat Tribe. Son habilit\u00e9 en artillerie avait fait souffl\u00e9 les Sages du Tour de \
  Plume Grise.

f.kat_hiss_hood = Un capuchon mal cousu, fabriqu\u00e9 pour ressembler \u00e0 un guerrier \
  capricieux du Kat Tribe, la tribu avec un terrible destin.

f.kat_hiss_mask = Une masque impressionnante, instillant avec le pouvoir du Kat Hissers, les \
  plastiqueurs instables du Kat Tribe.

f.kat_hiss_cowl = On dit que ce capuchon magnifiquement fabriqu\u00e9 ressemble \u00e0 Torair, l'h\u00e9\
  ro de la Tribu Kat. Il s'\u00e9tait accroch\u00e9 aux portes de l'Academie Owlite de la Magie \
  pendant qu'il br\u00fblait avec ses explosives.

f.mad_bomber_mask = Ce casque robuste a \u00e9t\u00e9 con\u00e7u pour prot\u00e9ger des \
  explosions, des ondes radio et des appareils high-tech de contr\u00f4le mental. Du moins, \
  c'est qu'ils *veulent* vous faire croire.

f.magic_hood = Un capuchon enchant\u00e9 pour les chevaliers qui pratiquent la divination et \
  l'invocation en amateurs.

f.mercurial_demo_helm = Une casque fabriqu\u00e9e avec le technologie de Gremlins. C'est pour \
  le bombardier qui veut une augmentation de vitesse, plus de puissance, et un r\u00e9duction de probabilit\u00e9 de mort par \u00e9\
  lectrocution... qui est probablement tous les bombardier dans le monde.

f.mercurial_helm = Un casque sublime qui vous laissera vous d\u00e9placer aussi rapidement que \
  l'eau... mais peut-etre pas si rapidement *dans* l'eau.

f.mighty_cobalt_helm = Ce casque de Spiral Knight am\u00e9lior\u00e9 a \u00e9t\u00e9 forg\u00e9 \
  dans un alliage rare de Moonstone et de Luminite.

f.mining_hat = Ce vieux casque robuste \u00e9tait autrefois utilis\u00e9 dans des mines de pr\u00e9cieux min\u00e9raux. Il est l\u00e9g\u00e8rement plus r\u00e9\
  sistant que le Spiral Helm.

f.miracle_hood = On raconte que ce masque b\u00e9ni des dieux peut accomplir un miracle lorsque \
  son porteur est dans le besoin. En pratique, il vous sauvera s\u00fbrement la vie beaucoup \
  plus souvent.

f.nameless_hat = Ce chapeau sans nom fut port\u00e9 par un h\u00e9ros aussi l\u00e9gendaire qu'anonyme.

f.padded_cap = Un casque d'une taille unique, habituellement port\u00e9 par les canonniers.



f.pathfinder_helm = Un casque commode pour montrer la voie et se prot\u00e9ger contre les \
  morsures de monstres affam\u00e9es.

f.plated_pathfinder_helm = Un casque costaud fabriqu\u00e9 pour prot\u00e9ger les explorateurs \u00e9\
  nergiques pendant qu'ils explorent l'inconnu.

f.plated_sentinel_helm = Un casque renforc\u00e9 et plaqu\u00e9 avec les mat\u00e9riaux gremlin pour se d\u00e9\
  fendre contre un nombre d'\u00e9lements dangereux.

f.plated_shade_helm = Un casque de tissu terrible, entrelac\u00e9 de dark matter pour masquer \
  le porteur pendant qu'il se coule dans les coins camoufl\u00e9s.

f.purring_cap = Cette \u00e9trange casquette ressemble \u00e0 un Mewkat. On dit qu'elle octroie \
  neuf vies \u00e0 celui qui la porte.

f.quicksilver_helm = Un joli casque fabriqu\u00e9 des restes d'un Quicksilver.



f.rock_jelly_helm = Un casque tr\u00e8s r\u00e9sistant constitu\u00e9 d'\u00e9clats de mati\u00e8re visqueuse.

f.royal_jelly_crown = Cette couronne royale a r\u00e9cemment \u00e9t\u00e9 reproduite \u00e0 partir des restes r\u00e9\
  sineux d'un membre de la royaut\u00e9.

f.sacred_ghost_helm = Un casque obs\u00e9dant pour ceux qui flinguent les fant\u00f4mes.

f.sacred_guerrilla_helm = Un casque pour ceux qui veulent abattre les b\u00eates.

f.sacred_hazard_helm = Un casque robuste pour facilite la chasse des blobeux.

f.sacred_hex_helm = Un casque phantasmique pour ceux qui braque l'inferno.

f.sacred_keeper_helm = Un casque d'une nuance azur\u00e9e pour ceux qui veulent casser des \
  robos.

f.sacred_pathfinder_helm = Un casque renforc\u00e9 et rembour\u00e9 dequel on est certain qu'il \
  va arr\u00eater les adversaires les plus aigu\u00ebs.

f.sacred_sentinel_helm = Un tissage serr\u00e9 radiant et d\u00e9fensifive pour isoler des \u00e9l\u00e9ments inconstantes.

f.sacred_shade_helm = Un casque ombreux fabriqu\u00e9 pour survivre ceux qui r\u00f4dent dans l'obscurit\u00e9.

f.sacred_wraith_helm = Un heaume aff\u00fbt\u00e9 pour ceux qui essayent d'avoir les gremlins.

f.salamander_mask = Un masque en peau de Salamander.

f.scary_skelly_mask = Cette version am\u00e9lior\u00e9e du Skelly Mask a \u00e9t\u00e9 impr\u00e9gn\u00e9e d'essence \u00e9l\u00e9\
  mentaire de peur. Portez-le et vous aurez la chair de poule.

f.sentinel_helm = Un casque enchant\u00e9 avec la pouvoir de repousser un assortiment \
  d'afflictions desquelles les chevaliers peuvent rattraper pendant qu'ils sont de service.

f.seraphic_helm = Quiconque porte cette superbe coiffe de mailles frappera les cr\u00e9atures mal\u00e9fiques avec la col\u00e8re des justes.

f.shade_helm = Un casque fondu avec dark matter qui permet le porteur d'abattre des adversaires \
  en tirant de la noirceur.

f.shadowsun_stetson = Un chapeau audacieux pour les duellistes qui pr\u00e9ferent travailler \u00e0 minuit, plut\u00f4t qu'a midi. Tirez!

f.sinister_skelly_mask = Ce Skelly Mask am\u00e9lior\u00e9 ferait fuir n'importe quel monstre \
  sans courage errant dans les Rouages.

f.skelly_mask = Ce masque effrayant fait peur aux enfants et prot\u00e8ge des attaques d'ombre.

f.skolver_cap = Cette riche casquette de peau constitue la couronne id\u00e9ale pour un roi de \
  la fronti\u00e8re sauvage.

f.snarbolax_cap = Une casque ombreuse cr\u00e9e de peau d'un Snarbolax sinistre. C'est \
  dangereuse m\u00eame si vous la regarde trop proche.

f.solid_cobalt_helm = Ce casque est un Cobalt Helm disposant de syst\u00e8mes internes am\u00e9lior\u00e9\
  s et de renforts externes.

f.spiral_demo_helm = Ce solide casque a \u00e9t\u00e9 con\u00e7u pour les chevaliers qui \
  manipulent des explosifs.

f.spiral_pith_helm = Un casque l\u00e9ger, fourni \u00e0 toutes les recrues au sein des Spiral \
  Knights.

f.spiral_plate_helm = Un lourd casque de fer con\u00e7u pour prot\u00e9ger des attaques \u00e9tourdissantes.

f.spiral_sallet = Un casque l\u00e9ger, fourni \u00e0 toutes les recrues au sein des Spiral \
  Knights.

f.spiral_scale_helm = Ce casque l\u00e9ger prot\u00e8ge l\u00e9g\u00e8rement des attaques \
  perforantes.

f.spiral_tailed_helm = Un casque l\u00e9ger, fourni \u00e0 toutes les recrues au sein des \
  Spiral Knights.

f.spiral_crescent_helm = Un casque l\u00e9ger, fourni \u00e0 toutes les recrues au sein des \
  Spiral Knights.

f.spiral_round_helm = Un casque l\u00e9ger, fourni \u00e0 toutes les recrues au sein des Spiral \
  Knights.

f.spiral_hood = Un casque l\u00e9ger, fourni \u00e0 toutes les recrues au sein des Spiral \
  Knights.



f.sunset_stetson = Ce robuste chapeau de bandit arm\u00e9 ne devrait pas vous co\u00fbter plus d'une poign\u00e9e de Crowns.

f.surge_breaker_helm = Un casque fiable charg\u00e9 de vous prot\u00e9ger le cerveau de tous \
  chocs d\u00e9sagr\u00e9ables.

f.tri_guard_helm = Un casque sp\u00e9cial con\u00e7u explicitement pour les premiers chevaliers \u00e9claireurs sur les plan\u00e8\
  tes extraterrestres. Ce casque robuste prot\u00e8ge le porteur contre une gamme \
  d'environments rigoureux.

f.valkyrie_helm = Ce casque n'a pas de prix. Les cr\u00e9atures des enfers le redoutent au \
  point de ne jamais prononcer son nom.

f.virulisk_mask = Un masque en peau de Virulisk.

f.vog_cub_cap = Cette casquette rembourr\u00e9e d\u00e9gage une forte odeur de viande grill\u00e9\
  e. Quel genre de viande? Mieux vaut ne pas le savoir...

f.volcanic_demo_helm = Ce casque dernier cri renforc\u00e9 de fer volcanique a \u00e9t\u00e9 con\u00e7\
  u pour manipuler des explosifs \u00e0 haute temp\u00e9rature.

f.volcanic_plate_helm = Casque de qualit\u00e9 sup\u00e9rieure imbue de l'essence \u00e9l\u00e9\
  mentaire des flammes. On y respire mal, mais il r\u00e9siste aux temp\u00e9ratures les plus extr\u00eames et \u00e0 \
  toutes sortes d'attaques violentes.

f.volcanic_salamander_mask = Un Salamander Mask renforc\u00e9 de fer volcanique. Sur le \
  terrain, il peut faire office de cafeti\u00e8re de fortune, si toutefois vous arrivez \u00e0 boire du caf\u00e9 qui a un arri\u00e8re-go\u00fbt de l\u00e9zard.

f.volt_breaker_helm = Ce Circuit Breaker Helm a \u00e9t\u00e9 modifi\u00e9 pour prot\u00e9ger \
  plus efficacement des \u00e9lectrocutions.

f.wolver_cap = Une casquette aux couleurs vives, taill\u00e9e dans la peau d'un Wolver beaucoup \
  moins vif.

f.woven_pathfinder_helm = Un casque flexible, fabriqu\u00e9 pour la mobilit\u00e9 et entrelac\u00e9 \
  de fibres blobeaux pour se prot\u00e9ger contre les ennemis piquants et \u00e9pineuxeuses.

f.woven_sentinel_helm = Une armure insuffl\u00e9e avec des poils de wolver entrelac\u00e9s pour se prot\u00e9ger contre les \u00e9l\u00e9ments les plus r\u00eaches.

f.woven_shade_helm = Un casque ample qui permet le porteur de s'en aller furtivement dans les \
  ombres et d'attaquer les adversaires inconscients de danger.

f.wyvern_scale_helm = Ce casque robuste, forg\u00e9 \u00e0 partir des \u00e9cailles de cr\u00e9atures tr\u00e8s rares des Rouages, r\u00e9siste aux temp\u00e9ratures les plus extr\u00eames.

# Gear Helm names (special)
#...................................................................................................

f.warmaster_helm_1 = Une r\u00e9production d'une masque port\u00e9e d\u00e9sormais par \
  Warmaster Seerus de l'Ordre Incarnat. Construite \u00e0 partir de fragments fractur\u00e9s de \
  la masque, il ne ressemble que peu \u00e0 l'original.

f.warmaster_helm_2 = Une r\u00e9production d'une masque port\u00e9e d\u00e9sormais par \
  Warmaster Seerus de l'Ordre Incarnat. Elle ressemble beaucoup \u00e0 l'original, mais manque \
  encore quelques morceaux.

f.warmaster_helm_3 = Une r\u00e9production d'une masque port\u00e9e d\u00e9sormais par \
  Warmaster Seerus de l'Ordre Incarnat. Cette r\u00e9plique parfaite porte la ressemblance de \
  Seerus lui-m\u00eame, et sert de sombre souvenir de Op\u00e9ration Marteau Incarnat.



# Costume Helm names
#...................................................................................................

f.super_brawl_crown = D\u00e9cern\u00e9e au champion du Super Brawl!

f.holiday_hat = Un capuchon festive qui rapelle l'esprit chaleureux des f\u00eates. Il sent le pain d'\u00e9pice... miam!
f.holiday_hat_snow = Un chapeau des f\u00eates tellement festive que la neige y tombe dessus! \
  Heureusement pour le porteur, le chapeau lui-m\u00eame est super chaleureux.

f.gm_helmet = Un casque imposant indigo qui indique indisputablement un des incroyables Game \
  Masters du Spiral Order.

f.chapeau_rose = Un chapeau ag\u00e9 et orn\u00e9 de plumes qui appartenait jadis \u00e0 un \
  Knight of the Rose, un ordre sacr\u00e9 de chevaliers braves et audacieux dont les aventures \
  sont encore racont\u00e9s dans des chansons et des contes. Les Knights of the Rose sont r\u00e9put\u00e9s d'avoir \u00e9t\u00e9 \
  des escrimeurs sans pareil, et d'avoir cru que leurs lames \u00e9taient commes les roses qui \u00e9\
  taient leur symbole: joli, d\u00e9licat, et poss\u00e9dant un m\u00e9chant dard.

f.steamvalve_mask = Maintenant d\u00e9pass\u00e9 par des appareils plus avanc\u00e9s, ces masques pressuris\u00e9s \u00e9taient autrefois utilis\u00e9\
  s par des soldants dans des environnements aux atmosph\u00e8res extr\u00e8mes. La valve de \
  pression en arri\u00e8re devrait \u00eatre ajust\u00e9 comme il faut, sinon la t\u00eate du \
  soldat, euh, implosait.

f.bombhead_mask = Un masque command\u00e9 par King Krogmo pour f\u00eater le lancement de Blast \
  Network. Il ressemble dr\u00f4lement \u00e0 une bombe active. Disponible dans une grande vari\u00e9t\u00e9 de styles, vous \u00eatres s\u00fb\
  r d'en trouver un qui vous convient.

f.pumpkin_bombhead_mask = Une masque Bombhead portant une grimace mena\u00e7ante qui fait \
  penser au Punkin King, grand et grandiose.













f.trojan_disguise = Un d\u00e9guisement tr\u00e8s convaincant qui donne au porteur l'apparence \
  d'un Trojan. Il est tellement convaincant que vous risquerez d'\u00eatre poignard\u00e9 dans le dos!

f.mechaknight_disguise = Un costume vraiment convaincant. Ce qui porte le costume bien \
  ressemblera un Mecha Knight. C'est si convaincant que vos amis vous d\u00e9construiraient!

f.gun_puppy_disguise = Un costume vraiment convaincant. Ce qui porte le costume bien \
  ressemblera un Gun Puppy. C'est si convaincant que vos amis vous feraient tourner votre t\u00eate!

f.love_puppy_disguise = Un d\u00e9guisement tr\u00e8s convaincant qui donne au porteur \
  l'apparence d'un Love Puppy. Il est tellement convaincant que vous amis vous demanderont \
  peut-\u00eatre des bisous!

f.love_puppy_mask_forever = Une masque sp\u00e9ciale qui est la preuve du grand amour d'un Love \
  Puppy. Quelques personnes soutiennent que c'est dans le code. Les autres disent \u00abau diable, Science!\u00bb

f.gremlin_disguise = Un d\u00e9guisement tr\u00e8s convaincant qui donne au porteur l'apparence \
  d'un Gremlin. Il est tellement convaincaint que vous recevrez peut-\u00eatre un invitation \u00e0 la Colonie!

f.metal_sonic_mask = Une masque sinistre, fabriqu\u00e9 par un ing\u00e9nieur m\u00e9canique \
  avec la talent qui rivalise avec les meilleurs Sages d'Embrayage.

f.trojan_helm = On dit que le casque des vaillants Gardiens Spiral reconforte les autres \
  chevaliers. Rien ne dit \u00ab Voici la cavalerie \u00bb comme la vue de ces g\u00e9ants en fer partant \u00e0 la guerre.

f.gremlin_helm = Un casque sp\u00e9cial fabriqu\u00e9e \u00e0 la main par les forgerons \
  gremlins pour se prot\u00e8ger contre l'environnement le plus s\u00e9v\u00e8re. Ce casque-ci a \u00e9t\u00e9 ajust\u00e9 \
  pour aller au chevalier.

f.gunpuppy_helm = Un casque fait \u00e0 la main avec des pi\u00e8ces Gun Puppy r\u00e9cup\u00e9r\u00e9es.

f.mechaknight_helm = Un casque coriace et bien construit par les forgerons Gremlins pour prot\u00e9ger l'unit\u00e9 \
  de commande. En retirant l'unit\u00e9, le casque s'adapte bien \u00e0 la t\u00eate d'un chevalier.

f.stranger_hat = Un chapeau port\u00e9 un fois par un des \u00c9trangers \u00e9nigmatiques. Il \
  semble qu'il y a des plumes cach\u00e9s dans chaque joint.

f.frosted_helm = Une casque d\u00e9licieuse de g\u00e2teau cr\u00e9\u00e9e pendant \
  l'anniversaire c\u00e9libataire de Spiral Knights. Parce que la casque est en g\u00e2teau, \
  elle tombera en morceau dans la fin.

f.foiled_frosted_helm = Une casque d\u00e9licieuse de g\u00e2teau cr\u00e9\u00e9e pendant \
  l'anniversaire c\u00e9libataire de Spiral Knights. M\u00eame si la casque a un emballage \
  joli, elle est encore en g\u00e2teau, et elle tombera en morceau dans la fin.

f.prismatic_frosted_helm = Une casque d\u00e9licieuse de g\u00e2teau cr\u00e9\u00e9e pendant \
  l'anniversaire c\u00e9libataire de Spiral Knights. Elle utilise un gla\u00e7age \u00e9trange d\u00e9velopp\u00e9 \
  dans la cuisine de Biscotti. Le gla\u00e7age pr\u00e9vient le g\u00e2teau de g\u00e2ter. Ne \
  pas le manger, s'il vous pla\u00eet.

f.heavenly_guardian_helm = Une casque blanche et \u00e9clatante, appartenant d'un guerrier c\u00e9leste.

f.infernal_guardian_helm = Une casque calcin\u00e9 et glauque, appartenant d'un guerrier \
  abominable.

f.crescent_helm = Un casque fort qui ressemble un croissant de lune quand on l\u00e8ve la visi\u00e8re.

f.fur_cap = Un cap de fourrure chaleureuse, en formant la visage d'une b\u00eate sauvage.

f.hood = Le pouvoir ultime de ce capuchon est de masquer l'identit\u00e9 du porteur.

f.pith_helm = Un casque simple mais efficace, pr\u00e9f\u00e9r\u00e9 par des recrues Spiral \
  Knights.

f.plate_helm = Un casque robuste, convient pour le combat acharn\u00e9.

f.round_helm = Un casque svelte qui est pr\u00eat d'\u00eatre accessoiris\u00e9!

f.sallet = Un casque rationalis\u00e9 pr\u00e9f\u00e9r\u00e9e par des combattants du front.

f.scale_helm = Un casque compos\u00e9e des \u00e9cailles d'une b\u00eate ondulante.

f.tailed_helm = Un casque expressive qui prouve que deux plumes sont mieux qu'un.

f.winged_helm = Un casque avec un style qui \u00e9voque une beaut\u00e9 c\u00e9leste.

f.imperial_tricorne = Un chapeau magnifique port\u00e9 par ceux qui aspirent de b\u00e2tir des empires o\u00f9 \
  le soleil ne se couche jamais.

f.shogun_helmet = Un casque port\u00e9 par des guerriers qui ont un fois unifi\u00e9 un pays \
  sous la banderole du soleil qui se l\u00e8ve.

f.medieval_war_helm = Un casque cr\u00e9e pour durer une centaine des ann\u00e9es de la guerre.

f.impostoclaus_hat = Un chapeau fabuleux et festive pour Festiver. Ceux qui portent le chapeau \
  ressemble Impostoclaus, le grand esprit de Festiver. Glorp! Glorp! Glorp!

f.humbug_hat = Un chapeau inf\u00e2me, port\u00e9 par ceux qui n'aiment pas du tout la magie du \
  Festiver. La seule explication pour cette sentiment est que sa taille du c\u0153ur est trop petite.

f.storm_avenger_helm = Un casque port\u00e9 par les gardiens c\u00e9lestes qui gardent son \
  royaume, cach\u00e9 en haut d'une montagne neigeuse.

f.storm_champion_helm = Le casque d'une personne qui a d\u00e9fi\u00e9 les dieux et entr\u00e9 le royaume c\u00e9\
  leste comme un ouragan. Quelques personnes disent que les coups de tonnerre sont les \u00e9chos \u00e9ternels de son si\u00e8ge.

f.storm_crusader_helm = Un casque port\u00e9 par des soldats mythiques. On dit qu'ils pouvaient \u00e9taler la t\u00ea\
  mpete en montant sur les \u00e9clairs.

f.storm_dragon_helm = Un casque ensorcel\u00e9, fabriqu\u00e9 en visage d'une b\u00eate. \
  Certains disent que c'\u00e9tait la b\u00eate qui a cr\u00e9\u00e9 le monde apr\u00e8s sa mort: son feu cr\u00e9\
  eant le soleil; ses os, les montagnes.

f.storm_warrior_helm = Un casque port\u00e9 par un ma\u00eetre d'\u00e9p\u00e9e si habil\u00e9, \
  on dit qu'il pouvait couper des \u00e9clats en deux avant que les \u00e9clats touchassent la \
  terre.

f.raging_avenger_helm = Un casque port\u00e9 par des gardiens divins qui prot\u00e8gent un royaume cach\u00e9 \
  au sommet d'une montagne recouverte de magma.

f.raging_champion_helm = Le casque d'un champion qui a d\u00e9fi\u00e9 les dieux en d\u00e9\
  molissant les portes d'un royaume divin.

f.raging_crusader_helm = Un casque port\u00e9 par des soldats mythiques. On raconte que, dans \
  la bataille, ils chevauchent leur rage.

f.raging_dragon_helm = Un casque enchant\u00e9 en forme de la b\u00eate qui, selon certains, a \
  d\u00e9moli le monde en passant : son rage est devenu une pluie magmatique, son souffle un \
  typhon.

f.raging_warrior_helm = Un casque port\u00e9 par un ma\u00eetre l\u00e9gendaire de l'\u00e9p\u00e9e tellement en col\u00e8\
  re que son rage seul abbatit les arm\u00e9es qui lui d\u00e9fiait.

f.frenzy_avenger_helm = Un casque port\u00e9 par les gardiens c\u00e9lestes qui surveillent un \
  royaume cach\u00e9 sur une montagne balay\u00e9e par le vent.

f.frenzy_champion_helm = Le casque de ce qui a d\u00e9fi\u00e9 les dieux et pris l'assaut aux \
  portes d'un royaume divine. Certains disent que les sifflements de vent sont les cris de \
  guerre \u00e9ternels de sa si\u00e8ge.

f.frenzy_crusader_helm = On dit que ce casque \u00e9tait port\u00e9 par des soldats mythiques \
  qui combattent avec une fr\u00e9n\u00e9sie si violente qu'ils avaient cr\u00e9\u00e9s des \
  tornades dans leur sillage.

f.frenzy_dragon_helm = Un casque enchant\u00e9, fabriqu\u00e9 selon le visage d'une b\u00eate qu'on croit a forg\u00e9 le monde en vol: sa fr\u00e9n\u00e9sie \u00e9tait le d\u00e9\
  but de vents puissants, et ses \u00e9cailles devenaient les ombres.

f.frenzy_warrior_helm = Un casque port\u00e9 par un ma\u00eetre bretteur si rapide que sa fr\u00e9n\u00e9\
  sie pouvait faire tomber des arm\u00e9es avant qu'elles pourraient se soulever.

f.battle_chef_hat = Un chapeau port\u00e9 par les chevaliers qui travaillent dans la coquerie \
  d'Alouette. Ne les sous-estimez pas - ces cuisiniers ont ma\u00eetris\u00e9 leurs lames sur \
  le champ de bataille comme dans la cuisine!

f.dangerous_diablo_helm = Un casque port\u00e9 par les membres des Gardes \u00c9claireurs. Con\u00e7\
  u pour terrifier ses ennemis, ce casque est le visage d'un diable qu'on dit a bris\u00e9 sa \
  corne pour l'utiliser comme une arme quand il avait fait face \u00e0 sa fin.

f.hazardous_diablo_helm = Un casque port\u00e9 par les membres des \u00c9claireurs \u00e9carlates. Con\u00e7\
  u pour terrifier ses ennemis, ce casque est le visage d'un diable qu'on dit a bris\u00e9 sa \
  corne pour l'utiliser comme une arme quand il avait fait face \u00e0 sa fin.

f.dangerous_grim_mask = Un casque port\u00e9 par les membres des Gardes \u00c9claireurs. Con\u00e7\
  u pour terrifier ses ennemis, ce casque est le visage de la Mort. Ceux qui le porte ont un \
  proverbe: \u00abLa Faucheuse vous regarde toujours, alors vous ferez aussi bien de donner une \
  bonne spectacle\u00bb.

f.hazardous_grim_mask = Un casque port\u00e9 par les membres des \u00c9claireurs \u00e9carlates. Con\u00e7\
  u pour terrifier ses ennemis, ce casque est le visage de la Mort. Ceux qui le porte ont un \
  proverbe: \u00abLa Faucheuse marche sur vos talons, alors ne faites pas demi-tour.\u00bb

f.dangerous_oni_helm = Un casque port\u00e9 par les membres des Gardes \u00c9claireurs. Con\u00e7\
  u pour terrifier ses ennemis, ce casque est le visage d'un d\u00e9mon qui habite dans les \
  montagnes d'un pays distant. On dit qu'il garde les portes c\u00e9l\u00e9stes et permet \
  seulement ceux qui sont dignes de passer.

f.hazardous_oni_helm = Un casque port\u00e9 par les membres des \u00c9claireurs \u00e9carlates. Con\u00e7\
  u pour terrifier ses ennemis, ce casque est le visage d'un d\u00e9mon qui habite dans les \
  montagnes d'un pays distant. On dit qu'il garde les portes c\u00e9l\u00e9stes et permet \
  seulement ceux qui sont dignes de passer.

f.obsidian_hood_of_rituals = \u00abAvec beaucoup de travail et de grande soin, avec un coeur \u00e9\
  ternel et l'esprit pur: affilez la roche, retenez la cha\u00eene, accueillez la nuit, buvez \
  du Calice des Rois.\u00bb

f.obsidian_hood_of_sight = \u00abPar mes yeux, vous verrez le sentier aux \u00e9poques. Mon \
  regard est pur, d\u00e9gag\u00e9 des mensonges de r\u00e9alit\u00e9.\u00bb

f.obsidian_hood_of_influence = \u00abParlez avec la seule, vraie voix dans l'\u00e2me et elle vous \u00e9\
  coutera. Calme comme le murmur d'enfant, forte comme la mort de ce monde.\u00bb

f.obsidian_hood_of_devotion = \u00abEnveloppez-vous dans mon \u00e9treinte et succombez \u00e0 \
  mon amour sans bornes. Laissez votre souffle s'\u00e9tendre comme la fum\u00e9e d'une chandelle et r\u00eavez, r\u00eavez encore.\u00bb

f.iron_wolf_hood = Un casque port\u00e9 une fois par un membre du \u00abIron Wolves\u00bb, un \
  escadron de chevaliers intr\u00e9pides qui sp\u00e9cialisaient d'\u00e9limination de cibles \
  Morai qui \u00e9taient tr\u00e8s en vue. Apr\u00e8s l'escadron s'est dispers\u00e9, les \
  membres survivants avaient \u00e9t\u00e9 r\u00e9unis par Desna avec des autres escadrons pour \
  cr\u00e9er les Gardes \u00c9claireurs.

f.iron_dragon_helm = Un casque port\u00e9 une fois par un membre du \u00abIron Dragons\u00bb, \
  un escadron de chevaliers intr\u00e9pides qui sp\u00e9cialisaient d'\u00e9limination de \
  cibles Morai qui \u00e9taient tr\u00e8s en vue. Apr\u00e8s l'escadron s'est dispers\u00e9, \
  les membres survivants avaient \u00e9t\u00e9 r\u00e9unis par Desna avec des autres escadrons \
  pour cr\u00e9er les Gardes \u00c9claireurs.

f.gold_wolf_hood = Une casque port\u00e9e une fois par un membre du \u00abLoups d'or\u00bb, un \
  escadron de chevaliers intr\u00e9pides qui se sp\u00e9cialisent dans l'\u00e9limination de \
  cibles Morai tr\u00e8s en vue. Apr\u00e8s avoir dispers\u00e9, ses membres encore en vie \u00e9taient r\u00e9\
  unis par Desna avec des autres escadrons pour former les Gardes \u00c9claireurs.

f.gold_dragon_helm = Une casque port\u00e9e une fois par un membre du \u00abDragons d'or\u00bb, \
  un escadron de chevaliers intr\u00e9pides qui se sp\u00e9cialisent dans l'\u00e9limination de \
  cibles Morai tr\u00e8s en vue. Apr\u00e8s avoir dispers\u00e9, ses membres encore en vie \u00e9taient r\u00e9\
  unis par Desna avec des autres escadrons pour former les Gardes \u00c9claireurs.

f.polar_twilight_wolf_hood = Un capuchon chaud pr\u00e9f\u00e9r\u00e9 par les chevaliers post\u00e9s dans les r\u00e9\
  gions polaires. On dit que les p\u00e9nombres polaires sont des si belles spectacles \u00e0 voir.

f.polar_day_wolf_hood = Un capuchon chaud pr\u00e9f\u00e9r\u00e9 par les chevaliers post\u00e9s dans les r\u00e9\
  gions polaires. Le fourrure touffu est n\u00e9cessaire pour les patrouilles qui n'en finit \
  jamais pendant le jour.

f.polar_night_wolf_hood = Un capuchon chaud pr\u00e9f\u00e9r\u00e9 par les chevaliers post\u00e9s dans les r\u00e9\
  gions polaires. Le fourrure touffu est n\u00e9cessaire pour les patrouilles qui n'en finit \
  jamais pendant la nuit.

f.polar_day_warden_hood = Un capuchon r\u00e9chauffant qui garde le chevalier au chaud quand il \
  confronte des vents polaires et glacials. Cette masque couvert la visage, id\u00e9ale pour la \
  poste de surveillance pendant le jour.

f.polar_night_warden_hood = Un capuchon r\u00e9chauffant qui garde le chevalier au chaud quand \
  il confronte des vents polaires et glacials. Cette masque couvert la visage, id\u00e9ale pour \
  la poste de surveillance pendant la nuit.

f.polar_twilight_warden_hood = Un capuchon r\u00e9chauffant qui garde le chevalier au chaud \
  quand il confronte des vents polaires et glacials. Cette masque couvert la visage, id\u00e9\
  ale pour parcourir l'horizon dans la p\u00e9nombre.


f.serene_helm = Un casque ancien et r\u00e9sistant, recouvert de couche de mousse douce. \u00c0 l'int\u00e9\
  rieur de ce casque pierreux, on peut entendre une faible m\u00e9lodie apaisante compos\u00e9e \
  par le chuchotement du vent, voyageant de pays \u00e9loign\u00e9s.

f.celestial_nav_helm = Un casque fabriqu\u00e9 pour comm\u00e9morer les vieux explorateurs \
  Isoran de l'espace. En l'\u00e9quiper, on peut voir une voie libre au travers le ciel de \
  nuit, amenant aux mondes innombrables.

f.galactic_guardian_helm = Un casque comm\u00e9mor\u00e9 qui rend hommage aux braves gardiens \
  Isorans innombrables qui ont prot\u00e9g\u00e9 l'\u00e9quipe spatial pendant leurs aventures \
  au travers les \u00e9toiles.

f.stellar_sentinel_helm = Il y avait longtemps depuis ce casque \u00e9tait port\u00e9 par les \
  marins Isorans qui surveillaient les op\u00e9rations extrasolaires. En \u00e9quipant ce \
  casque, vous pensez que vous pouvez comprendre les m\u00e9caniques de l'univers.

f.shako = Un k\u00e9pi honorifique port\u00e9 par des chevaliers pendant les occasions tr\u00e8s prestigieuses.

f.nodeslime_helm = Un masque mena\u00e7ant de malveillance fabriqu\u00e9 avec une substance \
  suintant, soumise, et inqui\u00e9tante.

f.venom_fiend_mask = Un masque dit d'\u00eatre dou\u00e9 du visage d'un diable venimeux. Il est \
  infus\u00e9 d'une vil essence qui est certain d'effrayer vos ennemis.

f.arctic_rogue_mask = On dit que cette masque est fabriqu\u00e9e par un arctique explorateur \
  solitaire. La glace \u00e9clat\u00e9e cachera votre identit\u00e9 pendant les exp\u00e9\
  ditions clandestine dans l'arctique.


f.voltaic_radical_mask = On dit que cette masque est reproduite par un mechaknight dou\u00e9 de \
  sens. Les gyros et le crest de choc internes vous assurent que votre identit\u00e9 reste obscur\u00e9e.

f.nefarious_hood = Un capuchon dont on dit est fabriqu\u00e9 par un lutin mal\u00e9fique. La rune l\u00e9\
  vitant est certaine de vous cacher pendant les campagnes clandestines.

f.magmatic_fanatic_mask = On dirait que cette masque \u00e9tait port\u00e9e par les fanatiques \
  adorant un dieu de magma. Ses feux allumeront le chemin vers la victoire.

f.night_cap_pith = Un bonnet douillet pour les chevaliers \u00e0 porter dans la nuit. Le \
  porteur aura une bonne nuit de sommeil et de restauration.

f.night_cap_sallet = Un bonnet douillet pour les chevaliers \u00e0 porter dans la nuit. Le \
  porteur aura des r\u00eaves lucids pour confronter ses cauchemars.

f.night_cap_tailed = Un bonnet douillet pour les chevaliers \u00e0 porter dans la nuit. Le \
  porteur aura des doux r\u00eaves toute la nuit.

f.night_cap_round = Un capuchon si confortable pour les chevaliers \u00e0 porter dans le \
  sommeil. Le porteur aura plus d'heures pour endormir, bien s\u00fbr.

f.stranger_cap = Un chapeau port\u00e9 par l'un des \u00c9trangers \u00e9nigmatiques. Les b\u00e9\
  cassines locales semblent \u00eatre attir\u00e9es par le porteur.

f.spiraltail_mask = Un masque modeste d'un simian pour c\u00e9l\u00e9brer le Nouvel An. Vous \
  serez le star de spectacle en faisant le fou.

f.firetail_mask = Un masque flamboyante d'un simian pour c\u00e9l\u00e9brer le Nouvel An. La \
  silhouette br\u00fblante montra vos m\u0153urs majesteuses.


















# Costume Armor names
#...................................................................................................

f.gm_armor = Une armure imposante indigo qui indique indisputablement un des incroyables Game \
  Masters du Spiral Order.

f.tabard_rose = Un tabard ag\u00e9 et brod\u00e9 de fleurs qui appartenait jadis \u00e0 un \
  Knight of the Rose, un ordre sacr\u00e9 de chevaliers braves et audacieux dont les aventures \
  sont encore racont\u00e9s dans des chansons et des contes. Les Knights of the Rose sont r\u00e9put\u00e9s d'avoir \u00e9t\u00e9 \
  des escrimeurs sans pareil, et d'avoir cru que leurs lames \u00e9taient comme les roses qui \u00e9\
  taient leur symbole: jolies, d\u00e9licates, et poss\u00e9dant un m\u00e9chant dard.

f.plasmatech_demo_suit = Un Demo Suit command\u00e9 par King Krogmo pour f\u00eater le \
  lancement de Blast Network. C'est la tenue parfaite pour des d\u00e9tonations formels, ou \
  pour des explosions plus relaxes.

f.tusk_helm = Prenant mod\u00e8le sur des b\u00eates nobles connues pour la force et leur \
  audace, le porteur de ce casque remplit les ennemis d'effroi tel qu'on raconte de ces actes \
  pendant les \u00e9poques \u00e0 venir.

f.metal_sonic_suit = Un armure construit m\u00e9ticuleusement, \u00e9quip\u00e9 avec une V. Max \
  Overdrive Unit ultra-puissant.

f.heavenly_guardian_armor = Une armure blanche et \u00e9clatante port\u00e9e par ceux qui d\u00e9fendent les domaines c\u00e9leste.

f.infernal_guardian_armor = Une armure calcin\u00e9e et glauque, port\u00e9e par ceux qui d\u00e9\
  fendent les profondeurs infernaux.

f.brigandine = Un armure pratique avec une veste tricot\u00e9e.

f.cloak = Une cape pr\u00e9f\u00e9r\u00e9e par les \u00e9tudiants d'arcane.

f.cuirass = Un armure moulant qui est tout classe et aucune poches.

f.culet = Un armure \u00e9l\u00e9gante, capable de se flatter tous les formes.

f.draped_armor = Une armure \u00e9l\u00e9gante qui ajoute un petit de classe dans la bataille.

f.flak_jacket = Une veste l\u00e9g\u00e8re et blind\u00e9e qui vous garde chic et cool.

f.fur_coat = Un manteau tr\u00e8s chaleureux, fabriqu\u00e9 avec le peau d'une b\u00eate \u00e0 fourrure.

f.plate_mail = Un armure cliquetante, tintant, et encombrante, parfaite si vous voulez de r\u00e9sister aux bagarres.

f.scale_mail = Un set de \u00e9cailles d'un serpent chatoyant, tis\u00e9e en un armure.

f.raiment = Une longue tenue de combat. Les meilleures accessoires qui va avec cette tenue sont \
