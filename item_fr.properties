f.frenzy_rider_mantle = On croit que cette armure l\u00e9gendaire \u00e9tait port\u00e9e par un \
  dieux qui a utilis\u00e9 la fr\u00e9n\u00e9sie pour sculpter des mondes entiers en pierre.

f.battle_chef_coat = Un manteau port\u00e9 par les chevaliers qui travaillent dans la coquerie \
