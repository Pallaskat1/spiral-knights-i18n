# Sprite Pod Descriptions (names are in sprites.properties)
#...................................................................................................

f.drakon_pod = Une cosse de sprite contenant un sprite de bataille Drakon niveau 1.\n\
  \n\
  Le Drakon est un sprite de bataille qui incarne la destruction par la feu. Ses comp\u00e9\
  tences se concentrent sur la pure puissance offensive.
f.seraphynx_pod = Une cosse de sprite contenant un sprite de bataille Seraphynx niveau 1.\n\
  \n\
  Le Seraphynx est un sprite de bataille qui incarne la lumi\u00e8re divine. Ses comp\u00e9\
  tences se concentrent sur protection et r\u00e9tablissement des chevaliers en combat.
f.maskeraith_pod = Une cosse de sprite contenant un sprite de bataille Maskeraith niveau 1.\n\
  \n\
  Le Maskeraith est un sprite de bataille qui incarne les ombres. Ses comp\u00e9tences se \
  concentrent sur le subterfuge et les toxines mortelles.

