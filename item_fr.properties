# Royal Jelly
f.furni_trophy_boss_royaljelly_1 = Une gemme mou tr\u00e8s pris\u00e9 par les blobeux. Cette \
  gemme ici \u00e9tait lib\u00e9r\u00e9e du Palais de Blobeux royaux est conserv\u00e9e avec \
  soin comme un starter de conversation.

f.furni_trophy_boss_royaljelly_2 = Une pi\u00e8ce de bijou jolie port\u00e9e par le Jelly royal \
  lui-m\u00eame. Elle se perche jovialement sur un coussin g\u00e9latineux.

f.furni_trophy_boss_royaljelly_3 = Un mod\u00e8le r\u00e9duit du Jelly royal. Il serait flatt\u00e9 s'il n'\u00e9tait pas d\u00e9j\u00e0 aplati.

# Snarbolax
f.furni_trophy_boss_snarbolax_1 = Une dent longue coupant comme un rasoir, la preuve que vous \
  ayez rencontr\u00e9 le l\u00e9gendaire Snarbolax et ayez surv\u00e9cu et galop\u00e9 chez Haven.

f.furni_trophy_boss_snarbolax_2 = Une succinct statue de Snarbolax, en montrant l'ombre sans \
