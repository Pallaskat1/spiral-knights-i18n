f.moonstone = On raconte que ce min\u00e9ral l\u00e9gendaire d'un bleu \u00e9tincelant renferme \
  la totalit\u00e9 du savoir des univers.

f.valestone = On raconte que ce min\u00e9ral l\u00e9gendaire d'un vert intense contient \
  l'essence de toute vie.

