# Roarmulus
f.furni_trophy_boss_roarmulus_1 = Un set de sch\u00e9mas lib\u00e9r\u00e9s, en exhibant les \
  specs et l'\u00e9chelle complets du Projet Roarmulus.

f.furni_trophy_boss_roarmulus_2 = Un mod\u00e8le miniature de l'un des Roarmulus Twins. \
