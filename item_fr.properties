# Weapon Bomb names
#...................................................................................................

f.ash_agni = Vos ennemis ont la permission pour mourir lorsque cette bombe rendre le champ de \
  bataille en cendres.

f.big_angry_bomb = Cette bombe d\u00e9vastatrice a mauvais caract\u00e8re.

f.blast_bomb = Une bombe polyvalente fournie aux Spiral Knights qui ont prouv\u00e9 leur valeur au combat.

f.cold_snap = Une Proto Bomb modifi\u00e9 pour g\u00e9n\u00e9rer des petits rafales de givre \
  quand on la fait d\u00e9toner.

f.crystal_bomb = Une bombe \u00e0 tessons form\u00e9 d'un petit explosif encastr\u00e9 dans une \
  alliage de Moonstone et Valestone. Son couleur azur\u00e9 et apaisant est cliniquement prouv\u00e9 \
  de calmer les chevaliers et d'annihiler les morts-vivants.

f.dark_briar_barrage = Un objet l\u00e9gendaire qui explose avec la fureur du Snarbolax. Le \
  hurlement sinistre qu'il produit est dit d'\u00eatre plus paralysant que son coup.

f.dark_matter_bomb = Une bombe \u00e0 tessons form\u00e9e d'un petit explosif encastri dans du \
  Dark Matter. Depuis son d\u00e9couvert, on a trouv\u00e9 plusieurs applications du Dark \
  Matter, d'alimeter la technologie Spirale jusqu'\u00e0 la r\u00e9organization des Gremlins \
  sur le niveau subatomique.

f.deadly_charcoaler = Ce gril gaillard est garanti de carboniser votre comp\u00e9tition.

f.deadly_crystal_bomb = Un grand morceau d'alliage de Moonstone et Valestone amorc\u00e9d d'un \
  puissant exposif. Les \u00e9tudes ont d\u00e9montr\u00e9s que cette bombe peut \u00eatre utilis\u00e9e pour r\u00e9\
  duire l'envie de manger des cerveaux par 100% en r\u00e9duisant les zombies en petits \
  morceaux.

f.deadly_dark_matter_bomb = Un grand morceau de Dark Matter amorc\u00e9 d'un puissant exposif. \
  Cette bombe violerait les r\u00e8glements de s\u00e9curit\u00e9 de l'ordre Spirale si on \
  n'avait pas perdu notre seule copie dans l'\u00e9crasement.

f.deadly_shard_bomb = Un grand morceau de Crimsonite amorc\u00e9 d'un puissant exposif. Plus de \
  Crimsonite appauvri ici: cette bombe contient le vrai de vrai! C'est une bonne chose, tandis \
  que vous n'\u00eates pas cibl\u00e9.

f.deadly_splinter_bomb = Un grand morceau de min\u00e9raille synth\u00e9tique amorc\u00e9 d'un \
  puissant exposif. Fait: le moyen le plus simple de trouver l'aiguille dans la botte de foin \
  est de faire sauter la botte de foin.

f.deconstructor = Une bombe con\u00e7ue pour d\u00e9truire les machines, qu'elles soient \
  intelligentes ou non.

f.electron_bomb = Adapt\u00e9e de certains th\u00e9ories gremlins de la physique, ceux qui sont \
  assez malchanceux  d'\u00eatre frapp\u00e9 par l'explosion de cette bombe s'attend \u00e0 \u00eatre choqu\u00e9e.

f.electron_charge = Une petite charge electro-explosif aux origines myst\u00e9rieuses. Il est \
  capable de g\u00e9n\u00e9rer un vortex paralysant d'\u00e9lectricit\u00e9.

f.electron_vortex = Un Electron Bomb modifi\u00e9 avec un charge utile d'essence organique \
  instable. Les ennemis qui sont foudroy\u00e9s par cette bombe sont surnomm\u00e9s \u00abaffrapp\u00e9s\u00bb.

f.heavy_deconstructor = Un Deconstructor plus puissant qui ruinera des robots et mettra fin aux \
  monstres m\u00e9ca dans une zone plus large.

f.fiery_atomizer = Une bombe alchimique puissante qui cr\u00e9e une nuage \u00e9pais de poussi\u00e8re tr\u00e8s combustible.

f.fiery_vaporizer = Cette bombe alchimique g\u00e9n\u00e8re un nuage de brume tr\u00e8s inflammable.

f.fiery_vaporizer_mkii = Un Fiery Vaporizer modifi\u00e9 pour disperser de la mati\u00e8re \
  combustible parmi une zone plus large.

f.firecracker = Une Proto Bomb qui a \u00e9t\u00e9 modifi\u00e9e pour projeter de petites \
  flammes lors de l'explosion.

f.freezing_atomizer = Une bombe alchimique puissante qui cr\u00e9e une nuage \u00e9pais de poussi\u00e8re cryog\u00e9nique.

f.freezing_vaporizer = Cette bombe alchimique g\u00e9n\u00e8re un nuage de brume glaciale.

f.freezing_vaporizer_mkii = Un Freezing Vaporizer modifi\u00e9 pour lancer des nuages de brume \
  glaciale sur une \u00e9tendue plus grande.

f.graviton_bomb = Capable d'attirer les ennemis avant d'exploser, cette bombe utilise de la \
  technologie que l'Ordre Spirale ne comprend encore pas.

f.graviton_charge = Un petit charge explosif aux origines myst\u00e9rieuses. Il est capable de \
  g\u00e9n\u00e9rer un vortex de gravit\u00e9 \u00e9crasant.

f.graviton_vortex = Une Graviton Bomb fortifi\u00e9e avec des quantit\u00e9s potentiellement \
  dangereux d'acier d'ombre. Son explosion devrait attirer vos ennemis... au moins, s'il ne d\u00e9chire pas l'univers.

f.haze_bomb = Cette bombe alchimique g\u00e9n\u00e8re un nuage nocif capable d'\u00e9tourdir \
  tous ceux qui le respirent.

f.haze_bomb_mkii = Un Haze Bomb modif\u00e9 pour disperser des produits chimiques d\u00e9l\u00e9t\u00e8\
  res parmi une plus grande aire.

f.haze_burst = Une bombe alchimique puissante qui produit une nuage de mati\u00e8re fortement d\u00e9sorientante.

f.heavy_crystal_bomb = Un morceau solide d'alliage avec une surprise explosive en dedans. Les \
  zombies d\u00e9testent les surprises.

f.heavy_dark_matter_bomb = Un morceau solide de Dark Matter avec une surprise explosive en \
  dedans. Les gremlins d\u00e9testent les surprises.

f.heavy_shard_bomb = Un morceau solide de Crimsonite appauvri avec une surprise explosive en \
  dedans. Tout le monde adore les surprises!

f.heavy_splinter_bomb = Un morceau solide de min\u00e9raille synth\u00e9tique avec une surprise \
  explosive en dedans. Les wolvers d\u00e9testent les surprises.

f.humbug_hazer = Cet engin grincheux est garanti de faire mal \u00e0 l'estomac pour tous les \
  personnes, sauf des charlatans et fumistes grincheux.

f.ionized_salt_bomb = Un grand morceau de Rock Salt qui cache une surprise explosive. Les gel\u00e9es d\u00e9testent les surprises.

f.irontech_bomb = Cette lourde bombe entour\u00e9e d'\u00e9paisses plaques de fer est plus \
  lente que la plupart des engins explosifs, mais elle a une sacr\u00e9e puissance.

f.irontech_destroyer = Cette Irontech Bomb am\u00e9lior\u00e9e exploite tout le potentiel \
  destructeur de la technologie Irontech.

f.jack_froster = Accueillez un paysage hivernel f\u00e9erique avec cette surprise d\u00e9\
  plaisante qui fait couler votre nez. C'est parfait pour donner vos ennemies un mauvais cas de \
  gelure.

f.lightning_capacitor = Un Capacitor augment\u00e9 qui  explose avec la fureur d'un orage.


f.master_blast_bomb = Un explosif incroyablement puissant utilis\u00e9 g\u00e9n\u00e9ralement \
  dans les mines. Il est maintenant fourni aux guerriers, ce qui n'est pas forc\u00e9ment prudent.

f.nitronome = R\u00e9serv\u00e9 aux meilleurs grenadiers des Spiral Knights, cet explosif sup\u00e9\
  rieur est fait d'une substance synth\u00e9tique qui \u00e9met un tic-tac sinistre m\u00eame \
  lorsqu'il n'est pas arm\u00e9.

f.obsidian_crusher = Une bombe \u00e9trange fabriqu\u00e9 gr\u00e2ce aux ob\u00e9lisques \
  obsidiennes trouv\u00e9s dans le domaine d'Apocrea. Bien qu'elle soit une bombe, quelques-uns \
  la tient et essaie de la \u00abr\u00e9soudre\u00bb comme si la bombe est un casse-t\u00eate.

f.plasma_capacitor = L'ajout d'une source d'\u00e9nergie Spiral avanc\u00e9e donne a cette \
  bombe un rayon d'explosion immense.

f.proto_bomb = Ces petites bombes permettent aux nouvelles recrues des Spiral Knights \
  d'apprendre l'art de la d\u00e9molition.

f.radiant_sun_shards = Un grand morceau de Luminite charg\u00e9 qui cache une surprise \
  explosive. Les devilites d\u00e9testent les surprises.

f.rock_salt_bomb = Cette bombe \u00e0 tessons est constitu\u00e9e d'un petit explosif ench\u00e2ss\u00e9\
  e dans un bloc de Rock Salt. Ne pas utiliser dans une cuisine.

f.scalding_hot_cocoa = Un splash flambant d'une destruction sucr\u00e9e accueille tous les \
  ennemis qui se jettent \u00e0 la chope avant qu'elle avait une chance de se refroidir.

f.scintillating_sun_shards = Un grand morceau de Luminite charg\u00e9 par le soleil et amorc\u00e9 \
  d'un puissant exposif. Le spectacle pyrotechnique est compl\u00e8tement \u00e9tonnant.

f.shard_bomb = Une bombe \u00e0 tessons form\u00e9e d'un petit explosif encastri dans du \
  Crimsonite appauvri. Appauvri ou non, cette bombe lance du shrapnel s\u00e9rieux.

f.shivermist_buster = Employ\u00e9e initialement pour congeler des provisions p\u00e9rissables, \
  le Silvermist Buster satisfait beaucoup plus quand il cong\u00e8le les monstres.

f.shocking_salt_bomb = Un grand morceau de rock salt amorc\u00e9 d'un puissant exposif. Pour \
  satisfaire vos demandes nutritionnels, ce morceau particulier est enrichi de quantit\u00e9s dangereux d'\u00e9lectricit\u00e9. Euh, quoi?

f.spike_shower = Un truc puissant con\u00e7u pour d\u00e9chiqueter ses adversaires avec un \
  grondement.

f.spine_cone = Un truc f\u00e9roce qui \u00e9clate de ronces.

f.splinter_bomb = Une bombe \u00e0 tessons form\u00e9e d'n petit explosif encastri dans du mat\u00e9riel synth\u00e9\
  tique. Susceptible au fracassement, ce mat\u00e9riel autrement inutile est parfait pour \
  perforer les ennemis.

f.stagger_storm = Initialement con\u00e7u par l'Ordre Spirale pour subjuger les esp\u00e8ces \
  dangeureux sans leur faire mal. Or, comment vous choisissez de traiter les ennemis assez \
  malchanceux de vous rencontrer est enti\u00e8rement \u00e0 vous.

f.static_capacitor = Un appareil explosif d'origine Gremlin con\u00e7u pour produire un champ \u00e9l\u00e9ctrique mortel.

f.static_flash = Une Proto Bomb modifi\u00e9e pour g\u00e9n\u00e9rer des petits \u00e9clats \u00e9lectriques lors de la d\u00e9tonation.

f.sun_shards = Une bombe \u00e0 tessons encastr\u00e9 dans du Luminite charg\u00e9. Ne le \
  regardez pas directement, je vous en prie.

f.super_blast_bomb = Cette version am\u00e9lior\u00e9e de la Blast Bomb combine une source de \
  chaleur instable \u00e0 un mat\u00e9riau explosif encore non test\u00e9, ce qui donne une \
  arme plut\u00f4t dangereuse \u00e0 manipuler.

f.super_crystal_bomb = Une bombe \u00e0 tessons remplie d'encore plus d'alliage. \u00c0 \
  appliquer directement sur le front de votre ennemi.

f.super_dark_matter_bomb = Une bombe \u00e0 tessons remplie d'encore plus de Dark Matter. \
  Combien de Dark Matter est trop? Combien est dans la bombe?

f.super_shard_bomb = Une bombe \u00e0 tessons remplie d'encore plus de Crimsonite appauvri. La \
  cure cr\u00e9ative pour une cr\u00e9ature combative est clairement un cristal au cr\u00e2ne.

f.super_splinter_bomb = Une bombe \u00e0 tessons replie d'encore plus de min\u00e9raille synth\u00e9tique. Elle sert aussi \u00e0 couper vos l\u00e9gumes, si \u00e7a ne vous d\u00e9\
  range pas de risquer de casser vos dents en mordant du cristal de temps en temps.

f.toxic_atomizer = Une bombe alchimique puissante qui produit une nuage empoisonn\u00e9e.

f.toxic_vaporizer = Cette bombe alchimique g\u00e9n\u00e8re un nuage de toxines.

f.toxic_vaporizer_mkii = Un Toxic Vaporizor modifi\u00e9 pour disperser des produits chimiques \
  d\u00e9l\u00e9t\u00e8res parmi une zone plus large.

f.twisted_spine_cone = Un Spine Cone am\u00e9lior\u00e9 qui fustigera les ennemis avec des \u00e9\
  pis et les recouvrira de ronces.

f.venom_veiler = L'ultime engin de dispersion de toxines, le Venom Veiler est utilis\u00e9 pour d\u00e9\
  truire les pestes sur les r\u00e9coltes. S'il n'y a pas assez de pestes, on peut s'amuser \u00e0 d\u00e9truire les r\u00e9coltes!

f.voltaic_tempest = Cet appareil haute technologie et haute tension n'est pas recommand\u00e9 \
  pour l'usage dans l'eau, proche de l'eau, ou proche des chevaliers qui pensent des pens\u00e9es mouill\u00e9\
  s. Pour vous sauvegarder, il est probablement mieux de ne pas le regarder, m\u00eame.


# Weapon Bomb names (special)
#...................................................................................................

f.celestial_vortex = Une bombe c\u00e9leste modifi\u00e9e avec la puissance d'un soleil \
  mourrant. Les ennemis attrap\u00e9s dans le rayon d'explosion apercevront l'aube de cr\u00e9ation.



f.punkin_cinnamug = Un m\u00e9lange de punkin et cannelle qui va br\u00fbler ceux qui ne font \
  aucune attention \u00e0 l'avertissement \u00ab Caution: C'est chaud ! \u00bb sur la tasse.


f.warmaster_bomb_1 = Une bombe puissante et rempli avec d'\u00e9nergie noir que le Warmaster \
  Seerus a construit pour le seul but d'\u00e9liminer des autres gremlins qui bloquent son \
  chemin.

f.warmaster_bomb_2 = Une version raffin\u00e9e de la bombe ombreuse que le Warmaster Seerus a \
  construit pour le seul but d'\u00e9liminer des autres gremlines qui bloquent son chemin.

f.warmaster_bomb_3 = La version parfaite de la bombe ombreuse que le Warmaster Seerus a \
  construit pour le seul but d'\u00e9liminer les autres gremlins qui bloquent son chemin. On \
  croit qu'elle est r\u00e9serv\u00e9e pour l'utiliser contre des autres membres d'Ordre \
  l'Incarnat.

# Weapon Handgun names
#...................................................................................................

f.antigua = Cette relique mystique nous vient du fond des \u00e2ges. Elle tire des balles \u00e0 \
  l'aide d'une poudre explosive.

f.arcana = Un pistolet exceptionnel qui tire des forts coups \u00e9l\u00e9mentaires, desquels \
  la plupart des Spiral Knights appelent \u00ables missiles de la magie\u00bb.

f.argent_peacemaker = Ce vieux pistolet a \u00e9t\u00e9 forg\u00e9 dans du Sun Silver. Ses \
  balles aident les r\u00e9calcitrants \u00e0 passer de vie \u00e0 tr\u00e9pas.

f.autogun = Un pistolet compl\u00e8tement automatique capable de rapidement lancers des jets d'\u00e9nergie.

f.biohazard = Faites attention aux joints de votre armure avant d'op\u00e9rer cette arme, ou \
  vous pouvez se terminer dans le m\u00eame \u00e9tat de vos ennemis. Les balles charg\u00e9es \
  du Biohazard enveloppent vos ennemis dans un champ d'\u00e9nergie qui s'explose apr\u00e8s avoir \u00e9t\u00e9 endommag\u00e9.

f.black_chaingun = Une mitrailleuse bien avanc\u00e9e, con\u00e7ue pour arroser la cible de \
  centaines d'\u00e9clairs ombreux \u00e0 la fois. Contr\u00f4ler l'un de ces mitrailleuses n\u00e9cessite des mains habill\u00e9s.

f.blackhawk = Ce pistolet de l'ombre a une puissance ph\u00e9nom\u00e9nale. On raconte qu'il \
  renferme l'\u00e2me d'un chevalier mort deux jours avant sa retraite.

f.blaster = Un pistolet polyvalent fourni aux Spiral Knights qui ont prouv\u00e9 leur valeur au combat.

f.blazing_pulsar = Un pulsar bien avanc\u00e9 et capable de lancer des brasiers compacts de \
  loin. Les tirs des Pulsars deviennent plus puissants \u00e0 mesure de leur voyage.

f.blight_needle = C'est un fait av\u00e9r\u00e9 que m\u00eame la toxine la plus virulente est \
  beaucoup plus contagieuse si elle est lanc\u00e9e sans discrimination \u00e0 travers une \
  grande aire.

f.blitz_needle = Si la suppression n'est pas bien assez, le Blitz Needle sp\u00e9cialise dans \u00ab\
  les coups de feu oppressifs\u00bb.

f.breach_blaster = Un blaster per\u00e7ant am\u00e9lior\u00e9, con\u00e7u pour percer l'armure \
  hostile.


f.callahan = Un pistolet incroyablement puissant dont le recul pourrait bien vous secouer. On \
  dit que ces cibles se sentent moins chanceux. Un tir charg\u00e9 peut perforer plusieurs \
  ennemis aussi.

f.catalyzer = Une arme alchimique avanc\u00e9e adapt\u00e9e des appareils mini\u00e8res des \
  Gremlins. Les balles charg\u00e9es du Catalyzer enveloppent vos ennemis dans un champ d'\u00e9nergie qui s'explose apr\u00e8s avoir \u00e9t\u00e9 endommag\u00e9.

f.cryo_driver = Un pistolet alchimique avanc\u00e9 qui tire des balles cryos puissantes qui se \
  fissionnent plusieurs fois sur l'impact.

f.cryotech_alchemer = Ce pistolet alchimique tire des balles \u00e0 tr\u00e8s basse temp\u00e9rature qui se fendent \u00e0 l'impact.

f.cryotech_alchemer_mkii = Un Alchemer augment\u00e9 qui lance des jets de mat\u00e9riel cryog\u00e9nique plus rapidement.

f.dark_chaingun = Une mitrailleuse capable de sortir un tir de barrage avec des coups ombreux \
  et br\u00fblant.

f.elemental_blaster = Un blaster am\u00e9lior\u00e9, modifi\u00e9 pour tirer les cartouches \u00e9l\u00e9mentaires.

f.firo_driver = Un pistolet alchimique avanc\u00e9 qui tire des balles firos puissantes qui se \
  fissionnent plusieurs fois sur l'impact.

f.firotech_alchemer = Ce pistolet alchimique tire des balles de m\u00e9tal en fusion qui se \
  fendent \u00e0 l'impact.

f.firotech_alchemer_mkii = Un Alchemer augment\u00e9 qui lance des jets de napalm plus \
  rapidement.

f.flaming_pulsar = Un pulsar modifi\u00e9 avec l'\u00e9nergie incendiant qui br\u00fble plus \
  avec le temps. Les tirs des Pulsars deviennent plus puissants \u00e0 mesure de leur voyage.

f.freezing_pulsar = Un pulsar modifi\u00e9 avec un agent de cong\u00e9lation qui devient plus \
  froid avec le temps. Les tirs des Pulsars deviennent plus puissants \u00e0 mesure de leur voyage.

f.frost_gun = Un Proto Gun am\u00e9lior\u00e9 avec un agent frigorig\u00e8ne alchimique de \
  faible intensit\u00e9.

f.frozen_pulsar = Un pulsar bien avanc\u00e9 qui peut produire une explosion de temp\u00eate \
  verglas lorsque les cartouches m\u00fbrissent. Les tirs des Pulsars deviennent plus puissants \u00e0 mesure de leur voyage.

f.fusion_blaster = Un blaster \u00e9l\u00e9mentaire am\u00e9lior\u00e9, con\u00e7u pour exiler les cr\u00e9\
  atures qui se cache dans la noirceur.

f.gigawatt_pulsar = Un pistolet fortement augment\u00e9 qui frappe avec la force d'un coup de \
  foudre. Les tirs des Pulsars deviennent plus puissants \u00e0 mesure de leur trajet.

f.gilded_griffin = Un beau pistolet qui tient son nom d'une b\u00eate grande et noble. On avait \
  cru que le cadre en or fournissait la lumi\u00e8re dans la noirceur imp\u00e9n\u00e9trable d'Enfer.

f.grim_repeater = Utilis\u00e9 seulement par les plus \u00e9lites de gardes Spiral Knight, \
  cette mitrailleuse diabolique a gagn\u00e9 son nom gr\u00e2ce \u00e0 la vitesse des \
  admissions \u00e0 l'Enfer qu'elle donne.

f.hail_driver = Un fois que vous aviez vu les jets de glace surnaturellement froid qu'il \
  produit, vous comprendrez pourquoi ce Driver fait grelotter.

f.heavy_pulsar = Un Pulsar augment\u00e9 avec de la technologie Spiral pour \u00eatre plus \
  puissant. Les tirs du Heavy Pulsar deviennent plus puissants \u00e0 mesure de leur trajet.

f.industrial_catalyzer = Un Catalyzer modifi\u00e9 pour lancer des projectiles dangereusements \
  suraliment\u00e9s. Les balles charg\u00e9es du Industrial Catalyzer enveloppent vos ennemis \
  dans un champ d'\u00e9nergie qui s'explose apr\u00e8s avoir \u00e9t\u00e9 endommag\u00e9.

f.iron_slug = Seulement les ennemis les plus effrayants peuvent se tenir contre la paralysie \
  caus\u00e9e par la force magnum de l'impact du Iron Slug. Un tir charg\u00e9 peut perforer \
  plusieurs ennemis aussi.

f.kilowatt_pulsar = Un Pulsar augment\u00e9 avec de la technologie Spiral pour livrer un choc \u00e9\
  lectrique quand il frappe. Les tirs du Heavy Pulsar deviennent plus puissants \u00e0 mesure de leur trajet.

f.magma_driver = Crachant des gobets de mort br\u00fblant avec une vitesse qui fait peur, cette \
  pistolet n'est pas recommand\u00e9e pour l'usage autour de (ou sur) les personnes (ou les \
  objets) qui vous tiennent \u00e0 coeur.

f.magnus = Un grand pistolet tirant des balles puissantes capables d'assommer les monstres les \
  plus imposants. Un tir charg\u00e9 peut perforer plusieurs ennemis aussi.

f.master_blaster = Cette arme de poing am\u00e9lior\u00e9e est parfaite si votre groupe a \
  besoin d'un h\u00e9ros suppl\u00e9mentaire.

f.mega_magnus = Ce Magnus am\u00e9lior\u00e9 est assez puissant pour arracher la t\u00eate d'un \
  monstre. Un tir charg\u00e9 peut perforer plusieurs ennemis aussi.

f.mega_tundrus = Un tundrus qui ne fait aucune concession, sauf quand il le fait. Puis la \
  prison est mise en glace. Un tir charg\u00e9 peut perforer plusieurs ennemis aussi.

f.needle_shot = Un Autogun modifi\u00e9 de tirer les coups de feu per\u00e7ants d'une vitesse inqui\u00e9tante.

f.neutralizer = La quantit\u00e9 d'applications pratiques de deux substances qui, quand m\u00e9lang\u00e9\
  es, ne laissent rien derri\u00e8re eux vous surprendra s\u00fbrement.  Les balles charg\u00e9\
  es du Neutralizer enveloppent vos ennemis dans un champ d'\u00e9nergie qui s'explose apr\u00e8s avoir \u00e9t\u00e9 endommag\u00e9.

f.nog_blaster = Une chambre tr\u00e8s volatile rempli\u00e9e avec la joie cr\u00e9meuse et \
  plein de cholest\u00e9rol qui a du punch quand elle est tir\u00e9e.

f.nova_driver = Plus qu'un souhait sera demand\u00e9 pour vous sauver si vous \u00eates le \
  cible malheureux de ce pistolet tout-puissant avec la force des \u00e9toiles-m\u00eames.

f.obsidian_carbine = Un fusil mortel fabriqu\u00e9 gr\u00e2ce aux ob\u00e9lisques obsidiennes \
  trouv\u00e9s dans le domaine d'Apocrea. Avec chaque coup tir\u00e9, on entend un murmur doux \
  qu'on croit dit le vrai nom de sa cible.

f.overcharged_mixmaster = Un mixeur \u00e0 main d'une puissance industrielle qui va faire une \
  sensation.

f.celestial_orbitgun = Ce pistolet astral conjure des images de la naissance de syst\u00e8mes \
  stellaires. On dirait que les ennemis pris au pi\u00e8ge par ce maelstrom violent verra la \
  lumi\u00e8re.

f.pepperbox = Un Autogun modifi\u00e9 pour lancer des balles \u00e0 haute temp\u00e9rature \
  capable d'engouffrer les adversaires.

f.permafroster = Les Chevaliers de tech ne sont pas vraiment s\u00fbrs si les cibles de ce surg\u00e9l\u00e9 pistolet se d\u00e9gelent. Pour ce moment, \u00abnon\u00bb\
  . Les tirs des Permafroster deviennent plus puissants \u00e0 mesure de leur voyage.

f.phantamos = Un pistolet puissant, plein d'\u00e9nergie ombreuse. Le Phantamos est l'une des \
  additions r\u00e9centes pour l'arsenal Spiral Knight, car contenir l'\u00e9nergie ombreuse de \
  cette calibre a pris beaucoup de recherche d\u00e9di\u00e9e.

f.pierce_blaster = Un blaster am\u00e9lior\u00e9, modifi\u00e9 pour tirer quelques cartouches \
  per\u00e7ants.

f.plague_needle = Les chevaliers ne s'entendent pas au sujet de si les balles de ce pistolet \
  perforent puis empoisonnent, ou si elles empoisonnent puis perforent. De toute fa\u00e7on, la \
  cible ne s'en souci pas.

f.polaris = On raconte que les explosions g\u00e9n\u00e9r\u00e9es par cette pistolet stellaire \
  sont tellements brillantes qu'ils illumineront les pires noirceurs. Les tirs du Polaris \
  deviennent plus puissants \u00e0 mesure de leur voyage.

f.prisma_driver = Un pistolet alchimique avanc\u00e9 qui tire des balles prismas puissantes que \
  se fissionnent plusieurs fois sur l'impact.

f.prismatech_alchemer = Ce pistolet alchimique tire des balles de m\u00e9tal liquide charg\u00e9es \u00e9\
  lectriquement qui se fendent \u00e0 l'impact.

f.prismatech_alchemer_mkii = Un Alchemer am\u00e9lior\u00e9 qui tire des jets de liquide \
  photonique \u00e0 une vitesse augment\u00e9e.

f.proto_duelist = Un pistolet de six-coups, pr\u00e9f\u00e9r\u00e9s par les tireurs d'\u00e9\
  lite de recrues Spiral Knights.

f.chilling_duelist = Commencez \u00e0 trancher les d\u00e9bats au point du jour avec cet froid \
  pistolet personnalis\u00e9.

f.proto_gun = Une arme \u00e0 feu compacte, fournie \u00e0 toutes les recrues au sein des \
  Spiral Knights.

f.pulsar = Une arme \u00e0 feu Gremlin \u00e0 haute technologie con\u00e7u pour les escadrons \u00e9\
  lites des soldats Ironclaw.  Les tirs des Pulsars deviennent plus puissants \u00e0 mesure de leur voyage.

f.pummel_gun = Un Punch Gun bien modifi\u00e9 comme il faut pour l'utilisation dans les \
  combats. Le recul qui arrive lorsqu'on utilise son attaque charg\u00e9e est mal fam\u00e9 \
  parmi les nouveaux recrues.

f.punch_gun = Cet outil de secours sert \u00e0 ouvrir les capsules de descente endommag\u00e9es, mais peut \u00e9\
  galement faire office de puissant pistolet \u00e0 un coup.

f.radiant_pulsar = Un pistolet de pointe destin\u00e9 aux plus brillants de l'Ordre Spiral.  \
  Les tirs des Pulsars deviennent plus puissants \u00e0 mesure de leur voyage.

f.raptor = Un pistolet ancien, insuffl\u00e9 avec des enchantements destin\u00e9s pour ch\u00e2tient les d\u00e9\
  mons d'Enfer. Dignes de ce nom, ses coups tirent rapidement et frappent avec une force \
  mortelle.

f.riftlocker = Un fusil mortel qu'on dit est capable de rompre l'armure fortifi\u00e9 en un \
  seul tir. Ces fusils ont \u00e9t\u00e9 tellement utiles pendant le si\u00e8ge d'Isora en d\u00e9\
  chirant les machines de guerre du Morai.

f.sentenza = Ce vieux pistolet a \u00e9t\u00e9 forg\u00e9 dans de l'acier d'ombre. On dit qu'il \
  appartenait \u00e0 un \u00eatre malfaisant poss\u00e9dant des \u00abyeux d'ange\u00bb.

f.shadow_blaster = Un blaster am\u00e9liore, modifi\u00e9 pour tirer les cartouches ombreuses.

f.shadow_driver = Un pistolet alchimique avanc\u00e9 qui tire des balles d'ombre puissantes que \
  se fissionnent plusieurs fois sur l'impact.

f.shadowtech_alchemer = Ce pistolet alchimique tire des balles d'ombre concentr\u00e9e qui se fendent \u00e0 l'impact.

f.shadowtech_alchemer_mkii = Un Alchemer am\u00e9lior\u00e9 qui tire des jets d'ombre \u00e0 une vitesse augment\u00e9e.

f.silversix = Une myst\u00e9rieuse pi\u00e8ce de mus\u00e9e argent\u00e9e. On raconte que des \u00abpr\u00eatres arm\u00e9s\u00bb \
  utilisaient ces pistolets \u00e0 une \u00e9poque oubli\u00e9e.

f.spiral_soaker = Un pistolet d'eau mortel est s\u00fbr de mouiller m\u00eame les ennemis les \
  plus s\u00each\u00e9s.

f.spitfire = Un Proto Gun modifi\u00e9, am\u00e9lior\u00e9 avec un jet de feu de baisse \
  intensit\u00e9.

f.strike_needle = Des plans de modifier le Strike Needle pour usage non-combat a \u00e9t\u00e9 annul\u00e9s apr\u00e8\
  s un recrue a rempli la couchette avec des trous par hasard.

f.storm_driver = La charge latente contenue dans ce pistolet supr\u00e8me est suffisante pour \
  causer du douleur \u00e0 celui qui le manie, et pour causer du douleur extr\u00e8me \u00e0 celui qu'il frappe.

f.stun_gun = Un Proto Gun qui a \u00e9t\u00e9 modifi\u00e9 pour \u00e9tourdir les monstres. Un \
  monstre \u00e9tourdi se d\u00e9place et attaque plus lentement.

f.super_blaster = Ce Blaster suraliment\u00e9 est adapt\u00e9 aux exp\u00e9ditions les plus \
  longues dans les Rouages.

f.super_stun_gun = Un Stun Gun augment\u00e9 dont le coup puissant d\u00e9couragera m\u00eame les plus d\u00e9\
  routants des monstres des Rouages.

f.supernova = Les ravages caus\u00e9s par ce pistolet sans pareil sont tout sauf n\u00e9buleux.  \
  Les tirs du Supernova deviennent plus puissants \u00e0 mesure de leur voyage.

f.toxic_catalyzer = Un Catalyzer modifi\u00e9 pour lancer des projectiles dangereusements \
  radioactifs. Les balles charg\u00e9es du Toxic Catalyzer enveloppent vos ennemis dans un \
  champ d'\u00e9nergie qui s'explose apr\u00e8s avoir \u00e9t\u00e9 endommag\u00e9.

f.toxic_needle = Un Autogun modifi\u00e9 pour lancer des balles per\u00e7antes dos\u00e9s d'un poison m\u00e9chant.

f.tundrus = Un magnus modifi\u00e9 qui vous assure que, si la cible a surv\u00e9cu le premier \
  coup, elle sera encore gel\u00e9e sur place. Un tir charg\u00e9 peut perforer plusieurs \
  ennemis aussi.

f.umbral_blaster = Un blaster d'ombre am\u00e9lior\u00e9, con\u00e7u pour neutraliser les \
  bioformes extraterrestres.

f.umbra_driver = Ce pistolet d'une puissance horrible tire des balles sans coleur, odeur, ou \
  piti\u00e9.

f.valiance = Ce pistolet ultraperformant est le symbole du Spiral Order. Seuls les v\u00e9t\u00e9\
  rans de cet ordre l'arborent fi\u00e8rement. Comme on le dit souvent, point n'est besoin de \
  courage, seulement de vaillance.

f.fiery_pepperbox = Quand on est attaqu\u00e9 par un essaim de Ice Cubes, tous les chevaliers \
  sont d'accord sur le sujet de bonheur: le bonheur est un Fiery Pepperbox.

f.volatile_catalyzer = Enlever la m\u00e9canisme de s\u00e9curit\u00e9 d'une technologie \
  Gremlin, c'est un bon moyen de perdre une jambe. Dans ce cas, ce ne serait pas la v\u00f4tre. Les balles charg\u00e9\
  es du Volatile Catalyzer enveloppent vos ennemis dans un champ d'\u00e9nergie qui s'explose apr\u00e8s avoir \u00e9t\u00e9 endommag\u00e9.

f.virulent_catalyzer = L'incorporation de technologie Spiral a dou\u00e9 ce pistolet poignant \
  d'une charge utile puissament toxique.  Les balles charg\u00e9es du Virulent Catalyzer \
  enveloppent vos ennemis dans un champ d'\u00e9nergie qui s'explose apr\u00e8s avoir \u00e9t\u00e9 endommag\u00e9.

f.volcanic_pepperbox = Quand on camp dans une territoire dangereuse, le Volcanic Pepperbox est \
  parfait pour griller des guimauves et des ennemies.

f.volt_driver = Un pistolet alchimique avanc\u00e9 qui tire des balles voltes puissantes que se \
  fissionnent plusieurs fois sur l'impact.

f.voltech_alchemer = Ce pistolet alchimique tire des balles \u00e0 ions charg\u00e9s qui se fendent \u00e0 l'impact.

f.voltech_alchemer_mkii = Un Alchemer augment\u00e9 qui lance des coups de foudre plus \
  rapidement.

f.wildfire = Un pistolet d'\u00e9lite qui offre des surprises \u00e9tonnants pour l'ennemi sur \
  le champ de bataille car ces petites charges d'\u00e9nergie agrandissent et se r\u00e9pandent comme une tra\u00een\u00e9\
  e de poudre. Les tirs des Wildfires deviennent plus puissants \u00e0 mesure de leur voyage.

f.winter_grave = Un canon \u00e0 la main incontestablement fort avec un nom qui n'\u00e9tonne \
  personne qui fait face au mauvais c\u00f4t\u00e9 du fusil. Un tir charg\u00e9 peut perforer \
  plusieurs ennemis aussi.

f.zapper = Un Proto Gun modifi\u00e9 pour avoir une charge \u00e9lectrique. \u00c7a chatouille!

f.stoic_buster = Un pistolet alchimis\u00e9 avec la carapace d'un tortodrone. En le maniant, \
  vous sentez la brise calme du vent et pouvez invoquer le grondement qui suit.

f.mighty_cannon = Un pistolet alchimis\u00e9 avec la carapace d'un tortodrone. En le maniant, \
  vous pouvez sentir les \u00e9nergies instables dedans, en attente pour se d\u00e9cha\u00eener.

f.grand_tortofist = Un pistolet charg\u00e9 de la fureur illimit\u00e9e d'un tortodrone. En le \
  maniant, vous pouvez sentir l'\u00e9nergie furieuse dedans, en attente pour se d\u00e9cha\u00eener.

f.primal_buster = Un pistolet alchimis\u00e9 avec la carapace d'un tortodrone. En le maniant, \
  vous pouvez sentir les \u00e9nergies naturelles dedans, en attente pour se d\u00e9cha\u00eener.

f.barrier_cannon = Un pistolet alchimis\u00e9 avec la carapace d'un tortodrone. L'attaque \u00e9l\u00e9\
  mentaire d'un tortodrone sur la Longue Migration doit vous aider pendant vos propres exp\u00e9ditions.

f.omega_tortofist = Un pistolet charg\u00e9 de la fureur illimit\u00e9e d'un tortodrone. En le \
  maniant, vous \u00eates capable de d\u00e9cha\u00eener l'\u00e9nergie d'une l\u00e9gion de \
  tortodrones sur vos ennemies.

f.wild_buster = Un pistolet alchimis\u00e9 avec la carapace coriace d'un tortodrone. En le \
  maniant, vous pouvez sentir les \u00e9nergies violentes dedans, en attente pour se d\u00e9cha\u00eener.

f.feral_cannon = Un pistolet alchimis\u00e9 avec la carapace coriace d'un tortodrone. En le \
  maniant, vous pouvez sentir les \u00e9nergies p\u00e9n\u00e9trant dedans, en attente pour se \
  d\u00e9cha\u00eener.

f.savage_tortofist = Un pistolet alchimis\u00e9 avec la carapace coriace d'un tortodrone. En le \
  maniant, vous pouvez sentir les \u00e9nergies primordiales d'une meute de wolvers enrag\u00e9\
  s dedans, en attente pour se d\u00e9cha\u00eener.

f.grim_buster = Un pistolet alchimis\u00e9 avec la carapace d'un tortodrone corrompu. Les \
  ombres paraissent s'infiltrer de canon quand le fusil est d\u00e9gain\u00e9.

f.nether_cannon = Un pistolet alchimis\u00e9 avec la carapace d'un tortodrone corrompu. On peut \
  entendre un hurlement de rage tourment\u00e9 sur le vent quand le fusil est d\u00e9cha\u00een\u00e9 sur vos ennemis.

f.gorgofist = Un pistolet terrifiant qui combine les pouvoirs \u00e9crasantes d'un gorgo et le \
  mythique tortomega. \u00c9touffer les ennemies, c'est si amusant.









# Weapon Sword names
#...................................................................................................

f.acheron = Frappant avec la puissance sauvage de l'enfer, cette arme obscur est dit d'avoir \
  conduit \u00e0 la folie des chevaliers faibles d'esprit.



f.arc_razor = Cette \u00e9p\u00e9e m\u00e9canis\u00e9e d'excellente facture projette des \u00e9clairs d'\u00e9\
  nergie lorsque vous la brandissez.

f.ascended_calibur = Une superbe \u00e9p\u00e9e faite d'un alliage rare de Sun Silver. Les \
  chevaliers suffisamment aguerris pour en poss\u00e9der une s'y attachent au point de lui \
  donner un nom.

f.avenger = Une \u00e9p\u00e9e sacr\u00e9e, cr\u00e9\u00e9e \u00e0 une \u00e9poque oubli\u00e9e \
  pour les chevaliers qui affrontaient des l\u00e9gions de d\u00e9mons.

f.barbarous_thorn_blade = Une lame l\u00e9gendaire qui frappe avec la fureur du Snarbolax lui-m\u00ea\
  me. Ceux qui le manient disent qu'ils ressentent le regard mal\u00e9fique de la b\u00eate \
  dans le dos quand ils ferment leur yeux.

f.beast_basher = Cette puissante pioche a \u00e9t\u00e9 modifi\u00e9e pour meurtrir encore plus \
  efficacement les monstres de la famille des b\u00eates sauvages.

f.big_beast_basher = \u00c0 ce qu'on dit, cette pioche ac\u00e9r\u00e9e pourrait servir \u00e0 traquer les b\u00ea\
  tes sauvages aussi bien que les min\u00e9raux. Elle a imprim\u00e9 sa marque dans les \
  Rouages.

f.blazebrand = Une lame haute technologie qui unit les technologies Spiral et Rouages. Il peut \
  produire une explosion \u00e0 haute temp\u00e9rature qui ne touche pas aux chevaliers.

f.blizzbrand = Une lame haute technologie qui unit les technologies Spiral et Rouages. Il peut \
  produire une explosion \u00e0 basse temp\u00e9rature qui ne touche pas aux chevaliers.

f.boltbrand = Une lame haute-technologie qui fusionne les ing\u00e9nieries Spirales et Rouages. \
  Elle peut produire un d\u00e9chargement \u00e9lectrique que les chevaliers trouvent \
  inoffensif.

f.bolted_blade = Cette Proto Blade am\u00e9lior\u00e9e a \u00e9t\u00e9 renforc\u00e9e \u00e0 \
  l'aide de boulons de bronze r\u00e9cup\u00e9r\u00e9s dans les Rouages.

f.brandish = Cette \u00e9p\u00e9e fiable ne comporte aucun ornement, mais elle n'en est pas \
  moins puissante pour autant.

f.calibur = Une \u00e9p\u00e9e polyvalente fournie aux Spiral Knights qui ont prouv\u00e9 leur valeur au combat.

f.cautery_sword = Cette \u00e9p\u00e9e adapt\u00e9e d'un instrument chirurgical est dot\u00e9e d'une lame chauff\u00e9e, ce qui r\u00e9\
  duit les plaies. Elle s'av\u00e8re redoutable contre les monstres de la famille des blobeux.

f.cold_iron_carver = Cette \u00e9p\u00e9e enchant\u00e9e a \u00e9t\u00e9 forg\u00e9e avec du \
  fer froid. Sa lame est capable de repousser les cr\u00e9atures des t\u00e9n\u00e8bres.

f.cold_iron_vanquisher = Cette puissante et froide \u00e9p\u00e9e de fer a \u00e9t\u00e9 forg\u00e9\
  e dans l'unique but de traquer et d'exterminer des morts-vivants.

f.combuster = Combinant les principes des moteurs du Skylark avec la technologie qui alimente \
  le Blast Furnace a produit cette lame m\u00e9chante, qui peut enflammer m\u00eame les mat\u00e9\
  riaux les plus ignifuges \u00e0 distance.

f.cutter = Cette \u00e9p\u00e9e de bandit arbore toute une rang\u00e9e de dents irr\u00e9guli\u00e8res.

f.daring_rigadoon = Une dague sauvage qui ralentit m\u00eame les adversaires les plus agiles.

f.dark_thorn_blade = Une \u00e9p\u00e9e sauvage dont la force a \u00e9t\u00e9 augment\u00e9e par une offre d'\u00e2mes \u00e0 la b\u00eate \u00e0 l'int\u00e9rieur.

f.deadly_candy_poker = Avoir mal de dents ne sent pas tr\u00e8s mal pour les ennemies quand \
  vous \u00eates arm\u00e9 avec ce cadeau per\u00e7ant.

f.divine_avenger = Cet Avenger am\u00e9lior\u00e9 a \u00e9t\u00e9 forg\u00e9 dans l'acier le \
  plus pur qui soit. Rares sont les ennemis dignes de p\u00e9rir sous les coups d'une lame \
  aussi noble, et plus rares encore les h\u00e9ros dignes de la porter.

f.dread_venom_striker = Cette arme d'assassin fait de profondes blessures qui suintent le \
  vitriol. Un conseil, ne la rangez pas trop pr\u00e8s de vos vivres.

f.fang_of_vog = On raconte que cette \u00e9p\u00e9e a \u00e9t\u00e9 cr\u00e9\u00e9e \u00e0 \
  partir d'un croc de Vog, le monstre de feu.

f.faust = Cette puissante \u00e9p\u00e9e maudite a \u00e9t\u00e9 forg\u00e9e dans les enfers. \
  Il arrive que ses redoutables attaques charg\u00e9es lancent une mal\u00e9diction sur son porteur.

f.fearless_rigadoon = L'ultime perceur paralysant, on ne sait pas si c'est son \u00e9l\u00e9gance ou sa m\u00e9\
  chante morsure qui stupifie les adversaires.

f.fierce_flamberge = Un sabre br\u00fblant qui vise de r\u00f4tir vos ennemis.

f.final_flourish = Le premier armemant de l'escrimeur s\u00e9rieux, il riposte aussi facilement \
  qu'il chiffonne les ennemis.

f.fireburst_brandish = Une \u00e9p\u00e9e Brandish am\u00e9lior\u00e9e infus\u00e9e de l'essence \u00e9l\u00e9mentale du feu.

f.flamberge = Une \u00e9p\u00e9e enflamm\u00e9e qui br\u00fble \u00e0 travers en passant \u00e0 travers.

f.flourish = Un sabre chic parfait pour d\u00e9jouer vos ennemis.

f.furious_flamberge = Les grands escrimeurs taillent leur noms dans le peau de leurs \
  adversaires. Les escrimeurs l\u00e9gendaires l'y br\u00fble.

f.frost_sword = Cette \u00e9p\u00e9e est plus froide que la glace et elle est pr\u00eate \u00e0 tout, m\u00eame \u00e0 \
  sacrifier votre amour, en plus des monstres qui se mettent sur votre chemin.

f.glacius = M\u00e9langeant des th\u00e9ories avanc\u00e9es de cryog\u00e9nie avec la t\u00e9\
  chnologie qui alimente le Cooling Chamber a produit cet armement avanc\u00e9, qui est capable \
  de geler les plus formidables ennemis instantan\u00e9ment.

f.gram = Cette \u00e9p\u00e9e est si lourde qu'elle ralentit son porteur, m\u00eame s'il est \
  leste. Cela dit, imaginez les d\u00e9g\u00e2ts qu'elle peut causer...

f.gran_faust = Cette \u00e9p\u00e9e Faust am\u00e9lior\u00e9e a \u00e9t\u00e9 forg\u00e9e dans \
  le Shadow Steel le plus pur qui soit. Ses attaques charg\u00e9es lancent une mal\u00e9diction \
  sur son porteur, mais les Devilites n'en appr\u00e9cient pas moins ces armes rares, au point \
  de les pr\u00e9f\u00e9rer \u00e0 leurs courtes vacances.

f.grand_flourish = Une lame fantaisiste pour ceux qui pr\u00e9f\u00e8rent r\u00e9gler leurs probl\u00e8\
  mes avec un saut, un petit bond, et un coup.

f.grintovec = Vos ennemis aimeront s\u00fbrement la sensation rafra\u00eechissante d'\u00eatre frapp\u00e9 par un glacier.

f.hatchet = On utilise cette lame lourde pour tailler les lianes et les buissons qui prolif\u00e8\
  rent tout autour du Camp de refuge.

f.heavy_hatchet = Une arme massive con\u00e7ue pour abattre les arbres. Comme on pouvait s'y \
  attendre, elle peut \u00e9galement servir \u00e0 d\u00e9truire les ennemis, les blocs, les \
  gisements de min\u00e9raux et \u00e0 peu pr\u00e8s n'importe quoi d'autre.

f.hot_edge = Cette Proto Sword modifi\u00e9e est capable de g\u00e9n\u00e9rer une chaleur si \
  intense qu'elle carbonise toute mati\u00e8re organique.

f.hunting_blade = Cette lame dentel\u00e9e sert \u00e0 achever le gros gibier. Elle tranche la \
  chair comme si c'\u00e9tait du beurre.

f.iceburst_brandish = Une \u00e9p\u00e9e Brandish am\u00e9lior\u00e9e infus\u00e9e de l'essence \u00e9l\u00e9mentale du glace.

f.ideal_sword = Il n'y a pas \u00e0 dire, cette \u00e9p\u00e9e est parfaite!

f.jalovec = Une \u00e9p\u00e9e frissonnante pour les chevaliers qui pensent que c'est \u00abcool\u00bb \
  d'infliger une avalanche de douleurs sur leurs ennemis.

f.kamarin = Cette \u00e9p\u00e9e traditionnelle \u00e9crase mieux qu'elle ne tranche, mais elle \
  mettra quand m\u00eame l'ennemi en fuite!

f.khorovod = Cette \u00e9p\u00e9e rudimentaire mais de bonne facture permet d'\u00e9tourdir les \
  ennemis sans m\u00e9fiance. Il suffit de la brandir pour avoir envie de danser.

f.leviathan_blade = Un tr\u00e9sor rare du Spiral Order. On raconte que cette \u00e9p\u00e9e \
  mythique fait pleuvoir un tsunami de coups sur ses victimes.

f.nightblade = Une courte trancheuse infus\u00e9e de l'essence de l'Enfer.

f.obsidian_edge = Une \u00e9p\u00e9e sinistre fabriqu\u00e9e gr\u00e2ce aux ob\u00e9lisques \
  obsidiennes trouv\u00e9s dans le domaine d'Apocrea. En tenant cette \u00e9p\u00e9e, vous avez \
  l'impression de sentir coupable d'un crime inconnu.

f.peppermint_repeater = On ne \u00abmenthe\u00bb pas: ce canon \u00e0 main festive est id\u00e9\
  ale pour flinger vos proies avec la joie pour les f\u00eates.

f.proto_blade = Une lame d'utilit\u00e9 compacte et lisse, fournie \u00e0 tous les recrues \
  Spiral Knight.

f.proto_sword = Une petite \u00e9p\u00e9e fournie \u00e0 toutes les recrues au sein des Spiral \
  Knights.

f.red_saber = Un sabre de couleur du soleil ardent qui est donn\u00e9 aux chevaliers qui ont \
  montr\u00e9 le courage exceptionnel dans ses actions dans le pass\u00e9.

f.rigadoon = Un sabre stup\u00e9fiant qui fera tourner la t\u00eate de votre adversaire.

f.robo_wrecker = Un outil comme un clef anglaise, pens\u00e9 d'\u00eatre du design gremlin. M\u00ea\
  me si son origine est myst\u00e9rieuse, son aptitude de d\u00e9truire des m\u00e9caniques est \
  bien document\u00e9.

f.rugged_robo_wrecker = Un robo wrecker am\u00e9lior\u00e9 qui a aid\u00e9 beaucoup des m\u00e9caniques \u00e0 \
  devenir des tas de ferraille fumants.

f.sealed_sword = Une myst\u00e9rieuse \u00e9p\u00e9e au potentiel inexploit\u00e9, qui vibre d'\u00e9nergie pure.

f.searing_edge = Cette \u00e9p\u00e9e l\u00e9g\u00e8re enflamme l'ennemi \u00e0 chaque coup. La \
  technologie qui prot\u00e8ge sa garde des flammes est plus perfectionn\u00e9e que celle de l'\u00e9p\u00e9e elle-m\u00eame.

f.shockburst_brandish = Un Brandish am\u00e9lior\u00e9, infus de l'essence \u00e9l\u00e9mentaire du foudre.

f.shocking_edge = Cette \u00e9p\u00e9e l\u00e9g\u00e8re envoie de douloureuses d\u00e9charges \u00e9lectriques \u00e0 \
  ses victimes. Elle amuse \u00e9norm\u00e9ment les jeunes chevaliers en vacances.

f.silent_nightblade = Fabriqu\u00e9 avec certains des mat\u00e9riaux les plus endiabl\u00e9s \
  sur Cradle, cette lame couleur d'encre peut exploser avec une furie diabolique.

f.slime_slasher = Cette robuste pelle a \u00e9t\u00e9 modifi\u00e9e pour meurtrir encore plus \
  efficacement les monstres visqueux.

f.snarble_barb = Une lame bestiale qui lance des \u00e9pines lubricilleux \u00e0 ceux qui \
  opposeraient sa manieur.

f.spur = Cette \u00e9p\u00e9e m\u00e9canis\u00e9e et \u00e9quip\u00e9e d'un moteur lance des \u00e9clairs d'\u00e9\
  nergie lorsque vous la brandissez.

f.static_edge = Cette Proto Sword modifi\u00e9e est capable de g\u00e9n\u00e9rer une d\u00e9charge \u00e9\
  lectrique de faible intensit\u00e9.

f.striker = Les chevaliers du Spiral Order adeptes de l'approche furtive privil\u00e9gient cette \u00e9p\u00e9e rapide.

f.sudaruska = Une arme robuste pour le chevalier qui veut \u00e9changer son style et son \
  panache contres des montants ridiculeux de traumatisme contondant.

f.super_slime_slasher = Cette pelle est suffisamment aff\u00fbt\u00e9e pour repousser les cr\u00e9\
  atures visqueuses dans les tranch\u00e9es.

f.sweet_dreams = Ne vous trompez pas par le ext\u00e9rieur doux de cette arme. Elle frappe plus \
  fort que vous ne le pensez. L'arme parfaite pour combattre des choses qui vont bosse la nuit.

f.swift_flourish = Un Flourish am\u00e9lior\u00e9 pour les chevaliers qui abattent leurs \
  ennemis avec un certain brio.

f.tempered_calibur = Cette \u00e9p\u00e9e Calibur a \u00e9t\u00e9 reforg\u00e9e et tremp\u00e9e \u00e0 \
  l'aide des techniques les plus pointues par les forgerons du Spiral Order.

f.the_ban_stick = Un pied-de-biche pour frapper avec la rage du cerf.

f.thwack_hammer = Cet outil vivace fait des ravages chez les ennemis m\u00e9caniques.

f.triglav = On ne raconte rien au sujet de cette lame tout-puissante, mais c'est parce que les \
  personnes qui viennent d'\u00eatre \u00e9cras\u00e9s par une montagne n'ont plus de bouche \
  pour parler.

f.troika = Cette \u00e9p\u00e9e traditionnelle manque d'\u00e9nergie interne, mais son poids et \
  sa taille compensent largement cette lacune. Elle permet d'ass\u00e9ner des coups \u00e9\
  crasants, pour peu qu'on parvienne \u00e0 la brandir.

f.twisted_snarble_barb = Un Snarble Barb noueux renforc\u00e9 pour revirer avec un \u00abpat-\u00e0-pan\u00bb satisfaisant.

f.vile_striker = Ce sabre sournois renferme une mesure de poison. N'utilisez pas sa lame dentel\u00e9e pour couper du pain!

f.voltedge = En m\u00e9langeant la technologie des condensateurs Spiral avec des \u00e9chantillons r\u00e9cup\u00e9r\u00e9\
  s dans l'Usine des munitions Ironclaw, on a produit cette lame qui produit une d\u00e9charge \
  de 1.21 gigawatts.

f.wild_hunting_blade = M\u00eame les plus grands Wolvers et les plus redoutables Chromalisks \
  craignent cette lame l\u00e9gendaire.

f.winmillion = Cette \u00e9p\u00e9e richement orn\u00e9e projette des \u00e9clairs d'\u00e9nergie \u00e0 \
  chaque fois que vous portez un coup. Il est arriv\u00e9 que des chevaliers inexp\u00e9riment\u00e9\
  s se blessent en la manipulant pour la premi\u00e8re fois.


f.wrench_wand = Les Gremlins se servent beaucoup de cet outil lourd, qui s'av\u00e8re aussi \
  efficace pour serrer les boulons que pour fendre les cr\u00e2nes.


# Weapon Sword names (special)
#...................................................................................................

f.scissor_blades = Un Leviathan Blade fait sur mesure par Bechamel l'Accessorizer. On les \
  utilise typiquement pour cr\u00e9er des accoutrements chics pour l'armure, or, ils sont dits \
  d'\u00eatre assez forts pour fendre le granit!

f.rocket_hammer_1 = Con\u00e7u par le Warmaster Seerus, cette arme abominable est \u00e9quip\u00e9e avec un engin de fus\u00e9\
  e qui peut lancer le porter en avant avec un smash fort. Cette mod\u00e8le en particulier est \
  une version prototype.

f.rocket_hammer_2 = Con\u00e7u par le Warmaster Seerus, cette arme abominable est \u00e9quip\u00e9e avec un engin de fus\u00e9\
  e qui peut lancer le porter en avant avec un smash fort. Cette mod\u00e8le en particulier est \
  une version plus stable qui explosait des sujets gremlins de tests moins que le prototype.

f.rocket_hammer_3 = Con\u00e7u par le Warmaster Seerus, cette arme abominable est \u00e9quip\u00e9e avec un engin de fus\u00e9\
  e qui peut lancer le porter en avant avec un smash fort. Cette version finale et parfaite est \
  vraiment convenu pour le Grand Arsenal du Warmaster Seerus.

f.honor_blade_1 = Une \u00e9p\u00e9e de c\u00e9r\u00e9monie fourni aux recrues de Spiral \
  Knight. M\u00eame si c'est pour des occasions officiels, cette lame fine aussi acceptable de \
  l'utiliser en combat.

f.honor_blade_2 = Une \u00e9p\u00e9e de c\u00e9r\u00e9monie fourni aux Spiral Knights aguerris. \
  M\u00eame si c'est pour des occasions officiels, cette lame fine aussi acceptable de \
  l'utiliser en combat.

f.honor_blade_3 = Une \u00e9p\u00e9e de c\u00e9r\u00e9monie fourni aux Champions d'Ordre \
  Spiral. M\u00eame si c'est pour des occasions officiels, cette lame fine aussi acceptable de \
  l'utiliser en combat.

f.honor_blade_4 = Une \u00e9p\u00e9e de c\u00e9r\u00e9monie fourni aux Avant-gardes d'Ordre \
  Spiral. M\u00eame si c'est pour des occasions officiels, cette lame fine aussi acceptable de \
  l'utiliser en combat.

f.mighty_great_cleaver = Un Sudaraska fait sur mesure par Biscotti, chef principale d'Alouette. \
  Elle jure qu'on l'utilise seulement pour cuisiner, or, on ne peut s'emp\u00eacher de penser \
  que quelques monstres l'ont rencontr\u00e9 au billot.

