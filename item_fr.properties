# Vanaduke
f.furni_trophy_boss_vanaduke_1 = Un sceau magnifique et bien maintenu, d'origine de royaume \
  perdu d'Almire. Peut-\u00eatre le sceau va \u00e0 un mus\u00e9e.

f.furni_trophy_boss_vanaduke_2 = La masque sinistre port\u00e9e par Vanaduke, Seigneur de la \
  Citadelle Feurieuse. C'est vraiment trop grand pour un chevaler \u00e0 porter.

f.furni_trophy_boss_vanaduke_3 = Un arrangement artistique du masque, armure, et sceptre du \
