# Clockworks tab
#...................................................................................................


m.clockworks_1 = Os Clockworks s\u00e3o a sua porta de entrada para o Core do planeta! Eles est\u00e3o \
  repletos de uma enorme variedade de mundos e povoados por monstros e tesouros al\u00e9m da sua \
  imagina\u00e7\u00e3o. Mas cuidado: quanto mais fundo voc\u00ea for abaixo da superf\u00edcie, mais fortes e mais \
  inteligentes seus oponentes se tornar\u00e3o!

m.clockworks_2 = As profundezas abaixo de Haven podem ser classificadas em tr\u00eas Tiers de desafio \
  crescente. Certifique-se de equipar itens apropriados para cada Tier antes de se aventurar \
  adiante e lembre-se: os maiores tesouros que os Clockworks t\u00eam a oferecer ficam nas profundezas, \
  perto do Core do planeta. Ent\u00e3o v\u00e1 fundo!


m.tier_1_equip = Equipamento Recomendado: 0-1 Estrela
m.tier_1_monster = Os monstros causam dano NORMAL.


m.tier_2_equip = Equipamento Recomendado: 2-3 Estrelas
m.tier_2_monster = Os monstros dividem seu dano entre NORMAL e outro tipo especial de dano \
  (PERFURANTE, ELEMENTAL ou SOMBRA).\n\
  Os monstros usam EFEITOS DE STATUS com mais frequ\u00eancia. Equipe armaduras com resist\u00eancia a \
  FOGO, GELO, CHOQUE ou VENENO!


m.tier_3_equip = Equipamento Recomendado: 4-5 Estrelas
m.tier_3_monster = Os monstros podem usar ataques que causam dano especial puro (PERFURANTE, \
  ELEMENTAL ou SOMBRA). Equipe-se adequadamente!

