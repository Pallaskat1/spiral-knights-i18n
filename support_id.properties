m.option_4_0 = Jika pengaduanmu berkaitan dengan obrolan ofensif, pelecehan oleh pemain, dan \
  sebagainya, sekarang adalah waktu yang tepat untuk mengabaikan {0} agar mereka tidak \
  mengganggumu lagi. Bermain game seharusnya menyenangkan, jangan biarkan pemain lain merusaknya.

m.option_200_0 = Kami telah menerapkan filter obrolan untuk menghapus kata-kata ofensif. Jika kamu \
  menonaktifkan filter obrolan, kamu seharusnya tidak mengajukan pengaduan terhadap pemain karena \
  menggunakan kata-kata ofensif tersebut. Klik di sini untuk mengaktifkan filter obrolan.
m.option_200_1 = Perlu diketahui bahwa sesuatu yang kamu anggap ofensif dan bersifat pribadi \
  belum tentu dianggap ofensif oleh orang lain pada umumnya. Jadi, pertimbangkan dengan cermat \
  apakah semua orang akan menganggap obrolan tersebut ofensif. Jika kamu telah membaca dan \
  memahami semua ini tetapi tetap ingin mengirim pengaduan, klik di sini.

m.option_201_0 = Sebagai gantinya, kamu bisa langsung mengeklik di sini untuk mengabaikan {0} \
  agar kamu tidak perlu mendengarkan mereka lagi.
m.option_201_1 = Jika kamu yakin bahwa tindakan ini termasuk spamming, klik OK untuk mengajukan \
  pengaduan.

m.option_202_0 = Kami memahami bahwa pemain ini mungkin merusak kesenanganmu, tetapi cara terbaik \
  untuk menghadapi pemain yang menjengkelkan seperti ini adalah dengan mengabaikan mereka agar \
  kamu tidak perlu berurusan dengan mereka lagi. Klik di sini untuk mengabaikan {0}.

m.option_203_0 = Kamu harus berusia minimal 13 tahun untuk memainkan game ini. Jika seseorang \
  mengakui dalam obrolan bahwa mereka berusia di bawah 13 tahun, klik di sini untuk mengajukan \
  pengaduan terhadap mereka.\n\n\
  JANGAN gunakan opsi ini jika kamu hanya menduga pemain tersebut masih di bawah umur, karena \
  harus ada bukti dalam obrolan selama beberapa menit terakhir. Jika tidak ada bukti, batalkan \
  pengaduan tersebut. \n\n\
  Gunakan akal sehat. Misalnya, jika mereka mengaku berusia 4 tahun tetapi mengetik dengan sangat \
  lancar, jelas bahwa pengakuan itu tidak benar dan kamu tidak seharusnya mengajukan pengaduan.

m.option_204_0 = Nama yang ofensif tidak dapat diterima. Perlu diketahui bahwa sesuatu yang kamu \
  anggap ofensif belum tentu dianggap ofensif oleh orang lain pada umumnya. Jadi, klik di sini \
  untuk mengajukan pengaduan hanya jika kamu yakin bahwa semua orang akan menganggap nama tersebut \
  ofensif.

m.option_206_0 = Jika tidak diragukan lagi bahwa informasi tersebut merupakan informasi pribadi, \
  klik di sini untuk mengajukan pengaduan.

m.option_207_0 = Jika kamu yakin seseorang sengaja mencoba menipumu, klik di sini untuk mengirim \
  pengaduan. Kamu mungkin ingin memberi tahu pemain tersebut bahwa mereka telah dilaporkan agar \
  pemain lain di sekitarmu juga mengetahuinya dan dapat mengambil tindakan pencegahan.

m.option_208_0 = Jika seorang pemain sedang mencoba mendapatkan nama akun atau kata sandimu, \
  atau sudah berhasil mendapatkannya dan mengakuinya dalam obrolan, klik di sini untuk mengajukan \
  pengaduan.
m.option_208_1 = Jika seorang pemain sudah mengambil alih akunmu, kamu perlu menghubungi kami \
  melalui formulir dukungan untuk memulihkan akunmu.\n\n\
  Perlu diketahui bahwa kami membutuhkan bukti kepemilikan akun, dan satu-satunya cara untuk \
  mendapatkannya adalah dengan mengonfirmasi metode pembayaran akun tersebut.\n\n\
  Klik di sini untuk mulai memulihkan akun berbayarmu yang telah diambil alih.

m.option_210_0 = Kamu hanya boleh menggunakan opsi ini jika tidak ada opsi lain yang sesuai \
  dengan pengaduanmu. Klik di sini untuk kembali dan melihat apakah opsi lain mungkin berguna.
m.option_210_1 = Jika kamu yakin bahwa tidak ada opsi lain yang sesuai dengan pengaduanmu dan \
  pemain tersebut telah melanggar Ketentuan Layanan kami, masukkan penjelasan singkat di sini \
  mengenai pengaduanmu.
m.option_210_2 = Kirim pengaduan.

