m.header_step2-11 = Tidak Tercantum:

m.header_step3 = Mengirim Pengaduan

m.header_step4 = Terima kasih!
m.subheader_step4 = Pengaduanmu telah dikirim. Terima kasih telah membantu kami menjaga game \
  tetap menjadi lingkungan yang menyenangkan.\n\n\
  Kami membaca semua pengaduan yang diajukan, tetapi kami tidak memberi tahu kamu tentang hasil \
  dari setiap pengaduan. Kami mungkin juga tidak dapat langsung meninjau pengaduanmu, tetapi \
  yakinlah bahwa semuanya akan dibaca dan ditangani sesuai dengan kebijakan kami.

m.header_step5 = Terjadi masalah
m.subheader_step5 = Pengaduanmu gagal dikirim: {0}.

m.header_step200 = Obrolan Ofensif
m.subheader_step200 = Obrolan ofensif biasanya berupa kata-kata makian, bahasa seksual, bahasa \
  kekerasan, atau bahasa rasis. Kami mengizinkan penggunaan obrolan ofensif dalam batas tertentu \
  jika hanya dianggap sebagai ejekan ringan yang tidak berbahaya. Namun, jika ditujukan kepada \
  pemain lain dan mulai menyerang secara pribadi, hal itu tidak lagi dapat diterima.

#m.header_step201 = Spamming
m.subheader_step201 = Spamming terjadi ketika seseorang mengulang teks atau mengirim baris panjang \
  berisi karakter acak dengan tujuan utama mengganggu orang lain karena memenuhi layar obrolan \
  sehingga mereka tidak dapat mengobrol secara normal.\n\n\
  Penting untuk mengajukan pengaduan spam hanya jika spamming tersebut sangat parah hingga kamu \
  tidak dapat mengobrol dengan orang lain. Misalnya, beberapa baris yang masing-masing hanya berisi \
  beberapa karakter, meskipun mungkin tidak perlu dilakukan, tidak cukup parah untuk dilaporkan. \
  Selain itu, jika baris-baris yang diulang dikirim dengan jeda yang cukup lama (misalnya 10 detik), \
  hal itu juga tidak akan menghalangi orang lain untuk mengobrol, meskipun mungkin menjengkelkan \
  karena mereka hanya menulis hal yang tidak masuk akal.

m.header_step202 = Menjengkelkan
m.subheader_step202 = Jika pemain yang kamu laporkan hanya bersikap menjengkelkan, hal itu tidak \
  memenuhi syarat untuk dilaporkan.\n\n\
  Perilaku menjengkelkan mencakup memanggilmu dengan sebutan buruk atau mengejekmu.

m.header_step203 = Di Bawah Umur
m.header_step204 = Nama Ofensif
m.header_step205 = Mengajukan Pengaduan terhadap Saya
m.subheader_step205 = Kamu tidak seharusnya mengajukan pengaduan terhadap seseorang hanya karena \
  mereka mengajukan pengaduan terhadapmu.\n\n\
  Game Master akan membaca semua pengaduan. Jika kamu tidak melanggar aturan apa pun dalam \
  pengaduan yang diajukan terhadapmu, kamu tidak perlu khawatir.

m.header_step206 = Informasi Pribadi
m.subheader_step206 = Mengungkapkan informasi pribadi tidak dapat diterima, baik informasi milik \
  sendiri maupun milik pemain lain. Meminta informasi pribadi juga tidak dapat diterima.\n\n\
  Menanyakan usia seseorang, kelas berapa mereka, olahraga apa yang mereka lakukan, dan sebagainya \
  tidak dianggap sebagai informasi pribadi.\n\n\
  Namun, nomor telepon, alamat, atau nama asli termasuk informasi pribadi dan tidak boleh \
  diungkapkan.

m.header_step207 = Penipuan
m.subheader_step207 = Penipuan terjadi ketika seorang pemain mencoba mengelabui kamu agar melakukan \
  sesuatu yang tidak seharusnya kamu lakukan. Contohnya:\n\
  - Mencoba mendapatkan nama akun atau kata sandimu.\n\
  - Mengajakmu bertukar akun.\n\
  - Mengaku sebagai Game Master atau temanmu untuk mencoba mengambil keuntungan darimu.\n\
  Ada banyak cara lain untuk melakukan penipuan.

m.header_step208 = Peretasan
m.subheader_step208 = Peretasan terjadi ketika seseorang mencoba mendapatkan nama akun atau \
  kata sandimu, atau sudah berhasil mendapatkannya.\n\n\
  Sebagian besar masalah peretasan sebenarnya bukanlah peretasan, melainkan tindakan ceroboh \
  dalam membagikan akun atau kata sandi. Kamu tidak boleh membagikan kata sandimu kepada siapa \
  pun dengan alasan apa pun. Game Master juga tidak akan pernah memintanya.

m.header_step209 = Kesalahan Perdagangan
m.subheader_step209 = Terkadang kita melakukan kesalahan saat berdagang dengan pemain lain. \
  Hal ini bisa terjadi pada siapa saja.\n\n\
  Namun, Game Master tidak dapat mengetahui kesepakatan yang dibuat dalam perdagangan tersebut. \
  Seorang pemain bisa mengklaim bahwa kesepakatan yang dibuat tidak sesuai, sementara pemain \
  lainnya bisa mengklaim sebaliknya. Kami tidak bisa begitu saja memihak salah satu pihak tanpa \
  pertimbangan. Karena itu, kami mengandalkan para pemain untuk memeriksa kembali barang yang \
  mereka perdagangkan sebelum mengeklik konfirmasi.\n\n\
  Jadi, jika kamu baru saja melakukan perdagangan yang sebenarnya tidak kamu maksudkan, \
  sayangnya Game Master tidak akan dapat membantumu. Sebaiknya bicaralah dengan pemain tersebut \
  dan lihat apakah mereka bersedia membatalkan perdagangan itu.\n\n\
  Ingat juga, jangan pernah memberikan barang kepada seseorang sebagai "pinjaman" kecuali kamu \
  siap jika pemain tersebut tidak mengembalikannya. Game Master tidak akan dapat memulihkan \
  barang itu untukmu.

m.header_step210 = Tidak Tercantum

