m.option_1_1 = 2. Jika {0} telah bersikap ofensif atau melecehkanmu dan tidak berhenti setelah \
  diminta, klik di sini untuk mengajukan pengaduan.
m.option_1_2 = 3. Jika kamu bermaksud mengirim pesan kepada {0}, klik di sini.

