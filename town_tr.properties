m.haven_desc = Me\u00E7huller'e ev sahipli\u011Fi yapan huzurlu bir kasaba. Bu hurdac\u0131lar, Clockworks'\u00FC  \
  ke\u015Ffederken elde ettikleri hazineler kar\u015F\u0131l\u0131\u011F\u0131nda Spiral \u015E\u00F6valyelere s\u0131\u011F\u0131nak sa\u011Flarlar. \
  Haven ayn\u0131 zamanda kendilerine has ilgin\u00E7 bir hareket etme bi\u00E7imine sahip k\u00FC\u00E7\u00FCk ve \
  tombul "Snipe"lar ile doludur.

m.rescue_camp_desc = Kurtarma Kamp\u0131, Cradle'a yeni d\u00FC\u015Fen Spiral \u015E\u00F6valyeler i\u00E7in bir s\u0131\u011F\u0131nak i\u015Flevi g\u00F6r\u00FCr. \
  Burada acemi erleri Haven'a yapacaklar\u0131 yolculu\u011Fa haz\u0131rlayacak bir e\u011Fitim tesisinin yan\u0131 s\u0131ra, ya\u015Fam\u0131 \
  kolayla\u015Ft\u0131ran birtak\u0131m olanaklar da sunuluyor.
