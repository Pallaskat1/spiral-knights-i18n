#
# Logon response messages

m.no_such_user = Pengguna tidak ditemukan.
m.invalid_password = Kata sandi tidak valid.

m.banned = Akun tersebut telah diblokir. Kamu tidak lagi diizinkan bermain Spiral Knights.\n\
  Akunmu diblokir karena: {0}
m.deadbeat = Silahkan kunjungi https://billing.spiralknights.com/billing untuk \
  menyelesaikan masalah pembayaran yang dibatalkan.
m.temp_banned = Akun ini telah ditangguhkan sementara.
m.machine_tainted = Komputer ini pernah digunakan oleh akun yang diblokir dan \
  tidak dapat digunakan untuk membuat akun baru.
m.no_new_free_account = Kamu tidak dapat membuat akun gratis lagi dari komputer ini.
m.converted_to_steam = Akun ini telah dialihkan ke Steam. Pilih Gunakan Akun Steam untuk \
  masuk.

m.non_public_server = Game saat ini belum dibuka untuk umum.
m.recent_customers_only = Server ini hanya tersedia bagi pelanggan yang telah menghabiskan setidaknya \
  $4.95 untuk Energi dalam tiga bulan terakhir.
m.paying_customers_only = Server ini hanya tersedia bagi pelanggan yang pernah melakukan pembelian.
m.under_maintenance = Game sedang menjalani pemeliharaan. Silahkan \
	periksa kembali nanti.
m.downtime = Para Gremlin telah membuat game tidak dapat diakses. Silahkan coba lagi nanti.

m.redownload = Kamu harus menginstal ulang game.
m.version_mismatch = Klien game-mu perlu diperbarui. Silahkan keluar dan mulai ulang game.
m.version_mismatch_auto = Klien game-mu perlu diperbarui. Pembaruan akan \
  dilakukan secara otomatis sebentar lagi.
m.newer_version = Game sedang dalam proses pembaruan. Silahkan coba \
  lagi dalam beberapa menit.
m.failed_to_secure = Gagal membuat koneksi aman.

m.trying_next_port = Gagal terhubung ke server. \
  Mencoba port alternatif. Harap tunggu...
m.failed_to_connect = Gagal terhubung ke server.
m.network_error = Mungkin terjadi gangguan jaringan sementara atau \
  server belum sepenuhnya beroperasi. Harap tunggu sebentar sebelum \
  mencoba terhubung kembali.
m.server_error = Kesalahan server menyebabkan autentikasi gagal.
m.peer_shutdown = Server tujuan yang kita hubungi sedang dimatikan. Harap tunggu sebentar sebelum \
  mencoba lagi.
m.peer_redirect = Kamu telah masuk ke server lain. Mengalihkan koneksi...

m.tb_title = Pemblokiran Sementara
m.tb_info = Akunmu telah diblokir sementara karena alasan berikut:\n\n\
  {0}\n\n Kamu tidak akan dapat masuk kembali hingga {1}. Pelanggaran lebih lanjut terhadap \
  Ketentuan Layanan dapat mengakibatkan pemblokiran permanen.
m.tb_tos = Ketentuan Layanan
m.tb_quit = Kembali Nanti

m.too_many_attempts = Kamu telah mencoba masuk terlalu banyak kali. Silahkan \
  tunggu beberapa menit sebelum mencoba lagi.
m.session_expired = Sesi kamu telah kedaluwarsa. Silahkan masuk kembali melalui situs web, lalu jalankan ulang \
  game.
m.steam_error = Terjadi masalah saat mengautentikasi dengan Steam. Pastikan klien Steam \
  sedang berjalan dan kamu tidak sedang masuk di perangkat lain.
m.steam_invalid_ticket = Tiket Steam UserID tidak valid. Coba keluar dari akun, tutup Steam sepenuhnya, \
  lalu coba lagi.
