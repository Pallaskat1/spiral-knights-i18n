#m.plated_firefly_sentinel_armor = Plated Firefly Sentinel Armor
#m.plated_grizzly_sentinel_armor = Plated Grizzly Sentinel Armor
#m.plated_snakebite_sentinel_armor = Plated Snakebite Sentinel Armor
