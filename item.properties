	enemies, this helm is in the visage of a demon said to have broken off its own horn to \
	use as a weapon when it faced its end.

#m.grim_mask = Grim Mask
f.dangerous_grim_mask = A helm worn by members of the Recon Rangers. Designed to frighten their \
	enemies, this helm is in the visage of Death itself. Those that wear it have a saying, 'Death \
	always watching, so you might as well put on a good show.'

f.hazardous_grim_mask = A helm worn by members of the Scarlet Scouts. Designed to frighten their \
	enemies, this helm is in the visage of Death itself. Those that wear it have a saying, 'Death \
	is at your heels, so keep facing forward.'

#m.oni_helm = Oni Helm
f.dangerous_oni_helm = A helm worn by members of the Recon Rangers. Designed to frighten their \
	enemies, this helm is in the visage of a fiend who lives in the mountains of a \
	distant land. Said to guard the gate to heaven itself, it only allows those who are \
	worthy to pass.

f.hazardous_oni_helm = A helm worn by members of the Scarlet Scouts. Designed to frighten their \
	enemies, this helm is in the visage of a fiend who lives in the mountains of a \
	distant land. Said to guard the gate to heaven itself, it only allows those who are \
	worthy to pass.

#m.obsidian_hood_of_rituals = Obsidian Hood of Rituals
