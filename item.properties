	knights that specialized in the elimination of high-profile Morai targets. After disbanding, \
	their surviving members were united with other squads by Desna to form the Recon Rangers.

#m.gold_dragon_helm = Gold Dragon Helm
f.gold_dragon_helm = A helm once worn by a member of the 'Gold Dragons,' a squad of fearless \
	knights that specialized in the elimination of high-profile Morai targets. After disbanding, \
	their surviving members were united with other squads by Desna to form the Recon Rangers.

#m.polar_twilight_wolf_hood = Polar Twilight Wolf Hood
f.polar_twilight_wolf_hood = A warm hood, favored by those knights stationed in the polar regions. \
    It is said that the polar twilight is a wonderous sight to behold.

#m.polar_day_wolf_hood = Polar Day Wolf Hood
f.polar_day_wolf_hood = A warm hood, favored by those knights stationed in the polar regions. \
    The thick fur is needed during their never ending day patrols.

#m.polar_night_wolf_hood = Polar Night Wolf Hood
f.polar_night_wolf_hood = A warm hood, favored by those knights stationed in the polar regions. \
    The thick fur is needed during their never ending night patrols.

#m.polar_day_warden_hood = Polar Day Warden Hood
f.polar_day_warden_hood = An insulated hood that will keep a knight warm when facing bitter polar \
winds. The full coverage mask makes it ideal for hours of daytime watch duty.

#m.polar_night_warden_hood = Polar Night Warden Hood
f.polar_night_warden_hood = An insulated hood that will keep a knight warm when facing bitter polar \
winds. The full coverage mask makes it ideal for hours of nighttime watch duty.

#m.polar_twilight_warden_hood = Polar Twilight Warden Hood
f.polar_twilight_warden_hood = An insulated hood that will keep a knight warm when facing bitter polar \
winds. The full coverage mask makes it ideal for scanning the horizon during polar twilight.

#m.serene_pith_helm = Serene Pith Helm
#m.serene_sallet = Serene Sallet
#m.serene_tailed_helm = Serene Tailed Helm

f.serene_helm = An ancient, resilient helmet covered in a soft layer of moss.  Within the cool, \
	stony interior of this helmet you can hear a faint and soothing song formed by the rustle of \
	winds traveling from distant lands.

#m.celestial_nav_helm = Celestial Nav Helm
f.celestial_nav_helm = A special helm built to commemorate Isoran spacefarers of old.  With this \
	equipped, you can see a clear path across the night sky to countless worlds beyond.

#m.galactic_guardian_helm = Galactic Guardian Helm
f.galactic_guardian_helm = A commemorative helm that pays tribute to the countless brave Isoran \
	guardians that have protected spacefaring crews in their adventures across the stars.

#m.stellar_sentinel_helm = Stellar Sentinel Helm
f.stellar_sentinel_helm = This helm was was once worn by Isoran starfarers of eons long passed \
that stood watch over extrasolar operations. With this equipped, you feel like you understand \
the machinations of the universe.

#m.field_cap = Field Cap
#m.plumed_cap = Plumed Cap
#m.stately_cap = Stately Cap
f.shako = A ceremonial cap worn by knights during highly prestigious occasions.

#m.nodeslime_helm = Node Slime Mask
f.nodeslime_helm = A menacing mask of malice made from obliterated ominous ooze.

#m.venom_fiend_mask = Venom Fiend Mask
f.venom_fiend_mask = A mask said to be crafted in the visage of a venomous fiend.  It is infused \
	with a vile essence that is sure to frighten your foes.

#m.arctic_rogue_mask = Arctic Rogue Mask
f.arctic_rogue_mask = A mask said to be crafted by an arctic rogue. The shattered ice will conceal \
your identity during clandestine arctic expeditions.

#m.arctic_acolyte_hood = Arctic Acolyte Hood
f.arctic_acolyte_hood = A hood said to be worn by wandering arctic acolytes. \
	'we saw them heading straight towards the mountains, off into the \
	interior of the vast frozen continent, but why?'

#m.voltaic_radical_mask = Voltaic Radical Mask
f.voltaic_radical_mask = A mask said to be replicated by a sentient mechaknight. \
The internal gyros and shock crest are sure to obscure your identity.

#m.nefarious_hood = Nefarious Hood
f.nefarious_hood = A hood said to be crafted by a nefarious imp. The floating rune \
	is certain to cloak you during clandestine campaigns.

#m.magmatic_fanatic_mask = Magmatic Fanatic Mask
f.magmatic_fanatic_mask = A mask said to have been worn by fanatics that worshiped a magma god. \
	Its fires will light the path to victory.

#m.night_cap_pith = Sleepy Night Cap
f.night_cap_pith = A comfortable cap for knights to wear at night. \
	Sure to give the wearer a restorative night of sleep.

#m.night_cap_sallet = Lucid Night Cap
f.night_cap_sallet = A comfortable cap for knights to wear at night. \
	Sure to give the wearer lucid dreams to face their nightmares.

#m.night_cap_tailed = Dreamer Night Cap
f.night_cap_tailed = A comfortable cap for knights to wear at night. \
	Sure to give the wearer peaceful dreams all night.

#m.night_cap_round = Snooze Night Cap
f.night_cap_round = A comfortable cap for knights to wear at night. \
	Sure to give the wearer a few extra hours of rest.

#m.stranger_cap = Stranger Cap
f.stranger_cap = A hat once worn by one of the enigmatic Strangers.  Local Snipes seem \
	to be drawn to the wearer.

#m.spiraltail_mask = Spiraltail Mask
f.spiraltail_mask = A simple simian mask made to celebrate the new year. Your sly shenanigans \
	are sure to become a spectacle.

#m.firetail_mask = Firetail Mask
f.firetail_mask = A simmering simian mask made to celebrate the new year. The searing silhouette \
	will display your dominant demeanor.

#m.plated_pathfinder_helm = Plated Pathfinder Helm
#m.plated_shade_helm = Plated Shade Helm
#m.plated_sentinel_helm = Plated Warden Helm
f.volcanic_plated_pathfinder_helm = A hardened helm, reinforced with volcanic alloys, \
	made to protect against the toastiest of monsters while exploring the unknown.
f.volcanic_plated_shade_helm = A helm of fire retardant fabric interlaced with dark matter to conceal its \
	wearer while they hide in heated hallways.
f.volcanic_plated_sentinel_helm = A helm reinforced with volcanic plating to defend against \
	a range of elements.

#m.fowl_cowl = Fowl Cowl
f.fowl_cowl = A beaked mask shrouded in a simple hood. \
	Take on the guise of your feathered friends and celebrate the new year.
f.fowl_cowl_vol = A beaked mask shrouded in a scorched hood. \
	Herald in the new year in this elemental gown.

#m.fire_raider_helm = Firestorm Raider Helm
f.fire_raider_helm = A pristine raider helmet, save for a few dings and a thick coat of ash.

#m.shock_raider_helm = Squall Raider Helm
f.shock_raider_helm = A simple helm, shielding the wearer from the elements and enemies alike.

#m.freeze_raider_helm = Winter Raider Helm
f.freeze_raider_helm = A fur lined helmet, sure to keep you warm on a winter raid.

#m.buccaneer_bicorne = Buccaneer Bicorne
f.buccaneer_bicorne = A trusty cap that offers tough protection from sun, wind, storms \
                      and spiteful seagulls.

#m.wolver_mask = Wolver Mask
f.wolver_mask = A simple mask made from wolver pelt.

#m.aerohelm = Aero Helm
f.aerohelm = A light, aerodynamic helmet sure to lift your attitude. It won't let you fly, \
             so you'll just have to wing it.

#m.aero_armor = Aero Armor
f.aero_armor = A sleek-fitting aerodynamic armor made with lightweight gremlin alloys. It will \
               reduce unwanted turbulence during chaotic dogfights.

#m.beach_hat = Floppy Beach Hat
f.beach_hat = A head-mounted personal portable lightweight shade structure.

#m.boater = Boater
f.boater = A stylish skimmer to sport at summer soirees.

#m.snow_hat = Snow Hat
#m.snow_hat_poms = Pompom Snow Hat
f.snow_hat = A comfy winter hat, keeping you warm whether hunting frozen jellies or merely \
            melting marshmallows in your hot chocolate.

#m.bio_helm = Bio Helm
f.bio_helm = An air-tight helm designed by biotechs for collecting field samples or working in \
             toxic greenhouses.
#m.budding_helm = Budding Helm
f.budding_helm = This cracked biotech helm is home to a harmless decorative plant.

#m.owlite_mask_horned = Astute Owlite Mask
#m.owlite_mask_barn = Sagacious Owlite Mask
f.owlite_mask = A mask of an owlite scholar. The Kats of Moorcroft have assured us with \
            confidence that this reconstruction matches their "grotesque and feathered visage".

#m.raider_helm = Raider Helm
f.raider_helm = A pristine raider helmet, save for a few dings.

#m.pig_helm = Battle Boar Helmet
f.pig_helm = A ferocious battle helmet that smells a bit like smokey applewood on the inside.
#m.pig_armor = Battle Boar Suit
f.pig_armor = Hog all the attention in this leather suit. Its durable protection may just save \
              your bacon one day.

#m.shroom_cap = Shroom Cap
f.shroom_cap = It's no small truffle, you'll be cute as a button in this fungi looking cap.
#m.ronin_gasa = Ronin Gasa
f.ronin_gasa = A lost straw cap once belonging to a lordless swordmaster.
#m.angelic_helmet = Angelic Helmet
f.angelic_helmet = A beautiful costume designed exclusively for great heads.

#m.casting_cone = Casting Cone
f.casting_cone = A cap for comfortable casting. Conical, but no laughing matter.

#m.charming_cap = Charming Cap
f.charming_cap = The sort of hat one would wear for charming charming.

#m.hive_helm = Hive Helm
f.hive_helm = Insects know each other by scent, but the eyes are still for glaring at rivals.

#m.hex_visor = Hex Visor
f.hex_visor = It's said a fly could dodge anything with eyes like these. Too bad you're not a fly.

#m.arthro_pod = Arthro Pod
f.arthro_pod = A streamlined helmet fashioned after the tough chitin of a beetle's carapace.

#m.toy_soldier_cap = Toy Soldier Cap
f.toy_soldier_cap = Standard issue for recruits who can march, salute, and occasionally fall off shelves.
#m.toy_soldier_crown = Toy Soldier Crown
f.toy_soldier_crown = A gleaming crown worn by elite Toyland units and those who smell faintly of varnish.
#m.toy_soldier_coat = Toy Soldier Coat
f.toy_soldier_coat = Tailored for duty in the battle for Toyland but also perfect for posing in parades.

#m.harlequin_cowl = Harlequin Doll Cowl
#m.snowqueen_cowl = Snow Queen Cowl
#m.sugarplum_cowl = Sugarplum Cowl
f.harlequin_cowl = You can't clown the wearer of this colorful cowl or you'll find that you're \
                   the punchline.
#m.harlequin_suit = Harlequin Doll Costume
#m.snowqueen_suit = Snow Queen Costume
#m.sugarplum_suit = Sugarplum Costume
f.harlequin_suit = A costume for those who juggle, tumble, or have the gift of mischief.

#m.jelly_fox = Fox Slime Mask
#m.jelly_bat = Bat Slime Mask
#m.jelly_rabbit = Rabbit Slime Mask
#m.jelly_crow = Crow Slime Mask
f.jelly_animal = A magnificent animalistic mask exemplifying ectoplasmic expropriation.

#m.clockblocker = Clock Blocker
f.clockblocker = A mechanical shield with machined wheels, pinions, and gears that mesh \
                 with exacting tolerances, making it a precision timekeeping instrument.
f.anniversary = {0}\n\n{1} Anniversary Edition.
#m.clockworks_armor = Clockworks Armor
f.clockworks_armor = Forged from girders, gears, scrap, and pipes found in the Clockworks. \
                      Walk the catwalk... wearing the catwalk!
#m.decon_rig = Deconstruction Rig
f.decon_rig = An exosuit of structural iron and comfortable conduit crafted from the very bones \
              of Cradle.
#m.ticktocktop = Tick-Tock Headgear
f.ticktocktop = Enough complications to make your head spin.
#m.decon_helm = Deconstruction Helm
f.decon_helm = Hardened and hazard-tolerant headwear.
#m.grate_plate = Grate Plate Helm
f.grate_plate = A protective plate with peephole perforations permitting ventilation of exhalations.

#m.torto_skull = Tortodrone Skull
f.torto_skull = A cavernous, musty helm made from the remains of a Tortodrone- a reminder that \
                sometimes it pays to not stick your neck out.

#m.shrouded_crest = Shrouded Crest
f.shrouded_crest = Blackened, cursed, and hidden from sight. \
                   Thrice-damned herald of an ill-fated soul.

#m.rogue_lite = Rogue Lite Cuirass
f.rogue_lite = Be a guiding light or a glowing spark, \
               charging forward to leave your mark. \
               Universally venerated, procedurally re-generated, \
               you'll never be lost in the dark.
#m.lite_infantry = Lite Infantry Plate
f.lite_infantry = Tread lightly or lavish in the limelight, \
                  those that follow will benefit from hindsight.

#m.lite_shield = Hololite Shield
f.lite_shield = A lightweight knight light that offers holistic protection.

#m.hololite_helm = Hololite Helm
f.hololite_helm = A bascinet favored for its versatility, safety, and ease of modding.
#m.valiant_visor = Valiant Visor
f.valiant_visor = A lightweight visor for scouting and skirmishing, often highly accessorized.

