	Guildmaster and is destroyed once used.


# Weapon Bomb names
#...................................................................................................

#m.ash_agni = Ash of Agni
f.ash_agni = When this bomb has left the battlefield in ashes, then, and only then, will your \
  enemies have permission to die.

#m.big_angry_bomb = Big Angry Bomb
f.big_angry_bomb = An immensely powerful bomb with a terrible attitude.

#m.blast_bomb = Blast Bomb
f.blast_bomb = An all-purpose bomb issued to Spiral Knights who have proven themselves in the field.

#m.cold_snap = Cold Snap
f.cold_snap = A Proto Bomb modified to generate small bursts of frost upon detonation.

#m.crystal_bomb = Crystal Bomb
f.crystal_bomb = A shard bomb formed from a small explosive encased in an alloy \
  of Moonstone and Valestone. Its soothing shade of cerulean has been clinically \
  proven to both calm knights and annihilate the undead.

#m.dark_briar_barrage = Dark Briar Barrage
f.dark_briar_barrage = A mythical object that can explode with the fury of the Snarbolax itself. \
  The unearthly howl it produces is said to be more crippling than its blast.

#m.dark_matter_bomb = Dark Matter Bomb
f.dark_matter_bomb = A shard bomb formed from a small explosive encased in \
  Dark Matter. Since its original discovery, Dark Matter has been put to a variety of \
  uses, from powering Spiral technology, to rearranging Gremlins on a subatomic level.

#m.deadly_charcoaler = Deadly Charcoaler
f.deadly_charcoaler = This gallant grill is guaranteed to char your competition.

#m.deadly_crystal_bomb = Deadly Crystal Bomb
f.deadly_crystal_bomb = A large chunk of Moonstone and Valestone alloy primed \
  with a potent explosive. Studies have shown that this bomb can be used to reduce \
  a zombie's craving for brains by up to 100% by blowing them to pieces.

#m.deadly_dark_matter_bomb = Deadly Dark Matter Bomb
f.deadly_dark_matter_bomb = A large chunk of Dark Matter primed with a potent \
  explosive. This bomb would be in stark violation of the Spiral Order's safety \
  handbook if they hadn't lost the last copy in the crash.

#m.deadly_shard_bomb = Deadly Shard Bomb
f.deadly_shard_bomb = A large chunk of Crimsonite primed with a potent explosive. \
  No more depleted Crimsonite here: this bomb's made with the good stuff! Or the \
  bad stuff, if you happen to be the target.

#m.deadly_splinter_bomb = Deadly Splinter Bomb
f.deadly_splinter_bomb = A large chunk of synthetic mineral primed with a \
  potent explosive. Fact: the easiest way to find the splinter in the haystack is to \
  blow up the haystack.

#m.deconstructor = Deconstructor
f.deconstructor = A bomb specially designed for dismantling machinery, sentient or otherwise.

#m.electron_bomb = Electron Bomb
f.electron_bomb = Adapted from several unconventional Gremlin theories on physics, anyone unlucky \
  enough to be dragged into this bomb's blast is in for a shock.

#m.electron_charge = Electron Charge
f.electron_charge = A small electro-explosive charge with mysterious origins. It is capable of \
  generating a crippling vortex of electricity.

#m.electron_vortex = Electron Vortex
f.electron_vortex = An Electron Bomb modified with a payload of unstable organic essence. Foes \
  caught in its punishing blast radius are cruelly referred to as "thunderstuck".

#m.heavy_deconstructor = Heavy Deconstructor
f.heavy_deconstructor = An upgraded Deconstructor that will wreck robots and crush constructs \
  in a wider area.

#m.fiery_atomizer = Fiery Atomizer
f.fiery_atomizer = A powerful alchemical bomb that creates a dense cloud of highly \
  combustible, searing dust.

#m.fiery_vaporizer = Fiery Vaporizer
f.fiery_vaporizer = An alchemical bomb that creates a cloud of highly combustible mist.

#m.fiery_vaporizer_mkii = Fiery Vaporizer Mk II
f.fiery_vaporizer_mkii = A Fiery Vaporizer modified to disperse combustible material \
  over a wider range.

#m.firecracker = Firecracker
f.firecracker = A Proto Bomb modified to generate small bursts of fire upon detonation.

#m.freezing_atomizer = Freezing Atomizer
f.freezing_atomizer = A powerful alchemical bomb that produces a dense cloud of extremely \
  frigid mist.

#m.freezing_vaporizer = Freezing Vaporizer
f.freezing_vaporizer = An alchemical bomb that produces a cloud of ultra-low temperature \
  mist.

#m.freezing_vaporizer_mkii = Freezing Vaporizer Mk II
f.freezing_vaporizer_mkii = A Freezing Vaporizer modified to disperse ultra low-temperature \
  chemicals over a wider range.

#m.graviton_bomb = Graviton Bomb
f.graviton_bomb = Capable of dragging enemies toward its location before exploding, this \
  bomb utilizes technology that the Spiral Order does not fully understand.

#m.graviton_charge = Graviton Charge
f.graviton_charge = A small explosive charge with mysterious origins. It is capable of \
  generating a vortex of crushing gravity.

#m.graviton_vortex = Graviton Vortex
f.graviton_vortex = A Graviton Bomb fortified with potentially dangerous amounts of \
  shadow steel. Its blast should draw your foes toward it... if it doesn't rip the entire \
  universe in two, that is.

#m.haze_bomb = Haze Bomb
f.haze_bomb = An alchemical bomb that creates a noxious cloud capable of stunning those \
  caught inside.

#m.haze_bomb_mkii = Haze Bomb Mk II
f.haze_bomb_mkii = A Haze Bomb modified to disperse noxious chemicals over a wider range.

#m.haze_burst = Haze Burst
f.haze_burst = A powerful alchemical bomb that produces a dense cloud of intensely \
  disorienting material.

#m.heavy_crystal_bomb = Heavy Crystal Bomb
f.heavy_crystal_bomb = A solid chunk of alloy with an explosive surprise inside. \
  Zombies hate surprises.

#m.heavy_dark_matter_bomb = Heavy Dark Matter Bomb
f.heavy_dark_matter_bomb = A solid chunk of Dark Matter with an explosive \
  surprise inside. Gremlins hate surprises.

#m.heavy_shard_bomb = Heavy Shard Bomb
f.heavy_shard_bomb = A solid chunk of depleted Crimsonite with an explosive \
  surprise inside. Everybody loves surprises!

#m.heavy_splinter_bomb = Heavy Splinter Bomb
f.heavy_splinter_bomb = A solid chunk of synthetic mineral with an explosive \
  surprise inside. Wolvers hate surprises.

#m.humbug_hazer = Humbug Hazer
f.humbug_hazer = This cantankerous contraption is guaranteed to make anyone but the \
	most curmudgeonly humbug sick to their stomach.

#m.ionized_salt_bomb = Ionized Salt Bomb
f.ionized_salt_bomb =  A solid chunk of rock salt with an explosive surprise \
  inside. Jellies hate surprises.

#m.irontech_bomb = Irontech Bomb
f.irontech_bomb = A heavy bomb wrapped in thick iron plates. Though it is slower \
  than most bombs, it packs a powerful punch.

#m.irontech_destroyer = Irontech Destroyer
f.irontech_destroyer = The big brother of the Irontech Bomb, the Destroyer unleashes the \
  full potential of irontech power.

#m.jack_froster = Jack Froster
f.jack_froster = Usher in a winter wonderland with this nose-nipping, nasty surprise that \
	is perfect for giving your foes a bad case of frostbite.

#m.lightning_capacitor = Lightning Capacitor
f.lightning_capacitor = An upgraded Capacitor that can explode with the fury of an electrical \
  storm.

#m.slumber_smogger = Slumber Smogger
f.slumber_smogger = An alchemical bomb that fogs an area with a sleep agent.
#m.slumber_smogger_mkii = Slumber Smogger Mk II
f.slumber_smogger_mkii = A Slumber Smogger modified to disperse sleepy smog over a wider range.
#m.slumber_squall = Slumber Squall
f.slumber_squall = A powerful alchemical bomb that creates a thick fog of sleepy mist.
#m.torpor_tantrum = Torpor Tantrum
f.torpor_tantrum = The ultimate sleep bomb. It's like a bedtime story, only more explodey.

#m.master_blast_bomb = Master Blast Bomb
f.master_blast_bomb = An incredibly powerful explosive typically used in mining, now \
  issued somewhat recklessly for use in combat.

#m.nitronome = Nitronome
f.nitronome = An advanced explosive issued to only the most elite Spiral Knight grenadiers. \
  It's made from a synthetic substance that ticks ominously even when unarmed.

#m.obsidian_crusher = Obsidian Crusher
f.obsidian_crusher = A peculiar bomb made from the obsidian obelisks found within the realm of \
  the Apocrea. Despite it being a bomb, some are drawn to holding it and 'solving' it as if it \
  were some kind of puzzle.

#m.plasma_capacitor = Plasma Capacitor
f.plasma_capacitor = The addition of an advanced Spiral power source gives this bomb a \
  shockingly large blast radius.

#m.proto_bomb = Proto Bomb
f.proto_bomb = A small bomb used by Spiral Knight recruits to learn the art of blowing \
  things up.

#m.radiant_sun_shards = Radiant Sun Shards
f.radiant_sun_shards =  A solid chunk of solar-charged Luminite with an \
  explosive surprise inside. Devilites hate surprises.

#m.rock_salt_bomb = Rock Salt Bomb
f.rock_salt_bomb = A shard bomb formed from a small explosive encased in rock salt. \
  Not recommended for use in the kitchen.

#m.scalding_hot_cocoa = Scalding Hot Cocoa
f.scalding_hot_cocoa = A singeing splash of sweet destruction awaits any foe that goes for \
	this mug before it's had a chance to cool.

#m.scintillating_sun_shards = Scintillating Sun Shards
f.scintillating_sun_shards = A large chunk of solar-charged Luminite primed with a potent explosive. \
  The pyrotechnic show upon detonation is positively stunning.

#m.shard_bomb = Shard Bomb
f.shard_bomb = A shard bomb formed from a small explosive encased in depleted \
  Crimsonite. Depleted or not, this sucker can sling some serious shrapnel.

#m.shivermist_buster = Shivermist Buster
f.shivermist_buster = Originally used to flash freeze perishable supplies, the \
  Shivermist Buster is far more satisfying when used to flash freeze monsters in \
  their tracks.

#m.shocking_salt_bomb = Shocking Salt Bomb
f.shocking_salt_bomb = A large chunk of rock salt primed with a potent explosive. \
  For nutritional purposes, this particular chunk of salt has been enriched with \
  dangerous amounts of electricity. Wait, what?

#m.spike_shower = Spike Shower
f.spike_shower = A powerful device designed to shred opponents with a snarl.

#m.spine_cone = Spine Cone
f.spine_cone = A ferocious device that is positively bursting with briars.

#m.splinter_bomb = Splinter Bomb
f.splinter_bomb = A shard bomb formed from a small explosive encased in a \
  synthetic mineral. Prone to shattering, the otherwise useless material in this \
  bomb is perfect for giving foes a nasty splinter.

#m.stagger_storm = Stagger Storm
f.stagger_storm = Though it was originally developed by the Spiral Order to harmlessly \
  subdue dangerous species, how you deal with foes unfortunate enough to be caught \
  in the storm is entirely up to you.

#m.static_capacitor = Static Capacitor
f.static_capacitor = An explosive device of Gremlin origin designed to produce a deadly \
  field of electricity.

#m.static_flash = Static Flash
f.static_flash = A Proto Bomb modified to generate small bursts of electricity upon detonation.

#m.sun_shards = Sun Shards
f.sun_shards = A shard bomb formed from a small explosive encased in solar-charged Luminite. \
  Whatever you do, don't look directly at it.

#m.super_blast_bomb = Super Blast Bomb
f.super_blast_bomb = An upgraded Blast Bomb that combines an unstable heat source with \
  untested explosive material to make one seriously unsafe package.

#m.super_crystal_bomb = Super Crystal Bomb
f.super_crystal_bomb = A shard bomb stuffed with even more alloy. Apply directly \
  to your foe's head.

#m.super_dark_matter_bomb = Super Dark Matter Bomb
f.super_dark_matter_bomb = A shard bomb stuffed with even more Dark Matter. \
  How much Dark Matter is too much? This much.

#m.super_shard_bomb = Super Shard Bomb
f.super_shard_bomb = A shard bomb stuffed with even more depleted Crimsonite. \
  The choicest cure for a combative creature is clearly a crystal to the cranium.

#m.super_splinter_bomb = Super Splinter Bomb
f.super_splinter_bomb = A shard bomb stuffed with even more synthetic mineral. \
  It can also be used to mince vegetables, if you don't mind picking the \
  occasional crystal out of your teeth.

#m.toxic_atomizer = Toxic Atomizer
f.toxic_atomizer = A powerful alchemical bomb that produces a choking poisonous cloud.

#m.toxic_vaporizer = Toxic Vaporizer
f.toxic_vaporizer = An alchemical bomb that produces a noxious cloud of toxins.

#m.toxic_vaporizer_mkii = Toxic Vaporizer Mk II
f.toxic_vaporizer_mkii = A Toxic Vaporizer modified to disperse noxious agents over a \
  wider range.

#m.twisted_spine_cone = Twisted Spine Cone
f.twisted_spine_cone = An enhanced Spine Cone that will thrash opponents with thorns \
  and bury them in brambles.

#m.venom_veiler = Venom Veiler
f.venom_veiler = The ultimate in toxic dispersal devices, the Venom Veiler can be used \
  to destroy pests on crops. Failing that, it can also be used to destroy crops.

#m.voltaic_tempest = Voltaic Tempest
f.voltaic_tempest = This high-tech, high voltage device is not recommended for use in \
  water, around water, or near people thinking about water. To be safe, you probably \
  shouldn't look at it, either.

#m.virulent_seedling = Virulent Seedling
f.virulent_seedling = This small, dangerous plant has been weaponized by biotechs \
                      so that it spreads a cloud of toxic spores on detonation. \
                      Don't let the size fool you, it packs several kiloaudreys of power.

# Weapon Bomb names (special)
#...................................................................................................

#m.celestial_vortex = Celestial Vortex
f.celestial_vortex = A Celestial Bomb modified with a payload of a dying sun. Foes \
  caught in its fiery blast radius are shown a glimpse of the dawn of creation.

#m.potocrowns = Pot O' Crowns
f.potocrowns = An unlucky thing for your foes to find, it explodes in a painful blow.

#m.powderkeg = Powder Keg
f.powderkeg = Careful, this thing could go off like a metaphorical powder keg.

#m.punkin_cinnamug = Punkin Cinnamug
f.punkin_cinnamug = A frothy blend of punkins and cinnamon that is sure to burn \
	those that don't wait for this mug to cool.

#m.piggy_banker = Piggy Banker
f.piggy_banker = A small volatile bank that is sure to burn a hole in your enemies' pockets.

#m.warmaster_bomb_1 = Dark Reprisal
f.warmaster_bomb_1 = A potent bomb brimming with dark energy that Warmaster Seerus engineered with \
	the sole purpose of eliminating other gremlins that stood in his way.

#m.warmaster_bomb_2 = Dark Reprisal Mk II
f.warmaster_bomb_2 = A refined version of the shadowy bomb that Warmaster Seerus engineered with \
	the sole purpose of eliminating other gremlins that stood in his way.

#m.warmaster_bomb_3 = Dark Retribution
f.warmaster_bomb_3 = The perfected version of the shadowy bomb that Warmaster Seerus engineered \
	with the sole purpose of eliminating other gremlins that stood in his way.  It is \
	thought to have been reserved for use against other members of the Crimson Order.

# Weapon Handgun names
#...................................................................................................

#m.antigua = Antigua
f.antigua = A mysterious relic from a forgotten time. It uses explosive powder to fire its \
  rounds.

#m.arcana = Arcana
f.arcana = An exceptional handgun that fires powerful, elemental shots that many Spiral Knights \
	refer to as 'magic missiles.'

#m.argent_peacemaker = Argent Peacemaker
f.argent_peacemaker = An ancient handgun forged from sun silver. Its bullets serve as ushers \
  for those that refuse to leave this world.

#m.autogun = Autogun
f.autogun = A fully automatic handgun capable of rapidly firing powerful bolts of energy.

#m.biohazard = Biohazard
f.biohazard = Be sure to check your armor's seals thoroughly before engaging in the \
  operation of this weapon, or you may end up as miserable as your foes. Biohazard bullets \
  envelop the enemy in an energy field that explodes after taking damage.

#m.black_chaingun = Black Chaingun
f.black_chaingun = A highly advanced machine gun designed to output hundreds of rounds of \
	shadow bolts in a very short time. Controlling one of these requires skilled hands.

#m.blackhawk = Blackhawk
f.blackhawk = A shadow-aligned handgun of incredible power, it's said to contain the \
  soul of a knight who was only two days from retirement.

#m.blaster = Blaster
f.blaster = A versatile handgun issued to Spiral Knights who have proven themselves in the field.

#m.blazing_pulsar = Blazing Pulsar
f.blazing_pulsar = A highly advanced pulsar capable of launching compact infernos from afar. \
	Pulsar shots become more powerful the further they travel.

#m.blight_needle = Blight Needle
f.blight_needle = It's a proven fact that even the most virulent of toxins is a lot more \
  contagious if it's fired indiscriminately over a large area.

#m.blitz_needle = Blitz Needle
f.blitz_needle = For when suppression just isn't good enough, the Blitz Needle specializes \
  in "oppressive fire".

#m.breach_blaster = Breach Blaster
f.breach_blaster = An enhanced pierce blaster designed to break through hostile armor.

#m.buccaneer_broadsider = Buccaneer Broadsider
f.buccaneer_broadsider = A fearsome firearm fitted with a flintlock. The vintage mechanism's \
                         reliability has been enhanced with a bit of gremlin know-how.

#m.callahan = Callahan
f.callahan = A handgun of incredible power that can leave its target in a daze. \
  It is said to make its targets feel far less lucky.  A charged shot can even pierce through \
  multiple enemies.

#m.catalyzer = Catalyzer
f.catalyzer = An advanced alchemical armament adapted from Gremlin mining and demolition \
  devices. Catalyzer bullets envelop the enemy in an energy field that explodes after taking \
  damage.

#m.cryo_driver = Cryo Driver
f.cryo_driver = A high-tech alchemical sidearm that fires powerful cryo bullets that split \
  multiple times on impact.

#m.cryotech_alchemer = Cryotech Alchemer
f.cryotech_alchemer = An alchemical handgun that fires hyper low temperature bullets that split \
  on impact.

#m.cryotech_alchemer_mkii = Cryotech Alchemer Mk II
f.cryotech_alchemer_mkii = An upgraded Alchemer that fires bolts of extremely low temperature \
  material at an increased rate.

#m.dark_chaingun = Dark Chaingun
f.dark_chaingun = A machine gun capable of firing a barrage of searing, shadow bolts.

#m.elemental_blaster = Elemental Blaster
f.elemental_blaster = An enhanced blaster modified to fire elemental rounds.

#m.firo_driver = Firo Driver
f.firo_driver = A high-tech alchemical sidearm that fires powerful firo bullets that split \
  multiple times on impact.

#m.firotech_alchemer = Firotech Alchemer
f.firotech_alchemer = An alchemical handgun that fires bullets of liquid flames that split on \
  impact.

#m.firotech_alchemer_mkii = Firotech Alchemer Mk II
f.firotech_alchemer_mkii = An upgraded Alchemer that fires bolts of napalm at an increased rate.

#m.flaming_pulsar = Flaming Pulsar
f.flaming_pulsar = A pulsar modified with a scorching energy that burns greater over time. \
	Pulsar shots become more powerful the further they travel.

#m.freezing_pulsar = Freezing Pulsar
f.freezing_pulsar = A pulsar modified with a freezing agent that grows colder over time. \
	Pulsar shots become more powerful the further they travel.

#m.frost_gun = Frost Gun
f.frost_gun = A modified Proto Gun augmented with a low intensity, alchemical freezing agent.

#m.frozen_pulsar = Frozen Pulsar
f.frozen_pulsar = A highly advanced pulsar that can produce a blizzard-like blast of ice once \
	its rounds mature. Pulsar shots become more powerful the further they travel.

#m.fusion_blaster = Fusion Blaster
f.fusion_blaster = An enhanced elemental blaster designed to banish creatures that lurk in the \
	shadows.

#m.gigawatt_pulsar = Gigawatt Pulsar
f.gigawatt_pulsar = A powerfully enhanced handgun that hits foes with the force of a lightning \
  bolt. Pulsar shots become more powerful the further they travel.

#m.gilded_griffin = Gilded Griffin
f.gilded_griffin = A beautiful pistol named after a great, noble beast. Its golden frame was \
	believed to provide light within the impenetrable darkness of the Underworld.

#m.grim_repeater = Grim Repeater
f.grim_repeater = Used only by the most elite of the Spiral Knight rangers, this devilish machine \
	gun earned its name from the incredible speed in which it hands out shadowy tickets to the \
	afterlife.

#m.hail_driver = Hail Driver
f.hail_driver = Once you've seen the splitting bolts of unnaturally cold ice it produces, you'll \
  understand why this Driver is hailed.

#m.heavy_pulsar = Heavy Pulsar
f.heavy_pulsar = A Pulsar upgraded with Spiral technology to pack a greater punch. Pulsar shots \
  become more powerful the further they travel.

#m.industrial_catalyzer = Industrial Catalyzer
f.industrial_catalyzer = A Catalyzer modified to fire dangerously supercharged \
  projectiles. Catalyzer bullets envelop the enemy in an energy field that explodes after \
  taking damage.

#m.iron_slug = Iron Slug
f.iron_slug = Only the most frightening of foes can withstand the crippling paralysis \
  caused by the magnum force of the Iron Slug's sudden impact. A charged shot can even pierce \
  through multiple enemies.

#m.kilowatt_pulsar = Kilowatt Pulsar
f.kilowatt_pulsar = A Pulsar upgraded with Spiral technology to deliver an unpleasant shock \
  on impact. Pulsar shots become more powerful the further they travel.

#m.magma_driver = Magma Driver
f.magma_driver = Spitting gobs of molten death at an alarming rate, this sublime sidearm is not \
  recommended for use around (or on) anyone (or anything) that you happen to care deeply about.

#m.magnus = Magnus
f.magnus = A large handgun with hard hitting rounds that can leave even the strongest of \
  monsters dazed. A charged shot can even pierce through multiple enemies.

#m.master_blaster = Master Blaster
f.master_blaster = This advanced sidearm is an excellent choice if your adventuring \
  party happens to need another hero.

#m.mega_magnus = Mega Magnus
f.mega_magnus = An upgraded Magnus powerful enough to take a monster's head clean \
  off. A charged shot can even pierce through multiple enemies.

#m.mega_tundrus = Mega Tundrus
f.mega_tundrus = An upgraded tundrus that takes no prisoners, except when it does and then \
	the prison is made of ice. A charged shot can even plow through multiple enemies.

#m.needle_shot = Needle Shot
f.needle_shot = An Autogun modified to fire piercing bolts at an alarming rate.

#m.neutralizer = Neutralizer
f.neutralizer = You'd be surprised at the number of practical applications to be had from \
  two substances that, when combined, leave quite literally nothing in their wake. Neutralizer \
  bullets envelop the enemy in an energy field that explodes after taking damage.

#m.nog_blaster = Nog Blaster
f.nog_blaster = One highly volatile chamber full of creamy, high-cholesterol cheer that \
	when fired really packs a punch.

#m.nova_driver = Nova Driver
f.nova_driver = It'll take more than a wish to save you if you're the unfortunate target of \
  this all-powerful pistol with the strength of the stars themselves.

#m.obsidian_carbine = Obsidian Carbine
f.obsidian_carbine = A deadly gun made from the obsidian obelisks found within the realm of the \
  Apocrea. With every shot fired, a faint whisper is heard, believed to be the true name of its \
  target.

#m.overcharged_mixmaster = Overcharged Mixmaster
f.overcharged_mixmaster = An industrial strength handheld mixer that is sure to stir things up.

#m.celestial_orbitgun = Celestial Orbitgun
f.celestial_orbitgun = This planetoid projecting pistol conjures images of the birth of stellar \
  systems. Opponents caught within its blazing maelstrom are sure to see the light.

#m.pepperbox = Pepperbox
f.pepperbox = An Autogun modified to fire high-temperature bullets capable of engulfing foes.

#m.permafroster = Permafroster
f.permafroster = Tech Knights are not yet sure if targets of this deep-freezing handgun ever \
	actually defrost. So far, 'no.' Permafroster shots become more powerful the further they travel.

#m.phantamos = Phantamos
f.phantamos = A powerful handgun brimming with dark energy. The Phantamos represents one of the \
	most recent additions to the Spiral Knight's arsenal, as containing shadow energy of this \
	degree took a great deal of research.

#m.pierce_blaster = Pierce Blaster
f.pierce_blaster = An enhanced blaster modified to fire piercing rounds.

#m.plague_needle = Plague Needle
f.plague_needle = Knights are divided on whether this gun's bolts pierce and then poison, \
  or poison and then pierce. To the unlucky target, this distinction is irrelevant.

#m.polaris = Polaris
f.polaris = It's said that the explosions caused by this stellar sidearm are so bright \
  that you'll always be able to find your way in the darkness. Polaris shots become more \
  powerful the further they travel.

#m.prisma_driver = Prisma Driver
f.prisma_driver = A high-tech alchemical sidearm that fires powerful prisma bullets that split \
  multiple times on impact.

#m.prismatech_alchemer = Prismatech Alchemer
f.prismatech_alchemer = An alchemical handgun that fires bullets of photon-charged liquid that \
  split on impact.

#m.prismatech_alchemer_mkii = Prismatech Alchemer Mk II
f.prismatech_alchemer_mkii = An upgraded Alchemer that fires bolts of photonic liquid at an \
  increased rate.

#m.proto_duelist = Proto Duelist
f.proto_duelist = A six-shot firearm preferred by the marksmen of Spiral Knight recruits.

#m.chilling_duelist = Chilling Duelist
f.chilling_duelist = Start settling disputes at the crack of dawn with this cold, custom \
	handgun.

#m.proto_gun = Proto Gun
f.proto_gun = A compact firearm issued to all Spiral Knight recruits.

#m.pulsar = Pulsar
f.pulsar = A high-tech Gremlin firearm originally designed for use by elite squads of \
  Ironclaw soldiers. Pulsar shots become more powerful the further they travel.

#m.pummel_gun = Pummel Gun
f.pummel_gun = A Punch Gun properly modified for combat use. The recoil from its powerful \
  charge attack is notorious amongst recruits.

#m.punch_gun = Punch Gun
f.punch_gun = Used to blast open damaged drop pods, this emergency rescue tool doubles nicely \
  as a powerful, single shot handgun.

#m.radiant_pulsar = Radiant Pulsar
f.radiant_pulsar = A cutting-edge handgun intended for use only by the Spiral Order's best \
  and brightest. Pulsar shots become more powerful the further they travel.

#m.raptor = Raptor
f.raptor = An ancient pistol imbued with enchantments designed to smite the fiendish \
	creatures of the Underworld. Like its namesake, its bullets fly fast and strike with \
	deadly force.

#m.riftlocker = Riftlocker
f.riftlocker = A deadly handgun said to be capable of sundering heavy armor with a single shot. \
	These firearms proved instrumental during the siege of Isora in breaking through the \
	war machines of the Morai.

#m.sentenza = Sentenza
f.sentenza = An ancient handgun forged from shadow steel. It is said to have been wielded by \
  an evil one who possessed "angel eyes."

#m.shadow_blaster = Shadow Blaster
f.shadow_blaster = An enhanced blaster modified to fire shadow rounds.

#m.shadow_driver = Shadow Driver
f.shadow_driver = A high-tech alchemical sidearm that fires powerful shadow bullets that \
  split multiple times on impact.

#m.shadowtech_alchemer = Shadowtech Alchemer
f.shadowtech_alchemer = An alchemical handgun that fires bullets of concentrated shadow \
  that split on impact.

#m.shadowtech_alchemer_mkii = Shadowtech Alchemer Mk II
f.shadowtech_alchemer_mkii = An upgraded Alchemer that fires bolts of shadow at an increased \
  rate.

#m.silversix = Silversix
f.silversix = A mysterious antique with a brilliant silver finish, these handguns are said to \
  have been wielded by "gunslinger priests" during a now forgotten time.

#m.spiral_soaker = Spiral Soaker
f.spiral_soaker = A deadly squirt gun sure to soak even the driest of foes.

#m.spitfire = Spitfire
f.spitfire = A modified Proto Gun augmented with a low intensity burst of flame.

#m.strike_needle = Strike Needle
f.strike_needle = Plans to modify the Strike Needle for non-combat usage were shelved after \
  a recruit accidentally riddled Lieutenant Feron's bunk with holes.

#m.storm_driver = Storm Driver
f.storm_driver = The latent charge running through this supreme sidearm is strong enough to \
  cause discomfort to anyone wielding it, and extreme discomfort to anyone shot by it.

#m.stun_gun = Stun Gun
f.stun_gun = A Proto Gun modified to stun monsters. Stunned monsters move and attack slower \
  than normal.

#m.super_blaster = Super Blaster
f.super_blaster = A supercharged Blaster well-suited to longer expeditions down into the Clockworks.

#m.super_stun_gun = Super Stun Gun
f.super_stun_gun = An upgraded Stun Gun whose powerful blast will discourage even the most \
  disconcerting of Clockworks monsters.

#m.supernova = Supernova
f.supernova = The destruction left in the wake of this peerless pistol is anything but \
  nebulous. Supernova shots become more powerful the further they travel.

#m.toxic_catalyzer = Toxic Catalyzer
f.toxic_catalyzer = A Catalyzer modified to fire dangerously radioactive projectiles. \
  Catalyzer bullets envelop the enemy in an energy field that explodes after taking damage.

#m.toxic_needle = Toxic Needle
f.toxic_needle = An Autogun modified to fire piercing bolts dosed with a wicked poison.

#m.tundrus = Tundrus
f.tundrus = A modified magnus that ensures that if somehow your target survived the first \
	shot, they will still be frozen in their tracks. A charged shot can even plow through \
	multiple enemies.

#m.umbral_blaster = Umbral Blaster
f.umbral_blaster = An enhanced shadow blaster designed to neutralize alien bioforms.

#m.umbra_driver = Umbra Driver
f.umbra_driver = This horrifyingly powerful handgun fires bullets that are completely devoid \
  of color, odor and mercy.

#m.valiance = Valiance
f.valiance = This high-performance handgun is a symbol of the Spiral Order, and is proudly worn \
  by veteran members. As it is often said, a knight need not have courage: just Valiance.

#m.fiery_pepperbox = Fiery Pepperbox
f.fiery_pepperbox = When you've been attacked by a swarm of Ice Cubes, all Knights agree: \
  happiness is a Fiery Pepperbox.

#m.volatile_catalyzer = Volatile Catalyzer
f.volatile_catalyzer = Removing the safety overrides from a piece of Gremlin technology \
  is a good way to lose a limb. In this case, it probably won't be one of yours. Catalyzer \
  bullets envelop the enemy in an energy field that explodes after taking damage.

#m.virulent_catalyzer = Virulent Catalyzer
f.virulent_catalyzer = The incorporation of Spiral technology has given this harrowing \
  handgun a powerfully poisonous payload. Catalyzer bullets envelop the enemy in an energy \
  field that explodes after taking damage.

#m.volcanic_pepperbox = Volcanic Pepperbox
f.volcanic_pepperbox = When encamped in dangerous territory, the Volcanic Pepperbox is perfect \
  for roasting both marshmallows and enemies.

#m.volt_driver = Volt Driver
f.volt_driver = A high-tech alchemical sidearm that fires powerful volt bullets that split \
  multiple times on impact.

#m.voltech_alchemer = Voltech Alchemer
f.voltech_alchemer = An alchemical handgun that fires highly charged ionic bullets that split on \
  impact.

#m.voltech_alchemer_mkii = Voltech Alchemer Mk II
f.voltech_alchemer_mkii = An upgraded Alchemer that fires bolts of electricity at an increased \
  rate.

#m.wildfire = Wildfire
f.wildfire = An elite handgun that can offer a tremendous surprise for the enemy on the \
	battlefield as its small charges of energy transform into raging wildfires. Wildfire shots \
	become more powerful the further they travel.

#m.winter_grave = Winter Grave
f.winter_grave = A tremendously powerful hand cannon whose moniker should come as no \
	surprise to anyone who happens to be viewing it from the wrong end. A charged shot can \
	even plow through multiple enemies.

#m.zapper = Zapper
f.zapper = A modified Proto Gun augmented with a low intensity electrical charge.

#m.stoic_buster = Stoic Buster
f.stoic_buster = A handgun alchemized from the shell of a tortodrone. While wielding it, you \
	sense the quiet passing of the wind and can call upon the rumbling storm that follows.

#m.mighty_cannon = Mighty Cannon
f.mighty_cannon = A handgun alchemized from the shell of a tortodrone. While wielding it, you \
	can feel the unstable energies within just waiting to be unleashed.

#m.grand_tortofist = Grand Tortofist
f.grand_tortofist = A handgun empowered by the limitless fury of a tortodrone. While wielding it \
	you can feel the berserk energy within eager to be unleashed.

#m.primal_buster = Primal Buster
f.primal_buster = A handgun alchemized from the shell of a tortodrone. While wielding it \
	you can sense the natural energy within waiting to be unleashed.

#m.barrier_cannon = Barrier Cannon
f.barrier_cannon = A handgun alchemized from the shell of a tortodrone. The elemental offense \
	of a tortodrone on the Long Migration should aid you on your own expeditions.

#m.omega_tortofist = Omega Tortofist
f.omega_tortofist = A handgun empowered by the limitless fury of a tortodrone. While wielding it \
	you are capable of unleashing the energy of a legion of tortodrones upon your foes.

#m.wild_buster = Wild Buster
f.wild_buster = A handgun alchemized from a hardened tortodrone shell. While wielding it, you \
	can feel the fierce energies within just waiting to be unleashed.

#m.feral_cannon = Feral Cannon
f.feral_cannon = A handgun alchemized from a hardened tortodrone shell. While wielding it, you \
	can feel the penetrating energies within just waiting to be unleashed.

#m.savage_tortofist = Savage Tortofist
f.savage_tortofist = A handgun alchemized from a hardened tortodrone shell. While wielding it \
	you can feel the primal energy of a rampaging wolver pack within waiting to be unleashed.

#m.grim_buster = Grim Buster
f.grim_buster = A handgun alchemized from the shell of a corrupted tortodrone. Shadows seem to \
	seep from the barrel whenever it is brought to bear.

#m.nether_cannon = Nether Cannon
f.nether_cannon = A handgun alchemized from the shell of a corrupted tortodrone. A tormented howl \
	of rage can be heard on the wind when it is unleashed upon your foes.

#m.gorgofist = Gorgofist
f.gorgofist = A terrifying handgun that combines the dual-crushing power of a gorgo and the \
	mythical tortomega. Suppressing enemies has never been more fiendishly fun.

#m.pollinator = Pollinator
f.pollinator = A rare, advanced handgun produced by biotechs with captured Gremlin technology. \
               It fires pollen particles that cling to the enemy, causing explosive damage \
               and also the sniffles.

#m.owlite_wand = Owlite Wand
f.owlite_wand = They say the wand chooses the wizard, so don't let this one see your cute friend.

#m.fiery_diskgun = Fiery Diskgun
f.fiery_diskgun = A handgun powered by an infernal engine that launches molten disks in rapid \
                  succession. Diskgun shots return once reaching their apogee.

#m.static_diskgun = Static Diskgun
f.static_diskgun = A shockingly powerful handgun that creates a storm of electrified disks. \
                   Diskgun shots return once reaching their apogee.

#m.wanderers_wand = Wanderer's Wand
f.wanderers_wand = Wonderful for waving.

#m.slicer = Slicer
f.slicer = Energy spikes go in. Flying razor disks of barely-understood primordial \
  energy come hurtling out!  And look out for that extra-peppy boomerang effect...

#m.twicer_slicer = Twicer Slicer
f.twicer_slicer = Slicer prototype Mk II.  They say a little bit of knowledge is a dangerous thing, \
  so that's exactly how much knowledge we have about the mysterious spikes we're slicing up and \
  launching out here.

#m.thricer_slicer = Thricer Slicer
f.thricer_slicer = At some point the eggheads will figure out what these mysterious energy spikes are. \
  But in the meantime, now we can slice and sling them at double the rate, with extra mysterious orbital spins!

#m.mandolin = Mandolin
f.mandolin = A spike-shredding, high-capacity, overclocked double disk launcher.  Experimental spike \
  energy seems drawn to orbit itself... and drawn back toward the launcher with extra potency!

# Weapon Sword names
#...................................................................................................

#m.acheron = Acheron
f.acheron = Striking with the savage power of the Underworld, this dark weapon has been \
  known to drive weak-minded knights to the brink of madness.

#m.advanced_cautery_sword = Advanced Cautery Sword
f.advanced_cautery_sword = A Cautery Sword with an additional saw function adapted to cutting \
  through the bony spines of larger Lichen Colonies.

#m.amputator = Amputator
f.amputator = The culmination of slime family research, the heated reciprocating blades cut \
  through all slimes with surgical precision and prevent their gelatinous bodies \
  from reforming.

#m.arc_razor = Arc Razor
f.arc_razor = A finely-crafted mechanical sword that flings sharp bolts of energy outward \
  when swung.

#m.ascended_calibur = Ascended Calibur
f.ascended_calibur = Made of a rare alloy of sun silver, knights talented enough to possess \
  Caliburs as fine as this one typically bond with and name their blades.

#m.avenger = Avenger
f.avenger = A holy sword created in another time to arm knights who fought against the legions \
 of the Underworld.

#m.barbarous_thorn_blade = Barbarous Thorn Blade
f.barbarous_thorn_blade = A mythical blade that lashes out with the fury of the Snarbolax \
  itself. Those who wield it claim to feel the fiery stare of the beast upon them whenever \
  they close their eyes.

#m.beast_basher = Beast Basher
f.beast_basher = A powerful pick modified to add an extra helping of hurt to beast family \
  monsters.

#m.big_beast_basher = Big Beast Basher
f.big_beast_basher = It was suggested that this brutally sharp mining pick could probably be \
  used to hunt both beasts AND minerals. The Clockworks were never the same.

#m.blazebrand = Blazebrand
f.blazebrand = A high-tech blade that fuses Spiral and Clockwork technology. It can produce \
  a concentrated high-temperature explosion that is harmless to knights.

#m.blizzbrand = Blizzbrand
f.blizzbrand = A high-tech blade that fuses Spiral and Clockwork technology. It can produce \
  a concentrated low-temperature explosion that is harmless to knights.

#m.boltbrand = Boltbrand
f.boltbrand = A high-tech blade that fuses Spiral and Clockwork technology. It can produce \
  a powerful electrical discharge that is harmless to knights.

#m.bolted_blade = Bolted Blade
f.bolted_blade = An upgraded Proto Sword reinforced with bronze bolts scavenged from the Clockworks.

#m.brandish = Brandish
f.brandish = A reliable blade whose lack of ornamentation belies its strength.

#m.calibur = Calibur
f.calibur = A standard issue sword awarded to Spiral Knights who have proven themselves in the \
field.

#m.cautery_sword = Cautery Sword
f.cautery_sword = A sword adapted from a medical tool, its heated blade reduces tissue \
  damage. It is very formidable at destroying monsters of the slime family.

#m.cold_iron_carver = Cold Iron Carver
f.cold_iron_carver = An enchanted sword crafted from cold iron whose blade wards off the \
  creatures of the dark.

#m.cold_iron_vanquisher = Cold Iron Vanquisher
f.cold_iron_vanquisher = A powerful cold iron blade forged for the singular purpose of \
  hunting down and destroying the undead.

#m.combuster = Combuster
f.combuster = Combining the principles of the Skylark's engines with the technology \
  powering the Blast Furnace produced this brutal blade, which can ignite even the most \
  flame-retardant materials at a distance.

#m.cutter = Cutter
f.cutter = A bandit's sword with a vicious row of jagged teeth.

#m.daring_rigadoon = Daring Rigadoon
f.daring_rigadoon = A savage skewer that will slow even the most salubrious of foes to \
  a crawl.

#m.dark_thorn_blade = Dark Thorn Blade
f.dark_thorn_blade = A savage sword whose strength has been fortified by an offering \
  of souls to the beast within.

#m.deadly_candy_poker = Deadly Candy Poker
f.deadly_candy_poker = A toothache will be the least of their worries when you're armed with \
	this perforating present.

#m.divine_avenger = Divine Avenger
f.divine_avenger = An upgraded Avenger forged from the purest sun steel. There are few foes \
  remaining in this world that are worthy enough to be defeated by such a fine blade, \
  and there are still fewer heroes worthy of wielding it.

#m.dread_venom_striker = Dread Venom Striker
f.dread_venom_striker = An assassin's armament whose edge causes deep wounds that seep \
  with vitriol. You should probably store it separately from your snacks.

#m.fang_of_vog = Fang of Vog
f.fang_of_vog = A sword said to be created from the fang of the fire beast, Vog.

#m.faust = Faust
f.faust = A powerful, cursed sword forged in the Underworld. Its powerful charge attacks can \
  sometimes curse the one that wields it.

#m.fearless_rigadoon = Fearless Rigadoon
f.fearless_rigadoon = The ultimate in paralyzing piercers, it's unclear whether its \
  elegance or its wicked bite is what leaves opponents stupefied.

#m.fierce_flamberge = Fierce Flamberge
f.fierce_flamberge = A scorching saber whose main thrust is to rotisserie your foes.

#m.final_flourish = Final Flourish
f.final_flourish = The premier armament of the serious fencer, it can riposte just as \
  easily as it can rip up foes.

#m.fireburst_brandish = Fireburst Brandish
f.fireburst_brandish = An upgraded Brandish infused with the elemental essence of fire.

#m.flamberge = Flamberge
f.flamberge = A fiery foil that burns through as it runs through.

#m.flourish = Flourish
f.flourish = A stylish saber well-appointed to foiling your enemies.

#m.furious_flamberge = Furious Flamberge
f.furious_flamberge = Great fencers can carve their name into their opponents. Legendary ones \
  brand it there.

#m.frost_sword = Frost Sword
f.frost_sword = This sword is as cold as ice, and it's willing to sacrifice your love, \
  in addition to any monsters that happen to get in your way.

#m.glacius = Glacius
f.glacius = Mixing some advanced theories on cryogenics with the technology powering the Cooling \
  Chamber produced this advanced armament, which is capable of flash-freezing the most \
  formidable of foes.

#m.gram = Gram
f.gram = An extraordinarily heavy sword whose weight will slow down even the swiftest of knights. \
  That said, just imagine what it'll do to anything you hit with it...

#m.gran_faust = Gran Faust
f.gran_faust = An upgraded Faust forged from pristine-quality shadow steel. Its charge attacks are \
  powerful enough to curse its wielder, but that hasn't stopped Devilites from \
  treasuring these rare blades even more highly than their meager vacation time.

#m.grand_flourish = Grand Flourish
f.grand_flourish = A fanciful blade for those who prefer to solve their problems with a \
  hop, a skip and a stab.

#m.grintovec = Grintovec
f.grintovec = Your enemies will surely enjoy the cool, refreshing sensation of being hit by \
  a glacier.

#m.hatchet = Hatchet
f.hatchet = A heavy blade used to chop vines and foliage in the wilderness surrounding the \
  Rescue Camp.

#m.heavy_hatchet = Heavy Hatchet
f.heavy_hatchet = A big blade intended to fell trees. Unsurprisingly, you can also use it to fell \
  enemies, blocks, mineral deposits and most anything else you'd care to hit with it.

#m.hot_edge = Hot Edge
f.hot_edge = A modified Proto Sword capable of generating temperatures high enough to burn \
  organic material.

#m.hunting_blade = Hunting Blade
f.hunting_blade = A jagged edge used for finishing off big game. It cuts through beasts \
  like butter.

#m.iceburst_brandish = Iceburst Brandish
f.iceburst_brandish = An upgraded Brandish infused with the elemental essence of ice.

#m.ideal_sword = Ideal Sword
f.ideal_sword = Man, this sword is ideal!

#m.jalovec = Jalovec
f.jalovec = A shivery sword for knights who think it'd be cool to inflict an avalanche of \
  pain upon their foes.

#m.kamarin = Kamarin
f.kamarin = A low-tech sword that's less effective at cutting than it is at crushing your enemies \
  and seeing them driven before you.

#m.khorovod = Khorovod
f.khorovod = A low-tech, but nonetheless well-made sword whose brutal strikes can stun \
  unsuspecting enemies. Wielding it makes you feel like dancing.

#m.leviathan_blade = Leviathan Blade
f.leviathan_blade = A rare treasure of the Spiral Order, the blows from this mythical sword are \
  said to rain down upon its victims like the water from a tidal wave.

#m.nightblade = Nightblade
f.nightblade = A short slicer infused with the essence of the Underworld.

#m.obsidian_edge = Obsidian Edge
f.obsidian_edge = A sinister sword made from the obsidian obelisks found within the realm of the \
  Apocrea. Simply holding it makes you somehow feel guilty of an unknown crime.

#m.peppermint_repeater = Peppermint Repeater
f.peppermint_repeater = This holiday hand cannon is the proper piece to pepper your opponents with \
  hot lead of holiday cheer.

#m.proto_blade = Proto Blade
f.proto_blade = A swift, compact utility blade issued to all Spiral Knight recruits.

#m.proto_sword = Proto Sword
f.proto_sword = A small sword issued to all Spiral Knight recruits.

#m.red_saber = Red Saber
f.red_saber = A saber the color of the burning sun that is given to knights who have shown \
	exemplary bravery in past actions.

#m.rigadoon = Rigadoon
f.rigadoon = A stunning saber that will leave your opponent quite off their guard.

#m.robo_wrecker = Robo Wrecker
f.robo_wrecker = A wrench-like tool thought to be of gremlin design.  Though its origin \
	 is mysterious, its abilty to destroy constructs is well-documented.

#m.rugged_robo_wrecker = Rugged Robo Wrecker
f.rugged_robo_wrecker = An upgraded robo wrecker that has assisted a great many constructs \
	in becoming smoldering, scrap metal heaps.

#m.sealed_sword = Sealed Sword
f.sealed_sword = A mysterious sword of great untapped potential. It hums with raw power.

#m.searing_edge = Searing Edge
f.searing_edge = A light blade that sets foes ablaze as it slashes. The technology that \
  keeps the hilt from catching fire is more advanced than the sword itself.

#m.shockburst_brandish = Shockburst Brandish
f.shockburst_brandish = An upgraded Brandish infused with the elemental essence of lightning.

#m.shocking_edge = Shocking Edge
f.shocking_edge = A light blade that can deliver a painful shock to its victims. Youthful knights \
  enjoy waving these around on holidays.

#m.silent_nightblade = Silent Nightblade
f.silent_nightblade = Crafted with some of the most devilish materials found on Cradle, this \
  inky blade can explode with fiendish fury.

#m.slime_slasher = Slime Slasher
f.slime_slasher = A sturdy shovel modified to dole out a little extra damage to slime family \
  monsters.

#m.snarble_barb = Snarble Barb
f.snarble_barb = A bestial blade that can shoot slithy spines at those who would oppose its \
  wielder.

#m.spur = Spur
f.spur = A mechanized sword with a built in motor that generates energy bursts when used.

#m.static_edge = Static Edge
f.static_edge = A modified Proto Sword capable of generating a low-intensity electrical \
  charge.

#m.striker = Striker
f.striker = A fast sword favored by members of the stealthier branches of the Spiral Order.

#m.sudaruska = Sudaruska
f.sudaruska = A rugged weapon for the knight who is more than willing to trade style and \
  panache for ridiculous amounts of blunt force trauma.

#m.super_slime_slasher = Super Slime Slasher
f.super_slime_slasher = A shovel with a wicked edge that's especially well-suited to fighting \
  slimes in the trenches.

#m.sweet_dreams = Sweet Dreams
f.sweet_dreams = Don't be fooled by this weapon's fluffy exterior. It hits much harder than it looks. \
  The perfect weapon for fighting things that go bump in the night.

#m.swift_flourish = Swift Flourish
f.swift_flourish = An upgraded Flourish for knights who make a point of dispatching opponents \
  with a bit of flair.

#m.tempered_calibur = Tempered Calibur
f.tempered_calibur = A Calibur reforged and tempered by the most advanced techniques available \
  to weaponsmiths of the Spiral Order.

#m.the_ban_stick = The Ban Stick
f.the_ban_stick = Smite thee with crowbar fury.

#m.thwack_hammer = Thwack Hammer
f.thwack_hammer = A spirited spanner specially suited to scrapping mechanical enemies.

#m.triglav = Triglav
f.triglav = No stories have been told about this almighty blade, but that's only because \
  people are rarely in the mood to talk after having been crushed by a mountain.

#m.troika = Troika
f.troika = A low-tech sword that makes up for its lack of high internal power with sheer weight \
  and size. It is capable of delivering crushing blows for those that can handle it.

#m.twisted_snarble_barb = Twisted Snarble Barb
f.twisted_snarble_barb = A gnarled Snarble Barb enhanced to swing with a satisfying \
  "snicker-snack".

#m.vile_striker = Vile Striker
f.vile_striker = A sneaky saber that stores a payload of poison. Its serrated edge \
  is not meant for cutting bread!

#m.voltedge = Voltedge
f.voltedge = Combining Spiral capacitor technology with samples recovered from the Ironclaw \
  Munitions Factory produced this blade, which can output a particularly hazardous 1.21 \
  gigawatt discharge.

#m.wild_hunting_blade = Wild Hunting Blade
f.wild_hunting_blade = A legendary cutter feared by even the mightiest of Wolvers \
  and Chromalisks.

#m.winmillion = Winmillion
f.winmillion = An ornate blade that propels bolts of energy outward with every swing. \
  Inexperienced users have been known to cut themselves when first practicing with it.

#m.turbillion = Turbillion
f.turbillion = An ostentatious mechanized blade whose turbine crackles with the power of \
               a thousand storms.

#m.wrench_wand = Wrench Wand
f.wrench_wand = A heavy hand tool favored by Gremlins. It's good for both tightening \
  bolts and cracking skulls.

# Weapon Changes 2 names
#m.amputator2 = Amputator Test
#m.leviathan_blade2 = Leviathan Blade Test
#m.cold_iron_vanquisher2 = Cold Iron Vanquisher Test
#m.turbillion2 = Turbillion Test

# Weapon Sword names (special)
#...................................................................................................

#m.scissor_blades = Scissor Blades
f.scissor_blades = A custom made Leviathan Blade designed by Bechamel, the Accessorizor.  While \
	these blades are typically used for crafting stylish accoutrements for armor, they are said to \
	be powerful enough to cleave through solid rock.

#m.rocket_hammer_1 = Prototype Rocket Hammer
f.rocket_hammer_1 =	Designed by Warmaster Seerus himself, this nefarious gremlin weapon is equipped \
	with a rocket engine that can launch the wielder forward with a powerful hammer smash.  This \
	particular model is a prototype version.

#m.rocket_hammer_2 = Stable Rocket Hammer
f.rocket_hammer_2 =	Designed by Warmaster Seerus himself, this nefarious gremlin weapon is equipped \
	with a rocket engine that can launch the wielder forward with a powerful hammer smash.  This \
	particular model is a more stable version that blew up gremlin test subjects far fewer times \
	than the prototype.

#m.rocket_hammer_3 = Warmaster Rocket Hammer
f.rocket_hammer_3 =	Designed by Warmaster Seerus himself, this nefarious gremlin weapon is equipped \
	with a rocket engine that can launch the wielder forward with a powerful hammer smash.  This \
	final, perfected design is truly befitting the Grand Arsenal of the great Warmaster Seerus.

#m.honor_blade_1 = Honor Blade
f.honor_blade_1 = A ceremonial sword issued to Spiral Knight recruits. Though intended for formal \
  occasions, its fine edge makes it suitable for combat use.

#m.honor_blade_2 = Tempered Honor Blade
f.honor_blade_2 = A ceremonial sword issued to seasoned Spiral Knights. Though intended for formal \
  occasions, its fine edge makes it suitable for combat use.

#m.honor_blade_3 = Ascended Honor Blade
f.honor_blade_3 = A ceremonial sword issued to Champions of the Spiral Order. Though intended for formal \
  occasions, its fine edge makes it suitable for combat use.

#m.honor_blade_4 = Lionheart Honor Blade
f.honor_blade_4 = A ceremonial sword issued to Vanguards of the Spiral Order. Though intended for formal \
  occasions, its fine edge makes it suitable for combat use.

#m.mighty_great_cleaver = Mighty Great Cleaver
f.mighty_great_cleaver = A custom made Sudaruska designed by Biscotti, head chef of the Skylark. \
	Though she swears it's used just for cooking, one can't help but think more than a few \
	monsters have met it at the chopping block as well.

#m.frozen_great_cleaver = Frozen Great Cleaver
f.frozen_great_cleaver = A custom made Triglav designed by Biscotti, head chef of the Skylark. \
	Though she swears it's used just for cooking, one can't help but think more than a few \
	monsters have met it at the chopping block as well.

#m.furious_fork = Furious Fork
f.furious_fork = A good chef knows when to flip burgers. A great chef cooks burgers while \
  they flip them.

#m.nodeslime_sword = Node Slime Crusher
f.nodeslime_sword = This calloused carving crusher cascades fury upon fatigued foes.

#m.celestial_saber = Celestial Saber
f.celestial_saber = A special saber said to resemble Isoran spacefarers of old as they sliced \
across the night sky. With this equipped, your foes are sure to see stars.

#m.caladbolg = Caladbolg
f.caladbolg = A formidable greatsword of lore, its blows cleave the battlefield like a \
	rainbow crosses the sky.

#m.raiders_axe = Firestorm Skeggox
f.raiders_axe = An ornate, fiery axe favored by raiders for its versatility.

#m.raiders_hammer = Squall Caller
f.raiders_hammer = An ornate hammer infused with the power of a great storm, it's as cutting-edge \
                   as a blunt weapon can be.

#m.raiders_sword = Winter's Edge
f.raiders_sword = A runed sword that will reduce your foe to cold cuts.

#m.dread_captain_cutlass = Dread Captain Cutlass
f.dread_captain_cutlass = A custom curving cutter kept keen on careless castaways.

#m.ice_axe = Ice Axe
f.ice_axe = A technical climbing tool that can pick apart monsters with precision.

#m.alpha_claw_gauntlet = Alpha Claw Gauntlet
f.alpha_claw_gauntlet = A protective Wolver-hide gauntlet affixed with razor sharp claws.

#m.scythe = Scythe
f.scythe = An old farmers tool, retired for the season, this blade also excels at reaping your foes.


# Pickups - Capsule Names and Flavor Text
#...................................................................................................

#m.capsule_health = Health Capsule
f.capsule_health = A small capsule that restores a small amount of health. An \
  adventurer's best friend!
s.capsule_health = HC

#m.capsule_remedy = Remedy Capsule
f.capsule_remedy = A small capsule that refreshes its user. It can be used \
  to remove all status conditions you're afflicted with.\n\
  \n\
  Don't panic! Remedy capsules can be a life saver, if you remember to use them!
s.capsule_remedy = RC

#m.capsule_health_super = Super Health Capsule
f.capsule_health_super = A capsule that restores a large amount of health. An \
  adventurer's best friend!
s.capsule_health_super = SHC

#m.capsule_health_ultra = Ultra Health Capsule
f.capsule_health_ultra = A capsule that restores an extreme amount of health. Never \
  leave home without one!
s.capsule_health_ultra = UHC

#m.mecha_knight_kit = Mecha Knight Kit
f.mecha_knight_kit = Instantly creates a mecha knight for your protection
s.mecha_knight_kit = MKK

#m.ocarina_slime = Ocarina of Slime
f.ocarina_slime = Call up a companion cube to complete your conquest.
s.ocarina_slime = OS

#m.luck_potion = Luck Potion
#m.luck_potion_2 = Fortune Fluid
#m.luck_potion_3 = Chance-Enhancing Power Smoothie
f.luck_potion = A syrupy secretion said by some to strengthen serendipity. \
                (Spiral HQ is unable to determine any actual effect.)
s.luck_potion = LP

#m.ranger_signal_flare = Ranger Signal Flare
f.ranger_signal_flare = A flare that signals a nearby Recon Ranger to provide support fire
s.ranger_signal_flare = RSF

#m.artillery_beacon = Artillery Strike
f.artillery_beacon = A portable beacon that when deployed, summons a barrage of powerful rockets
s.artillery_beacon = AS

#m.auto_turret_kit = Auto Turret Kit
f.auto_turret_kit = Deploys an auto turret that fires at nearby hostiles
s.auto_turret_kit = ATK

#m.fire_barrier = Fire Barrier
f.fire_barrier = Surrounds you with fiery orbs that can set hostiles ablaze
s.fire_barrier = FB
#m.super_fire_barrier = Super Fire Barrier
f.super_fire_barrier = Surrounds you with potent fiery orbs that can set hostiles ablaze
s.super_fire_barrier = SFB
#m.ultra_fire_barrier = Ultra Fire Barrier
f.ultra_fire_barrier = Surrounds you with deadly fiery orbs that can set hostiles ablaze
s.ultra_fire_barrier = UFB

#m.freeze_barrier = Freeze Barrier
f.freeze_barrier = Surrounds you with icy orbs that can freeze hostiles in their tracks
s.freeze_barrier = FB
#m.super_freeze_barrier = Super Freeze Barrier
f.super_freeze_barrier = Surrounds you with potent icy orbs that can freeze hostiles in their tracks
s.super_freeze_barrier = SFB
#m.ultra_freeze_barrier = Ultra Freeze Barrier
f.ultra_freeze_barrier = Surrounds you with deadly icy orbs that can freeze hostiles in their tracks
s.ultra_freeze_barrier = UFB

#m.poison_barrier = Poison Barrier
f.poison_barrier = Surrounds you with toxic orbs that can cripple hostiles
s.poison_barrier = PB
#m.super_poison_barrier = Super Poison Barrier
f.super_poison_barrier = Surrounds you with potent toxic orbs that can cripple hostiles
s.super_poison_barrier = SPB
#m.ultra_poison_barrier = Ultra Poison Barrier
f.ultra_poison_barrier = Surrounds you with deadly toxic orbs that can cripple hostiles
s.ultra_poison_barrier = UPB

#m.shock_barrier = Shock Barrier
f.shock_barrier = Surrounds you with orbs of lightning that can give hostiles a jolt
s.shock_barrier = SB
#m.super_shock_barrier = Super Shock Barrier
f.super_shock_barrier = Surrounds you with potent orbs of lightning that can give hostiles a jolt
s.super_shock_barrier = SSB
#m.ultra_shock_barrier = Ultra Shock Barrier
f.ultra_shock_barrier = Surrounds you with deadly orbs of lightning that can give hostiles a jolt
s.ultra_shock_barrier = USB

