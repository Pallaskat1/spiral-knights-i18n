	knights that specialized in the elimination of high-profile Morai targets. After disbanding, \
	their surviving members were united with other squads by Desna to form the Recon Rangers.

#m.polar_twilight_wolf_coat = Polar Twilight Wolf Coat
f.polar_twilight_wolf_coat = A warm coat, favored by those knights stationed in the polar regions. \
    It is said that the polar twilight is a wonderous sight to behold.

#m.polar_day_wolf_coat = Polar Day Wolf Coat
f.polar_day_wolf_coat = A warm coat, favored by those knights stationed in the polar regions. \
    The thick fur is needed during their never ending day patrols.

#m.polar_night_wolf_coat = Polar Night Wolf Coat
f.polar_night_wolf_coat = A warm coat, favored by those knights stationed in the polar regions. \
    The thick fur is needed during their never ending night patrols.

#m.polar_day_warden_coat = Polar Day Warden Coat
f.polar_day_warden_coat = An insulated coat that will keep a knight warm when facing bitter polar \
winds. The fur-lined armor plating makes it ideal for hours of daytime watch duty.

#m.polar_night_warden_coat = Polar Night Warden Coat
f.polar_night_warden_coat = An insulated coat that will keep a knight warm when facing bitter polar \
winds. The fur-lined armor plating makes it ideal for hours of nighttime watch duty.

#m.polar_twilight_warden_coat = Polar Twilight Warden Coat
f.polar_twilight_warden_coat = An insulated coat that will keep a knight warm when facing bitter polar \
winds. The fur-lined armor plating makes it ideal for hours of scanning the horizon during polar twilight.

#m.trojan_armor = Warden Armor
f.trojan_armor = The armor of the stalwart Spiral Wardens is said to give great comfort to other \
	knights. Nothing says 'here comes the cavalry' like the sight of these iron giants taking \
	to the battlefield.

#m.serene_brigandine = Serene Brigandine
#m.serene_culet = Serene Culet
#m.serene_cuirass = Serene Cuirass

f.serene_armor = An ancient suit of armor weathered by the elements. While standing in this \
	armor you can sense the far-off tremors caused by the migration of countless tortodrones \
	journeying to lands unknown.

#m.celestial_nav_suit = Celestial Nav Suit
f.celestial_nav_suit = A special suit built to commemorate Isoran starfarers of old.  With this \
	equipped, you feel like you would never get lost in space... if only the Skylark could fly.

#m.galactic_guardian_vest = Galactic Guardian Vest
f.galactic_guardian_vest = Wearing this stunningly stellar vest allows you to guide others to \
	safety in even the darkest corners of space.

#m.stellar_sentinel_suit = Stellar Sentinel Suit
f.stellar_sentinel_suit = This suit was was once worn by Isoran starfarers of eons long passed \
that stood watch over extrasolar operations. With this equipped, you feel like you could dive \
into the heart of a star.

#m.swimsuit_trunks = Splash Trunks
f.swimsuit_trunks = A pair of spiral issue trunks intended for coastal expeditions and fun \
	in the sun.

#m.swimsuit_wrap = Splash Sarong
f.swimsuit_wrap = A spiral issue sarong draped over a one piece suit intended for coastal \
	expeditions and fun in the sun.

#m.gm_armor_swimsuit_trunks = GM Splash Trunks
#m.gm_armor_swimsuit_wrap = GM Splash Sarong

#m.nodeslime_armor = Node Slime Guards
f.nodeslime_armor = A variegated veiling ward worn by vehemently venerated victors.

#m.gremlin_suit = Gremlin Suit
f.gremlin_suit = A special suit tailored by a gremlin's touch to fit the frame of a knight. \
It protects the wearer while providing a full range of motion for thwacking, knocking, or mending.

#m.mechaknight_suit = Mecha Suit
f.mechaknight_suit = A slim suit of armor designed to disguise a knight as they delve into the depths of Cradle.

#m.feral_kat_suit = Feral Kat Suit
#m.primal_kat_suit = Primal Kat Suit
#m.savage_kat_suit = Savage Kat Suit
#m.wild_kat_suit = Wild Kat Suit
f.kat_suit = A clawed costume made by Moorcroft tailors. It's perfect for curious knights who \
are prone to pause for naps after a long night of adventuring.

#m.venom_fiend_mail = Venom Fiend Mail
f.venom_fiend_mail = A plated mail said to be crafted in the image of a venomous fiend. \
	It comes with a sinister skinsuit that pulses with a vile essence.

#m.arctic_rogue_mail = Arctic Rogue Mail
f.arctic_rogue_mail = A plated mail said to be crafted by an arctic rogue. It comes augmented \
	with ice plating to conceal your location during arctic expeditions.

#m.arctic_acolyte_mantle = Arctic Acolyte Mantle
f.arctic_acolyte_mantle = A plated robe said to be worn by wandering arctic acolytes. \
	'we saw them heading straight towards the mountains, off into the \
	interior of the vast frozen continent, but why?'

#m.voltaic_radical_suit = Voltaic Radical Suit
f.voltaic_radical_suit = A suit said to be replicated by a sentient mechaknight. \
    It comes with a synthetic skinsuit that pulses with an electric energy.

#m.nefarious_raiment = Nefarious Raiment
f.nefarious_raiment = A raiment said to be crafted by a nefarious imp. The ethereal plates \
	will defend against heinous harassment while they shroud you in darkness.

#m.magmatic_fanatic_mail = Magmatic Fanatic Mail
f.magmatic_fanatic_mail = A plated mail said to have been worn by fanatics that worshiped a magma god. \
	Its fires will protect those that are worthy.

#m.onesie = Onesie
f.wooly_onesie = An itchy yet warm set of pajamas for knights to wear at night. {0}
f.onesie = One size fits all. Machine washable, heavy duty cycle. Air dry only.

#m.pullover = Pullover
f.wooly_pullover = A stylish sweater for the pre-snowy season. {0}
f.pullover = The perfect pullover for parties and perilous adventures alike.

#m.stranger_robe = Stranger Robe
f.stranger_robe = A robe once worn by one of the enigmatic Strangers.  Local Snipes seem \
	to be drawn to the wearer.

#m.spiraltail_mail = Spiraltail Mail
f.spiraltail_mail = A simple simian mail typically worn at parades to provide prosperity and lend luck.

#m.firetail_mail = Firetail Mail
f.firetail_mail = A scorching simian mail typically worn by commanders in combat. \
	It will ward off many wounds made to the wearer.

#m.winter_pullover_rg = Gaudy Winter Pullover
#m.winter_pullover_gw = Garish Winter Pullover
#m.winter_pullover_rw = Tacky Winter Pullover
#m.winter_pullover_bw = Flashy Winter Pullover
f.winter_pullover = A not-so-stylish sweater for the snowy season. The perfect pullover \
	to embarass your family and guildmates alike.

#m.winter_onesie_rg = Festively Striped Onesie
#m.winter_onesie_gw = Holly Striped Onesie
#m.winter_onesie_rw = Candy Striped Onesie
#m.winter_onesie_bw = Joyous Striped Onesie
f.winter_onesie = The perfect pajamas for passing out presents or patiently waiting \
	for Impostoclaus' presence.

#m.plated_pathfinder_armor = Plated Pathfinder Armor
#m.plated_shade_armor = Plated Shade Armor
#m.plated_sentinel_armor = Plated Warden Armor

f.volcanic_plated_pathfinder_armor = A hardened set of armor, reinforced with volcanic alloys, \
	made to protect against the toastiest of monsters while exploring the unknown.
f.volcanic_plated_shade_armor = A suit of fire retardant fabric interlaced with dark matter to conceal its \
	wearer while they hide in heated hallways.
f.volcanic_plated_sentinel_armor = A suit of armor reinforced with volcanic plating to defend against \
	a range of elements.

#m.fowl_cloak = Fowl Cloak
f.fowl_cloak = A simple feathered cloak. Adorn yourself in down and get down for the new year.
f.fowl_cloak_vol = A scorched feathered cloak. \
	Set a fire under your feet and ensure punctuality as sure as the roosters crow.

#m.buckled_coat = Gold Buckled Coat
f.buckled_coat = A verdant coat fastened with shiny golden buckles.

#m.fire_raider_tunic = Firestorm Raider Tunic
f.fire_raider_tunic = Treasure is at your fingertips and ash in your wake with this soot laden coat.

#m.shock_raider_tunic = Squall Raider Tunic
f.shock_raider_tunic = Anti-static fur lines this raiders coat.

#m.freeze_raider_tunic = Winter Raider Tunic
f.freeze_raider_tunic = Raid fast, raid warm in this furry coat.

#m.captain_coat = Captain Coat
#m.captain_coat_hook = Captain Coat & Hook
#m.captain_coat_pegleg = Captain Coat & Pegleg
#m.captain_coat_booched = Booched Captain Coat
f.captain_coat = A seaworthy greatcoat outstanding for spaceage swordplay.

#m.down_puffer = Down Puffer
#m.down_puffer_unzipped = Down Puffer (Unzipped)
f.down_puffer = A puffy, downy jacket. \
                Superior insulation is provided by snipe down feathers. \
                (No snipes were harmed making this jacket, \
                feathers were gathered non-intrusively from free-roaming snipes.)

#m.bio_coat = Bio Coat
f.bio_coat = A biotech's air-tight clean suit designed for handling hostile or unknown flora.
#m.budding_coat = Budding Coat
f.budding_coat = A ripped clean suit can mean death, but fortunately this one was colonized \
                 by an unusual symbiotic plant. Wear this and you'll be guaranteed to have a \
                 green thumb!

#m.owlite_robe = Owlite Robe
f.owlite_robe = A costume recreation of the fine robes worn by Owlites, \
                based on the most recent archaeological findings.

#m.raider_tunic = Raider Tunic
f.raider_tunic = Treasure is at your fingertips in this coat.

#m.angelic_cuirass = Angelic Cuirass
f.angelic_cuirass = A beautifully ornate costume armor designed to evoke a heavenly connection.

#m.magister_robe = Magister Robe
f.magister_robe = A ceremonial robe worn by learned masters of the arcane arts, who often \
                  leave their keys in one of the many inner pockets.
#m.sorcerer_robe = Sorcerer Robe
f.sorcerer_robe = A fine robe known to be worn by powerful sorcerers, and this one guy Bob.

#m.hexoskeleton = Hexoskeleton
f.hexoskeleton = Protects the thorax, abdomen, and legs. No molting necessary.
#m.pollinator_plate = Pollinator Plate
f.pollinator_plate = Styled after the unsung heroes of the hive. \
                     Fashionable, functional, and a little fuzzy.

# Gear Shield names
#...................................................................................................

#m.aegis = Aegis
f.aegis = A sublime shield entrusted to only the most worthy members of the Spiral Order. \
  Whether its crest is a relic from the Order of old or a creation from the Knights' time \
  on Cradle is not immediately clear.

#m.ancient_plate_shield = Ancient Plate Shield
f.ancient_plate_shield = An antique shield whose origins have been lost to the passing of time.

#m.barrier_shell = Barrier Shell
f.barrier_shell = A shield alchemized from the shell of a tortodrone. The elemental resiliency \
	of a tortodrone on the Long Migration should aid you on your own journies through harsh \
	environments.

#m.barbarous_thorn_shield = Barbarous Thorn Shield
f.barbarous_thorn_shield = A mythical shield imbued with the fury of the Snarbolax \
  itself. It's said that the beast can use the glowing orbs on the shield's face to see \
  and stalk weak-hearted wielders.

#m.blackened_crest = Blackened Crest
f.blackened_crest = A shield once carried by a knight of Almire, now a cursed relic that \
  has been nearly burned beyond recognition within the Firestorm Citadel. Very powerful \
  alchemy would be required to restore it to its former glory.

#m.blazebreak_shield = Blazebreak Shield
f.blazebreak_shield = A reliable shield that'll keep you from getting too fired up in battle.

#m.blizzbreaker_shield = Blizzbreaker Shield
f.blizzbreaker_shield = A reliable shield that'll prevent your foes from keeping you on ice.

#m.boosted_plate_shield = Boosted Plate Shield
f.boosted_plate_shield = A beautifully refinished Plate Shield that's been given an \
  internal power source to help keep the most battering of blows at bay.

#m.bristling_buckler = Bristling Buckler
f.bristling_buckler = A small shield spiked to supplement your sword in a skirmish.

#m.brute_jelly_shield = Brute Jelly Shield
f.brute_jelly_shield = A thick shield made from the remains of particularly ill-mannered slimes. \
  It is durable, light, and delightfully berry-flavored.

#m.celestial_shield = Celestial Shield
f.celestial_shield = Cradle's equinox inspired the dual nature of this specialist shield, which \
	protects against the dazzling light of day and the chill of night in equal measure.

#m.circuit_breaker_shield = Circuit Breaker Shield
f.circuit_breaker_shield = A Proto Shield modified to provide some protection against shock.

#m.crest_almire = Crest of Almire
f.crest_almire = A shimmering crest once proudly carried by the noble knights of Almire. It \
  is said to bless those who fight for their homeland, granting them strength from within.

#m.dark_thorn_shield = Dark Thorn Shield
f.dark_thorn_shield = A gloomy guard that gives one's sword strikes a supernatural \
  savagery.

#m.defender = Defender
f.defender = A durable, high quality shield of the Spiral Order that is suitable for any \
  adventure.

#m.dragon_scale_shield = Dragon Scale Shield
f.dragon_scale_shield = A mythical shield crafted from the scales of a creature of legend.

#m.drake_scale_shield = Drake Scale Shield
f.drake_scale_shield = A solid shield shaped from stout scales.

#m.dread_skelly_shield = Dread Skelly Shield
f.dread_skelly_shield = A large, bony bulwark bathed in blackish brume. It occasionally \
  issues a quiet, forlorn whisper, usually about remembering to block.

#m.emberbreak_shield = Emberbreak Shield
f.emberbreak_shield = A Proto Shield modified to provide some protection against fire.

#m.feral_shell = Feral Shell
f.feral_shell = A shield alchemized from a hardened tortodrone shell. Even the sharpest \
	wolver claws merely glance off this compact carapace.

#m.firebreak_shield = Firebreak Shield
f.firebreak_shield = An Emberbreak Shield modified for increased protection against fire.

#m.force_buckler = Force Buckler
f.force_buckler = A Proto Shield modified to resist stunning impacts.

#m.frostbreaker_shield = Frostbreaker Shield
f.frostbreaker_shield = A Proto Shield modified to provide some protection against freeze.

#m.gorgomega = Gorgomega
f.gorgomega = A terrifying shield that combines the dual-crushing power of a gorgo and the \
	mythical tortomega. Crushing enemies has never been more fiendishly fun.

#m.grand_tortoise = Grand Tortoise
f.grand_tortoise = A shield empowered by the limitless fury of a tortodrone. The very plates \
	of this colossal carapace shake as the unstable energy within waits to be unleashed.

#m.great_defender = Great Defender
f.great_defender = A sturdy Defender upgraded with its own internal energy source for more \
  effective protection.
f.great_defender_c = A well-crafted costume version of a classic shield.

#m.green_ward = Green Ward
f.green_ward = A sturdy shield with an emerald sheen that saves Spiral Knight recruits from the \
	perils of sharp spikes and deadly toxins.

#m.grey_owlite_shield = Grey Owlite Shield
f.grey_owlite_shield = A resplendent replica of the shield thought to have been issued to \
  the most eminent of Owlite wizards. Wielding it fills you with righteous vengeance.

#m.grim_shell = Grim Shell
f.grim_shell = A shield alchemized from the shell of a corrupted tortodrone. Shadows seem to \
	lengthen and cling to it whenever it is brought to bear.

#m.heater_shield = Heater Shield
f.heater_shield = A shield with a built-in furnace that keeps its user toasty warm, protecting \
  them from most freeze attacks. Many knights also use it as a makeshift stove top when out \
  in the field.

#m.heavy_plate_shield = Heavy Plate Shield
f.heavy_plate_shield = A huge reinforced shield perfect for brushing off blows and fending \
  off foes.

#m.horned_owlite_shield = Horned Owlite Shield
f.horned_owlite_shield = A sturdy shield similar to the sort said to have been carried by \
  Owlite youth.

#m.icebreaker_shield = Icebreaker Shield
f.icebreaker_shield = A Frostbreaker Shield modified for increased protection against freeze.

#m.iron_buckler = Iron Buckler
f.iron_buckler = A beaten little buckler made of iron that can withstand a bit more abuse \
  than a Proto Shield.

#m.ironmight_plate_shield = Ironmight Plate Shield
f.ironmight_plate_shield = A superior shield forged from sun silver. The meaning of the crest \
  on its face has been lost to time.

#m.jelly_shield = Jelly Shield
f.jelly_shield = A strange looking shield created from jelly matter. Like many slime monsters \
  themselves, it provides the user with exceptional defense against piercing damage.

#m.mighty_defender = Mighty Defender
f.mighty_defender = An advanced Spiral Knight shield, reinforced for battle and beautifully \
  embossed for the stories afterward.

#m.mighty_shell = Mighty Shell
f.mighty_shell = A shield alchemized from the shell of a tortodrone. While wielding it, you \
	can feel the berserk energies within just waiting to be unleashed.

#m.nether_shell = Nether Shell
f.nether_shell = A shield alchemized from the shell of a corrupted tortodrone. A tormented howl \
	of rage can be heard on the wind when this shield smashes through your foes.

#m.omega_shell = Omega Shell
f.omega_shell = A shield created from the armor of a Tortomega. The sheer weight of this \
  powerful shield makes it only an option for the strongest of warriors.

#m.omegaward = Omegaward
f.omegaward = The pulsing elemental plates of this shield instantaneously react to \
	adverse climates protecting you from even the most extreme cold or heat.

#m.owlite_shield = Owlite Shield
f.owlite_shield = A wooden ward carved with the crude image of a long-lost Owlite.

#m.plate_shield = Plate Shield
f.plate_shield = A heavy iron shield adept at deflecting impacts that would otherwise \
  leave you stunned.

#m.primal_shell = Primal Shell
f.primal_shell = A shield alchemized from the shell of a tortodrone. The plates used in its \
	construction provide some protection against the elements of fire and freeze.

#m.proto_shield = Proto Shield
f.proto_shield = A small shield issued to all Spiral Knight recruits.

#m.rock_jelly_shield = Rock Jelly Shield
f.rock_jelly_shield = Crafted from the most adamant of slimy specimens, it also functions as \
  an emergency source of calories for stranded knights.

#m.royal_jelly_shield = Royal Jelly Shield
f.royal_jelly_shield = Prime protection for pretenders to the jelly throne.

#m.savage_tortoise = Savage Tortoise
f.savage_tortoise = A shield alchemized from a hardened tortodrone shell. Even a rampaging \
	wolver pack would have a hard time puncturing its reinforced plates.

#m.scale_shield = Scale Shield
f.scale_shield = A very stylish shield made from lizard scales. While otherwise somewhat weak, \
  the tight mesh of scales makes it highly resistant to pierce damage.

#m.scarlet_shield = Scarlet Shield
f.scarlet_shield = A shield found within the Scarlet Fortress. It grants the user extra health. \
  Those that carry one have said that they can sometimes hear a faint heartbeat emanating from \
  within it.

#m.scary_skelly_shield = Scary Skelly Shield
f.scary_skelly_shield = A small, spooky shield to safeguard you from shadow.

#m.shining_ward = Shining Ward
f.shining_ward = A sacred shield that protects the user from evil.

#m.sinister_skelly_shield = Sinister Skelly Shield
f.sinister_skelly_shield = A kite shield haunted by a benevolent ghost. It should help you \
  put up a spirited defense against shadow.

#m.skelly_shield = Skelly Shield
f.skelly_shield = A bedeviled buckler best used for blocking bad energy.

#m.stoic_shell = Stoic Shell
f.stoic_shell = A shield alchemized from the shell of a tortodrone. While wielding it, you \
	sense the quiet passing of the wind and can call upon the rumbling storm that follows.

#m.stone_tortoise = Stone Tortoise
f.stone_tortoise = A large, powerful shield made to resemble a creature's shell. Its formidable \
  weight can make attacking more difficult.

#m.stop_sign = Stop Sign
f.stop_sign = A strange shield capable of stopping many status attacks from harming the \
  user. However it has an unnatural power that causes the user to come to a halt when behind it.

#m.surge_breaker_shield = Surge Breaker Shield
f.surge_breaker_shield = A reliable shield that'll help keep you grounded in battle.

#m.swiftstrike_buckler = Swiftstrike Buckler
f.swiftstrike_buckler = A small, easy to use shield that enables the user to perform fast \
  attacks.

#m.teddy_bear_buckler = Teddy Bear Buckler
f.teddy_bear_buckler = A high-tech energy shield disguised as a harmless teddy bear. \
  The perfect companion to defend against minions of the night.

#m.thwacker_shield = Darkfang Shield
f.thwacker_shield = A shield repurposed by gremlins and worn by Darkfang Thwackers. Similar to \
  the gremlins themselves, it is resistant to fire and shock attacks. Knights who use these \
  shields report that is impossible to completely remove all the fur stuck to it.

#m.twisted_targe = Twisted Targe
f.twisted_targe = A tulgey targe that will give your sword thrusts some teeth.

#m.volcanic_plate_shield = Volcanic Plate Shield
f.volcanic_plate_shield = A superior shield imbued with the elemental essence of flame. It \
  is so resistant to high temperatures that it's a mystery how exactly it was forged in the \
  first place.

#m.volt_breaker_shield = Volt Breaker Shield
f.volt_breaker_shield = A Circuit Breaker Shield modified for increased protection against shock.

#m.wild_shell = Wild Shell
f.wild_shell = A shield alchemized from a hardened tortodrone shell. It's tough enough to dull \
	a jelly barb on impact.

#m.wise_owlite_shield = Wise Owlite Shield
f.wise_owlite_shield = It doesn't take a renowned Owlite scholar to figure out that \
  defending oneself with a shield is an excellent idea.

#m.wyvern_scale_shield = Wyvern Scale Shield
f.wyvern_scale_shield = A spiny buckler forged from beast chitin, providing ample \
  resistance to both heat and venom.

#m.honor_shield_1 = Honor Guard
f.honor_shield_1 = A ceremonial shield issued to Spiral Knight recruits. Though intended for \
  formal occasions, its solid construction makes it suitable for combat use.

#m.honor_shield_2 = Great Honor Guard
f.honor_shield_2 = A ceremonial shield issued to seasoned Spiral Knights. Though intended for \
  formal occasions, its solid construction makes it suitable for combat use.

#m.honor_shield_3 = Mighty Honor Guard
f.honor_shield_3 = A ceremonial shield issued to Champions of the Spiral Order. Though intended for \
  formal occasions, its solid construction makes it suitable for combat use.

#m.honor_shield_4 = Exalted Honor Guard
f.honor_shield_4 = A ceremonial shield issued to Vanguards of the Spiral Order. Though intended for \
  formal occasions, its solid construction makes it suitable for combat use.

#m.the_bitter_end = The Bitter End
f.the_bitter_end = A shield carried by all members of the Recon Rangers. Its name is a reminder \
	to all Rangers as to precisely when they are permitted to drop it in battle.

#m.the_final_gasp = The Final Gasp
f.the_final_gasp = A shield carried by all members of the Scarlet Scouts. Its name is a reminder \
	to all Scouts as to precisely when they are permitted to drop it in battle.

#m.nodeslime_shield = Node Slime Wall
f.nodeslime_shield = This weathered wobbling wall can withstand a walloping when wielded by unwaveringly willed warriors.

#m.power_mitt = Power Mitt
f.power_mitt = A must have in every kitchen. The comfortable fit and heavyweight silverweave surface \
  are great for handling high heat. Now you're cooking with power!

#m.crystalline_defender = Crystalline Defender
f.crystalline_defender = A durable, high quality shield clad in protective glacial ice suitable for any adventure.

#m.raider_buckler = Raider Buckler
f.raider_buckler = A light wooden shield that blocks basic attacks and allows a countering swift strike.

#m.ship_wheel = Ship Wheel
f.ship_wheel = How could this possibly make a good shield? Where did it even come from? \
               Careful matey, ask those questions and you could be made to walk the plank.

#m.airbraker_shield = Airbraker Shield
f.airbraker_shield = A lightweight, compact, and pneumatically-activated shield that expands \
                     its surface area against enemy attacks.

#m.illuminating_ward = Illuminating Ward
f.illuminating_ward = A personal candle for warding off the darkness, and that which lurks \
                      within it.

#m.spell_book = Spell Book
f.spell_book = An old dictionary that seems to have quite a few spells within it.

#m.roly_poly = Roly-Poly
f.roly_poly = Just your common armadillidium.

#m.obsidian_obstacle = Obsidian Obstacle
f.obsidian_obstacle = A baleful shield of obelisk fragments bound by Apocrean ritual. \
                      Every time the fragments align, dark memories echo in your mind.

