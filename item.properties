#m.gm_armor = GM Armor
#m.gm_armor_basic = GM Armor, Basic
#m.gm_armor_ceremonial = GM Armor, Ceremonial
f.gm_armor = Impressive indigo armor that's the indisputable indication of one of \
  the Spiral Order's incredible Game Masters.

#m.tabard_red_rose = Tabard of the Red Rose
#m.tabard_black_rose = Tabard of the Black Rose
#m.tabard_white_rose = Tabard of the White Rose
#m.tabard_blue_rose = Tabard of the Blue Rose
#m.tabard_green_rose = Tabard of the Green Rose
#m.tabard_gold_rose = Tabard of the Gold Rose
#m.tabard_coral_rose = Tabard of the Coral Rose
#m.tabard_violet_rose = Tabard of the Violet Rose
#m.tabard_poi_rose = Tabard of the Malachite Rose
#m.tabard_fre_rose = Tabard of the Moonstone Rose
#m.tabard_fir_rose = Tabard of the Garnet Rose
#m.tabard_crs_rose = Tabard of the Amethyst Rose
#m.tabard_stn_rose = Tabard of the Citrine Rose
#m.tabard_slp_rose = Tabard of the Turquoise Rose
#m.tabard_shk_rose = Tabard of the Aquamarine Rose
#m.tabard_prismatic_rose = Tabard of the Prismatic Rose
f.tabard_rose = An aged, embroidered tabard that once belonged to a Knight of the Rose, a \
  sacred order of brave and especially dashing heroes whose numerous adventures are the subject \
  of many folk tales. The Knights of the Rose were said to be peerless fencers, believing that \
  their blades were like the flowers of their name: a delicate thing of beauty that hides a \
  vicious sting.

#m.plasmatech_demo_suit = Plasmatech Demo Suit
f.plasmatech_demo_suit = A demo suit commissioned by King Krogmo to celebrate the launch of \
  Blast Network. It's the perfect attire for formal detonation, or for more casual explosions.

#m.tusk_helm = Gatecrasher Helm
f.tusk_helm = Modeled after noble beasts known for their strength and fearlessness, this helm \
	strikes such terror and respect in its wearer's enemies that the deeds will be talked about \
	for ages to come.

#m.metal_sonic_suit = Metal Sonic Suit
f.metal_sonic_suit = A meticulously engineered suit of armor that is said to be equipped with \
	a an ultra-powerful V. Max Overdrive Unit.

#m.heavenly_guardian_armor = Heavenly Guardian Armor
f.heavenly_guardian_armor = Brilliant, white armor worn by those who defend the heavenly realms.

#m.infernal_guardian_armor = Infernal Guardian Armor
f.infernal_guardian_armor = Charred, stygian armor worn by those who defend the infernal depths.

#m.brigandine = Brigandine
f.brigandine = A very practical suit of armor coupled with a knitted jacket.

#m.cloak = Cloak
f.cloak = An extraordinary cloak favored by the students of the arcane.

#m.cuirass = Cuirass
f.cuirass = A tight-fitting suit of armor that is all business and no pockets.

#m.culet = Culet
f.culet = An elegantly designed suit of armor capable of flattering any form.

#m.draped_armor = Draped Armor
f.draped_armor = A stylish suit of armor that adds a touch of class to battle.

#m.flak_jacket = Flak Jacket
f.flak_jacket = A lightweight armored jacket that keeps you looking and feeling cool.

#m.fur_coat = Fur Coat
f.fur_coat = An extra-toasty coat made from the hide of a furry beast.

#m.plate_mail = Plate Mail
f.plate_mail = A clinking, clanking, cumbersome armor suitable for withstanding a clobbering.

#m.scale_mail = Scale Mail
f.scale_mail = A shimmering set of serpentine scales woven into a suit of armor.

#m.raiment = Raiment
f.raiment = A long, flowing battle garb best accessorized with a pair of angelic wings.

#m.winterfest_coat = Winterfest Coat
f.winterfest_coat = A supremely soft and seasonally stylish suit that radiates with \
	wondrous Winterfest cheer. It tells everyone that when it comes to the holidays, \
	you mean business.

#m.thunderous_plate_mail = Thunderous Plate Mail
f.thunderous_plate_mail = A legendary suit of armor said to imbue the wearer with the might \
	of heavenly thunder.

#m.rageous_plate_mail = Rageous Plate Mail
f.rageous_plate_mail = A legendary suit of armor said to imbue the wearer with the rage \
	of the titans.

#m.frenzy_plate_mail = Frenzy Plate Mail
f.frenzy_plate_mail = A legendary suit of armor said to imbue the wearer with the frenzy \
	of a thousand demigods.

#m.storm_rider_mantle = Storm Rider Mantle
f.storm_rider_mantle = A legendary suit of armor thought to be worn by a god who used lightning \
	to carve whole worlds from stone.

#m.raging_rider_mantle = Raging Rider Mantle
f.raging_rider_mantle = A legendary suit of armor thought to be worn by a god who used rage \
	to carve whole worlds from stone.

#m.frenzy_rider_mantle = Frenzy Rider Mantle
f.frenzy_rider_mantle = A legendary suit of armor thought to be worn by a god who used frenzy \
	to carve whole worlds from stone.

#m.battle_chef_coat_white = White Battle Chef Coat
#m.battle_chef_coat_red = Red Battle Chef Coat
#m.battle_chef_coat_black = Black Battle Chef Coat
#m.battle_chef_coat_blue = Blue Battle Chef Coat
#m.battle_chef_coat_pink = Pink Battle Chef Coat
#m.battle_chef_coat_purple = Purple Battle Chef Coat
#m.battle_chef_coat_yellow = Yellow Battle Chef Coat
f.battle_chef_coat = A coat worn by the knights who work in the Skylark's galley. Not to be \
	trifled with, these chefs are blade masters on and off the battlefield.

f.dangerous_brigandine = Padded armor that seems to emphasize the high mortality rate of the \
	elite Recon Rangers. Recon Rangers need to travel light and fast, often headlong into \
	situations that would terrify other knights.

f.hazardous_brigandine = Padded armor that seems to emphasize the high mortality rate of the \
	elite Scarlet Scouts. Scarlet Scouts need to travel light and fast in order to stay ahead \
	of lesser skilled squads.

f.dangerous_draped_armor = Loose-fitting armor worn by more experienced Recon Rangers. It's \
	rumored that gear like this is crafted from the remains of armor from Rangers who fell in \
	combat, acting as a reminder to the wearer that they are always within Death's embrace.

f.hazardous_draped_armor = Loose-fitting armor worn by more experienced Scarlet Scouts. It's \
	rumored that gear like this is crafted from the remains of armor from Scouts who fell in \
	combat, acting as a reminder that unless necessary Scouts never leave a man behind.

#m.hound_coat = Hound Coat
f.dangerous_hound_coat = A battle-ravaged coat worn by the squad leaders of the Recon Rangers, \
	nicknamed 'hounds.' The name was likely coined due to their incredible tracking abilities \
	or perhaps the fact that they fight like wild dogs in battle.

#m.hedge_coat = Hedge Coat
f.hazardous_hedge_coat = A battle-ravaged coat worn by the squad leaders of the Scarlet Scouts, \
	nicknamed 'hedges.' The name was likely coined due to their incredible flanking abilities \
	or perhaps it is a reference to the spikes that adorn their armor.

#m.obsidian_mantle_of_rituals = Obsidian Mantle of Rituals
f.obsidian_mantle_of_rituals = 'With great practice and tender care, with an eternal heart and \
  mind so pure: sharpen the stone, sturdy the chain, welcome the night, drink the Cup of Kings.'

#m.obsidian_mantle_of_sight = Obsidian Mantle of Sight
f.obsidian_mantle_of_sight = 'Through my eyes you will see the path to ages. Pure is my gaze, \
  free from the lies of reality.'

#m.obsidian_mantle_of_influence = Obsidian Mantle of Influence
f.obsidian_mantle_of_influence = 'Speak with the one, true voice and they will listen. Quiet \
  as a child's whisper, roaring like the death of this world.'

#m.obsidian_mantle_of_devotion = Obsidian Mantle of Devotion
f.obsidian_mantle_of_devotion = 'Wrap thy self in my embrace and succumb to my infinite love. \
  Let your breath drift from you like candle smoke, dreaming deeper and deeper still.'

#m.iron_wolf_coat = Iron Wolf Armor
f.iron_wolf_coat = Armor once worn by a member of the 'Iron Wolves,' a squad of fearless \
	knights that specialized in the elimination of high-profile Morai targets. After disbanding, \
	their surviving members were united with other squads by Desna to form the Recon Rangers.

#m.iron_dragon_armor = Iron Dragon Armor
f.iron_dragon_armor = Armor once worn by a member of the 'Iron Dragons,' a squad of fearless \
	knights that specialized in the elimination of high-profile Morai targets. After disbanding, \
	their surviving members were united with other squads by Desna to form the Recon Rangers.

#m.gold_wolf_coat = Gold Wolf Armor
f.gold_wolf_coat = Armor once worn by a member of the 'Gold Wolves,' a squad of fearless \
	knights that specialized in the elimination of high-profile Morai targets. After disbanding, \
	their surviving members were united with other squads by Desna to form the Recon Rangers.

#m.gold_dragon_armor = Gold Dragon Armor
