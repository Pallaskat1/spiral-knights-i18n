  mind so pure: sharpen the stone, sturdy the chain, welcome the night, drink the Cup of Kings.'

#m.obsidian_hood_of_sight = Obsidian Hood of Sight
f.obsidian_hood_of_sight = 'Through my eyes you will see the path to ages. Pure is my gaze, \
  free from the lies of reality.'

#m.obsidian_hood_of_influence = Obsidian Hood of Influence
f.obsidian_hood_of_influence = 'Speak with the one, true voice and they will listen. Quiet \
  as a child's whisper, roaring like the death of this world.'

#m.obsidian_hood_of_devotion = Obsidian Hood of Devotion
f.obsidian_hood_of_devotion = 'Wrap thy self in my embrace and succumb to my infinite love. \
  Let your breath drift from you like candle smoke, dreaming deeper and deeper still.'

