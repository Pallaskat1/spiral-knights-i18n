#
# Translation messages for the Crucible program
#
# PREFIX KEY
# m.foo = message
# e.foo = error
# l.foo = label (something that is completed using another UI element)
# b.foo = button
# i.foo = tooltip (info)
# t.foo = title
# h.foo = header
# p.foo = prompt (or placeholder text)
# x.foo = optional translation that may or may not be present
#
# Or whatever makes sense.

