#
# Battle Sprite translation messages

# Sprites
d.drakon = El drakon es un sprite de batalla que personifica la destrucci\u00f3n con fuego. Sus \
  habilidades se enfocan en el poder ofensivo en bruto.

d.seraphynx = El seraphynx es un sprite de batalla que personifica la luz divina. Sus \
  habilidades se enfocan en apoyar a los caballeros en el combate con protecci\u00f3n y restauraci\u00f3n.

d.maskeraith = El maskeraith es un sprite de batalla que personifica las sombras. Sus \
  habilidades se enfocan en el subterfugio y las toxinas mortales.



# Generic Skills and Augments

m.focus = Enfoque
d.focus = Reduce el tiempo de espera.

m.skill = Habilidad
m.skill_power = Poder de Habilidad

# Drakon Skills and Augments

m.firebolt = Rel\u00e1mpago de Fuego
d.firebolt = Lanza una abrasadora bola de fuego que explota en el impacto.

m.impact = Impacto
d.impact = Aumenta el da\u00f1o del rel\u00e1mpago de fuego.

m.extra_crispy = Extra Crujiente
d.extra_crispy = Aumenta la potencia del fuego y la probabilidad de que los objetives se \
  incendien.

m.concussive_firebolt = Rel\u00e1mpago de Fuego Contusionador
d.concussive_firebolt = A\u00f1ade al rel\u00e1mpago de fuego una probabilidad de causar \
  poderoso aturdimiento.

m.meteoric_firebolt = Rel\u00e1mpago de Fuego Mete\u00f3rico
d.meteoric_firebol = Aumenta el tama\u00f1o de la explosi\u00f3n del rel\u00e1mpago de fuego.

m.flame_barrier = Barrera de Fuego
d.flame_barrier = Rod\u00e9ate con una barrera en llamas que aumenta tus defensas mientras \
  quema a los enemigos cercanos.

m.high_heat = Fuego Fuerte
d.high_heat = Aumenta el poder ofensivo de la barrera de fuego.

m.heavy_smoke = Densa Humareda
d.heavy_smoke = Aumenta el poder defensivo y la duraci\u00f3n de la barrera de fuego.

m.scorching_barrier = Barrera Calcinante
d.scorching_barrier = Aumenta el n\u00famero y el tama\u00f1o de las bolas de fuego orbitando.

m.backfire_barrier = Barrera Explosiva
d.backfire_barrier = Gana un breve impulso a la velocidad de movimiento al ejecutar la barrera \
  de fuego.

m.firestorm = Tormenta de Fuego
d.firestorm = Convoca el poder del verdadero fuego de drag\u00f3n para quemar todo lo que se \
  ponga en tu camino.

m.five_alarm = Alarma de Cinco
d.five_alarm = Aumenta la duraci\u00f3n y el tama\u00f1o de la tormenta de fuego.

m.frenzied_firestorm = Tormenta de Fuego Fren\u00e9tica
d.frenzied_firestorm = Por cada monstruo que haya sido atrapado en el incendio, los miembros \
  del grupo tendr\u00e1n una probabilidad de recibir un poder de ataque y un bono de velocidad.

m.explosive_firestorm = Tormenta de Fuego Explosiva
d.explosive_firestorm = Crea una serie de explosiones al desatar la tormenta de fuego.

# Seraphynx Skills and Augments

m.ray_of_light = Rayo de Luz
d.ray_of_light = Dispara continuamente un haz de luz concentrado que da\u00f1a todo lo que pase \
  por el.

m.magnify = Magnificar
d.magnify = Aumenta el alcance y el poder del rayo de luz.

m.enduring_light = Luz Duradera
d.enduring_light = Aumenta la duraci\u00f3n del rayo de luz.

m.dazzling_light_ray = Rayo de Luz Cegador
d.dazzling_light_ray = El rayo de luz inflige da\u00f1o adicional a los monstruos de las \
  familias de los muertos vivientes y demonios.

m.disintegration_ray = Rayo Desintegrante
d.disintegration_ray = El rayo de luz tambi\u00e9n reduce la defensa de sus objetivos.

m.heart_attack = Ataque Card\u00edaco
d.heart_attack = Hechiza a un grupo de objetivos. Si son destruidos mientras est\u00e9n \
  hechizados, los objetivos tienen una mayor probabilidad de otorgar corazones de restauraci\u00f3n.

m.extra_hearty = Coraz\u00f3n Extra
d.extra_hearty = Aumenta la probabilidad de que se otorguen corazones y la duraci\u00f3n del hechizo.

m.wide_embrace = Gran Abrazo
d.wide_embrace = Aumenta el \u00e1rea en la que tiene efecto.

m.iron_heart_attack = Ataque Card\u00edaco de Hierro
d.iron_heart_attack = Los objetivos destruidos mientras est\u00e9n hechizados podr\u00edan tambi\u00e9\
  n otorgar orbes de defensa.

m.violent_heart_attack = Ataque Card\u00edaco Violento
d.violent_heart_attack = Los objetivos destruidos mientras est\u00e9n hechizados crean una \
  explosi\u00f3n.

m.angelic_aura = Aura Angelical
d.angelic_aura = Crea un aura protectora a tu alrededor que tambi\u00e9n protege a los miembros \
  del grupo que est\u00e9n dentro.

m.protection = Protecci\u00f3n
d.protection = Aumenta el poder defensivo del aura angelical.

m.cover = Cubierta
d.cover = Aumenta el tama\u00f1o y la duraci\u00f3n del aura angelical.

m.seraphic_aura = Aura Ser\u00e1fica
d.seraphic_aura = Los miembros del grupo dentro del aura protectora obtienen un incremento en \
  la regeneraci\u00f3n del escudo.

m.valkyrian_aura = Aura Valquiriana
d.valkyrian_aura = Los miembros del grupo dentro del aura protectora obtienen un bono en la \
  velocidad de carga.


# Maskeraith Skills and Augments

m.caustic_quills = Pluma Caustica
d.caustic_quills = Dispara una serie de plumas que se adhieren a los objetivos e infligen \
  veneno. Por cada golpe que recibe el objetivo emplumado, pierden una pluma y reciben da\u00f1o adicional.

m.venom = Veneno
d.venom = Aumenta la potencia del veneno infligido.

m.bristle = Cerdamen
d.bristle = Aumenta el n\u00famero de plumas que se disparan y su duraci\u00f3n.

m.vengeful_quills = Cerdamen Vengativo
d.vengeful_quills = Cada vez que se golpee a un objetivo emplumado, otra pluma se dispara desde \
  hacia siguiente objetivo m\u00e1s pr\u00f3ximo.

m.virulent_quills = Cerdamen Virulento
d.virulent_quills = Cada vez que se golpee a un objetivo emplumado, hay una probabilidad de \
  desencadenar una explosi\u00f3n venenosa.

m.shadow_cloak = Manto de Sombra
d.shadow_cloak = Otorga invisibilidad parcial y un aumento defensivo por tiempo limitado. El \
  Manto de Sombra se cancela si recibes da\u00f1o, ataques o si realizas cualquier otra acci\u00f3n.

m.dark_veil = Velo Oscuro
d.dark_veil = Aumenta el est\u00edmulo defensivo del manto de sombra.

m.enduring_night = Noche Perdurable
d.enduring_night = Aumenta la duraci\u00f3n del manto de sombra.

m.deadly_shadow_cloak = Manto de Sombra Mortal
d.deadly_shadow_cloak = Obt\u00e9n un poder de ataque y un bono de velocidad de ataque cuando \
  se activa el manto de sombra. El bono dura por un corto tiempo despu\u00e9s que el manto de \
  sombra expira.

m.vengeful_shadow_cloak = Manto de Sombra Vengativo
d.vengeful_shadow_cloak = Crea un campo de fuerza explosivo a tu alrededor cuando el manto de \
  sombra es interrumpido y tiene una probabilidad de aturdir a los objetivos.

m.hexing_haze = Neblina Hechizada
d.hexing_haze = Crea una miasma a tu alrededor que hechiza a cualquier objetivo dentro de ella. \
  Cada hechizo tiene un cron\u00f3metro que inflige da\u00f1o al terminarse. Por cada objetivo \
  adquirido por la neblina hechizada, la duraci\u00f3n de la miasma aumenta.

m.no_mercy = Sin Piedad
d.no_mercy = Aumenta el da\u00f1o infligido por la neblina hechizada.

m.plentiful_pain = Dolor Desbordante
d.plentiful_pain = Aumenta el bono de duraci\u00f3n de la neblina hechizada cuando se adquieran \
  objetivos adicionales.

m.haunted_haze = Neblina Embrujada
d.haunted_haze = Cualquier objetivo que muera como resultado del da\u00f1o causado por la \
  neblina embrujada, generar\u00e1 un fantasma vengativo que busca a otros objetivos y explota \
  en el impacto.

m.chaotic_haze = Neblina Ca\u00f3tica
d.chaotic_haze = Los objetivos da\u00f1ados con la neblina explosiva tienen una probabilidad de \
  recibir al azar una condici\u00f3n de estatus.


