m.interact = Tekan SERANG [[ACTION]] untuk mengaktifkan.
m.poi = Tekan SERANG [[ACTION]] untuk memeriksa.
m.talk = Tekan SERANG [[ACTION]] untuk memulai percakapan.
m.zone = Tekan SERANG [[ACTION]] untuk keluar dari zona saat ini.
m.energy = Tekan SERANG [[ACTION]] untuk menggunakan energi pada perangkat ini.
m.confirm_energy = Tekan SERANG [[ACTION]] untuk mengonfirmasi penggunaan energi.

