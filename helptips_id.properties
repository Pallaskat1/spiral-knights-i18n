           Tekan BERTAHAN [[DEFEND]] untuk menyimpan.\n\
           Tekan SENJATA SEBELUMNYA [[PREV_WEAPON]] untuk memutar searah jarum jam.\n\
           Tekan SENJATA BERIKUTNYA [[NEXT_WEAPON]] untuk memutar berlawanan arah jarum jam.

m.unlock_grim_gate = Tekan SERANG [[ACTION]] untuk menggunakan Kartu Identitas Fiendish \
