# Tutorial
#...................................................................................................

t.tut_welcome = Sinyal Darurat Terdeteksi!
m.tut_welcome = Kami telah menerima sinyal daruratmu, rekrutan. Tujuan pertamamu adalah mencapai \
  Haven, tempat kami mendirikan sebuah pos terdepan. Kamu mungkin masih sedikit pusing \
  akibat kecelakaan itu, jadi aku akan membimbingmu mempelajari dasar-dasarnya. Jalan di depan mungkin \
  berbahaya, jadi siapkan pedangmu dan tetap waspada. Semoga berhasil!

t.tut_move = Cara Bergerak
m.tut_move = Gunakan [[?MOVEMENT]] untuk bergerak.

t.tut_move_short = Cara Bergerak
m.tut_move_short = Gunakan [[?MOVEMENT]] untuk bergerak.

t.tut_clearing = Bersihkan Jalan
m.tut_clearing = Serang menggunakan [[ACTION]].

t.tut_fighting = Ada Monster di Depan!
m.tut_fighting = Arahkan mouse ke musuh dan serang dengan [[ACTION]].

t.tut_attack = Cara Menyerang
m.tut_attack = Gunakan [[ACTION]] untuk menyerang.

t.tut_shrubs = Harta Karun Tersembunyi
m.tut_shrubs = Cobalah menghancurkan semak-semak ini. Tanaman dan objek lain yang dapat dihancurkan sering kali \
  menyembunyikan harta karun.

t.tut_breakable = Balok yang Dapat Dihancurkan
m.tut_breakable = Beberapa balok seperti ini dapat dihancurkan. Serang balok-balok tersebut untuk membuka jalan.

t.tut_jelly_cubes = Monster!
m.tut_jelly_cubes = Awas! Di depan ada sekumpulan Jellycube liar. Saat kamu cukup dekat, \
  kamu akan secara otomatis membidik monster terdekat. Monster tersebut akan ditandai dengan kolom cahaya.

t.tut_hearts = Ambil Hati
m.tut_hearts = Hancurkan balok-balok ini untuk mendapatkan hati. Hati memulihkan \
  kesehatanmu. Kamu tidak dapat mengambilnya jika kesehatanmu tidak perlu dipulihkan.

t.tut_hearts_short = Memulihkan Kesehatan
m.tut_hearts_short = Jika kamu terluka, gunakan Hati untuk memulihkan kesehatanmu!

t.tut_weapons = Mengganti Senjata
m.tut_weapons = Kamu dapat berganti-ganti senjata yang sedang digunakan dengan [[NEXT_WEAPON]]. Cobalah \
  melengkapi pistolmu.

t.tut_weapons_short = Mengganti Senjata
m.tut_weapons_short = Gunakan [[NEXT_WEAPON]] untuk berganti-ganti senjata yang sedang digunakan.

t.tut_explosive2 = Bahaya: Bahan Peledak!
m.tut_explosive2 = Ganti ke Pistol menggunakan [[NEXT_WEAPON]].

t.tut_explosive = Balok Peledak
m.tut_explosive = Balok peledak akan melukai apa pun di sekitarnya saat meledak. \
  Termasuk dirimu! Hancurkan balok tersebut dari jarak aman menggunakan pistolmu.

t.tut_chromalisks = Kadal Pelompat!
m.tut_chromalisks = Anak Chromalisk di depan dapat mencambukmu dari kejauhan menggunakan lidahnya. Hindari \
  menghadap mereka saat mereka bersiap menyerang.

t.tut_switches = Sakelar Tersembunyi
m.tut_switches = Pintu sering kali dapat dibuka dengan menemukan sakelar yang tepat di dekatnya. Coba periksa \
  sekelilingmu. Sakelar terkadang tersembunyi di bawah balok.

t.tut_shield = Perisai
m.tut_shield = Tekan dan tahan [[DEFEND]] untuk menangkis serangan.

t.tut_dash = Menghindar dengan Cepat
m.tut_dash = Hindari kerusakan dari serangan monster dengan menekan [[DODGE]].

t.tut_bash = Hantaman Perisai
m.tut_bash = Saat perisaimu terisi penuh, tekan [[SHIELD_BASH]] untuk menghantam dan membuat monster terkena stun!

t.tut_lever = Latihan Membidik
m.tut_lever = Pintu sering kali dapat dibuka dengan menemukan sakelar yang tepat. \
  Cobalah menembak sakelar ini menggunakan pistolmu!

t.tut_lever_alt = Latihan Membidik
m.tut_lever_alt = Sakelar dapat membuka pintu. \
  Cobalah melempar pot atau menembak sakelar ini menggunakan pistolmu!

t.tut_buttons = Tombol Tersembunyi
m.tut_buttons = Tidak semua tombol terlihat jelas. Coba periksa sekelilingmu! \
  Tombol terkadang tersembunyi di bawah balok.

t.tut_treasure = Balok Harta Karun
m.tut_treasure = Balok harta karun selalu menjadi temuan yang menguntungkan! Balok ini berisi koin dan item berguna.

t.tut_miniboss = Terus Maju!
m.tut_miniboss = Kamu hampir sampai di Kamp Penyelamatan. Larilah melewati penghalang energi di depan!

t.tut_victory = Berhasil!
m.tut_victory = Kamu berhasil! Teruslah berjalan ke depan untuk memasuki Kamp Penyelamatan.

#t.tut_golddoor = Temukan Kunci Emas
#m.tut_golddoor = Pintu ini membutuhkan kunci untuk dibuka. Cari ikon kunci di peta minimu di \
#sudut kanan atas layar.
t.tut_golddoor = Pintu Emas
m.tut_golddoor = Temukan Kunci Emas untuk membuka pintu ini!

#t.tut_goldkey = Kunci Emas
#m.tut_goldkey = Ambil Kunci Emas dan gunakan untuk membuka Pintu Emas.
t.tut_goldkey = Kunci Emas
m.tut_goldkey = Ambil dan gunakan untuk membuka Pintu Emas!

t.tut_ghost = Balok Hantu
m.tut_ghost = Balok Hantu akan menghancurkan semua balok yang terhubung dengannya, bahkan balok yang tidak dapat dihancurkan!

m.tut_pot_short = Ambil dan lempar!

m.tut_target = Tembak untuk melanjutkan!

t.tut_charge = Serangan Bermuatan
m.tut_charge = Tahan [[?ACTION]] hingga serangan terisi penuh, lalu lepaskan untuk menyerang!

t.tut_important_object = Objek Misterius
m.tut_important_object = Ambil untuk melanjutkan!

t.statue_secret = Patung Berat
m.statue_secret = Patung berat dapat diangkat dan diletakkan di atas pelat tekanan \
	untuk mengungkap rahasia dan harta karun!

## Training Grounds Lobby
#...................................................................................................

t.tglobby_vitapod = Vitapod
m.tglobby_vitapod = Vitapod meningkatkan kesehatan maksimum untuk sementara hingga kamu kembali ke kota.

t.tglobby_equip = Stasiun Arsenal
m.tglobby_equip = Saat berada di Clockworks, gunakan Stasiun Arsenal untuk mengganti perlengkapanmu.

## Advanced Training
#...................................................................................................

t.tg_welcome = Selamat Datang!
m.tg_welcome = Selamat datang di Lapangan Pelatihan, rekrutan. Di bagian Clockworks yang terbengkalai ini, \
  kamu akan menemukan area yang kami bangun untuk melatihmu dalam seni menghindari kematian yang \
  mengerikan. Jadi, perhatikan tips berguna ini, siapkan senjatamu, \
  dan mulailah bergerak!

t.tg_doors = Pintu Terbukalah
m.tg_doors = Pintu dapat dibuka dengan berbagai cara.

t.tg_pots = Angkat Objek
m.tg_pots = Beberapa objek dapat diangkat dan digunakan, atau bahkan dilempar melintasi ruangan. \
  Cobalah melempar pot ke arah sakelar itu.

t.tg_heat = Apa Itu Panas?
m.tg_heat = Kumpulkan Bara Panas untuk menaikkan level perlengkapanmu saat mencapai lift.
t.tg_heat_short = Panas
m.tg_heat_short = Kumpulkan Panas untuk menaikkan level perlengkapanmu!

t.tg_shield = Menggunakan Perisai
m.tg_shield = Tekan [[DEFEND]] untuk mengangkat perisaimu dan menangkis serangan.

t.tg_end = Berhasil!
m.tg_end = Hei, kamu berhasil sampai di sini! Bagus sekali, sungguh. Kamu baru saja menghemat banyak \
  pekerjaan administrasi untukku, jadi terima kasih. Semoga para retrode itu tidak terlalu mengejutkanmu. \
  Pergilah ke lift dan kita nyatakan ekspedisi ini selesai.

## Training Grounds 1
#...................................................................................................

t.tg1_welcome = Selamat Datang!
m.tg1_welcome = Selamat datang di Lapangan Pelatihan, rekrutan. Di bagian Clockworks yang \
  terbengkalai ini, kamu akan menemukan area yang kami bangun untuk melatihmu dalam seni \
  menghindari kematian yang mengerikan. Jadi, perhatikan tips berguna ini, siapkan senjatamu, \
  dan mulailah bergerak!

t.tg1_barrier = Penghalang Gaya
m.tg1_barrier = Jika kamu mulai kewalahan, gunakan penghalang gaya seperti yang ada di sebelah \
  kananmu untuk beristirahat sejenak. Monster dan proyektil tidak dapat melewatinya.

t.tg1_shield_1 = Menggunakan Perisai
m.tg1_shield_1 = Mari kita bahas salah satu alat penting untuk bertahan hidup sejak awal: perisaimu. \
  Tahan [[DEFEND]] untuk bertahan menggunakan perisaimu. Saat bertahan, kamu akan sepenuhnya \
  menahan sebagian besar kerusakan dari segala arah. Anak-anak gun puppy di lorong berikutnya \
  seharusnya tidak menjadi masalah selama kamu tetap bertahan saat berlari melewati mereka.

t.tg1_shield_2 = Pemulihan Perisai
m.tg1_shield_2 = Saat perisaimu menyerap kerusakan, warnanya akan berubah dari hijau menjadi merah \
  dan akhirnya hancur. Setelah hancur, kamu tidak dapat bertahan sampai perisai pulih kembali, \
  jadi berhati-hatilah!

t.tg1_crowns = Crown
m.tg1_crowns = Crown adalah mata uang Clockworks. Kamu dapat menggunakannya untuk membeli berbagai \
  macam barang, seperti senjata dan zirah baru. Saat bermain bersama orang lain, setiap anggota \
  grup akan mendapatkan Crown setiap kali ada anggota yang mengambilnya.

t.tg1_button = Tombol Tersembunyi
m.tg1_button = Jika sebuah pintu tidak mau terbuka, carilah tombol lantai tersembunyi di bawah \
  balok untuk membukanya.

t.tg1_heat = Panas Menaikkan Level Perlengkapanmu
m.tg1_heat = Kamu mungkin sudah melihat monster meninggalkan bara kecil seperti ini. Bara tersebut \
  memberimu Panas. Saat meteran Panas terisi, nyala api di samping kesehatanmu akan \
  membesar. Jika kamu berhasil mencapai pintu keluar tanpa mati, Panas akan diterapkan pada senjata \
  dan zirahmu. Seiring waktu, level perlengkapan tersebut akan meningkat dan membuatnya lebih kuat. \
  Saat bermain bersama orang lain, setiap anggota grup akan mendapatkan Panas setiap kali ada \
  anggota yang mengambil bara.

t.tg1_overgrown_1 = Sampai Jumpa di Seberang
m.tg1_overgrown_1 = Area-area berikutnya kuserahkan kepadamu. Tempat-tempat itu cukup dipenuhi \
  tumbuhan liar, jadi awasi monster yang bersembunyi di rerumputan tinggi. Beberapa di antaranya \
  cukup lihai bersembunyi dalam bayangan. Membayangkannya saja sudah membuatku merinding.

t.tg1_overgrown_2 = Selamat Datang Kembali!
m.tg1_overgrown_2 = Sepertinya kamu tahu cara menjaga dirimu sendiri. Bagus, karena area terakhir \
  sudah dekat.

t.tg1_partypad_1 = Pelat Grup
m.tg1_partypad_1 = Masuklah ke ruangan di depan yang memiliki pelat grup. Kamu hampir selesai.

t.tg1_partypad_2 = Injak Aku!
m.tg1_partypad_2 = Ini adalah pelat grup. Tombol lantai besar ini hanya akan aktif ketika semua \
  anggota grup berdiri di atasnya. Pelat ini sering kali membuka pintu, tetapi terkadang ada \
  hal lain yang harus dilakukan...

t.tg1_end = Berhasil!
m.tg1_end = Hei, kamu berhasil sampai di sini! Bagus sekali, sungguh. Kamu baru saja menghemat banyak \
  pekerjaan administrasi untukku, jadi terima kasih. Semoga para wolver itu tidak terlalu \
  mengejutkanmu. Pergilah ke lift dan kita nyatakan ekspedisi ini selesai.


## Training Grounds 2
#...................................................................................................

t.tg2_welcome = Selamat Datang!
m.tg2_welcome = Selamat datang kembali di Lapangan Pelatihan. Area ini dirancang untuk mengajarkanmu \
  tentang item khusus yang ditemukan di dalam Clockworks, yang disebut "item pickup".

t.tg2_pickups = Apa Itu Item Pickup?
m.tg2_pickups = Item pickup adalah item yang ditempatkan pada sabuk item yang terlihat di bagian atas layar. \
  Item ini tidak dapat dibawa keluar dari Clockworks dan akan berubah menjadi debu begitu kamu kembali \
  ke kota. Anggap saja item ini sebagai peningkat kekuatan dan item bonus yang bisa kamu gunakan sesuka hati.

t.tg2_vials_1 = Botol Ramuan
m.tg2_vials_1 = Botol ramuan adalah salah satu jenis item pickup. Saat dilempar, botol ini akan melepaskan \
  zat alkimia di dalamnya dan menciptakan ledakan elemen. Kamu bisa mencobanya di ruangan berikutnya.

t.tg2_vials_2 = Menggunakan Botol Ramuan
m.tg2_vials_2 = Ruangan di depan akan memberimu kesempatan untuk mencoba menggunakan botol ramuan. \
  Cukup tekan tombol angka (1 hingga 5) yang sesuai dengan item pickup pada sabuk item di bagian atas \
  layar. Dengan begitu, botol ramuan akan siap digunakan. Tekan tombol serang untuk melemparkannya.

t.tg2_vials_3 = Lanjut...
m.tg2_vials_3 = Sekarang setelah kamu memahami cara menggunakan item pickup, mari terapkan apa yang \
  telah kamu pelajari dalam situasi pertempuran.

t.tg2_crystal = Balok Kristal
m.tg2_crystal = Balok kristal mirip dengan balok yang dapat dihancurkan, tetapi saat dihancurkan, balok ini \
  juga akan menghancurkan balok kristal lain dengan warna yang sama yang terhubung dengannya.

t.tg2_shield = Ingat Perisaimu
m.tg2_shield = Di depan ada kesempatan bagus lainnya untuk menggunakan perisaimu. Ingat, kamu \
  dapat bertahan menggunakan perisai dengan menekan dan menahan tombol [[DEFEND]].

t.tg2_end = Berhasil!
m.tg2_end = Kerja bagus! Setelah berhasil melewati Lapangan Pelatihan sekali lagi, \
  seharusnya kamu mulai menguasai berbagai hal. Tak lama lagi, kamu akan menjelajahi \
  kedalaman Clockworks sendirian.


## Training Grounds 3
#...................................................................................................

t.tg3_welcome = Selamat Datang!
m.tg3_welcome = Selamat datang kembali di Lapangan Pelatihan. Level terakhir ini akan mengajarkan beberapa \
  hal penting terakhir yang perlu kamu ketahui sebagai penjelajah Clockworks. Naiki tanjakan di depan \
  dan mari kita mulai!

t.tg3_charge_1 = Kekuatan Tersembunyi
m.tg3_charge_1 = Spiral Knights mampu melepaskan kekuatan tersembunyi yang terkunci di dalam senjata \
  mereka, yang disebut "serangan bermuatan". Serangan bermuatan lebih kuat daripada serangan biasa \
  dan sering kali dapat menghasilkan efek khusus.

t.tg3_charge_2 = Melakukan Serangan Bermuatan
m.tg3_charge_2 = Untuk melakukan serangan bermuatan dengan pedang atau pistol, tekan dan tahan SERANG. \
  Setelah menyerang, kamu akan mulai mengisi daya senjatamu. Setelah daya terisi penuh, \
  lepaskan SERANG untuk melancarkan serangan bermuatan.

t.tg3_charge_3 = Bersiap untuk Bertempur
m.tg3_charge_3 = Sekarang setelah kamu mengetahui cara melakukan serangan bermuatan, mari terapkan \
  kemampuan itu dalam pertempuran yang lebih sulit. Isi daya senjatamu dan lepaskan pada saat yang \
  tepat ketika musuh berada dalam posisi rentan. Semoga berhasil!

t.tg3_ghost = Balok Hantu
m.tg3_ghost = Balok Hantu akan menghancurkan semua balok yang terhubung dengannya, bahkan balok yang tidak dapat dihancurkan!

t.tg3_lift_1 = Angkat Objek
m.tg3_lift_1 = Saatnya memamerkan kekuatanmu! Beberapa objek yang kamu temui dapat diangkat, \
  dibawa, atau dilempar. Dekati pot tanah liat ini dan tekan SERANG saat ikon aksi muncul.

t.tg3_lift_2 = Ini Cara Melemparnya...
m.tg3_lift_2 = Pintu di depan terkunci, tetapi kamu bisa membukanya dengan menekan sakelar di sebelah kiri. \
  Cobalah melempar pot tanah liat ke arah sakelar tersebut. Pot sangat berguna untuk keperluan seperti ini \
  jika kamu tidak membawa senjata api.

t.tg3_goldkey = Kunci Emas
m.tg3_goldkey = Kunci Emas adalah jenis objek lain yang dapat diangkat. Ambil kunci tersebut dan gunakan \
  pada Pintu Emas. Setiap Pintu Emas yang kamu temukan di suatu level pasti memiliki Kunci Emas \
  di suatu tempat.

t.tg3_final = Tantangan Terakhir
m.tg3_final = Hanya tersisa satu ruangan lagi sebelum kamu mencapai lift untuk keluar dari sini. Ingatlah \
  semua yang telah kamu pelajari sejauh ini dan kamu pasti bisa melewatinya... setidaknya secara teori. \
  Usahakan jangan sampai mati, ya?

t.tg3_end = Berhasil!
m.tg3_end = Sepertinya kamu sudah menguasai dasar-dasarnya dengan baik. Kurasa kamu siap bergabung \
  dengan rekrutan lainnya di Sparrow Gate. Di sana, kamu akan belajar cara bekerja sama dalam \
  grup. Kini ada banyak rekrutan di luar sana yang mengandalkanmu. Kerja bagus!

## Final Test
#...................................................................................................
t.final_test = Ujian Terakhir
m.final_test = Kamu telah sampai sejauh ini, Knight, tetapi ujian akhirmu akan membutuhkan pemikiran cepat \
  dan gerakan kaki yang lebih cepat lagi.

t.pressure_pads = Pelat Tekanan
m.pressure_pads = Tombol khusus ini hanya akan aktif jika ada sesuatu yang menekannya. \
  Cobalah gunakan patung itu untuk menekan salah satunya.

## Advanced Training Gym
#...................................................................................................
t.atg_treasure = Balok Harta Karun:
m.atg_treasure = Kotak harta karun HIJAU berisi Crown dan item berguna lainnya! \
  Kotak harta karun MERAH lebih langka daripada balok hijau dan berisi item yang lebih bagus! \
  Kotak HATI berisi hati yang akan memulihkan kesehatanmu.

t.atg_healpad = Generator Hati:
m.atg_healpad = Berdirilah di atas GENERATOR HATI untuk memulihkan kesehatanmu!

t.atg_healthcap = Kapsul Kesehatan:
m.atg_healthcap = Gunakan KAPSUL KESEHATAN dari bilah slot cepat untuk memulihkan kesehatan.

t.atg_vitapods = Vitapod:
m.atg_vitapods = Ambil VITAPOD untuk meningkatkan kesehatan maksimum sementara hingga kamu kembali ke Haven.

t.atg_crowns = Crown:
m.atg_crowns = CROWN digunakan untuk membeli item dan membayar layanan lainnya.

t.atg_heat = Panas:
m.atg_heat = Ambil PANAS untuk menaikkan level itemmu dan membuatnya semakin kuat seiring waktu!

t.atg_vials = Botol Ramuan:
m.atg_vials = Berikan berbagai efek status kepada musuh dengan melemparkan BOTOL RAMUAN ke arah mereka!

t.atg_blocks = Balok:
m.atg_blocks = Pukul balok yang dapat dihancurkan untuk menghancurkannya!

t.atg_ublocks = Balok yang Tidak Dapat Dihancurkan:
m.atg_ublocks = Beberapa balok tidak dapat dihancurkan dengan serangan biasa.

t.atg_gblocks = Balok Hantu:
m.atg_gblocks = Memukul BALOK HANTU dapat menghilangkan seluruh bidang balok, termasuk balok yang tidak dapat dihancurkan!

t.atg_eblocks = Balok Peledak:
m.atg_eblocks = BALOK PELEDAK akan melukai apa pun di sekitarnya jika dipukul.

t.atg_teblocks = Balok Peledak Berwaktu:
m.atg_teblocks = BALOK PELEDAK BERWAKTU akan menghitung mundur hingga 0 sebelum meledak dan menimbulkan kerusakan.

t.atg_blocks2 = Interaksi Balok:
m.atg_blocks2 = Balok bahkan dapat memengaruhi satu sama lain!

t.atg_cblocks = Balok Kristal:
m.atg_cblocks = Pukul BALOK KRISTAL untuk menghancurkan balok kristal lain dengan warna yang sama.

t.atg_traps = Jebakan:
m.atg_traps = Perhatikan langkahmu! Tunggu hingga JEBAKAN tidak aktif sebelum melewatinya.

t.atg_retraps = Mengubah Arah Jebakan:
m.atg_retraps = Beberapa sakelar dapat membalik arah gelombang jebakan. \
  Sekarang kamu dapat melewati jebakan dari kedua arah!

t.atg_togtraps = Mematikan Jebakan:
m.atg_togtraps = Beberapa jebakan selalu aktif. Temukan sakelar untuk mematikannya!

t.atg_statustraps = Jebakan Efek Status:
m.atg_statustraps = Awas! Beberapa jebakan dapat menimbulkan kerusakan DAN memberikan efek status yang merugikan.

t.atg_shield = Menggunakan Perisaimu:
m.atg_shield = Terkepung? Gunakan PERISAI untuk menghalau musuh yang menyerang.

t.atg_pots = Melempar Objek:
m.atg_pots = Beberapa objek, seperti pot, dapat dilempar ke arah sakelar DAN musuh!

t.atg_button = Tombol dan Pintu:
m.atg_button = Berdiri di atas TOMBOL dapat membuka pintu yang terkunci.

t.atg_switch = Memukul Sakelar:
m.atg_switch = Sakelar berada di luar jangkauan? Lempar pot atau tembak dengan senjata api!

t.atg_togswitch = Mengubah Posisi Sakelar:
m.atg_togswitch = Sakelar dapat membuka DAN menutup pintu.

t.atg_pplate = Pintu dan Patung:
m.atg_pplate = Angkat dan letakkan PATUNG di atas PELAT TEKANAN untuk menjaga pintu tetap terbuka.

t.atg_torto = Waspadalah terhadap Tortodrone!
m.atg_torto = Tortodrone dapat ditemukan berpatroli di Clockworks. Mereka tidak akan \
  menyerang kecuali diserang terlebih dahulu. Namun, berhati-hatilah: begitu mereka murka, \
  mereka menjadi lawan yang mengerikan dan mematikan.

t.atg_astation = Stasiun Arsenal:
m.atg_astation = Stasiun Arsenal memungkinkanmu mengganti perlengkapan dan mengakses set perlengkapan \
  di luar tempat aman seperti Terminal dan Subtown!

## PvP - Lockdown
#...................................................................................................
t.lock_howto = Cara Bermain:
m.lock_howto = * Ada beberapa Titik Kontrol yang tersebar di seluruh peta \n\
* Menguasai dan mempertahankan Titik Kontrol akan meningkatkan skor timmu seiring waktu \n\
* Untuk menguasai Titik Kontrol, berdirilah di atasnya hingga warnanya berubah menjadi warna timmu \n\
* Tim dengan skor tertinggi saat pertandingan berakhir akan MENANG! \n\

t.lock_guard = Penjaga:
m.lock_guard = Lindungi dan pulihkan kesehatanmu serta rekan satu tim dari kerusakan menggunakan Perisai Guardian! \n\
\n\
Jauhkan musuh dengan resistansi kerusakan yang lebih tinggi, serta serang menggunakan pedang dan bom yang lebih cepat!

t.lock_recon = Pengintai:
m.lock_recon = Jadilah tak terlihat dan tandai musuh agar menerima kerusakan lebih besar menggunakan Medan Disrupsi! \n\
\n\
Buat musuh kewalahan dengan waktu pengisian senjata yang lebih singkat serta senjata api dan bom yang lebih cepat!

t.lock_striker = Penyerang:
m.lock_striker = Lampaui siapa pun dengan Dash Striker, hantam mereka dengan keras, lalu tinggalkan mereka jauh di belakang! \n\
\n\
Jadilah pemberi kerusakan terbaik dengan peningkatan keseluruhan kerusakan serangan dan pedang tercepat!

