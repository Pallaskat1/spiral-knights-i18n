t.danger_module = Ruang Berbahaya!
m.danger_module = Peringatan! Jalur di balik titik ini jauh \
  lebih berbahaya daripada yang kamu perkirakan untuk level ini. Setelah \
  masuk, kamu tidak akan bisa kembali sampai \
  menyelesaikan tantangan di dalamnya.\n\
  \n\
  Namun, jika kamu berhasil keluar sebagai pemenang, \
  keberanianmu akan mendapatkan imbalan. Masuklah \
  dengan risiko ditanggung sendiri!

t.event_module = Ruangan Misterius!
m.event_module = Peringatan! Ada tempat menarik yang belum teridentifikasi \
  di balik gerbang ini. Setelah masuk, kamu tidak akan bisa kembali \
  sampai menyelesaikan tantangan di dalamnya.\n\
  \n\
  Namun, jika kamu berhasil keluar sebagai pemenang, \
  keberanianmu akan mendapatkan imbalan. Masuklah \
  dengan risiko ditanggung sendiri!

t.event_locked_module = Ruangan Misterius Bonus!
m.event_locked_module = Peringatan! Ada tempat menarik yang belum teridentifikasi \
  di balik gerbang ini. Setelah masuk, kamu tidak akan bisa kembali \
  sampai menyelesaikan tantangan di dalamnya.\n\
  \n\
  Namun, jika kamu berhasil keluar sebagai pemenang, \
