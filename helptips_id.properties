  Pilih anggota grupmu dengan bijak!
m.activate_grim_gate = Grim Gate akan aktif ketika semua anggota grup yang masih hidup \
  berdiri di atasnya.
m.need_key_grim_gate = Grim Gate membutuhkan Kartu Identitas Fiendish untuk diaktifkan.

#
# Loading messages
#...................................................................................................

m.loading = Memuat...{0}%
m.connecting = Menghubungkan...{0}%

t.loading0 = Tekan [[TOGGLE_HELP]] untuk melihat kontrol
m.loading0 = Kontrol dasar permainan dapat dilihat kapan saja dengan menekan [[TOGGLE_HELP]].
#i.loading0 = tip_f1.png

t.loading1 = Dunia selalu berubah...
m.loading1 = Level Clockworks di bawah permukaan berganti secara real-time. Kamu tidak akan pernah \
  melihat semua level yang ditawarkan suatu dunia dalam satu perjalanan. Hanya petualang sejati yang akan \
  menemukan semua rahasianya!
#i.loading1 = tip_world.png

t.loading2 = Berpakaianlah untuk meraih kemenangan
m.loading2 = Zirah dan helm tidak hanya memberikan pertahanan fisik, tetapi juga dapat \
  melindungimu dari efek status. Kombinasi yang tepat akan sangat \
  meningkatkan peluangmu untuk bertahan hidup.
#i.loading2 = tip_armor.png

t.loading3 = Bangkitkan anggota grup yang gugur
m.loading3 = Kamu dapat membangkitkan pemain lain dengan mengeklik potret mereka \
  dan memberikan Spark of Life kepada mereka.
#i.loading3 = tip_rez.png

t.loading4 = Monster Langka
m.loading4 = Monster langka yang menawarkan item unik berkeliaran di Clockworks. Apakah kamu sudah \
  menemukan salah satunya?
#i.loading4 = tip_raremonster.png

t.loading5 = Bertualang bersama teman
m.loading5 = Kamu dapat melihat aktivitas teman-temanmu dengan mengeklik tombol sosial di \
  sudut kiri bawah layar. Kamu bahkan dapat langsung bergabung dengan mereka jika masih ada ruang \
  dalam grup mereka.
#i.loading5 = tip_exclamation.png

t.loading6 = Efek status: Racun
m.loading6 = Jika kamu terkena racun, kamu tidak akan bisa memulihkan kesehatanmu. Hindari menerima \
  terlalu banyak kerusakan sampai efeknya hilang.
#i.loading6 = tip_poison.png

t.loading7 = Efek status: Api
m.loading7 = Jika tubuhmu terbakar, kamu akan terus menerima kerusakan secara berkala sampai api \
  padam. Namun, itu tidak akan menghentikanmu menyebarkan api ke monster. Dekati mereka dan bagikan \
  kobaran apinya!
#i.loading7 = tip_fire.png

t.loading8 = Efek status: Beku
m.loading8 = Jika kamu membeku, kamu tidak akan bisa bergerak atau berputar, tetapi masih bisa \
  menyerang. Jika sedang bertualang bersama orang lain, mintalah mereka menghancurkan lapisan es \
  dengan serangan terbaik mereka.
#i.loading8 = tip_freeze.png

t.loading9 = Efek status: Stun
m.loading9 = Jika kamu terkena stun, gerakan dan seranganmu akan menjadi lebih lambat dari biasanya. \
  Hal ini dapat membuatmu menjadi sasaran empuk bagi monster besar yang biasanya bisa kamu hindari, \
  jadi berhati-hatilah!
#i.loading9 = tip_stun.png

t.loading10 = Efek status: Sengatan Listrik
m.loading10 = Jika kamu terkena sengatan listrik, tubuhmu akan mengalami kejang secara berkala akibat \
  aliran listrik yang menjalarinya. Hal ini akan mengganggu apa pun yang sedang kamu lakukan.
#i.loading10 = tip_shock.png

t.loading11 = Efek status: Kutukan
m.loading11 = Jika kamu terkena kutukan, beberapa senjatamu akan ditandai oleh kutukan tersebut. \
  Mencoba menggunakan senjata yang terkena kutukan akan membuatmu menerima kerusakan.
#i.loading11 = tip_curse.png

t.loading12 = Tekan F2 untuk mengirim laporan bug
m.loading12 = Jika kamu mengalami masalah apa pun, tekan F2 untuk mengirim laporan bug.
#i.loading12 = tip_f2.png

t.loading13 = Mengeluarkan anggota grup
m.loading13 = Jika kamu adalah pemimpin grup, kamu dapat mengeluarkan pemain mana pun dari grupmu. \
  Klik ikon status pemain yang ingin kamu keluarkan, lalu pilih "Keluarkan dari Grup".
#i.loading13 = tip_party.png

t.loading14 = Keamanan Kata Sandi
m.loading14 = Jangan bagikan informasi akunmu kepada siapa pun. Game Master tidak akan pernah \
  meminta kata sandimu.
#i.loading14 = tip_exclamation.png

t.loading15 = Mendapatkan teman baru
m.loading15 = Untuk menambahkan teman ke daftar temanmu, cukup klik pemain tersebut lalu \
  pilih "Tambahkan sebagai Teman". Untuk melihat daftar teman dan aktivitas mereka, klik \
  tombol Sosial.
#i.loading15 = tip_exclamation.png

t.loading16 = Ingatlah untuk menangkis!
m.loading16 = Menggunakan perisai dapat membantumu menghindari kerusakan sepenuhnya, jadi pastikan \
  untuk menggunakannya! Tekan "[[DEFEND]]" untuk bertahan. Saat perisai menerima kerusakan, warnanya \
  akan berubah menjadi merah dan akhirnya hancur. Perisai harus pulih terlebih dahulu sebelum dapat digunakan lagi.
#i.loading16 = tip_exclamation.png

t.loading17 = Bergabunglah dengan komunitas!
m.loading17 = Kunjungi forums.spiralknights.com. Jadilah bagian dari percakapan!
#i.loading17 = tip_exclamation.png

t.loading18 = Bantu mendokumentasikan Clockworks!
m.loading18 = Kunjungi wiki.spiralknights.com, tempat para petualang pemberani mendokumentasikan \
  penemuan mereka di kedalaman Clockworks!
#i.loading18 = tip_exclamation.png

