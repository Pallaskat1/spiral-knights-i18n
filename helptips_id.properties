t.battle_arena_1 = Arena Pertempuran
m.battle_arena_1 = Selamat datang di arena pertempuran! Satu-satunya aturan adalah kamu harus bertarung setidaknya \
  sekali untuk melanjutkan. Jika kamu berhasil meraih kemenangan, kamu bebas memutuskan apakah ingin bertarung demi \
  kejayaan yang lebih besar!

m.battle_arena_2 = Kemenangan ada di tanganmu! Namun, apakah para pejuang ini akan meninggalkan aula suci \
  pertempuran penuh kejayaan ini dan dilupakan, atau terus maju menghadapi lawan yang lebih mengerikan lagi \
  demi meraih hadiah dari Raja Arena?

m.battle_arena_3 = Sungguh, kamu termasuk salah satu pejuang terhebat yang pernah \
  hidup! Hadiah dari Raja Arena kini siap kamu raih!

