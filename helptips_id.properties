## RDG Intros
#...................................................................................................

m.battle_arena = Setiap tahap arena pertempuran lebih menantang daripada tahap sebelumnya, tetapi kemenangan \
	selalu memberimu kesempatan untuk mengakhiri pertarungan dan melanjutkan perjalanan. Satu-satunya aturan adalah semua orang \
	harus bertarung setidaknya sekali!

t.clockwork_tunnels = Terowongan Clockwork
m.clockwork_tunnels = Ada suara dan energi aneh yang memancar dari Clockworks. \
  Jelajahi kedalamannya dan ungkap misterinya, tetapi berhati-hatilah agar tidak terjebak dalam \
  mekanismenya.

t.devilish_drudgery = Pekerjaan Berat Iblis
m.devilish_drudgery = Para bawahan kantor Dunia Bawah adalah gerombolan yang tidak puas dan akan menyerang \
	siapa pun yang tidak berwenang begitu terlihat. Meski tidak terlalu berbahaya jika sendirian, mereka \
	bisa menjadi jauh lebih berbahaya jika salah satu Bos Tambang mereka berhasil menguasai mereka. \
	Berhati-hatilah!

t.graveyard = Pemakaman
m.graveyard = Pemakaman adalah tempat yang tidak wajar, dunia di antara dunia tempat roh-roh gelap \
	berkumpul, haus akan kehidupan setiap jiwa yang masih hidup dan harus melewatinya. Kamu harus bergegas \
	dan menemukan jalan keluar secepat mungkin sebelum para hantu ini terbangun dan mulai memburumu!

t.lichenous_lair = Sarang Lichen
m.lichenous_lair = Lichen adalah jenis slime asing yang aneh, yang diperkirakan tiba di \
	dunia ini melalui sebuah meteor besar. Koloni bersel tunggal sebagian besar tidak berbahaya, tetapi mereka \
	dapat dengan cepat bergabung menjadi musuh yang sangat mengerikan. Jangan biarkan mereka menyatu!

t.treasure_vault_sky_islands_day = Gudang Harta Karun
m.treasure_vault_sky_islands_day = Bersantailah! Hirup aroma bunga. Nikmati hari yang cerah. Kamu pantas \
	mendapatkannya!

t.wolver_den = Sarang Wolver
m.wolver_den = Wolver adalah binatang kawanan predator yang sangat mudah beradaptasi, dengan naluri berburu yang hanya \
	tertandingi oleh refleksnya yang cepat. Mereka mempermainkan mangsanya dengan bergerak lincah ke sana kemari, lalu akhirnya menyerang dari \
	belakang. Siapkan pedangmu.

t.candlestick_keep = Benteng Lilin
m.candlestick_keep = Waspadalah terhadap Grimalkin mengerikan yang mengintai dalam kegelapan! Para hantu terkutuk ini \
	tidak dapat dihancurkan, dan satu-satunya hal yang benar-benar mereka takuti adalah cahaya dari \
	lilin ajaib. Nyalakan lilin-lilin itu dengan bara dan berlindunglah dalam cahaya terangnya.

