m.haven_desc = Uma cidade pac\u00edfica que serve de lar aos Strangers. Esses saqueadores oferecem   santu\u00e1rio aos Spiral Knights em troca dos tesouros que eles adquirem ao investigar os   Clockworks. Haven tamb\u00e9m \u00e9 densamente povoada por snipes, pequenas aves roli\u00e7as com um   curioso modo de locomo\u00e7\u00e3o.

m.rescue_camp_desc = O Acampamento de Resgate serve como ref\u00fagio para os Spiral Knights rec\u00e9m-chegados.   Ele oferece alguns confortos b\u00e1sicos, al\u00e9m de uma instala\u00e7\u00e3o de treinamento para preparar os   recrutas para sua jornada at\u00e9 Haven.
