b.spin = PUTAR RODANYA!
t.vip = Layanan Khusus C.U.B.E. Club
b.vip_spin = Putar {0}x
t.vip_tos = Perjanjian Keanggotaan
m.vip_tos = <html><font color='white'>\
            <font size=3><b>Perjanjian Keanggotaan C.U.B.E. Club</b> ini merupakan dokumen hukum yang mengikat \
            antara pihak yang bertanda tangan di bawah ini (selanjutnya disebut "Knight"), \
            Golden Casino Holdings LLC (selanjutnya disebut "Kasino"), \
            dan seluruh komunitas slime (selanjutnya disebut "slime").<br><br> \
            </font> \
            <font size=5><b>I. Syarat dan Ketentuan Umum</b></font><br> \
            <font size=4> \
            &nbsp;&nbsp;1. Keanggotaan C.U.B.E. Club hanya untuk penggunaan pribadi dan tidak \
            dapat dialihkan kepada Knight lain, Devilite, atau makhluk Clockwork lainnya.<br> \
            &nbsp;&nbsp;2. Menjual akses untuk menggunakan kesempatan putarmu dilarang.<br> \
            &nbsp;&nbsp;3. Pastikan lengan dan kakimu selalu berada di dalam Kasino.<br> \
            &nbsp;&nbsp;4. Mohon jangan menjatuhkan barang ke dalam Inti.<br> \
            </font> \
            <font size=5><b>II. Deskripsi Manfaat</b></font><br> \
            <font size=4> \
            &nbsp;&nbsp;1. Manfaat yang diberikan beragam dan dapat berubah kapan saja.<br> \
            &nbsp;&nbsp;2. Akses ke ruang santai tidak dijamin dan bergantung pada ketersediaan.<br> \
            &nbsp;&nbsp;3. Buffalo Wings tidak termasuk.<br> \
            &nbsp;&nbsp;4. Semua perselisihan akan dimediasi oleh manajer lantai Kasino dan \
            semua keputusan bersifat final.<br> \
            </font> \
            <font size=4><b>III. Kemenangan, Pembayaran, dan Biaya</b></font><br> \
            <font size=3> \
            &nbsp;&nbsp;1. Kemenangan dapat dibayarkan dalam bentuk Koin Slime Emas atas kebijakan \
            manajer lantai Kasino.<br> \
            &nbsp;&nbsp;2. Saat ini tidak ada biaya tambahan yang dikenakan.<br> \
            </font> \
            <font size=4><b>IV. Hadiah Promosi</b></font><br> \
            <font size=3> \
            &nbsp;&nbsp;1. Promosi penjualan: Jika ada, harga khusus anggota akan \
            ditampilkan dengan jelas pada antarmuka toko.<br> \
            &nbsp;&nbsp;2. Toko Hadiah berhak mengubah, memodifikasi, menghentikan sementara, \
            atau mengakhiri promosi ini kapan saja, dengan alasan apa pun, tanpa pemberitahuan \
            kepada pengguna akhir. Jangan mengeluh.<br> \
            </font> \
            <font size=3><b>V. Pembatasan dan Ketentuan Penggunaan</b></font><br> \
            <font size=2> \
            &nbsp;&nbsp;1. Sebagai syarat penggunaan layanan klub, kamu setuju untuk tidak menggunakan \
            fasilitas atau antarmuka klub untuk tujuan apa pun yang melanggar hukum atau dilarang oleh \
            syarat, ketentuan, dan pemberitahuan dalam Perjanjian Keanggotaan ini atau Perjanjian Lisensi \
            yang relevan, maupun untuk hal apa pun yang secara umum dianggap tidak pantas oleh para slime.<br> \
            &nbsp;&nbsp;2. Ketentuan Layanan Spiral Knights mengesampingkan ketentuan ini jika \
            berlaku.<br> \
            &nbsp;&nbsp;3. Knight menyetujui semua syarat dan ketentuan yang tercantum di sini, serta \
            yang tidak tercantum di sini. Para slime dapat menambahkan ketentuan baru kapan saja yang \
            mewajibkan kepatuhan penuh secara retroaktif.<br> \
            </font> \
            <font size=3><b>VI. Penghentian Akun</b></font><br> \
            <font size=2> \
            &nbsp;&nbsp;1. Kasino berhak menghentikan keanggotaanmu jika kamu melanggar \
            syarat atau ketentuan apa pun, baik yang dirumuskan secara jelas maupun samar, yang tercantum \
            di sini atau dibuat pada saat pelanggaran terjadi. Kamu sudah diperingatkan.<br> \
            </font> \
            <font size=3><b>VII. Penyangkalan Jaminan; Pembatasan \
            Tanggung Jawab</b></font><br> \
            <font size=2> \
            &nbsp;&nbsp;1. Kamu menggunakan Kasino atas risiko sendiri. Kamu mengekliknya, kamu \
            menanggung akibatnya.<br> \
            &nbsp;&nbsp;2. Kasino maupun komunitas slime secara umum tidak bertanggung jawab, baik \
            berdasarkan kontrak, perbuatan melawan hukum, kelalaian, maupun dasar lainnya, atas \
            kerugian atau kerusakan apa pun yang timbul dari atau berkaitan dengan penggunaan Kasino.<br> \
            </font> \
            <font size=3><b>VIII. Ketentuan Umum</b></font><br> \
            <font size=2> \
            &nbsp;&nbsp;1. Perjanjian Keanggotaan ini tunduk pada hukum Haven dan \
            hukum Cradle. Dengan ini, kamu menyetujui secara tidak dapat ditarik kembali untuk tunduk \
            pada yurisdiksi Pengadilan Cradle dan Haven.<br> \
            &nbsp;&nbsp;2. Perjanjian ini ditulis oleh beberapa slime yang kurang memahami bahasa hukum, \
            selain dari apa yang mereka lihat saat menonton A Few Good Men. Karena itu, bagian mana pun \
            yang tidak masuk akal biasanya disalahkan kepada pihak lain. Bagian bagus yang tersisa tetap \
            bagus. Bagian itu tidak menjadi buruk hanya karena kami mengacaukan bagian lain yang lebih buruk. \
            Ada istilah untuk konsep tersebut, dan fakta bahwa kami tidak mengetahuinya adalah salah satu \
            bagian buruknya.<br> \
            </font> \
            </font> \
            </html>

