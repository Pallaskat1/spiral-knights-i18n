#
# Custom level descriptions
#..................................................................................................

m.battle_arena_desc = Konon diawasi oleh banyak jiwa yang melayang demi hiburan, Arena Pertarungan \
menawarkan tantangan yang semakin sulit bagi para pejuang pemberani yang ingin merebut harta \
milik Raja Arena.

m.scarlet_fortress_desc = Dinamai berdasarkan permadani-permadani berwarnanya yang mencolok, Benteng Merah Tua \
merupakan reruntuhan kastel terlupakan yang terurai menjadi bongkahan-bongkahan dan terus melayang \
tanpa akhir di kehampaan Clockworks. Hantu-hantu buas yang aneh menghantui koridor panjangnya, \
tanpa lelah memburu siapa pun yang memasuki wilayah mereka.

m.aurora_isles_desc = Dari puncak pulau-pulau melayang yang misterius, reruntuhan yang diputihkan matahari \
perlahan hancur di bawah langit palsu. Meski rerumputan hijau dan udara sejuk terasa cukup nyata, \
suara mesin yang terus bergemuruh tepat di bawah permukaan senantiasa mengingatkan kita pada \
kerangka mekanis dunia ini.

m.dark_city_desc = Kota yang dahulu ramai di dunia maju ini kini menjadi rumah bagi tak terhitung banyaknya \
iblis dari Dunia Bawah. Di bawah cahaya bulan, mereka membakar lambang-lambang gelap ke tanah, \
memanggil lebih banyak rekan mereka untuk tujuan yang masih belum diketahui.

m.concrete_jungle_desc = Kota yang telah lama terlupakan ini direbut kembali oleh alam, lalu oleh legiun \
mayat hidup. Kini kota ini menjadi sarang penyakit yang menjijikkan, tempat tinggal segala jenis \
monster beracun, baik yang hidup maupun yang sudah mati.

m.treasure_vault_desc = Gudang Harta Karun berisi persediaan blok harta yang melimpah, siap kamu ambil \
asalkan kamu memiliki cara yang tepat untuk melewati banyak pintu terkunci. Beberapa di antaranya \
dijaga dengan ketat, jadi selalu waspadai jebakan tersembunyi dan monster.

m.graveyard_desc = Pemakaman adalah tempat mengerikan yang sekaligus berada di dunia orang hidup \
dan dunia orang mati. Meski menyimpan harta rahasia di sudut-sudut gelapnya, tempat ini juga \
menjadi sarang kengerian kuno yang ingin melahap siapa pun yang masuk. Begitu berada di dalam, \
sebaiknya temukan jalan keluar secepat mungkin.

m.jigsaw_valley_desc = Dunia ini tampak seperti pulau-pulau langit yang tercerai-berai lalu disusun kembali \
seolah-olah sebuah teka-teki, sehingga terkadang sulit untuk dijelajahi. Sayangnya, tempat ini \
juga tampaknya dihuni oleh banyak slime tanpa akal dan konstruksi mekanis yang tidak terganggu \
oleh tata letaknya yang tidak beraturan.

m.starlight_cradle_desc = Di bawah langit yang diterangi cahaya bulan, pulau-pulau biru langit melayang \
di lautan bintang. Pulau-pulau ini dihuni makhluk-makhluk yang dengan senang hati merayap mendekati \
siapa pun yang menyerah pada nina bobo dunia ini yang tak pernah berakhir.

m.firestorm_citadel_desc = Satu-satunya yang tersisa dari kerajaan Almire yang dahulu agung, Benteng \
Badai Api menampung legiun jiwa yang tersesat dan terbakar dalam kobaran perang yang terlupakan, \
yang terus berkobar kembali tanpa akhir akibat ulah roh bengkok mantan penguasa mereka.

m.vanaduke_desc = Di dalam ruang takhta benteng, Lord Vanaduke berdiri menanti untuk melancarkan \
pertahanan terakhir melawan siapa pun yang berhasil menembus pertahanan bentengnya.

m.training_grounds_desc = Bagian Clockworks yang terbengkalai ini telah dimodifikasi untuk melatih \
para rekrutan baru dalam seni bertahan hidup, terutama agar tidak mati saat mereka menjelajahi \
dunia yang terbentang luas di hadapan mereka.

m.rc_bomb_training_desc = Tepat di luar perimeter Kamp Penyelamatan terdapat sebuah lapangan yang dipenuhi \
peralatan rusak dan pertahanan yang telah dikuasai musuh. Para Knight yang selamat meninggalkan \
area ini setelah serangkaian serangan mematikan pada malam hari.

m.ancient_generator_desc = Di bawah Kamp Penyelamatan terdapat sumber energi raksasa yang mampu \
menggerakkan lift menuju Haven, jika saja energi itu bisa dimanfaatkan.

m.final_test_2_desc = Jalur menuju Haven terbentang tinggi di atas jurang Clockwork yang berbahaya. \
Persiapkan dirimu, karena bahaya pasti mengintai di setiap sudut!

m.lobby_desc = Lobi sebelum memasuki gerbang, tempat para Knight dapat menyusun strategi dan \
mempersiapkan perlengkapan untuk petualangan yang menanti.

m.terminal_desc = Level tempat para pelancong dapat kembali ke kota dengan aman atau melanjutkan \
perjalanan lebih jauh ke kedalaman Clockworks.

m.terminal_core_desc = Terminal kecil di bagian terdalam Clockworks yang paling gelap, menghadap \
jantung dunia yang kolosal dan terus berdetak.

m.terminal_return_desc = Level tempat para pelancong dapat kembali dengan aman ke kota di atas.

m.moorcroft_desc = Manor tua misterius yang menjadi rumah bagi sejumlah arwah gelisah. Moorcroft \
Manor tampaknya berfungsi sebagai tempat persinggahan bagi arwah dalam perjalanan mereka, tetapi \
tak satu pun dari mereka tampaknya benar-benar menuju tempat tertentu.

m.emberlight_desc = Desa para orang buangan, Emberlight menjadi tempat perlindungan bagi para Gremlin \
yang diusir dari Koloni Agung. Kini mereka menjalani kehidupan sederhana dengan menjual barang \
dan menawarkan jasa perbaikan kepada para pelancong yang lewat, selalu takut bahwa suatu hari \
Raja Gremlin, Tinkinzar, akan memutuskan untuk memusnahkan mereka semua.

m.royal_jelly_desc = Istana Royal Jelly adalah kastel kuno yang telah dikuasai oleh legiun monster \
slime. Tujuan kastel ini masih belum jelas, meski konon tempat ini menyimpan Royal Jelly, yang \
disebut-sebut sebagai kaum bangsawan di kerajaan slime. Jika benar, kemungkinan kastel ini \
dibangun untuk melayani Royal Jelly, dan tidak memiliki tujuan lain.

m.gloaming_wildwoods_desc = Para rekrutan Spiral Knight disarankan untuk menghindari hutan gelap berkabut \
ini sampai mereka cukup berpengalaman menghadapi bahaya Clockworks. Hutan Liar Senja menjadi rumah \
bagi kawanan binatang buas yang ganas, dan yang paling mengerikan adalah Snarbolax yang legendaris. \
Konon disebut sebagai 'bayangan hidup', Snarbolax lebih menyukai mangsa yang diliputi teror sebelum \
kematiannya dan sering menyiksa korbannya tanpa ampun sebelum memberikan pukulan terakhir.

m.ironclaw_munitions_factory_desc = Pabrik Amunisi Ironclaw adalah pabrik senjata yang dioperasikan \
oleh Gremlin dan mengkhususkan diri dalam produksi bahan peledak berkaliber tinggi. Informasi \
intelijen mengungkapkan bahwa pabrik ini sedang mengembangkan senjata rahasia bernama 'Project \
Roarmulus', yang dirancang khusus untuk menghancurkan Haven!

m.candlestick_keep.desc = Satu-satunya yang tersisa dari Akademi Owlite, Candlestick Keep \
kini hanyalah bayangan kelam dari sekolah seni sihir yang dahulu agung. Para Knight yang \
berhasil keluar dari benteng terkutuk ini hanya punya satu nasihat untuk diberikan: \
'bertahanlah dalam cahaya.'

m.cogmaster_castle_desc = Memanggil semua Knight! Spiral HQ telah melancarkan serangan besar-besaran \
ke kastel yang dijaga ketat milik Warmaster Seerus, Gremlin licik dari Ordo Merah. \
Semua serangan terhadap tembok kokoh dan artileri penghancur telah gagal. \
Spiral HQ membutuhkan ANDA untuk membalikkan keadaan dan membawa pertempuran langsung kepada Warmaster!

m.super_brawl_desc = Arena Pertarungan Akbar.

