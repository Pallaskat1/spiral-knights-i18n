# Redeem a code: translation messages

t.redeem = TUKARKAN KODE

m.instruct = Jika kamu memiliki kode khusus untuk menukarkan hadiah, kamu dapat memasukkannya di sini:

e.invalid_code = Kode yang kamu masukkan tidak ditemukan. Periksa kembali kode tersebut dan coba lagi.
e.expired_code = Kode tersebut sudah kedaluwarsa. Maaf.
e.already_redeemed = Kode yang kamu masukkan sudah pernah ditukarkan. Aduh!
e.max_redeemed = Kamu sudah menukarkan jumlah maksimum kode untuk promosi ini.
e.max_attempts = Kamu telah mencoba terlalu banyak kode yang tidak valid. Coba lagi dalam beberapa menit.

m.success = Berhasil! Silakan periksa suratmu.
