m.npc_captainknight_b = Levez votre bouclier pour bloquer des attaques !
m.npc_captainknight_c = N'oubliez pas d'appr\u00eater votre bombe !
m.npc_captainknight_d = Coordonnez vos attaques !
m.npc_captainknight_e = Utilisez l'environnment \u00e0 l'avantage !
m.npc_captainknight_f = Mettez-vous \u00e0 l'abri si on vous envahisse !
m.npc_captainknight_g = N'oubliez pas d'aider votre membres d'escadron !

t.npc_recruit = Recrue
m.npc_recruit_a = J'ai besoin d'un repos avant de continuer.
m.npc_recruit_b = Ai-je oubli\u00e9 mon Calibur \u00e0 la Poste d'arsenal... ?
m.npc_recruit_c = Je crois que je dois fabriquer un bouclier am\u00e9lior\u00e9 lorsque je \
  retourne au Haven.
m.npc_recruit_d = C'est ma premi\u00e8re exp\u00e9dition dans les Rouages !
m.npc_recruit_e = As-tu des conseils pour moi ?
m.npc_recruit_f = C'est o\u00f9 la s\u00e9curit\u00e9 sur ce truc ?
m.npc_recruit_g = T'as vu une salle dangereuse ? J'ai entendu qu'elles sont difficiles.

m.npc_survivorknight_a = Ils... ils ont eu tout le monde, mais pas moi. Je me suis cach\u00e9 dans le coin.
m.npc_survivorknight_b = Ils ont jailli du noirceur. On n'avait aucun chance de r\u00e9agir.
m.npc_survivorknight_c = J'n'ai jamais demand\u00e9 \u00e7a.

m.npc_mineraltech_a = Je suis un chercheur de terrain pour Chef Geo Knight Wegner.
m.npc_mineraltech_b = Hum, certains combinaisons semblent attirer certains types de monstres.
m.npc_mineraltech_c = Ne faites aucune attention \u00e0 Hubert, il a \u00e9t\u00e9 d\u00e9-piqu\u00e9.

m.npc_minerknight_a = Vous ne pouvez porter qu'un min\u00e9ral \u00e0 la fois, alors prenez le \
  plus grand min\u00e9ral.
m.npc_minerknight_b = Spiral HQ nous demande de tirer ces min\u00e9rales au Haven.
m.npc_minerknight_c = On dit que ces min\u00e9raux font marcher chaque porte dans l'Arcade.

m.npc_techknight_a = Je collecte des samples de ce stratum.
m.npc_techknight_b = Vous ne pouvez pas avoir trop d'info, comme vous ne pouvez pas avoir trop \
  de dessert.
m.npc_techknight_c = Plus des tests...

m.npc_campknight_a = Asseyez-vous et restez pour un peu.
m.npc_campknight_b = R\u00e9chauffez-vous devant le camp de feu.
m.npc_campknight_c = Je sens que le gel a d\u00e9j\u00e0 diminu\u00e9 de mes mains.

m.npc_graveknight_a = Non, il y en trop... je ne peux pas les battre. Il ne reste que la lumi\u00e8re de bougies. Sans...

m.npc_rummageknight_a = Je sais qu'il \u00e9tait ici...
m.npc_rummageknight_b = Je ne peux pas parler ce moment.

m.npc_supplies_a = Ces provisions sont arriv\u00e9es de bonne heure.
m.npc_supplies_b = Il y a quelques jours que nous avons des provisions frais.
m.npc_supplies_c = Merci de r\u00e9-provisionner notre camp.

m.npc_onwatch_a = Je ne peux pas parler maintenant. Je suis en garde.
m.npc_onwatch_b = Je sais qu'ils retourneront.
m.npc_onwatch_c = Avez-vous vu quelque chose l\u00e0-bas ?

m.npc_lostknight_a = Merci de me \u00absauver\u00bb, mais je me sens bien.
m.npc_lostknight_b = C'est bon de savoir que Spiral HQ ne m'a pas oubli.
m.npc_lostknight_c = Je peux partir, mais pensez de tout ce que je pourrais apprendre si je \
  reste ici !

m.npc_teaser_knight = Cette derni\u00e8re mission \u00e9tait une mission bizarre. Nous \u00e9tions en train de d\u00e9\
  gager le chemin vers l'ascenseur quand nous avions vu quelques structures au loin. Nous \
  n'avons pas pu voir comment y aller. Je pense qu'on doit juste de les retrouver au futur. Les \
  Rouages changent toujours, vous savez.
r.npc_teaser_knight = Terminer la conversation.

m.npc_supply_teaser_knight = D\u00e9sol\u00e9, je n'ai pas le temps pour parler. Je dois livrer \
  tous ces provisions au-dessous, jusqu'aux avant-postes. Des gens oublient que notre habilet\u00e9 \
  d'aller loin seront plus limit\u00e9es sans les chevaliers apportant les approvisions dans \
  les Rouages. Quelle ingratitude, hein ?

