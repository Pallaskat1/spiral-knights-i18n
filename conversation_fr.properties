# Desk Clerk
#...................................................................................................

n.deskclerk = R\u00e9ceptionniste

m.deskclerk_1a = Bienvenue \u00e0 Moorcroft Manor, o\u00f9 les \u00e2mes ext\u00e9nu\u00e9es \
  reposent leur carcasse (pour peu qu'elles en aient une). Si vous voulez y passer la nuit, \
  sachez que nous faisons le m\u00e9nage dans les chambres tous les quatre-vingt-dix-neuf ans, \
  qu'un petit d\u00e9jeuner vous sera offert par la maison \u00e0 chaque pleine lune et que \
  vous ne pourrez plus jamais quitter cet endroit. Au grand jamais. Je vous souhaite un bon s\u00e9jour !

r.deskclerk_1a = Euh... Merci.


m.moorcroft_archives_1a = Bienvenue \u00e0 l'Archives de Moorcroft, cher voyageur. Ici, vous d\u00e9\
  couvrez une collection illustre de grimoires anciens d'originant des mondes oubli\u00e9s. \
  C'est impressive, je connais !\n\
  \n\
  N'h\u00e9sitez pas \u00e0 regarder mais ne les touchez pas, s'il vous pla\u00eet- quelques \
  livres ici ont des sorts \u00e9sot\u00e9riques et incroyables. Vous pourriez vous blesser !

r.moorcroft_archives_1a = Merci. Je serai prudent.

m.moorcroft_archives_2a = Oh {0}, c'est terrible, terrible ! \n\
  \n\
  Un essaim de Black Kats sont venus d'un portail noir dans les Rouages et ils ont saccag\u00e9 \
  l'Archives de Moorcroft !

r.moorcroft_archives_2a = C'est quoi les Black Kats ?

m.moorcroft_archives_3a = Les Black Kats sont les \u00e2mes les plus hant\u00e9s du Kat Tribe. \
  Ils apportent la plus grande mal\u00e9diction de tous et ils cherchent toujours pour les \
  auras magiques \u00e0 manger, sans penser. \u00c9tant donn\u00e9 qu'ils mangent constamment \
  ces forces, ils sont tr\u00e8s, tr\u00e8s forts.\n\
  \n\
  C'est possible qu'ils \u00e9tait attir\u00e9s aux forces rayonnant des grimoires anciens dans \
  les Archives.\n\
  \n\
  Je vous en prie, {0}, aidez-nous \u00e0 restaurer les Archives de Moorcroft !

r.moorcroft_archives_3a = En toute fa\u00e7on, je vous aiderai, Pembrooke.

m.moorcroft_archives_4a = Alors, fouillez les Rouages pour ces kats pi\u00e8tres et d\u00e9truisez-les ! M\u00ea\
  me si les livres sont mang\u00e9s vous pourriez r\u00e9cup\u00e9rer les Pages anciens. \
  Donnez-les \u00e0 Montague pour recevoir des r\u00e9compenses. Aidez-nous, et nous vous \
  aiderons !\n\
  \n\
  On trouve les Black Kats au hasard en rencontrant les Spookats dans Niveaux 2 et 3 (Portes \u00e0 \
  l'Arcade et les Missions). Il y a aussi une Mission de prestige disponible quotidiennement \
  qui vous am\u00e8ne au nid de Black Kat.

r.moorcroft_archives_4a = Je chercherai pour ces Black Kats et r\u00e9cuperai les Pages \
  anciens !

m.moorcroft_archives_5a = Excellent ! Bonne chance \u00e0 vous, {0}. Vous l'en aurez besoin... \
  les Black Kats sont des bandes de malchance...

r.moorcroft_archives_5a = Terminer la conversation.

