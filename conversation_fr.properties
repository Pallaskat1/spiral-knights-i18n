  le cristal sur leur dos pour les mettre \u00e0 genoux.
# IMAGE:codex_trojan.png

n.monster_codex_zombie = Codex monstrueux :
m.monster_codex_zombie = Zombies \nLes Zombies titubants se rel\u00e8vent d'entre les morts s'ils \
  sont tu\u00e9s pr\u00e8s d'un Totem macabre. \u00c9loignez-les pour pouvoir leur offrir le repos \
  \u00e9ternel.
# IMAGE:codex_zombie.png

n.monster_codex_devilites = Codex monstrueux :
m.monster_codex_devilites = Devilites \nLes Devilites sont les b\u00eates de somme des Enfers. Si \
  un Pit Boss surprend un Devilite \u00e0 ne rien faire, il peut le promouvoir en Overtimer \
  furieux ou en Yesman docile.
# IMAGE:codex_devilites.png

n.monster_codex_snarbolax = Codex monstrueux :
m.monster_codex_snarbolax = Snarbolax \nLe mythique Snarbolax est insensible aux attaques des \
  chevaliers. Faites sonner la Cloche de b\u00eate quand il est \u00e0 proximit\u00e9 pour \
  l'\u00e9tourdir et le soumettre.
# IMAGE:codex_snarbolax.png

n.monster_codex_royal_jelly = Codex monstrueux :
m.monster_codex_royal_jelly = Royal Jelly \nCe gigantesque cube g\u00e9latineux a la m\u00e8che \
  courte et adore jouer les gros bras. En l'absence de ses go\u00fbteurs royaux, un parfait \
  empoisonn\u00e9 lui donnerait une indigestion royale.
# IMAGE:codex_royal_jelly.png

n.monster_codex_roarmulus_twins = Codex monstrueux :
m.monster_codex_roarmulus_twins = Roarmulus Twins \nCes Gun Puppies g\u00e9ants arborent un \
  blindage imp\u00e9n\u00e9trable et des munitions surpuissantes. Leur peau est si \u00e9paisse \
  que seuls les tirs fraternels peuvent les blesser.
# IMAGE:codex_roarmulus_twins.png

n.monster_codex_vanaduke = Codex monstrueux :
m.monster_codex_vanaduke = Lord Vanaduke \nOn sait peu de choses sur le Duc \u00e9ternel de \
  l'Empire almirien. Nos capteurs indiquent que son masque est une source de puissance, mais aussi \
  une faiblesse potentielle.
# IMAGE:codex_vanaduke.png

n.monster_codex_battlepod = Codex monstrueux :
m.monster_codex_battlepod = Battlepod \nCes automates immobiles dissimulent un petit arsenal sous \
  leur double blindage. Chaque Battlepod poss\u00e8de une combinaison unique d'attaques et de \
  d\u00e9fenses qui vous laissera perplexe.
# IMAGE:codex_battlepod.png

