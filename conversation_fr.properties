m.mission_crimson_chaos_recon_1 = Salutations ! Quand j'ai entendu qu'ils vous appelaient, {0}, \
  je n'arrivais pas \u00e0 y croire. LE vainqueur de Vanaduke ! C'est un honneur de rapporter \u00e0 vous.
r.mission_crimson_chaos_recon_1 = Qu'est-ce que vous avez trouv\u00e9 ?
m.mission_crimson_chaos_recon_2 = Mais c'est \u00e7a, {0}, rien. Nous avons surveill\u00e9 la \
