## RETURN TO FIRESTORM CITADEL


m.rfc_court_1a = Content de vous revoir, chevalier \u00e9toil\u00e9.
r.rfc_court_1a = \u00c9toil\u00e9 ?
m.rfc_court_2a = Oui. Nous, les sprites de la nature, sommes la pluie, la racine et la terre. \
  Mais vous n'\u00eates pas comme nous. Vous \u00eates comme les autres au-dessous.
r.rfc_court_2a = Justement, comment puis-j'y arriver ? Cette place s'\u00e9coule !
m.rfc_court_3a = Malheureusement, m\u00eame si notre lien avec la M\u00e8re d'Esprit est r\u00e9\
  tabli, il y a une limite \u00e0 ce que nous pouvons sauver. N\u00e9anmoins, si la porte d'un \
  chemin se ferme, une autre peut s'ouvrir. C'est la nature de ce monde mouvant. Courage, \
  chevalier \u00e9toil\u00e9.
r.rfc_court_3a = (Terminer la conversation.)

m.rfc_court_4a = M\u00eame si vous aviez vaincu Vanaduke, il semble que le maudit qu'il a attir\u00e9 au royaume persiste. \u00c7\
  a prend tout de notre pouvoir pour ma\u00eetriser les feux ombreux ravageants.

m.rfc_court_5a = Nous avons tous senti le moment o\u00f9 vous aviez vaincu Vanaduke. L'enti\u00e8\
  re de la citadelle tremblait quand il est tomb\u00e9 et pour un moment, nous avons cru que ce \
  royaume serait d\u00e9truit avec son roi. Marchez avec prudence dans ces corridors, particuli\u00e8rement si ce b\u00e2timent tombe en ruines !

m.rfc_court_6a = Tenez-vous, chevalier. Vous \u00eates dans la cour du Royaume d'Almire. Vous \
  n'entendez pas les trompettes sonnant le retour de nos l\u00e9gions puissantes ? Vous n'\u00eates pas impressonn\u00e9 \
  par les blasons prestigieux de nos maisons grandes et hommes d'\u00c9tats ?

r.rfc_court_6a = Oui, je les regarde avec admiration.
r.rfc_court_6b = Je ne vois ni entends rien de ces choses-l\u00e0.

m.rfc_court_7a = (Vous sentez une grande fiert\u00e9 venant de ce chevalier tomb\u00e9, mais il \
  ne dit plus et fixe son regard \u00e0 la vie laquelle il voit tout seul.)
m.rfc_court_7b = (Il a l'air que vos mots ne d\u00e9rangent pas le chevalier tomb\u00e9, dont ses pens\u00e9\
  es sont perdues dans quelque part de ces gloires dans sa vie ant\u00e9rieure.)

r.rfc_court_8a = (Terminer la conversation.)

n.rfc_noble_1 = Courtisan perdu
n.rfc_dungeon_1a = Je m'\u00e9ternise dans ces corridors m\u00eame apr\u00e8s des centaines d'ann\u00e9es, priv\u00e9 \
  de ma paix par mon seigneur maudit. Je sens son esprit agrippant encore ce royaume saccag\u00e9\
  . Il ne veut pas partir, donc il nous tous condamne.

n.rfc_noble_2 = Noble emprisonn\u00e9
n.rfc_dungeon_2a = Il y avait mille ans depuis j'ai \u00e9t\u00e9 emprisonn\u00e9 pour s'\u00e9\
  lever contre mon seigneur, condamn\u00e9 de demeurer ici pour vie comme peine. Quand les feux \
  ont pris la citadelle m\u00eame apr\u00e8s ma mort, je n'ai jamais trouv\u00e9 la libert\u00e9. Mon \u00e2me est li\u00e9e \u00e0 ces moellons maudits.

