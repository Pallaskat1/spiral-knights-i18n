## ADVANCED TRAINING KNIGHTS
# Gym
#...................................................................................................

# Greeter
#...................................................................................................


m.atg_greeter_1a = Bienvenue dans notre Salle d'entra\u00eenement avanc\u00e9. Vous y trouverez de \
  pr\u00e9cieux conseils de survie pour vous aider dans votre p\u00e9riple \u00e0 travers les \
  Rouages. \n\nVoulez-vous que je vous oriente ?

r.atg_greeter_1a = Bien s\u00fbr, par o\u00f9 devrais-je commencer ?

r.atg_greeter_1b = Non merci, j'explorerai les alentours moi-m\u00eame.

m.atg_greeter_2a = \u00c0 l'ouest, vous d\u00e9couvrirez les objets utiles que l'on trouve dans les \
  Rouages. Au nord, vous apprendrez \u00e0 conna\u00eetre diff\u00e9rents types de blocs et de \
  portes. \u00c0 l'est, vous trouverez toutes sortes de pi\u00e8ges et de dangers, ainsi qu'une \
  salle de combat pour vous entra\u00eener \u00e0 vous d\u00e9fendre contre des cubes \
  d'entra\u00eenement. Ne vous inqui\u00e9tez pas, nous avons pris nos pr\u00e9cautions pour que \
  ces cubes soient parfaitement inoffensifs !

r.atg_greeter_2a = Merci ! Je pars explorer.

## HAVEN KNIGHTS

# Fountain
#...................................................................................................


m.fountain_1 = Bonjour et bienvenue \u00e0 Haven ! Si vous allez vers le nord, vous arriverez \
  \u00e0 l'Arcade, o\u00f9 vous pourrez vous renseigner sur les d\u00e9tails de notre mission. Si \
  vous allez vers l'ouest, vous arriverez au Bazaar, o\u00f9 les \u00c9trangers vendent tout un \
  choix d'\u00e9quipements et d'armes. Pensez \u00e0 consulter leur stock tous les jours, il change !

r.fountain_1 = Merci pour les renseignements ! Je pars explorer.

# Gym Signpost
#...................................................................................................


m.atg_guard = Bonjour ! Derri\u00e8re cette porte se trouve la Salle d'entra\u00eenement \
  avanc\u00e9. En tant que Spiral Knight, vous \u00eates libre de l'utiliser pour perfectionner \
  vos comp\u00e9tences et en apprendre davantage sur les Rouages.

r.atg_guard = Merci ! Je vais voir ce qu'il y a \u00e0 l'int\u00e9rieur.


# Arcade Leader
#...................................................................................................


m.arc_leader_1 = Enchant\u00e9, soldat, et bravo d'avoir rejoint notre camp de base ici, \u00e0 \
  Haven. Je suis le lieutenant Feron. Le capitaine Ozlo m'a charg\u00e9 de superviser nos \
  op\u00e9rations d'extraction dans les Rouages.\n\nDevant vous se trouve \u00abl'Arcade\u00bb, un \
  complexe fascinant qui nous sert de lien avec le c\u0153ur des Rouages. Comme vous venez \
  d'arriver, je vais vous r\u00e9sumer rapidement ce que Spiral HQ attend de nous ici.

r.arc_leader_1 = \u00c7a doit \u00eatre important ! Dites-moi comment \u00e7a fonctionne.

m.arc_leader_2 = Apr\u00e8s l'\u00e9crasement du Skylark, son noyau principal de tearium a \
  explos\u00e9, d\u00e9truisant une partie du vaisseau et le privant de sa principale source \
  d'\u00e9nergie. Comme nous n'avons pas encore trouv\u00e9 quelques centaines de tonnes de \
  tearium qui tra\u00eeneraient par terre, notre oiseau a pour ainsi dire perdu ses ailes.\n\nAvec \
  l'aide des \u00c9trangers, nous avons pu \u00e9tablir une petite base d'op\u00e9rations ici, \
  \u00e0 Haven. Une fois nos syst\u00e8mes remis en marche, nous avons d\u00e9couvert qu'au \
  c\u0153ur de ce rocher r\u00e9sonne une signature \u00e9nerg\u00e9tique d'une ampleur sans \
  pr\u00e9c\u00e9dent.

r.arc_leader_2 = Si seulement nous pouvions exploiter cette \u00e9nergie...

m.arc_leader_3 = Exactement ! Le Core des Rouages pourrait tr\u00e8s bien contenir la source \
  d'\u00e9nergie dont nous avons besoin pour cr\u00e9er une nouvelle source d'alimentation pour le \
  Skylark et le remettre en \u00e9tat de marche. Il n'y a qu'un probl\u00e8me- les Rouages \
  eux-m\u00eames semblent con\u00e7us comme une sorte de pi\u00e8ge mortel compl\u00e8tement fou.\n\
  \nAtteindre le Core ne sera pas facile...

r.arc_leader_3 = Je suis \u00e0 la hauteur !

m.arc_leader_4 = Voil\u00e0 l'\u00e9tat d'esprit que j'aime voir ! \u00c7a fonctionne comme ceci : \
  vous utilisez les portes devant vous pour explorer les Rouages et rapporter des min\u00e9raux \
  sp\u00e9ciaux. Ensuite, vous d\u00e9posez ces min\u00e9raux dans les portes pour modifier les \
  Rouages en dessous et cr\u00e9er de nouveaux niveaux inexplor\u00e9s.\n\nNous pensons que les \
  min\u00e9raux sont la cl\u00e9 pour ouvrir un chemin jusqu'au Core, il nous reste juste \u00e0 \
  d\u00e9couvrir comment les utiliser !

r.arc_leader_4 = Je comprends ma mission.

m.arc_leader_5 = Vous avez prouv\u00e9 que vous \u00e9tiez apte au combat, et je suis convaincu \
  que vous servirez l'Ordre Spiral avec courage. Les portes des Rouages sont juste devant. \n\n\
  Bonne chance !

r.arc_leader_5 = Terminer la conversation
r.arc_leader_5_accept = Atteindre le Terminal 1 ? Je m'en occupe !


# Wegner Basic
#...................................................................................................


m.arc_mintut_1 = Bonjour. Je suis Wegner, Chief Geo Knight du Skylark et responsable des \
  \u00e9tudes g\u00e9ologiques dans les Rouages.

r.arc_mintut_1 = Je suis ici pour en apprendre davantage sur les min\u00e9raux trouv\u00e9s dans les Rouages.

# IMAGE:step1_minerals.png
m.arc_mintut_2 = Au cours de vos voyages dans les Rouages, vous rencontrerez cinq min\u00e9raux \
  sp\u00e9ciaux : crimsonite, moonstone, valestone, luminite et dark matter.

r.arc_mintut_2 = Continuer

# IMAGE:step2_gather.png
m.arc_mintut_3 = Vous trouverez des d\u00e9p\u00f4ts de minerai dans tous les niveaux des \
  Rouages et vous devez les attaquer pour les r\u00e9duire \u00e0 une taille portable. Vous \
  pouvez seulement les porter un \u00e0 la fois, mais c'est possible de les \u00e9changer l'un \
  pour l'autre. Cherchez le plus grand et le plus rayonnant que vous pouvez trouver. Ceux-l\u00e0 sont les plus pr\u00e9cieux.

r.arc_mintut_3 = Continuer

m.arc_mintut_4 = Une fois que vous avez atteint l'ascenseur sans encombre, le min\u00e9ral que \
  vous portez est d\u00e9pos\u00e9 dans votre arsenal pour une utilisation ult\u00e9rieure. Chaque \
  membre du groupe re\u00e7oit les min\u00e9raux de tous les autres, alors inutile de vous \
  disputer pour savoir qui aura le meilleur !

r.arc_mintut_4 = Continuer

m.arc_mintut_5 = Les min\u00e9raux sont utilis\u00e9s pour cr\u00e9er la nourriture de sprite \
  dans le Laboratoire. La nourriture de sprite est vraiment importante pour le d\u00e9\
  veloppement de votre sprite, alors saisissez ces min\u00e9raux lorsque vous les voyez !

r.arc_mintut_5 = Continuer

m.arc_mintut_6 = Notre recherche g\u00e9ologique est encore en cours, alors il est probable \
  qu'il y a d'autres fa\u00e7ons d'utiliser ces min\u00e9raux bizarres et puissants.

r.arc_mintut_6 = Chic ! Merci pour les informations !

