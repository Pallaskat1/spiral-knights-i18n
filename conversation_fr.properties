# Tylen Bazaar Tour
#...................................................................................................
m.bazaar_tour_1a = Bienvenue au Bazaar, {0} ! Aimeriez-vous une visite des boutiques ou des \
  services ?

r.bazaar_tour_1a = Bien s\u00fbr, montrez-moi les boutiques. (Suivre Tylen)
r.bazaar_tour_1b = Quels services pourrais-je trouver ici ? (Suivre Tylen)
r.bazaar_tour_1c = Non merci, j'explorerai par moi-m\u00eame.

m.bazaar_tour_2a = Les \u00c9trangers comme Quillion, ici, vous vendent des armes et des armures. \
  Chacun est sp\u00e9cialis\u00e9 dans un type d'objet particulier, alors parlez-leur pour \
  d\u00e9couvrir ce qu'ils proposent. Ils ne sont pas tr\u00e8s bavards, mais ils ont un nouveau \
  stock d'objets tous les jours ! \n\nAssurez-vous simplement d'avoir atteint le rang requis pour \
  \u00e9quiper un objet !

r.bazaar_tour_2a = Les \u00c9trangers vendent-ils autre chose que des armes et de l'\u00e9quipement ?

m.bazaar_tour_3a = Je suis ravi que vous posiez la question : bien s\u00fbr que oui ! Allons voir \
  Vatel.

r.bazaar_tour_3a = (Suivre Tylen)
#(move to Vatel)

m.bazaar_tour_4a = Vatel, ici, vous vend un assortiment de recettes, ainsi que des modificateurs de \
  couleur personnelle et d'autres objets.

r.bazaar_tour_4a = Des recettes ? Pour des armes et \u00e9quipements ?

m.bazaar_tour_5a = C'est \u00e7a, vous pouvez acqu\u00e9rir des recettes et des mat\u00e9riaux \
  pour transmuter des armes et de l'\u00e9quipement aux postes d'alchimie. Venez, je vais vous en \
  montrer un.

r.bazaar_tour_5a = Affirmatif.
#(move to alchemy station)

m.bazaar_tour_6a = Voici un poste d'alchimie, que vous apprendrez sans doute \u00e0 tr\u00e8s bien \
  conna\u00eetre en am\u00e9liorant votre arsenal. \n\nEt voil\u00e0, c'est tout pour les \
  boutiques. Voulez-vous une autre visite ?

r.bazaar_tour_6a = J'aimerais revoir les boutiques. (Suivre Tylen)
r.bazaar_tour_6b = J'aimerais voir les services. (Suivre Tylen)
r.bazaar_tour_6c = Non merci, j'explorerai par moi-m\u00eame.

m.bazaar_tour_7a = Punch et Vise sont les forgerons gremlins qui peuvent changer les attributs \
  de vos armes et \u00e9quipements.

r.bazaar_tour_7a = Des Gremlins ?!

m.bazaar_tour_8a = Du calme, {0}, les gremlins ne sont pas tous taill\u00e9s dans la m\u00eame \
  \u00e9toffe. Certains d\u00e9sapprouvent les m\u00e9thodes du roi Tinkinzar et de l'Ordre \
  Incarnat. D'ailleurs, on m'a dit qu'il existe quelque part dans les Rouages toute une ville \
  peupl\u00e9e de gremlins qui ont quitt\u00e9 la Grande Colonie.

r.bazaar_tour_8a = Eh bien, si vous le dites...

m.bazaar_tour_9a = Bon, revenons \u00e0 nos moutons. \n\nPunch peut ajouter des variantes uniques, \
  une sorte de bonus sp\u00e9cial, \u00e0 vos armes et \u00e0 votre \u00e9quipement, contre \
  des crowns. Mais ses m\u00e9thodes sont, euh... chaotiques. On ne sait jamais vraiment ce qu'on va \
  obtenir. \n\nVise est un peu plus pr\u00e9cis. Contre de l'\u00e9nergie, il peut d\u00e9lier vos armes et \
  votre \u00e9quipement, ce qui vous permet de vendre ou d'offrir \u00e0 nouveau l'objet !

r.bazaar_tour_9a = Pratique, je m'en souviendrai. Quoi d'autre ?

m.bazaar_tour_10a = Visitons Brinks.

r.bazaar_tour_10a = (Suivre Tylen)
#(move to Brinks)

m.bazaar_tour_11a = Brinks est l'\u00c9changeur de jetons : il remet certains objets aux chevaliers \
  en \u00e9change de jetons que l'on peut collecter dans les Rouages. Les jetons se trouvent dans \
  les bo\u00EEtes aux tr\u00e9sors, sont remis en r\u00e9compense de missions ou s'obtiennent en battant \
  certains boss sp\u00e9ciaux.

r.bazaar_tour_11a = Compris. Autre chose ?

m.bazaar_tour_12a = Il y a une boutique de plus \u00e0 voir avant la fin de la visite. J'ai \
  gard\u00e9 la meilleure chose pour la fin.

r.bazaar_tour_12a = (Suivre Tylen)
#(move to Bechamel)

m.bazaar_tour_13a = Voici Bechamel l'Accessoiriseur, qui peut ajouter des accessoires \u00e0 votre \
  \u00e9quipement, \u00e0 condition que vous ayez un billet. Gr\u00e2ce aux accessoires, votre \
  \u00e9quipement se d\u00e9marquera vraiment dans la foule. Je vous conseille vivement d'essayer. \
  Vous ferez bient\u00f4t tourner toutes les t\u00eates !

r.bazaar_tour_13a = O\u00f9 puis-je trouver des billets d'accessoire ?

m.bazaar_tour_14a = On peut trouver les billets d'accessoire dans les lockbox ou dans la Maison \
  d'ench\u00e8res si un autre chevalier les vend.

r.bazaar_tour_14a = Affirmatif.

m.bazaar_tour_15a = Eh bien, voil\u00e0 pour l'essentiel du Bazaar. C'est un endroit vraiment \
  fantastique, o\u00f9 l'on trouve \u00e0 peu pr\u00e8s tout ce dont on a besoin. \n\nVoulez-vous \
  que je reprenne tout depuis le d\u00e9but, ou pensez-vous avoir compris ?

r.bazaar_tour_15a = J'aimerais voir les boutiques. (Suivre Tylen)
r.bazaar_tour_15b = J'aimerais revoir les services. (Suivre Tylen)
r.bazaar_tour_15c = Non merci, j'explorerai par moi-m\u00eame.

m.bazaar_tour_16a = Une autre visite ? Pas de probl\u00e8me, suivez-moi !
r.bazaar_tour_16a = (Suivre Tylen)

m.bazaar_tour_16b = Excellent ! Je suis content d'avoir pu vous aider \u00e0 vous rep\u00e9rer. \
  Bonne chance, {0} !

r.bazaar_tour_16b = Merci Tylen, on se reverra !



