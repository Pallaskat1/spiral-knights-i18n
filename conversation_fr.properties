#
# Translation messages

msgbundle_class = com.threerings.projectx.client.ControlAwareMessageBundle

## GENERAL

m.please_wait = Veuillez patienter

# Energy Info
#...................................................................................................

n.energy_info = Chevalier \u00e9nergique

m.energy_info_1a = Savez-vous quelle est la ressource la plus importante sur Cradle ? \
  L'\u00c9NERGIE ! Eh oui, c'est quelque chose de si sp\u00e9cial qu'il y a de quoi en u00e9crire \
  des romans ! Vous voulez en savoir plus sur ce truc super important ? Il se trouve que je m'y \
  connais !

r.energy_info_1a = J'aimerais en savoir plus, dites-moi tout !

r.energy_info_1b = Non merci, je pr\u00e9f\u00e8re rester dans l'ignorance.

m.energy_info_2a = Merveilleux ! Je vais vous la faire en trois cours tr\u00e8s simples : ce que \
  c'est, comment on l'utilise et comment on s'en procure.

r.energy_info_2a = Qu'est-ce que l'\u00e9nergie ?

r.energy_info_2b = Comment utilise-t-on l'\u00e9nergie ?

r.energy_info_2c = Comment puis-je obtenir plus d'\u00e9nergie ?

r.energy_info_2d = Vos cours me remplissent d'\u00e9nergie ! Je pars \u00e0 l'aventure !

m.energy_info_3a = L'\u00e9nergie est une force tr\u00e8s sp\u00e9ciale qui \u00e9mane en \
  permanence du noyau de ce monde. Elle est parfaitement stable : impossible de la perdre, \u00e0 \
  moins de l'\u00e9changer ou de la d\u00e9penser. (Vous pouvez voir combien d'\u00e9nergie vous \
  poss\u00e9dez sur le module d'\u00e9nergie de votre arsenal.)

m.energy_info_3b = L'\u00e9nergie sert \u00e0 toutes sortes de choses ! C'est la principale monnaie \
  pour acheter des marchandises au D\u00e9p\u00f4t des provisions, elle vous permet d'acheter des \
  am\u00e9liorations et de vous ranimer dans les Rouages quand vous n'avez plus de Sparks of Life, \
  et elle est n\u00e9cessaire pour fonder une guilde. \n\nVous trouverez aussi dans ce monde \
  toutes sortes d'appareils qui fonctionnent \u00e0 l'\u00e9nergie. Rep\u00e9rez simplement le \
  symbole bleu de l'\u00e9nergie sur l'appareil.

m.energy_info_3c = L'\u00e9nergie ne peut s'obtenir que par un achat avec de l'argent r\u00e9el ou \
  par un \u00e9change sur le march\u00e9 de l'\u00e9nergie. Pour acheter ou \u00e9changer de \
  l'\u00e9nergie, ouvrez simplement le D\u00e9p\u00f4t des provisions et cliquez sur le bouton \
  \u00abObtenir de l'\u00e9nergie\u00bb.

r.energy_info_3a = J'ai une autre question \u00e0 vous poser.

r.energy_info_3b = Vos cours me remplissent d'\u00e9nergie ! Je pars \u00e0 l'aventure !



## TUTORIAL

# Rescue Agent
#...................................................................................................

n.tut_intro = Agent de sauvetage

m.tut_intro_1a = Bienvenue sur Cradle, recrue ! J'appr\u00e9cie toujours quand les chevaliers \
  atterrissent en un seul morceau ! Nous avons mont\u00e9 un Camp de refuge \u00e0 deux pas. Je \
  vous guiderai, mais tirez votre \u00e9p\u00e9e, il y a des ennemis sur la route !\n
r.tut_intro_1a = Compris, je me mets en route !


m.tut_intro2_1a = ...r\u00e9pondez, {0}, vous \u00eates l\u00e0 ? Ici le chevalier \u00e9claireur \
  Rhendon !

r.tut_intro2_1a = Je suis l\u00e0, que s'est-il pass\u00e9 ?

m.tut_intro2_2a = Vous venez de toucher la surface de Cradle. Ma capsule de sauvetage s'est \
  \u00e9cras\u00e9e juste au nord de votre position. Nous devrions nous retrouver et rejoindre le \
  point de ralliement le plus proche. \n\nFaites attention et pr\u00e9parez votre \u00e9p\u00e9e, \
  il y a des cr\u00e9atures hostiles partout !

r.tut_intro2_2a = Affirmatif, Rhendon. J'arrive !


m.tut_intro3_1a = {0} ! Qu'est-ce que je suis content de vous voir ! Cet endroit est si \
  \u00e9trange... \u00c7a fait du bien de voir un visage familier plut\u00f4t qu'une autre \
  cr\u00e9ature hostile.

r.tut_intro3_1a = \u00c7a fait plaisir de vous voir en un seul morceau, vous aussi, Rhendon. \
  O\u00f9 sont les autres survivants ?

m.tut_intro3_2a = J'ai \u00e9tabli une liaison par comlink avec des chevaliers qui ont mont\u00e9 \
  un Camp de refuge un peu plus loin. Si vous allez vers le nord, vous devriez finir par \
  l'atteindre. \n\nJe vais rester ici pour l'instant et chercher les autres chevaliers qui se sont \
  \u00e9cras\u00e9s dans le secteur. Je vous retrouverai au Camp de refuge avant le coucher du \
  soleil. \n\nEt si vous tombez sur quelque chose de vraiment dangereux, appuyez sur [[ ?DEFEND]] \
  pour utiliser votre bouclier !

r.tut_intro3_2a = Je partirai en reconnaissance ! Soyez prudent, Rhendon.

m.tut_intro4_1a = Je vais rester ici pour l'instant et chercher les autres chevaliers qui se sont \
  \u00e9cras\u00e9s dans le secteur. Je vous retrouverai au Camp de refuge, au nord. \n\nEt si \
  vous tombez sur quelque chose de vraiment dangereux, appuyez sur [[ ?DEFEND]] pour utiliser votre \
  bouclier !

r.tut_intro4_1a = Je partirai en reconnaissance ! Soyez prudent, Rhendon.

m.tut_intro3_3a = Bonne chance !
m.tut_intro3_3b = Faites attention !
m.tut_intro3_3c = N'oubliez pas : appuyez sur [[ ?DEFEND]] pour utiliser votre bouclier !

# Warden Companion
#.................................................................................................
n.tut_warden = Gardien Spiral
m.tut_warden_1a = Salutations, chevalier. Vous devez \u00eatre {0}. Rhendon nous a pr\u00e9venus \
  par radio que vous \u00e9tiez en route. Venez avec nous, le Camp de refuge est juste devant.

r.tut_warden_1a = Super, j'ai h\u00e2te de manger un bon repas chaud.

m.tut_warden_2a = Et moi donc ! Bon, allons-y- \n\nAttendez, quelque chose cloche. \
  Pr\u00e9parez-vous, je crois qu'on a de la visite !

r.tut_warden_2a = Terminer la conversation

m.tut_warden_3a = Bien jou\u00e9, {0} ! On dirait que vous savez vous d\u00e9brouiller sur un champ \
  de bataille. \n\nVenez, allons au camp. Vous pourrez peut-\u00eatre nous aider \u00e0 comprendre \
  ce qui se passe ici.

r.tut_warden_3a = Terminer la conversation

# Final Test Knight
#...................................................................................................


m.final_test_knight_1a = Stup\u00e9fiant ! Je n'aurais jamais cru voir une nouvelle recrue sortir \
  vivante de ces d\u00e9combres en flammes ! Vous devez vraiment sortir de l'ordinaire... \n\nJe \
  m'appelle Feron, lieutenant de l'Ordre Spiral. Nous pensions que tout ce complexe \u00e9tait \
  \u00e0 l'abandon, jusqu'\u00e0 ce que l'ascenseur qui y m\u00e8ne reprenne soudain vie. Pendant \
  notre enqu\u00eate, tout l'endroit s'est rapidement embras\u00e9 ! \n\nComment avez-vous atterri \
  ici ?

r.final_test_knight_1a = (Parler \u00e0 Feron du Camp de refuge, de Razwog et de l'Artefact)

m.final_test_knight_2a = Je vois. Voil\u00e0 des informations qui vont beaucoup int\u00e9resser \
  Spiral HQ. Notre camp de base \u00e0 Haven est juste devant. Prenez l'ascenseur et allez \
  rencontrer les autres chevaliers qui, comme vous, ont surv\u00e9cu au crash. Les techniciens du \
  Labo auront h\u00e2te d'\u00e9tudier cet artefact. Ils s'en occuperont d\u00e8s votre \
  arriv\u00e9e \u00e0 Haven. \n\nNe vous inqui\u00e9tez pas pour ceux qui sont rest\u00e9s au Camp \
  de refuge. Gr\u00e2ce \u00e0 vous, nous disposons d'un syst\u00e8me d'ascenseurs en \u00e9tat de \
  marche pour les atteindre. Vous les avez tous sauv\u00e9s !

r.final_test_knight_2a = Merci, Lieutenant. Je partirai pour Haven.

# Rescued Stranger
#...................................................................................................

m.rescued_stranger_1a = Bonjour, petit \u00eatre. Vous d\u00e9couvrirez que ce nouveau monde \
  regorge de dangers, mais aussi d'occasions pour les aventureux et les braves ! L'un des \
  v\u00f4tres vous attend un peu plus loin sur le chemin. Nous nous reverrons sans aucun doute. \
  Adieu, pour l'instant !
r.rescued_stranger_1a = Terminer la conversation


## RESCUE CAMP KNIGHTS

# Greta B
#...................................................................................................

m.rc_greet2_1a = Bonjour, je suis la chef d'escadron Greta. Vous devez \u00eatre {0}. Rhendon nous \
  a dit de vous attendre, et vous arrivez \u00e0 point nomm\u00e9. Ce Camp de refuge traverse une \
  crise.

r.rc_greet2_1a = C'est quoi le probl\u00e8me, Greta ?

m.rc_greet2_2a = En bref, ce camp n'a plus d'\u00e9nergie et le soleil va bient\u00f4t se coucher. \
  La nuit derni\u00e8re, toutes sortes de monstres horribles nous ont attaqu\u00e9s dans \
  l'obscurit\u00e9. Nous n'y voyions rien et nos tourelles d\u00e9fensives n'avaient pas \
  d'\u00e9nergie. \n\n...nous avons perdu beaucoup de recrues. \n\nNous devons canaliser \
  l'\u00e9nergie jusqu'au Camp de refuge pour pouvoir \u00e9tablir un p\u00e9rim\u00e8tre \
  d\u00e9fensif avant la tomb\u00e9e de la nuit !

r.rc_greet2_2a = Comment puis-je aider \u00e0 canaliser l'\u00e9nergie au camp ?

m.rc_greet2_3a = Nos scanners ont rep\u00e9r\u00e9 un ancien g\u00e9n\u00e9rateur sous ce camp. Il \
  devrait envoyer de l'\u00e9nergie vers la surface, mais quelque chose semble la d\u00e9tourner. \
  \n\nNous avons besoin que vous alliez inspecter cet ancien g\u00e9n\u00e9rateur et que vous \
  redirigiez l'\u00e9nergie vers la surface. Mais il faudra vous pr\u00e9parer- c'est un \
  territoire totalement inexplor\u00e9 qui grouille de monstres. \n\nRhendon voulait vous voir \
  avant que vous ne vous lanciez dans cette mission. Pourquoi ne pas aller le voir d'abord ?

r.rc_greet2_3a = J'irai voir Rhendon avant d'inspecter le g\u00e9n\u00e9rateur.

m.rc_greet2_4a = Je vous en prie, {0}, aidez-nous \u00e0 r\u00e9tablir l'\u00e9nergie au Camp de \
  refuge pour que nous puissions \u00e9tablir un p\u00e9rim\u00e8tre d\u00e9fensif. Nous ne \
  pouvons pas nous permettre de perdre d'autres recrues face aux cr\u00e9atures de la nuit !

r.rc_greet2_4a = Je ferai de mon mieux !

m.rc_greet3_1a = Vous avez r\u00e9tabli l'\u00e9nergie et vous nous avez tous sauv\u00e9s, {0} ! Je \
  ne vous remercierai jamais assez, toutes ces recrues vous doivent la vie. \n\nVous devriez \
  maintenant essayer de contacter Spiral HQ avec votre comlink.

r.rc_greet3_1a = Terminer la conversation

# Rescue Camp Recruit Knights
#...................................................................................................
n.rc_recruit = Recrue
m.rc_recruit_a = Il se peut que nous n'ayons pas d'\u00e9nergie, mais je peux faire du feu pour \
  fournir un peu de lumi\u00e8re. C'est la moindre des choses que je puisse faire.

m.rc_recruit_b = Nous n'avons pas pu r\u00e9cup\u00e9rer grand-chose comme \u00e9quipement dans \
  les capsules \u00e9cras\u00e9es. Il n'y en a m\u00eame pas assez pour chaque chevalier valide.

m.rc_recruit_c = Vous vous rendez compte ? Tout ce gouffre est rempli d'une sorte de machine \
  g\u00e9ante. On dirait qu'elle descend \u00e0 l'infini. \n\nLa plan\u00e8te enti\u00e8re \
  serait-elle comme \u00e7a ?

m.rc_recruit_d = Entre la chaleur du feu et la s\u00e9curit\u00e9 des tourelles d\u00e9\
  fensives, je pense que je m'endormirai bien ce soir.

m.rc_recruit_e = Je sens l'\u00e9lectricit\u00e9 dans l'air ! On dirait que ce ne sera pas notre \
  dernier combat ce soir, finalement !

m.rc_recruit_f = Il para\u00eet que vous allez prendre cet ascenseur pour descendre dans le \
  gouffre. Vous avez bien plus de courage que moi...

r.rc_recruit = Terminer la conversation

# Technician Knight
#...................................................................................................
n.rc_technician = Technicien
m.rc_technician_a = D'apr\u00e8s ces relev\u00e9s, il devrait y avoir une sorte de source \
  d'\u00e9nergie dans les profondeurs sous le camp, mais elle est d\u00e9tourn\u00e9e d'une \
  fa\u00e7on ou d'une autre...

m.rc_technician_b = Ce truc ne sert \u00e0 rien sans \u00e9nergie. Comment sommes-nous cens\u00e9s \
  nous d\u00e9fendre contre ces monstres ?!

m.rc_technician_c = L'\u00e9nergie afflue de nouveau dans le camp ! Vous avez r\u00e9ussi, {0} !

r.rc_technician = Terminer la conversation

# Injured Knight
#...................................................................................................
n.rc_injured = Chevalier bless\u00e9
m.rc_injured_a = La nuit derni\u00e8re, de terribles monstres nous ont attaqu\u00e9s dans \
  l'obscurit\u00e9. C'\u00e9tait le chaos total. Sans \u00e9nergie pour les tourelles, nous ne \
  pouvions pas nous d\u00e9fendre. \n\nTant de braves chevaliers perdus...

m.rc_injured_b = L'un de ces monstres m\u00e9caniques m'a eu. Les griffes de cette maudite chose \
  ont transperc\u00e9 mon armure !

m.rc_injured_c = Gr\u00e2ce \u00e0 vous, nous n'aurons pas \u00e0 affronter une autre nuit comme \
  la pr\u00e9c\u00e9dente...

m.rc_injured_d = Avec le retour de l'\u00e9nergie, j'ai pu r\u00e9parer mon armure. Esp\u00e9rons \
  que je ne croiserai plus trop de ces monstrueux tas de ferraille rouill\u00e9e !

r.rc_injured = Terminer la conversation


# Nervous Knight
#...................................................................................................

n.rc_nervous = Chevalier nerveux

m.rc_nervous_1a = J'aimerais acheter quelque chose avec les crowns que j'ai gagn\u00e9s sur le \
  Terrain d'entra\u00eenement, mais ce marchand me donne vraiment la chair de poule. Qu'est-ce \
  qu'il peut bien cacher sous sa robe, \u00e0 votre avis ?!

r.rc_nervous_1a = Terminer la conversation

# Forge Knight
#...................................................................................................
n.rc_forge = Chevalier de forge
m.forge_knight_1a = Cradle est un monde dangereux, et pour survivre, il est important d'avoir de \
  l'\u00e9quipement puissant dans votre arsenal. Pour cela, vous devrez utiliser la Forge.

r.forge_knight_1a = Qu'est-ce que la Forge ?

m.forge_knight_2a = La Forge utilise la chaleur accumul\u00e9e dans votre \u00e9quipement et la \
  combine \u00e0 la puissance des Fire Crystals pour en lib\u00e9rer tout le potentiel.

r.forge_knight_2a = Continuer

m.forge_knight_3a = En ville, vous pouvez acc\u00e9der \u00e0 la Forge \u00e0 tout moment. Dans \
  les Rouages, vous pouvez y acc\u00e9der en utilisant un poste d'arsenal.

r.forge_knight_3a = Continuer

m.forge_knight_4a = Dans la Forge, vous verrez la liste de tous les objets pr\u00eats \u00e0 monter \
  de niveau. S\u00e9lectionnez un objet pour voir comment il peut \u00eatre am\u00e9lior\u00e9.

r.forge_knight_4a = Continuer

m.forge_knight_5a = Chaque objet n\u00e9cessite un type pr\u00e9cis de Fire Crystal. Les Fire \
  Crystals sont disponibles au D\u00e9p\u00f4t des provisions, s'obtiennent en accomplissant \
  certaines missions et se trouvent dans les blocs de tr\u00e9sor des Rouages !

r.forge_knight_5a = Comment les Fire Crystals marchent-ils ?

m.forge_knight_6a = Les Fire Crystals sont assez instables : la quantit\u00e9 n\u00e9cessaire pour \
  r\u00e9ussir une forge varie. \nDe plus, nous avons d\u00e9couvert qu'ajouter davantage de Fire \
  Crystals donne des chances d'obtenir des bonus sp\u00e9ciaux qui seront appliqu\u00e9s \u00e0 \
  l'objet ! \n
r.forge_knight_6a = \u00c7a a l'air g\u00e9nial !

m.forge_knight_7a = Maintenant que vous en savez plus sur la Forge, voulez-vous y jeter un \u0153il ?

r.forge_knight_7a = Bien s\u00fbr ! (Ouvrir la Forge)
r.forge_knight_7b = Je la regarderai plus tard. (Terminer la conversation)

# Geo Knight
#...................................................................................................


m.rc_soil_1a = Je collecte des \u00e9chantillons g\u00e9ologiques pour Spiral HQ. Jusqu'ici, mes \
  analyses ont identifi\u00e9 des centaines de sols uniques dans chaque centim\u00e8tre du terrain \
  sous nos pieds. C'est impossible, j'ai d\u00fb faire une erreur de calcul...

r.rc_soil_1a = Terminer la conversation

# Veteran Knights
#...................................................................................................
n.rc_vet_1 = Gardien Spiral
n.rc_vet_2 = Chevalier v\u00e9t\u00e9ran

m.rc_vet_1a = Merci pour votre aide de toute \u00e0 l'heure. Faites attention \u00e0 vous !
m.rc_vet_2a = Restez toujours sur vos gardes. Qui sait quels autres dangers nous attendent dans ce \
  monde ?
m.rc_vet_3a = Je ne pourrai pas me d\u00e9tendre tant que nous n'aurons pas \u00e9tabli le contact \
  avec Spiral HQ.

r.rc_vet_1a = Terminer la conversation

# Rhendon
#...................................................................................................

m.rc_rhendon_1a = Qu'est-ce que ce truc peut bien \u00eatre, d'apr\u00e8s vous, {0} ? \u00c7a doit \
  \u00eatre important, vu comment ce Razwog s'est \u00e9nerv\u00e9 quand vous le lui avez pris. \n\
  \nBien fait pour lui, apr\u00e8s avoir essay\u00e9 de vous tuer et tout !

r.rc_rhendon_1a = Terminer la conversation

# Kinter
#...................................................................................................


m.rc_instruct_1a = Bienvenue, recrue. Toujours heureux de voir un autre chevalier arriver au Camp \
  de refuge. J'imagine que vous cherchez \u00e0 vous pr\u00e9parer pour votre voyage vers Haven. \
  Le mieux est de commencer par la porte des Rouages, juste ici. Approchez-vous du panneau de \
  contr\u00f4le situ\u00e9 au nord de l'ascenseur et appuyez sur le bouton d'action \
  ([[ ?ACTION]]).\n\nDes questions ?

r.rc_instruct_1a = Oui, des tas !

r.rc_instruct_1b = Non, je pr\u00e9f\u00e8re passer \u00e0 l'action tout de suite.

m.rc_instruct_2a = Que voulez-vous savoir ?

r.rc_instruct_2a = Les \u00abRouages\u00bb ?

r.rc_instruct_2b = Vous avez parl\u00e9 d'une \u00abporte\u00bb ?

r.rc_instruct_2c = R\u00e9flexion faite, je vais y aller.


m.rc_instruct_3a = Les Rouages sont des machines aussi gigantesques que complexes, faites \
  d'engrenages et de m\u00e9canismes et enterr\u00e9es juste sous la surface de ce monde. Elles \
  sont \u00e0 couper le souffle ! Ce monde est fort \u00e9trange et regorge de p\u00e9rils, vous \
  savez. Faites attention \u00e0 vous.

m.rc_instruct_3b = Une \u00abporte\u00bb est un point d'acc\u00e8s aux Rouages. Les portes se \
  pr\u00e9sentent sous forme d'ascenseurs, comme ceux que vous avez sous les yeux. Chaque porte \
  est \u00e9quip\u00e9e d'un \u00e9cran affichant son ic\u00f4ne unique et d'un panneau de \
  contr\u00f4le permettant d'y entrer. Cette porte-ci vous m\u00e8nera toujours au m\u00eame \
  endroit, mais sous d'autres portes, les niveaux changent sans cesse. Avec celles-l\u00e0, vous \
  ne savez jamais vraiment ce qui vous attend !


r.rc_instruct_3a = J'ai une autre question.

r.rc_instruct_3b = Merci pour ces informations. Je vais m'entra\u00eener !


# Boomer
#...................................................................................................


m.rc_bomb_1a = Avez-vous d\u00e9j\u00e0 pos\u00e9 une bombe ? Contrairement aux autres armes, il \
  faut syst\u00e9matiquement les charger. Sinon, elles n'explosent pas. Chargez-les et... BOUM ! \
  Elles sont capables de faire des ravages sur des groupes de monstres entiers !

r.rc_bomb_1a = \u00c7a va \u00eatre explosif ! J'en ach\u00e8terai peut-\u00eatre au marchand \
  ambulant.


# Cautious Knight
#...................................................................................................

n.rc_warning = Chevalier prudent

m.rc_warning_1a = En haut de ces marches se trouve la porte du Haven. Assurez-vous de parler \
  \u00e0 Virgil avant d'entrer pour savoir \u00e0 quoi vous attendre.

r.rc_warning_1a = Bien s\u00fbr, je ne manquerai pas d'aller voir Virgil.


# Sleepy Knight
#...................................................................................................

n.rc_sleepy = Chevalier fatigu\u00e9

m.rc_sleepy_1a = Entra\u00eenement... \u00e9reintant... Paupi\u00e8res... lourdes...

r.rc_sleepy_1a = Terminer la conversation


# Virgil
#...................................................................................................


m.rc_virgil_1a = Faites attention l\u00e0-bas.

r.rc_virgil_1a = Pourquoi ?

m.rc_virgil_2a = Cette passerelle s'avance au-dessus d'un immense gouffre. Je ne voudrais pas \
  qu'une rafale vous pr\u00e9cipite dans le n\u00e9ant en contrebas.

r.rc_virgil_2a = Alors pourquoi cette passerelle est-elle l\u00e0 ?

m.rc_virgil_3a = Elle semble mener \u00e0 une sorte d'ascenseur, mais sans \u00e9nergie, tout est \
  compl\u00e8tement mort.

r.rc_virgil_3a = Je ferai attention.

m.rc_virgil_4a = Salutations, {0}. Quand vous avez r\u00e9tabli l'\u00e9nergie du camp, cet \
  ascenseur s'est remis en marche lui aussi. J'imagine qu'il peut vous emmener tout au fond du \
  gouffre, et personne ne sait ce que vous y trouverez. \n\nSi vous comptez descendre dans ces \
  profondeurs, assurez-vous d'\u00eatre en mesure d'affronter ce qui vous y attend.

r.rc_virgil_4a = Terminer la conversation

m.rc_end_1a = Vous y \u00eates, recrue. Voici la derni\u00e8re porte : elle permet de quitter le \
  Camp de refuge, de traverser le gouffre et de rejoindre Haven. Une fois que vous l'aurez \
  franchie, vous n'aurez plus jamais besoin de revenir ici. \u00c0 Haven, vous pourrez acheter \
  tout ce qu'on trouve au Camp de refuge, et bien plus encore. \n\nDes questions ?

r.rc_end_1a = Oui, j'aimerais vous poser quelques questions.

r.rc_end_1b = J'ai tout compris, merci.

m.rc_end_2a = Que puis-je faire pour vous ?

r.rc_end_2a = Une fois \u00e0 Haven, je ne pourrai vraiment plus revenir ici ?

r.rc_end_2b = Quels d\u00e9fis devrai-je relever derri\u00e8re la derni\u00e8re porte ?

r.rc_end_2c = Que devrai-je faire une fois \u00e0 Haven ?

r.rc_end_2d = Je n'ai plus de questions. Au revoir !

m.rc_end_3a = Non, vous ne pourrez pas revenir. Une fois \u00e0 Haven, votre entra\u00eenement \
  sera termin\u00e9 et votre nouvel objectif sera d'aider les Spiral Knights d\u00e9sormais \
  bas\u00e9s \u00e0 Haven.

m.rc_end_3b = La route sera dangereuse, mais vous ne vous enfoncerez pas tr\u00e8s loin. Les \
  monstres que vous rencontrerez ne devraient pas vous poser de probl\u00e8mes. Cela dit, \
  plusieurs \u00e9claireurs nous ont signal\u00e9 un regain d'activit\u00e9 chez les Gremlins \
  du secteur depuis que nous nous y sommes install\u00e9s, alors restez sur vos gardes.

m.rc_end_3c = Une fois \u00e0 Haven, je vous conseille d'explorer la ville et de vous familiariser \
  avec tous les lieux et services qu'elle propose. Vous y aurez acc\u00e8s \u00e0 de \
  l'\u00e9quipement plus puissant que ce que nous proposons ici, et vous y c\u00f4toierez bien \
  d'autres chevaliers plus exp\u00e9riment\u00e9s. N'h\u00e9sitez pas \u00e0 leur demander de \
  l'aide si vous vous perdez.

r.rc_end_3a = J'ai une autre question.

r.rc_end_3b = Merci. J'irai \u00e0 la porte une fois mes pr\u00e9paratifs termin\u00e9s.

