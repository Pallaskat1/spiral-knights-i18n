m.mission_lockedoutknight_c = Merci d'avoir sauv\u00e9 notre \u00e9quipe !

m.mission_lab_bystander_a = Ils sont apparus comme par enchantement...
m.mission_lab_bystander_b = Nos gardes \u00e9taient boulevers\u00e9s. Nous n'avions pas la \
