# Lab, Post-Attack
m.lab_progress_3 = Heureusement, le labo n'est pas consid\u00e9rablement endommag\u00e9. Au moins, l'\u00e9\
  quipement pour maintenir nos sprites de bataille est encore intact.

m.lab_progress_4 = Nous avons doubl\u00e9 le nombre de patrouilles autour du Haven au cas o\u00f9 \
  il y aurait une autre attaque, mais j'ai l'impression que ces gremlins ont d\u00e9j\u00e0 obtenu \
  ce qu'ils \u00e9taient venus chercher...

m.lab_progress_5 = Il nous faudra un peu de temps pour remettre tout notre \u00e9quipement en \
  \u00e9tat de marche.

# Royal Jelly
m.lab_progress_6 = Ce palais des gel\u00e9es... quel endroit bizarre. Et je me demande bien ce \
  qu'\u00e9tait cet \u00e9trange appareil que vous avez trouv\u00e9 dans le palais ? Il ne semblait \
  pas avoir \u00e9t\u00e9 fabriqu\u00e9 par des gel\u00e9es.

m.lab_progress_7 = Lors de tr\u00e8s rares occasions, j'ai trouv\u00e9 des gel\u00e9es qui ne nous \
  attaquaient pas \u00e0 vue. Je suis en train de retirer les piquants de celle-ci. Elles sont \
  plut\u00f4t mignonnes quand elles n'essaient pas de vous empaler !

# Roarmulus
m.lab_progress_8 = Ce gremlin vient de la colonie d'Emberlight, au plus profond des Rouages. Ce \
  sont des parias qui ont d\u00e9fi\u00e9 le roi Tinkinzar et l'Ordre Incarnat. Nous esp\u00e9rons \
  conclure avec eux un trait\u00e9 qui nous permettrait d'utiliser leur colonie comme base \
  d'op\u00e9rations pour nos missions plus profondes sous terre.

m.emberlight_visitor_1a = Les Gremlins d'Emberlight vous remercient pour arr\u00eater cette menace.

r.emberlight_visitor_1a = Continuer

m.emberlight_visitor_2a = Mais moi venir vous avertir ! Ordre Incarnat pas s'arr\u00eater avec \
  Projet Roarmulus. Ordre Incarnat vouloir \u00e0 tout prix d\u00e9truire tous ennemis. Grands, \
  petits et parias. Tous ennemis de Ordre Incarnat !

r.emberlight_visitor_2a = Merci pour l'avertissement, Pakrat.

m.emberlight_visitor_3a = Vous aider pour quelque chose ?
r.emberlight_visitor_3a = Parlez-moi d'Emberlight.
r.emberlight_visitor_3b = Pourquoi le roi Tinkinzar essaie de d\u00e9truire Haven ?
r.emberlight_visitor_3c = J'ai assez d'info, merci. (Terminer la conversation)

m.emberlight_visitor_4a = Emberlight fond\u00e9e par gremlins parias de Grande Colonie. Gremlins \
  d'Emberlight pas ob\u00e9ir \u00e0 Loi de fer, alors fuir ou mourir. Nous recommencer avec \
  Emberlight. Nouvelle colonie maison de quelques-uns de nous : surtout anciens intrigants, \
  quelques marchands, quelques combattants, tous tra\u00eetres aux yeux de gremlins de Grande \
  Colonie.

r.emberlight_visitor_4a = Une question de plus, Pakrat.

m.emberlight_visitor_4b = Personne savoir vraiment. Tinkinzar pas vu depuis beaucoup beaucoup \
  d'ann\u00e9es. Ordre Incarnat ex\u00e9cuter plans de Tinkinzar pour Cradle. Emberlight \u00eatre \
  tache sur grand plan parce que construite par parias. Haven s\u00fbrement pareil, fond\u00e9e \
  par non-gremlins. Pas dans le plan !

# Vanaduke
m.lab_progress_9 = Encore un \u00e9trange appareil ! De toute \u00e9vidence, celui-ci n'a pas plus \
  \u00e9t\u00e9 fabriqu\u00e9 par les Almiriens que le pr\u00e9c\u00e9dent ne l'avait \
  \u00e9t\u00e9 par les gel\u00e9es. Mais nous avons remarqu\u00e9 une chose : cet appareil est \
  toujours actif. Qui plus est, sa signature \u00e9nerg\u00e9tique ressemble aux relev\u00e9s que \
  nous avions faits sur l'Artefact avant qu'il ne soit vol\u00e9. Je crois que cela m\u00e9rite \
  des recherches plus approfondies.

m.almire_historian_1a = Nous avons r\u00e9cup\u00e9r\u00e9 le peu d'\u00e9crits qui subsistent au \
  Ch\u00e2teau Owlite sur le royaume d'Almire. En y ajoutant les bribes d'informations obtenues \
  aupr\u00e8s des sprites de la nature dans la Citadelle Feurieuse elle-m\u00eame, nous \
  commen\u00e7ons \u00e0 y voir plus clair dans l'histoire d'Almire.

r.almire_historian_1a = Qu'est-ce que vous avez appris \u00e0 propos d'Almire ?

m.almire_historian_2a = Gr\u00e2ce aux tomes que nous avons r\u00e9cup\u00e9r\u00e9s, nous avons \
  appris qu'il y a des milliers d'ann\u00e9es, la Citadelle Feurieuse faisait partie d'un royaume \
  bien plus vaste, appel\u00e9 Almire. Bien qu'entour\u00e9 d'autres nations belliqueuses, Almire \
  \u00e9tait r\u00e9put\u00e9 pour les prouesses martiales de ses nombreuses l\u00e9gions. Ces \
  l\u00e9gions ont prot\u00e9g\u00e9 le royaume pendant de longues ann\u00e9es. H\u00e9las, cela \
  n'a pas suffi.

r.almire_historian_2a = Qu'est-il arriv\u00e9 au reste du royaume ?

m.almire_historian_3a = Eh bien, nous savons d\u00e9sormais qu'il existait d'immenses citadelles \
  abritant les forces arm\u00e9es d'Almire, ainsi que de grands domaines pour ses maisons nobles. \
  Ce devait \u00eatre un spectacle impressionnant. Nous supposons que le reste du royaume n'est \
  plus qu'une ruine fumante, quelque part. Il est possible qu'une partie ait surv\u00e9cu... mais \
  au vu des t\u00e9moignages, nous pensons que c'est au mieux improbable.

# Biscotti, Lab Pre-Selection
#...................................................................................................

m.lab_biscotti_1a = Coucou ! Moi, c'est Biscotti, chef de cuisine du Skylark ! Je suis encore en \
  train d'\u00e9talonner l'alchimiseur de nourriture pour sprites de bataille, alors repassez me \
  voir plus tard.

r.lab_biscotti_1a = Les sprites de bataille mangent de la nourriture ?

m.lab_biscotti_2a = Eh oui ! Un sprite de bataille peut synth\u00e9tiser la mati\u00e8re en \
  \u00e9nergie utilisable. Cette machine peut prendre certains mat\u00e9riaux et les transmuter en \
  nourriture extra sp\u00e9ciale pour sprites... enfin, quand elle sera calibr\u00e9e.

r.lab_biscotti_2a = Je reviens plus tard. \u00c0 plus.

# Biscotti, Lab Post-Selection
#...................................................................................................
m.lab_biscotti_3a = Coucou, {0} ! En tant que chef de cuisine du Skylark, on m'a charg\u00e9e de \
  superviser le d\u00e9veloppement nutritionnel de nos nouveaux compagnons sprites. Ils semblent \
  s'\u00eatre vraiment diversifi\u00e9s l\u00e0-dessous, dans les Rouages. Ce sera \
  int\u00e9ressant de voir comment ils vont \u00e9voluer. \n\nAvez-vous des questions sur \
  l'alimentation et les soins de votre sprite ?

m.lab_biscotti_3aa = Avez-vous d'autres questions sur l'alimentation et les soins de votre sprite ?

r.lab_biscotti_3a = Comment puis-je nourrir mon sprite de bataille ?
r.lab_biscotti_3b = Parlez-moi de l'app\u00e9tit.
r.lab_biscotti_3c = Parlez-moi des objets pr\u00e9f\u00e9r\u00e9s.
r.lab_biscotti_3d = Parlez-moi des objets requis.
r.lab_biscotti_3e = Rien pour l'instant, merci.

m.lab_biscotti_4a = Nourrir votre sprite de bataille, c'est facile ! Ouvrez simplement l'interface \
  des sprites de bataille et s\u00e9lectionnez l'ic\u00f4ne de votre sprite. De l\u00e0, vous \
  pouvez choisir un mat\u00e9riau de votre arsenal et le d\u00e9poser sur le plateau de \
  nourriture. \n\nUne fois le mat\u00e9riau pr\u00eat \u00e0 \u00eatre synth\u00e9tis\u00e9 par \
  votre sprite, cliquez simplement sur \u00abNourrir le sprite\u00bb et bon app\u00e9tit !

r.lab_biscotti_4a = J'ai d'autres questions.
r.lab_biscotti_4aa = C'est tout pour l'instant, merci !

m.lab_biscotti_4b = Les sprites ont un app\u00e9tit fixe qui limite la quantit\u00e9 de \
  mat\u00e9riaux qu'ils peuvent manger \u00e0 un moment donn\u00e9. Quand vous donnez un \
  mat\u00e9riau \u00e0 votre sprite, son app\u00e9tit diminue. Une fois son app\u00e9tit \
  \u00e9puis\u00e9, vous ne pourrez plus le nourrir.

r.lab_biscotti_4b = Pour mon sprite, comment le mettre en app\u00e9tit ?

m.lab_biscotti_5b = L'app\u00e9tit d'un sprite augmente naturellement avec le temps, mais \
  lentement. Pour l'augmenter plus vite, emmenez votre sprite faire un tour dans les Rouages. \
  Absorber la chaleur des monstres, c'est un excellent moyen de br\u00fbler des calories !

m.lab_biscotti_4c = \u00c0 tout moment, un sprite a un \u00abitem pr\u00e9f\u00e9r\u00e9\u00bb, un \
  mat\u00e9riau sp\u00e9cial qu'il adore manger plus que tout. En donner un \u00e0 votre sprite \
  est un vrai r\u00e9gal pour lui et lui rapporte beaucoup de chaleur.

r.lab_biscotti_4c = O\u00f9 puis-je me procurer ces objets ?

m.lab_biscotti_5c = Les objets pr\u00e9f\u00e9r\u00e9s peuvent \u00eatre alchimis\u00e9s gr\u00e2ce \
  \u00e0 la machine d'alchimie que vous voyez juste devant vous. Il suffit de deux exemplaires \
  d'un m\u00eame mat\u00e9riau et de quelques min\u00e9raux des Rouages. Facile !

m.lab_biscotti_4d = Les objets requis apparaissent quand votre sprite est pr\u00eat \u00e0 monter \
  de niveau. Une fois que votre sprite a consomm\u00e9 assez de chaleur, la mention \
  \u00abmat\u00e9riau requis\u00bb appara\u00eet au-dessus du plateau de nourriture. Vous DEVEZ \
  donner ce mat\u00e9riau \u00e0 votre sprite pour qu'il puisse continuer \u00e0 progresser.

r.lab_biscotti_4d = Continuer

m.lab_biscotti_5d = La plupart du temps, il s'agit simplement d'un objet pr\u00e9f\u00e9r\u00e9 \
  ordinaire, mais quand votre sprite est pr\u00eat \u00e0 \u00e9voluer, il lui faut un Evo Catalyst.

# Riley, Harness Merchant
#...................................................................................................
m.lab_harness_1a = Je m'appelle Riley, l'assistant de Morlin. Je suis en train de mettre au point \
  un moyen d'am\u00e9liorer encore davantage nos sprites de bataille. Revenez me voir quand vous \
  aurez obtenu un sprite li\u00e9 \u00e0 vous de fa\u00e7on permanente.

r.lab_harness_1a = Je reviens plus tard, merci.

# Morlin, Sprite Tutorial
#...................................................................................................
m.sprite_tut_1a = Bonjour, {0}. J'imagine que vous avez des questions sur les sprites de \
  bataille. Comment puis-je vous aider ?
m.sprite_tut_1aa = D'autres questions sur les sprites de bataille ? Comment puis-je vous aider ?

r.sprite_tut_1a = Comment les sprites montent-ils de niveau et \u00e9voluent-ils ?
r.sprite_tut_1b = Parlez-moi des comp\u00e9tences des sprites.
r.sprite_tut_1c = Que sont les harnais de sprite ?
r.sprite_tut_1d = Que sont les avantages de sprite ?
r.sprite_tut_1e = Rien pour l'instant, merci.

m.sprite_tut_2a = Les sprites de bataille montent de niveau en accumulant de la chaleur, tout \
  comme vos armes et votre \u00e9quipement. Ils peuvent acqu\u00e9rir de la chaleur de deux \
  fa\u00e7ons : en l'absorbant pendant que vous combattez dans les Rouages, et en consommant des \
  mat\u00e9riaux qu'ils synth\u00e9tisent en chaleur.

r.sprite_tut_2a = Continuer

m.sprite_tut_3a = Nourrir votre sprite avec des mat\u00e9riaux est le moyen le plus rapide de le \
  faire monter de niveau. Parlez \u00e0 Biscotti, ici au Labo, pour en savoir plus sur \
  l'alimentation des sprites.

r.sprite_tut_3a = Et comment mon sprite \u00e9volue-t-il ?

m.sprite_tut_4a = Votre sprite \u00e9voluera \u00e0 mesure que vous le ferez monter de niveau. \
  \u00c0 certains niveaux cl\u00e9s, il faudra lui donner un Evo Catalyst pour qu'il puisse \
  continuer \u00e0 progresser. Une fois nourri, votre sprite changera physiquement d'apparence ! \n\
  \nCe sera int\u00e9ressant de voir comment ces nouvelles et \u00e9tranges formes de sprites de \
  bataille \u00e9volueront avec le temps.

r.sprite_tut_4a = J'ai d'autres questions.
r.sprite_tut_4aa = C'est tout pour l'instant, merci !

m.sprite_tut_2b = En montant de niveau, un sprite apprend de nouvelles comp\u00e9tences de combat \
  et gagne des points de comp\u00e9tence.

r.sprite_tut_2b = Continuer

m.sprite_tut_3b = Chaque sprite de bataille apprendra trois comp\u00e9tences que vous pourrez \
  utiliser au combat. Les comp\u00e9tences s'apprennent automatiquement \u00e0 certains niveaux, \
  \u00e0 mesure que le sprite progresse. \n\nLes comp\u00e9tences de combat deviennent plus \
  puissantes gr\u00e2ce aux points de comp\u00e9tence.

r.sprite_tut_3b = Continuer

m.sprite_tut_4b = Un sprite gagne r\u00e9guli\u00e8rement des points de comp\u00e9tence en montant \
  de niveau. Vous pouvez les attribuer \u00e0 ses comp\u00e9tences dans l'interface des sprites de \
  bataille. \n\nQuand vous attribuez un point de comp\u00e9tence, vous devez choisir une \
  caract\u00e9ristique \u00e0 am\u00e9liorer, comme le temps d'attente ou les dommages globaux.

r.sprite_tut_4b = Continuer

m.sprite_tut_5b = Et ne vous inqui\u00e9tez pas d'attribuer vos points de comp\u00e9tence \u00abde \
  la mauvaise fa\u00e7on\u00bb, car vous finirez par gagner assez de points pour maximiser toutes \
  vos comp\u00e9tences !

r.sprite_tut_5b = Continuer

m.sprite_tut_6b = Une fois que vous aurez attribu\u00e9 tous vos points de comp\u00e9tence et que \
  votre sprite aura atteint un niveau tr\u00e8s \u00e9lev\u00e9, vous commencerez \u00e0 choisir \
  vos \u00abcomp\u00e9tences ultimes\u00bb. Les comp\u00e9tences ultimes sont des versions \
  am\u00e9lior\u00e9es des comp\u00e9tences de votre sprite. Chaque comp\u00e9tence de sprite \
  propose deux options de comp\u00e9tence ultime.

r.sprite_tut_6b = Continuer

m.sprite_tut_7b = Vous ne pouvez choisir qu'une seule comp\u00e9tence ultime par comp\u00e9tence \
  de sprite, alors choisissez bien ! Notez aussi que le choix des comp\u00e9tences ultimes \
  modifiera encore l'apparence de votre sprite. \n\nAvec toutes ces options, votre sprite de \
  niveau maximum aura forc\u00e9ment une apparence et un comportement diff\u00e9rents de tous les \
  autres !

r.sprite_tut_7b = J'ai d'autres questions.
r.sprite_tut_7bb = C'est tout pour l'instant, merci !

m.sprite_tut_2c = Tous les sprites de bataille portent un harnais m\u00e9canique qui associe leurs \
  comp\u00e9tences \u00e0 un type de dommages. Cependant, tous les sprites ne peuvent pas porter \
  tous les harnais. Par exemple, un drakon ne peut pas infliger de dommages per\u00e7ants. \n\nPar \
  d\u00e9faut, vous disposez d'un harnais en fer que n'importe quel sprite peut \u00e9quiper. Si \
  vous voulez diversifier vos options, comme vous le faites sans doute avec vos armes et votre \
  \u00e9quipement, vous devrez acheter de nouveaux harnais.

r.sprite_tut_2c = O\u00f9 puis-je acheter d'autres harnais ?

m.sprite_tut_3c = Allez voir Riley, ici au Labo, pour acheter de nouveaux harnais. Une fois \
  achet\u00e9, un harnais est automatiquement ajout\u00e9 \u00e0 votre liste de harnais dans \
  l'interface des sprites de bataille. \n\nDe plus, chaque fois que vous achetez une \
  am\u00e9lioration directe d'un harnais que vous poss\u00e9dez, celui-ci est remplac\u00e9 par le \
  harnais sup\u00e9rieur.

r.sprite_tut_3c = Continuer

m.sprite_tut_4c = Les am\u00e9liorations de harnais valent vraiment leur prix en crowns. Les \
  versions sup\u00e9rieures de chaque harnais r\u00e9duisent le temps d'attente des \
  comp\u00e9tences de combat !

r.sprite_tut_4c = J'ai d'autres questions.
r.sprite_tut_4cc = C'est tout pour l'instant, merci !

m.sprite_tut_2d = \u00c0 certains niveaux, les sprites de bataille obtiennent des avantages que \
  vous pouvez \u00e9quiper dans l'interface des sprites de bataille. Les avantages octroient des \
  bonus \u00e0 vos statistiques.

r.sprite_tut_2d = Continuer

m.sprite_tut_3d = Les avantages se d\u00e9bloquent au hasard. Certains sont bien plus rares que \
  d'autres, et un sprite devra atteindre un niveau tr\u00e8s \u00e9lev\u00e9 pour tous les \
  d\u00e9bloquer. \n\nVous pouvez m\u00eame obtenir des avantages apr\u00e8s avoir atteint le \
  niveau 100 !

r.sprite_tut_3d = J'ai d'autres questions.
r.sprite_tut_3dd = C'est tout pour l'instant, merci !

## HAVEN STRANGERS


# Hailoh
#...................................................................................................


m.hav_greeter_1a = Bienvenue \u00e0 Haven, petit \u00eatre. Je vous en prie, faites comme vos amis \
  et allez chercher des babioles brillantes dans les Rouages. Les \u00c9trangers appr\u00e9cient \
  toujours les babioles brillantes.

r.hav_greeter_1a = Terminer la conversation


# Warnel
#...................................................................................................


m.hav_snipes_1a = Faites attention de ne pas marcher sur les b\u00e9cassines, d'accord ?

r.hav_snipes_1a = Les b\u00e9cassines ?

m.hav_snipes_2a = Les b\u00e9cassines sont ces oiseaux gracieux, adorables et d\u00e9licieusement \
  dodus que l'on voit se promener partout dans Haven. Certains disent que ce sont les plus belles \
  cr\u00e9atures de la galaxie, mais vous ne l'entendrez jamais de la bouche des b\u00e9cassines \
  elles-m\u00eames, car elles sont d'une modestie incroyable.

r.hav_snipes_2a = Terminer la conversation


# Plinkop
#...................................................................................................


m.hav_clock_1a = Bonjour ! On dirait que vous avez besoin d'informations.

r.hav_clock_1a = Dites-moi ce que vous savez \u00e0 propos des Rouages.

r.hav_clock_1b = Non, pas pour le moment. Merci.

m.hav_clock_2a = Tr\u00e8s bien, je vais vous dire tout ce que je sais.

r.hav_clock_2a = Quel est l'\u00e2ge des Rouages ?

r.hav_clock_2b = Qui a construit les Rouages ?

r.hav_clock_2c = Qu'allons-nous trouver dans le noyau ?

r.hav_clock_2d = R\u00e9flexion faite, j'ai une aventure \u00e0 terminer. Au revoir !

m.hav_clock_3a = C'est difficile \u00e0 dire avec pr\u00e9cision, les Rouages semblent provenir \
  de diff\u00e9rents mondes. On parle de royaumes antiques oubli\u00e9s qui auraient abrit\u00e9 \
  d'innombrables dieux et cr\u00e9atures aujourd'hui disparus. \n\
  \n\
  Ce monde est une aberration. Rien ici n'est \u00e0 sa place. L'histoire de ces dizaines de \
  mondes qui tourbillonne inlassablement, \u00e0 l'image des engrenages de cette grande \
  machine... C'est triste, je trouve.

m.hav_clock_3b = Il existe plusieurs th\u00e9ories. Pour certains, ce sont les Gremlins qui \
  s'activent \u00e0 les faire fonctionner. Mais cela semble au-dessus de leurs forces, m\u00ea\
  me s'ils sont trop nombreux pour qu'on les compte. Et m\u00eame s'ils en avaient \u00e9t\u00e9 capables, par o\u00f9 auraient-ils commenc\u00e9 ? O\u00f9 auraient-ils trouv\u00e9 l'\u00e9nergie n\u00e9cessaire ?

m.hav_clock_3c = Un pouvoir incommensurable. On d\u00e9tecte une \u00e9nergie ph\u00e9nom\u00e9nale \u00e9\
  manant du centre des Rouages, mais nous n'en savons gu\u00e8re plus. Personne n'y est jamais \
  parvenu, ou du moins, personne n'en est jamais revenu. \n\
  \n\
  C'est aux Gremlins qu'il faudrait poser cette question, car ils sont s\u00fbrement all\u00e9s \
  plus loin dans les Rouages que n'importe quelle autre cr\u00e9ature. Enfin, c'est plus facile \u00e0 dire qu'\u00e0 faire... Ils sont plut\u00f4t mal embouch\u00e9s.

r.hav_clock_3a = J'ai une autre question.

r.hav_clock_3b = Merci pour ces informations. \u00c0 la prochaine !


# Bootshuze
#...................................................................................................


m.hav_grem_1a = Bonjour ! On dirait que vous avez besoin d'informations.

r.hav_grem_1a = Dites-moi ce que vous savez \u00e0 propos des Gremlins.

r.hav_grem_1b = Non, pas pour le moment. Merci.

m.hav_grem_2a = Demandez-moi ce que vous voulez.

r.hav_grem_2a = Parlez-moi des Gremlins.

r.hav_grem_2b = Les Gremlins ont-ils un chef ?

r.hav_grem_2c = Existe-t-il des Gremlins aimables dans les Rouages ?

r.hav_grem_2d = Je dois filer. Plus tard, peut-\u00eatre.

m.hav_grem_3a = Les Gremlins sont des cr\u00e9atures dont les comp\u00e9tences m\u00e9caniques \
  tiennent du miracle. Ils forment \u00e0 la fois une arm\u00e9e de brillants artificiers et \
  une l\u00e9gion de puissants d\u00e9molisseurs.

m.hav_grem_3b = Tous les Gremlins appartenant \u00e0 la colonie sont sous les ordres du roi \
  Tinkinzar. On dit de lui que c'est un grand monarque et un g\u00e9nie de la m\u00e9canique, et \
  que l'ensemble des Rouages serait le fruit de sa vision. D'apr\u00e8s nos sources, cependant, il \
  ne se montre jamais aux Gremlins ordinaires : ses ordres sont transmis et ex\u00e9cut\u00e9s par \
  l'Ordre Incarnat, une bande de Gremlins redoutables et fanatiques, les seuls \u00e0 pouvoir \
  obtenir une audience aupr\u00e8s du grand roi.

m.hav_grem_3c = La plupart d'entre eux vous attaqueront \u00e0 vue, mais il existe quelques \
  parias qui ont trouv\u00e9 refuge dans les villes situ\u00e9es sous la surface. Ceux-l\u00e0 m\u00e8\
  nent une morne existence, ha\u00efs par les leurs et loin de leur foyer.

r.hav_grem_3a = J'ai une autre question.

r.hav_grem_3b = Merci pour ces informations. \u00c0 la prochaine !



## MOORCROFT MANOR

