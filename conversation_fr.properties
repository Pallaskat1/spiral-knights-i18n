m.casino_monster_a = H\u00e9, pas de tricheries !
m.casino_monster_b = Arr\u00eatez de jeter un coup d'\u0153il derri\u00e8re moi.
m.casino_monster_c = Je pense que personne ne remarquera ma disparition.
m.casino_monster_d = Je peux emprunter votre arme ?
m.casino_monster_e = H\u00e9, en avant !
m.casino_monster_f = Shh, ne dites pas \u00e0 personne que je suis ici.

m.casino_klepto_a = Je ne volerai rien... je te jure !
m.casino_klepto_b = H\u00e9, c'est quoi \u00e7a l\u00e0-bas ?
m.casino_klepto_c = Je ne suis pas le Kleptolisk que vous cherchez.

m.casino_skelly_a = Si... brillant...
m.casino_skelly_b = Essayer de nouveau...
m.casino_skelly_c = Je ne suis jamais parti...

m.casino_royaljelly_a = Je suis arriv\u00e9 de Moorcroft et ouf, mes royal cores sont \u00e9puis\u00e9s.
m.casino_royaljelly_b = Voici un jelly gem pour vous...
m.casino_royaljelly_c = Trois lichens se glissent dans une salle...
m.casino_royaljelly_d = N'oubliez pas \u00e0 donner un pouboire au serveur.

m.casino_guard_a = Glorp ! Pas des ennuis ici.
m.casino_guard_b = Golden Slime vous accueille. Glorp !
m.casino_guard_c = Glorp glorp. Amusez-vous.

m.casino_imposto_a = Un autre Gel Core, s'il vous pla\u00eet. Agit\u00e9.
m.casino_imposto_b = Oh, je ne vous ai jamais rencontr\u00e9 ici auparavant !
m.casino_imposto_c = Serveur ? Oh, veuillez m'excuser monsieur.

