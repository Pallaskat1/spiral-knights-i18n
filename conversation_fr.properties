m.hav_mecha_1a = J'ai fait une excellente affaire avec ce Mecha Knight cass\u00e9. Si je parviens \u00e0 le r\u00e9\
  parer, j'aurai un garde du corps \u00e0 mes c\u00f4t\u00e9s lors de mes exp\u00e9ditions dans \
  les Rouages.

