# Bechamel (Guild Hall)



# Hunters Lodge
#...................................................................................................

m.hunter_1a = Bonjour, cher chevalier. Je m'appelle Armero, le grand chasseur de la nature et \
  le conservateur de ce pavillon prestigeux duquel vous voyez devant vous.\n\
  \n\
  Sur les murs on voit les troph\u00e9es obtenues des expeditions courageux, o\u00f9 on met sa \
  vie en danger pour avoir les sensations et frissons de la chasse.\n\
  \n\
  Alors, que dites-vous ? Cela vous \u00e9veille ? Avez-vous un go\u00fbt pour le danger ?

r.hunter_1a = J'ai d\u00e9j\u00e0 vu le danger, et c'est \u00e7a que j'aime.

m.hunter_2a = Excellent ! Peut-\u00eatre vous et vos camarades rendriez service au pavillon. \u00c9\
  coutez, la machine d'alchimie que vous voyez ici fabriqueront les magnifiques troph\u00e9es \
  de monstres pour votre Si\u00e8ge de guilde.\n\
  \n\
  Les machines d'alchimie utilisent les mat\u00e9riaux et crowns de votre Tr\u00e9sorerie de \
  guilde et elles d\u00e9posent les r\u00e9sultats dans la Tr\u00e9sorerie aussi.

r.hunter_2a = Ah, alors on travaille en \u00e9quipe ?

m.hunter_3a = Exactement ! Les troph\u00e9es de monstre auront besoin beaucoup de mat\u00e9\
  riaux, alors cela n'est pas \u00e9tonnant qu'un effort de groupe est n\u00e9cessaire.\n\
  \n\
  Enfin, on a besoin quelques mat\u00e9riaux qu'on peut acqu\u00e9rir en \u00e9changeant les \
  jetons du boss chez Brinks dans le Bazaar du Haven. Ces jetons fonctionnent comme preuve - la \
  preuve que vous avez vaincu ces cr\u00e9atures effroyables !

r.hunter_3a = Bon, commen\u00e7ons la chasse.

m.hunter_4a = Voil\u00e0 comment il faut r\u00e9agir ! Donnez ces monstres un coup !

r.hunter_4a = Terminer la conversation.

# Monster Pockets
#...................................................................................................


m.mon_pocket_1 = Bonjour ! Je m'appelle Nonna avec l'Agence d'adoption d'Emberlight !\n\
  \n\
  \u00c0 l'Agence d'adoption d'Emberlight, nous rassemblons des monstres b\u00e9b\u00e9s qui se \
  trouvent perdus aux profondeurs les plus sombres dans les Rouages. N'ayant plus un habitat ni \
  un foyer ni une fa\u00e7on de se d\u00e9brouiller tout seul, nous essayons de trouver une \
  maison pour ces petits monstres !\n\
  \n\
  En achetant l'un de ces \u00abpoche-monstres\u00bb mignons, vous pouvez porter votre propre \
  monstre b\u00e9b\u00e9 !\n\
  \n\
  L'Agence d'adoption d'Emberlight visitera Haven de temps \u00e0 autre et on ne sait jamais ce \
  que nous offrirons !

r.mon_pocket_1 = Montrez-moi ce qui est pr\u00eat \u00e0 adopter !
r.mon_pocket_2 = Peut-\u00eatre la prochaine fois, Nonna, merci.


# Shadow Lair Warden
#...................................................................................................


m.sl_guard_1 = Soyez le bienvenue, chevalier. Devant vous on se trouve les ascenseurs qui m\u00e8nent \u00e0 \
  une place que Spiral HQ appelle les \u00abShadow Lairs\u00bb. Les Shadow Lairs contiennent \
  certains des monstres les plus puissants que nous avons rencontr\u00e9s dans les Rouages, \
  alors assurez-vous que vous \u00eates bien \u00e9quip\u00e9s pour le troisi\u00e8me \u00e9\
  chelon avant d'avancer plus loin.

r.sl_guard_1 = Continuez

m.sl_guard_2 = Les chevaliers \u00e9claireurs qui ont hasard\u00e9 dans ces nouveaux et \
  bizarres mondes disent qu'ils sentent une noirceur qui les entourent \u00e0 chaque tour. Il y \
  a quelque chose d'autre qui se passe et nous avons besoin des chevaliers plus \u00e9lites pour l'examiner.

r.sl_guard_2 = Je comprends. Y-a-t'il des autres choses que j'ai besoin ?

m.sl_guard_3 = Tous les Shadow Lairs sont ferm\u00e9s \u00e0 clef avec un m\u00e9canisme qui sont d\u00e9verrouill\u00e9s avec un \u00abShadow Key\u00bb\
  . Les Shadow Keys peuvent \u00eatre achet\u00e9s au D\u00e9p\u00f4t des provisions.\n\
  \n\
  Lorsqu'un membre du groupe utilise un Shadow Key, le groupe sera bloqu\u00e9 et ne peut pas \u00eatre chang\u00e9\
  , alors choisissez votre membres du groupe avec sagesse !

r.sl_guard_3 = Je vais obtenir un Shadow Key et commencer l'investigation !

m.sl_guard_4 = Bonne chance \u00e0 vous. Les Shadow Lairs seront les plus grands d\u00e9fis que \
  vous confronterez.

r.sl_guard_4 = Terminer conversation


