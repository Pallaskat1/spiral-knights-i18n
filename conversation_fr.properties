## HAVEN LABORATORY
#...................................................................................................


m.lab_knight1_1a = Nous avons r\u00e9cup\u00e9r\u00e9 ce que nous pouvions du Skylark et \
  bricol\u00e9 le reste avec l'aide des \u00c9trangers.
r.lab_knight1_1a = Terminer la conversation

m.lab_knight2_1a = Les \u00e9manations du noyau de ce monde ont eu d'\u00e9tranges effets sur nos \
  sprites de bataille.

m.lab_knight3_1a = Nous avons r\u00e9ussi \u00e0 r\u00e9cup\u00e9rer le g\u00e9n\u00e9rateur \
  secondaire du Skylark presque intact. Malheureusement, il est \u00e0 peine assez puissant pour \
  faire fonctionner ce labo, et encore moins pour alimenter notre vaisseau. Nous devrons trouver \
  une autre source d'\u00e9nergie si nous voulons un jour rentrer chez nous.

m.lab_knight4_1a = Les \u00e9quipes de reconnaissance ont r\u00e9cup\u00e9r\u00e9 des choses \
  bizarres et remarquables dans les Rouages.

m.lab_knight5_1a = {0}, avez-vous d\u00e9j\u00e0 vu ces min\u00e9raux au cours de vos voyages ? Ils \
  sont fascinants ! Vous devriez interroger le Chief Geo Knight Wegner \u00e0 leur sujet. Il \
  para\u00eet que c'est lui, l'expert en min\u00e9raux !

m.lab_knight6_1a = Nous ne prenons aucun risque avec cet artefact que vous avez trouv\u00e9, {0}. \
  Les gremlins pourraient bien revenir le chercher un jour. Restez sur vos gardes !

m.lab_knight7_1a = Les premi\u00e8res mesures cr\u00e8vent le plafond, {0} ! Nous n'avons jamais \
  rien vu de pareil. Il nous faudra du temps pour comprendre pleinement \u00e0 quoi sert cet objet.

m.lab_hahn_1a = (Hahn a l'air occup\u00e9 et ne semble pas vous remarquer)

