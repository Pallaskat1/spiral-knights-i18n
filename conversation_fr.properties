m.casino_yesman_a = Amusez-vous !
m.casino_yesman_b = Tout le gel\u00e9e est bienvenu au Golden Slime !
m.casino_yesman_c = D\u00e9sol\u00e9, vous \u00eates en retard \u00e0 5 \u00e0 7 par une minute. Peut-\u00eatre la prochaine fois.
m.casino_yesman_d = Tout le gel\u00e9e est un gagnant au Golden Slime !
m.casino_yesman_e = Les employ\u00e9s recevront une chope gratuite avec chaque visite.

m.casino_pitboss_a = La productivit\u00e9 est augment\u00e9e par deux pour cent depuis \
