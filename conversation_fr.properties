## Winterfest Danger Mission
#..................................................................................................
n.winterfest_branch_cont = Module de reconaissance
m.winterfest_branch_cont = Le chemin de danger vous m\u00e8ne plus loin sur cette montagne p\u00e9\
  rilleuse. Pour le moment, vous passerez la cache entrepos\u00e9e de tr\u00e9sors Grinchlin \
  ici pour une chance d'avoir un butin plus grand sur la montagne.\n\
  \n\
  Vous \u00eates averti ! Si vous \u00eates vaincu par les d\u00e9fis avant d'arriver au \
  prochain abri, vous abandonnez tous les tr\u00e9sors !

r.winterfest_branch_cont = Fermer le module.

n.winterfest_branch_exit = Module de reconaissance
m.winterfest_branch_exit = Le chemin vers Haven vous permet de s'\u00e9chapper de cette \
  montagne p\u00e9rilleuse et rassembler les butins de tr\u00e9sors Grinchlin en route de \
  Haven !\n\
  \n\
  Cependant, si vous d\u00e9cidez de passer les tr\u00e9sors et continuer en haut, plus de tr\u00e9sors vous attendent...

r.winterfest_branch_exit = Fermer le module.

n.winterfest_campknight = Gardien de camp
m.winterfest_campknight_1a = C'est une escalade de hasards, {0}. Attention \u00e0 la marche et \u00e9vitez les pi\u00e8ges Grinchlin !
m.winterfest_campknight_2a = T-tellement... f-fr-froid.
m.winterfest_campknight_3a = Ces Grinchlins sont rus\u00e9s et impossibles \u00e0 predire. Je \
  vous conseille d'apporter un assortiment d'\u00e9quipement afin d'\u00eatre pr\u00e9par\u00e9 pour des surprises d\u00e9sagr\u00e9ables.
r.winterfest_campknight_1a = Terminer la conversation.

# Anniversary
#...................................................................................................


m.biscotti_1 = Salut, je m'appelle Biscotti, chef de cuisine du Skylark ! Nous avons une petite \
  situation ici qui peut-\u00eatre contiendrait des g\u00e2teaux monstrueux et sensibles qui \
  auraient peut-\u00eatre pris ma cuisine et infesteraient les Rouages...\n\
  \n\
  De toute fa\u00e7on, j'ai parl\u00e9 aux \u00c9trangers de fournir les r\u00e9compenses qui \
  prouvent que vous avez ras\u00e9 les monstres horribles qui auraient peut-\u00eatre exist\u00e9s une fois.

r.biscotti_1 = Il a l'air d'\u00eatre tr\u00e8s \u00e9trange, mais je suis content de vous \
  aider si je peux.

m.biscotti_2 = Excellent ! Il y a deux fa\u00e7ons de m'aider :\n\
  \n\
  Vous pouvez accepter le nouveaux Mission de Prestige \u00abG\u00e2teaustrophe total\u00bb, \
  qui est disponible quotidiennement.\n\
  \n\
  Ou vous pouvez voyager dans les Rouages et \u00e9liminer les infestations de ces \u00abCreep Cakes\u00bb, tout \u00e0 volont\u00e9. Cherchez pour le gla\u00e7age r\u00e9v\u00e9lateur !

r.biscotti_2 = Comme j'ai dit, c'est vraiment bizarre, mais je ferai mon mieux.

m.biscotti_3 = Merci {0}, je l'appr\u00e9cie. Et rendez-moi un service, s'il vous pla\u00eet, \
  ne mentionnez pas cet petit \u00abincident\u00bb au Spiral HQ...

r.biscotti_3 = Terminer la conversation.


# Tortodrone Event Haven
#...................................................................................................
n.recon = \u00c9claireur

m.tortodrone_haven_1 = Spiral HQ nous demande d'enqu\u00eater les rapports sur les pi\u00e8ces de tortodrones tomb\u00e9\
  s et les amas de Dark Matter, lesquels apparaissent partout dans les Rouages. Kora croit que \
  les d\u00e9mons manigancent quelque chose. Il y a des preuves qu'ils jouaient un r\u00f4le \
  dans la disparition des tortodrones.

r.tortodrone_haven_1 = Qu'est-ce que vous avez trouv\u00e9 ?

m.tortodrone_haven_2 = Cach\u00e9 dans un jardin myst\u00e9rieux nous avons trouv\u00e9 un \
  portail bizarre que HQ surnomme un Portail sinistre. D'apr\u00e8s ce que nous pouvions d\u00e9\
  coder, on a besoin d'une cl\u00e9 de quelque sorte pour ouvrir le portail. Spiral HQ pense \
  que les glyphs que les d\u00e9mons portent et l'ouverture du portail sont \u00e9troitement li\u00e9s.

r.tortodrone_haven_2 = Merci pour ce truc ! Je retrouverai ces glyphs.

