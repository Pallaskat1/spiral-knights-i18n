#
# Steam translation messages

#
# The "invite friends" dialog

t.invite_friends = UNDANG TEMAN
m.invite_friends = Undang teman-temanmu untuk bergabung dalam petualanganmu! \n\n\
	Untuk setiap teman yang kamu undang dan bermain, kamu akan menerima Spark of Life gratis! \n\n\
	Undang 5 teman dan dapatkan helm kostum eksklusif, Helm Knight Steam! \n\
	Helm Knight bergaya steampunk yang keren ini hanya bisa diperoleh \
	sebagai hadiah undangan.
b.invite = Undang

#
# The account conversion dialog

m.convert_to_steam = Apakah kamu ingin memindahkan Knight, energi, pencapaian, dan lain-lain ke \
  akun Steam-mu? \n\
  Ini memungkinkanmu untuk masuk secara otomatis saat memulai game, serta memanfaatkan fitur-fitur \n\
  Steam seperti pencapaian, obrolan suara, dan undangan.
b.no_convert = Tidak, terima kasih
b.convert = Konversi Akun

m.confirm_convert = Apakah kamu yakin? Konversi ini tidak dapat dibatalkan. Setelah selesai, \n\
  kamu akan masuk kembali menggunakan akun Steam-mu.

e.already_converted = Kamu sudah mengonversi satu akun ke akun Steam-mu. \
  Kamu tidak dapat mengonversi akun lain.
e.too_many_knights = Jumlah Knight terlalu banyak untuk melakukan konversi. Akun ini \n\
  memiliki {0} Knight, akun Steam-mu memiliki {1} Knight, sedangkan jumlah total maksimal adalah {2}.

