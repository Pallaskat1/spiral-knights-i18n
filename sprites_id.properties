# Drakon Skills and Augments

m.firebolt = Bola Api
d.firebolt = Meluncurkan bola api yang sangat panas dan meledak saat menghantam sasaran.

m.impact = Dampak
d.impact = Meningkatkan damage Bola Api.

m.extra_crispy = Ekstra Renyah
d.extra_crispy = Meningkatkan kekuatan api dan peluang untuk membakar sasaran.

m.concussive_firebolt = Bola Api Penghantam
d.concussive_firebolt = Menambahkan peluang untuk membuat Bola Api menghasilkan stun yang kuat.

m.meteoric_firebolt = Bola Api Meteor
d.meteoric_firebol = Memperbesar ledakan Bola Api.

m.flame_barrier = Penghalang Api
d.flame_barrier = Kelilingi dirimu dengan penghalang api yang meningkatkan pertahananmu \
	sekaligus membakar sasaran di dekatmu.

m.high_heat = Panas Tinggi
d.high_heat = Meningkatkan kekuatan ofensif Penghalang Api.

m.heavy_smoke = Asap Tebal
d.heavy_smoke = Meningkatkan kekuatan pertahanan dan durasi Penghalang Api.

m.scorching_barrier = Penghalang Membara
d.scorching_barrier = Meningkatkan jumlah bola api yang mengorbit dan memperbesar ukurannya.

m.backfire_barrier = Penghalang Serangan Balik
d.backfire_barrier = Mendapatkan peningkatan kecepatan gerak singkat setelah menggunakan Penghalang Api.

m.firestorm = Badai Api
d.firestorm = Kerahkan kekuatan api naga sejati untuk membakar segala sesuatu di jalanmu.

m.five_alarm = Siaga Lima
d.five_alarm = Meningkatkan durasi dan ukuran Badai Api.

m.frenzied_firestorm = Badai Api Mengamuk
d.frenzied_firestorm = Untuk setiap monster yang terjebak dalam kobaran api, kamu dan grupmu berpeluang \
	mendapatkan bonus kekuatan serangan dan kecepatan.

m.explosive_firestorm = Badai Api Eksplosif
d.explosive_firestorm = Menghasilkan serangkaian ledakan saat melancarkan Badai Api.

# Seraphynx Skills and Augments

m.ray_of_light = Sinar Cahaya
d.ray_of_light = Menembakkan berkas cahaya terkonsentrasi yang melukai apa pun yang melewatinya.

m.magnify = Perbesar
d.magnify = Meningkatkan jangkauan dan kekuatan Sinar Cahaya.

m.enduring_light = Cahaya Abadi
d.enduring_light = Meningkatkan durasi Sinar Cahaya.

m.dazzling_light_ray = Berkas Cahaya Menyilaukan
d.dazzling_light_ray = Sinar Cahaya menghasilkan damage tambahan terhadap monster keluarga Undead dan Fiend.

m.disintegration_ray = Sinar Disintegrasi
d.disintegration_ray = Sinar Cahaya juga mengurangi pertahanan sasarannya.

m.heart_attack = Serangan Jantung
d.heart_attack = Memantrai sekelompok sasaran. Jika sasaran yang terkena mantra dihancurkan, ada \
	peluang untuk menjatuhkan hati pemulih tambahan.

m.extra_hearty = Ekstra Sehat
d.extra_hearty = Meningkatkan peluang hati dijatuhkan dan durasi mantra.

m.wide_embrace = Pelukan Luas
d.wide_embrace = Memperluas area efek Serangan Jantung.

m.iron_heart_attack = Serangan Jantung Besi
d.iron_heart_attack = Sasaran yang dihancurkan saat terkena mantra juga dapat menjatuhkan orb pertahanan.

m.violent_heart_attack = Serangan Jantung Brutal
d.violent_heart_attack = Sasaran yang dihancurkan saat terkena mantra akan menghasilkan ledakan.

m.angelic_aura = Aura Malaikat
d.angelic_aura = Menciptakan aura pelindung di sekelilingmu yang juga melindungi anggota grup \
	yang berada di dalamnya.

m.protection = Perlindungan
d.protection = Meningkatkan kekuatan pertahanan Aura Malaikat.

m.cover = Perlindungan Luas
d.cover = Meningkatkan ukuran dan durasi Aura Malaikat.

m.seraphic_aura = Aura Serafik
d.seraphic_aura = Anggota grup di dalam aura pelindung mendapatkan peningkatan regenerasi perisai.

m.valkyrian_aura = Aura Valkiria
d.valkyrian_aura = Anggota grup di dalam aura pelindung mendapatkan bonus kecepatan pengisian daya.


# Maskeraith Skills and Augments

m.caustic_quills = Duri Korosif
d.caustic_quills = Menembakkan serangkaian duri yang menancap pada sasaran dan menimbulkan racun. \
	Setiap kali sasaran yang tertancap duri terkena serangan, satu duri akan hilang dan sasaran menerima damage tambahan.

m.venom = Bisa
d.venom = Meningkatkan kekuatan racun yang ditimbulkan.

m.bristle = Duri Lebat
d.bristle = Meningkatkan jumlah duri yang ditembakkan dan durasi duri menancap.

m.vengeful_quills = Duri Pembalasan
d.vengeful_quills = Setiap kali sasaran yang tertancap duri terkena serangan, satu duri lain akan ditembakkan dari sasaran tersebut \
	menuju sasaran berikutnya yang tersedia.

m.virulent_quills = Duri Mematikan
d.virulent_quills = Setiap kali sasaran yang tertancap duri terkena serangan, ada peluang untuk memicu ledakan beracun.

m.shadow_cloak = Jubah Bayangan
d.shadow_cloak = Memberimu tembus pandang sebagian dan peningkatan pertahanan untuk waktu terbatas. \
	Jubah Bayangan akan dibatalkan jika kamu menerima damage, menyerang, atau melakukan tindakan lainnya.

m.dark_veil = Selubung Gelap
d.dark_veil = Meningkatkan kekuatan pertahanan Jubah Bayangan.

m.enduring_night = Malam Abadi
d.enduring_night = Meningkatkan durasi Jubah Bayangan.

m.deadly_shadow_cloak = Jubah Bayangan Mematikan
d.deadly_shadow_cloak = Mendapatkan bonus kekuatan serangan dan kecepatan serangan saat Jubah Bayangan aktif. \
	Bonus ini bertahan sebentar setelah durasi Jubah Bayangan berakhir.

m.vengeful_shadow_cloak = Jubah Bayangan Pembalasan
d.vengeful_shadow_cloak = Menciptakan medan gangguan eksplosif di sekelilingmu saat Jubah Bayangan \
	terganggu, yang berpeluang membuat sasaran terkena stun.

m.hexing_haze = Kabut Kutukan
d.hexing_haze = Menciptakan kabut beracun di sekelilingmu yang mengutuk setiap sasaran di dalamnya. Setiap kutukan memiliki \
	penghitung waktu yang akan menimbulkan damage pada sasarannya saat waktunya habis. Setiap kali Kabut Kutukan \
	mengenai sasaran baru, durasi kabut akan bertambah.

m.no_mercy = Tanpa Ampun
d.no_mercy = Meningkatkan damage yang ditimbulkan Kabut Kutukan.

m.plentiful_pain = Penderitaan Berlimpah
d.plentiful_pain = Meningkatkan bonus durasi Kabut Kutukan setiap kali sasaran tambahan \
	terkena efeknya.

m.haunted_haze = Kabut Berhantu
d.haunted_haze = Setiap sasaran yang mati akibat damage Kabut Kutukan akan memunculkan hantu pembalas \
	yang memburu sasaran lain dan meledak saat menghantamnya.

m.chaotic_haze = Kabut Kacau
d.chaotic_haze = Sasaran yang terkena damage Kabut Kutukan berpeluang menerima kondisi status acak.


