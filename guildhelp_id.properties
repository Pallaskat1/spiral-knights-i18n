t.hall = Aula Guild
t.guild_hall_header = Aula Guild
m.guild_hall_info = Aula Guild adalah pusat kegiatan bagi setiap Guild Spiral Knights. Di sini, anggota Guild dapat bersantai, merencanakan misi mendatang, dan memanfaatkan berbagai fasilitas Aula Guild yang tersedia. Aula Guild sangat mudah disesuaikan dan dapat diperluas agar sesuai dengan Guild dalam berbagai ukuran. Aula ini juga dapat menampung beragam perabotan unik dan jenis ruangan, jadi berkoordinasilah dengan teman-temanmu untuk menjadikan Aula Guild sebagai cerminan sejati Guild-mu!\n \
Saat pertama kali dibuka, Aula Guild terdiri dari dua ruangan: lobi dan ruangan Konsol Komando. Guild yang menginginkan lebih banyak ruang untuk berkreasi dapat membeli perluasan guna menambah ukuran dasar aula mereka. Perluasan ini tersedia melalui Konsol Komando saat berada dalam Mode Desain.\n \
Guild yang telah memperluas ruang yang dapat digunakan di aula mereka dapat mengisi ruang tersebut dengan berbagai jenis ruangan, yang tersedia untuk dibeli di Emporium Birdsong. Ruangan ini bisa sesederhana ruangan kosong untuk menempatkan perabotan, atau dilengkapi dengan berbagai fasilitas Guild, seperti terminal alkimia, toko, dan banyak lagi!\n \
Aula Guild membutuhkan banyak sumber daya untuk dipelihara, yang dinyatakan dalam bentuk biaya pemeliharaan mingguan dalam Crown. Semakin banyak perluasan yang dimiliki Aula Guild, semakin tinggi biayanya. Jadi, pastikan Perbendaharaan Guild-mu memiliki cukup Crown untuk membayar semuanya!

t.treasury = Perbendaharaan
t.treasury_header = Perbendaharaan Guild
m.treasury_info = Perbendaharaan Guild berisi semua item dan Crown yang dimiliki bersama oleh Guild. Agar dapat ditempatkan di Aula Guild, perabotan harus terlebih dahulu dimasukkan ke Perbendaharaan. Biaya ruangan baru, item dari Emporium Birdsong, dan pemeliharaan mingguan juga dibayar dari Perbendaharaan. Karena itu, anggota Guild harus memastikan Perbendaharaan Guild selalu memiliki cukup Crown!\n \
PERINGATAN: Apa pun yang dimasukkan ke Perbendaharaan Guild tidak akan pernah dapat diambil kembali oleh anggota Guild mana pun, termasuk Master Guild. Dengan memasukkan item atau Crown ke Perbendaharaan Guild, semuanya menjadi milik Guild untuk selamanya. Tidak ada pengecualian.
l.treasury_console = Perbendaharaan Guild dapat diakses melalui Konsol Komando. | action | console

t.emporium_header = Emporium Birdsong
m.emporium_info = Emporium Birdsong memungkinkan anggota Guild berpangkat tinggi membeli item untuk Guild menggunakan dana dari Perbendaharaan Guild. Item tersebut mencakup berbagai perabotan dan peningkatan Aula Guild. Item yang dibeli akan langsung dimasukkan ke Perbendaharaan Guild sehingga tidak akan pernah dapat dikeluarkan lagi dari Guild.\n \
Perabotan tersedia dalam berbagai jenis dan ukuran serta digunakan untuk menghias ruangan dan lorong Aula Guild agar terasa lebih nyaman seperti rumah sendiri. Beberapa perabotan bahkan memiliki efek khusus saat diaktifkan! Perabotan apa pun yang saat ini berada di Perbendaharaan Guild dapat ditempatkan di Aula Guild menggunakan Mode Desain.\n \
Emporium Birdsong juga merupakan tempat untuk membeli Peningkatan Guild yang meningkatkan kemampuan Guild-mu, misalnya dengan menambah batas maksimum jumlah anggota.\n \
Seiring bertambahnya ukuran Aula Guild melalui perluasan, pilihan item yang tersedia dalam katalog Emporium Birdsong juga akan bertambah. Pastikan untuk sering memeriksanya agar tidak melewatkan item yang tersedia!
l.emporium_console = Emporium Birdsong dan Mode Desain dapat diakses melalui Konsol Komando. | action | console

t.storage = Penyimpanan
t.storage_header = Penyimpanan Guild
m.storage_info = Penyimpanan Guild berfungsi seperti bank item bersama. Anggota Guild dengan pangkat yang sesuai dapat menambahkan atau mengambil perlengkapan maupun item dari Penyimpanan sesuai kebutuhan. Fitur ini sangat berguna untuk berbagi sumber daya antaranggota Guild atau membantu anggota baru!\n \
PERINGATAN: Item yang ditempatkan di Penyimpanan Guild dapat diambil dan menjadi milik anggota Guild mana pun yang memiliki akses ke Penyimpanan Guild. Jangan masukkan item yang ingin kamu simpan sendiri ke Penyimpanan Guild!
l.storage_console = Penyimpanan Guild dapat diakses melalui Konsol Komando. | action | console

t.design = Mode Desain
t.design_header = Mode Desain
m.design_info = Mode Desain memungkinkan anggota Guild dengan pangkat yang memadai untuk menata ulang perabotan dan infrastruktur lainnya di dalam Aula Guild. Saat berada dalam Mode Desain, perabotan dapat diangkat dan diletakkan kembali, mirip seperti Kunci Emas atau Patung Berat. Secara default, perabotan juga dapat diputar saat sedang diangkat menggunakan Roda Mouse. Setelah selesai menata ulang, kamu dapat memublikasikan perubahan melalui Konsol Komando agar perubahan tersebut terlihat oleh seluruh anggota Guild.
u.design_wiki = Daftar lengkap perabotan yang tersedia dapat ditemukan di wiki resmi kami. | URL | http://wiki.spiralknights.com/Furniture
l.design_console = Mode Desain dapat diakses melalui Konsol Komando. | action | console

t.record = Catatan Guild
t.record_header = Catatan Guild
m.record_info = Catatan Guild merekam aktivitas penting yang baru-baru ini terjadi di dalam Guild, seperti sumbangan ke Perbendaharaan Guild, penyetoran dan penarikan dari berbagai Penyimpanan Guild, serta kenaikan pangkat, penerimaan, atau keluarnya anggota Guild. Catatan ini memungkinkan anggota Guild berpangkat lebih tinggi untuk memantau siapa yang banyak menyumbang atau mengambil dari Guild, lalu mengambil tindakan yang sesuai.
l.record_console = Catatan Guild dapat diakses melalui Konsol Komando. | action | console
