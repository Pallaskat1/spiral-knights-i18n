## GENERAL

m.please_wait = Aguarde

# Energy Info
#...................................................................................................

n.energy_info = Cavaleiro Energ\u00e9tico

m.energy_info_1a = Voc\u00ea sabe qual \u00e9 o recurso mais importante de Cradle? ENERGIA! Isso \
  mesmo, meu amigo, algo t\u00e3o especial que vale a pena sair gritando por a\u00ed! Quer saber \
  mais sobre essa coisa superimportante? Por acaso, eu sou especialista no assunto!

r.energy_info_1a = Claramente eu preciso saber tudo sobre isso. Conte-me mais!

r.energy_info_1b = N\u00e3o, obrigado. Estou muito bem sem saber de uma coisa t\u00e3o incr\u00edvel.

m.energy_info_2a = Excelente! Vou explicar tudo em tr\u00eas li\u00e7\u00f5es simples: o que \u00e9, como se usa e como conseguir mais.

r.energy_info_2a = O que \u00e9 energia?

r.energy_info_2b = Como a energia \u00e9 usada?

r.energy_info_2c = Como consigo mais energia?

r.energy_info_2d = Suas li\u00e7\u00f5es me energizaram! Vou partir em busca de aventura, tchau!

m.energy_info_3a = A energia \u00e9 um poder muito especial que emana constantemente do \
  n\u00facleo deste mundo. Ela \u00e9 totalmente est\u00e1vel e nunca se perde, a menos que seja \
  trocada ou gasta. (Voc\u00ea pode ver quanta energia tem no m\u00f3dulo de energia do seu \
  arsenal.)

m.energy_info_3b = A energia serve para todo tipo de coisa! \u00c9 a principal moeda para comprar \
  produtos no Dep\u00f3sito de Suprimentos, permite que voc\u00ea compre melhorias para si mesmo e \
  reviva nos Clockworks quando suas Fa\u00edscas da Vida acabarem, al\u00e9m de ser \
  necess\u00e1ria para formar uma guilda. \n\nVoc\u00ea tamb\u00e9m vai encontrar pelo mundo todo \
  tipo de dispositivo que funciona com energia. Basta procurar o s\u00edmbolo azul de energia no \
  dispositivo.

m.energy_info_3c = A energia s\u00f3 pode ser obtida por meio de compra com dinheiro real ou de \
  trocas no Mercado de Energia. Para comprar ou trocar energia, basta abrir o Dep\u00f3sito de \
  Suprimentos e clicar no bot\u00e3o 'Obter Energia'.

r.energy_info_3a = Tenho outra pergunta.

r.energy_info_3b = Suas li\u00e7\u00f5es me energizaram! Vou partir em busca de aventura, tchau!



## TUTORIAL

# Rescue Agent
#...................................................................................................

n.tut_intro = Agente de Resgate

m.tut_intro_1a = Bem-vindo a Cradle, recruta! \u00c9 sempre bom ver um cavaleiro sobreviver \
  inteiro a uma queda dessas. Temos um Acampamento de Resgate n\u00e3o muito longe da sua \
  posi\u00e7\u00e3o. Vou guiar voc\u00ea at\u00e9 l\u00e1, mas prepare sua espada: h\u00e1 \
  inimigos no caminho!\n
r.tut_intro_1a = Entendido, estou indo!


m.tut_intro2_1a = ...responda, {0}, voc\u00ea est\u00e1 a\u00ed? Aqui \u00e9 o Cavaleiro Recon \
  Rhendon!

r.tut_intro2_1a = Estou aqui, o que aconteceu?

m.tut_intro2_2a = Voc\u00ea acabou de chegar \u00e0 superf\u00edcie de Cradle. Minha c\u00e1psula \
  de fuga caiu logo ao norte da sua posi\u00e7\u00e3o. Precisamos nos encontrar e achar o ponto de \
  reuni\u00e3o mais pr\u00f3ximo. \n\nTome cuidado e deixe sua espada pronta, h\u00e1 criaturas \
  hostis por toda parte!

r.tut_intro2_2a = Entendido, Rhendon. Estou indo para a\u00ed!


m.tut_intro3_1a = {0}! Que bom ver voc\u00ea! Este lugar \u00e9 t\u00e3o alien\u00edgena \
 que fico feliz de ver um rosto conhecido e n\u00e3o mais um inimigo.

r.tut_intro3_1a = Tamb\u00e9m fico feliz em ver voc\u00ea inteiro, Rhendon. Onde est\u00e3o os \
  outros sobreviventes?

m.tut_intro3_2a = Consegui contato pelo comunicador com alguns Cavaleiros que montaram um \
  Acampamento de Resgate mais adiante. Se voc\u00ea seguir para o norte, uma hora vai chegar \
  l\u00e1. \n\nVou ficar aqui por enquanto para localizar outros Cavaleiros que tenham ca\u00eddo \
  na regi\u00e3o. Encontro voc\u00ea no Acampamento de Resgate antes do p\u00f4r do sol. \n\nE se \
  encontrar algo realmente perigoso, pressione [[?DEFEND]] para usar seu escudo!

r.tut_intro3_2a = Ent\u00e3o vou seguir adiante! Tome cuidado, Rhendon.

m.tut_intro4_1a = Vou ficar aqui por enquanto para localizar outros Cavaleiros que tenham \
  ca\u00eddo na regi\u00e3o. Encontro voc\u00ea no Acampamento de Resgate, ao norte. \n\nE se \
  encontrar algo realmente perigoso, pressione [[?DEFEND]] para usar seu escudo!

r.tut_intro4_1a = Ent\u00e3o vou seguir adiante! Tome cuidado, Rhendon.

m.tut_intro3_3a = Boa sorte!
m.tut_intro3_3b = Tome cuidado!
m.tut_intro3_3c = Lembre-se: pressione [[?DEFEND]] para usar seu escudo!

# Warden Companion
#.................................................................................................
n.tut_warden = Guardi\u00e3o Spiral
m.tut_warden_1a = Salve, cavaleiro. Voc\u00ea deve ser {0}. Rhendon nos avisou pelo r\u00e1dio que \
  voc\u00ea estava a caminho. Venha conosco, o Acampamento de Resgate fica logo adiante.

r.tut_warden_1a = \u00d3timo, mal posso esperar por uma refei\u00e7\u00e3o quente.

m.tut_warden_2a = Somos dois. Agora vamos- \n\nEspere, tem algo errado. Prepare-se, acho que temos \
  companhia!

r.tut_warden_2a = Encerrar conversa

m.tut_warden_3a = Muito bem, {0}! Parece que voc\u00ea sabe se virar no campo de batalha. \n\n\
  Venha, vamos para o acampamento. Talvez voc\u00ea possa nos ajudar a descobrir o que raios \
  est\u00e1 acontecendo aqui.

r.tut_warden_3a = Encerrar conversa

# Final Test Knight
#...................................................................................................


m.final_test_knight_1a = Impressionante! Eu jamais imaginaria que um novo recruta sairia \
  rastejando vivo daqueles destro\u00e7os em chamas! Voc\u00ea deve ser algu\u00e9m fora do \
  comum... \n\nMeu nome \u00e9 Feron, Tenente da Ordem Spiral. Acredit\u00e1vamos que todo este \
  complexo estava abandonado, at\u00e9 que o elevador que leva at\u00e9 ele voltou \u00e0 vida de \
  repente. Quando fomos investigar, o lugar inteiro logo pegou fogo! \n\nComo voc\u00ea veio parar \
  aqui?

r.final_test_knight_1a = (Contar a Feron sobre o Acampamento de Resgate, Razwog e o Artefato)

m.final_test_knight_2a = Entendo. Essa informa\u00e7\u00e3o vai interessar muito ao QG Spiral. \
  Nosso acampamento-base em Haven fica logo adiante. Suba pelo elevador e conhe\u00e7a os outros \
  Cavaleiros que, assim como voc\u00ea, sobreviveram \u00e0 queda. Os t\u00e9cnicos do \
  Laborat\u00f3rio v\u00e3o ficar ansiosos para estudar esse artefato. Eles cuidar\u00e3o disso \
  assim que voc\u00ea chegar a Haven. \n\nN\u00e3o se preocupe com os outros no Acampamento de \
  Resgate. Gra\u00e7as a voc\u00ea, temos um sistema de elevadores funcionando para chegar \
  at\u00e9 eles. Voc\u00ea salvou todos eles!

r.final_test_knight_2a = Obrigado, Tenente. Vou seguir para Haven.

# Rescued Stranger
#...................................................................................................

m.rescued_stranger_1a = Ol\u00e1, pequenino. Voc\u00ea vai descobrir que h\u00e1 muitos perigos \
  neste novo mundo, mas tamb\u00e9m muitas oportunidades para os aventureiros e corajosos! Um \
  companheiro seu espera por voc\u00ea logo adiante no caminho. Sem d\u00favida, nos veremos de \
  novo. Adeus, por enquanto!
r.rescued_stranger_1a = Encerrar Conversa


## RESCUE CAMP KNIGHTS

# Greta B
#...................................................................................................

m.rc_greet2_1a = Sauda\u00e7\u00f5es, sou a L\u00edder de Esquadr\u00e3o Greta. Voc\u00ea deve ser \
  {0}. Rhendon disse que dever\u00edamos estar \u00e0 sua espera, e voc\u00ea n\u00e3o poderia ter \
  chegado em melhor hora. Este Acampamento de Resgate est\u00e1 enfrentando uma crise.

r.rc_greet2_1a = Qual \u00e9 o problema, Greta?

m.rc_greet2_2a = Resumindo: este acampamento est\u00e1 sem energia e o sol vai se p\u00f4r logo. \
  Ontem \u00e0 noite, todo tipo de monstro horr\u00edvel veio atr\u00e1s de n\u00f3s no escuro. \
  N\u00e3o consegu\u00edamos enxergar e n\u00e3o t\u00ednhamos energia para as nossas torretas \
  defensivas. \n\n...perdemos muitos recrutas. \n\nPrecisamos canalizar energia para o Acampamento \
  de Resgate para montar um per\u00edmetro defensivo antes que a noite caia!

r.rc_greet2_2a = Como posso ajudar a canalizar energia para o acampamento?

m.rc_greet2_3a = Nossos escaneamentos localizaram um gerador antigo embaixo deste acampamento. Ele \
  deveria estar mandando energia para a superf\u00edcie, mas algo parece estar desviando essa \
  energia. \n\nPrecisamos que voc\u00ea v\u00e1 investigar o gerador antigo e redirecione a \
  energia de volta para a superf\u00edcie. Mas prepare-se: \u00e9 um territ\u00f3rio completamente \
  inexplorado e infestado de monstros. \n\nRhendon disse que queria encontrar voc\u00ea antes de \
  voc\u00ea assumir esta miss\u00e3o. Por que voc\u00ea n\u00e3o vai falar com ele primeiro?

r.rc_greet2_3a = Vou me encontrar com Rhendon antes de investigar o gerador.

m.rc_greet2_4a = Por favor, {0}, ajude-nos a restaurar a energia do Acampamento de Resgate para \
  que possamos montar um per\u00edmetro defensivo. N\u00e3o podemos nos dar ao luxo de perder mais \
  recrutas para as criaturas da noite!

r.rc_greet2_4a = Vou dar o meu melhor!

m.rc_greet3_1a = Voc\u00ea restaurou a energia e salvou todos n\u00f3s, {0}! N\u00e3o tenho como \
  agradecer o suficiente; todos estes recrutas devem a vida a voc\u00ea. \n\nAgora voc\u00ea deve \
  tentar contatar o QG Spiral pelo seu comunicador.

r.rc_greet3_1a = Encerrar conversa

# Rescue Camp Recruit Knights
#...................................................................................................
n.rc_recruit = Recruta
m.rc_recruit_a = Podemos estar sem energia, mas o m\u00ednimo que posso fazer \u00e9 acender uma \
  fogueira para termos um pouco de luz esta noite.

m.rc_recruit_b = N\u00e3o conseguimos recuperar muito equipamento das c\u00e1psulas que \
  ca\u00edram. N\u00e3o h\u00e1 nem o suficiente para cada Cavaleiro em condi\u00e7\u00f5es de \
  lutar.

m.rc_recruit_c = D\u00e1 para acreditar? Este abismo inteiro est\u00e1 tomado por algum tipo de \
  m\u00e1quina gigante. Parece n\u00e3o ter fundo. \n\nSer\u00e1 que o planeta inteiro \u00e9 assim?

m.rc_recruit_d = Com o calor da fogueira e a seguran\u00e7a das torretas defensivas, acho que vou \
  dormir bem esta noite.

m.rc_recruit_e = D\u00e1 para sentir a eletricidade no ar! Parece que, no fim das contas, esta \
  noite n\u00e3o vai ser a nossa \u00faltima batalha!

m.rc_recruit_f = Dizem que voc\u00ea vai descer por este elevador at\u00e9 o abismo l\u00e1 \
  embaixo. Voc\u00ea tem muito mais coragem do que eu...

r.rc_recruit = Encerrar conversa

# Technician Knight
#...................................................................................................
n.rc_technician = T\u00e9cnico
m.rc_technician_a = De acordo com estes escaneamentos, deveria haver algum tipo de fonte de \
  energia nas profundezas abaixo do acampamento, mas ela est\u00e1 sendo desviada de alguma forma...

m.rc_technician_b = Esta coisa \u00e9 in\u00fatil sem energia. Como vamos nos defender daqueles \
  monstros?!

m.rc_technician_c = A energia voltou com tudo ao acampamento! Voc\u00ea conseguiu, {0}!

r.rc_technician = Encerrar Conversa

# Injured Knight
#...................................................................................................
n.rc_injured = Cavaleiro Ferido
m.rc_injured_a = Ontem \u00e0 noite, monstros terr\u00edveis nos atacaram na escurid\u00e3o. Foi \
  um caos total. Sem energia para as torretas, n\u00e3o conseguimos nos defender. \n\nTantos \
  Cavaleiros corajosos perdidos...

m.rc_injured_b = Um daqueles monstros mec\u00e2nicos me pegou. As garras daquela coisa maldita \
  atravessaram minha armadura!

m.rc_injured_c = Gra\u00e7as a voc\u00ea, n\u00e3o vamos ter que enfrentar outra noite como a \
  \u00faltima...

m.rc_injured_d = Com a energia restaurada, consegui consertar minha armadura. Tomara que eu \
  n\u00e3o d\u00ea de cara com muitas daquelas latas-velhas monstruosas de novo!

r.rc_injured = Encerrar conversa


# Nervous Knight
#...................................................................................................

n.rc_nervous = Cavaleiro Nervoso

m.rc_nervous_1a = Quero comprar alguma coisa com as coroas que ganhei no campo de treinamento, mas \
  aquele mercador me d\u00e1 arrepios. O que voc\u00ea acha que est\u00e1 escondido debaixo \
  daqueles mantos?!

r.rc_nervous_1a = Encerrar conversa

# Forge Knight
#...................................................................................................
n.rc_forge = Cavaleiro da Forja
m.forge_knight_1a = Cradle \u00e9 um mundo perigoso, e para sobreviver \u00e9 importante garantir \
  que voc\u00ea tenha equipamentos poderosos no seu arsenal. Para isso, voc\u00ea vai precisar \
  usar a Forja.

r.forge_knight_1a = O que \u00e9 a Forja?

m.forge_knight_2a = A Forja usa o calor armazenado no seu equipamento e o combina com o poder dos \
  Fire Crystals para liberar um novo potencial.

r.forge_knight_2a = Continuar

m.forge_knight_3a = Na cidade, voc\u00ea pode acessar a Forja a qualquer momento. Nos Clockworks, \
  voc\u00ea pode acess\u00e1-la usando uma Esta\u00e7\u00e3o de Arsenal.

r.forge_knight_3a = Continuar

m.forge_knight_4a = Ao usar a Forja, voc\u00ea ver\u00e1 uma lista de todos os itens que \
  est\u00e3o prontos para subir de n\u00edvel. Selecione um item para ver como ele pode ser \
  aprimorado.

r.forge_knight_4a = Continuar

m.forge_knight_5a = Cada item vai exigir um tipo espec\u00edfico de Fire Crystal. Os Fire Crystals \
  podem ser obtidos no Dep\u00f3sito de Suprimentos, conquistados ao concluir certas miss\u00f5es \
  e encontrados em blocos de tesouro nos Clockworks!

r.forge_knight_5a = Como os Fire Crystals funcionam?

m.forge_knight_6a = Fire Crystals s\u00e3o um tanto inst\u00e1veis; a quantidade \
 necess\u00e1ria para uma forja bem-sucedida varia. \n\
 Al\u00e9m disso, descobrimos que adicionar mais Fire Crystals gera chances \
 de b\u00f4nus especiais que ser\u00e3o aplicados ao item! \n\

r.forge_knight_6a = Parece \u00f3timo!

m.forge_knight_7a = Agora que voc\u00ea j\u00e1 conhece a Forja, gostaria de dar uma olhada?

r.forge_knight_7a = Claro! (Abrir a Forja)
r.forge_knight_7b = Vou dar uma olhada depois. (Encerrar conversa)

# Geo Knight
#...................................................................................................

n.rc_soil = Cavaleiro Geo

m.rc_soil_1a = Estou coletando amostras geol\u00f3gicas para o QG Spiral. At\u00e9 agora, meus \
  testes identificaram centenas de amostras de solo \u00fanicas em cada cent\u00edmetro do \
  ch\u00e3o sob os nossos p\u00e9s. Isso n\u00e3o \u00e9 poss\u00edvel, devo ter errado nos \
  c\u00e1lculos...

r.rc_soil_1a = Encerrar conversa

# Veteran Knights
#...................................................................................................
n.rc_vet_1 = Guardi\u00e3o Spiral
n.rc_vet_2 = Cavaleiro Veterano

m.rc_vet_1a = Obrigado pela ajuda de antes. Cuide-se!
m.rc_vet_2a = Fique sempre alerta. Quem sabe que outros perigos nos aguardam neste mundo?
m.rc_vet_3a = N\u00e3o vou conseguir relaxar at\u00e9 entrarmos em contato com o QG Spiral.

r.rc_vet_1a = Encerrar conversa

# Rhendon
#...................................................................................................

m.rc_rhendon_1a = Que raios voc\u00ea acha que \u00e9 isso, {0}? Deve ser importante, j\u00e1 que \
  aquele tal de Razwog ficou uma fera quando voc\u00ea pegou isso dele. \n\nBem feito para ele, \
  por ter tentado matar voc\u00ea e tudo mais!

r.rc_rhendon_1a = Encerrar conversa

# Kinter
#...................................................................................................


m.rc_instruct_1a = Sauda\u00e7\u00f5es, recruta. \u00c9 sempre bom ver mais um cavaleiro chegar ao \
  Acampamento de Resgate. Imagino que voc\u00ea queira se preparar para a sua jornada at\u00e9 \
  Haven. Um bom lugar para come\u00e7ar \u00e9 este portal para os Clockworks. Basta se aproximar \
  do painel de controle na extremidade norte do elevador e pressionar o bot\u00e3o de \
  a\u00e7\u00e3o ([[?ACTION]]).\n\nAlguma pergunta?

r.rc_instruct_1a = Perguntas? Pode apostar que sim!

r.rc_instruct_1b = Nada de perguntas, s\u00f3 a\u00e7\u00e3o. J\u00e1 estou indo.

m.rc_instruct_2a = O que voc\u00ea gostaria de saber?

r.rc_instruct_2a = Os "Clockworks"?

r.rc_instruct_2b = Voc\u00ea falou alguma coisa sobre um "portal"?

r.rc_instruct_2c = Pensando bem, acho que j\u00e1 vou indo.


m.rc_instruct_3a = Os Clockworks s\u00e3o o enorme complexo de engrenagens e maquin\u00e1rio que \
  fica logo abaixo da superf\u00edcie de todo este mundo. \u00c9 realmente uma vis\u00e3o \
  incr\u00edvel. Viemos parar em um mundo estranho e perigoso. Ande com cuidado.

m.rc_instruct_3b = Um "portal" \u00e9 um ponto de entrada para os Clockworks. Os portais t\u00eam \
  a forma dos elevadores que voc\u00ea v\u00ea \u00e0 sua frente. Cada portal tem um monitor que \
  mostra seu \u00edcone exclusivo, al\u00e9m de um painel de controle que permite entrar nele. \
  Este portal aqui sempre levar\u00e1 voc\u00ea ao mesmo lugar, mas outros portais t\u00eam \
  andares que mudam abaixo deles. Nesses, voc\u00ea nunca sabe direito o que vem pela frente!


r.rc_instruct_3a = Tenho outra pergunta.

r.rc_instruct_3b = Obrigado pelas informa\u00e7\u00f5es. J\u00e1 vou indo.


# Boomer
#...................................................................................................


m.rc_bomb_1a = J\u00e1 teve a chance de experimentar bombas? Ao contr\u00e1rio de outros tipos de \
  arma, as bombas s\u00f3 podem ser usadas como ataque carregado. Se voc\u00ea fizer qualquer \
  outra coisa, elas s\u00f3 v\u00e3o chiar e apagar. Mas se voc\u00ea carreg\u00e1-las... BUM! \
  Elas podem causar um estrago s\u00e9rio em v\u00e1rios monstros de uma vez!

r.rc_bomb_1a = Parece que vai ser um estouro! Talvez eu compre algumas com o mercador ambulante.


# Cautious Knight
#...................................................................................................

n.rc_warning = Cavaleiro Cauteloso

m.rc_warning_1a = Subindo estas escadas fica o portal para Haven. N\u00e3o deixe de falar com \
  Virgil antes de entrar, para saber o que esperar.

r.rc_warning_1a = Entendi. N\u00e3o vou deixar de ouvir o que Virgil tem a dizer.


# Sleepy Knight
#...................................................................................................

n.rc_sleepy = Cavaleiro Sonolento

m.rc_sleepy_1a = Treinamento... t\u00e3o puxado... s\u00f3 preciso descansar.... os olhos...

r.rc_sleepy_1a = Encerrar conversa


# Virgil
#...................................................................................................


m.rc_virgil_1a = Ten cuidado all\u00e1 adelante.

r.rc_virgil_1a = Por que es eso?

m.rc_virgil_2a = Este pasaje cruza exactamente sobre un enorme precipicio. N\u00e3o quiero que vayas \
 a salir volando hacia el olvido all\u00e1 abajo.

r.rc_virgil_2a = Entonces por que est\u00e1 ese pasaje aqu\u00ed?


r.rc_virgil_3a = Tendr\u00e9 cuidado.


r.rc_virgil_4a = Terminar conversaci\u00f3n


r.rc_end_1a = Sim, tengo algunas preguntas.

r.rc_end_1b = Lo he entendido todo, no tengo mais preguntas.

m.rc_end_2a = En que puedo ayudarte?

r.rc_end_2a = Cuando llegue a Haven ya no podr\u00e9 volver?

r.rc_end_2b = Qu\u00e9 peligros me esperan detr\u00e1s del portal final?

r.rc_end_2c = Qu\u00e9 tengo que hacer cuando llegue a Haven?

r.rc_end_2d = N\u00e3o tengo mais preguntas, me pondr\u00e9 en marcha.




r.rc_end_3a = Tengo otra pregunta.


# Haven Entrance
#...................................................................................................

n.hav_guardian = Cavaleiro Guardi\u00e1n

m.hav_guardian_1a = Bem-vindo a Haven, {0}, te hemos estado esperando.

r.hav_guardian_1a = Terminar conversaci\u00f3n

m.hav_entryknight_1a = Llegaste por el precipicio? Como?
m.hav_entryknight_2a = Siempre es bueno ver a otro Cavaleiro Spiral!

## ADVANCED TRAINING KNIGHTS
# Gym
#...................................................................................................

# Greeter
#...................................................................................................



r.atg_greeter_1a = Seguro, por d\u00f3nde empiezo?

r.atg_greeter_1b = N\u00e3o, obrigado. Prefiero explorar el lugar por mi mismo.


r.atg_greeter_2a = Gracias! Ahora me voy a explorar.

## HAVEN KNIGHTS

# Fountain
