# Clockworks tab
#...................................................................................................

t.clockworks = Clockworks

t.clockworks_1 = Clockworks
m.clockworks_1 = Clockworks adalah gerbangmu menuju Inti planet! Tempat ini dipenuhi beragam dunia \
  dan dihuni monster serta harta karun di luar imajinasimu. Namun, berhati-hatilah: semakin dalam \
  kamu menjelajah ke bawah permukaan, semakin tangguh dan cerdas lawan yang akan kamu hadapi!

m.clockworks_2 = Kedalaman di bawah Haven dapat dibagi menjadi tiga Tier dengan tingkat tantangan \
  yang semakin meningkat. Pastikan kamu mengenakan perlengkapan yang sesuai dengan Tier sebelum \
  menjelajah, dan ingat: harta karun terbesar yang ditawarkan Clockworks berada jauh di bawah tanah, \
  dekat Inti planet. Jadi, jelajahilah kedalamannya!

t.tier_1 = Tier 1

m.tier_1_equip = Perlengkapan yang Direkomendasikan: 0-1 Bintang
m.tier_1_monster = Monster menghasilkan kerusakan NORMAL.

t.tier_2 = Tier 2

m.tier_2_equip = Perlengkapan yang Direkomendasikan: 2-3 Bintang
m.tier_2_monster = Monster membagi kerusakannya antara NORMAL dan satu jenis kerusakan khusus lainnya \
  (TEMBUSAN, ELEMEN, atau BAYANGAN).\n\
  Monster lebih sering menggunakan EFEK STATUS. Kenakan zirah dengan resistansi terhadap API, BEKU, \
  SENGATAN, atau RACUN!

t.tier_3 = Tier 3

m.tier_3_equip = Perlengkapan yang Direkomendasikan: 4-5 Bintang
m.tier_3_monster = Monster dapat menggunakan serangan yang menghasilkan kerusakan khusus murni \
  (TEMBUSAN, ELEMEN, atau BAYANGAN). Lengkapi dirimu dengan perlengkapan yang sesuai!

