# TF2/MannCo Promotional Hat Messages

s.tf2_start = Uma Pequena Tarefa
m.tf2_start = Bom dia, cliente fiel! \n\n\
\
Talvez voc\u00ea j\u00e1 tenha ouvido dizer que me tornei o quarto homem mais rico da Am\u00e9rica, tendo superado \
o quinto em riqueza e eliminado o antigo quarto colocado em um duelo de arp\u00f5es. Embora isso seja, \
\u00e9 claro, inteiramente verdade (especialmente a parte do duelo de arp\u00f5es, que foi longo e sangrento), \
ainda n\u00e3o \u00e9 suficiente. O quarto lugar pode servir para HIPPIES que n\u00e3o reconheceriam a vit\u00f3ria nem \
se ela aparecesse e oferecesse tran\u00e7ar seus rabos de cavalo, mas com certeza n\u00e3o \u00e9 bom o bastante \
para Saxton Hale! \n\n\
\
O senhor Reddy, meu contador, explicou-me que a melhor forma de botar fogo sob o traseiro do \
faturamento da Mann Co. seria "abrir novos mercados". Eu at\u00e9 relataria exatamente como planejamos \
fazer isso, mas, enquanto ele falava, comecei imediatamente a fazer desenvolvimento militar para \
n\u00e3o morrer de t\u00e9dio, e perdi os detalhes importantes. \n\n\
\
Tudo o que voc\u00ea precisa saber, caro cliente, \u00e9 que preciso de um bom homem para encontrar o caminho \
at\u00e9 uma cidade chamada "Haven", avan\u00e7ar corajosamente por um dos muitos port\u00f5es dali e ent\u00e3o abrir \
caminho at\u00e9 o primeiro "Terminal dos Clockworks". Como n\u00e3o conseguimos achar um bom homem, voc\u00ea ter\u00e1 \
de fazer isso sozinho. Ser\u00e1 muito bem recompensado, \u00e9 claro: n\u00e3o h\u00e1 NADA que eu n\u00e3o faria por um \
funcion\u00e1rio que arriscasse a vida e os membros numa tarefa trivial provocada pelos meus caprichos ego\u00edstas. \n\n\
\
Nem se d\u00ea ao trabalho de falar comigo diretamente quando terminar, pois estarei ocupado demais \
dando kickboxing em girafas para me importar. Outro dos meus funcion\u00e1rios cuidar\u00e1 das coisas a partir da\u00ed. \
Boa sorte: voc\u00ea vai precisar! \n\n\
\
Atenciosamente, \n\n\
\
SAXTON HALE \n\
Australiano \n\
CEO, Mann Co.

s.tf2_end = Confirma\u00e7\u00e3o de Tarefa
m.tf2_end = A quem interessar possa: \n\n\
\
Confirmei sua chegada ao Terminal dos Clockworks e obtive os dados relevantes sobre o cat\u00e1logo do nosso \
concorrente. A Mann Co. agradece sua coopera\u00e7\u00e3o nesta tarefa. \n\n\
\
Em troca da sua ajuda, remetemos a voc\u00ea uma (1) pe\u00e7a de vestu\u00e1rio r\u00e9plica da marca Mann Co., \
o "Spiral Sallet". N\u00e3o haver\u00e1 reembolsos nem trocas para esta recompensa, e a Mann Co. n\u00e3o se responsabiliza \
por qualquer les\u00e3o sofrida ao tentar us\u00e1-la. \n\n\
\
Atenciosamente, \n\n\
\
Mister Reddy \n\
Mann Co. \n\
"N\u00f3s vendemos produtos e entramos em brigas." \n\n\
\
As informa\u00e7\u00f5es contidas neste correio s\u00e3o confidenciais e destinam-se exclusivamente ao destinat\u00e1rio. O acesso \
a este correio por qualquer outra pessoa \u00e9 n\u00e3o autorizado. Se voc\u00ea n\u00e3o for o destinat\u00e1rio pretendido, n\u00e3o deve ler, \
usar, pensar, comer nem seduzir as informa\u00e7\u00f5es contidas neste correio. O descumprimento desta solicita\u00e7\u00e3o resultar\u00e1 \
em o destinat\u00e1rio ser atacado por ursos at\u00e9 o limite m\u00e1ximo permitido pela lei.


# Sonic CD Promo

s.metal_sonic = Entrega do Traje de Metal Sonic
m.metal_sonic = Obrigado por comprar Sonic CD no Steam! O seu Traje e M\u00e1scara de Metal Sonic \
	est\u00e3o anexados. Esses itens s\u00e3o trajes que podem ser equipados sobre qualquer armadura, permitindo que voc\u00ea \
	pare\u00e7a o Metal Sonic sempre que quiser! \n\n\
	\
	Observe que equipamentos s\u00f3 podem ser trocados em cidades ou em uma Esta\u00e7\u00e3o de Arsenal. Se voc\u00ea \u00e9 um novo \
	recruta e acabou de sair da sua c\u00e1psula de queda, siga at\u00e9 o Acampamento de Resgate. Quando \
	chegar l\u00e1, poder\u00e1 equipar seu Traje e M\u00e1scara de Metal Sonic.

#
# Gloaming Wildwoods

s.wildwoods_start = Miss\u00e3o: Gloaming Wildwoods
m.wildwoods_start = Aqui \u00e9 a Agente de Intelig\u00eancia Kora. Detectamos um m\u00f3dulo de reconhecimento deixado pelo \
Esquadr\u00e3o Alfa em algum ponto desta floresta. Sua miss\u00e3o \u00e9 localizar e recuperar o m\u00f3dulo. \n\n\
\
Esta floresta abriga matilhas de feras selvagens que j\u00e1 se provaram mortais para esquadr\u00f5es no passado. \
Por causa disso, Cavaleiros T\u00e9cnicos colocaram Sinos de Feras por toda a \u00e1rea. Acert\u00e1-los deve \
atordoar quaisquer feras atingidas pela onda sonora que produzem. \n\n\
\
Saiba tamb\u00e9m que Cavaleiros de Reconhecimento relataram a presen\u00e7a de uma terr\u00edvel fera, como \
nunca vimos antes, espreitando esta floresta. Conhecida como 'o Snarbolax', ela aparece como uma massa \
sombria de presas e garras e parece completamente imune \u00e0s nossas armas. Caso a encontre, tente \
achar um meio de escapar o mais r\u00e1pido poss\u00edvel. \n\n\
\
Boa sorte!

#
# Royal Jelly Palace

s.royal_start = Miss\u00e3o: Royal Jelly Palace
m.royal_start = Aqui \u00e9 a Agente de Intelig\u00eancia Kora. Detectamos outro M\u00f3dulo de Reconhecimento do Esquadr\u00e3o Alfa \
neste pal\u00e1cio. Sua miss\u00e3o \u00e9 localizar e recuperar o m\u00f3dulo. \n\n\
\
O Royal Jelly Palace \u00e9 um lugar estranho. Parece ser algum tipo de castelo que os slimes reaproveitaram \
como resid\u00eancia para membros da sua aristocracia viscosa. Conhecidos como "Royal Jelly", esses \
slimes nobres supostamente governam seus in\u00fameros s\u00faditos leais com um ap\u00eandice em forma de punho de ferro. \n\n\
\
Nossa intelig\u00eancia sugere que o m\u00f3dulo est\u00e1 localizado perto de uma enorme concentra\u00e7\u00e3o de slimes, ent\u00e3o \u00e9 \
razo\u00e1vel acreditar que esteja na "sala do trono" de uma Royal Jelly. Se for esse o caso, prepare-se \
para uma luta assustadora \u2014 Royal Jellies se irritam rapidamente e adoram jogar seu enorme peso ao redor. Sua \
melhor aposta \u00e9 encontrar uma forma de suprimir suas habilidades naturais de regenera\u00e7\u00e3o. \n\n\
\
Boa sorte!

#
# Ironclaw Munitions Factory

s.ironclaw_start = Miss\u00e3o: Ironclaw Munitions Factory
m.ironclaw_start = Aqui \u00e9 a Agente de Intelig\u00eancia Kora. Interceptamos transmiss\u00f5es dos gremlins desta \
instala\u00e7\u00e3o que indicam que eles est\u00e3o construindo algum tipo de arma para destruir Haven! Sua \
miss\u00e3o \u00e9 infiltrar-se na instala\u00e7\u00e3o, destruir essa arma e salvar Haven da destrui\u00e7\u00e3o! \n\n\
\
Conhecida apenas como "Projeto Roarmulus", dizem que ela \u00e9 impenetr\u00e1vel a ataques comuns. Voc\u00ea \
ter\u00e1 de encontrar uma forma de romper qualquer armadura que esteja usando. A intelig\u00eancia sugere que essa arma \
est\u00e1 localizada nas profundezas da instala\u00e7\u00e3o. \n\n\
\
Mas chegar at\u00e9 ela n\u00e3o ser\u00e1 f\u00e1cil. Voc\u00ea perceber\u00e1 que os gremlins pouco se importam com seguran\u00e7a \
no ambiente de trabalho, j\u00e1 que foguetes ativos parecem ser disparados para todos os lados o tempo todo. \
No entanto, voc\u00ea deve conseguir usar as "paredes de polaridade" encontradas nas \u00e1reas de teste \
para bloquear os foguetes que se aproximam. Procure um interruptor roxo e dourado para altern\u00e1-las. \n\n\
\
Tamb\u00e9m detectamos outro M\u00f3dulo de Reconhecimento do Esquadr\u00e3o Alfa em algum lugar desta \
f\u00e1brica. Recupere-o se puder! \n\n\
\
Boa sorte!

#
# Firestorm Citadel

s.firestorm_start = Miss\u00e3o: Firestorm Citadel
m.firestorm_start = Aqui \u00e9 a Agente de Intelig\u00eancia Kora. Na profundidade em que voc\u00ea est\u00e1, estabelecer comunica\u00e7\u00e3o \u00e9 \
dif\u00edcil \u2014 espero que receba esta mensagem. Voc\u00ea se encontra na Firestorm Citadel, algum \
tipo de fortaleza antiga que este planeta aparentemente gosta de colecionar. \u00c9 uma regi\u00e3o incrivelmente hostil \
dos Clockworks; voc\u00ea n\u00e3o durar\u00e1 muito sem o equipamento certo e um esquadr\u00e3o talentoso. \n\n\
\
Detectamos um sinal fraco indicando que algum tipo de artefato da expedi\u00e7\u00e3o do Esquadr\u00e3o Alfa \
est\u00e1 localizado na sala do trono desta cidadela. Precisamos que voc\u00ea recupere esse artefato \u2014 ele pode \
ser uma pista valiosa para descobrir o paradeiro atual deles. \n\n\
\
N\u00e3o vou mentir para voc\u00ea: nenhum esquadr\u00e3o que aceitou esta miss\u00e3o conseguiu voltar da cidadela. Como \
voc\u00ea sem d\u00favida j\u00e1 viu, o lugar arde com um fogo antinatural e uma legi\u00e3o de horrores igualmente antinaturais \
vaga por todos os corredores. Talvez este seja um bom momento para recuar e fabricar algum equipamento resistente ao fogo. \
Uma prova de fogo s\u00f3 vai deixar voc\u00ea queimado. \n\n\
\
Boa sorte!
