# Drakon Skills and Augments

d.firebolt = Lan\u00e7a uma esfera ardente de fogo que explode ao atingir o alvo.

m.impact = Impacto
d.impact = Aumenta o dano de firebolt.

m.extra_crispy = Extra Crocante
d.extra_crispy = Aumenta a pot\u00eancia do fogo e a chance de incendiar alvos.

m.concussive_firebolt = Firebolt Concussivo
d.concussive_firebolt = Adiciona ao firebolt uma chance de atordoamento poderoso.

m.meteoric_firebolt = Firebolt Mete\u00f3rico
d.meteoric_firebol = Aumenta o tamanho da explos\u00e3o de firebolt.

m.flame_barrier = Barreira Flamejante
d.flame_barrier = Cerca voc\u00ea com uma barreira de chamas que refor\u00e7a suas defesas enquanto \
	queima alvos pr\u00f3ximos.

m.high_heat = Calor Elevado
d.high_heat = Aumenta o poder ofensivo da barreira flamejante.

m.heavy_smoke = Fuma\u00e7a Densa
d.heavy_smoke = Aumenta o poder defensivo e a dura\u00e7\u00e3o da barreira flamejante.

m.scorching_barrier = Barreira Escaldante
d.scorching_barrier = Aumenta o n\u00famero de bolas de fogo orbitais e seu tamanho.

m.backfire_barrier = Barreira de Recuo
d.backfire_barrier = Concede um breve aumento de velocidade de movimento ao executar barreira flamejante.

d.firestorm = Invoque o poder do verdadeiro fogo drac\u00f4nico para queimar tudo em seu caminho.

m.five_alarm = Alerta M\u00e1ximo
d.five_alarm = Aumenta a dura\u00e7\u00e3o e o tamanho de firestorm.

m.frenzied_firestorm = Firestorm Fren\u00e9tico
d.frenzied_firestorm = Para cada monstro pego nas chamas, voc\u00ea e seu grupo t\u00eam chance de \
	receber b\u00f4nus de poder de ataque e velocidade.

m.explosive_firestorm = Firestorm Explosivo
d.explosive_firestorm = Cria uma s\u00e9rie de explos\u00f5es ao liberar firestorm.

# Seraphynx Skills and Augments

m.ray_of_light = Raio de Luz
d.ray_of_light = Dispara um feixe concentrado de luz que causa dano a tudo que atravessa.

m.magnify = Amplificar
d.magnify = Aumenta o alcance e o poder do raio de luz.

m.enduring_light = Luz Duradoura
d.enduring_light = Aumenta a dura\u00e7\u00e3o do raio de luz.

m.dazzling_light_ray = Raio de Luz Ofuscante
d.dazzling_light_ray = O raio de luz causa dano extra a monstros das fam\u00edlias morto-vivo e maligno.

m.disintegration_ray = Raio Desintegrador
d.disintegration_ray = O raio de luz tamb\u00e9m reduz a defesa de seus alvos.

m.heart_attack = Ataque do Cora\u00e7\u00e3o
d.heart_attack = Encanta um grupo de alvos. Se um alvo encantado for destru\u00eddo, h\u00e1 uma \
	chance de ele derrubar cora\u00e7\u00f5es restauradores extras.

m.extra_hearty = Cora\u00e7\u00e3o em Dobro
d.extra_hearty = Aumenta a chance de queda de cora\u00e7\u00f5es e a dura\u00e7\u00e3o do encantamento.

m.wide_embrace = Abra\u00e7o Amplo
d.wide_embrace = Aumenta a \u00e1rea de efeito de heart attack.

m.iron_heart_attack = Ataque do Cora\u00e7\u00e3o de Ferro
d.iron_heart_attack = Alvos destru\u00eddos enquanto encantados tamb\u00e9m podem derrubar orbes de defesa.

m.violent_heart_attack = Ataque do Cora\u00e7\u00e3o Violento
d.violent_heart_attack = Alvos destru\u00eddos enquanto encantados criam uma explos\u00e3o.

m.angelic_aura = Aura Angelical
d.angelic_aura = Cria uma aura protetora ao seu redor que tamb\u00e9m protege membros do grupo dentro dela.

m.protection = Prote\u00e7\u00e3o
d.protection = Aumenta o poder defensivo da aura angelical.

m.cover = Cobertura
d.cover = Aumenta o tamanho e a dura\u00e7\u00e3o da aura angelical.

m.seraphic_aura = Aura Ser\u00e1fica
d.seraphic_aura = Membros do grupo dentro da aura protetora recebem regenera\u00e7\u00e3o de escudo aumentada.

m.valkyrian_aura = Aura Valqu\u00edrica
d.valkyrian_aura = Membros do grupo dentro da aura protetora recebem b\u00f4nus de velocidade de carga.


# Maskeraith Skills and Augments

m.caustic_quills = Espinhos C\u00e1usticos
d.caustic_quills = Dispara uma s\u00e9rie de espinhos que se prendem aos alvos e infligem veneno. \
	A cada golpe recebido, um alvo espinhado perde um espinho e sofre dano adicional.

m.venom = Veneno
d.venom = Aumenta a pot\u00eancia do veneno infligido.

m.bristle = Cerda
d.bristle = Aumenta o n\u00famero de espinhos disparados e a dura\u00e7\u00e3o com que ficam presos.

m.vengeful_quills = Espinhos Vingativos
d.vengeful_quills = Cada vez que um alvo espinhado \u00e9 atingido, outro espinho \u00e9 disparado dele \
	para o pr\u00f3ximo alvo dispon\u00edvel.

m.virulent_quills = Espinhos Virulentos
d.virulent_quills = Cada vez que um alvo espinhado \u00e9 atingido, h\u00e1 chance de ativar uma explos\u00e3o venenosa.

m.shadow_cloak = Manto Sombrio
d.shadow_cloak = Concede invisibilidade parcial e um aumento defensivo por tempo limitado. \
	Manto Sombrio \u00e9 cancelado se voc\u00ea sofrer dano, atacar ou realizar qualquer outra a\u00e7\u00e3o.

m.dark_veil = V\u00e9u Sombrio
d.dark_veil = Aumenta o poder defensivo do manto sombrio.

m.enduring_night = Noite Duradoura
d.enduring_night = Aumenta a dura\u00e7\u00e3o do manto sombrio.

m.deadly_shadow_cloak = Manto Sombrio Mortal
d.deadly_shadow_cloak = Receba b\u00f4nus de poder de ataque e velocidade de ataque ao ativar manto sombrio. \
	O b\u00f4nus dura um curto per\u00edodo ap\u00f3s o fim do manto.

m.vengeful_shadow_cloak = Manto Sombrio Vingativo
d.vengeful_shadow_cloak = Cria ao seu redor um campo de disrup\u00e7\u00e3o explosivo quando o manto sombrio \u00e9 \
	interrompido, com chance de atordoar alvos.

m.hexing_haze = N\u00e9voa Amaldi\u00e7oante
d.hexing_haze = Cria uma miasma ao seu redor que amaldi\u00e7oa qualquer alvo dentro dela. Cada maldi\u00e7\u00e3o tem um \
	temporizador que causa dano ao alvo quando termina. Para cada alvo atingido por \
	n\u00e9voa amaldi\u00e7oante, a dura\u00e7\u00e3o da miasma aumenta.

m.no_mercy = Sem Piedade
d.no_mercy = Aumenta o dano infligido por n\u00e9voa amaldi\u00e7oante.

m.plentiful_pain = Dor Abundante
d.plentiful_pain = Aumenta a dura\u00e7\u00e3o b\u00f4nus de n\u00e9voa amaldi\u00e7oante \u00e0 medida que novos alvos \
	s\u00e3o adquiridos.

m.haunted_haze = N\u00e9voa Assombrada
d.haunted_haze = Qualquer alvo que morrer como resultado do dano causado por n\u00e9voa amaldi\u00e7oante \
	gerar\u00e1 um fantasma vingativo que procura outros alvos e explode ao atingir.

m.chaotic_haze = N\u00e9voa Ca\u00f3tica
d.chaotic_haze = Alvos feridos por n\u00e9voa amaldi\u00e7oante t\u00eam chance de receber uma condi\u00e7\u00e3o de status aleat\u00f3ria.


