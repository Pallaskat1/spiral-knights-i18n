f.budding_coat = Un traje rasgado puede significar la muerte. Pero afortunadamente este fue \
  colonizado por una inusual planta simbi\u00f3tica.Viste esto \u00a1y te garantiza tener manos \
  de jardinero!


f.raider_tunic = El tesoro est\u00e1 a tu alcance con este abrigo.

f.angelic_cuirass = Una armadura de vestuario bellamente ornamentada dise\u00f1ada para evocar \
  una conexi\u00f3n celestial.

# Gear Shield names
#...................................................................................................

f.aegis = Sublime escudo que solo obtienen los miembros m\u00e1s notables de la Spiral Order. \
