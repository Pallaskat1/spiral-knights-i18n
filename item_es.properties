f.honor_shield_2 = Un escudo ceremonial otorgado a los Caballeros Spiral con experiencia. \
  Aunque su prop\u00f3sito es servir para las ocasiones m\u00e1s formales, su s\u00f3lida construcci\u00f3\
  n lo hace adecuado para el combate.

f.honor_shield_3 = Un escudo ceremonial otorgado a los Campeones de la Orden Spiral. Aunque su \
  prop\u00f3sito es servir para las ocasiones m\u00e1s formales, su s\u00f3lida construcci\u00f3\
  n lo hace adecuado para el combate.

f.honor_shield_4 = Un escudo ceremonial otorgado a los Vanguardias de la Orden Spiral. Aunque \
  su prop\u00f3sito es servir para las ocasiones m\u00e1s formales, su s\u00f3lida construcci\u00f3\
  n lo hace adecuado para el combate.

f.the_bitter_end = Un escudo que portan todos los miembros de los Soldados Recon. Su nombre es \
