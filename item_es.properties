# OBSOLETE

f.style_kit = {0}  Este art\u00edculo ser\u00e1 destru\u00eddo, pero podr\u00e1s volver a \
  aplicar este modificador a tu caballero usando el kit de estilo.

f.personal_color = Una vez usado, este art\u00edculo cambiar\u00e1 el color personal de tu \
  Caballero al color especificado de manera permanente.


f.personal_eye = Una vez usado, este art\u00edculo cambiar\u00e1 permanentemente los ojos de tu \
  caballero a la forma de ojos especificada.

m.height_mod = Modificador de Altura {0}

f.personal_height = Una vez usado, este art\u00edculo cambiar\u00e1 permanentemente la altura \
  de tu caballero a la altura especificada.

f.rename_knight = Te permite elegir un nuevo nombre para tu caballero. Este art\u00edculo se \
  destruye una vez que se ha usado.
f.rename_guild = Te permite elegir un nuevo nombre para tu gremio. Este art\u00edculo s\u00f3lo \
  puede ser usado por un L\u00edder de Gremio y se destruye una vez que se ha usado.


# Weapon Bomb names
#...................................................................................................

f.ash_agni = Cuando esta bomba haya dejado el campo de batalla en cenizas, entonces, y solo \
  entonces, tus enemigos tendr\u00e1n permiso para morir.

f.big_angry_bomb = Una bomba inmensamente potente que tiene una actitud espantosa.

f.blast_bomb = Una bomba multiuso que se entrega a los caballeros Spiral Knights que han \
  mostrado su val\u00eda sobre el terreno.

f.cold_snap = Proto Bomb modificada para generar peque\u00f1as r\u00e1fagas de hielo al \
  detonar.

f.crystal_bomb = Una bomba de fragmentaci\u00f3n formada de un peque\u00f1o explosivo \
  recubierto de una aleaci\u00f3n de Moonstone y Valestone. Su relajante tono azul cer\u00faleo ha demostrado cl\u00ed\
  nicamente que tanto calma a los caballeros como aniquila a los muertos vivientes.

f.dark_briar_barrage = Una m\u00edtica bomba que puede explotar con la furia del mism\u00edsimo \
  Snarbolax. Se dice que el aullido sobrenatural que produce es m\u00e1s incapacitante que su \
  explosi\u00f3n.

f.dark_matter_bomb = Una bomba de fragmentaci\u00f3n formada de un peque\u00f1o explosivo \
  revestido de Dark Matter. Desde que fue descubierto originalmente, el Dark Matter ha sido \
  puesto en una variedad de usos, desde hacer funcionar la tecnolog\u00eda Spiral, hasta \
  reacomodar a los Gremlins en un nivel subat\u00f3mico.

f.deadly_charcoaler = Este valiente asador est\u00e1 garantizado para soasar a tu competencia.

f.deadly_crystal_bomb = Un gran trozo de aleaci\u00f3n de Moonstone y Valenstone preparado con \
  un potente explosivo. Los estudios muestran que esta bomba puede ser usada para reducir los \
  antojos de cerebros en los zombis en un 100% al explotarlos en pedazos.

f.deadly_dark_matter_bomb = Un gran trozo de Dark Matter preparado con un potente explosivo. \
  Esta bomba estar\u00eda en flagrante violaci\u00f3n del manual de seguridad de la Orden \
  Spiral, si no hubieran perdido la \u00faltima copia en el accidente.

f.deadly_shard_bomb = Un gran trozo de Crimsonite preparado con un potente explosivo. Aqu\u00ed no est\u00e1 agotada la Crimsonite: \u00a1esta bomba est\u00e1 \
  hecha con buen material! O el peor material, si  de casualidad eres el objetivo.

f.deadly_splinter_bomb = Un gran trozo de mineral sint\u00e9tico preparado con un potente \
  explosivo. Hecho comprobado: la manera m\u00e1s sencilla de encontrar una astilla en un pajar \
  es explotando el pajar.

f.deconstructor = Bomba especialmente dise\u00f1ada para desmantelar maquinaria, ya sea esta \
  sensible o no.

f.electron_bomb = Adaptada usando varias teor\u00edas Gremlin poco convencionales, cualquiera \
  que tenga la mala suerte de ser arrastrado a la explosi\u00f3n de est\u00e1 bomba recibir\u00e1 una descarga.

f.electron_charge = Una peque\u00f1a carga electro-explosiva de misteriosos or\u00edgenes. Es \
  capaz de generar un abrumador v\u00f3rtice de electricidad.

f.electron_vortex = Una Electron Bomb modificada con una inestable carga explosiva de esencia \
  org\u00e1nica. Los enemigos atrapados en su punitivo radio de explosi\u00f3n son cruelmente \
  llamados "pasmados".

f.heavy_deconstructor = Deconstructor mejorada que destruye robots y aplasta constructs en una \u00e1rea muy amplia.

f.fiery_atomizer = Una poderosa bomba alqu\u00edmica que crea una densa nube de polvo altamente \
  combustible.

f.fiery_vaporizer = Bomba alqu\u00edmica que provoca una nube de niebla altamente inflamable.

f.fiery_vaporizer_mkii = Fiery Vaporizer modificada para dispersar material combustible en un \
  amplio rango.

f.firecracker = Proto Bomb modificada para generar peque\u00f1as explosiones de fuego al \
  detonar.

f.freezing_atomizer = Una poderosa bomba alqu\u00edmica que produce una densa nube de un vapor \
  extremadamente fr\u00edo.

f.freezing_vaporizer = Bomba alqu\u00edmica que provoca una nube de niebla a temperaturas ultra \
  bajas.

f.freezing_vaporizer_mkii = Freezing Vaporizer modificada que provoca una nube de niebla a \
  temperaturas ultra bajas en un amplio rango.

f.graviton_bomb = Capaz de arrastrar a los enemigos a su ubicaci\u00f3n antes de explotar, esta \
  bomba utiliza tecnolog\u00eda que la Spiral Order a\u00fan no entiende completamente.

f.graviton_charge = Una peque\u00f1a carga explosiva de misteriosos or\u00edgenes. Es capaz de \
  generar un abrumador v\u00f3rtice de gravedad.

f.graviton_vortex = Graviton Bomb fortificado con cantidades potencialmente peligrosas de \
  shadow steel. Su explosi\u00f3n atraer\u00e1 a tus enemigos hacia ella... eso es si antes no \
  destruye el universo entero.

f.haze_bomb = Bomba alqu\u00edmica que provoca una nube nociva capaz de aturdir a quienes se \
  vean atrapados en ella.

f.haze_bomb_mkii = Una Haze Bomb modificada para esparcir qu\u00edmicos t\u00f3xicos en un radio m\u00e1s amplio.

f.haze_burst = Una poderosa bomba alqu\u00edmica que produce una densa nube de material \
  intensamente desconcertante.

f.heavy_crystal_bomb = Un s\u00f3lido trozo de aleaci\u00f3n con un explosivo sorpresa dentro. \
  Los zombis odian las sorpresas.

f.heavy_dark_matter_bomb = Un s\u00f3lido trozo de Dark Matter con un explosivo sorpresa \
  dentro. Los gremlins odian las sorpresas.

f.heavy_shard_bomb = Un s\u00f3lido trozo de Crimsonite agotada con un explosivo sorpresa \
  dentro. \u00a1A todos les gustan las sorpresas!

f.heavy_splinter_bomb = Un trozo s\u00f3lido de mineral sint\u00e9tico con un explosivo \
  sorpresa dentro. Los wolvers odian las sorpresas.

f.humbug_hazer = Este atrabiliario artilugio garantiza que cualquiera excepto el m\u00e1s enga\u00f1\
  oso de los viejos cascarrabias se enferme del est\u00f3mago.

f.ionized_salt_bomb = Un s\u00f3lido trozo de sal de roca con un explosivo sorpresa dentro. Los \
  gelatinosos odian las sorpresas.

f.irontech_bomb = Pesada bomba envuelta en gruesas placas de hierro. Pese a ser m\u00e1s lenta que la mayor\u00ed\
  a de las bombas, es muy potente.

f.irontech_destroyer = Es el hermano mayor de Irontech Bomb y libera el pleno potencial de la \
  energ\u00eda Irontech.

f.jack_froster = Abran paso a un paisaje invernal con esta repugnante sorpresa muerde-narices, \
  que es perfecta para dar a tus enemigos un mal episodio de quemadura por fr\u00edo.

f.lightning_capacitor = Un Capacitor avanzado que puede explotar con la furia de una tormenta \
  el\u00e9ctrica.

f.slumber_smogger = Una bomba alqu\u00edmica que llena un \u00e1rea con un agente de sue\u00f1o.
f.slumber_smogger_mkii = Un Slumber Smogger modificado para dispersar humo de letargo sobre un \
  rango m\u00e1s amplio.
f.slumber_squall = Una poderosa bomba alqu\u00edmica que crea una espesa niebla de roc\u00edo de sue\u00f1o.
f.torpor_tantrum = La bomba de sue\u00f1o m\u00e1xima. Es como un cuento para antes de dormir, \
  solo que m\u00e1s explosivo.

f.master_blast_bomb = Explosivo tremendamente potente que se sol\u00eda usar en la miner\u00eda \
  y que ahora se distribuye imprudentemente para su uso en combate.

f.nitronome = Este explosivo solo se les entrega a los granaderos m\u00e1s experimentados de la \
  Spiral Order. Est\u00e1 hecho a partir de una sustancia sint\u00e9tica que hace tictac de \
  manera ominosa, incluso cuando no est\u00e1 armado.

f.obsidian_crusher = Una bomba peculiar hecha de obeliscos de obsidiana que se encuentran en el \
  reino de los Apocrea. A pesar de ser una bomba, algunos son atra\u00eddos a sostenerla y \
  'resolverla' como si fuera alg\u00fan tipo de rompecabezas.

f.plasma_capacitor = La adici\u00f3n de una fuente de poder Spiral avanzada le da a esta bomba \
  un sorprendentemente grande radio de explosi\u00f3n.

f.proto_bomb = Peque\u00f1a bomba utilizada por los reclutas Spiral Knights para aprender el \
  arte de hacer volar cosas por los aires.

f.radiant_sun_shards = Un s\u00f3lido trozo de Luminite cargada por el sol con un explosivo \
  sorpresa dentro. Los demonios odian las sorpresas.

f.rock_salt_bomb = Una bomba de fragmentaci\u00f3n formada a partir de un peque\u00f1o \
  explosivo recubierto de sal de roca. No se recomienda su uso en la cocina.

f.scalding_hot_cocoa = Una chamuscante salpicadura de dulce destrucci\u00f3n espera a cualquier \
  enemigo que intente tomar este tarro antes de que haya podido enfriarse un poco.

f.scintillating_sun_shards = Un gran trozo de Luminite cargada por el sol preparada con un \
  potente explosivo.  Los juegos pirot\u00e9cnicos al detonar son verdaderamente impactantes.

f.shard_bomb = Una bomba de fragmentaci\u00f3n formada de un peque\u00f1o explosivo recubierto \
  de Crimsonite agotado. Agotada o no, Esta cosa puede lanzar serias esquirlas.

f.shivermist_buster = Aunque originalmente era usada para congelar suministros perecederos, el \
  Shivermit Buster es mucho m\u00e1s satisfactorio cuando se usa para congelar de inmediato a \
  los monstruos atrapados en ella.

f.shocking_salt_bomb = Un gran trozo de sal de roca preparada con un potente explosivo.  Para \
  prop\u00f3sitos nutricionales, este trozo de sal en particular ha sido enriquecido con \
  peligrosas cantidades de electricidad. Espera.. \u00bfqu\u00e9?

f.spike_shower = Una poderosa bomba dise\u00f1ada para destrozar a los oponentes con un gru\u00f1ido.

f.spine_cone = Una feroz bomba que est\u00e1 definitivamente repleta de zarzas.

f.splinter_bomb = Una bomba de fragmentaci\u00f3n formada de un peque\u00f1o explosivo \
  recubierto de un mineral sint\u00e9tico. Propenso a romperse, el material de esta bomba que \
  de otra manera es in\u00fatil es perfecto para darles una mala astillada a los enemigos.

f.stagger_storm = Aunque originalmente fue desarrollada por la Orden Spiral para someter de \
  modo inofensivo a ciertas especies peligrosas, la manera en que lidies con los desafortunados \
  enemigos que queden atrapados en la tormenta depende completamente de ti.

f.static_capacitor = Un aparato explosivo de origen Gremlin dise\u00f1ado para producir un \
  letal campo de electricidad.

f.static_flash = Una Proto Bomb modificada para generar peque\u00f1os arranques de energ\u00eda al momento de detonar.

f.sun_shards = Bomba de fragmentaci\u00f3n formada de un peque\u00f1o explosivo recubierto con \
  Luminite cargada por el sol. Lo que sea que hagas, no la mires directamente.

f.super_blast_bomb = Una Blast Bomb mejorada que combina una fuente de calor inestable con \
  material explosivo experimental para crear un paquete peligrosamente inseguro.

f.super_crystal_bomb = Una bomba de fragmentaci\u00f3n rellena de a\u00fan m\u00e1s aleaci\u00f3n. Apl\u00ed\
  quese directamente a la cabeza de los enemigos.

f.super_dark_matter_bomb = Un bomba de fragmentaci\u00f3n rellena de a\u00fan m\u00e1s Dark Matter. \u00bfQu\u00e9 \
  tanto Dark Matter es demasiado? Este tanto.

f.super_shard_bomb = Una bomba de fragmentaci\u00f3n rellena con a\u00fan m\u00e1s Crimsonite \
  agotada. La cura de selecci\u00f3n para una criatura combativa es sin duda un cristal en el \
  cr\u00e1neo.

f.super_splinter_bomb = Una bomba de fragmentaci\u00f3n rellena de a\u00fan m\u00e1s mineral sint\u00e9tico. Tambi\u00e9\
  n se puede usar para picar verduras, si no te molesta quitar ocasionalmente el cristal de \
  entre tus dientes.

f.toxic_atomizer = Una poderosa bomba alqu\u00edmica que produce una asfixiante nube venenosa.

f.toxic_vaporizer = Bomba alqu\u00edmica que produce una nube t\u00f3xica.

f.toxic_vaporizer_mkii = Toxic Vaporizer modificado para dispersar agentes nocivos en rangos m\u00e1s amplios.

f.twisted_spine_cone = Una bomba Spine Cone mejorada que destrozar\u00e1 a los oponentes con \
  sus espinas y los cubrir\u00e1 de zarzas.

f.venom_veiler = Lo \u00faltimo en dispositivos de dispersi\u00f3n t\u00f3xica, el Venom Veiler \
  puede ser usado para destruir las plagas en los cultivos. En su defecto, tambi\u00e9n puede \
  ser usado para destruir los cultivos.

f.voltaic_tempest = Este aparato de alto voltaje de alta tecnolog\u00eda no es recomendado para \
  usarse en el agua, cerca de agua,  o cerca de personas pensando en agua. Para estar seguro, \
  probablemente ni siquiera deber\u00edas verlo, tampoco.

f.virulent_seedling = Esta peque\u00f1a y peligrosa planta ha sido convertida en arma por biot\u00e9\
  cnicos para que difunda una nube de t\u00f3xicas esporas al detonar. No dejes que el tama\u00f1o te enga\u00f1\
  e; tiene muchos kiloaudreys de poder.

# Weapon Bomb names (special)
#...................................................................................................

f.celestial_vortex = Una Bomba Celestial modificada con la carga de un sol agonizante. Los \
  enemigos atrapados en el feroz radio de explosi\u00f3n pueden entrever los albores de la \
  creaci\u00f3n.

f.potocrowns = Algo para que tus enemigos encuentren mala suerte, ya que explota con un \
  doloroso golpe.

f.powderkeg = Cuidado, esta cosa puede explotar como el metaf\u00f3rico polvor\u00edn.

f.punkin_cinnamug = Una espumosa mezcla de calabazas y canela que seguramente quemar\u00e1 a \
  aquellos que no esperen a que este tarro se enfr\u00ede.

f.piggy_banker = Un peque\u00f1o y vol\u00e1til banco que seguramente har\u00e1 un hoyo en los \
  bolsillos de tus enemigos.

f.warmaster_bomb_1 = Una potente bomba rebosante de energ\u00eda oscura que el Warmaster Seerus \
  dise\u00f1\u00f3 con el \u00fanico prop\u00f3sito de eliminar a los otros gremlins que se \
  interpon\u00edan en su camino.

f.warmaster_bomb_2 = Una refinada versi\u00f3n de la sombr\u00eda bomba que el Warmaster Seerus \
  dise\u00f1\u00f3 con el \u00fanico prop\u00f3sito de eliminar a los otros gremlins que se \
  interpon\u00edan en su camino.

f.warmaster_bomb_3 = Una versi\u00f3n perfeccionada de la sombr\u00eda bomba que el Warmaster \
  Seerus dise\u00f1\u00f3 con el \u00fanico prop\u00f3sito de eliminar a los otros gremlins que \
  se interpon\u00edan en su camino. Se piensa que ha sido reservada para usarse contra otros \
  miembros de la Orden Crimson.

# Weapon Handgun names
#...................................................................................................

f.antigua = Misteriosa reliquia de tiempos olvidados. Usa p\u00f3lvora explosiva para disparar.

f.arcana = Una pistola excepcionalcon poderosos disparos elementales a los que muchos \
  Caballeros Spiral llaman 'misiles m\u00e1gicos'.

f.argent_peacemaker = Una antigua pistola forjada con plata del sol. Sus balas dan el \u00faltimo empuj\u00f3\
  n a quienes se resisten a dejar este mundo.

f.autogun = Una pistola completamente autom\u00e1tica capaz de disparar r\u00e1pidamente poderosos rel\u00e1mpagos de energ\u00eda.

f.biohazard = Aseg\u00farate de revisar los sellos en tu armadura antes de operar esta arma, o \
  puedes terminar igual de miserable que tus enemigos. Las balas del Biohazard envuelven al \
  enemigo en un campo de energ\u00eda que explota al contacto despu\u00e9s de recibir da\u00f1o.

f.black_chaingun = Una ametralladora muy avanzada dise\u00f1ada para disparar cientos de rayos \
  de sombra en un tiempo muy corto. Controlar una de estas requiere de una mano muy habilidosa.

f.blackhawk = Una pistola con alineaci\u00f3n sombra de incre\u00edble poder. Se dice que \
  contiene el alma de un caballero al que solo le faltaban dos d\u00edas para retirarse.

f.blaster = Una vers\u00e1til pistola que se entrega a los caballeros Spiral Knights que han \
  mostrado su val\u00eda sobre el terreno.

f.blazing_pulsar = Una pulsar muy avanzada capaz de lanzar infiernos compactos desde lejos. Los \
  disparos pulsar se vuelven m\u00e1s poderosos entre m\u00e1s lejos viajen.

f.blight_needle = Es un hecho comprobado que a\u00fan la m\u00e1s virulenta de las toxinas es m\u00e1\
  s contagiosa si se dispara en un \u00e1rea grande indiscriminadamente.

f.blitz_needle = Cuando la supresi\u00f3n no es lo suficientemente buena, la Blitz Needle se \
  especializa en "fuego opresivo".

f.breach_blaster = Una pierce blaster mejorada dise\u00f1ada para romper la armadura de los \
  hostiles.

f.buccaneer_broadsider = Una feroz arma de fuego que lleva fusil de chispa. La confiabilidad de \
  este cl\u00e1sico mecanismo ha sido mejorada con un poco del saber de los gremlins.

f.callahan = Una pistola de incre\u00edble potencia que puede dejar aturdido a su objetivo. Se \
  dice que hace que sus objetivos se sienten menos que afortunados. Un ataque cargado puede \
  pasar a trav\u00e9s de m\u00faltiples enemigos.

f.catalyzer = Un avanzado armamento alqu\u00edmico adaptado de los aparatos Gremlin de miner\u00eda y demolici\u00f3\
  n. Las balas del Catalyzer envuelven al enemigo en un campo de energ\u00eda que explota despu\u00e9s de recibir da\u00f1o.

f.cryo_driver = Un arma de alta tecnolog\u00eda que dispara poderosas balas cryo que se rompen \
  innumerables veces en el impacto.

f.cryotech_alchemer = Una pistola alqu\u00edmica que dispara balas a temperatura hiper baja que \
  se parten al impactar.

f.cryotech_alchemer_mkii = Alchemer mejorada que dispara balas de materiales a temperaturas \
  extremadamente bajas y a una gran velocidad.

f.dark_chaingun = Una ametralladora capaz de disparar una descarga de abrasadores rayos de \
  sombra.

f.elemental_blaster = Una blaster modificada para disparar descargas elementales.

f.firo_driver = Un arma de alta tecnolog\u00eda que dispara poderosas balas firo que se rompen \
  innumerables veces en el impacto.

f.firotech_alchemer = Una pistola alqu\u00edmica que dispara balas de llamas l\u00edquidas que \
  se parten al impactar.

f.firotech_alchemer_mkii = Alchemer mejorada que dispara balas de napalm a gran velocidad.

f.flaming_pulsar = Una pulsar modificada con energ\u00eda abrasadora que quema m\u00e1s con el \
  tiempo. Los disparos pulsar se vuelven m\u00e1s poderosos entre m\u00e1s lejos viajen.

f.freezing_pulsar = Una pulsar modificada con un agente de congelaci\u00f3n que se enfr\u00eda m\u00e1\
  s con el tiempo. Los disparos pulsar se vuelven m\u00e1s poderosos entre m\u00e1s lejos viajen.

f.frost_gun = Una Proto Gun potenciada con un agente alqu\u00edmico de congelaci\u00f3n de baja intensidad.

f.frozen_pulsar = Una pulsar muy avanzada que produce una explosi\u00f3n tipo tormenta de hielo \
  una vez que la ronda madura. Los disparos pulsar se vuelven m\u00e1s poderosos entre m\u00e1s lejos viajen.

f.fusion_blaster = Una elemental blaster mejorada dise\u00f1ada para desterrar a las criaturas \
  que acechan en las sombras.

f.gigawatt_pulsar = Una poderosa pistola mejorada que golpea a los enemigos con la fuerza de un \
  rayo. Los disparos Pulsar se vuelven m\u00e1s poderosos entre m\u00e1s lejos viajen.

f.gilded_griffin = Una bella pistola que lleva el nombre de una grandiosa y noble bestia. Se \
  cree que su marco dorado proporciona luz dentro de la impenetrable oscuridad del Inframundo.

f.grim_repeater = Usada s\u00f3lo por los m\u00e1s \u00e9lite de los Soldados Spiral, esta diab\u00f3\
  lica ametralladora se gan\u00f3 su nombre por la incre\u00edble velocidad con la que entrega \
  boletos de sombra a la otra vida.

f.hail_driver = Una vez que hayan visto los destellos de hielo anormalmente fr\u00edo que \
  produce, comprender\u00e1n por qu\u00e9 este Driver es aclamado.

f.heavy_pulsar = Un Pulsar mejorado con tecnolog\u00eda Spiral para golpear m\u00e1s duro. Los \
  disparos Pulsar se vuelven m\u00e1s poderosos entre m\u00e1s lejos viajen.

f.industrial_catalyzer = Un Catalyzer modificado para disparar peligrosos proyectiles \
  sobrecargados. Las balas del Catalyzer envuelven al enemigo en un campo de energ\u00eda que explota despu\u00e9s de recibir da\u00f1o.

f.iron_slug = S\u00f3lo los m\u00e1s temibles enemigos pueden resistir la agobiante par\u00e1\
  lisis causada por la por la fuerza m\u00e1gnum del impacto repentino del Iron Slug. Un ataque \
  cargado puede pasar a trav\u00e9s de m\u00faltiples enemigos.

f.kilowatt_pulsar = Un Pulsar mejorado con tecnolog\u00eda Spiral que propina un desagradable \
  choque al impacto. Los disparos Pulsar se vuelven m\u00e1s poderosos entre m\u00e1s lejos viajen.

f.magma_driver = Al escupir masas de muerte l\u00edquida a una tasa alarmante, esta sublime \
  arma no es recomendada para usarse cerca (o sobre) de alguien por quien sientas cari\u00f1o.

f.magnus = Una enorme pistola que dispara balas de gran impacto que pueden aturdir hasta a los \
  monstruos m\u00e1s fuertes. Un ataque cargado puede pasar a trav\u00e9s de m\u00faltiples enemigos.

f.master_blaster = Esta avanzada arma que se lleva en el cintur\u00f3n es una excelente elecci\u00f3\
  n si tu equipo necesita otro h\u00e9roe.

f.mega_magnus = Una Magnus mejorada lo suficientemente poderosa como para arrancar de un tajo \
  la cabeza a una bestia. Un ataque cargado puede pasar a trav\u00e9s de m\u00faltiples enemigos.

f.mega_tundrus = Una tundrus mejorada que no toma prisioneros, excepto cuando lo hace, y \
  entonces la prisi\u00f3n est\u00e1 hecha de hielo. Un ataque cargado puede abrirse camino a \
  trav\u00e9s de m\u00faltiples enemigos.

f.needle_shot = Una Autogun modificada para disparar balas de perforaci\u00f3n a una tasa alarmante.

f.neutralizer = Te sorprender\u00eda saber el n\u00famero de aplicaciones pr\u00e1cticas que \
  pueden tener dos sustancias que, al combinarse, literalmente no dejan nada a su paso. Las \
  balas del Neutralizer envuelven al enemigo en un campo de energ\u00eda que explota despu\u00e9s de recibir da\u00f1o.

f.nog_blaster = Un contenedor altamente vol\u00e1til, lleno de cremoso j\u00fabilo con alto \
  colesterol que cuando se dispara da un golpetazo tremendo.

f.nova_driver = Se necesita m\u00e1s que un milagro para salvarte si eres el desafortunado \
  objetivo de esta poderosa pistola que tiene la fuerza misma de las estrellas.

f.obsidian_carbine = Una mortal pistola hecha de obeliscos de obsidiana que se encuentran en el \
  reino de los Apocrea. Con cada bala que se dispara, se escucha un suave susurro que se cree \
  que es el verdadero nombre de su objetivo.

f.overcharged_mixmaster = Una batidora de mano de calidad industrial que seguramente mezclar\u00e1 las cosas.

f.celestial_orbitgun = Esa pistola de proyecci\u00f3n de planetoides evoca im\u00e1genes del \
  nacimento de sistemas estelares. Los oponentes atrapados en su cegadora vor\u00e1gine seguramente ver\u00e1n la luz.

f.pepperbox = Una Autogun modificada para disparar balas a alta temperatura capaz de sepultar a \
  los enemigos.

f.permafroster = Los Caballeros Tech a\u00fan no est\u00e1n seguros si los objetivos de esta \
  pistola de congelaci\u00f3n profunda alguna vez se descongelan. Hasta ahora, 'no'. Los \
  disparos de la Permafroster se vuelven m\u00e1s poderosos entre m\u00e1s lejos viajen.

f.phantamos = Una poderosa pistola rebosante de energ\u00eda oscura. La Phantamos representa \
  una de las m\u00e1s recientes adiciones al arsenal de los Caballeros Spiral, ya que contener \
  energ\u00eda de sombra de este grado requiere una gran cantidad de investigaci\u00f3n.

f.pierce_blaster = Una blaster mejorada, modificada para hacer disparos de fuego perforante.

f.plague_needle = La opini\u00f3n de los caballeros est\u00e1 dividida en si las balas de esta \
  pistola perforan y despu\u00e9s envenenan, o si envenenan y despu\u00e9s perforan. Para el \
  desafortunado objetivo, esta distinci\u00f3n es irrelevante.

f.polaris = Se dice que las explosiones causadas por esta estelar arma son tan brillantes que \
  siempre podras encontrar tu camino en la oscuridad. Los disparos Polaris se vuelven m\u00e1s poderosos entre m\u00e1s lejos viajen.

f.prisma_driver = Un arma de alta tecnolog\u00eda que dispara poderosas balas prisma que se \
  rompen innumerables veces en el impacto.

f.prismatech_alchemer = Una pistola alqu\u00edmica que dispara balas de l\u00edquido cargado \
  con fotones que se parten al impactar.

f.prismatech_alchemer_mkii = Alchemer mejorado que dispara balas de l\u00edquido fot\u00f3nico a gran velocidad.

f.proto_duelist = Una pistola de seis tiros preferida por los tiradores de primera de los \
  Caballeros Spiral.

f.chilling_duelist = Comienza a resolver disputas al despuntar el alba con esta fr\u00eda \
  pistola hecha a la medida.

f.proto_gun = Arma de fuego compacta que se otorga a todos los reclutas Spiral Knights.

f.pulsar = Un arma de fuego Gremlin de alta tecnolog\u00eda originalmente dise\u00f1ada para \
  los escuadrones \u00e9lite de soldados Ironclaw.  Los disparos Pulsar se vuelven m\u00e1s poderosos entre m\u00e1s lejos viajen.

f.pummel_gun = Una pistola Punch Gun modificada adecuadamente para usarse en combate. El \
  culatazo que se recibe de su poderoso ataque cargado es bien conocido entre los reclutas.

f.punch_gun = Antes usada para abrir las c\u00e1psulas da\u00f1adas, esta herramienta de \
  rescate funciona muy bien como potente pistola de un solo disparo.

f.radiant_pulsar = Una innovadora pistola planeada para ser usada por la crema y nata de los \
  guerreros de la Spiral Order. Los disparos Pulsar se vuelven m\u00e1s poderosos entre m\u00e1s lejos viajen.

f.raptor = Una antigua pistola imbuida con encantamientos dise\u00f1ados para aniquilar a las \
  criaturas demon\u00edacas del Inframundo. Al igual que su hom\u00f3nimo, sus balas vuelan r\u00e1\
  pido y golpean con fuerza mortal.

f.riftlocker = Una mortal pistola de la que se dice que es capaz de desgarrar armadura pesada \
  con un s\u00f3lo disparo. Durante el asedio a Isora, estas pistolas probaron ser \
  instrumentales para abrirse camino entre las m\u00e1quinas de guerra de los Morai.

f.sentenza = Antigua pistola forjada con Shadow Steel. Se dice que fue empu\u00f1ada por un \
  demonio con 'ojos de \u00e1ngel'.

f.shadow_blaster = Una blaster mejorada, modificada para disparar tiros de sombra.

f.shadow_driver = Un arma de alta tecnolog\u00eda que dispara poderosas balas shadow que se \
  rompen innumerables veces en el impacto.

f.shadowtech_alchemer = Pistola alqu\u00edmica que dispara balas de sombra concentrada que se \
  parten al impactar.

f.shadowtech_alchemer_mkii = Alchemer mejorado que dispara balas de sombra a gran velocidad.

f.silversix = Misteriosa antig\u00fcedad con un acabado brillante en plata. Se dice que alguna \
  vez fueron empu\u00f1adas por los 'p\u00e1rrocos pistoleros', hace mucho, mucho tiempo.

f.spiral_soaker = Una mortal pistola de agua que seguramente empapar\u00e1 hasta el m\u00e1s seco de los enemigos.

f.spitfire = Una Proto Gun modificada, mejorada con una r\u00e1faga de fuego de baja \
  intensidad.

f.strike_needle = Los planes para modificar el Strike Needle para uso no combativo fueron \
  pospuestos despu\u00e9s de que un recluta accidentalmente agujere\u00f3 la litera del \
  Teniente Feron.

f.storm_driver = La carga latente que corre por esta arma suprema es lo suficientemente fuerte \
  para causar molestias a cualquiera que la empu\u00f1e y una extremada molestia a cualquiera a \
  quien se le dispare.

f.stun_gun = Una Proto Gun modificada para aturdir a los monstruos. Las bestias que hayan sido \
  aturdidas se mover\u00e1n y atacar\u00e1n m\u00e1s lento de lo normal.

f.super_blaster = Un Blaster sobrecargado que es adecuado para las largas expediciones dentro \
  de los Mecanismos.

f.super_stun_gun = Una pistola Stun Gun mejorada cuya poderosa r\u00e1faga ahuyentar\u00e1 hasta a los m\u00e1\
  s desconcertantes monstruos de los Mecanismos.

f.supernova = La destrucci\u00f3n que se deja con el paso de esta incomparable puede ser \
  cualquier cosa menos nebulosa. Los disparos Supernova se vuelven m\u00e1s poderosos entre m\u00e1s lejos viajen.

f.toxic_catalyzer = Un Catalyzer modificado para disparar peligrosos proyectiles radioactivos. \
  Las balas del Catalyzer envuelven al enemigo en un campo de energ\u00eda que explota despu\u00e9s de recibir da\u00f1o.

f.toxic_needle = Una Autogun modificada para disparar r\u00e1fagas de perforaci\u00f3n con una \
  dosis de veneno.

f.tundrus = Una magnus modificada que se asegura de que si tu objetivo de alguna manera \
  sobrevivi\u00f3 el primer tiro, se quedar\u00e1n congelados en el sitio. Un ataque cargado \
  puede arrasar con m\u00faltiples enemigos.

f.umbral_blaster = Una shadow blaster modificada dise\u00f1ada para neutralizar bioformas alien\u00edgenas.

f.umbra_driver = Esta terriblemente poderosa arma dispara balas completamente desprovistas de \
  color, olor y misericordia.

f.valiance = Esta pistola de alto rendimiento es s\u00edmbolo de la Spiral Order y sus \
  veteranos la llevan con orgullo. Como se suele decir: un caballero no necesita coraje, solo \
  Valiance.

f.fiery_pepperbox = Todos los caballeros est\u00e1n de acuerdo: cuando has sido atacado por un \
  enjambre de Ice Cubes, la felicidad es un Fiery Pepperbox.

f.volatile_catalyzer = El quitar los dispositivos de seguridad de una pieza de tecnolog\u00eda \
  Gremlin es una buena manera de perder una extremidad. En este caso, es muy probable que no \
  sea una de las tuyas. Las balas del Catalyzer envuelven al enemigo en un campo de energ\u00eda que explota despu\u00e9s de recibir da\u00f1o.

f.virulent_catalyzer = El incorporar tecnolog\u00eda Spiral le ha dado a esta terrible pistola \
  una poderosamente venenosa carga explosiva. Las balas del Catalyzer envuelven al enemigo en \
  un campo de energ\u00eda que explota despu\u00e9s de recibir da\u00f1o.

f.volcanic_pepperbox = Cuando est\u00e9s acampando en territorio peligroso, el Volcanic \
  Pepperbox es perfecto para rostizar tanto a los bombones como a los enemigos.

f.volt_driver = Un arma de alta tecnolog\u00eda que dispara poderosas balas volt que se rompen \
  innumerables veces en el impacto.

f.voltech_alchemer = Una pistola alqu\u00edmica que dispara balas con alta carga de iones que \
  se parten al impactar.

f.voltech_alchemer_mkii = Alchemer mejorada que dispara balas de electricidad a gran velocidad.

f.wildfire = Una pistola \u00e9lite que puede ofrecer una tremenda sorpresa al enemigo en el \
  campo de batalla, ya que sus peque\u00f1as cargas de energ\u00eda se transforman en fuegos \
  rugientes.

f.winter_grave = Un ca\u00f1\u00f3n de mano tremendamente poderoso cuyo apodo no deber\u00eda \
  sorprender a nadie que lo est\u00e9 viendo desde el lado incorrecto. Un ataque cargado puede \
  arrasar con m\u00faltiples enemigos.

f.zapper = Pistola Proto Gun modificada, aumentada con una carga el\u00e9ctrica de baja \
  intensidad.

f.stoic_buster = Una pistola transmutada del caparaz\u00f3n de un tortodrone. Al empu\u00f1\
  arla, sientes el callado paso del viento y puedes llamar a la estruendosa tormenta que le \
  sigue.

f.mighty_cannon = Una pistola transmutada del caparaz\u00f3n de un tortodrone. Al empu\u00f1arla, sientes la energ\u00eda inestable que est\u00e1 \
  dentro en espera de ser liberada.

f.grand_tortofist = Una pistola transmutada por la ilimitada furia de un tortodrone. Al empu\u00f1arla, sientes la energ\u00eda inestable que est\u00e1 \
  dentro en espera de ser liberada.

f.primal_buster = Una pistola transmutada del caparaz\u00f3n de un tortodrone. Al empu\u00f1\
  arla, puedes percibir la energ\u00eda natural dentro de ella en espera de ser liberada.

f.barrier_cannon = Una pistola transmutada del caparaz\u00f3n de un tortodrone. La ofensiva \
  elemental de un tortodrone en la Gran Migraci\u00f3n deber\u00e1 ayudarte en tus propias \
  expediciones.

f.omega_tortofist = Una pistola fortalecida por la ilimitada furia de un tortodrone. Al empu\u00f1\
  arla, eres capaz de desatar la energ\u00eda de una legi\u00f3n de tortodrones contra tus \
  enemisgos.

f.wild_buster = Una pistola transmutada del caparaz\u00f3n endurecido de un tortodrone. Al empu\u00f1\
  arla, puedes sentir la feroz energ\u00eda dentro en espera de ser liberada.

f.feral_cannon = Una pistola transmutada del caparaz\u00f3n endurecido de un tortodrone. Al \
  empu\u00f1arla, puedes sentir la penetrante energ\u00eda dentro en espera de ser liberada.

f.savage_tortofist = Una pistola transmutada del caparaz\u00f3n endurecido de un tortodrone. Al \
  empu\u00f1arla, puedes sentir dentro la energ\u00eda primordial de una devastadora manada de \
  wolvers en espera de ser liberada.

f.grim_buster = Una pistola transmutada del caparaz\u00f3n de un corrupto tortodrone. Las \
  sombras parecen filtrarse del ca\u00f1\u00f3n cada vez que se empu\u00f1a.

f.nether_cannon = Una pistola transmutada del caparaz\u00f3n de un corrupto tortodrone. Se \
  puede escuchar en el viento un aullido de furia cuando se desata contra tus enemigos.

f.gorgofist = Una aterrorizante pistola que combina el poder dual demoledor de un gorgo y el m\u00ed\
  tico tortomega. Aplastar a los enemigos nunca ha sido tan endemoniadamente divertido.

f.pollinator = Una rara pistola avanzada producida por biot\u00e9cnicos con tecnolog\u00eda \
  Gremlin que ha sido capturada. Dispara part\u00edculas de polen que se adhieren al enemigo, \
  causando da\u00f1o explosivo y tambi\u00e9n alergias.

f.owlite_wand = Se dice que la varita escoge al mago, as\u00ed que no dejes que esta vea a tus \
  amigos lindos.

f.fiery_diskgun = Una pistola accionada por un motor infernal que lanza discos fundidos en r\u00e1pida sucesi\u00f3n. Los disparos de ca\u00f1\
  ones de disco vuelven una vez que alcanzan su apogeo.

f.static_diskgun = Una pistola impactantemente poderosa que crea una tormenta de discos \
  electrificados. Los disparos de ca\u00f1ones de disco vuelven una vez que alcanzan su apogeo.


f.wanderers_wand = Muy buena para agitar.

f.slicer = Entran pinchos de energ\u00eda. \u00a1Y salen discos afilados de una energ\u00eda\ \
  primigenia apenas entendida a toda velocidad!  Ojo con ese efecto boomerang tan animado...

f.twicer_slicer = El segundo prototipo del Slicer.  Dicen que un poco de conocimiento es peligroso, \
  as\u00ed que ese es el conocimiento exacto que tenemos de los pinchos misteriosos que estamos cortando y \
  disparando.

f.thricer_slicer = Eventualmente los cient\u00edficos averiguar\u00e1n que son esos pinchos de energ\u00eda. \
  \u00a1Mientras tanto, podemos cortarlos y lanzarlos el doble de r\u00e1pido, con mas giros orbitales misteriosos!

f.mandolin = Un lanzadiscos doble sobrecargado de alta capacidad capaz de triturar pinchos.  Una energ\u00eda \
  experimental de pinchos parece atraerse a s\u00ed misma... \u00a1y llevada de vuelta al lanzador con potencia extra!



# Weapon Sword names
#...................................................................................................

f.acheron = Golpeando con el salvaje poder del Inframundo, se ha sabido que esta oscura arma ha \
  llevado a caballeros de mente d\u00e9bil al borde de la locura.

f.advanced_cautery_sword = Una espada Cautery con una funci\u00f3n adicional de sierra adaptada \
  para cortar por las huesudas columnas de colobias de Lichen grandes.

f.amputator = La culminaci\u00f3n de investigaciones a la familia de los slimes, las calientes \
  cuchillas de movimiento alternativo cortan a los slimes con precisi\u00f3n quir\u00fargica y \
  evitan que sus gelatinosos cuerpos se vuelvan a formar.

f.arc_razor = Una espada mec\u00e1nica de elegante manufactura que dispara rayos de energ\u00ed\
  a cortantes con cada tajo.

f.ascended_calibur = Forjadas con una singular aleaci\u00f3n de plata del sol, los caballeros \
  con suficiente talento como para llevar Caliburs tan elegantes como esta suelen crear un v\u00ed\
  nculo con ellas y darles un nombre.

f.avenger = Una espada creada en otro tiempo para armar a los caballeros que luchaban contra \
  las legiones de Underworld.

f.barbarous_thorn_blade = Una m\u00edtica espada que arremete con la furia del mism\u00edsimo \
  Snarbolax. Aquellos que la empu\u00f1an dicen que pueden sentir sobre ellos la feroz mirada \
  de la bestia cada vez que cierran los ojos.

f.beast_basher = Un potente pico modificado para a\u00f1adir un extra de da\u00f1o a la hora de \
  acabar con los monstruos.

f.big_beast_basher = Se rumorea que este pico de miner\u00eda brutalmente afilado se usaba para \
  cazar bestias y minerales. Los Mecanismos cambiaron para siempre.

f.blazebrand = Una cuchilla de alta tecnolog\u00eda que combina tecnolog\u00eda Spiral y de los \
  Mecanismos. Puede producir una explosi\u00f3n de alta temperatura concentrada que resulta \
  inofensiva para los caballeros.

f.blizzbrand = Una cuchilla de alta tecnolog\u00eda que combina tecnolog\u00eda Spiral y de los \
  Mecanismos. Puede producir una explosi\u00f3n de baja temperatura concentrada que resulta \
  inofensiva para los caballeros.

f.boltbrand = Una espada de alta tecnolog\u00eda que fusiona la tecnolog\u00eda Spiral con la \
  de los Mecanismos. Puede producir una poderosa descarga el\u00e9ctrica que es inofensiva para \
  los caballeros.

f.bolted_blade = Proto Sword mejorada y reforzada con tornillos de bronce obtenidos de los \
  Mecanismos.

f.brandish = Fiable hoja cuya falta de ornamentaci\u00f3n no deja traslucir su fuerza.

f.calibur = Espada est\u00e1ndar que se entrega a los caballeros Spiral Knights que han \
  mostrado su val\u00eda sobre el terreno.

f.cautery_sword = Esta espada ha sido adaptada a partir de una herramienta m\u00e9dica y su \
  hoja a alta temperatura reduce el da\u00f1o de los tejidos. Es formidable a la hora de acabar \
  con los monstruos de la familia de los Slime.

f.cold_iron_carver = Espada encantada forjada con hierro fr\u00edo cuya hoja acaba con las \
  criaturas de la noche.

f.cold_iron_vanquisher = Poderosa hoja de hierro fr\u00edo forjada con el singular prop\u00f3\
  sito de dar caza y eliminar a los muertos vivientes.

f.combuster = Combinando los principios de los motores de El Alondra con la tecnolog\u00eda que \
  da poder al Blast Furnace se ha producido esta brutal cuchilla, que puede perderle fuego a \
  distancia aun a los materiales m\u00e1s resistentes al fuego.

f.cutter = Espada de bandido que cuenta con una fila de afilados dientes.

f.daring_rigadoon = Un salvaje pincho que enlentecer\u00e1 aun a los m\u00e1s saludables \
  enemigos hasta hacerlos arrastrarse.

f.dark_thorn_blade = Una espada salvaje cuya fuerza ha sido fortalecida con una ofrenda de \
  almas para la bestia que lleva dentro.

f.deadly_candy_poker = Un dolor de muelas ser\u00e1 la menor de sus preocupaciones cuando est\u00e9\
  s armado con este regalo perforante.

f.divine_avenger = Una Avenger mejorada que ha sido forjada con el m\u00e1s puro de los aceros \
  solares. Son pocos los enemigos de este mundo que merecen caer ante el poder de esta hoja, y \
  menos los h\u00e9roes que merecen empu\u00f1arla.

f.dread_venom_striker = Un arma de asesino cuya hoja provoca profundas heridas que sangran con \
  virulencia. Ser\u00eda buena idea mantenerla alejada de tu comida.

f.fang_of_vog = Se dice que esta espada fue creada con el colmillo de una bestia de fuego, Vog.

f.faust = Poderosa espada maldita forjada en Underworld. Sus potentes ataques a veces pueden \
  llegar a maldecir a quien la empu\u00f1a.

f.fearless_rigadoon = Lo \u00faltimo en perforadores paralizantes, no est\u00e1 claro si es su \
  elegancia o su terrible piquete lo que deja a los oponentes estupefactos.

f.fierce_flamberge = Un sable abrasador el cual su principal prop\u00f3sito es rostizar a tus \
  enemigos.

f.final_flourish = El armamento premier del espadach\u00edn serio, puede contraatacar tan f\u00e1\
  cilmente como puede despedazar enemigos.

f.fireburst_brandish = Una Brandish mejorada imbuida con la esencia elemental del fuego.

f.flamberge = Un llameante florete que quema mientras atraviesa.

f.flourish = Un sable estilizado que ha sido designado para frustrar a tus enemigos.

f.furious_flamberge = Los grandes espadachines pueden escribir su nombre en sus oponentes. Los \
  legendarios lo marcan ah\u00ed.

f.frost_sword = Esta espada es tan fr\u00eda como el hielo y est\u00e1 dispuesta a sacrificar \
  tu amor, adem\u00e1s de a todos los monstruos que se te pongan por delante.

f.glacius = Combinando teor\u00edas avanzadas de criogenia con la tecnolog\u00eda que da poder a la C\u00e1mara de Congelaci\u00f3\
  n se ha producido este moderno armamento, el cual es capaz de congelar instant\u00e1neamente \
  aun al enemigo m\u00e1s formidable.

f.gram = Espada extremadamente pesada cuyo peso ralentizar\u00e1 los movimientos de los \
  caballeros m\u00e1s r\u00e1pidos. Dicho esto, piensa en lo que har\u00e1 a quienes se pongan \
  en medio...

f.gran_faust = Una Faust mejorada forjada con Shadow Steel de magn\u00edfica calidad. Sus \
  ataques son tan poderosos que afectan a quien la empu\u00f1a, pero eso no ha detenido a los \
  Devilities, quienes se afanan por hacerse con estas hojas incluso en sus escasos ratos \
  libres.

f.grand_flourish = Una elaborada cuchilla para aquellos que prefieren resolver sus problemas \
  con un salto, un brinco y un estoque.

f.grintovec = Tus enemigos seguramente disfrutar\u00e1n la refrescante sensaci\u00f3n de ser \
  golpeados por un glaciar.

f.hatchet = Pesada hoja usada para arrancar enredaderas y ramas en los agrestes alrededores del \
  Campamento de Rescate.

f.heavy_hatchet = Pesada hoja creada para la tala de \u00e1rboles. No es de extra\u00f1ar que tambi\u00e9\
  n sirva para derribar enemigos, bloques, dep\u00f3sitos de mineral y todo lo que se te ponga \
  por delante.

f.hot_edge = Una Proto Sword modificada capaz de generar temperaturas tan altas como para \
  abrasar material org\u00e1nico.

f.hunting_blade = Filo dentado empleado para rematar a las presas grandes. Corta la piel de las \
  bestias como si fueran de mantequilla.

f.iceburst_brandish = Una Brandish mejorada imbuida con la esencia elemental del hielo.

f.ideal_sword = \u00a1T\u00edo, esta espada est\u00e1 genial!

f.jalovec = Una friolenta espada para los caballeros que encuentran refrescante infligir una \
  avalancha de dolor en sus enemigos.

f.kamarin = Una espada de tecnolog\u00eda inferior menos eficaz al cortar que al golpear a tus \
  enemigos seg\u00fan los ves llegar.

f.khorovod = Una espada de tecnolog\u00eda inferior, pero de buena manufactura. Sus brutales \
  golpes pueden dejar aturdidos a los enemigos desprevenidos. Si la empu\u00f1as, te parecer\u00e1 que est\u00e1s bailando.

f.leviathan_blade = Un excepcional tesoro de la Spiral Order de cuyos golpes se dice que caen \
  sobre sus enemigos como si de un maremoto se tratara.

f.nightblade = Un cortador corto  que ha sido imbuido con la esencia del averno.

f.obsidian_edge = Una mortal espada hecha de obeliscos de obsidiana que se encuentran en el \
  reino de los Apocrea. Simplemente al sostenerla de alguna manera te hace sentir culpable de \
  un crimen desconocido.

f.peppermint_repeater = Este ca\u00f1\u00f3n de mano de temporada es la pieza adecuada para \
  acribillar a tus oponentes con plomo caliente de la alegr\u00eda de las fiestas.

f.proto_blade = Una r\u00e1pida y compacta hoja utilitaria distribuida a todos los reclutas de \
  los Caballeros Spiral.

f.proto_sword = Una peque\u00f1a espada que se otorga a todos los reclutas Spiral Knights.

f.red_saber = Un sable del color del quemante sol que se entrega a los caballeros que han \
  mostrado valent\u00eda ejemplar en acciones pasadas.

f.rigadoon = Un impresionante sable que dejar\u00e1 a tu oponente sin guardia.

f.robo_wrecker = Una herramienta tipo tenaza que se cree que es de dise\u00f1o gremlin.  Aunque \
  sus or\u00edgenes son misteriosos, su habilidad para destruir constructs est\u00e1 muy bien documentada.

f.rugged_robo_wrecker = Una robo wrecker mejorada que ha ayudado a muchos constructs a \
  convertirse en en humeantes montones de metal.

f.sealed_sword = Misteriosa espada de enorme poder a\u00fan por revelar. Bulle de energ\u00eda en estado puro.

f.searing_edge = Una igera hoja que hace arder en llamas a sus enemigos al tiempo que lanza \
  tajos. La tecnolog\u00eda que impide que la empu\u00f1adura arda tambi\u00e9n es m\u00e1s \
  avanzada que la espada en s\u00ed.

f.shockburst_brandish = Una Brandish mejorada imbuida de la esencia elemental del rel\u00e1mpago.

f.shocking_edge = Una ligera espada capaz de provocar dolorosas descargas el\u00e9ctricas en sus v\u00edctimas. A los j\u00f3\
  venes caballeros les gusta llevarlas en vacaciones.

f.silent_nightblade = Elaborado con algunos de los materiales m\u00e1s endemoniados encontrados \
  en Cradle, esta entintada cuchilla puede explotar con furia diab\u00f3lica.

f.slime_slasher = Una maciza pala modificada para infligir mayores da\u00f1os a los monstruos \
  de la familia de los Slime.

f.snarble_barb = Una espada bestial que puede disparar espinas viscovivas a aquellos que se \
  enfrenten a quien la empu\u00f1a.

f.spur = Una espada mecanizada con un motor a\u00f1adido que genera golpes de energ\u00eda.

f.static_edge = Una Proto Sword modificada capaz de generar descargas el\u00e9ctricas de baja \
  intensidad.

f.striker = R\u00e1pida espada muy valorada por las ramas m\u00e1s sigilosas de la Spiral \
  Order.

f.sudaruska = Una tosca arma para el caballero que est\u00e1 m\u00e1s que dispuesto a \
  intercambiar garbo y salero por una descabellada cantidad de lesiones con elemento \
  contundente.

f.super_slime_slasher = Esta pala cuenta con un siniestro filo que resulta de lo m\u00e1s \
  adecuado para acabar con los Slime en las trincheras.

f.sweet_dreams = No te dejes enga\u00f1ar por esta arma de esponjoso exterior. Pega m\u00e1s \
  duro de lo que parece. El arma perfecta para pelear contra cosas que pegan en la noche.

f.swift_flourish = Un Flourish mejorado para caballeros que se empe\u00f1an en despachar \
  enemigos con un poco de estilo.

f.tempered_calibur = Una Calibur forjada dos veces y templada con las t\u00e9cnicas m\u00e1s avanzadas que est\u00e1\
  n disponibles en las herrer\u00edas de la Spiral Order.

f.the_ban_stick = Os aniquilamos con tremebunda furia.

f.thwack_hammer = Herramienta especialmente \u00fatil para acabar con los enemigos mecanizados.

f.triglav = No se han contado historias acerca de esta todopoderosa espada, pero eso es solo \
  porque las personas raramente est\u00e1n de humor para hablar despu\u00e9s de haber sido \
  aplastados por una monta\u00f1a.

f.troika = Espada de tecnolog\u00eda inferior que compensa su falta de energ\u00eda interna con \
  su peso y tama\u00f1o. Quien la empu\u00f1e ser\u00e1 capaz de repartir poderos\u00edsimos golpes.

f.twisted_snarble_barb = Una Snarble Barb retorcida que ha sido mejorada para golpear como una \
  "vorpalina espada crica y tripa".

f.vile_striker = Este sable contiene una buena cantidad de veneno. \u00a1Su filo dentado no \
  debe usarse para cortar el pan!

f.voltedge = La combinaci\u00f3n de tecnolog\u00eda Spiral con muestras recuperadas de F\u00e1\
  brica de Municiones Ironclaw han producido esta espada, que puede producir una peligrosa \
  descarga de 1.21 gigavatios.

f.wild_hunting_blade = Un arma legendaria que incluso los Wolver y los Chromalisk m\u00e1s \
  poderosos sienten pavor al o\u00edr su nombre.

f.winmillion = Una espada ornamentada que proyecta golpes de energ\u00eda con cada mandoble. \
  Aquellos que la han usado por primera vez han recibido golpes por falta de experiencia.

f.turbillion = Una ostentosa espada mecanizada cuya turbina cruje con el poder de un millar de \
  tormentas.

f.wrench_wand = Esta pesada herramienta es muy valorada por los Gremlins. Es de lo m\u00e1s \u00fa\
  til a la hora de aplastar cr\u00e1neos.


# Weapon Sword names (special)
#...................................................................................................

f.scissor_blades = Una espada Leviathan Blade hecha a la medida, dise\u00f1ada por Bechamel, el \
  Complementador. Aunque generalmente estas hojas se suelen utilizar para la elaboraci\u00f3n de atav\u00ed\
  os elegantes para armaduras, se dice que son lo suficientemente poderosas para romper a trav\u00e9s de roca s\u00f3lida.

f.rocket_hammer_1 = Dise\u00f1ada por el mism\u00edsimo Warmaster Seerus, esta nefasta arma \
  gremlin est\u00e1 equipada con un motor de cohete que puede lanzar al portador hacia adelante \
  con un poderoso martillazo. Este modelo en particular es el prototipo.

f.rocket_hammer_2 = Dise\u00f1ada por el mism\u00edsimo Warmaster Seerus, esta nefasta arma \
  gremlin est\u00e1 equipada con un motor de cohete que puede lanzar al portador hacia adelante \
  con un poderoso martillazo. Este modelo en particular es una versi\u00f3n m\u00e1s estable \
  que hizo explotar a los sujetos de prueba gremlin muchas menos veces que el prototipo.

f.rocket_hammer_3 = Dise\u00f1ada por el mism\u00edsimo Warmaster Seerus, esta nefasta arma \
  gremlin est\u00e1 equipada con un motor de cohete que puede lanzar al portador hacia adelante \
  con un poderoso martillazo. Este modelo final, perfeccionado, es digno del Gran Arsenal del \
  gran Warmaster Seerus.

f.honor_blade_1 = Una espada ceremonial otorgada a los Reclutas Spiral. Aunque su prop\u00f3\
  sito es servir para las ocasiones m\u00e1s formales, su fina hoja la hace adecuada para el \
  combate.

f.honor_blade_2 = Una espada ceremonial otorgada a los Caballeros Spiral con experiencia. \
  Aunque su prop\u00f3sito es servir para las ocasiones m\u00e1s formales, su fina hoja la hace \
  adecuada para el combate.

f.honor_blade_3 = Una espada ceremonial otorgada a los Campeones de la Orden Spiral. Aunque su \
  prop\u00f3sito es servir para las ocasiones m\u00e1s formales, su fina hoja la hace adecuada \
  para el combate.

f.honor_blade_4 = Una espada ceremonial otorgada a los Vanguardias de la Orden Spiral. Aunque \
  su prop\u00f3sito es servir para las ocasiones m\u00e1s formales, su fina hoja la hace \
  adecuada para el combate.

f.mighty_great_cleaver = Una Sudaruska hecha a la medida, dise\u00f1ada por Biscotti, el chef \
  en jefe del Alondra. Aunque ella asegura que se usa solamente para cocinar, no podemos evitar \
  pensar que m\u00e1s de alg\u00fan monstruo se la ha encontrado en la tabla de picar tambi\u00e9n.

f.frozen_great_cleaver = Un Triglav hecho a la medida, dise\u00f1ado por Biscotti, el chef en \
  jefe del Alondra. Aunque ella asegura que se usa solamente para cocinar, no podemos evitar \
  pensar que m\u00e1s de alg\u00fan monstruo se la ha encontrado en la tabla de picar tambi\u00e9n.

f.furious_fork = Un buen chef sabe cuando darle vuela a las hamburguesas. Un excelente chef \
  cocina sus hamburguesas mientras les da vuelta.

f.nodeslime_sword = Esta callosa cincelada constrictora cae como cascada col\u00e9rica sobre \
  los extenuados enemigos.

f.celestial_saber = Un sable especial del que se dice que se parece a las astronaves Isoranas \
  de anta\u00f1o cuando surcaban el cielo nocturno. Al equipar esto, tus enemigos seguramente \
  ver\u00e1n estrellas.

f.caladbolg = Un formidable mandoble de leyenda, sus golpes cortan el campo de batalla como el \
  arcoiris cruza el cielo.

f.raiders_axe = Una ornamentada y feroz hacha, favorecida por los saqueadores por su \
  versatilidad.

f.raiders_hammer = Un ornamentado martillo imbuido con el poder de una gran tormenta, es tan \
  innovador como cualquier arma roma podr\u00eda ser.

f.raiders_sword = Una espada r\u00fanica que reduce a tu enemigo a cortes fr\u00edos.

f.dread_captain_cutlass = Un cortador hecho a la medida que se mantuvo afilado a pesar de \
  descuidados na\u00fafragos.

f.ice_axe = Una herramienta de trepar t\u00e9cnica que puede desmembrar a los monstruos con \
  gran precisi\u00f3n.

f.alpha_claw_gauntlet = Un guantelete protector de piel de wolver adornado con afilad\u00edsimas garras.

f.scythe = Una vieja herramienta de granjeros, retirada por la temporada, cuyo filo es \
  excelente para segar a tus enemigos.


