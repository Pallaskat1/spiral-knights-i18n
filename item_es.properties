f.shock_raider_tunic = Este abrigo de saqueador est\u00e1 forrado con piel antiest\u00e1tica.

f.freeze_raider_tunic = Ataca r\u00e1pido y ataca abrigado con este peludo abrigo.

f.captain_coat = Un gab\u00e1n listo para navegantes que es excelente para los espadachines de \
  la era espacial.

f.down_puffer = Una suave y esponjosa chaqueta. Su aislamiento t\u00e9rmico de primera lo \
