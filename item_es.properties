  rango. Despu\u00e9s de desbandarse, Desna uni\u00f3 a los miembros sobrevivientes con otros \
  escuadrones para formar los Soldados Recon.

f.gold_wolf_hood = Yelmo portado alguna vez por un miembro de los 'Lobos Dorados', un escuadr\u00f3\
  n de feroces caballeros especializados en la eliminaci\u00f3n de objetivos Morai de alto \
