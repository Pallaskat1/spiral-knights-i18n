# Gear Armor names
#...................................................................................................

f.ancient_plate_mail = Dicen que esta armadura ha sido usada anteriormente por titanes. Aunque \
  ofrece una protecci\u00f3n incre\u00edble, su elevado peso la hace algo dif\u00edcil de llevar.

f.angelic_raiment = Esta armadura tan bonita brilla como si la iluminase el sol.

f.almirian_crusader_armor = Armadura que alguna vez fue usada por la guardia real del reino de \
  Almire. Su color marfil era un s\u00edmbolo de la pureza de Almire, tanto en tierra como en \
  los corazones de su gente.

f.arcane_salamander_suit = Un Salamander Suit imbuido con poderes m\u00e1gicos. Se piensa que \
  fue creado de los familiares de brujas poderosas.

f.armor_fallen = Armadura maldita que una vez llev\u00f3 un ser celestial expulsado del para\u00edso.

f.ash_tail_coat = Este abrigo de camuflaje de fina factura se calienta solo y protege al \
  portador de los ataques de hielo. Su secreto est\u00e1 en esa pizca de Blaze Pepper que \
  lleva.

f.azure_guardian_armor = Los l\u00edderes de la Spiral Order suelen portar esta magn\u00edfica \
  armadura. Es ajustada como el cuero de una bestia, pero tan c\u00f3moda como un fluido \
  Miracloth.

f.blazebreak_armor = Fiable armadura que permite esquivar la ret\u00f3rica m\u00e1s fogosa. Tambi\u00e9\
  n viene bien para los ataques de fuego.

f.black_kat_cloak = Una capa toscamente dise\u00f1ada que se parece a los sombr\u00edos \
  zapadores de la desafortunada Tribu Kat.

f.black_kat_mail = Una impresionante cota de malla imbuida con el poder de los\n\
  Kat Nappers, los especialistas en trabajos encubiertos de la Tribu Kat.

f.black_kat_raiment = Un atuendo recuperado que esta rebosando con energ\u00eda oscura. Se dice \
  que le da un parecido al gran h\u00e9roe de la Tribu Kat, Margrel, quien abri\u00f3 el Libro \
  de Plumas Grises y causo el Kataclismo. Trae grandes desgracias a quien se atreva a vestirlo.

f.blizzbreaker_armor = Fiable armadura que permite evitar las actitudes m\u00e1s fr\u00edas. Tambi\u00e9\
  n viene bien para los ataques de hielo.

f.bombastic_demo_suit = Esta armadura se ha forjado espec\u00edficamente para los caballeros m\u00e1\
  s selectos que saben usar los explosivos con garbo y salero... sin que les exploten en las \
  manos.

f.boosted_plate_mail = Cota de malla de placas Spiral con una fuente de energ\u00eda interna \
  muy cargada. La mejora no aligera el peso de la armadura.

f.brute_jelly_mail = Firme cota de malla hecha con los restos de gelatinosos especialmente \
  hostiles.

f.chaos_cloak = Manto prohibido del que se dice que ofrece protecci\u00f3n a quien lo lleva en \
  el reino sin nombre, donde los elementos convergen en uno, para luego dividirse.

f.charged_quicksilver_mail = Un set de Quicksilver Mail mejorado que te energizar\u00e1 para la batalla.

f.chroma_suit = Traje confeccionado con la piel de un chromalisk. Por raro que pueda parecer, a \
  los chromalisk les resultan halagadores estos trajes.

f.circuit_breaker_armor = Armadura con un n\u00facleo elemental pirateado dise\u00f1ado para \
  resistir las descargas. Sin embargo, esta modificaci\u00f3n produce otras debilidades \
  elementales.

f.cobalt_armor = Armadura de alto rendimiento de la Spiral Order adecuada para cualquier \
  aventura.

f.deadly_virulisk_suit = Un elegante traje hecho con la piel del m\u00e1s letal de los \
  Virulisk. Por desgracia, no parece haber conservado sus habilidades de camuflaje.

f.deadshot_mantle = Un poncho para los rostros p\u00e1lidos con la vista puesta en acabar con \
  los moradores feos, malos y no muertos de la oscuridad.

f.deep_sea_cuirass = Armadura con escamas iridiscentes que parecen moverse como relucientes \
  olas. Es bastante inc\u00f3moda de llevar, dado que est\u00e1 fr\u00eda y mojada a todas \
  horas.

f.divine_mantle = Una capa celestial que se cre\u00f3 para ser llevada por sabios celestiales.

f.dragon_scale_mail = Armadura m\u00edtica creada con las escamas de una criatura de leyenda.

f.drake_scale_mail = Armadura forjada con las escamas de las bestias que seg\u00fan se dice, \
  descienden de los dragones.

f.dread_skelly_suit = El Skelly Suit m\u00e1s pavoroso que existe. No hay nada c\u00f3mico en \
  estos terribles trapos.

f.dusker_coat = Un c\u00e1lido abrigo de aventurero que te permitir\u00e1 golpear con la \
  ferocidad de un Alpha Dusker.

f.elemental_cloak = Un atuendo elegante con numerosas formas de protecci\u00f3n elemental en el \
  propio tejido.

f.emberbreak_armor = Armadura con un n\u00facleo elemental pirateado dise\u00f1ado para \
  resistir el fuego. Sin embargo, esta modificaci\u00f3n produce otras debilidades elementales.

f.fencing_jacket = Traje holgado muy valorado por los esgrimistas novatos.

f.firebreak_armor = Armadura cortafuegos mejorada y pirateada para resistir el fuego.

f.frostbreaker_armor = Armadura con un n\u00facleo elemental pirateado dise\u00f1ado para \
  resistir el hielo. Sin embargo, esta modificaci\u00f3n produce otras debilidades elementales.

f.fused_demo_suit = Demo Suit mejorado y fundido peligrosamente con el inestable n\u00facleo de \
  un poderoso cubo explosivo. Aun as\u00ed, te sentir\u00e1s mucho mejor llev\u00e1ndolo.

f.grey_feather_mantle = Este h\u00e1bito emplumado de los famosos estudiosos owlite est\u00e1 imbuido con la sabidur\u00eda de los a\u00f1os... \u00a1y es muy suave!

f.groundbreaker_armor = Una armadura utilizada por caballeros que estuvieron entre los primeros \
  en aventurarse a las profundidades de los Mecanismos.

f.gunslinger_sash = Accesorio que llevaban los guerreros de \u00e9pocas pasadas. Huele a cuero, \
  humo y acci\u00f3n.

f.heavenly_iron_armor = Una poderosa armadura de la que se dice que ha sido creada de escudos \
  angelicales. Retiene muchas propiedades divinas que los seres celestiales poseen pero no \
  tiene su debilidad al fuego.

f.heavy_demo_suit = Armadura reforzada para los expertos en explosivos.

f.heavy_plate_mail = Gruesa armadura reforzada con m\u00e1s placas de metal que una m\u00e1\
  quina expendedora de los Mecanismos. Es algo inc\u00f3moda.

f.icebreaker_armor = Frostbreaker Armor mejorada y pirateada para resistir el hielo.

