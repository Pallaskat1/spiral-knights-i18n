f.nodeslime_shield = Este tambaleante muro erosionado puede resistir una paliza cuando es \
  esgrimido por guerreros de inquebrantable voluntad.

f.power_mitt = Algo que no debe faltar en la cocina. El ajuste perfecto y la poderosa \
  superficie plateada son excelentes para manejar altas temperaturas. \u00a1Ahora cocinas \
