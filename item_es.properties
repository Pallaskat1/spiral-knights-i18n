f.emberbreak_shield = Un Proto Shield modificado para ofrecer protecci\u00f3n frente al fuego.

f.feral_shell = Un escudo transmutado del caparaz\u00f3n endurecido de un tortodrone. A\u00fan las m\u00e1\
