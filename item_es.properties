f.raider_buckler = Un escudo ligero de madera que bloquea ataques b\u00e1sicos y permite un \
  contraataque r\u00e1pido.

f.ship_wheel = \u00bfC\u00f3mo es posible que esto sea un buen escudo? \u00bfDe d\u00f3nde sali\u00f3\
  ? Ten cuidado amigo, haz esas preguntas y te pueden hacer caminar la plancha.

f.airbraker_shield = Un escudo ligero, compacto y activado neum\u00e1ticamente que expande su \u00e1\
  rea de superficie contra los ataques enemigos.

f.illuminating_ward = Una vela personal para mantener a raya a la oscuridad y aquello que \
  acecha en ella.


f.spell_book = Un diccionario viejo que parece tener algunos hechizos.


f.obsidian_obstacle = Un escudo siniestro de fragmentos de obsidiana unidos por el ritual de Apocrea. \
                      Cada vez que se alinean los fragmentos, resuenan recuerdos oscuros en tu mente.

