f.token_core = Fragmento de un extra\u00f1o material encontrado en The Core, en los Mecanismos. \
  Cada fragmento parece tener una composici\u00f3n \u00fanica, como los copos de nieve. Estos \
  fragmentos son muy valorados por el Cuartel General Spiral, que aspira a comprender la \
  naturaleza del Core a trav\u00e9s de su estudio.

f.token_vanaduke = Un sello del reino perdido de Almire, prueba de que su portador se enfrent\u00f3 \
  al abismo ardiente conocido como la Ciudadela de Fuego.

f.token_jelly = Solo la realeza de los gelatinosos las llevaba, pero ahora estas gemas son la \
  moneda oficial de sus reinos. Aunque son muy apreciadas por los Slime, la mayor parte de las \
  criaturas se las comen, ya que est\u00e1n deliciosas.

f.token_snarbolax = Un largo y afilado diente arrancado de la boca de un Snarbolax;  un \
  recuerdo que representa el triunfo de un caballero sobre el monstruoso acechador del Bosque \
  en Crep\u00fasculo.

f.token_roarmulus = Una palanca de mandos especial desarrollada por ingenieros Gremlin que \
  sirve para aumentar tanto el ladrido como la mordida de los Gemelos Roarmulus.

f.token_primal = Una peque\u00f1a voluta del esp\u00edritu esencial de la naturaleza. Es \
  extremadamente valioso para el Spiral Order. Ll\u00e9vala con el comerciante de sellos en el \
  Bazar de Haven.

f.token_forge = Una peque\u00f1a voluta del esp\u00edritu esencial de la tecnolog\u00eda y el \
  progreso. Es extremadamente valioso para el Spiral Order. Ll\u00e9vala con el comerciante de \
  sellos en el Bazar de Haven.

f.token_grim = Una peque\u00f1a voluta del esencial esp\u00edritu de oscuridad y decadencia. Es \
  extremadamente valioso para el Spiral Order. Ll\u00e9vala con el comerciante de sellos en el \
  Bazar de Haven.

f.token_krogmo = Una moneda otorgada por el gran King Krogmo a los participantes en su Coliseo. \
  Se puede intercambiar por premios con el Supervisor de Premios del Coliseo.

f.token_candy = Un pedazo de caramelo hecho para celebrar el Festival de la Cosecha Oscura. Se \
  puede cambiar en la Plaza de Haven por diferentes m\u00e1scaras de disfraces.

f.token_cake = Una rebanada de pastel que sirve como trofeo de victoria sobre una horda de \
  Creep Cakes. La Chef en Jefe Biscotti afirma que ambos de estos trofeos y el incidente que \
  los cre\u00f3 nunca sucedieron oficialmente.

f.token_winter = Una peque\u00f1a lista creada por uno de los ni\u00f1os de Emberlight. \
  Significa que has hecho sus deseos realidad y que has salvado el Festival de Invierno. \u00bfNo te llena eso de alegr\u00eda?

f.token_winter_wishlist = La lista de deseos del Festival de Invierno se perdi\u00f3 hace mucho \
  tiempo. En la lista se encuentra abrigada ropa blanca que protege de la nieve. Randolph \
  recompensar\u00e1 a esos caballeros con un buen mont\u00f3n, as\u00ed que ll\u00e9vaselos \
  para que obtengas un presente.

f.token_page = Una desmoronada p\u00e1gina arrancada de un grimorio ya olvidado en los archivos \
  de Moorcroft Manor. El indescifrable lenguaje escrito en ella brilla d\u00e9bilmente en la \
  oscuridad como si tuviera poder en sus propias palabras.

f.token_spirit = Una marca de otro mundo que se ha puesto a un alma reclamada por la misteriosa \
  Apocrea. Al quitarla, permite que el alma capturada escape su prisi\u00f3n en el terrible \
  reino de Apocrea.

