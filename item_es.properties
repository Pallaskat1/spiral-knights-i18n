f.fowl_cloak = Un simple manto emplumado. Ad\u00f3rnate en plumaje y prep\u00e1rate para el a\u00f1o nuevo.
f.fowl_cloak_vol = Un quemante manto emplumado. Pon fuego bajo tus pies y asegura tu \
