# Inventory Mineral names
#...................................................................................................

f.crimsonite = Un legendario mineral de un vibrante color rojo del que se dice que contiene la \
  pasi\u00f3n, rabia y fuerza de la vida que lo rodea.

f.dark_matter = Un legendario mineral de ominoso color oscuro del que se dice que posee la \
  esencia del caos y de la nada.

f.luminite = Un legendario mineral de un radiante color dorado del que se dice que contiene la \
  fe, sabidur\u00eda y fervor de la vida que lo rodea.

f.moonstone = Un legendario mineral de brillante color azul, del que se dice que contiene los \
  or\u00edgenes y el conocimiento de todos los mundos.

f.valestone = Un legendario mineral de un vibrante color verde, del que se dice que contiene la \
  esencia de toda la vida natural.

