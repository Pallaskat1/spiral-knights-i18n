f.golden_solstice_ring = Un anillo encantado que personifica el esp\u00edritu del solsticio. Su \
  reluciente lustre dorado brilla m\u00e1s fuerte durante los meses de verano.

f.grand_solstice_ring = Un magn\u00edfico anillo encantado que personifica el esp\u00edritu del \
  solsticio. Su superficie parece cambiar de color con el tiempo, y algunas veces se siente \
  caliente y otras se siente fr\u00edo al tacto.

f.somnambulists_totem = Un objeto ordinario con una textura y peso \u00fanicos, el resultado de \
  haber sido parcialmente digerido por un Sloombargo.

f.slime_trinket = Un curioso c\u00edrculo cubierto con slimes calcificados.

f.misplaced_promissory_note = Un viejo documento que promete pagar una cantidad en una fecha de \
  anta\u00f1o. Otorga Defensa Normal y aumenta Defensa con menor vida.


# Alchemy orbs
#...................................................................................................

f.flawed_orb = Un elemento raro, encapsulado, que es utilizado en la transmutaci\u00f3n alqu\u00ed\
  mica. Aunque es imperfecto, este orbe sigue siendo \u00fatil en la fabricaci\u00f3n de art\u00edculos de baja potencia.

f.simple_orb = Un elemento raro, encapsulado, que es utilizado en la transmutaci\u00f3n alqu\u00edmica. Aunque no est\u00e1 \
  refinado, este orbe se puede usar para manufacturar art\u00edculos m\u00e1s poderosos.

f.advanced_orb = Un elemento raro, encapsulado, que es utilizado en la transmutaci\u00f3n alqu\u00ed\
  mica. Aunque es excepcional y se puede usar para manufacturar art\u00edculos muy poderosos.

f.elite_orb = Un elemento raro, encapsulado, que es utilizado en la transmutaci\u00f3n alqu\u00ed\
  mica. Los orbes como este son usados por los caballeros \u00e9lite para manufacturar art\u00ed\
  culos de calidad y poder excepcionales.

f.eternal_orb = Un elemento raro, encapsulado, que es utilizado en la transmutaci\u00f3n alqu\u00ed\
  mica. Este orbe es muy apreciado por los caballeros m\u00e1s poderosos y es usado para \
  manufacturar art\u00edculos de extraordinario poder.


# Fire crystals
#...................................................................................................

f.cracked_crystal = Una rara formaci\u00f3n cristalizada del fuego que se usa para forjar \
  niveles m\u00e1s altos de las armas y el equipo. Aunque est\u00e1 agrietado, a\u00fan brilla \
  aunque levemente.

f.dim_crystal = Una rara formaci\u00f3n cristalizada del fuego que se usa para forjar niveles m\u00e1\
  s altos de las armas y el equipo. El fuego que lleva dentro parpadea como una peque\u00f1a vela.

f.warm_crystal = Una rara formaci\u00f3n cristalizada del fuego que se usa para forjar niveles \
  m\u00e1s altos de las armas y el equipo. El fuego que lleva dentro quema lo suficientemente \
  fuerte para sentirse caliente al tacto.

f.glowing_crystal = Una rara formaci\u00f3n cristalizada del fuego que se usa para forjar \
  niveles m\u00e1s altos de las armas y el equipo. El fuego que lleva dentro es lo \
  suficientemente brillante para iluminar una habitaci\u00f3n oscura.

f.shining_crystal = Una rara formaci\u00f3n cristalizada del fuego que se usa para forjar \
  niveles m\u00e1s altos de las armas y el equipo. El fuego que lleva dentro quema como una \
  estrella brillante en el cielo estrellado.

f.radiant_crystal = Una rara formaci\u00f3n cristalizada del fuego que se usa para forjar \
  niveles m\u00e1s altos de las armas y el equipo. El fuego que lleva dentro es salvaje y \
  misterioso, m\u00e1s brillante que cualquier fuego natural.


# Material names
#...................................................................................................

f.ancient_shell = Un fragmento de un resiliente caparaz\u00f3n de Tortodrone. Se rumorea que si \
  se duerme sobre el caparaz\u00f3n de un Tortodrone, se puede sentir la sutil vibraci\u00f3n \
  que llama a estos poderosos seres hacia el destino final en la Gran Migraci\u00f3n.

f.beast_scale = Una escama relativamente intacta de una criatura de los Mecanismos.

f.binding_essence = Un extra\u00f1o y vil reactivo del que se piensa que fue controlado por los \
  Apocrea para construir sus estructuras. Una vez que te llega a la piel parece que nunca se \
  puede lavar. No, debe hacerlo, simplemente necesitas tallar m\u00e1s fuerte. M\u00e1s fuerte, si...

f.blast_powder = Un peligroso producto resultado de la producci\u00f3n de criaturas org\u00e1\
  nicas con base en fuego. A los Gremlins les gusta usarlo para explotar cosas.

f.blaze_pepper = Deliciosa especia que almacenan las bestias de los Mecanismos en preparaci\u00f3\
  n de un invierno que nunca llega En su forma de polvo, tiene el terrible h\u00e1bito de \
  pegarse absolutamente a todo.

f.blighted_bone = Un apestoso hueso que ha visto mejores d\u00edas, y que tambi\u00e9n ha visto \
  mejores caballeros.

f.blue_shard = Un trozo de Moonstone que es demasiado peque\u00f1o para usarse en la creaci\u00f3\
  n de portales, pero que es muy \u00fatil en la alquimia.

f.brimstone = Un apestoso, sombr\u00edo y sulf\u00farico fragmento que se encuentra com\u00fanmente en el Underworld.

f.book_of_dark_rituals = Un antiguo grimorio, lleno de indecibles ritos arcanos. Al igual que \
  cualquier tomo maldito, es posible que haya alg\u00fan individuo retorcido por ah\u00ed que \
  lo quiere para fines extremadamente nefastos. Procede con precauci\u00f3n.

f.bottomless_stocking = Una rasgadura interdimensional en la lanuda tela de esta calceta \
  engulle cualquier art\u00edculo que se ponga dentro. Absorbi\u00f3 hasta las costuras.

f.bronze_bolt = Sencillo tornillo de bronce que se encuentra por los Mecanismos.

f.brute_core = Trozo azul y pringoso de un rival gelatinoso especialmente fuerte.

f.bushy_tail = Un esp\u00e9cimen particularmente intacto de la cola de una bestia de los \
  Mecanismos.

f.celestial_ore = Un metal muy raro de gran poder, del que se dice que viene de los cielos. A \
  menudo se desperdicia en coronas o joyer\u00eda para la realeza Slime.

f.chroma_tear = Una l\u00e1grima cristalizada de Chromalisk apropiada como lente para ajustar \
  armas o para corregir la miop\u00eda.

f.cooling_cell = Peque\u00f1o dispositivo que poseen las m\u00e1quinas complejas para evitar el \
  sobrecalentamiento. Tambi\u00e9n viene bien tenerlo en tu bolsillo en los d\u00edas muy calurosos.

f.corrosive_acid = Una substancia c\u00e1ustica caracter\u00edstica de las criaturas \
  corrosivas.

f.crest_of_ur = Un escudo de la olvidada Legi\u00f3n de Ur, de la que una banda de guerreros \
  demonio \u00e9lite una vez dijo que hab\u00eda conquistado el Inframundo. Quienquiera que la \
  sostenga puede escuchar vagamente el sonido de los tambores y pisadas de pezu\u00f1as.

f.crimsonite_shard = Un fragmento de Crimsonite demasiado peque\u00f1o para usarse en los \
  portales de energ\u00eda, pero muy \u00fatil para la alquimia.

f.critter_carapace = Trozo quitinoso obtenido de una criatura de los Mecanismos. Se conserva \
  sorprendentemente bien.

f.cursed_idol = Una peque\u00f1a figura de piedra labrada en forma de uno de los miles de \
  demonios de Underworld. El sombr\u00edo color de su superficie parece moverse como el humo.

f.dark_ember = Una mota de energ\u00eda ardiente rescatada de la sala del trono del Lord \
  Vanaduke. Arde lentamente con una siniestra intensidad, creando un trance casi hipn\u00f3tico \
  cuando se le contempla durante cualquier periodo de tiempo.

f.dark_matter_shard = Un fragmento de Dark Matter demasiado peque\u00f1o para usarse en los \
  portales de energ\u00eda, pero muy \u00fatil para la alquimia.

f.dark_shard = Un trozo de Dark Matter que es demasiado peque\u00f1o para usarse en la creaci\u00f3\
  n de portales, pero que es muy \u00fatil en la alquimia.

f.dead_gold = Una moneda que se coloca en las manos de los muertos antes de enterrarlos, lo que \
  les otorga el costo del pasaje para el largo camino que les espera.

f.dragon_scale = Una escama blindada creada de lo que se pensaba que era una criatura extinta. \
  Refleja la luz con un lustre de otro mundo.

f.drake_scale = Una s\u00f3lida escama que ha sido arrancada de una brutal bestia.

f.driftwood = Peculiar trozo de madera que no se queda en su sitio.

f.ecto_drop = Trozo de ectoplasma obtenido de un poco colaborador Undead. Tiene un desagradable \
  color verde.

f.enamorock = Una piedra extra\u00f1a que con solo sostenerla hace que te llenes de la mayor \
  ternura y cari\u00f1o.

f.everfrost = Un peque\u00f1o trozo de cristales de hielo que aparenta nunca derretirse, a\u00fa\
  n si es expuesta directamente al calor.

f.fiendglyph = Un fragmento de un Fiendish ID Card. Combinar cinco glifos diferentes para hacer \
  un Fiendish ID Card te permite abrir un Portal Siniestro en la Arboleda Ancestral.

f.fiend_portal_key = Usar esto te permite abrir y pasar por el Portal Siniestro hacia la \
  Arboleda Ancestral.

f.fine_fabric = Trozo de tejido tupido, arrancado de un morador de los Mecanismos.

f.flame_soul = Una poderosa esencia que fue dejada por una criatura que falleci\u00f3 durante \
  una cegadora y rugiente furia.

f.forbidden_fruit = Un bocado pecaminoso que aprecian los demonios hambrientos.

f.force_dynamo = Interesante dispositivo que parece generar energ\u00eda de la nada.

f.frayed_fabric = Son los restos de los ropajes de uno de los moradores de los Mecanismos. \
  Seguramente puede reciclarse.

f.frost_gel = Una gota de bazofia enfriada recolectada de un fresco cliente de los Mecanismos.

f.fuel_canister = Peque\u00f1o recept\u00e1culo usado en su momento para albergar el \
  combustible de una compleja m\u00e1quina.

f.ghost_bell = Peque\u00f1o cencerro plateado que llevan los fantasmas considerados para \
  alertar a los vivos de que andan cerca.

f.gel_core = Trozo viscoso del tama\u00f1o de un pu\u00f1o obtenido de un gelatinoso monstruo.

f.gel_drop = Gota de baba proveniente de un gelatinoso. A\u00fan tiembla.

f.grave_soil = Pu\u00f1ado de tierra recogido de una cripta siniestra. Siempre se siente fr\u00eda al tacto.

f.green_shard = Un trozo de Valestone que es demasiado peque\u00f1o para usarse en la creaci\u00f3\
  n de portales, pero que es muy \u00fatil en la alquimia.

f.gremlin_gizmo = Extra\u00f1o dispositivo que se usa en la maquinaria de los Gremlins. Tiene \
  inscrito un aviso que desaconseja exponerlo a la luz directa del sol o sumergirlo en agua.

f.gremlonium = Un compuesto muy avanzado creado por ingenieros gremlin para alimentar sus m\u00e1quinas m\u00e1\
  s tortuosas. Constantemente emite un inquietante silbido.

f.hailstone = Una peque\u00f1a roca que siempre se siente un poco fr\u00eda al tacto, Es \
  excelente para enfriar las bebidas sin diluir su sabor.

f.heavy_gear = Una pesada armadura que en otro tiempo ayudo en la operaci\u00f3n de una enorme m\u00e1quina.

f.indestructible_giftwrap = Los regalos envueltos en esta mordaza Grinchlin nunca m\u00e1s se \
  pueden abrir. Se puede contar con los Grinchlins para arruinar los servicios de envoltura de \
  regalos gratuitos para todos.

f.iron_gear = Componente met\u00e1lico que fue parte de un artilugio complejo.

f.ironwood = Le\u00f1o impoluto de una de las sustancias m\u00e1s duras conocidas por los \
  Spiral Knights.

f.jelly_glue = Un viscoso compuesto desarrollado por Biotechs, que permite el estudio de las \
  criaturas viscosas. Cuando se mezcla con materia slime y jelly, permite moldearlo sin que \
  pierda su forma. Aunque se reserva para prop\u00f3sitos cient\u00edficos, el proceso \
  generalmente se considera como 'sumamente divertido'.

f.kat_tribe_fetish = Un deshilachado fetiche de la ya extinta Tribu Kat, los feroces guerreros \
  felinos responsables de la destrucci\u00f3n de la Owlites y su prestigiosa Academia Superior \
  de Magicks. Los fetiches se llevaron a la batalla por los guerreros Kat y se dice que trae \
  buena suerte a pesar de la mala suerte de la Tribu Kat misma.

f.light_shard = Un trozo de Luminite  que es demasiado peque\u00f1o para usarse en la creaci\u00f3\
  n de portales, pero que es muy \u00fatil en la alquimia.

f.luminite_shard = Un fragmento de Luminite demasiado peque\u00f1o para usarse en los portales \
  de energ\u00eda, pero muy \u00fatil para la alquimia.

f.lump_coal = Un regalo Grinchlin para aquellos que se han portado bien o se han portado mal. \
  Los Grinchlins ofrecen igualdad de oportunidades para ser aguafiestas.

f.maidens_tear = Una joya sagrada muy  apreciada por los caballeros Almirian. Un regalo de su \
  amada para mantenerlos a salvo en la batalla.

f.meteor_mote = Una peque\u00f1a pieza de un extra\u00f1o material del que se dice que ha ca\u00ed\
  do de los cielos. Los Gremlins lo usan com\u00fanmente para construir fuentes de poder.

f.miracloth = Trozo de un tejido sublimemente fino.

f.mod_calibrator = Este complicado artefacto fue construido especialmente para calibrar mods y \
  no debe ser confundido con un Calibrator Mod, el cual modifica calibradores. Este es un error \
  com\u00fan.

f.monster_bone = Hueso intacto de una bestia ya muerta.

f.moonstone_shard = Un fragmento de Moonstone demasiado peque\u00f1o para usarse en los \
  portales de energ\u00eda, pero muy \u00fatil para la alquimia.

f.mug_misery = Un tarro maldito que solo una verdadera alma malvada puede utilizar. Se dice que \
  aquellos que la posean llevar\u00e1n la mala suerte a quienes los rodean.

f.nightmare_mane = Un abrigo de piel gruesa tomada de un Snarbolax. Cada fibra aparenta rizarse \
  como si la vida siguiera fluyendo.

f.nightshade = Una peligrosa hierba que no es saludable  mayor\u00eda de las bestias, pero es \
  muy sabrosa para una abundante variedad de criaturas t\u00f3xicas.

f.obsidian_shard = Una esquirla de piedra antinatural negro azabache. Al sostenerla llena tu \
  mente con im\u00e1genes de una costa distante donde las olas se estrellan contra rocas que \
  parecen retorcerse en las fr\u00edas aguas.

f.owlite_feather = Peque\u00f1a pluma obtenida de un Owlite, la supuesta raza m\u00edtica de p\u00e1jaros m\u00e1gicos.

f.perfect_snowball = Una bola de nieve de una perfecci\u00f3n casi m\u00edtica. Aunque pide a \
  gritos que la lancen a la cabeza de alguien, es mejor que la uses en experimentos de \
  alquimia.

f.perplexing_element = Un metal raro recuperado de una monta\u00f1a destruida en lo profundo \
  del reino de Apocrea. Bajo el microscopio revela tener una geometr\u00eda imposible. Tal vez \
  un estudio m\u00e1s dedicado, libre de las distracciones del mundo, podr\u00eda revelar sus secretos.

f.phial_phear = Un vial de cristal que contiene una peque\u00f1a dosis de phearium, un \
  compuesto qu\u00edmico que induce p\u00e1nico incluso a quienes llegan tan solo a olerlo.

f.philoso_feather = Una enorme pluma gris obtenida del mayor de los magos Owlite.

f.plague_essence = Una poderosa esencia que ha sido dejada cuando una criatura que ha perecido \
  de una enfermedad particularmente p\u00fatrida.

f.plasma_cell = Sorprendente fuente de plasma de alta tecnolog\u00eda que puede encandilar con \
  su ciencia.

f.power_cell = Peque\u00f1o dispositivo usado como fuente de energ\u00eda de m\u00e1quinas complejas.

f.primal_ore = Un extraordinario metal imbuido con un salvaje esp\u00edritu agreste.

f.punkin_sprout = Una peque\u00f1a ramita capaz de crecer y convertirse en una gran calabaza.

f.razor_ribbon = Recuerda: cuando manipules regalos Grinchlin, siempre debes vestir tus \
  guanteletes de malla forjada.

f.reaper_rib = Un hueso te\u00f1ido de negro por la perversidad de su antiguo poseedor.

f.red_shard = Un trozo de Crimsonite que es demasiado peque\u00f1o para usarse en la creaci\u00f3\
  n de portales, pero que es muy \u00fatil en la alquimia.

f.redwood = Un resistente trozo de madera fina sin acabado. Se suele usar en la producci\u00f3n de armarios.

f.rock_salt = Una peque\u00f1a cantidad de mineral de los Mecanismos que est\u00e1 imbuido de \
  absolutamente nada. Se acerca \u00e1vidamente a las esencias y sabores cercanos, haci\u00e9ndolo una parte b\u00e1sica en la cocina, adem\u00e1s de ser la perdici\u00f3\
  n de los gelatinosos en todas partes.

f.rocket_sprocket = Una s\u00f3lida y resistente rueda dentada usada por maquinarias que \
  disparan proyectiles.

f.rocky_core = Una deliciosa golosina pegajosa con una impenetrable c\u00e1scara rocosa. M\u00e1\
  s de un diente se ha roto en los caballeros que han intentado llegar al pringoso interior.

f.royal_core = Un trozo que rezuma un dulce olor recolectado de un esp\u00e9cimen \
  particularmente noble de viscoso.

f.royal_skewer = Una dentada y afilada p\u00faa de uno de los m\u00e1s poderosos viscosos en \
  Cradle. Una vez retirado del viscoso se vuelve fr\u00e1gil hasta que finalmente se convierte \
  en polvo.

f.schemer_scrap = Fragmento de un modelo utilizado por estafadores gremlin para construir sus \
  engendros mec\u00e1nicos. Con bastantes de ellos y un poco de cinta, \u00a1podr\u00edas \
  construir tu mismo una m\u00e1quina met\u00e1lica mortal!

f.scrap_metal = Trozo de metal desechado que puede recibir m\u00faltiples usos.

f.seerus_fragment_1 = Un fragmento fracturado de la m\u00e1scara que alguna vez visti\u00f3 el \
  Warmaster Seerus, recobrado del asedio a su Gran Arsenal.

f.seerus_fragment_2 = Un fragmento imperfecto de la m\u00e1scara que alguna vez visti\u00f3 el \
  Warmaster Seerus, recobrado del asedio a su Gran Arsenal.

f.seerus_fragment_3 = Un fragmento perfecto de la m\u00e1scara que alguna vez visti\u00f3 el \
  Warmaster Seerus, recobrado del asedio a su Gran Arsenal.

f.shadow_steel = Un extraordinario metal imbuido con la sigilosa oscuridad del infierno.

f.sharp_fang = Premolar especialmente puntiagudo. \u00bfO a lo mejor es un canino?

f.silver_coil = Mecanismo electromagn\u00e9tico hecho con un metal conductor.

f.silverweave = Trozo de una tela sobria entretejida con metal precioso. Es ostentosa y de buen \
  gusto, pero ofrece gran protecci\u00f3n.

f.sinful_brew = Una bebida da\u00f1ina favorecida por todos los demonios. A pesar de su \
  prevalencia, ha sido oficialmente proscrita en el Inframundo como un ardid de mercadeo.

f.snarbostuffing = Un denso y esponjoso relleno hecho de un pol\u00edmero especial que no se \
  degrada cuando se expone a la piel maldita del Snarbolax. Es perfecto para la creaci\u00f3n \
  de trofeos o adorables y malditos juguetes de peluche.

f.soul_dust = Es el polvo de aquellos que nos han dejado. Est\u00e1 por ver si a\u00fan retiene \
  la pizca de alg\u00fan alma.

f.spark_plug = Un peque\u00f1o componente mec\u00e1nico que realmente hace que funcione el \
  motor de un constructor.

f.spoiled_treat = Un terrible dolor de panza le espera a aquellos que se atiborran con las f\u00e9\
  tidas viandas del festival de invierno pasado.

f.storm_chaser = Un raro elemento que se ha encontrado sobrevolando las nubes de tormenta. Su \
  zumbido el\u00e9ctrico crea un coro casi mel\u00f3dico que se puede o\u00edr casi \
  imperceptiblemente entre cada trueno.

f.sulfur = Fragmento sulf\u00farico, oloroso y estigio que se suele encontrar en Underworld.

f.static_clinger = Un filamento de energ\u00eda latente que flota a trav\u00e9s de los Mecanismos, peg\u00e1\
  ndose frecuentemente al cabello y la ropa.  Es demasiado grande para poder destilarse \
  apropiadamente como Energ\u00eda, pero es muy \u00fatil en la alquimia.

f.supply_pack_compact = Un paquete con \u00fatiles suministros muy valorado por los caballeros \
  de los equipos de investigaci\u00f3n Spiral que trabajan dentro de los Mecanismos. Este \
  paquete compacto tiene suficientes suministros para durarle una semana a un caballero.

f.supply_deluxe_compact = Un paquete con \u00fatiles suministros muy valorado por los \
  caballeros de los equipos de investigaci\u00f3n Spiral que trabajan dentro de los Mecanismos. \
  Este paquete compacto tiene suficientes suministros para durarle una semana a un escuadr\u00f3n completo.

f.supply_standard_compact = Un paquete con \u00fatiles suministros muy valorado por los \
  caballeros de los equipos de investigaci\u00f3n Spiral que trabajan dentro de los Mecanismos. \
  Este paquete compacto tiene suficientes suministros para durarle una semana a unos cuantos \
  caballeros.

f.sun_silver = Un extraordinario metal imbuido con la radiante luz del cielo.

f.swordstone = Trozo de roca natural perfecta para afilar cualquier hoja.

f.thunderball = Esfera de electricidad pura que se suele encontrar en el lecho marino.

f.torchstone = Una peque\u00f1a roca que arde constantemente. Los Gremlins que patrullan las C\u00e1maras de Congelaci\u00f3\
  n la usan ocasionalmente para calentarse las manos.

f.toxic_core = Un s\u00f3lido y palpitante trozo que supura virulencia.

f.trojan_horseshoe = Una herradura negro azabache. Aparenta ser relativamente inofensiva.

f.unstable_core = Un peligroso trozo arrancado de un fulminante enemigo. Zumba amenazadormente.

f.valestone_shard = Un fragmento de Valestone demasiado peque\u00f1o para usarse en los \
  portales de energ\u00eda, pero muy \u00fatil para la alquimia.

f.vile_seal = Un peque\u00f1o fragmento de un antiguo pergamino imbuido con magia negra. Se \
  cree que otorga poder a aquellos de esp\u00edritu malvado.

f.volcanic_iron = Un extraordinario metal imbuido con la abrasadora energ\u00eda del magma.

f.volt_oil = Una resbalosa substancia que siempre tiene una peque\u00f1a carga el\u00e9ctrica.

f.warp_dust = Un ligero polvo que ha sido dejado por una criatura que viaja a velocidad incre\u00ed\
  ble. Sabe delicioso con salsa.

f.waste_module = Un peque\u00f1o recept\u00e1culo que una vez recolect\u00f3 desperdicios de un \
  aparato construido para sembrar el caos. Ahora solamente apesta.

f.wicked_idol = Una de las muchas estatuillas que llevan los demonios como un medio de ganarse \
  el favor de sus dioses oscuros. Las m\u00e1s valiosas son 'MIBE' (mantenido impecable en la \
  bujeta execrable).

f.wicked_whisker = Un bigote obtenido del gran h\u00e9roe de la Tribu Kat, Margrel. \
  Tradicionalmente usados como protecci\u00f3n de la magia Owlite pero actualmente representa \
  el triunfo de las artes m\u00e1gicas benignas sobre el mal.

f.zee_core = Una masa acre tomada de un viscoso asaltante. Su aroma es un excelente remedio \
  contra el insomnio as\u00ed como contra resfriados nocturnos.

