f.omegaward = Las pulsantes placas elementales de este escudo reaccionan instant\u00e1neamente \
  a los climas adversos, protegi\u00e9ndote hasta del fr\u00edo o calor m\u00e1s extremo.

f.owlite_shield = Un resguardo de madera tallada con la cruda imagen de un Owlite perdido mucho \
  tiempo atr\u00e1s.

f.plate_shield = Un pesado escudo de hierro perfecto para desviar impactos que de otra manera \
