# Gloaming Wildwoods

s.wildwoods_start = G\u00F6rev: Gloaming Wildwoods
m.wildwoods_start = Ben \u0130stihbarat Ajan\u0131 Kora. Bu orman\u0131n bir yerinde, Alfa Ekibi taraf\u0131ndan b\u0131rak\u0131lm\u0131\u015F \
bir Ka\u015Fif Mod\u00FCl\u00FC tespit ettik. G\u00F6reviniz, bu mod\u00FCl\u00FCn yerini bulmak ve onu geri getirmektir. \n\n\
\
Bu orman, ge\u00E7mi\u015Fte birliklerimiz i\u00E7in \u00F6l\u00FCmc\u00FCl olmu\u015F vah\u015Fi hayvan s\u00FCr\u00FClerine ev sahipli\u011Fi yap\u0131yor. \
Bu nedenle Tech \u015E\u00F6valyeleri, b\u00F6lgenin d\u00F6rt bir yan\u0131na Canavar \u00C7anlar\u0131 yerle\u015Ftirdiler.  \u00C7anlara vurunca, \
olu\u015Fturduklar\u0131 ses dalgas\u0131na yakalanan her t\u00FCrl\u00FC canavar sersemleyecektir. \n\n\
\
Ke\u015Fif \u015E\u00F6valyeleri'nin, bu ormanda daha \u00F6nce hi\u00E7 g\u00F6rmedi\u011Fimiz t\u00FCrden korkun\u00E7 bir canavar\u0131n dola\u015Ft\u0131\u011F\u0131na \
dair rapor verdiklerini bilmenizi isteriz.  'Snarbolax' olarak bilinen bu varl\u0131k, di\u015F ve pen\u00E7elerden olu\u015Fan bir g\u00F6lge olarak \
ortaya \u00E7\u0131kar ve silahlar\u0131m\u0131z ona kar\u015F\u0131 tamamen etkisiz gibidir. Onunla kar\u015F\u0131la\u015F\u0131rsan\u0131z, \
m\u00FCmk\u00FCn olan en k\u0131sa s\u00FCrede ka\u00E7man\u0131n bir yolunu bulmaya \u00E7al\u0131\u015F\u0131n. \n\n\
\
Bol \u015Fans!


