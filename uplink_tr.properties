s.royal_start = G\u00F6rev: Royal Jelly Palace
m.royal_start = Ben \u0130stihbarat Ajan\u0131 Kora. Bu saray\u0131n i\u00E7inde, Alfa Ekibi'ne ait bir Ka\u015Fif Mod\u00FCl\u00FC daha tespit ettik. \
G\u00F6reviniz, bu mod\u00FCl\u00FCn yerini bulmak ve onu geri getirmektir. \n\n\
\
Royal Jelly Palace tuhaf bir yer.  Buras\u0131, bal\u00E7\u0131k yarat\u0131klar\u0131n yeniden i\u015Flev kazand\u0131rarak kendi \
yap\u0131\u015F yap\u0131\u015F olmu\u015F aristokrasi mensuplar\u0131 i\u00E7in bir konut haline getirdikleri bir t\u00FCr kale gibi g\u00F6r\u00FCn\u00FCyor.  'Royal Jelly' olarak bilinen \
bu soylu bal\u00E7\u0131klar\u0131n, say\u0131s\u0131z sad\u0131k tebaalar\u0131n\u0131, demir bir yumruk \u015Feklindeki uzuvlar\u0131yla sert bir bi\u00E7imde y\u00F6nettikleri s\u00F6yleniyor. \n\n\
\
Elde etti\u011Fimiz istihbarat, mod\u00FCl\u00FCn \u00E7ok yo\u011Fun bir bal\u00E7\u0131k k\u00FCmelenmesinin yak\u0131n\u0131nda bir yerde bulundu\u011Funu g\u00F6steriyor; \
dolay\u0131s\u0131yla buran\u0131n 'Royal Jelly'nin taht odas\u0131 olabilece\u011Fini d\u00FC\u015F\u00FCnmek mant\u0131kl\u0131. E\u011Fer durum buysa, zorlu bir m\u00FCcadeleye haz\u0131rl\u0131kl\u0131 olun; \
'Royal Jelly'ler \u00E7abuk \u00F6fkelenirler ve devasa a\u011F\u0131rl\u0131klar\u0131n\u0131 etrafa savurmaktan b\u00FCy\u00FCk keyif al\u0131rlar. En iyi se\u00E7enek \
onlar\u0131n do\u011Fal yenilenme yeteneklerini bask\u0131laman\u0131n bir yolunu bulmak olacakt\u0131r. \n\n\
\
Bol \u015Fans!


# Ironclaw Munitions Factory

s.ironclaw_start = G\u00F6rev: Ironclaw Munitions Factory
m.ironclaw_start = Ben \u0130stihbarat Ajan\u0131 Kora. Bu tesisten, gremlinlerin Haven'\u0131 yok etmek i\u00E7in bir t\u00FCr silah in\u015Fa \
ettiklerini g\u00F6steren mesajlar ele ge\u00E7irdik! G\u00F6reviniz; tesise \
s\u0131zmak, bu silah\u0131 imha etmek ve Haven'\u0131 y\u0131k\u0131mdan kurtarmakt\u0131r! \n\n\
\
Yaln\u0131zca 'Project Roarmulus' ad\u0131yla bilinen bu yap\u0131n\u0131n, standart sald\u0131r\u0131lardan etkilenmedi\u011Fi s\u00F6yleniyor. Kulland\u0131\u011F\u0131 z\u0131rh \
her neyse onu k\u0131rman\u0131n bir yolunu bulman\u0131z gerekecek.  \u0130stihbarat\u0131m\u0131z bu silah\u0131n \
tesisin derinliklerinde bulundu\u011Funa i\u015Faret ediyor. \n\n\
\
Ancak ona ula\u015Fmak kolay olmayacak. Gremlinlerin i\u015F g\u00FCvenli\u011Fine pek ald\u0131r\u0131\u015F etmediklerini g\u00F6receksiniz; \
zira etrafta her an her y\u00F6ne ate\u015Flenen canl\u0131 roketler u\u00E7u\u015Fuyor gibi duruyor. Ancak, \
test ortamlar\u0131nda kar\u015F\u0131la\u015Faca\u011F\u0131n\u0131z 'Kutuplu Duvarlar' \u00FCzerinize gelen roketleri engellemek i\u00E7in \
kullan\u0131labilir. Bunlar\u0131 a\u00E7\u0131p kapatmak i\u00E7in mor ve alt\u0131n renkli \u00E7arklar aray\u0131n. \n\n\
\
Ayr\u0131ca fabrikada bir yerlerde Alfa Ekibi'ne ait ba\u015Fka bir Ka\u015Fif Mod\u00FCl\u00FC daha tespit ettik. Yapabiliyorsan\u0131z \
onu mutlaka ele ge\u00E7irin! \n\n\
\
Bol \u015Fans!


# Firestorm Citadel

s.firestorm_start = G\u00F6rev: Firestorm Citadel
m.firestorm_start = Ben \u0130stihbarat Ajan\u0131 Kora. Bulundu\u011Funuz derinlikte ileti\u015Fim kurmak zor; umar\u0131m bu mesaj size ula\u015F\u0131r. \
\u015Eu anda, bu gezegenin koleksiyonuna katmaktan ho\u015Fland\u0131\u011F\u0131 t\u00FCrden, kadim bir kale olan Firestorm Citadel'desiniz. \
Buras\u0131, Clockworks'\u00FCn son derece tehlikeli bir k\u0131sm\u0131; do\u011Fru ekipman ve yetenekli bir ekip olmadan burada uzun s\u00FCre dayanamazs\u0131n\u0131z. \n\n\
\
Alfa Ekibi'nin ke\u015Fif faaliyetinden bir kal\u0131nt\u0131n\u0131n, bu kalenin taht odas\u0131nda bulundu\u011Funa i\u015Faret eden zay\u0131f bir sinyal tespit ettik. \
Bu kal\u0131nt\u0131y\u0131 ele ge\u00E7irmenize ihtiyac\u0131m\u0131z var; zira bu, onlar\u0131n \u015Fu an nerede olduklar\u0131n\u0131 ke\u015Ffetmek \
ad\u0131na de\u011Ferli bir ipucu olabilir. \n\n\
\
Size yalan s\u00F6ylemeyece\u011Fim; bu g\u00F6revi \u00FCstlenen hi\u00E7bir ekip kaleden canl\u0131 \u00E7\u0131kamad\u0131. Ku\u015Fkusuz \
g\u00F6rm\u00FC\u015F oldu\u011Funuz gibi buras\u0131 do\u011Fa\u00FCst\u00FC bir ate\u015Fle yan\u0131p tutu\u015Fuyor ve her bir koridorda yine ayn\u0131 derecede deh\u015Fet \
verici \u015Feyler kol geziyor. \u015Eimdi geri d\u00F6n\u00FCp ate\u015Fe dayan\u0131kl\u0131 ekipmanlar haz\u0131rlaman\u0131n tam zaman\u0131 olabilir. \
Ate\u015Fle imtihan\u0131n bedeli yanmakt\u0131r. \n\n\
\
Bol \u015Fans!